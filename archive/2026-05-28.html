<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年5月29日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年5月29日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"政府職員向け生成AI『源内』が大規模実証開始、10万人が利用可能に","summary":"デジタル庁は政府職員向けの生成AI利用環境『源内』の大規模実証実験を開始し、約10万人の政府職員が利用可能となりました。このAIは政府専用の閉域網で運用され、法制度調査や国会答弁作成支援などを通じて業務効率化を目指します。すでにデジタル庁内では約8割の職員が効果を実感しており、松本尚デジタル相も自身の答弁原案作成に活用しているとのことです。この動きは、政府機関におけるAI導入の加速と、それに伴う業務プロセスの変革を示すものであり、AI開発者にとっては政府向けソリューションの需要増加を示唆します。","source":"ITmedia NEWS","url":"https://www.itmedia.co.jp/news/articles/2605/28/news162.html","impact":"high","tags":["政府AI","業務効率化","大規模実証"]},{"title":"Google I/O 2026で『Gemini 3.5 Flash』発表、AIエージェント『Gemini Spark』も登場","summary":"Googleは『Google I/O 2026』で、AIモデル『Gemini』の最新版『Gemini 3.5 Flash』を発表し、提供を開始しました。さらに、翌月には『Gemini 3.5 Pro』も登場予定です。注目すべきは、個人のGoogleサービスやデータにアクセスし、サードパーティー製ツールも利用可能なパーソナルAIエージェント『Gemini Spark』の発表です。これはAIが自律的に作業を実行する方向性を示しており、開発者にとってはAIエージェントの連携やカスタマイズに関する新たな開発機会が生まれることを意味します。","source":"窓の杜","url":"https://forest.watch.impress.co.jp/docs/news/1802193.html","impact":"high","tags":["Google Gemini","AIエージェント","Google I/O"]},{"title":"OpenAI、選挙対策を本格化しChatGPTにAP通信の開票データ導入とディープフェイク規制法案を支持","summary":"OpenAIは、選挙に関する誤情報やAI生成ディープフェイクへの対策を本格化すると発表しました。具体的には、ChatGPTにAP通信の開票データを導入し、信頼性の高い情報提供を目指すとともに、AI生成ディープフェイクの規制法案を支持する姿勢を示しています。この取り組みは、AI技術の倫理的利用と社会への責任を重視する動きであり、AI開発者にとっては、コンテンツの透明性確保や誤情報対策技術の開発がより重要になることを示唆します。","source":"GIGAZINE","url":"https://gigazine.net/news/20260528-openai-election-information-safeguards/","impact":"medium","tags":["OpenAI","ディープフェイク","選挙対策"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"フォントが悪用されAIが誤認識する『Noroboto攻撃』の概念実証が公開、個人開発者は対策を","summary":"リーガルテック企業Tritiumが『Noroboto』という概念実証を公開しました。これは、フォントファイルを悪用して、人間が見る文字とAIが読み取る文字を食い違わせる攻撃です。AI採点や文書処理プロダクトを開発する個人開発者にとって、信頼できない入力としてフォントを扱う必要性が生じます。この攻撃は、AIの認識精度に対する新たな脅威であり、開発者はAIモデルの堅牢性を高めるための対策や、入力データの検証プロセスの強化が求められます。","source":"note","url":"https://note.com/re_array/n/n262a26569107","impact":"medium","tags":["AIセキュリティ","Noroboto攻撃","フォント悪用"]},{"title":"2026年のインディーハッカーの成功戦略：AI活用、ニッチフォーカス、戦略的ディストリビューションが鍵","summary":"2026年におけるインディーハッカーの成功には、AIの活用、ニッチな市場への集中、そして戦略的なディストリビューションが不可欠とされています。AIツールがMVPやAPI、UIコンポーネントなどを生成できるようになり、コーディング自体がボトルネックではなくなりました。成功する創業者たちは、ディストリビューション、ポジショニング、ワークフローデザイン、データアドバンテージに注力しています。特に、AIエージェントが従来のSaaSに取って代わり、自動化されたワークフローを求めるユーザーが増えている傾向があり、開発者はこの変化に対応したプロダクト設計が重要です。","source":"Rethink Lab","url":"https://rethinklab.org/blog/indie-hacker-playbook-2026/","impact":"high","tags":["インディーハッカー","AI活用","成功戦略"]},{"title":"ポータブルスタンドアロンサンプラー『SXC-1』発売、音楽制作の『民主化』を推進","summary":"カシオは、クリエイターエコノミー事業の新製品として、誰でも手軽に楽曲制作・演奏ができるポータブルスタンドアロンサンプラー『SXC-1』を発売しました。この製品は、音楽知識や楽器経験がなくても、面白い音やかっこいい音を組み合わせて音楽を創作・楽しめることをコンセプトにしています。音楽制作の『民主化』を目指すこの動きは、より多くの人々がクリエイティブな活動に参加できる環境を広げるものです。開発者にとっては、このようなツールと連携するアプリケーションやプラットフォームの需要が生まれる可能性があります。","source":"CASIO","url":"https://www.casio.com/jp/news/2026/0528-sxc-1/","impact":"low","tags":["音楽制作","クリエイターエコノミー","サンプラー"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"SUBARU、世界初の『サイクリスト対応歩行者保護エアバッグ』をフォレスターに採用","summary":"SUBARUは、JNCAP『自動車安全性能2025 ファイブスター大賞』を受賞したフォレスターに、世界で初めて『サイクリスト対応歩行者保護エアバッグ』を採用したと発表しました。これは、車両との衝突時に歩行者だけでなくサイクリストの頭部保護にも対応するエアバッグです。通常期間のわずか3分の1という短期間で新技術採用を実現したとのことです。この技術は、自動車の安全技術が歩行者やサイクリストといった交通弱者保護へと進化していることを示し、関連するセンサー技術やAIによる状況認識技術の開発がさらに加速する可能性があります。","source":"株式会社SUBARU","url":"https://www.subaru.co.jp/news/2026_05_28_153707","impact":"medium","tags":["自動車安全","エアバッグ","SUBARU"]},{"title":"NTTドコモビジネス、衛星画像データを活用した『自然資本モニタリングソリューション』を提供開始","summary":"NTTドコモビジネスは、NTTグループとバイオームが実証してきた衛星画像データを活用した『植生および生物の広域推定技術』の成果を踏まえ、『自然資本モニタリングソリューション』の提供を開始しました。このソリューションは、指定地域の自然資本の状態を効率的かつ継続的に把握・評価できるもので、現地調査に大きく依存していた現状の課題解決を目指します。これは、環境モニタリングにおけるデータ活用とAI解析の重要性を示しており、地理空間情報処理や環境データ解析技術を開発するエンジニアにとって新たな市場機会を創出するものです。","source":"NTTドコモビジネス","url":"https://www.docomo.biz/news/2026/0528_01.html","impact":"medium","tags":["衛星データ","環境モニタリング","NTTドコモ"]},{"title":"Anker、大容量・難燃仕様の新作ガジェットポーチ『Style Pouch』を発売","summary":"Ankerは、バッグの中で散らかりがちなガジェット類をまとめて収納できる『Style Pouch』を発売しました。25,000mAh級のモバイルバッテリーも収納できる大容量設計に加え、国際的な難燃性規格『UL 94 V-0』に適合した素材を採用しており、万が一の発火時にも燃え広がりにくい安全性の高さが特徴です。AmazonスマイルSALEの対象商品となっており、お得に購入できる機会があります。この製品は、ガジェット利用者の利便性と安全性を向上させるもので、ハードウェア開発者にとっては、周辺アクセサリー市場の動向や安全性への配慮の重要性を示唆します。","source":"GIZMODO","url":"https://www.gizmodo.jp/2026/05/anker-style-pouch-sale.html","impact":"low","tags":["Anker","ガジェット","難燃素材"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
