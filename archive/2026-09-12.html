<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年9月13日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年9月13日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"「ナレコムAI Platform」がOpenAIの次世代モデル「GPT-6 Astra」に対応","summary":"株式会社ナレッジコミュニケーションは、同社の「ナレコムAI Platform」がOpenAIの次世代フロンティアモデル「GPT-6 Astra」に対応したと発表しました。このプラットフォームは、企業が生成AIを安全に運用するための権限管理、IPアドレス制限、利用状況・コスト可視化などの管理機能を提供します。これにより、企業は最新のAIモデルをセキュアかつ効率的に導入・活用できるようになり、開発者は企業向けAIソリューションの構築や運用において、より高度なセキュリティと管理機能の恩恵を受けられます。この対応は、企業のAI導入を強力にサポートし、ビジネスにおけるAI活用の幅を広げるでしょう。","source":"PR TIMES","url":"https://www.prtimes.jp/main/html/rd/p/000000021.000055745.html","impact":"high","tags":["生成AI","LLM","企業AI"]},{"title":"Anthropic CEO、AI開発の減速を業界全体に要求","summary":"米AnthropicのアモデイCEOは、AIの悪用リスクを理由に、業界全体に対してAI開発の減速を促しました。これは、技術の進化に安全性、規制、社会制度、セキュリティなどが追いつくための時間を作ることを目的としています。この呼びかけは、AIの倫理的・社会的な側面への懸念が高まっている現状を反映しており、開発者にとっては、技術的な進歩だけでなく、その社会的影響や安全性についても深く考慮する必要があることを示唆しています。AI開発の方向性や規制の議論に大きな影響を与える可能性があります。","source":"livedoor NEWS","url":"https://news.livedoor.com/article/detail/50676602/","impact":"high","tags":["AI倫理","AI規制","安全性"]},{"title":"企業の生成AI活用で「RAG（検索拡張生成）」の重要性が増大","summary":"企業の生成AI活用が進む中で、「RAG（検索拡張生成）」が注目を集めています。GMO即レスAIの解説によると、RAGは社内ナレッジをAIで解放し、必要な情報をピンポイントに検索・参照することで、計算資源の節約、高速な回答、そして回答の根拠を明示できるという実用的なメリットがあります。これは、LLMが進化しても企業利用でRAGが必要とされる理由として挙げられます。開発者にとっては、RAGの実装スキルが企業向けAIソリューション開発において不可欠となり、より正確で信頼性の高いAIシステムを構築するための重要な技術となるでしょう。","source":"GMO即レスAI","url":"https://ai-prime-strategy.gmo/lp/gmo-ai-rag/?utm_source=youtube&utm_medium=video&utm_campaign=ejp-content&utm_content=gmoairag-20260831","impact":"medium","tags":["RAG","企業AI","LLM活用"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"Go言語製2Dゲームエンジン「Ebitengine」v2.10がリリース","summary":"オープンソースの2Dゲームエンジン「Ebitengine」のバージョン2.10が公開されました。このアップデートでは、macOS、Linux、BSDデスクトップ環境向けのビルドにおいて、Cgo環境への依存が撤廃され、Go単体でのビルドが可能になった点が大きな特徴です。これにより、異なるOS間でのクロスコンパイルが容易になり、個人開発者にとって開発効率が大幅に向上します。また、作成したアプリを別のアプリケーションのエディタ内で実行する仮想化（VM）機能も実装され、AIエージェントによる自動テストなど新たな活用法が期待されます。","source":"Game Makers","url":"https://gamemakers.jp/article/2026/09/11/2049/","impact":"high","tags":["Go言語","ゲーム開発","Ebitengine"]},{"title":"AIコーディングエージェント「Freebuff」で無料の24時間開発環境を構築","summary":"個人開発者がAIコーディングエージェントの無料枠上限に直面する中、完全無料・広告収益モデルの「Freebuff」を活用して「24時間戦えるエージェント」を構築した事例が話題となっています。Freebuffは広告を見ることでAIコーディングモデルを無料で利用でき、CLI、デスクトップアプリ、Web、Cloud、Chatの5つの製品を1つのアカウントで使い分け可能です。この事例は、個人開発者がコストを抑えつつAIを活用した開発を継続するための画期的な方法を示しており、開発者にとってAIツールを最大限に活用するヒントとなるでしょう。","source":"note (code_utahito)","url":"https://note.com/code_utahito/n/n2626e257e10c","impact":"medium","tags":["AIコーディング","個人開発","無料ツール"]},{"title":"「第十四回技術書同人誌博覧会（技書博）」が開催","summary":"技術書をテーマにした同人誌即売会「第十四回技術書同人誌博覧会（技書博）」が2026年9月13日に開催されます。このイベントでは、個人や企業の著者・サークルがプログラミング、AI、データ分析、インフラ、セキュリティなどの知見をまとめた本を持ち寄り、読者と直接交流できる場を提供します。商業出版とは異なる切り口や、現場で得た経験を凝縮した本に出会えることが大きな魅力であり、個人開発者やエンジニアにとって貴重な情報共有と交流の機会となります。新たな技術やニッチな知見を求める開発者にとって、非常に有益なイベントとなるでしょう。","source":"マイナビニュース テックプラス","url":"https://news.mynavi.jp/techplus/article/20260912-2769064/","impact":"medium","tags":["技術書","同人誌","コミュニティ"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"サウジアラビアのテックイベント「LEAP 2026」で150億ドル超の投資発表","summary":"2026年8月31日から9月3日にかけてサウジアラビアで開催されたテックイベント「LEAP 2026」には、20万人超が来場し、人工知能（AI）、クラウドコンピューティング、サイバーセキュリティなどをテーマに総額150億ドルを超える投資、事業立ち上げ、提携が発表されました。特に、Amazon Web Services（AWS）が2026年12月にサウジアラビア初のクラウドサービス提供拠点の開設を発表したことは注目に値します。この大規模な投資は、中東地域のテックエコシステム、特にAI分野の発展を加速させ、グローバルなテック業界の勢力図にも影響を与える可能性があります。","source":"JETRO","url":"https://www.jetro.go.jp/biznews/2026/09/3229b35049386414.html","impact":"high","tags":["中東テック","AI投資","クラウドインフラ"]},{"title":"2026年世界半導体売上高が1兆5552億ドルに、AIデータセンターが牽引","summary":"米調査会社ガートナーは、2026年の世界半導体売上高が2025年比92％増の1兆5552億ドルに達するとの予測を公表しました。この急激な市場拡大は、人工知能（AI）インフラ向け投資の継続と、高帯域幅メモリ（HBM）を中心としたメモリ価格の上昇サイクルが主導しています。特に、メモリ分野は2026年には8373億ドルに急伸し、市場全体の54％を占める見込みです。AIデータセンターの台頭が半導体市場の需要構造を大きく変革しており、半導体関連の開発者や企業にとって、AI向け高性能メモリ技術への注力がますます重要となるでしょう。","source":"ITmedia Alternative Blog","url":"https://blogs.itmedia.co.jp/alternative/2026/09/2026ai.html","impact":"high","tags":["半導体","AIハードウェア","HBM"]},{"title":"次世代エネルギー技術の社会実装が加速、核融合や洋上風力に注目","summary":"2026年9月9日から11日にかけて幕張メッセで開催される「第26回 スマートエネルギー WEEK【秋】」では、日本政府が巨額投資を進める次世代エネルギー技術の最前線が紹介されます。核融合発電、浮体式洋上風力発電、CCUS（CO₂回収・利用・貯留）などが成長戦略・GXの重点分野として推進されており、2030年代の発電実証や商用化を目指す具体的な製品・技術が一堂に集結します。これにより、エネルギー安全保障と脱炭素化を両立する次世代エネルギーの社会実装が加速すると期待されており、関連技術の開発者にとっては、新たなビジネスチャンスや研究開発の機会が拡大するでしょう。","source":"PR TIMES","url":"https://prtimes.jp/main/html/rd/p/000000858.000026158.html","impact":"medium","tags":["次世代エネルギー","脱炭素","GX"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
