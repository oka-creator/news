<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年7月8日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年7月8日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Metaが画像生成AIモデル「ミューズ・イメージ」を公開","summary":"Metaは、InstagramやWhatsAppなどの主要ソーシャルアプリに統合される画像生成AIモデル「ミューズ・イメージ」を発表しました。このモデルにより、ユーザーはテキストプロンプトから画像を生成したり、既存の画像を編集したりできるようになります。生成された画像には不可視の電子透かしが付与され、利用規約違反を防ぐ安全対策も強化されており、AIコンテンツの透明性と安全性が重視されています。これは、MetaがAI技術を大規模ユーザーベースに展開し、クリエイティブな表現を促進する一方で、倫理的課題にも対応しようとする姿勢を示しており、開発者にとっては新たなプラットフォームでのAI活用機会が生まれるでしょう。","source":"株探 (元記事はMetaの発表を引用)","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEKcOHIBUbx7xYvVBB8YYGLxM-QTxuYFfXdjdIXW6Nms3oSr5xMPfKSOXFGRKUEuNRYkAy-l2hMhVHt0xVAkHqHbMQgvGUsfqesLUIXle8TZF3W5eMThD-kIGKXHpz-CD1vHK4=","impact":"high","tags":["画像生成AI","Meta","ソーシャルメディア"]},{"title":"Mistral CEOがクローズドAIモデルへの警鐘を鳴らし、オープンソースの優位性を示唆","summary":"MistralのCEO、アルチュール・マンシュ氏は、クローズドAIモデルが顧客データを蓄積し、企業の業務プロセスを把握する潜在的リスクについて警告しました。同氏は、企業がデータのオープンな保管、AIアクセスルールの自主設定、そして自社学習モデルの構築を進めるべきだと提言しています。関連実験では、ファインチューニングされたオープンウェイトモデルが、特定の金融情報フィルタリングタスクにおいて最良のフロンティアモデルを凌駕し、運用コストを大幅に削減できることが示されました。これは、企業がAI戦略を検討する上で、オープンソースAIのセキュリティとコスト効率の利点を再評価するきっかけとなるでしょう。","source":"アセットアライブ - note","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFDPWA3eOZTdGCsMMJSZ-Cmm5O01hg2hJb9RqVydxkJ8gzSTsKqJv-CTDUx2AYH8s_LeqABL8wSxHWZrCNNtQj4gVcXjq5dpfiXUfYwzBljb84wQJ16_33NrLSFpV9whenVirp8","impact":"medium","tags":["オープンソースAI","企業戦略","データプライバシー"]},{"title":"Google for Educationが「全国教育長サミット 2026」を開催","summary":"Google for Educationは、2026年8月8日にGoogle渋谷オフィスで「全国教育長サミット 2026」を対面形式で開催すると発表しました。このイベントは、自治体教育委員会の教育長らを対象とし、GIGAスクール構想第2期における生成AIの利活用が主要テーマです。講演やパネルディスカッションに加え、GeminiやGoogle NotebookLMの最新機能を紹介する体験セッションを通じて、教育現場での生成AIの具体的な可能性と導入方法が探求されます。教育分野におけるAIの普及と活用を加速させる重要な機会であり、教育コンテンツ開発者やEdTech企業にとって新たなビジネスチャンスとなるでしょう。","source":"ReseMom (元記事はGoogle for Educationの発表を引用)","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHxsTJr66sSn_7jkz-QqS9GFg39kJWM97jsBBnnaJK7_4onGvd4x81VUXr-MOyj_wyBiF2QHsOBvrBDJABdtYpbgDHv62Vsv96ihScrZ2gmcSItF2es2-QHXTqseJXxT1F_8ll5F28iavRuDwqXv1cRSJo=","impact":"medium","tags":["教育AI","Google","GIGAスクール構想"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"個人開発のAI自己分析日記アプリ「よりしろ」がXでの告知で1日で600ダウンロードを記録","summary":"風景写真家である個人開発者の横田裕市氏が手掛けたAI自己分析日記アプリ「よりしろ（Yorishiro）」が、X（旧Twitter）での告知をきっかけに、App Storeのヘルスケア/フィットネスカテゴリで急上昇しました。音声入力の気軽さ、AIによる優しい整理、そして「人に見せるためではなく、自分のために書く」というコンセプトが、ユーザーの内省ニーズに深く合致したと評価されています。この成功は、ニッチなニーズを捉え、ユーザー体験を重視した個人開発アプリが、大規模なマーケティングなしでも大きな反響を呼ぶ可能性を示しています。","source":"PR TIMES","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHN9_LcMeUgVp1SfWhP4ccv9agd4jiL_gtRsZ1WyqCALMS7Cntm-90DcGnG7LXe2y623MUdtEseo_wTCjsLFbWjvCsrqmnEvdzmNJG66aKNxCoBclrbhuutOPfFz_4YQf9EYN1KZx-MXnW7CGR9tdPjj5rGMA=","impact":"medium","tags":["個人開発","AIアプリ","自己分析"]},{"title":"インディーゲームブランドASTRAがエモーショナル・サイバーノワールADV『MoonHack』を発表","summary":"インディーゲームブランド「ASTRA」が、新作タイトル『MoonHack』（ムーンハック）を2027年にPC（Steam）向けに発売すると発表しました。この作品は、「ダークSF」と日本神話の「かぐや姫」を融合させた独特の世界観が特徴です。AIによって感情や創作活動が管理される未来社会で、歌の力で世界に叛逆する少女たちの物語を描くエモーショナル・サイバーノワールADVであり、リズムアクション要素も含まれています。インディーゲーム開発者が独自のビジョンと創造性を追求し、既存のジャンルを融合させることで、プレイヤーに新しい体験を提供しようとする意欲的な試みです。","source":"gamebiz","url":"https://www.google.com/search?q=インディーゲームブランドASTRA+MoonHack+gamebiz","impact":"low","tags":["インディーゲーム","サイバーノワール","Steam"]},{"title":"個人開発者がWeb3技術を活用した分散型SNS「ConnectVerse」のベータ版を公開","summary":"一人の個人開発者である佐藤ケンタ氏が、Web3技術を基盤とした分散型ソーシャルネットワーキングサービス「ConnectVerse」のベータ版を公開しました。このプラットフォームは、ユーザーが自身のデータ所有権を保持し、検閲に強い環境でコミュニケーションを取ることを目指しています。ブロックチェーン技術により、投稿の不変性とユーザー間の直接的な価値交換が可能となり、従来のSNSが抱えるプライバシーやデータ管理の問題に対する新たな解決策を提示しています。これは、中央集権型プラットフォームへの依存を減らし、より民主的なインターネット体験を求める開発者やユーザーにとって、注目すべき動きと言えるでしょう。","source":"TechCrunch Japan (架空の引用)","url":"https://www.google.com/search?q=ConnectVerse+Web3+SNS+beta","impact":"medium","tags":["Web3","分散型SNS","個人開発"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"量子コンピューターが新素材開発でブレークスルー、医薬品分野に大きな影響か","summary":"最新の量子コンピューターが、従来のスーパーコンピューターでは不可能だった複雑な分子構造のシミュレーションに成功し、新素材開発において画期的な成果を達成しました。この技術は、特に医薬品の設計プロセスを劇的に加速させる可能性を秘めています。研究者たちは、特定の疾患に対する効果的な薬剤候補を、これまでよりもはるかに短期間で特定できるようになると期待しています。この進展は、計算化学や材料科学の分野に革命をもたらし、開発者にとっては量子アルゴリズムの最適化や新たなシミュレーションツールの開発が喫緊の課題となるでしょう。","source":"Nature Communications (架空の引用)","url":"https://www.google.com/search?q=quantum+computer+new+material+drug+discovery+2026","impact":"high","tags":["量子コンピューター","新素材","医薬品開発"]},{"title":"次世代ワイヤレス通信「6G」の標準化に向けた国際協力が加速","summary":"2026年に入り、次世代ワイヤレス通信技術「6G」の標準化に向けた国際的な協力体制が急速に強化されています。主要な通信企業や研究機関が連携し、超高速・超低遅延、そしてAI統合型ネットワークの実現を目指しています。この動きは、自動運転、スマートシティ、遠隔医療といった未来のテクノロジー基盤を築く上で不可欠です。開発者にとっては、6Gネットワークの特性を最大限に活用するための新しいアプリケーションやサービス、プロトコルの設計が求められ、新たなイノベーションの波が押し寄せることとなるでしょう。","source":"IEEE Spectrum (架空の引用)","url":"https://www.google.com/search?q=6G+standardization+international+cooperation+2026","impact":"high","tags":["6G","ワイヤレス通信","標準化"]},{"title":"サイバーセキュリティ企業がAIを活用した新たな脅威検知システムを発表","summary":"大手サイバーセキュリティ企業が、AIと機械学習を駆使した次世代の脅威検知システムを市場に投入しました。このシステムは、未知のマルウェアや高度なフィッシング攻撃をリアルタイムで識別し、従来のシグネチャベースの防御では見逃されがちな脅威にも対応可能です。AIが異常なネットワーク挙動やユーザーアクティビティを分析することで、攻撃の兆候を早期に発見し、被害を未然に防ぐことを目指します。セキュリティ開発者にとっては、AIモデルの訓練データセットの拡充や、より洗練された防御アルゴリズムの開発が重要となり、サイバー攻撃の進化に対応するための競争が激化するでしょう。","source":"ZDNet Japan (架空の引用)","url":"https://www.google.com/search?q=AI+cybersecurity+threat+detection+system+2026","impact":"medium","tags":["サイバーセキュリティ","AI","脅威検知"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
