<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年9月1日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年9月1日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"EU、ChatGPTを「超大規模オンライン検索エンジン（VLOSE）」に指定、厳格な規制対象に","summary":"欧州委員会は、OpenAIのChatGPTをデジタルサービス法（DSA）に基づく「超大規模オンライン検索エンジン（VLOSE）」に指定しました。これは生成AIチャットボットとしては世界初の指定であり、ChatGPTのEU月間利用者数が指定閾値を大幅に超えたことが根拠です。OpenAIは今後4か月以内にリスク評価や独立監査などの追加義務を履行する必要があり、違反時には世界売上高の最大6%の制裁金が科される可能性があります。この動きは、今後の世界的な生成AI規制の先行事例として注目されており、AI開発者や企業は法規制への対応を急ぐ必要があります。","source":"ニュース記事","url":"https://www.google.com/search?q=EU+ChatGPT+VLOSE+指定","impact":"high","tags":["AI規制","ChatGPT","DSA","OpenAI"]},{"title":"国産生成AIモデル「PLaMo 3.0 Prime」、自治体AI zevoで提供開始","summary":"シフトプラス株式会社は、自治体向け生成AI活用システム「自治体AI zevo」において、Preferred Networks（PFN）が開発した国産生成AI基盤モデル「PLaMo 3.0 Prime」の提供を開始しました。PLaMo 3.0 Primeは、日本語の自然な文脈理解や論理展開に強みを持ち、行政業務での文書作成や要約、翻訳、調査支援などに幅広く活用可能です。デジタル庁のガバメントAI利用環境「源内」でも試用されるモデルであり、国内リージョンでの安心感と高い日本語性能が特徴です。これにより、自治体におけるAI導入が加速し、国内のAI技術の活用がさらに進むことが期待されます。","source":"ニュース記事","url":"https://www.google.com/search?q=PLaMo+3.0+Prime+自治体AI+zevo","impact":"medium","tags":["国産AI","LLM","自治体AI","PFN"]},{"title":"ローカルLLMの統合ツール「Unsloth Desktop」登場、画像生成・コード実行・API化をGUIで実現","summary":"情報漏えい防止やコスト削減の観点からローカルLLMへの注目が高まる中、「Unsloth Desktop」が2026年8月に登場しました。このツールは、ローカルLLMでのチャット機能に加え、ノーコードでの学習、画像生成、コード実行、API公開といった機能を一つのGUIに統合しています。チャット内容やアップロードファイルが外部に送信されないため、機密情報や個人情報を扱う企業や個人開発者にとって、セキュリティポリシー上の制約を受けずにAIを活用できる実用的な選択肢となります。これにより、ローカル環境でのAI活用がより手軽になり、開発の自由度が高まります。","source":"ニュース記事","url":"https://www.google.com/search?q=Unsloth+Desktop+ローカルLLM","impact":"high","tags":["ローカルLLM","開発ツール","セキュリティ","GUI"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"アーティスト・田口タツヤ氏、AIを活用し一人で推し活アプリ「推シツジ」を開発","summary":"アーティストの田口タツヤ氏が、AIを駆使して個人で「推シツジ」という推し活アプリを開発しました。これは、AI技術の進化が個人開発者の可能性を大きく広げている具体的な事例と言えます。特定のニッチな市場をターゲットにしたアプリ開発において、AIが開発コストや時間を削減し、個人でもアイデアを形にできる環境が整いつつあることを示唆しています。この事例は、AIが個人開発のハードルを下げ、多様なアイデアの実現を後押しする可能性を示しています。","source":"ニュース記事","url":"https://www.google.com/search?q=田口タツヤ+推し活アプリ+推シツジ+AI","impact":"medium","tags":["個人開発","AI活用","アプリ開発","ニッチ市場"]},{"title":"世界最大級のモバイルアプリハッカソン「Shipaton 2026」開幕、日本からの参加者も多数","summary":"世界最大級のモバイルアプリハッカソン「Shipaton 2026」が8月1日に開幕し、日本からの事前登録者数が1300名を突破しました。このイベントは、個人開発者やインディーハッカーが自身のアイデアをモバイルアプリとして具現化し、世界に向けて発表する貴重な機会を提供します。AI駆動開発などの最新技術を活用したアプリ開発が奨励されており、参加者にとっては技術力向上とネットワーキングの場としても機能します。このようなイベントは、個人開発者のスキルアップとコミュニティ形成に大きく貢献します。","source":"ニュース記事","url":"https://www.google.com/search?q=Shipaton+2026+モバイルアプリハッカソン","impact":"medium","tags":["ハッカソン","モバイルアプリ","AI開発","インディーハッカー"]},{"title":"AIと作ったWebアプリを簡単に公開できる新ホスティングサービス「ロリポップ！デプロイナウ」提供開始","summary":"GMOインターネットグループは、AIを活用して開発されたWebアプリケーションを容易に公開できるホスティングサービス「ロリポップ！デプロイナウ byGMOペパボ」の提供を開始しました。このサービスは、個人開発者が開発からデプロイまでのプロセスを効率化し、自身のアイデアを迅速に市場に投入することを支援します。AI開発ツールの普及とともに、その成果物を手軽に公開できるインフラの整備が進むことで、個人開発の活性化が期待されます。これにより、個人開発者はより手軽に自分の作品を世に送り出すことが可能になります。","source":"ニュース記事","url":"https://www.google.com/search?q=ロリポップ！デプロイナウ+AI+Webアプリ+ホスティング","impact":"high","tags":["ホスティング","デプロイ","Webアプリ","個人開発"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"京王電鉄バスと京王バス、AIによる乗客の転倒兆候検知システムを運用開始","summary":"京王電鉄バスおよび京王バスは、路線バスの車内事故防止のため、乗客の転倒につながりかねない危険な兆候をAI技術で検知し、乗務員に知らせるシステムの運用を2026年8月下旬から開始しました。日野自動車が提供する「AI搭載型車内事故防止システム」を採用し、車内カメラの映像をAIが解析します。走行中に移動している乗客やつり革・手すりから手を離している乗客などをリアルタイムで判定・検知し、運転席の画面表示と音声で乗務員に通知、同時に車内モニターで乗客への注意喚起を行います。これにより、公共交通機関の安全・安心の向上を図り、AIが社会インフラの安全性向上に貢献する事例となります。","source":"ニュース記事","url":"https://www.google.com/search?q=京王電鉄バス+AI+転倒兆候検知システム","impact":"medium","tags":["AI活用","公共交通","安全対策","画像認識"]},{"title":"ガートナー、2026年の半導体市場規模予測を大幅上方修正、AIインフラ投資が牽引","summary":"市場調査会社のガートナーは、2026年の世界半導体売上高が前年比92％増の約1兆5552億ドルに達するとの予測を発表し、4月に発表した予測を上方修正しました。この市場拡大を牽引しているのは、AIインフラへの継続的な投資と、想定を上回るメモリ価格の上昇です。特に半導体メモリの売上高は8373億ドルに達し、半導体市場全体の54％を占めると予測されています。また、AIデータセンター関連の売上比率は2026年の36.5％から2030年には53％超へ上昇すると見られており、AIが半導体市場の構造そのものを大きく変化させていることが示されています。これは、AI関連技術開発者にとって、ハードウェア基盤の進化が継続的に進むことを意味します。","source":"ニュース記事","url":"https://www.google.com/search?q=ガートナー+2026年+半導体市場予測+AI","impact":"high","tags":["半導体","AIインフラ","市場予測","ガートナー"]},{"title":"リコー、動画像から人の動きを学習しロボットへ適用可能なフィジカルAI技術を開発","summary":"リコーは、動画像から人の動きを学習し、多様なロボットに適用可能なフィジカルAI技術の開発を発表しました。この技術は、VLA（Vision-Language-Action）モデルを活用し、画像や動画などの視覚情報と言語による指示を理解して、ロボットの具体的な動作を生成します。「見る・理解する・動く」を統合的に扱うことで、ロボットが多様な状況や作業に柔軟に対応することを目指しています。これにより、人とロボットが協働し、人間がより創造的な業務に集中できる働き方の実現に貢献することが期待され、ロボット開発の新たな可能性を広げます。","source":"ニュース記事","url":"https://www.google.com/search?q=リコー+フィジカルAI+ロボット+動画像学習","impact":"medium","tags":["ロボット","フィジカルAI","VLAモデル","リコー"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
