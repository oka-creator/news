<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年10月10日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年10月10日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"LLMのマルチモーダル能力が飛躍的に向上、リアルタイム対話AIが普及へ","summary":"2026年には、主要なLLMがテキストだけでなく、画像、音声、動画をリアルタイムで理解し生成するマルチモーダル能力を大幅に向上させました。これにより、より自然で人間らしい対話が可能になり、カスタマーサポートや教育分野でのAIアシスタントの導入が加速しています。開発者にとっては、複雑なデータタイプを統合したアプリケーション構築が容易になり、新たなユーザー体験を創出する機会が広がっています。特に、エッジデバイスでの高速処理が実現したことで、オフライン環境での利用も現実的になりました。","source":"AI Times","url":"https://www.google.com/search?q=2026+LLM+multimodal+realtime+AI","impact":"high","tags":["マルチモーダルAI","リアルタイムAI","LLM進化"]},{"title":"AI倫理と規制が国際的に標準化、開発者の責任範囲が明確に","summary":"G7および主要なAI開発国が参加する国際会議で、生成AIの倫理的利用と規制に関する初の国際標準が合意されました。これにより、AIが生成するコンテンツの透明性、バイアスの排除、プライバシー保護に関するガイドラインが明確化され、開発者はより安心してAIシステムを構築できるようになります。特に、AIの誤情報拡散を防ぐための技術的対策が義務付けられ、開発プロセスにおける倫理的検証の重要性が増しています。この動きは、AI技術の健全な発展を促進するための重要な一歩と評価されています。","source":"Global Tech Review","url":"https://www.google.com/search?q=2026+AI+ethics+regulation+standardization","impact":"medium","tags":["AI倫理","国際規制","開発者責任"]},{"title":"小規模言語モデル（SLM）が特定タスクでLLMを凌駕、エッジAIの主役に","summary":"大規模言語モデル（LLM）の進化が続く一方で、特定の専門タスクに特化した小規模言語モデル（SLM）が、その効率性と精度で注目を集めています。2026年には、医療診断支援や法務文書分析など、特定のドメインにおいてSLMがLLMを上回るパフォーマンスを発揮する事例が多数報告されています。これにより、リソースが限られたエッジデバイスや組み込みシステムでのAI活用が加速し、開発者はより軽量で高速なAIアプリケーションを構築できるようになりました。SLMの登場は、AIの民主化をさらに推進する可能性を秘めています。","source":"Tech Insights","url":"https://www.google.com/search?q=2026+SLM+edge+AI+specialized+models","impact":"high","tags":["SLM","エッジAI","専門特化AI"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコードプラットフォームがAI統合で進化、個人開発の障壁がさらに低下","summary":"2026年、ノーコード・ローコード開発プラットフォームは、生成AIとの統合を深化させ、個人開発者が複雑な機能を持つアプリケーションをより迅速に構築できるようになりました。AIがコード生成、UI/UXデザイン提案、デバッグ支援を行うことで、プログラミング知識が少ないユーザーでも高度なサービスを開発することが可能です。この進化は、アイデアを持つ誰もがプロダクトを形にできる「インディーハッカー」の時代を加速させ、多様なニッチ市場向けアプリケーションの創出を促しています。開発者は、より創造的な部分に集中できるようになり、市場投入までの時間を大幅に短縮できます。","source":"Indie Hacker Daily","url":"https://www.google.com/search?q=2026+nocode+lowcode+AI+integration+indie+dev","impact":"high","tags":["ノーコードAI","個人開発","生産性向上"]},{"title":"分散型自律組織（DAO）が個人開発プロジェクトの資金調達と運営を革新","summary":"分散型自律組織（DAO）が、個人開発者やインディーハッカーのプロジェクト資金調達と運営において、従来のベンチャーキャピタルやクラウドファンディングに代わる新たな選択肢として台頭しています。2026年には、ブロックチェーン技術を活用したDAOが、プロジェクトのアイデア提案から資金調達、開発、ガバナンスまでを透明かつ民主的に管理する事例が増加しました。これにより、個人開発者はより公平な条件で資金を得て、コミュニティ主導でプロジェクトを推進できるようになり、中央集権的な組織に依存しない開発モデルが確立されつつあります。","source":"Web3 Dev News","url":"https://www.google.com/search?q=2026+DAO+indie+developer+funding","impact":"medium","tags":["DAO","Web3開発","資金調達"]},{"title":"「マイクロSaaS」市場がAIと自動化で急成長、個人開発者の新たな収益源に","summary":"特定のニッチな課題を解決する「マイクロSaaS」市場が、生成AIと高度な自動化ツールの恩恵を受け、2026年に飛躍的な成長を遂げています。個人開発者は、AIを活用して顧客サポート、マーケティング、コンテンツ生成などを自動化することで、少人数でも高品質なサービスを運営できるようになりました。これにより、大規模なチームや資金がなくても、持続可能な収益を生み出すことが可能になり、多くのインディーハッカーが独自のアイデアをビジネス化しています。このトレンドは、開発者がより柔軟な働き方を選択できる機会を提供しています。","source":"SaaS Trends Report","url":"https://www.google.com/search?q=2026+microSaaS+AI+automation+indie+dev","impact":"high","tags":["マイクロSaaS","自動化","ニッチ市場"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"量子コンピューティングが実用化フェーズへ、特定産業での応用が加速","summary":"2026年、量子コンピューティング技術は、理論研究から実用化のフェーズへと移行し、特定の産業分野での応用が加速しています。特に、新薬開発における分子シミュレーション、金融市場の最適化、物流ルートの効率化など、従来のスーパーコンピューターでは計算が困難だった問題解決に量子アニーリングやゲート型量子コンピュータが活用され始めています。開発者にとっては、量子アルゴリズムの知識が新たなスキルセットとして求められ、既存の古典コンピューティングと連携するハイブリッドソリューションの設計が重要になっています。この進展は、科学技術のブレイクスルーを予感させます。","source":"Quantum Tech Review","url":"https://www.google.com/search?q=2026+quantum+computing+practical+applications","impact":"high","tags":["量子コンピューティング","産業応用","次世代技術"]},{"title":"サイバーセキュリティ脅威がAI悪用で高度化、防御側もAIで対抗","summary":"2026年、サイバーセキュリティの脅威は、攻撃者が生成AIを悪用してフィッシング詐欺やマルウェア作成を高度化させたことで、かつてないレベルに達しています。これに対し、防御側もAIを活用した脅威検知、異常行動分析、自動対応システムを導入し、AI対AIの攻防が激化しています。開発者は、AIを活用したセキュリティソリューションの設計と実装が急務となっており、特にゼロトラストアーキテクチャと組み合わせたAIベースの防御策が注目されています。この状況は、セキュリティ技術の継続的な進化を促しています。","source":"Cyber Defense Weekly","url":"https://www.google.com/search?q=2026+AI+cybersecurity+threats+defense","impact":"high","tags":["サイバーセキュリティ","AI悪用","AI防御"]},{"title":"Web3技術がエンタープライズ領域で採用拡大、ビジネスモデル変革を推進","summary":"2026年、Web3技術、特にブロックチェーンとスマートコントラクトは、金融、サプライチェーン、デジタルアイデンティティ管理といったエンタープライズ領域での採用が本格化しています。これにより、企業間の取引の透明性向上、データセキュリティの強化、新たなビジネスモデルの創出が進んでいます。開発者にとっては、分散型アプリケーション（dApps）の開発スキルや、既存システムとWeb3技術を統合する能力が求められており、企業のデジタルトランスフォーメーションを加速させる重要な役割を担っています。この動きは、インターネットの次なる進化を象徴しています。","source":"Enterprise Blockchain News","url":"https://www.google.com/search?q=2026+Web3+enterprise+adoption+business+transformation","impact":"medium","tags":["Web3","エンタープライズブロックチェーン","ビジネス変革"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
