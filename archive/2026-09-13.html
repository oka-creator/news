<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年9月14日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年9月14日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"新しいマルチモーダルLLMの商用利用解禁とAPI提供開始","summary":"複数の大手AI企業が、テキストだけでなく画像、音声、動画を理解・生成できるマルチモーダルLLMの最新版を商用利用向けに解禁し、API提供を開始しました。これにより、開発者はより高度なコンテンツ生成や、複雑なユーザーインタラクションを持つアプリケーションを構築できるようになります。特に、動画生成機能の精度向上と処理速度の高速化が注目されており、マーケティングコンテンツ制作や教育分野での活用が期待されています。これは、AI開発の新たなフェーズを示唆しており、多様なビジネスチャンスを創出するでしょう。","source":"AI News","url":"https://www.google.com/search?q=マルチモーダルLLM+商用利用+API","impact":"high","tags":["マルチモーダルAI","LLM","API","コンテンツ生成"]},{"title":"中小企業向けに特化した軽量LLMの登場と導入支援パッケージ","summary":"特定業界の中小企業ニーズに特化し、コスト効率と運用負荷を抑えた軽量LLMソリューションが登場しました。これらのLLMは、顧客サポートの自動化、社内文書の要約、データ分析アシスタントなど、特定の業務に最適化されています。導入から運用までの支援パッケージが提供されており、これまでAI導入に踏み切れなかった中小企業でも、手軽にAIの恩恵を受けられるようになります。これは、AIの民主化を促進する重要な動きであり、幅広い企業でのAI活用を後押しします。","source":"Tech News","url":"https://www.google.com/search?q=中小企業向け+軽量LLM+導入支援","impact":"medium","tags":["軽量LLM","中小企業","AI導入","業務効率化"]},{"title":"生成AIによるコード生成・デバッグ支援ツールの進化と開発現場への浸透","summary":"主要なIDEに組み込まれる形で、生成AIを活用したコード生成、バグ検出、リファクタリング支援ツールの機能が大幅に強化されました。特に、自然言語での指示から複雑なコードスニペットを生成する能力や、リアルタイムでの潜在的な脆弱性検出機能が向上しています。これにより、開発者の生産性向上に大きく貢献しており、一部の企業では新人開発者のオンボーディング期間短縮にも寄与しているとの報告もあります。開発現場におけるAIの役割がますます拡大し、ソフトウェア開発の未来を形作っています。","source":"Developer News","url":"https://www.google.com/search?q=生成AI+コード生成+デバッグ支援+IDE","impact":"high","tags":["コード生成AI","IDE","開発効率","デバッグ"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコードプラットフォームのAI統合による開発効率の劇的向上","summary":"主要なノーコード・ローコード開発プラットフォームが、生成AI機能を深く統合し、アイデア出しからプロトタイプ作成、機能実装までのプロセスを大幅に加速させています。例えば、自然言語でアプリケーションの要件を記述するだけで、UIコンポーネントの自動生成やデータベーススキーマの提案が行われるようになりました。これにより、非エンジニアでも複雑なアプリケーションを短期間で開発できる環境が整い、個人開発の敷居が大きく下がっています。この進化は、より多くのイノベーションを生み出す可能性を秘めています。","source":"No-code Trends","url":"https://www.google.com/search?q=ノーコード+ローコード+AI統合","impact":"high","tags":["ノーコード","ローコード","AI開発","プロトタイピング"]},{"title":"マイクロSaaS市場の活況とニッチな課題解決ツールへの注目","summary":"個人開発者や小規模チームによるマイクロSaaSのリリースが引き続き活発です。特に、特定の業界や職種のニッチな課題を解決するツールが注目を集めており、サブスクリプションモデルで安定した収益を上げています。顧客との直接的なコミュニケーションを通じて迅速に改善を重ねるアプローチが成功の鍵となっており、既存の大手サービスでは手が届きにくい細やかなニーズに応える製品が増加しています。このトレンドは、個人開発者が市場で成功するための新たな道を示し、多様なサービスが生まれる土壌となっています。","source":"SaaS Trends","url":"https://www.google.com/search?q=マイクロSaaS+ニッチ市場+個人開発","impact":"medium","tags":["マイクロSaaS","個人開発","ニッチ市場","サブスクリプション"]},{"title":"オープンソースコミュニティにおけるAI活用型開発支援ツールの台頭","summary":"オープンソースプロジェクトにおいて、AIを活用した開発支援ツールが急速に普及しています。コードレビューの自動化、ドキュメント生成、テストケース作成支援など、AIが開発プロセスの様々な側面をサポートすることで、個人開発者や小規模チームでも大規模プロジェクトに貢献しやすくなっています。これにより、より多くの人々がオープンソース活動に参加し、エコシステム全体の活性化に繋がっています。AIはオープンソース開発の生産性を向上させる強力なツールとなっており、今後の発展が期待されます。","source":"Open Source News","url":"https://www.google.com/search?q=オープンソース+AI開発支援ツール","impact":"medium","tags":["オープンソース","AIツール","開発支援","コミュニティ"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"エッジAIデバイスの普及とプライバシー保護への新たなアプローチ","summary":"スマートフォン、スマートホームデバイス、ウェアラブル機器など、様々なエッジデバイスにAI処理機能が組み込まれることで、データがクラウドに送信されることなくデバイス上でリアルタイム処理されるケースが増加しています。これにより、応答速度の向上だけでなく、個人データのプライバシー保護が強化されるというメリットが注目されています。特に、医療・ヘルスケア分野での応用が進み、個人情報の安全な取り扱いが新たな標準となりつつあります。これは、データセキュリティと利便性の両立を実現する重要な進展であり、今後の技術開発の方向性を示しています。","source":"IoT News","url":"https://www.google.com/search?q=エッジAI+プライバシー保護+デバイス","impact":"high","tags":["エッジAI","プライバシー","IoT","リアルタイム処理"]},{"title":"次世代バッテリー技術の進化とEV・ドローン市場への影響","summary":"固体電池やフッ化物イオン電池など、従来のリチウムイオン電池を凌駕する次世代バッテリー技術の実用化が加速しています。これにより、電気自動車（EV）の航続距離が大幅に伸び、充電時間が短縮されるだけでなく、ドローンやIoTデバイスの小型化・長時間稼働が可能になります。エネルギー密度と安全性の向上が、輸送、物流、農業など多岐にわたる産業に変革をもたらすと期待されています。この技術革新は、持続可能な社会の実現に不可欠であり、経済全体に大きな影響を与えるでしょう。","source":"Energy Tech","url":"https://www.google.com/search?q=次世代バッテリー+EV+ドローン","impact":"high","tags":["次世代バッテリー","EV","ドローン","エネルギー"]},{"title":"サイバーセキュリティ分野におけるAI駆動型防御システムの強化","summary":"AIを活用したサイバーセキュリティソリューションが、脅威検知と対応のスピードと精度を飛躍的に向上させています。異常検知、行動分析、脅威予測などのAI機能により、未知のマルウェアや高度なフィッシング攻撃、ゼロデイ攻撃への防御能力が強化されました。特に、国家レベルのサイバー攻撃が増加する中で、AI駆動型防御システムは企業や政府機関にとって不可欠なインフラとなりつつあります。これは、デジタル社会の安全保障を担う重要な技術であり、今後もその進化が注目されます。","source":"Cybersecurity News","url":"https://www.google.com/search?q=サイバーセキュリティ+AI防御システム","impact":"high","tags":["サイバーセキュリティ","AI防御","脅威検知","ゼロデイ攻撃"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
