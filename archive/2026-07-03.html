<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年7月4日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年7月4日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"「Claude Sonnet 5」登場、Opus級性能を低価格で実現","summary":"Anthropicは、新しいAIモデル「Claude Sonnet 5」を発表しました。このモデルは、既存の高性能モデルである「Opus」に匹敵する性能を持ちながら、より低価格で提供される点が大きな特徴です。これにより、開発者や企業は、これまで以上にコスト効率良く高性能な大規模言語モデル（LLM）を利用できるようになります。AI活用の敷居がさらに下がることで、幅広い分野でのイノベーションが加速することが期待されます。特に、リソースが限られたスタートアップや中小企業にとって、高性能AIへのアクセスが容易になるでしょう。","source":"Anthropic発表","url":"https://iris-on-bookrest.com/2026/07/01/it-news-summary-20260701/","impact":"high","tags":["生成AI","LLM","Anthropic","コスト効率"]},{"title":"Googleが画像生成AI「Nano Banana 2 Lite」を発表、最速かつ低コスト","summary":"Googleは、画像生成AIモデル「Nano Banana」ファミリーの新たなラインアップとして、「Nano Banana 2 Lite（Gemini 3.1 Flash Lite Image）」を発表しました。このモデルは、生成スピードとコスト効率が最適化されている点が特長で、高速かつ低コストでの画像生成を可能にします。また、AIコンテンツの検証を可能にするデジタル透かし「SynthID」も搭載されており、AI生成コンテンツの信頼性向上にも貢献します。これにより、クリエイターや企業は、効率的かつ安心してAI画像を活用できるようになるでしょう。","source":"Google発表","url":"https://jetstream.bz/archives/14207","impact":"medium","tags":["画像生成AI","Google","SynthID","コスト効率"]},{"title":"OpenAI、GPT-5.6プレビューとCodexの「ワークスペース化」始動","summary":"OpenAIは、次世代モデル「GPT-5.6（Sol/Terra/Luna）」の限定プレビューを開始しました。この新モデルは、さらなる性能向上と機能拡張が期待されており、AI技術の最前線を押し広げるものです。同時に、プログラミング支援AIであるCodexは、サイト構築やプラグイン対応を強化し、開発ツールから業務基盤へと進化を遂げています。Samsung Electronicsが全社規模でChatGPT EnterpriseとCodexを導入したことも明らかになり、企業におけるAI活用が一段と加速する見込みです。これは、AIがビジネスの基幹システムに深く統合される時代の到来を示唆しています。","source":"OpenAI発表","url":"https://ai-news.jp/2026/07/01/openai-gpt-5-6-codex-samsung/","impact":"high","tags":["OpenAI","GPT-5.6","Codex","企業導入"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"高校生が生成AIで課題解決アプリを開発、RePlayceが企業連携PBLを実施","summary":"株式会社RePlayceは、大手コンサルティングファームと連携し、高校生が生成AIを活用して実社会の課題解決に挑戦するPBL（Project Based Learning）を実施しました。生徒たちは、化粧品の成分を分析して肌との相性を診断するAIアプリ「CosmeClear」などを開発し、具体的な成果を上げました。ユーザーの困りごとの発見からプロトタイプ開発までの一連のプロセスを経験することで、AIを活用した実践的な開発スキルを習得しています。この取り組みは、次世代のAI人材育成において重要な一歩であり、若い開発者たちが社会課題解決に貢献する可能性を示しています。","source":"RePlayce発表","url":"https://www.kodomo-it.org/news/2026/07/03/replayce-pbl/","impact":"medium","tags":["PBL","生成AI","教育","アプリ開発"]},{"title":"Googleが「Gemma 4 12B」を発表、ノートパソコン上でローカル実行可能なオープンモデル","summary":"Googleは、新しいオープンAIモデル「Gemma 4 12B」を発表しました。このモデルはノートパソコン上でローカルに実行できるため、プライバシーを重視したオフライン利用やエッジAI開発に最適な選択肢を提供します。クラウドに依存せず、自身のデバイスでAIを活用したい個人開発者やインディーハッカーにとって、実用的な選択肢が広がる画期的な発表です。これにより、データセキュリティの懸念を軽減しつつ、より多様な環境でのAIアプリケーション開発が可能となるでしょう。","source":"Google発表","url":"https://note.com/aimatome/n/n2b2d69f3a61e","impact":"high","tags":["オープンモデル","ローカル実行","Gemma","個人開発"]},{"title":"AIコーディングの普及で○○○は不要になる？オープンソースカンファレンスで議論","summary":"2026年8月に開催されるオープンソースカンファレンス2026 Kyoto（OSC京都）では、「AIコーディングの普及で○○○は不要になる？」をテーマにしたセミナーが実施されます。このセミナーでは、LLM・生成AI技術がITエンジニアの仕事に与える影響や、AIコーディングの具体的な活用方法について、専門家が多角的に議論する予定です。個人開発者にとって、AIと協業する未来のヒントを得られる貴重な機会となるでしょう。AIが開発プロセスに深く関わる中で、エンジニアがどのようにスキルを再定義すべきか、重要な示唆が得られると期待されます。","source":"技評記事","url":"https://gihyo.jp/article/2026/06/oss-column-131","impact":"medium","tags":["AIコーディング","OSC","ITエンジニア","未来予測"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"ソフトバンクグループがOpenAIへ100億ドルの追加出資を実行","summary":"ソフトバンクグループは2026年7月1日、米国のOpenAIに対し100億ドル（日本円で約1兆6273億円）の追加出資を実行したと発表しました。これは、今年2月に締結された総額300億ドルの出資契約に基づく第2弾の払い込みとなります。この大規模な投資は、今後のAI開発競争におけるソフトバンクグループの戦略的ポジションを一層強固にするものです。これにより、OpenAIの技術開発がさらに加速し、世界のAIエコシステムに大きな影響を与えることが予想されます。","source":"ビジネス・アイ","url":"https://www.business-i.jp/news/2026/07/01/softbank-openai-investment","impact":"high","tags":["ソフトバンク","OpenAI","投資","AI開発"]},{"title":"経済産業省、国産AI開発プロジェクトでソフトバンクなど設立の新会社「Noetra」を選定","summary":"経済産業省は、国産AI（人工知能）開発の公募事業における支援先として、ソフトバンク、NEC、ソニーグループ、ホンダが共同で設立した新会社「Noetra（ノエトラ）」を選定しました。このプロジェクトは、国産AIの基盤モデルを開発し、AIロボットや工場の自律制御などでの活用を目指すものです。2026年度から5年間の計画で、初年度には3873億円の予算が投じられる大型国家プロジェクトとなります。これは、日本のAI技術の国際競争力強化に向けた重要な戦略的投資であり、国内産業のデジタル変革を推進する基盤となるでしょう。","source":"経済産業省発表","url":"https://www.youtube.com/watch?v=xxxxxxxxxxx","impact":"high","tags":["国産AI","経済産業省","Noetra","国家プロジェクト"]},{"title":"NTTモビリティが「自動運転安全管理委員会」を設立、外部有識者も参画","summary":"NTTモビリティ株式会社は2026年7月1日、NTTグループの自動運転事業における安全性と信頼性のさらなる向上を目的とした内部組織「自動運転安全管理委員会」を設立しました。外部有識者を委員に迎え、グループ共通の安全管理ルール整備、事故発生時の対応マニュアル策定、事故事例の発生要因分析と再発防止策の立案などを推進します。また、重大事故を想定した演習計画の策定と実施も行い、自動運転の社会実装に向けた安全管理体制を強化する方針です。この取り組みは、自動運転技術の普及において最も重要な要素である「安全性」への信頼を確立するために不可欠です。","source":"ロボスタ","url":"https://robotsta.jp/news/2026/07/01/ntt-mobility-autonomous-driving-safety-committee/","impact":"medium","tags":["自動運転","NTT","安全管理","社会実装"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
