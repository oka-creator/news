<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年7月29日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

s":["LLM選定","モデルポートフォリオ","AI戦略","コスト最適化"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"個人ゲーム開発者『かきぬま』氏、新作スマホ向けキャラ収集・育成バトルゲーム『こころガーディアンズ』をリリース","summary":"累計12万ダウンロードを突破した『チート勇者』に続く新作として、個人ゲーム開発者「かきぬま」氏がスマホ向けキャラ収集・育成バトルゲーム『こころガーディアンズ』を2026年7月28日にリリースしました。100種類以上のガーディアンを仲間にし、指一本のシンプルな操作でリアルタイムバトルを楽しめる本作は、広告・課金なしで全コンテンツをプレイできる点が特徴です。この成功事例は、個人開発者でも質の高いゲームを開発し、ユーザーに受け入れられる可能性を示しています。開発者にとっては、情熱と独自のアイデアが商業的な成功につながる良い刺激となるでしょう。","source":"gamebiz","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQG1vbsGAwOtNF1MGeQc0nqUJnU_XeTh_hKCwd3z9TKPhMlWewsk9oKFjZl9z5VxiJB-0qp0JSlNrYrgqBN68eXps0pg5-Ne4azt-7tMytp3QOtqWraf879D","impact":"medium","tags":["個人開発","インディーゲーム","スマホゲーム","成功事例"]},{"title":"ノーコード開発ツールが業務アプリからWebサイト制作まで幅広く活用され、需要が拡大","summary":"プログラミング知識がなくてもアプリやWebサイトを開発できるノーコードツールが、個人開発者や中小企業を中心に広く導入され、需要が拡大しています。特に「JUST.DB」は生成AI搭載機能で業務システムを自動構築でき、ITトレンドの資料請求ランキングでも上位にランクインしました。ノーコードはIT人材不足やビジネス環境の急速な変化に対応する有効な手段として、開発スピードの向上とコスト削減に貢献しています。開発者にとっては、ノーコードツールを使いこなすスキルや、既存システムとの連携を設計する能力が今後さらに重要になるでしょう。","source":"ITトレンド","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGmp9zb8aB2O4Kwu7ooA9m02ptyjB6wDvZ-8vz4KAtDWz4RKSnhVMkPiuK-QhcIESePslPXL7LGeIbPRp4L0deyi5Gt9uNESOXA-EiY-HEVCL75X5OldxJPSsQfhtYr1YjwpKHsyIWJBczV20bKjFSgyxgW2lluWYXlH8ZFrXyB3uJCwg==","impact":"high","tags":["ノーコード","業務アプリ","Webサイト制作","開発効率"]},{"title":"インディーハッカーの成功には『マーケティング』が開発と同等以上に重要","summary":"2026年におけるインディーハッカーの成功戦略として、「1時間のマーケティングは、10時間の開発に勝る」という考え方が英語圏で常識になりつつあります。18ヶ月かけて開発したプロダクトが売上ゼロだったインディーハッカーが、30日間マーケティングに集中した結果、月43,000ドル（約650万円）の売上を達成した事例が紹介されました。この事例は、プロダクトの完成度だけでなく、その「配布」に注力することの重要性を強調しています。開発者にとっては、技術力だけでなく、市場へのアプローチや顧客獲得のためのマーケティング戦略が成功の鍵を握るという意識改革が求められるでしょう。","source":"note","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEP99A3PYv9ZSS2-HRjJIjZao-Pq6X3N5ZG-DJKlXBnzjIxC0-8hztUmMdegtxAcrLXUgDK1JDin5y6QVposKSewv0rV6kYxA4if079hXJBcA78X0KR_98CheS9V3cnasRsYxc=","impact":"high","tags":["インディーハッカー","マーケティング","プロダクト配布","成功戦略"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"AIインフラ競争が激化、AMDがNVIDIAに挑む大型システム『Helios』を発表","summary":"AIインフラの覇権争いが加速しており、AMDは年次イベント「AAI 2026」でラックスケール統合システム「Helios」を正式製品化しました。これはAI向けGPU「Instinct MI455X」72基とCPU「Venice」18基を搭載し、OpenAIが2026年第4四半期から最大6GW規模で導入を計画するなど、NVIDIA一極集中だったAIクラウド市場に本格的な競争軸が生まれています。AIサーバーの性能競争は「演算速度より先に熱が限界になる時代」に突入し、液浸冷却や二相冷却といった次世代冷却技術の重要性が高まっています。開発者にとっては、多様なAIインフラ選択肢が増える一方で、冷却技術などハードウェアレベルの知識も重要になるでしょう。","source":"Neo Tech World","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQH65Cu_ZjRficMBFzlQMrR9kf1ckeHUHOBF5NP4cI8CsVGgz31LO55mcA7cm68SNewJRs_HatbOL6-FYAj2XV7EqS6EjwATz7BA3m7t8qRYipXJC2T2jwqz6R0yeelItbLI9sVVXzu7V6lY=","impact":"high","tags":["AIインフラ","GPU","AMD","NVIDIA","冷却技術"]},{"title":"隠しカメラ発見器『カメラバスター』がエアリアから7月29日に発売","summary":"株式会社エアリアは、赤外線とレンズ反射を検知して隠しカメラを見つける携帯型カメラ発見器「camera buster（カメラバスター）」を2026年7月29日に発売すると発表しました。市場想定売価は税込2,600円前後です。ホテルやレンタルスペースなどで隠しカメラの有無を簡易的に探せるほか、ドアの開閉などを察知する振動検知モードも搭載されており、旅行や出張時の簡易セキュリティ、置き引き対策の補助としても活用できます。開発者への直接的な影響は小さいですが、プライバシー保護技術やセキュリティデバイスへの関心が高まっていることを示唆しています。","source":"株式会社エアリア","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHd3m8nHFYAjAgFjBrXr9C-3nDa9ka6ElBJESxo9jb32ZJ1Na51sCmhXKcXKp3HKpWdUQCH5cxigR_2BdgF8Jxz591kuV4Bss1__8_c4S4amlRorRwtLbk1hJ509N9PWmyC8o77prBTwX1v-j","impact":"low","tags":["セキュリティ","プライバシー","ガジェット","防犯"]},{"title":"KDDIとGoogle AI Futures Fundが国内AIスタートアップ向け協調支援プログラムを開始","summary":"KDDIは2026年7月28日、Googleの投資ファンド「Google AI Futures Fund」と協力し、日本国内のAI分野スタートアップを対象とした「AIスタートアップ支援プログラム by KDDI &amp; Google AI Futures Fund」の開始に合意しました。このプログラムでは、両社による資金提供に加え、GoogleのAIモデルへの早期アクセス、Google CloudやGPUなどのAIインフラ、専門的な技術支援が提供されます。これにより、日本発の革新的なAI技術やサービスの実装を推進し、スタートアップエコシステムの発展に貢献することが期待されます。国内のAI開発者やスタートアップにとっては、資金調達や技術リソースへのアクセスが大幅に改善される大きなチャンスとなるでしょう。","source":"KDDI","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFm-LlCQ5r7ZzTcUMjYI9HHxoWXhb3tZhZSeeca0vYeHhlGu2NdTSU1sq2rKzbJvwWln5cATf8l-qgQNBd4cWZuYQcdOIeQLWm-PZIJDPV1zQWOrX3yATIqyT8UNojFjGI3H2v2TsxvFyLgmRuImDE1G_ALhSX","impact":"high","tags":["AIスタートアップ","資金調達","Google Cloud","エコシステム"]}]}];
const ARCHIVE_BASE = './archive/';

  const el = document.getElementById('tabs');

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
