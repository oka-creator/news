<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年11月28日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年11月28日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"新しいマルチモーダルLLMの商用利用が本格化","summary":"主要なAI開発企業から、テキストだけでなく画像、音声、動画を統合的に理解・生成できるマルチモーダルLLMの商用版がリリースされ、その活用が加速しています。特に、コンテンツ制作、デザイン、教育といった多岐にわたる分野での導入が進んでいます。ユーザーの意図をより正確に汲み取り、複雑なタスクをこなせるようになった点が、この技術の大きな進歩として注目されています。これにより、AIの応用範囲が飛躍的に広がり、開発者にとっては新たなビジネスチャンスが生まれるでしょう。","source":"AI開発動向レポート","url":"https://www.google.com/search?q=%E3%83%9E%E3%83%AB%E3%83%81%E3%83%A2%E3%83%BC%E3%83%80%E3%83%ABLLM%E5%95%86%E7%94%A8%E5%88%A9%E7%94%A8%E6%9C%AC%E6%A0%BC%E5%8C%96","impact":"high","tags":["マルチモーダルAI","LLM","コンテンツ生成","AI活用"]},{"title":"中小企業向けに特化した軽量LLMの登場","summary":"大手クラウドプロバイダーが、中小企業が自社のデータでファインチューニングしやすいように設計された、より軽量でコスト効率の高いLLMの提供を開始しました。これにより、限られたリソースしか持たない中小企業でも、AI導入の敷居が大きく下がっています。顧客対応の自動化や社内文書の効率化など、具体的な業務改善への活用が期待されています。個人開発者やインディーハッカーにとっても、中小企業向けのソリューション開発が新たな市場となるでしょう。","source":"クラウドプロバイダーニュース","url":"https://www.google.com/search?q=%E4%B8%AD%E5%B0%8F%E4%BC%81%E6%A5%AD%E5%90%91%E3%81%91%E8%BB%BD%E9%87%8FLLM%E7%99%BB%E5%A0%B4","impact":"medium","tags":["中小企業AI","軽量LLM","AI導入","業務効率化"]},{"title":"AI倫理ガイドラインの国際標準化に向けた動きが活発化","summary":"生成AIの急速な進化に伴い、誤情報拡散や著作権侵害といった懸念が高まる中、主要国政府および国際機関が協力し、AIの公平性、透明性、説明責任を確保するための国際的な倫理ガイドライン策定に向けた具体的な議論が進展しています。これにより、AI開発企業は国際的な基準に準拠した開発が求められるようになり、より信頼性の高いAIシステムの構築が促されます。開発者にとっては、倫理的側面を考慮した設計が不可欠となるでしょう。","source":"国際AI政策フォーラム","url":"https://www.google.com/search?q=AI%E5%80%AB%E7%90%86%E3%82%AC%E3%82%A4%E3%83%89%E3%83%A9%E3%82%A4%E3%83%B3%E5%9B%BD%E9%9A%9B%E6%A8%99%E6%BA%96%E5%8C%96","impact":"high","tags":["AI倫理","国際標準","ガバナンス","著作権"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード/ローコードプラットフォームのAI統合が加速","summary":"個人開発者やインディーハッカーに人気のノーコード/ローコード開発ツールが、生成AI機能を標準で搭載し始めています。これにより、自然言語での指示だけでアプリケーションのプロトタイプを生成したり、データ分析レポートを自動作成したりすることが可能になりました。開発サイクルが劇的に短縮され、アイデアを素早く形にできる環境が整っています。これは、非エンジニアでも高度なアプリケーションを開発できる可能性を広げるものです。","source":"開発者コミュニティレポート","url":"https://www.google.com/search?q=%E3%83%8E%E3%83%BC%E3%82%B3%E3%83%BC%E3%83%89%E3%83%AD%E3%83%BC%E3%82%B3%E3%83%BC%E3%83%89AI%E7%B5%B1%E5%90%88","impact":"medium","tags":["ノーコード","ローコード","個人開発","AI開発"]},{"title":"マイクロSaaS市場におけるニッチ特化型ツールの成功事例が増加","summary":"特定の業界や業務に特化したマイクロSaaSが、個人開発者によって次々と成功を収めています。特に、AIを活用して特定の課題を解決するようなツール、例えば特定のSNS投稿を最適化するAIアシスタントや専門分野の論文要約ツールなどが注目を集めています。これらのツールは、従来のSaaSでは満たしきれなかったニッチなニーズを捉え、高収益を上げています。個人開発者にとっては、特定の課題に深くコミットすることで大きな成功を収めるチャンスが広がっています。","source":"SaaSトレンド分析","url":"https://www.google.com/search?q=%E3%83%9E%E3%82%A4%E3%82%AF%E3%83%ADSaaS%E3%83%8B%E3%83%83%E3%83%81%E7%89%B9%E5%8C%96%E3%83%84%E3%83%BC%E3%83%AB%E6%88%90%E5%8A%9F","impact":"medium","tags":["マイクロSaaS","ニッチ市場","個人事業","AIツール"]},{"title":"Web3技術を活用したコンテンツ収益化の新たな潮流","summary":"ブロックチェーン技術を活用し、個人開発者が作成したデジタルコンテンツやアプリケーションの収益化を支援するプラットフォームが台頭しています。NFTを利用したデジタルアセットの所有権証明や、分散型自律組織（DAO）を通じた共同開発・収益分配など、クリエイターがより直接的に利益を得られる仕組みが注目されています。これにより、中間業者を介さずに収益を得る機会が増え、個人開発者にとって新たな収益モデルが確立されつつあります。Web3技術は、クリエイターエコノミーの未来を形作る重要な要素となるでしょう。","source":"Web3エコノミー調査","url":"https://www.google.com/search?q=Web3%E6%8A%80%E8%A1%93%E3%82%B3%E3%83%B3%E3%83%86%E3%83%B3%E3%83%84%E5%8F%8E%E7%9B%8A%E5%8C%96","impact":"medium","tags":["Web3","NFT","DAO","クリエイターエコノミー"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"次世代XRデバイスのコンシューマー市場への本格投入","summary":"複数の大手テック企業から、より軽量で高性能なAR/VRデバイスが一般消費者向けに発売され、コンシューマー市場への本格投入が始まりました。これらのデバイスは、ゲームだけでなく、リモートワーク、教育、フィットネスなど、日常生活の様々な場面での活用が期待されています。特に、既存のスマートフォンやPCとの連携が強化され、シームレスな体験が提供される点が特徴です。開発者にとっては、新たなプラットフォーム上でのアプリケーション開発が大きな機会となるでしょう。","source":"XR市場レポート","url":"https://www.google.com/search?q=%E6%AC%A1%E4%B8%96%E4%BB%A3XR%E3%83%87%E3%83%90%E3%82%A4%E3%82%B9%E3%82%B3%E3%83%B3%E3%82%B7%E3%83%A5%E3%83%BC%E3%83%9E%E3%83%BC%E5%B8%82%E5%A0%B4%E6%9C%AC%E6%A0%BC%E6%8A%95%E5%85%A5","impact":"high","tags":["XR","AR/VR","コンシューマーテック","メタバース"]},{"title":"量子コンピューティングのクラウドサービスが実用レベルへ進化","summary":"量子コンピューティングの技術がさらに進歩し、クラウドベースで利用できる量子コンピューターの性能が向上しています。これにより、特定の最適化問題や新素材開発など、従来のスーパークラスターでも困難だった計算を、企業や研究機関が手軽に試せるようになりました。実用化への道筋が明確に見え始め、様々な分野での応用が期待されています。開発者にとっては、この最先端技術をクラウド経由で利用し、新たなソリューションを模索する機会が広がっています。","source":"量子技術研究会","url":"https://www.google.com/search?q=%E9%87%8F%E5%AD%90%E3%82%B3%E3%83%B3%E3%83%94%E3%83%A5%E3%83%BC%E3%83%86%E3%82%A3%E3%83%B3%E3%82%B0%E3%82%AF%E3%83%A9%E3%82%A6%E3%83%89%E3%82%B5%E3%83%BC%E3%83%93%E3%82%B9%E5%AE%9F%E7%94%A8%E5%8C%96","impact":"high","tags":["量子コンピューティング","クラウドサービス","先端技術","研究開発"]},{"title":"サイバーセキュリティにおけるAI駆動型防御システムの普及","summary":"AIを活用したサイバーセキュリティソリューションが、企業や組織において標準的な防御策として広く導入されています。これらのシステムは、未知の脅威をリアルタイムで検知し、自動で対応する能力が飛躍的に向上しました。人手による監視だけでは追いつかない高度なサイバー攻撃への対抗策として不可欠な存在となっています。開発者にとっては、AIとセキュリティ技術を組み合わせた新たな防御策やツールの開発が求められるでしょう。","source":"サイバーセキュリティ動向","url":"https://www.google.com/search?q=%E3%82%B5%E3%82%A4%E3%83%90%E3%83%BC%E3%82%BB%E3%82%AD%E3%83%A5%E3%83%AA%E3%83%86%E3%82%A3AI%E9%98%B2%E5%BE%A1%E3%82%B7%E3%82%B9%E3%83%86%E3%83%A0%E6%99%AE%E5%8F%8A","impact":"high","tags":["サイバーセキュリティ","AI防御","脅威検知","情報保護"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
