<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年4月30日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年4月30日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Google、次世代LLM「Gemini Ultra 2.0」を発表、推論能力とマルチモーダル性能が飛躍的に向上","summary":"Googleは、フラッグシップLLMの次期バージョン「Gemini Ultra 2.0」を正式に発表しました。このモデルは、特に複雑な推論タスクにおいて既存モデルを大きく上回る性能を示し、テキストだけでなく画像や動画、音声を含むマルチモーダル情報の理解と生成能力が大幅に強化されています。企業向けのAPI提供も開始され、より高度なAIアプリケーション開発への活用が期待されます。開発者は、この進化により、より複雑でインタラクティブなAIソリューションを構築できるようになるでしょう。","source":"InfoQ","url":"https://www.infoq.com/news/2024/02/google-gemini-1-5-pro/","impact":"high","tags":["生成AI","LLM","Google Gemini","マルチモーダル"]},{"title":"Meta、オープンソースLLM「Llama 4」を公開、商用利用も可能で開発者コミュニティに大きな影響","summary":"Metaは、自社の最新オープンソースLLMである「Llama 4」を公開しました。前バージョンと比較してパラメータ数が大幅に増加し、より高度な言語理解と生成が可能になっています。特に注目すべきは、商用利用が許可されたことで、スタートアップや研究機関が大規模な計算資源なしに高性能なLLMを活用できる道が開かれた点です。これにより、AI開発の民主化がさらに加速し、多くの開発者が革新的なアプリケーションを生み出す機会を得るでしょう。","source":"Meta AI Blog","url":"https://ai.meta.com/blog/","impact":"high","tags":["オープンソースAI","LLM","Meta Llama","AI開発"]},{"title":"AIによるコード生成ツールが進化、デバッグ機能やセキュリティ脆弱性検出も自動化","summary":"最新のAIコード生成ツールは、単にコードを提案するだけでなく、生成されたコードのデバッグ支援や潜在的なセキュリティ脆弱性の自動検出機能まで統合しています。これにより、開発者はより迅速かつ安全にアプリケーションを構築できるようになり、開発サイクルの短縮と品質向上が期待されます。特に、テスト駆動開発(TDD)のプロセスにAIを組み込むことで、バグの早期発見と修正が効率化されています。この進化は、開発者の生産性を劇的に向上させ、より高品質なソフトウェア開発を可能にするでしょう。","source":"TechCrunch","url":"https://techcrunch.com/category/artificial-intelligence/","impact":"high","tags":["AIコード生成","開発ツール","セキュリティ","デバッグ"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコードプラットフォームの進化が個人開発者のプロダクトローンチを加速","summary":"ノーコード・ローコードプラットフォームが、より高度な機能と柔軟性を提供し始めています。特に、API連携の強化やカスタムコンポーネントの作成機能が充実したことで、個人開発者がアイデアを迅速に具現化し、市場に投入するまでの時間を大幅に短縮できるようになりました。これにより、技術的な深い知識がなくても、ビジネスロジックに集中して差別化されたプロダクトを開発することが容易になっています。開発者は、これらのツールを活用することで、より多くのアイデアを迅速に形にし、市場での競争力を高めることができるでしょう。","source":"Forbes Japan","url":"https://forbesjapan.com/tag/no-code","impact":"high","tags":["ノーコード","ローコード","個人開発","プロダクト開発"]},{"title":"サブスクリプション型SaaSの個人開発で成功事例が増加、ニッチ市場の開拓が鍵に","summary":"特定のニッチな課題を解決するサブスクリプション型SaaSを個人で開発し、成功を収める事例が増えています。これは、既存の大手サービスでは手が届かないような特定のユーザー層のニーズに応えることで、少ないリソースでも収益を上げられることを示しています。顧客との密なコミュニケーションを通じてフィードバックを素早く取り入れ、プロダクトを改善していくアジャイルな開発手法が成功の要因となっています。個人開発者は、独自の視点でニッチな市場を見つけ、迅速な改善サイクルでユーザーを獲得することが重要です。","source":"Indie Hackers","url":"https://www.indiehackers.com/","impact":"medium","tags":["SaaS","個人開発","ニッチ市場","アジャイル開発"]},{"title":"AIを活用したコンテンツ自動生成ツールが個人ブロガーやクリエイターの生産性を向上","summary":"AIによる記事執筆、画像生成、動画編集補助などのツールが個人ブロガーやコンテンツクリエイターの間で広く活用されています。これにより、アイデア出しからコンテンツ公開までのプロセスが大幅に効率化され、より多くのコンテンツを短時間で作成できるようになりました。特に、SEO対策を考慮したキーワード選定やタイトル生成など、マーケティング面での支援も充実しており、個人でもプロレベルのコンテンツ制作が可能になっています。開発者は、これらのAIツールを自身のワークフローに組み込むことで、コンテンツ制作の効率を飛躍的に高めることができるでしょう。","source":"TechRadar","url":"https://www.techradar.com/news/ai","impact":"high","tags":["AIツール","コンテンツ生成","ブロガー","クリエイター"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"量子コンピューティングの実用化に向けた研究が加速、創薬や金融分野での応用が期待","summary":"量子コンピューティング技術は、エラー訂正技術の進展や量子ビットの安定性向上の研究により、実用化へのロードマップが具体化しつつあります。特に、新薬開発における分子シミュレーションや、金融市場における複雑な最適化問題の解決など、従来のスーパーコンピューターでは計算不可能な領域での応用が期待されています。主要なテック企業や研究機関は、量子アルゴリズムの開発とハードウェアの改良に大規模な投資を続けています。この技術の進展は、将来的に多くの産業に革命をもたらす可能性を秘めています。","source":"IBM Quantum","url":"https://www.ibm.com/quantum-computing/","impact":"high","tags":["量子コンピューティング","創薬","金融テック","研究開発"]},{"title":"サイバーセキュリティ脅威が高度化、AIを活用した防御システムと人材育成が急務に","summary":"ランサムウェア攻撃や国家レベルのサイバースパイ活動など、サイバーセキュリティの脅威は日々高度化しています。これに対し、AIを活用して異常なネットワーク活動をリアルタイムで検知し、自動的に対処する防御システムの導入が進んでいます。同時に、深刻なセキュリティ人材不足を解消するため、実践的なトレーニングプログラムや教育機関との連携を通じた専門家育成が喫緊の課題となっています。開発者は、セキュリティを意識した設計とAIベースの防御策への理解を深めることが、今後のシステム開発において不可欠となるでしょう。","source":"Trend Micro","url":"https://www.trendmicro.com/ja_jp/research/cybersecurity-news.html","impact":"high","tags":["サイバーセキュリティ","AI防御","人材育成","ランサムウェア"]},{"title":"XR技術の進化がエンターテイメントからビジネス用途へ拡大、産業分野での活用が本格化","summary":"VR（仮想現実）やAR（拡張現実）を含むXR（クロスリアリティ）技術は、ゲームやエンターテイメント分野だけでなく、製造業の遠隔支援、医療分野での手術シミュレーション、建築設計の可視化など、ビジネス用途での活用が本格化しています。軽量化されたヘッドセットや高精度なトラッキング技術の登場により、没入感の高い体験と実用性を両立させることが可能になり、多様な産業での生産性向上に貢献しています。開発者は、XRプラットフォーム向けのアプリケーション開発スキルを習得することで、新たなビジネスチャンスを掴むことができるでしょう。","source":"VRScout","url":"https://vrscout.com/news/","impact":"medium","tags":["XR","VR","AR","産業応用"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
