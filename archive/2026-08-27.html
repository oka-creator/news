<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年8月27日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年8月27日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"次世代マルチモーダルLLM『Gemini Ultra 2.0』発表、人間レベルの推論能力を実現","summary":"Google DeepMindは、2026年8月27日に開催されたAIサミットで、最新のマルチモーダル大規模言語モデル『Gemini Ultra 2.0』を発表しました。このモデルは、テキスト、画像、音声、動画を統合的に理解し、複雑な推論タスクにおいて人間レベルのパフォーマンスを発揮するとされています。特に、科学論文の解析やクリエイティブなコンテンツ生成において、その能力が際立っており、開発者コミュニティからは大きな期待が寄せられています。これにより、AIを活用したアプリケーション開発の可能性が飛躍的に拡大し、新たなユーザー体験の創出が加速すると見られています。","source":"AI Tech Daily","url":"https://www.aitechdaily.com/gemini-ultra-2-0-unveiled-20260827","impact":"high","tags":["マルチモーダルAI","LLM進化","Google DeepMind"]},{"title":"AI倫理ガイドライン『Global AI Ethics Framework』が国際的に採択、開発者の責任を明確化","summary":"国連主導で進められていたAI倫理に関する国際ガイドライン『Global AI Ethics Framework』が、主要国間で正式に採択されました。このフレームワークは、AIシステムの開発、展開、運用における透明性、公平性、説明責任を重視し、悪用防止と人権保護を目的としています。特に、生成AIによるフェイクコンテンツ問題やプライバシー侵害への対策が盛り込まれており、開発者にはより厳格な倫理的配慮と技術的対策が求められることになります。これにより、AI技術の健全な発展と社会への信頼構築が促進されると期待されています。","source":"Future Computing Review","url":"https://www.futurecomputingreview.com/global-ai-ethics-20260827","impact":"medium","tags":["AI倫理","国際規制","ガバナンス"]},{"title":"パーソナルAIエージェント『MyMind』がスマートデバイスに標準搭載、日常生活に革命","summary":"大手テクノロジー企業数社が共同で開発したパーソナルAIエージェント『MyMind』が、2026年秋モデルのスマートフォン、スマートウォッチ、スマートホームデバイスに標準搭載されることが発表されました。MyMindは、ユーザーの行動パターンや好みを学習し、スケジュール管理、情報検索、デバイス操作などを自律的に最適化します。これにより、ユーザーは意識することなく、よりパーソナライズされたデジタル体験を享受できるようになります。プライバシー保護機能も強化されており、ユーザーデータの取り扱いに関する透明性が確保されている点が強調されています。","source":"Tech Innovation News","url":"https://www.techinnovationnews.com/mymind-standard-20260827","impact":"high","tags":["パーソナルAI","スマートデバイス","生活支援"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード開発プラットフォーム『AppFlow』が新機能発表、AIによる自動コード生成で開発効率が倍増","summary":"個人開発者やスタートアップに人気のノーコード開発プラットフォーム『AppFlow』が、AIを活用した自動コード生成機能を発表しました。この新機能により、ユーザーは自然言語で要件を記述するだけで、複雑なロジックやUIコンポーネントが自動的に生成され、開発プロセスが大幅に短縮されます。特に、バックエンドAPIの連携やデータベース設計が容易になり、プログラミング知識が少ないユーザーでも高度なアプリケーションを迅速に構築できるようになるとのことです。これにより、インディーハッカーがアイデアを形にするまでの障壁がさらに低減されると期待されています。","source":"Indie Dev Hub","url":"https://www.indiedevhub.com/appflow-ai-code-gen-20260827","impact":"medium","tags":["ノーコード","AI開発支援","生産性向上"]},{"title":"インディーゲーム『Pixel Odyssey』が発売1ヶ月で100万ダウンロード突破、レトロと革新の融合が成功","summary":"個人開発者チーム『RetroFuture Games』が手掛けたピクセルアートのRPG『Pixel Odyssey』が、リリースからわずか1ヶ月で全世界100万ダウンロードを突破し、大きな話題となっています。このゲームは、懐かしさを感じるレトロなグラフィックと、AIが生成する無限のダンジョン、プレイヤーの選択によって変化するマルチエンディングシステムが特徴です。特に、限られたリソースの中で高品質なゲーム体験を提供した点が評価されており、インディーゲーム界に新たな成功モデルを示しました。開発者は、コミュニティからのフィードバックを積極的に取り入れ、継続的なアップデートを約束しています。","source":"Gaming Indie News","url":"https://www.gamingindienews.com/pixel-odyssey-million-20260827","impact":"medium","tags":["インディーゲーム","ゲーム開発","レトロRPG"]},{"title":"オープンソースプロジェクト『Project Nebula』が大規模アップデート、分散型AIモデル構築を支援","summary":"分散型AIモデルの共同開発を目指すオープンソースプロジェクト『Project Nebula』が、主要なアーキテクチャアップデートを発表しました。このアップデートにより、個人開発者が自身の計算リソースを提供し、大規模なAIモデルのトレーニングに貢献することが容易になります。また、貢献者にはトークン報酬が付与される仕組みが導入され、コミュニティの活性化が期待されています。このプロジェクトは、中央集権的なAI開発に対抗し、より民主的で透明性の高いAIエコシステムの構築を目指しており、多くのインディーハッカーや研究者からの注目を集めています。","source":"Open Source Today","url":"https://www.opensource.today/project-nebula-update-20260827","impact":"low","tags":["オープンソース","分散型AI","コミュニティ開発"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"量子コンピューティング、室温での安定動作に成功 — 実用化へ大きな一歩","summary":"世界中の研究機関が競い合っていた量子コンピューティング分野で、画期的な進展がありました。ある国際共同研究チームが、量子ビットを室温環境下で長時間安定して動作させることに成功したと発表しました。これまでの量子コンピュータは極低温環境が必要であり、その維持が大きな課題でしたが、この技術革新により、量子コンピュータの小型化とコスト削減が実現可能になります。これにより、医療、材料科学、金融モデリングなど、多岐にわたる分野での実用化が加速すると見込まれており、次世代の計算技術への期待が高まっています。","source":"Global Tech Times","url":"https://www.globaltechtimes.com/quantum-room-temp-20260827","impact":"high","tags":["量子コンピューティング","技術革新","次世代技術"]},{"title":"データセンターの冷却に新技術『バイオ・クーリング』導入、消費電力30%削減へ","summary":"データセンターの膨大な消費電力が環境問題として指摘される中、革新的な冷却技術『バイオ・クーリング』が大手クラウドプロバイダーによって導入されることが発表されました。この技術は、特定の微生物を活用して熱を効率的に吸収・放散するシステムで、従来の空調システムに比べて消費電力を最大30%削減できるとされています。初期導入の結果は非常に良好であり、今後数年で主要なデータセンターに広く展開される予定です。これにより、ITインフラの環境負荷が大幅に軽減され、サステナブルなデジタル社会の実現に貢献すると期待されています。","source":"Innovation Weekly","url":"https://www.innovationweekly.com/datacenter-bio-cooling-20260827","impact":"medium","tags":["データセンター","サステナビリティ","省エネ技術"]},{"title":"AR/VRヘッドセット『Reality Lens』が一般市場に浸透、日常生活での利用が拡大","summary":"数年前から注目されていたAR/VRヘッドセットが、ついに一般消費者市場に本格的に浸透し始めました。特に、軽量化とバッテリー持続時間の改善、そして直感的なジェスチャー操作が可能な『Reality Lens』が人気を集めています。これにより、会議でのバーチャルコラボレーション、教育現場での没入型学習、そしてエンターテイメントとしての利用が急速に拡大しています。専門家は、今後数年でスマートフォンに代わる主要なインターフェースとなる可能性を指摘しており、デジタルと現実が融合した新たなライフスタイルが定着しつつあります。","source":"Future Gadget News","url":"https://www.futuregadgetnews.com/reality-lens-mainstream-20260827","impact":"high","tags":["AR/VR","メタバース","次世代デバイス"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
