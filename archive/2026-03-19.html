<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月20日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年3月20日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"OpenAI、次世代モデル「GPT-5」の開発状況を一部示唆か","summary":"OpenAIが次世代大規模言語モデル『GPT-5』の進捗を関係者向けに共有したと報じられています。具体的な性能やリリース時期は不明ながら、既存モデルを大きく上回る推論能力やマルチモーダル機能の強化が期待されています。特に、より複雑なタスクの理解と実行、人間との自然な対話能力の向上が焦点であり、AIのビジネス応用をさらに加速させる可能性を秘めています。開発者にとっては、新たなAI機能を用いた革新的なアプリケーション開発の機会が広がるでしょう。","source":"業界レポート","url":"https://www.google.com/search?q=OpenAI+GPT-5+development+progress","impact":"high","tags":["GPT-5","LLM","OpenAI","AI開発"]},{"title":"Google DeepMind、エージェントAIの新たなブレークスルーを発表","summary":"Google DeepMindは、複数のツールを自律的に利用し複雑な目標を達成するエージェントAIの新しいフレームワークを発表しました。このAIは、インターネット検索やコード生成、画像編集ツールなどを組み合わせて使いこなし、タスクを効率的に完了できるとされています。これは、LLMが単一タスクに特化するのではなく、より汎用的な問題解決能力を持つAIへの進化を示す重要な一歩です。開発者は、より高度な自動化や複雑なワークフローをAIに任せられるようになるでしょう。","source":"業界レポート","url":"https://www.google.com/search?q=Google+DeepMind+agent+AI+framework","impact":"high","tags":["エージェントAI","Google DeepMind","汎用AI","AIツール"]},{"title":"企業向けAIプラットフォーム、カスタマイズ性とセキュリティを強化","summary":"主要なクラウドプロバイダーが、企業向け生成AIプラットフォームにおいて、データプライバシーとセキュリティを強化し、企業独自のデータに基づいたモデルのカスタマイズ機能を拡充していると報じられています。これにより、企業は機密情報を安全に保ちながら、自社のビジネスニーズに特化したAIモデルを構築・運用できるようになります。特に、法規制の厳しい業界でのAI導入を後押しする動きとして注目され、開発者はよりセキュアでカスタマイズ可能なAIソリューションを構築できるようになります。","source":"業界レポート","url":"https://www.google.com/search?q=enterprise+AI+platform+customization+security","impact":"medium","tags":["企業AI","クラウドAI","セキュリティ","データプライバシー"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコードツールを活用した個人開発が加速","summary":"近年、AdaloやBubble、Webflowといったノーコード・ローコード開発ツールを用いた個人開発プロジェクトが急増しています。プログラミングの専門知識がなくてもアイデアを素早く形にできるこれらのツールは、インディーハッカーが市場のニーズに合わせたニッチなSaaSやモバイルアプリを短期間でリリースすることを可能にしています。これにより、個人開発者がより多様な分野で活躍する機会が広がり、技術的な障壁が低減されています。","source":"業界レポート","url":"https://www.google.com/search?q=no-code+low-code+individual+development+trends","impact":"high","tags":["ノーコード","ローコード","個人開発","SaaS"]},{"title":"マイクロSaaSの成功事例、ニッチ市場の開拓が鍵に","summary":"特定の課題に特化した小規模なSaaS（マイクロSaaS）が、個人開発者の間で成功を収めています。大規模な投資を必要とせず、特定の顧客層の深いニーズに応えることで、持続的な収益を上げている事例が増加しています。SEOツール、SNS管理補助、特定の業界向けレポーティングツールなど、ニッチな市場を見つけ出し、そこに特化したソリューションを提供することが成功の鍵です。これは、個人開発者が少ないリソースで市場に参入し、収益を上げるための有効な戦略を示しています。","source":"業界レポート","url":"https://www.google.com/search?q=micro-SaaS+success+niche+market+examples","impact":"medium","tags":["マイクロSaaS","ニッチ市場","個人事業","収益化"]},{"title":"AIを活用した個人開発ツールの登場","summary":"個人開発者の間で、AIを活用した開発支援ツールが注目を集めています。コードの自動生成、デバッグ支援、UI/UXデザインの提案など、開発プロセスを効率化するAIツールが次々と登場しています。これにより、個人開発者はより創造的な作業に集中できるようになり、開発期間の短縮と品質向上が期待されています。AIは、個人開発者が直面する技術的な課題を軽減し、より複雑なプロジェクトへの挑戦を可能にするでしょう。","source":"業界レポート","url":"https://www.google.com/search?q=AI+tools+for+individual+developers+productivity","impact":"high","tags":["AI開発支援","開発効率化","個人開発","AIツール"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"量子コンピューティングの商用化に向けた進展","summary":"量子コンピューティング分野では、エラー訂正技術の改善や、より安定した量子ビットの実現に向けた研究開発が加速しています。IBMやGoogleなどの大手企業は、商用利用可能な量子コンピューターの実用化を目指し、新たなパートナーシップや技術発表を続けています。金融、医療、素材科学など、特定の分野での応用が期待されており、実証実験の段階から具体的なソリューション開発へと移行しつつあります。これは、将来の計算能力を根本的に変える可能性を秘めています。","source":"業界レポート","url":"https://www.google.com/search?q=quantum+computing+commercialization+progress+2026","impact":"high","tags":["量子コンピューティング","商用化","IBM","Google"]},{"title":"サイバーセキュリティ脅威の高度化と対策の強化","summary":"ランサムウェア攻撃やサプライチェーン攻撃など、サイバーセキュリティの脅威は日々高度化しています。これに対し、企業や政府はAIを活用した脅威検知システムや、ゼロトラストアプローチに基づいたセキュリティ対策の導入を急いでいます。特に、生成AIを悪用したフィッシング詐欺やディープフェイクによるなりすましなど、新たな脅威への対応が喫緊の課題となっています。開発者は、最新のセキュリティ技術とAIを活用した防御策を常に学び、システムに組み込む必要があります。","source":"業界レポート","url":"https://www.google.com/search?q=cybersecurity+threats+AI+zero+trust+2026","impact":"high","tags":["サイバーセキュリティ","ランサムウェア","AIセキュリティ","ゼロトラスト"]},{"title":"サステナブルテクノロジーへの投資が加速","summary":"環境問題への意識の高まりから、テクノロジー業界ではサステナブルな技術への投資が急速に拡大しています。再生可能エネルギーの効率化技術、CO2排出量削減に貢献するAIソリューション、循環型経済を促進するプラットフォームなどが注目を集めています。特に、データセンターの省エネルギー化や、サプライチェーン全体での環境負荷低減を目指す取り組みが活発化しており、ESG投資の観点からも重要視されています。開発者は、環境に配慮した技術やソリューションの設計が求められるようになるでしょう。","source":"業界レポート","url":"https://www.google.com/search?q=sustainable+technology+investment+ESG+tech","impact":"medium","tags":["サステナブルテック","ESG投資","再生可能エネルギー","環境技術"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
