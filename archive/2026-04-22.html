<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年4月23日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

<script>

igh","tags":["Google広告","AIマーケティング","検索広告","強制移行"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"パズルADV『Save My Scrap』がSteamで配信開始","summary":"個人開発者の安納ウニオ氏が手掛けるパズルアドベンチャーゲーム『Save My Scrap（セイブ・マイ・スクラップ）』のSteam版が配信されました。退廃的で美しいサイバーパンクアートと心揺さぶる物語が特徴で、プレイヤーはアンドロイドの修理士となり、パズルを通じてアンドロイドの失われた記憶の断片を繋ぎ合わせていきます。インディーゲーム開発者にとって、Steamでのリリースは作品を世界に発信する重要なステップであり、その成功は他の個人開発者にも大きな刺激となるでしょう。","source":"Steam","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGUaZelQrXZgm-YuEUrZRlR18ZfvgTc1JnBuf9CeSUz740ahdwvW2q9r2dCoJ6RGvMhfCzeGmrBnrDvZBvf4uyE0SNBySStaE3RgE4fLSpcAeygFekaimb5a2HWTUimYswO9E1hMzGaRacrkdowwf5uYSA=","impact":"low","tags":["インディーゲーム","Steam","パズルアドベンチャー","個人開発"]},{"title":"AIコーディングツールに約7割が不満、意図通りに出ない・精度低いとの声","summary":"＠ITの調査によると、AIコーディングツールの利用者の約7割が不満を抱えていることが明らかになりました。具体的には、「意図通りに出ない」「精度が低い」といった声が多く、AIを開発に活用する上での課題が浮き彫りになっています。これは、個人開発者やインディーハッカーがAIツールを導入する際に考慮すべき実用的な情報と言えるでしょう。AI技術の進化は著しいものの、現状では人間の介入と検証が不可欠であることが示唆されています。","source":"＠IT","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGeYp-rEWMOh5lTErHyJusf_tTpd7JmiSRQHKO4LtiOf3eS-Hm8CAPH9EVOTwmCrh2vHOKOTpL6eErx51jSQEElO-0ewCXL6LPc1Q02pEwrRP4hK6MkjmgJmc1l_CzvpxAJ4grNXZctX5mvE_vD","impact":"medium","tags":["AIコーディング","開発ツール","生産性","課題"]},{"title":"AI駆動開発の普及で非エンジニアが1カ月で技術者へ転換、「越境人材」育成が加速","summary":"自律型AIエージェント「Devin」の日本市場本格参入により、ソフトウェア開発の下流工程をAIが担い、上流工程を人間が担当する「AI駆動開発」が実務レベルで定着し始めています。TOKIUMの事例では、ビジネス職の新卒社員がAIを活用することでわずか1カ月でエンジニア職へ転換し、プロトタイプ開発を行う「越境人材」として活躍しています。この動向は、コーディングの技術的障壁がAIによって取り払われ、個人のスキルアップやキャリアチェンジの可能性を大きく広げることを示しており、個人開発者にとっても新たな学習機会や協業の形を提示します。","source":"TOKIUM事例","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEnAOAkHup3fiR4tjRYAkV61I8zmnwaBPh9XaoZ4bVsi13lSx9-1rKEaq5tGKLZB6UqbQ5HHXI2_KBqPLBwHh_Yfora5jummOvrFVutMblTX9dXa7L-j-lOIQcdfIQfqILBdzoQO5g=","impact":"high","tags":["AI駆動開発","キャリアチェンジ","越境人材","Devin"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"HCLTech、2026年度売上高は3.9%増、Advanced AI需要が成長を牽引","summary":"グローバルテクノロジー企業HCLTechは、2026年3月31日を期末とする2026年度通期決算を発表し、売上高が恒常為替ベースで3.9%増の147億ドルに達したことを明らかにしました。この成長は、特にAdvanced AIの需要拡大と新たなAI主導型サービスの提供が市場で浸透したことが牽引しており、第4四半期におけるAdvanced AIの年換算売上高は6億2,000万米ドルを突破しました。この結果は、AI技術が企業の収益成長に直結する主要なドライバーとなっていることを示しており、テック業界全体のAIへの投資と開発が今後も加速することを示唆しています。","source":"HCLTech","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQE9aBF3CwMzc8IgcIjcnHJeyDEalxSXMSSkvqkxIVnpyd19MipK9juzzQPI6mISDkppLl3yFZdQ0YQbkhHRGD1V-a30tApU2V-jhhehWI7RV2Sirr1KBogbLDJzRR2okDa311YCKoK169DR7CuclRnSfJZiz6YG5l5zXSUD9hE3WqjepATF1NRjcfLizayy2A==","impact":"high","tags":["AI市場","企業業績","テクノロジー投資","HCLTech"]},{"title":"「侵入4分後にデータが消える」AI悪用で加速するサイバー攻撃にセキュリティチームはどう対抗すべきか","summary":"AIを悪用したサイバー攻撃が高度化し、データ侵入から消去までの時間がわずか4分にまで短縮されているという報告が＠ITで取り上げられました。これにより、従来のセキュリティ対策では追いつかない状況が生まれており、セキュリティチームは、攻撃の高速化に対応するための新たな戦略と技術の導入が急務となっています。開発者や企業は、AIを活用した防御策の強化や、より迅速な検知・対応システムの構築に注力する必要があり、サイバーセキュリティのパラダイムシフトが求められます。","source":"＠IT","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGeYp-rEWMOh5lTErHyJusf_tTpd7JmiSRQHKO4LtiOf3eS-Hm8CAPH9EVOTwmCrh2vHOKOTpL6eErx51jSQEElO-0ewCXL6LPc1Q02pEwrRP4hK6MkjmgJmc1l_CzvpxAJ4grNXZctX5mvE_vD","impact":"high","tags":["サイバーセキュリティ","AI攻撃","データ保護","セキュリティ対策"]},{"title":"野村総合研究所、AI共生社会における直観力の価値について言及","summary":"野村総合研究所（NRI）は、2026年4月22日付けの「NRI JOURNAL」で、「AI共生社会における直観力の価値」と題した記事を公開しました。AI技術が社会に深く浸透していく中で、人間固有の「直観力」がどのように価値を持ち、AIとどのように共存していくべきかについて考察しています。これは、技術の進化が人間社会にもたらす影響と、今後のあり方を考える上で重要な視点を提供しています。開発者にとっても、AIの設計や活用において人間の能力との調和を意識するきっかけとなるでしょう。","source":"野村総合研究所","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQElfNFlwXpK1ZdT2eYWnTEA3QWGVs43oiRimDTMVZEg6hUvPPRMzan_gQB4oywfa_b-SuTN9UDD1FmcCLuezQCTEqSu4rdI7qYRbcZ7grh9PPIax9eAGpD-gvUnlg==","impact":"medium","tags":["AI共生社会","直観力","人間とAI","社会考察"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
