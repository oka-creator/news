<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年11月24日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年11月24日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"OpenAI、AIの進歩を測る共通指標『パープレキシティ』を提案","summary":"OpenAIの首席科学者Jakub Pachocki氏が、AIの能力進歩を業界横断で測る共通指標として「パープレキシティ（困惑度）」の採用を提案しました。GPT-3.5のログパープレキシティが約0.99、GPT-4は約0.91と低下しており、最新モデルでは0.80以下に達しているとのことです。次の変革的能力が出現する期待範囲を0.68〜0.70とし、各モデル開発者がこの指標で進捗を共有することで、安全性と透明性の向上を目指します。これはAI開発の標準化とベンチマーク確立に向けた重要な一歩であり、開発者は自身のモデルの性能を客観的に評価し、他社と比較する新たな手段を得ることになります。","source":"OpenAI","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHtm2bcbSxnUMbIH4Z4zo5i4tRZnrnpgkgi9xw1gaG4ZR5D1MMZSy9L14Y3Bs6YIA6OfHACaj_-g4iqD5CNtoqlc30tniKbT77xn2OQsC72joKuzz_uJOI=","impact":"high","tags":["AI指標","OpenAI","パープレキシティ"]},{"title":"Anthropicがナスダック市場に上場、IPO価格を33%上回る","summary":"AI企業のAnthropicがナスダック市場に上場し、IPO価格83ドルを33%上回る111ドルで取引を開始しました。今回のIPOで800億ドルを超える新規資本を調達しており、これはClaudeを業務で利用する日本企業にとって、提供元の資金力を把握する上で重要な情報となります。この上場は、AI分野への投資熱の高まりを示すものであり、Anthropicの資金力強化は、今後のClaudeモデルのさらなる開発とサービス拡充に繋がる可能性があります。開発者にとっては、より安定したプラットフォームと新機能への期待が高まります。","source":"Anthropic","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQF8N9BXfyFG-JlBCnO8UqRQMCIiOQDplOZkYYRr-jQhvuHIWmpoBn0V0iKEs-xfkHzCZ6P1HQMahJLElhaF325oimsZylLANXqaA2GuUozO3rQzU43pS-N-jYFxXiObGKyY","impact":"medium","tags":["Anthropic","IPO","LLM企業"]},{"title":"ソフトバンクとOpenAIの合弁会社がAIガバナンス『C認証』を取得","summary":"ソフトバンクグループとOpenAIの合弁会社であるSB OAI Japanが、日本ディープラーニング協会（JDLA）が実施するAIガバナンスの第三者認証制度「C認証」を取得しました。C認証は、企業や自治体がAIを安全かつ適切に管理・活用するための組織体制や運用の仕組みを審査・認証するもので、企業のAI活用におけるリスク管理と促進を目的としています。この認証取得は、AIの倫理的かつ安全な利用に対するコミットメントを示すものであり、AI開発者や企業は、信頼性の高いAIシステム構築のためのガイドラインとして参考にできるでしょう。","source":"JDLA","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHdW5AKHL68slU8H7DelY36iFKGMcAXCz4QVPFSOMMElmc7xshk3m-ITNdr--krQc89XCe_dlWYdrQfD4db2GxXJbCOClEaYfFYd4wvuWmhwGUf7m_gXqIvbfJjpq2GXCNIS_1lDWR4B3zf134fY22Q0Q==","impact":"medium","tags":["AIガバナンス","ソフトバンク","OpenAI"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"オープンソースのSNS予約投稿ツール『Postiz』のMRRが40万ドル超に拡大","summary":"個人開発者のNevo David氏が開発したオープンソースのSNS予約投稿ツール「Postiz」が、2026年6月の月次経常収益（MRR）11.3万ドルから、11月9日時点で40万ドル超へと大幅に成長しました。1日あたり約5,000ドルずつ増加しており、有料サブスク会員は12,533人に達しています。これは個人開発者が持続可能な収益を上げるための具体的な成功事例として注目され、オープンソースプロジェクトでも大規模な商業的成功が可能であることを示しています。インディーハッカーにとっては、製品の市場適合性と収益化戦略のヒントとなるでしょう。","source":"Nevo David","url":"https://vertexaisearch.cloud.google.google.com/grounding-api-redirect/AUZIYQFzjSfj_bylai8D0bofce-1hzy9C0z6XyLS2DErU24bqOORJeQHiPDQAzV_yauKg_71BMuDg5zPmDyRTYY1XBcFTyahrtxOICU_PP2_tav6WqHdTgUYdA53tiCovnRuCKfBGHKyOzqYf4UMzXjdHHqis7g8QzMMciDIrA==","impact":"high","tags":["個人開発","オープンソース","MRR"]},{"title":"『UNDERTALE』主要アーティストによる新作『Of The World』無料公開","summary":"個人ゲーム開発者のTemmie Chang氏が11月23日に新作ゲーム『Of The World』をitch.ioにて無料で公開しました。『UNDERTALE』の主要アーティストとして知られるChang氏の新作であり、Toby Fox氏も携わるシリーズとして6年ぶりにリリースされたことで、インディーゲームコミュニティで大きな注目を集めています。このリリースは、著名なアーティストが個人開発として自由に作品を発表する動きを象徴しており、インディーゲーム開発者にとって、プラットフォームの活用とコミュニティへのアプローチの重要性を示す事例となります。","source":"itch.io","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQF6UKogHtoZ2f8ChwjTbGe0gjF8e3c3L2cBpM4zCpFKwiVcPTK37wUHqJJ-vTJwbDXtSXmADojbpggQQ5Y7HcRr9ZooIbZNpDDTMnf5uz_fjrxp9BTqpR4=","impact":"medium","tags":["インディーゲーム","Temmie Chang","無料ゲーム"]},{"title":"インディーゲーム開発者向けカンファレンス『Indie Developers Conference 2026』開催迫る","summary":"2026年11月28日に「esports 銀座 studio」で、国内のインディーゲーム開発者向けカンファレンス「Indie Developers Conference 2026」が開催されます。個人開発者や小規模チームを主な対象とし、ゲーム開発に必要な技術的知見、マーケティング、パブリッシング、リリース後の対応など、実践的なノウハウが共有される予定です。このカンファレンスは、インディーゲーム開発者にとって貴重な学習とネットワーキングの機会を提供し、業界の最新トレンドや成功事例を学ぶことで、自身のプロジェクトを成功させるための具体的な知識を得られるでしょう。","source":"Indie Developers Conference","url":"https://vertexaisearch.cloud.google.google.com/grounding-api-redirect/AUZIYQEHt5MtUag4LXZIpcFog5GDNYz6_26PayZbfzwopbBqhPxXY4N9Id3WFvfMWjapg40FF8sHMz1p3n31RzW7N-O1D_IRVR_7sG86GNTFFRK3c9Q6Avg0CTGXeoUW4jgu0-MTv0FTJ3LKigrz6jzORxFFEXwQJw==","impact":"medium","tags":["インディーゲーム開発","カンファレンス","イベント"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"NVIDIAのCEOが辞任発表から11日で復帰、AI関連株が急回復","summary":"米NVIDIAは11月23日、創業者のジェンスン・ファン氏が社長兼CEOおよび取締役に即時復帰すると発表しました。11月12日の辞任発表からわずか11日での復帰となり、この決定を受けてNVIDIA株は31.5%急騰し、世界のAIインフラサプライチェーン全体のセンチメントを押し上げ、アジアのテクノロジー株の力強い反発を引き起こしました。この急展開は、AI半導体市場におけるNVIDIAの重要性と、ファン氏のリーダーシップへの市場の信頼を強く示しています。AI開発者にとっては、NVIDIAの安定したリーダーシップが、今後のGPU供給や開発ツールへの投資に良い影響を与える可能性があります。","source":"NVIDIA","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQF8N9BXfyFG-JlBCnO8UqRQMCIiOQDplOZkYYRr-jQhvuHIWmpoBn0V0iKEs-xfkHzCZ6P1HQMahJLElhaF325oimsZylLANXqaA2GuUozO3rQzU43pS-N-jYFxXiObGKyY","impact":"high","tags":["NVIDIA","AI半導体","株価"]},{"title":"生成AIが医師の穿刺操作を支援、RCTで効果実証","summary":"生成AIが医師の穿刺（せんし）操作を支援する技術が、無作為化比較試験（RCT）によって穿刺回数と気胸発生率の減少に効果があることが実証されました。これは医療分野におけるAIの実用的な応用例として、患者の安全性向上と医療効率化に貢献する可能性を示しています。AIが医療現場で具体的な成果を出すことで、医療従事者の負担軽減と患者ケアの質向上に大きく寄与するでしょう。AI開発者にとっては、医療分野におけるAIの倫理的かつ効果的な導入に向けた新たな知見と機会を提供するものです。","source":"医療AI研究","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGtSO6lKtfbz3rPMuYwBLYTexVUJLsc0o2xFEm7NukF23JEwKlIoI6PVFLi62zImmf4XGfuMVJKPpQ39xcQ6RraL0FfcYOYmdWdh-kpl9wImoxRdtvBbN7gP8Yx0g6Wxo0Q7g==","impact":"medium","tags":["医療AI","生成AI","RCT"]},{"title":"Neuralink、脳インプラントで思考のみによる『GTA6』プレイ動画を公開","summary":"イーロン・マスク氏が設立したNeuralinkが、同社の脳インプラント治験参加者が思考するだけで人気ゲーム『GTA6』をプレイしている動画を公開しました。このシステムは、意図的な動きに関連する神経活動をコンピュータが理解できるコマンドに変換するもので、被験者は手の動きを想像するだけでゲームを自在に操作できるようになったと報告されています。これはブレイン・マシン・インターフェース（BMI）技術の驚異的な進歩を示しており、将来的に身体的な制約を持つ人々の生活を大きく変える可能性を秘めています。開発者にとっては、新たな入力インターフェースとしてのBMIの可能性を探るきっかけとなるでしょう。","source":"Neuralink","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQG2C9FSSpL3JzX5X0KaxLzm_w82NmpJrGF1HXZv-s7UoEYoCMBz7soMivfT6T04qtDmdT8Whvrx1Y3eNaW-yL5cu1gDRX76apOWpu3ItEzzCuSsL6Po72tz36gsV4H7R3lPSGYwPlxILxJEV1LVUW2vFBg=","impact":"high","tags":["Neuralink","BMI","ゲーム"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
