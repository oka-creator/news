<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月16日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年3月16日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"NVIDIA GTC 2026が開幕、AIインフラとエージェントの拡大が焦点に","summary":"世界最大級のAIカンファレンス「GTC 2026」が米国サンノゼで開幕し、NVIDIAのジェンスン・フアンCEOが基調講演を行いました。AIインフラ、半導体、エージェント型AIの拡大が主要テーマとなり、特にフィジカルAIや次世代GPUが焦点となっています。これはAI開発者にとって、将来のAIモデルやアプリケーションを構築するための基盤技術の方向性を示す重要な発表です。高性能な計算資源の登場は、より複雑で大規模なAIシステムの実現を加速させるでしょう。","source":"ニュース記事","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGOVpDV0ssYQfObMntgwglqJvWDAZJ2WamH6PWfkPHzAGcScMJy5gSGcOs_Y0fWFtXs_oTtaiNbJKy0Gx5omoabE_XMx583C_LSXM5yEvrcvfbUmc9JfNVNIMr55DqdS4qAuj705FDsyNM=","impact":"high","tags":["NVIDIA","GTC","AIインフラ","エージェントAI"]},{"title":"デジタル庁、ガバメントAI用国産LLM 7モデルを選定","summary":"デジタル庁は、政府のAI利用環境「ガバメントAI（源内）」で試用する国内大規模言語モデル（LLM）として、NTTデータの「tsuzumi 2」など計7モデルを選定したと発表しました。行政実務での実用性や課題の評価・検証が5月頃から開始される予定です。この取り組みは、日本の文化・価値観を尊重した信頼できるAIの国内開発を推進するものです。日本のAI開発者にとって、新たな市場や技術開発の機会を創出する可能性があります。","source":"ニュース記事","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHL1d8LzIIkHT_rjYihNF78FSH_JW_cFgVj4QcJFKaO3Qixi9eG_jo1AzFZlRU9mc8pN2_UkKho8lHTQjGm4wklKmQkJeuX8JqGsPzLWqC6mU5UvLkmRhzC8WfMrNQn8FK2r6GDN-81yiYM_eekCzd-jg==","impact":"medium","tags":["デジタル庁","国産LLM","ガバメントAI","AI政策"]},{"title":"OpenAIがGPT-5.4を公開、AIエージェント向け機能を大幅強化","summary":"OpenAIが新しい大規模言語モデル「GPT-5.4」を公開し、AIエージェント向けの機能が大幅に強化されました。最大100万トークン級の長文コンテキストに対応し、AIがツールを探して使用する「Tool Search」機能を搭載しています。これにより、コンピュータ操作などエージェント型タスクの実行能力が向上しました。開発者はより高度な自動化や複雑なデータ分析、コード生成、ドキュメント処理を行うAIエージェントを構築できるようになります。","source":"ニュース記事","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFwRwVbULSYZpelzeJLOBGaVwuBFqLt7NVXHPmVQtGcTLHDtN2UZHSb4R6WlvQoO2izxBfdyBq41n9AKAto-ZgYeL35KulzVEJlZpTYqAiVMLckNTfQC2Yg-d9xv8M7wk20V9M=","impact":"high","tags":["OpenAI","GPT-5.4","LLM","AIエージェント"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"Open WebUIと自作MCPツールでローカルAIエージェントを構築する方法を解説","summary":"ローカルPCやKubernetes環境で生成AIを動かす開発者向けに、Open WebUIと自作のMCP（Model Context Protocol）サーバーを組み合わせてAIエージェントを構築する方法が解説されました。Pythonコードを交えながら、日々の作業を効率化・自動化する具体的な手法が示されています。この情報は、個人開発者が自身の環境でAIを活用し、生産性を向上させるための実践的なガイドとなります。AIエージェント開発への参入障壁を低減する効果が期待されます。","source":"ニュース記事","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEr-geQV1h4ZZxOvq5RPpr_DCoyiGkTqG3vUCRTK7MGpApYA9MXoq84qC3XWncoFNM7ui9hNXsNGTLoPt56XXbQmNCiyhn1t37divKqKyN1n1N_1px_YSeiYfdIE8EHKaQC3EDyHfrh1gJt45DE2y3ds6Us9nrvfFSqDAk=","impact":"medium","tags":["ローカルAI","AIエージェント","Open WebUI","Python"]},{"title":"AIエージェント向け環境「Vercel Sandbox」が公開、1秒未満で起動し消滅","summary":"AIエージェントの開発とデプロイを加速させる新たな環境として、「Vercel Sandbox」の仕組みが公開されました。これは1秒未満で起動し、コード実行後に消滅するという特徴を持ち、AIエージェントが一時的なタスクを実行する際に非常に効率的です。開発者はこの環境を活用することで、AIエージェントの試作やテストを迅速に行えるようになります。これにより、開発サイクルを大幅に短縮できるでしょう。","source":"ニュース記事","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQH7Mv07Q7VJLtr63DD-ii5U_jzhoEnfZQZ22io4z1XshPY4pW7JTo1blgzfyAQXj1QFJMkN11u_lcJNyRVVXxT_wooZ7yZr6CqxTe4iEwM7TjfTiwOpsCf-pScyhq42yILvy1v5QQ-n6u_Xr2k4","impact":"medium","tags":["Vercel","AIエージェント","開発環境","サーバーレス"]},{"title":"GitHubがAI支援開発における「断片化税」の課題を指摘","summary":"GitHubが、AI支援開発の普及を妨げる「断片化税（fragmentation tax）」の存在を明らかにしました。これは、開発環境やツールの断片化がAIの導入と活用を阻害するという問題提起です。今後の開発ツールの統合や標準化の動きに大きな影響を与える可能性があります。個人開発者やインディーハッカーがAIをより効果的に活用するためには、このような課題への対応が求められ、よりシームレスなAI開発体験が期待されます。","source":"ニュース記事","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQH7Mv07Q7VJLtr63DD-ii5U_jzhoEnfZQZ22io4z1XshPY4pW7JTo1blgzfyAQXj1QFJMkN11u_lcJNyRVVXxT_wooZ7yZr6CqxTe4iEwM7TjfTiwOpsCf-pScyhq42yILvy1v5QQ-n6u_Xr2k4","impact":"high","tags":["GitHub","AI開発","開発環境","ツール統合"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"主要なOSやソフトウェアでセキュリティアップデートが相次ぐ","summary":"Appleは現地時間3月11日に旧端末向け「iOS」「iPadOS」のセキュリティアップデートをリリースし、悪用脆弱性を解消しました。また、Veeam製バックアップ管理ソフトやGoogle Chrome、ZoomのWindows向けクライアントでも深刻な脆弱性が発見され、それぞれアップデートが提供されています。これらのアップデートは、ユーザーのデバイスとデータの安全性を確保するために不可欠です。開発者は、自身のアプリケーションやサービスが最新のセキュリティ基準に準拠しているかを確認し、脆弱性対応を迅速に行う必要があります。","source":"ニュース記事","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQF7TVBJhZXH1w4mHQUv0nkFu1-7wIpBrZlYw5DdQ0h5JBLTegZ1PTkXD4xwz9KyoR7IhJURXgBvvy6TgUTw5QqYc_6qXlMe8_fI_diXLJEqoyUATNCJkXHzeA==","impact":"high","tags":["セキュリティ","脆弱性","OSアップデート","ソフトウェア更新"]},{"title":"キヤノンと日本シノプシス、2nm世代画像処理SoC技術をRapidusへ製造委託","summary":"キヤノンと日本シノプシスは、NEDO（国立研究開発法人新エネルギー・産業技術総合開発機構）のプロジェクトに参画し、先端半導体製造技術の開発に着手しました。2nm世代プロセス技術にチップレット技術を組み合わせることで、高性能・低消費電力を両立する画像処理SoCの設計技術開発に取り組みます。試作はRapidusに委託され、日本の半導体産業の強化に向けた重要な一歩となります。ハードウェア開発者や半導体エンジニアにとって注目すべき動向です。","source":"ニュース記事","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGzL9hWHIrq6ZIu3Ju3vaF8Aez9H4-odF0aDlHDAyvv3EW_e5OVv_FtVeWq8WqEXPhBE3v5MvdkvKulctwobgK-xOS41Nv9VGtq3ggP-h_2vhCggTg1WdsmpN2VaQXNJgX6j9e5G4aBdB3HFm32TQ==","impact":"medium","tags":["半導体","SoC","2nmプロセス","Rapidus"]},{"title":"Amazon EC2 Hpc8aインスタンスが一般提供開始、HPC性能が最大40%向上","summary":"Amazon Web Services（AWS）は、第5世代AMD EPYCプロセッサを搭載するAmazon EC2 Hpc8aインスタンスの一般提供を開始しました。このインスタンスは、192コア、768 GiBメモリ、300 GbpsのElastic Fabric Adapter（EFA）ネットワーキングを備えています。前世代Hpc7aと比較して最大40%以上の性能向上を実現し、計算集約型のシミュレーション、エンジニアリングワークロード、密結合HPCアプリケーションに最適です。HPCを必要とする開発者は、より高速で効率的な計算リソースを利用できるようになります。","source":"ニュース記事","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQE0PVFH2qy8kgEYjgm94HlcDMTJkTdQqv8tEi82PBb_R88_5ik3Mh8JOKleMJL1lNe_SXpi_bAWEBomYMfLCZzRoXOS9szhpivamGgH7YFRsGHuVyNAOmRRC6p8DVQ6PlhYA93hfxhHdF-zYacn0VhKcsd1eRoop-J70n3TPJBe5zc2","impact":"high","tags":["AWS","EC2","HPC","クラウドコンピューティング"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
