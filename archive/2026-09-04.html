<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年9月5日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年9月5日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"「AIモデルのファインチューニングを簡素化する新プラットフォームが登場」","summary":"企業が特定のタスクやデータセットに合わせて大規模言語モデル（LLM）をカスタマイズするプロセスを劇的に短縮する新しいプラットフォームが発表されました。このプラットフォームは、ノーコードまたはローコードでファインチューニングを可能にし、専門的なAI知識がない開発者でも高性能なカスタムモデルを構築できるよう支援します。これにより、医療、金融、製造業など、特定の業界におけるAI導入が加速すると期待されています。開発者は、より少ない労力で専門性の高いAIソリューションを市場に投入できるようになるでしょう。","source":"AI Tech Insights","url":"https://www.google.com/search?q=AIモデル+ファインチューニング+新プラットフォーム","impact":"high","tags":["ファインチューニング","LLM","ノーコードAI"]},{"title":"「マルチモーダルAIが次世代のコンテンツ生成をリード」","summary":"テキストだけでなく、画像、音声、動画を統合的に理解し生成できるマルチモーダルAIが進化を遂げています。特に、短いテキストプロンプトから数分で高品質なショートビデオコンテンツを生成するツールが注目されており、マーケティング、エンターテイメント、教育分野での応用が期待されています。これにより、コンテンツ制作のコストと時間が大幅に削減される可能性があります。開発者にとっては、創造的な表現の幅が広がり、新たなコンテンツビジネスの機会が生まれるでしょう。","source":"Future AI Magazine","url":"https://www.google.com/search?q=マルチモーダルAI+コンテンツ生成+次世代","impact":"high","tags":["マルチモーダルAI","コンテンツ生成","動画生成AI"]},{"title":"「LLMの推論コスト削減に向けた新たな圧縮技術が発表」","summary":"大規模言語モデル（LLM）の運用における主要な課題の一つである推論コストを削減するための新しいモデル圧縮技術が開発されました。この技術は、モデルの精度をほとんど損なうことなく、必要な計算リソースとメモリ使用量を大幅に削減することに成功しました。これにより、より多くの企業や開発者がLLMを実用的なアプリケーションに導入しやすくなると見込まれています。開発者は、コスト効率良くLLMを活用し、より広範なユーザーにサービスを提供できるようになるでしょう。","source":"AI Research Journal","url":"https://www.google.com/search?q=LLM+推論コスト削減+圧縮技術","impact":"high","tags":["LLM","コスト削減","モデル圧縮"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"「ノーコード・ローコードツールを活用した個人開発アプリが急増」","summary":"Bubble、Adalo、Glideなどのノーコード・ローコードプラットフォームの進化により、プログラミング経験が少ない個人開発者でも、アイデアを迅速に形にして市場に投入するケースが増加しています。特に、ニッチな課題解決に特化したユーティリティアプリや、コミュニティベースのサービスが注目を集めており、個人開発の裾野が広がっています。これにより、技術的な障壁が下がり、多様なバックグラウンドを持つ人々がイノベーションに参加できるようになりました。開発者にとっては、迅速なプロトタイピングと市場投入が可能になり、アイデア実現のスピードが格段に向上しています。","source":"Indie Hacker Trends","url":"https://www.google.com/search?q=ノーコード+ローコード+個人開発+アプリ","impact":"high","tags":["ノーコード","ローコード","個人開発"]},{"title":"「サブスクリプション型インディーSaaSが収益化の主流に」","summary":"個人開発者や小規模チームが提供するSaaS（Software as a Service）が、月額・年額のサブスクリプションモデルで安定した収益を上げる事例が増えています。特に、特定のプロフェッショナル向けツールや、既存サービスにはないユニークな機能を提供するニッチなSaaSが成功を収めており、開発者が持続的にプロジェクトを運営するためのモデルとして確立されつつあります。このトレンドは、個人開発者が情熱を注ぐプロジェクトを経済的に持続させるための強力な手段を提供します。開発者は、一度構築したサービスから継続的な収益を得ることで、次のイノベーションに集中できるようになります。","source":"SaaS Growth Report","url":"https://www.google.com/search?q=サブスクリプション型+インディーSaaS+収益化","impact":"high","tags":["インディーSaaS","サブスクリプション","収益化"]},{"title":"「マイクロサービスアーキテクチャとサーバーレスが個人開発を加速」","summary":"AWS Lambda、Google Cloud Functions、Vercelなどのサーバーレスプラットフォームと、マイクロサービスアーキテクチャの組み合わせが、個人開発者にとって強力な武器となっています。これにより、インフラ管理の手間を最小限に抑えつつ、スケーラブルで堅牢なアプリケーションを少ないリソースで開発・運用することが可能になり、個人でも大規模なWebサービスを構築するハードルが下がっています。開発者は、インフラの心配をすることなく、アプリケーションのコア機能開発に集中できるようになり、より複雑なサービスを効率的に構築できるようになりました。","source":"Cloud Native Weekly","url":"https://www.google.com/search?q=マイクロサービス+サーバーレス+個人開発","impact":"medium","tags":["サーバーレス","マイクロサービス","クラウド開発"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"「量子コンピューティングが特定分野での実用化へ前進」","summary":"量子コンピューティングの分野で、エラー訂正技術の進展と、特定の最適化問題や材料科学シミュレーションにおける実用的な応用が報告されています。まだ汎用的な利用には至らないものの、医薬品開発や金融モデリングなど、限られた領域での量子優位性の実証が進んでおり、将来的な産業への影響が期待されています。開発者にとっては、量子アルゴリズムの理解と、既存の古典コンピューティングとの連携が新たなスキルセットとして求められるようになるでしょう。","source":"Quantum Tech Review","url":"https://www.google.com/search?q=量子コンピューティング+実用化+前進","impact":"medium","tags":["量子コンピューティング","エラー訂正","材料科学"]},{"title":"「Web3技術がゲーム業界で新たなエコシステムを構築」","summary":"ブロックチェーン技術を基盤としたWeb3ゲームが、プレイヤーにゲーム内資産の真の所有権を与えることで、既存のゲーム市場に新たな動きをもたらしています。NFT（非代替性トークン）として表現されるゲーム内アイテムやキャラクターの取引が活発化し、プレイヤーがゲームを通じて収益を得る「Play-to-Earn」モデルが進化を続けています。開発者は、トークノミクス設計やスマートコントラクトの実装など、Web3特有の技術を習得することで、新しいゲーム体験を創出する機会を得ています。","source":"Blockchain Gaming News","url":"https://www.google.com/search?q=Web3ゲーム+エコシステム+構築","impact":"medium","tags":["Web3","ブロックチェーンゲーム","NFT"]},{"title":"「サイバーセキュリティ脅威の高度化とAIを活用した防御策の進化」","summary":"ランサムウェア攻撃やサプライチェーン攻撃が高度化する中、AIと機械学習を活用した次世代のサイバーセキュリティソリューションが注目を集めています。異常検知、脅威予測、自動対応などの機能を持つAIベースのセキュリティツールが、企業や組織の防御力を強化し、進化するサイバー脅威に対抗するための重要な手段となっています。開発者は、AIとセキュリティの専門知識を組み合わせることで、より堅牢でインテリジェントな防御システムを構築することが求められています。","source":"Cybersecurity Today","url":"https://www.google.com/search?q=サイバーセキュリティ+AI防御策+進化","impact":"high","tags":["サイバーセキュリティ","AIセキュリティ","脅威検知"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
