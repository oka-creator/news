<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年11月8日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

<div class="container">

    <div class="header-row">
      <span style="font-size:26px">📰</span>

    </div>
    <div class="date-display">2026年11月8日</div>

  <nav class="date-nav">

</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Google、動画生成AI『Gemini Omni 1.2 Flash』を30%値下げし正式公開","summary":"Googleは11月5日、動画生成AI『Gemini Omni 1.2 Flash』を正式公開し、料金を30%引き下げました。これにより、720pの動画を1秒あたり0.07ドルで最大15秒まで生成可能となり、話し言葉の指示や画像からの動画作成にも対応します。この値下げと機能強化は、動画コンテンツ制作のコストを大幅に削減し、クリエイターや開発者がより手軽にAIを活用した動画生成に取り組めるようになるため重要です。特に、開発者はAPIを通じてこの低コストな動画生成機能を自身のアプリケーションに組み込みやすくなり、新たなサービスやツールの創出が期待されます。","source":"安武遼太 - note","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQG51MOaJOBaJ6Q9SbOLhQt0TkOTLAN5gu0hzcw4PTwuXnSKFHGrs9blC5vl8VL_ToDEW-UZDNZn2HgbbU2-uyO0JBjNzmIa60YK8XarIaswN8ZaYyMqQ2EFHQWhK14Ma8LM8RKoyIV6T97V2Wg=","impact":"high","tags":["動画生成AI","Google Gemini","コスト削減"]},{"title":"OpenAI、『GPT-6 Cyber』でソフトウェア脆弱性検出・攻撃コード生成能力を強化","summary":"OpenAIのセキュリティAI『GPT-6 Cyber』が、ソフトウェアの脆弱性を検出し、さらには攻撃コードを生成する能力を持つと報じられました。OpenAIはJPモルガンと提携し、コーディング支援ツール『Codex』とサイバーセキュリティAIの分野で協業を進めています。この技術は、企業のサイバーセキュリティ対策に大きな実用的なインパクトをもたらす可能性があり、開発者はセキュリティテストや防御策の自動化に活用できる一方で、悪用リスクへの対策も求められます。AIがセキュリティの攻防両面で中心的な役割を果たす時代が到来しつつあることを示唆しています。","source":"今日のAIニュース（11月8日）","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEKSHElb1w2_5-ng4CHA0MKcqwRzxVhfGW735CRXDNjYq37laBQ_ylvtCVUAEbZeI55HPVYnTiVvz2q0CX3buuhRPoTWxq1GmwtV3QtQ22B_Wfl3nRdQqN7sQhfO7CZ9PMeJ7RaiVctsEanM1Ue7dK-rUKc7frmbA==","impact":"high","tags":["サイバーセキュリティ","OpenAI GPT","脆弱性検出"]},{"title":"国立情報学研究所、日本語特化型LLM『LLM-jp-4.1』を発表","summary":"国立情報学研究所（NII）が、日本語に強く、STEM（科学・技術・工学・数学）分野の性能向上と外部ツール連携に対応したオープンな大規模言語モデル『LLM-jp-4.1』シリーズを公開しました。このモデルは、国家レベルの計算基盤『ABCI 3.0』によって実現されており、日本語環境での実用的なAI開発を加速させることが期待されます。開発者にとっては、高品質な日本語処理能力を持つオープンソースモデルが利用可能になることで、日本語に特化したアプリケーションやサービスの開発が容易になり、国内のAIエコシステム活性化に貢献するでしょう。","source":"国産AIが進化！STEM強化とツール連携を実現した『LLM-jp-4.1』が登場","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGtxz-mwUW9hnFgeLtRhSxUkMz7o04dYEHOyzxQ0JGf6ja9fNBxcQjHUpQNqwP7rtiIqFP3CXHUImYwsYuZ77LDZ704ZmXIGl-I9Paq3mrTtspk2OHj0Z9eQVtwU1m5s5SPC7E2WuE=","impact":"medium","tags":["日本語LLM","オープンソースAI","NII"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"noteの統計情報をAPIなしで分析するスクリプト公開","summary":"個人開発者のやすだ.dev氏が、noteの統計画面を「写して貼るだけ」で分析できる、APIを使わないスクリプト全文を公開しました。このツールは、noteの公式APIに依存せずにコンテンツのパフォーマンスを詳細に分析できるため、個人開発者やブロガーが自身の記事の閲覧傾向や効果を把握し、改善策を立てる上で非常に有用です。API制限や開発の手間を気にせず、手軽にデータ分析を行いたい開発者にとって、即座に活用できる実用的なソリューションとして注目されます。","source":"やすだ.dev","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQECxtUDbjDmoYTFG5YrH94doEbRofda8H684AjtJGRChd2WjFiEEJwsWyyEwB2ODlmUlSQPgUyRmac8Jk2tRTQIatQ1IakLFAaiXZZxcJM4Ia3XZEyC7D8eCPrEYj9VdnRFADE3xHUinUpK","impact":"medium","tags":["note分析","個人開発","スクリプト"]},{"title":"AI活用アプリの成功事例が続々登場：月商数百万〜数千万円規模に","summary":"海外のAI活用アプリ市場で、月間経常収益（MRR）が数百万から数千万円規模に達する成功事例が相次いでいます。例えば、AI写真アプリ『Boothie』はリリース4ヶ月で約780万円のMRRを達成し、宇宙人AIキャラと会話するアプリ『Tolan』は4ヶ月で300万ダウンロード、年間18億円に到達しました。これらの事例は、AIを活用したニッチなアイデアが大きな収益に繋がり得ることを明確に示しており、個人開発者やインディーハッカーにとって、AI技術をビジネスチャンスに変える具体的なヒントとモチベーションを提供します。","source":"みんなのニュースレター","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFPpkNAZYuI44mg6eS1S1RR9jY5DlhYvyaRd6PHGKlyZ1LwpU0fXcxRa4LtvBC75TnVkLT7VSmSQFi2O_TQ23P252Ym6Nv6-AHvq02Zx-kBZPgEegodpjtSAjSx","impact":"high","tags":["AIアプリ","成功事例","収益化"]},{"title":"2026年のインディーハッカーを支えるAIツールとクラウドサービス","summary":"2026年現在、AIツール（例: Claude Code, Cursor, Lovable）の進化により、MVP（実用最小限の製品）の完成までの期間が数日に短縮されています。さらに、SupabaseのようなBaaS（Backend as a Service）がデータベースや認証、ストレージを肩代わりし、Lemon Squeezyのような決済代行サービスが海外顧客の消費税計算を処理するなど、インディーハッカーが一人で開発から収益化まで行う環境が劇的に整備されています。これらのツールとサービスは、開発者が技術的な障壁に煩わされることなく、アイデアの実現と市場投入に集中できるため、個人開発の可能性を大きく広げています。","source":"インディーハッカー スタック 日本 2026","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHsUuS498t39nqwrwt5z4NznyBPdeVpaqo4g0nOS8vQ72TnQtq6eoz4QYmbESYHGcmhCEcAk1mM_Duoyh_lyM0zTTeRrcSEdmpIEvqYZQhyPOzpgH63f7gb_PHsMHetIydBBDGb4-eI2O_sE7BO5NvWFcq9hWeOLBzM--Usu2h60Ru1A==","impact":"high","tags":["インディーハッカー","開発ツール","BaaS"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"ガートナー、2026年の戦略的テクノロジートレンドを発表","summary":"ガートナーが『2026年の戦略的テクノロジのトップ・トレンド』を発表し、未来の技術動向を明らかにしました。主要なトレンドとして、金融・製造・医療などの業界固有のユースケースで高精度とコンプライアンスを提供する『ドメイン特化言語モデル』や、ロボットやドローンを通じて知能を現実世界にもたらす『フィジカルAI』、そしてAIアプリケーションとオーケストレーションを組み合わせる『The Synthesist』などが挙げられています。これらのトレンドは、開発者が今後注力すべき技術領域を示唆しており、特定の業界向けAIソリューションや物理世界と連携するAIシステムの開発が加速するでしょう。","source":"ガートナー（Gartner）","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHnRL7x3m4-lgqs4E8pZYpOZiB7MbdDYoZ_qT4U3YDtyId3PERI2rszG3gSpOzPe3faaBajk-vpveFmABVMFl1OLurTJyTOWeTZ11CJDJ3LSrWmRPovBbUrUNqkBKADcgG5XMt3GgXBFfjx7-zjIeOXm3KDmmk7_DwKj4E=","impact":"high","tags":["テクノロジートレンド","ガートナー","ドメイン特化AI"]},{"title":"日本、2nm世代エッジAI半導体開発でロボット・自動車への生成AI搭載を推進","summary":"日本は、産業技術総合研究所（AIST）が主導する『2nm世代半導体技術によるエッジAIアクセラレータの開発』プロジェクトを通じて、ロボットや自動車、産業機器などのエッジデバイスへの生成AI搭載を推進しています。このプロジェクトは、大規模言語モデル（LLM）を含む生成AIの推論処理を低消費電力で実現することを目指しており、11月11日に『RISC-V Day Tokyo 2026 Autumn』で詳細が紹介される予定です。開発者にとっては、エッジデバイス上での高性能かつ低消費電力なAI処理が可能になることで、新たな組み込みAIアプリケーションや自律システムの開発機会が大きく広がることが期待されます。","source":"生成AIをロボットや自動車で動かす――『2nm世代エッジAI半導体』の開発プロジェクトを11月11日","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHA1ZvPC0x8RsfARiMzIG6Qw2AQPvZWZph7svoW58Wz7_HH694uQtP-vLOiNM2ZDlY5izI4Esudrqm6BoqEYDkFFoNddc19oS4LXPH0NOmx-je9Hiq9OQxt7FqnFKtN6WXHo8Do","impact":"high","tags":["エッジAI","半導体","ロボットAI"]},{"title":"Apple Intelligence、AI編集画像に『SynthID』透かしを自動埋め込み","summary":"iOS 27.2以降のiPhoneやiPadでは、Apple Intelligenceを使って作成・編集された画像に、目に見えない透かし『SynthID』が自動的に埋め込まれるようになりました。この機能は、写真アプリの『クリーンアップ』や『Image Playground』などで適用され、画像の見た目を損なうことなく、AI生成コンテンツの透明性と信頼性を高めることを目的としています。開発者にとっては、AI生成コンテンツの出所を明確にするための新たな標準が提示されたことを意味し、AI倫理やコンテンツの信頼性確保に向けた取り組みがより重要になるでしょう。","source":"あべむつき - note","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHrweBOPt2ilCOiKss5fP0i-CKDcvX9RgK2CehMUIyMne-8Hpssyl7Hs34RRcm5YhmtUNxHmyH-uRxBrpR1Zo-E8wuXvDnt5dsuFmlu-dNmbBjokG9q2DEoATr3ndI5Pwmmng==","impact":"medium","tags":["Apple AI","SynthID","AI倫理"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
