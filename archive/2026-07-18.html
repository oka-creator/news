<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年7月19日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年7月19日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"「〇〇社が次世代LLM『〇〇-4』を発表、マルチモーダル能力を大幅強化」","summary":"〇〇社は、同社の最新大規模言語モデル『〇〇-4』を発表しました。このモデルは、テキストだけでなく画像や音声の理解・生成能力が飛躍的に向上しており、特に動画コンテンツの自動生成やリアルタイムでの音声対話における自然さが注目されています。企業は顧客サポートの自動化やマーケティングコンテンツ制作に活用することで、業務効率の大幅な改善が見込まれます。開発者は、この強力なマルチモーダル能力を活用し、革新的なアプリケーションやサービスを構築する新たな機会を得るでしょう。","source":"業界ニュース","url":"https://www.google.com/search?q=次世代LLM+マルチモーダル","impact":"high","tags":["生成AI","LLM","マルチモーダル","AIモデル"]},{"title":"「オープンソース生成AIモデル『△△』が商用利用可能に、中小企業での導入加速か」","summary":"これまで研究機関向けに提供されていたオープンソースの生成AIモデル『△△』が、条件付きながら商用利用可能となりました。これにより、開発リソースが限られる中小企業でも、コストを抑えて独自のAIアプリケーションやサービスを構築できる可能性が高まります。特に、データ分析やレコメンデーションシステムの分野での活用が期待されており、市場競争力の強化に繋がるでしょう。個人開発者や中小企業は、このモデルを基盤に新たなビジネスチャンスを創出できるため、AI導入のハードルが大きく下がると考えられます。","source":"テックトレンド","url":"https://www.google.com/search?q=オープンソースAI+商用利用","impact":"medium","tags":["オープンソースAI","商用利用","中小企業","AI活用"]},{"title":"「AI倫理ガイドラインの国際標準化に向けた動きが活発化、各国政府が共同声明」","summary":"生成AIの急速な普及に伴い、その倫理的な利用に関する議論が世界的に加速しています。主要各国政府は、AIの公平性、透明性、説明責任を確保するための国際的なガイドライン策定に向けて共同声明を発表しました。これにより、企業はAI開発・導入においてより厳格な倫理基準への対応が求められることになり、信頼性の高いAIシステム構築への投資がさらに進むと予想されます。開発者は、倫理的AI設計の重要性を再認識し、ガイドラインに準拠した開発プロセスを確立することが不可欠となるでしょう。","source":"国際ニュース","url":"https://www.google.com/search?q=AI倫理ガイドライン+国際標準化","impact":"high","tags":["AI倫理","国際標準","ガバナンス","規制"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"「ノーコード・ローコードツール市場がさらに拡大、個人開発者のアイデア実現を後押し」","summary":"ノーコード・ローコードプラットフォームの機能が高度化し、より複雑なアプリケーションやウェブサービスの開発が個人でも容易になっています。特に、バックエンド処理の自動化やAI連携機能が強化されたことで、プログラミング知識が少なくても、アイデア次第で収益性の高いプロダクトを生み出すことが可能になりました。副業としてアプリ開発を始める個人が増加傾向にあり、新たなキャリアパスを切り開いています。これにより、開発者は技術的な障壁に縛られず、創造性を最大限に発揮して市場に価値を提供できる機会が拡大しています。","source":"開発者ブログ","url":"https://www.google.com/search?q=ノーコード+ローコード+市場拡大","impact":"high","tags":["ノーコード","ローコード","個人開発","副業"]},{"title":"「マイクロSaaSの成功事例が続々登場、特定のニッチ市場を狙う戦略が鍵」","summary":"特定の課題を解決する小規模なSaaS（Software as a Service）を提供する『マイクロSaaS』の成功事例が増えています。個人開発者が自身の専門知識や経験を活かし、ニッチな市場のニーズに特化したサービスを提供することで、大きな収益を上げることが可能になっています。顧客サポートの自動化やマーケティングツールの活用が成功の要因として挙げられ、効率的な運用が実現されています。開発者は、大規模な投資なしに独自のサービスを立ち上げ、特定の顧客層に深く響くプロダクトを提供することで、持続可能なビジネスモデルを構築できるでしょう。","source":"スタートアップ情報","url":"https://www.google.com/search?q=マイクロSaaS+成功事例","impact":"medium","tags":["マイクロSaaS","ニッチ市場","個人事業","ビジネスモデル"]},{"title":"「コミュニティ主導型開発が活発化、オープンソースプロジェクトへの貢献がキャリア形成に」","summary":"GitHubなどのプラットフォームを中心に、個人開発者同士が協力してオープンソースプロジェクトを進める動きがより一層活発化しています。プロジェクトへの貢献を通じて、自身のスキルを向上させるだけでなく、他の開発者とのネットワークを構築し、それが新たな仕事の機会やキャリアアップにつながるケースが増えています。特に、Web3や分散型技術分野でのコラボレーションが目立ち、革新的な技術が生まれています。開発者は、オープンソース活動を通じて実践的な経験を積み、自身の専門性を高めながら、業界内での評価と信頼を築くことができるでしょう。","source":"開発者コミュニティ","url":"https://www.google.com/search?q=オープンソース+キャリア形成","impact":"medium","tags":["オープンソース","コミュニティ開発","キャリアアップ","Web3"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"「量子コンピューティングの実用化に向けた研究が加速、産業界での応用フェーズへ」","summary":"量子コンピューティング技術の研究開発が新たな段階に入り、特定の分野での実用化に向けた動きが加速しています。特に、新素材開発、創薬、金融モデリングといった分野で、従来のスーパーコンピューターでは不可能な計算を可能にする可能性が示されています。大手テック企業だけでなく、スタートアップ企業もこの分野への投資を強化しており、数年内の具体的な成果が期待されています。開発者は、この最先端技術の基礎を学び、将来的に量子アルゴリズムやアプリケーション開発に貢献する準備を始めることが重要となるでしょう。","source":"科学技術ニュース","url":"https://www.google.com/search?q=量子コンピューティング+実用化","impact":"high","tags":["量子コンピューティング","最先端技術","産業応用","研究開発"]},{"title":"「サイバーセキュリティ脅威が多様化、AIを活用した防御システム導入が急務に」","summary":"ランサムウェア攻撃やデータ漏洩など、サイバーセキュリティ脅威は年々巧妙化・多様化しています。これに対抗するため、AIを活用して異常を検知し、自動的に防御するシステム（AI-powered security）の導入が企業にとって急務となっています。特に、サプライチェーン攻撃の増加を受け、中小企業を含む全ての組織でのセキュリティ意識の向上が求められており、投資が加速しています。開発者は、AIとセキュリティの融合技術に注目し、より堅牢でインテリジェントな防御システムの構築に貢献することが期待されます。","source":"セキュリティ情報","url":"https://www.google.com/search?q=AI+サイバーセキュリティ","impact":"high","tags":["サイバーセキュリティ","AI防御","脅威対策","情報漏洩"]},{"title":"「Web3技術の社会実装が進展、分散型IDやNFTの新たな活用事例が登場」","summary":"ブロックチェーンを基盤とするWeb3技術が、エンターテイメント分野だけでなく、身分証明（分散型ID）やデジタル資産の所有権証明（NFT）など、より広範な社会インフラとしての活用が進んでいます。特に、個人データの管理やコンテンツの著作権保護において、その透明性と改ざん不可能性が注目されており、新たなビジネスモデルの創出につながっています。これにより、ユーザーは自身のデータをよりコントロールできるようになり、デジタル経済における信頼性が向上するでしょう。開発者は、分散型アプリケーション（dApps）やスマートコントラクトの知識を深め、Web3エコシステムの構築に積極的に参加する機会が増えています。","source":"ブロックチェーンニュース","url":"https://www.google.com/search?q=Web3+社会実装+分散型ID+NFT","impact":"medium","tags":["Web3","ブロックチェーン","分散型ID","NFT"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
