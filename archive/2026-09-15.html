<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年9月15日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年9月15日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"JAPAN AI、日本マイクロソフトと協働し企業向けAIエージェント活用を加速","summary":"JAPAN AI株式会社は、日本マイクロソフトの支援を受け、企業における生成AIおよびAIエージェントの活用拡大に向けた取り組みを開始しました。第一弾として、JAPAN AIのAI基盤にマイクロソフトのAIプラットフォーム「Microsoft Foundry」を活用し、最新の大規模言語モデル（LLM）の利用を強化します。この協働により、高度なセキュリティやガバナンスが求められる大企業を中心に、AIエージェントの業務実装が加速される見込みです。開発者にとっては、より堅牢でセキュアなAI開発環境と、エンタープライズ向けAIソリューションの需要拡大が期待されます。","source":"クラウド Watch","url":"https://cloud.watch.impress.co.jp/docs/news/1531634.html","impact":"high","tags":["企業AI","AIエージェント","Microsoft Foundry"]},{"title":"Google、AIエージェントによるサイバー攻撃の自律化を警告","summary":"Googleの脅威分析グループ（GTIG）は、攻撃者がAIエージェントを悪用し、侵害したクラウドや開発環境を新たな「AI攻撃基盤」として利用する実態を報告しました。2026年第2四半期には、AIを活用した大規模な認証情報収集キャンペーンがわずか6時間で実行された事例が確認されています。これはAIによる攻撃の高速化と自律化が新たな脅威となっていることを示唆しており、開発者はセキュリティ対策の強化とAIの悪用に対する意識を高める必要があります。AIの進化が攻撃手法にも影響を与えるため、防御側もAIを活用したセキュリティソリューションの開発が急務です。","source":"キーマンズネット","url":"https://www.keymansnet.com/article/2609/26090008.html","impact":"high","tags":["サイバーセキュリティ","AI攻撃","AIエージェント"]},{"title":"拡散モデルを活用した高速文章生成AI「Mercury 2.5」発表","summary":"AI企業のInceptionが、拡散モデルを用いて毎秒1107トークンという驚異的な速度で文章を生成するAIモデル「Mercury 2.5」を発表しました。このモデルは、従来のLLMが順次生成するのに対し、複数のトークンを並行して生成・修正する独自のアプローチを採用しています。性能は「GPT-5.6 Luna」のLow設定に匹敵しつつ、100万出力トークンあたり約120円という低コストで提供される点が特徴です。開発者にとっては、高速かつ低コストで高品質な文章生成が可能となり、リアルタイム性が求められるアプリケーションや大規模コンテンツ生成における新たな選択肢となるでしょう。","source":"GIGAZINE","url":"https://gigazine.net/news/20260909-inception-mercury-2-5-diffusion-text-generation-ai/","impact":"medium","tags":["拡散モデル","高速生成AI","LLM"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"RPAの限界を超える次世代AIワークフローツール「Pigeon Workflow」リリース","summary":"株式会社ロフタルは、最新のAI技術を駆使し、ブラウザ上のあらゆる業務をノーコードで自動化するAIワークフローツール「Pigeon Workflow」を正式リリースしました。このツールは、従来のRPAが抱えていた「壊れやすさ」や「知的判断の限界」を、AIが視覚的に画面を認識する機能と50種類以上のAIノードによる「思考の自動化」で克服しています。専門知識不要で最短15分でのワークフロー構築が可能であり、個人開発者やインディーハッカーにとっては、複雑な業務自動化を容易に実現できる強力なツールとなるでしょう。これにより、より高度な自動化ソリューションの創出が期待されます。","source":"PR TIMES","url":"https://prtimes.jp/main/html/rd/p/000000007.000084339.html","impact":"high","tags":["AIワークフロー","ノーコード","RPA代替"]},{"title":"AIによる開発効率が劇的に向上、1年かかるアプリ開発が1週間で完了する事例も","summary":"2026年のシステム開発現場では、AIによる超高速開発が現実のものとなり、米Anthropic社の「Claude Fable 5」などの高度なAIモデルを活用した事例が報じられました。従来エンジニア3人で1年を要したアプリ開発が、わずか1週間（実働16時間）で完了したという驚くべき成果が出ています。AIが1万件以上の多言語解説文作成やコード記述を担当し、開発プロセスを主導することで、開発期間が大幅に短縮されました。これは個人開発者やインディーハッカーにとって、アイデアを迅速に形にし、市場投入するまでの時間を劇的に短縮できる可能性を示唆しており、少人数での大規模開発も視野に入ってきます。","source":"YouTube","url":"https://www.youtube.com/watch?v=S3Jk3g2l7_Q","impact":"high","tags":["AI開発","高速開発","Claude Fable 5"]},{"title":"20代エンジニア向けAIハッカソン「AI HACK 2026」第2回開催","summary":"OrcaRouterが協賛する20代エンジニア向けのAIハッカソン「AI HACK 2026」の第2回が開催されます。敬老の日・国民の休日・秋分の日を含む5連休を利用し、参加者がAIプロダクトをゼロから作り切ることを目指すイベントです。初日にはオンラインキックオフで課題テーマが発表され、最終日には東京会場でピッチと表彰式が行われる予定です。個人開発者やインディーハッカーにとっては、自身のAI開発スキルを試す絶好の機会であり、新たなアイデアの創出や仲間とのネットワーキング、そして自身のプロダクトを世に問う場として非常に重要です。","source":"PR TIMES","url":"https://prtimes.jp/main/html/rd/p/000000028.000124372.html","impact":"medium","tags":["AIハッカソン","エンジニアイベント","プロダクト開発"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Google、次世代ノートPCブランド「Googlebook」の予約を9月21日より開始","summary":"Googleが展開する次世代ノートパソコンブランド「Googlebook」の予約開始日が、2026年9月21日（月）に決定しました。この「Googlebook」は、2026年秋発売予定として5月に発表された次世代インテリジェントシステム「Gemini Intelligence」のために特別に設計されています。この発表は、GoogleがハードウェアとAIの統合をさらに深め、エコシステムを強化する戦略の一環と見られます。開発者にとっては、Gemini Intelligenceを最大限に活用できる新たなプラットフォームの登場であり、AIネイティブなアプリケーション開発の機会が拡大するでしょう。","source":"Jetstream BLOG","url":"https://jetstream.bz/archives/163884","impact":"high","tags":["Googlebook","Gemini Intelligence","ノートPC"]},{"title":"Apple、折りたたみスマホ「iPhone DUO」と「iPhone 18 Pro」を発表","summary":"Appleは、先日の発表会で折りたたみスマートフォン「iPhone DUO」とシリーズ最新モデル「iPhone 18 Pro」シリーズを正式にお披露目しました。特に「iPhone 18 Pro/Pro Max」は、2nmプロセスを採用した新チップ「A20 Pro」と、可変絞りに対応した新しいカメラシステムが最大の注目点です。iPhone 18 Proは219,800円から、iPhone 18 Pro Maxは239,800円からで、予約開始は9月12日、発売日は9月18日と発表されました。開発者にとっては、新たなフォームファクターである折りたたみスマホへの対応や、A20 Proチップの高性能を活かしたアプリケーション開発、そして進化したカメラAPIの活用が求められるでしょう。","source":"note","url":"https://note.com/saban_jp/n/n2b7754d92419","impact":"high","tags":["iPhone DUO","iPhone 18 Pro","A20 Proチップ"]},{"title":"富士通、Arm CPU「FUJITSU-MONAKA」搭載サーバの販売を11月に開始","summary":"富士通は2026年9月14日、国産Arm CPU「FUJITSU-MONAKA」の単体販売と、同CPUを搭載する「Fujitsu MONAKA Server」の販売を11月に開始すると発表しました。このCPUは、AI推論のスループットを他社CPUの2倍に向上させ、冷却電力も最大80％削減できると説明されています。特に30～70Bパラメータ級のLLMを実用的な性能で動かせると掲げており、データセンターやエッジAI分野での活用が期待されます。開発者にとっては、Armベースの高性能AI推論環境が国内で提供されることで、省電力かつ高効率なAIモデルのデプロイメントや最適化の機会が広がるでしょう。","source":"XenoSpectrum","url":"https://xenospectrum.com/articles/fujitsu-monaka-commercial-launch","impact":"high","tags":["Arm CPU","FUJITSU-MONAKA","AI推論"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
