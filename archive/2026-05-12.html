<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年5月13日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年5月13日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Google、次世代LLM「Gemini Ultra 1.5」の詳細を発表、マルチモーダル推論が大幅強化","summary":"Googleは、同社の最上位LLMであるGemini Ultra 1.5の最新アップデートについて詳細を公開しました。特に注目されるのは、テキスト、画像、音声、動画など複数のモダリティを横断して推論する能力が大幅に向上した点です。この強化により、ユーザーはより複雑な指示を理解させたり、クリエイティブなコンテンツを生成したりすることが可能になります。企業向けソリューションや開発者向けのAPI提供が加速し、幅広い分野でのAI活用が期待されています。","source":"Google AI Blog","url":"https://ai.googleblog.com/","impact":"high","tags":["生成AI","LLM","Google Gemini","マルチモーダル"]},{"title":"OpenAI、企業向けカスタムAIモデル開発サービスを強化、セキュリティとプライバシーを重視","summary":"OpenAIは、企業が特定の業務要件に合わせて独自のAIモデルを開発・運用できるサービスをさらに強化すると発表しました。この強化は、特にデータセキュリティとプライバシー保護の側面を重視しており、企業が安心してAI技術を導入できる環境を提供します。オンプレミスやプライベートクラウド環境でのデプロイオプションが拡充されたことで、機密データを扱う企業でも生成AI技術を導入しやすくなります。これにより、企業はより安全かつ効率的にAIを活用し、ビジネス変革を加速させることが可能となるでしょう。","source":"OpenAI公式発表","url":"https://openai.com/enterprise","impact":"high","tags":["OpenAI","企業向けAI","セキュリティ","プライバシー"]},{"title":"Stability AI、次世代画像生成モデル「Stable Diffusion XL 1.5」を公開、高解像度とリアルさ追求","summary":"Stability AIは、オープンソースの画像生成モデル「Stable Diffusion」の最新版となる「Stable Diffusion XL 1.5」を公開しました。この最新バージョンでは、より高解像度でリアルな画像を生成できる点が大きな特徴です。さらに、プロンプトの解釈精度も大幅に向上しており、ユーザーの意図をより正確に反映した画像を生成できるようになりました。個人開発者やクリエイターは、このモデルを活用することで、高品質なビジュアルコンテンツを効率的に制作し、表現の幅を広げることが可能になります。","source":"Stability AI公式ブログ","url":"https://stability.ai/blog/","impact":"medium","tags":["画像生成AI","Stable Diffusion","オープンソース","クリエイターツール"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコードプラットフォームの進化が個人開発者の起業を加速","summary":"2026年に入り、ノーコード・ローコード開発プラットフォームがさらに進化し、個人開発者がアイデアを迅速に具現化し、市場に投入する障壁が大きく低下しています。特に、AIを活用した自動コード生成機能や、既存サービスとの連携機能が強化されたことが、この動きを加速させています。これにより、プログラミングスキルがなくても本格的なWebサービスやモバイルアプリを開発し、収益化する事例が飛躍的に増加しています。個人開発者は、より少ないリソースで革新的なプロダクトを生み出し、起業への道を切り開くことが可能となっています。","source":"TechCrunch Japan","url":"https://jp.techcrunch.com/","impact":"high","tags":["ノーコード","ローコード","個人開発","起業"]},{"title":"Web3技術を活用したコンテンツ収益化モデルがインディー開発者の新たな道に","summary":"ブロックチェーン技術やNFT、分散型アプリケーション（dApps）などのWeb3技術が、個人開発者やコンテンツクリエイターの新たな収益化モデルとして注目を集めています。従来の広告モデルやサブスクリプションモデルに加え、自身のデジタルアセットを直接販売したり、コミュニティ主導型のプロジェクトを立ち上げたりすることが可能になりました。これにより、より公平で透明性の高い収益分配が実現され、クリエイターが自身の作品から直接価値を得られるようになっています。インディー開発者にとって、Web3は新たな経済圏を構築し、持続可能な活動を可能にする重要な機会を提供しています。","source":"CoinDesk","url":"https://www.coindesk.com/","impact":"medium","tags":["Web3","NFT","ブロックチェーン","収益化"]},{"title":"マイクロSaaS市場の拡大、ニッチな課題解決ツールで成功する個人開発者が増加","summary":"特定のニッチな課題を解決する小規模なSaaS（Software as a Service）である「マイクロSaaS」市場が拡大しており、個人開発者が少人数で開発・運用し、成功を収める事例が増えています。AIによる自動化ツールや、特定の業務フローを効率化するプラグイン、クリエイター向けの補助ツールなど、ターゲットを絞り込んだ実用的なソリューションが特に求められています。参入障壁が比較的低いことから、インディーハッカーにとって非常に魅力的な分野となっており、多くの個人が独自のアイデアを形にしています。この市場の拡大は、多様なニーズに応える革新的なツールの誕生を促し、個人開発者の活躍の場を広げています。","source":"Product Hunt","url":"https://www.producthunt.com/","impact":"medium","tags":["マイクロSaaS","インディーハッカー","ニッチ市場","SaaS"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Apple、次世代XRデバイス「Apple Vision Pro 2」の開発を加速、軽量化とバッテリー改善に注力","summary":"Appleは、昨年発売された空間コンピュータ「Apple Vision Pro」の次世代モデル「Apple Vision Pro 2」の開発を加速していると報じられています。現行モデルの主要な課題とされていた本体の軽量化とバッテリー持続時間の改善に特に注力しており、ユーザー体験の向上を目指しています。これにより、より快適で長時間の利用が可能となり、一般消費者への普及をさらに推進する狙いがあると見られています。次世代モデルは、XR市場におけるAppleのリーダーシップを確固たるものにする重要な製品となるでしょう。","source":"Bloomberg Technology","url":"https://www.bloomberg.com/technology","impact":"high","tags":["Apple","XR","Vision Pro","ウェアラブルデバイス"]},{"title":"量子コンピューティング技術が実用化フェーズへ、特定分野での商用利用が開始","summary":"これまで研究開発段階にあった量子コンピューティング技術が、2026年に入りいよいよ実用化フェーズへと移行しつつあります。特に、金融分野での最適化問題、新素材開発におけるシミュレーション、医薬品開発での分子モデリングなど、特定のニッチな分野で商用利用が開始される事例が増加しています。量子アニーリングやゲート型量子コンピュータの性能向上がこの動きを強力に後押ししており、実社会での応用が現実のものとなりつつあります。この進展は、従来のコンピュータでは解決困難だった複雑な問題に対し、画期的なソリューションをもたらす可能性を秘めています。","source":"IBM Quantum","url":"https://www.ibm.com/quantum-computing/","impact":"high","tags":["量子コンピューティング","実用化","新技術","科学技術"]},{"title":"サイバーセキュリティ脅威が多様化、AIを活用した防御と攻撃の進化が加速","summary":"2026年においてもサイバーセキュリティの脅威は多様化の一途を辿っており、特にAIを活用した高度なフィッシング詐欺やランサムウェア攻撃が増加しています。これに対し、企業やセキュリティベンダーは、AIを用いた異常検知システムや自動防御メカニズムの開発を加速させており、防御側の進化も著しいです。AIが攻撃と防御の両面で主導的な役割を果たす「AI戦争」の様相を呈し始めており、常に最新の対策が求められています。この状況は、セキュリティ専門家にとって新たな挑戦であり、AI技術の倫理的な利用と規制の重要性を浮き彫りにしています。","source":"Forbes Cybersecurity","url":"https://www.forbes.com/cybersecurity/","impact":"high","tags":["サイバーセキュリティ","AI","脅威","防御"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
