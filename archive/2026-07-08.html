<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年7月9日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年7月9日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"AIエージェント向け次世代ファイル転送サービス「Quink」がリリース","summary":"株式会社ReplyDataが2026年7月8日に、AIエージェントや社内システムからのファイル転送・共有をREST API一本で完結させる「Quink」をリリースしました。このサービスは、OpenAIやAnthropicなどのLLMやAIエージェントが生成したドキュメントやレポートの外部共有、システムが自動生成したデータの取引先への転送など、AI時代のデータ連携におけるボトルネック解消とセキュリティ強化を目指しています。開発者にとっては、AIを活用したアプリケーションにおけるデータ連携の複雑さを軽減し、よりセキュアな環境でファイル共有が可能になるため、開発効率とプロダクトの信頼性向上に寄与するでしょう。特に、AI生成コンテンツの流通が増える中で、その管理と共有を効率化する基盤として注目されます。","source":"PR TIMES","url":"https://prtimes.jp/main/html/rd/p/000000003.000131659.html","impact":"medium","tags":["AIエージェント","ファイル転送","API連携","セキュリティ"]},{"title":"ソフトバンク傘下SB Intuitions、国産LLM「Sarashina3」を発表","summary":"ソフトバンク傘下のSB Intuitionsが2026年7月1日、高品質データと独自検証で日本語能力を強化した国産大規模言語モデル「Sarashina3」シリーズを発表しました。このシリーズには、「Sarashina3 mini」や軽量モデル「Sarashina3 nano」に加え、有害性判定ガードモデル「Sarashina3 guard」、ベクトル化モデル「Sarashina3 embedding」、リランキングモデル「Sarashina3 rerank」の計5種類が含まれます。独自の品質フィルタリングやデータ合成技術により多様で有用性の高いデータを拡充し、専門チームによる評価・検証を通じて高品質な日本語を安定して出力できるよう調整されている点が特徴です。開発者にとっては、多様な用途に対応する国産LLMの選択肢が増え、特に日本語に特化したAIアプリケーションの開発において、より高性能で信頼性の高い基盤モデルを利用できるようになるでしょう。","source":"ITmedia AI＋","url":"https://www.itmedia.co.jp/ait/articles/2607/01/news093.html","impact":"high","tags":["国産LLM","日本語AI","大規模言語モデル","ソフトバンク"]},{"title":"リアルワールドデータと生成AIを活用した治験候補患者抽出の共同研究を開始","summary":"近畿大学病院、中外製薬、NTT、NTTデータは2026年6月より、実臨床データと大規模言語モデル（LLM）を活用し、治験候補患者抽出の精度向上と効率化を検証する4者共同研究を開始したことを2026年7月7日に発表しました。この研究では、医師や治験コーディネーター（CRC）が個別診療情報を確認する従来の抽出手法と、LLMを組み合わせた抽出手法を比較・評価し、治験参加者組み入れまでのリードタイム短縮への寄与を多角的に検証します。開発者にとっては、医療分野におけるAIの応用事例として、LLMが複雑な医療データの解析と意思決定支援にどのように貢献できるかを示す重要な研究となります。将来的には、AIが医療現場の効率化と患者へのより迅速な治療提供に繋がる可能性を秘めています。","source":"がん情報サイト「オンコロ」","url":"https://oncolo.jp/news/260707mn01","impact":"medium","tags":["医療AI","LLM活用","治験","共同研究"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ソロ開発者が初のiOSアプリをローンチして学んだこと","summary":"Indie Hackersの「Top Posts from July 2026」に、あるソロ開発者が自身の初めてのiOSアプリローンチから得た教訓を共有する記事が掲載されました。この記事には、具体的な開発プロセス、マーケティング戦略、そしてユーザー獲得に関する実践的な洞察が含まれていると見られます。個人開発者にとっては、初めてのアプリ公開における課題や成功の秘訣を学ぶ貴重な情報源となるでしょう。特に、限られたリソースの中でプロダクトを市場に投入し、ユーザーに届けるための具体的なヒントが得られるため、自身の開発プロジェクトに活かせる知見が多く含まれていると期待されます。","source":"Indie Hackers","url":"https://www.indiehackers.com/post/top-posts-from-july-2026-6a56e792e3","impact":"medium","tags":["iOSアプリ","ソロ開発","マーケティング","Indie Hackers"]},{"title":"ソロファウンダーが適切なセグメントに注力し月間経常収益12.5万ドルを達成","summary":"Jason Zigelbaum氏が、ソロファウンダーとして月間経常収益（MRR）12.5万ドルを達成した秘訣をIndie Hackersで公開しました。彼は既存の顧客フィードバックから真の成長セグメントを見つけ出し、そこに注力することで、2年間の苦戦を経て毎年収益を倍増させ、6ヶ月で約50万ドルの新規年間収益を追加したと述べています。この成功事例は、個人開発者やスタートアップにとって、市場のニッチを見極め、顧客の声に耳を傾けることの重要性を示唆しています。開発者にとっては、プロダクト開発だけでなく、ビジネス戦略や顧客理解がいかに収益に直結するかを学ぶ上で非常に参考になる情報です。","source":"Indie Hackers","url":"https://www.indiehackers.com/post/hitting-125k-mrr-as-a-solo-founder-by-doubling-down-on-the-right-segment-0b731f8553","impact":"high","tags":["ソロファウンダー","MRR","ビジネス戦略","顧客フィードバック"]},{"title":"AIと作ったWebアプリをすぐに公開できるホスティングサービス「ロリポップ！デプロイナウ byGMOペパボ」提供開始","summary":"GMOインターネットグループは2026年7月2日、AIを活用したWebアプリを簡単に公開できるホスティングサービス「ロリポップ！デプロイナウ byGMOペパボ」の提供を開始しました。このサービスは、個人開発者やインディーハッカーが、AIと連携したプロダクトを迅速に市場投入するための環境を支援するものです。開発者にとっては、AIを組み込んだWebアプリケーションのデプロイと公開が格段に容易になるため、アイデアを素早く形にし、ユーザーに届けるまでのリードタイムを大幅に短縮できるメリットがあります。特に、インフラ構築の手間を省き、開発に集中できる環境は、個人開発の加速に貢献するでしょう。","source":"PR TIMES","url":"https://prtimes.jp/main/html/rd/p/000000003.000073957.html","impact":"medium","tags":["ホスティング","Webアプリ","AI開発","デプロイ"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"7月9日開催のグローバルテクノロジーバーチャル投資家会議でAIドローン、データセンターなどが発表","summary":"B2i Digital, Inc.は2026年7月9日に「Global Technology Virtual Investor Conference」を開催し、AIドローン、データセンター、予測市場などの分野で事業を展開する公開企業が発表を行います。この会議では、投資家はリアルタイムで質問し、経営陣との1対1のミーティングもリクエスト可能です。開発者にとっては、これらの分野における最新の技術トレンドや市場の動向、そして将来的な投資の方向性を把握する上で重要な情報源となるでしょう。特に、AIドローンやデータセンターといったインフラ関連技術の進化は、多くの開発プロジェクトの基盤となるため、その発表内容には注目が集まります。","source":"NewMediaWire","url":"https://www.newmediawire.com/news/ai-drones-data-centers-and-prediction-markets-public-companies-present-at-the-july-9-global-technology-virtual-investor-conference-906969","impact":"medium","tags":["AIドローン","データセンター","投資会議","テクノロジー動向"]},{"title":"Galaxy Unpacked 2026年7月：次世代AIは「賢いAI」から「理解するAI」へ","summary":"サムスン電子は、2026年7月22日にイギリス・ロンドンで開催される「Galaxy Unpacked」に先立ち、次世代のAIは単に「賢いAI」ではなく「ユーザーを理解するAI」が求められるとの見解を発表しました。スマートフォン、タブレット、スマートウォッチなどのデバイスが連携し、ユーザーの状況を深く理解することで、よりパーソナライズされたAI体験を提供することを目指しています。開発者にとっては、単一デバイスに閉じることなく、複数のデバイス間で連携し、ユーザーのコンテキストを理解するAIアプリケーションの設計が重要になることを示唆しています。これは、より高度でパーソナライズされたユーザー体験を提供するためのAI開発の新たな方向性を示すものと言えるでしょう。","source":"Samsung Newsroom Japan","url":"https://news.samsung.com/jp/galaxy-unpacked-july-2026-smarter-ai-understanding-ai","impact":"high","tags":["Galaxy Unpacked","パーソナライズAI","デバイス連携","AIの未来"]},{"title":"ホワイトハウスが量子技術サミットを産業界と開催","summary":"ホワイトハウスは2026年7月7日（火曜日）、量子情報科学技術の革新に特化したサミットを産業界と開催しました。この非公開イベントでは、サプライチェーン、人材育成、および新興技術に関する民間部門の洞察に焦点が当てられました。トランプ政権下の技術政策および政府機関のリーダーシップからの発言が予定されており、米国の量子技術の研究開発エコシステムの強化と、重要なネットワークのポスト量子暗号標準への移行を促進することを目的としています。開発者にとっては、量子技術の進展が将来的にソフトウェア開発やセキュリティに大きな影響を与える可能性を示唆しており、特にポスト量子暗号への移行は、既存の暗号システムに携わる開発者にとって重要な課題となるでしょう。","source":"Nextgov/FCW","url":"https://nextgov.com/emerging-tech/2026/07/white-house-host-quantum-tech-summit-industry-tuesday/388188/","impact":"high","tags":["量子技術","ホワイトハウス","ポスト量子暗号","技術政策"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
