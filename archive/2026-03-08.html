<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月9日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年3月9日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Google Gemini、企業向けにさらに強化された機能を提供開始","summary":"Googleは、同社の生成AIモデル「Gemini」の企業向け機能を大幅に強化しました。これにより、より高度なデータ分析、コンテンツ生成、そして開発者向けのコードアシスト機能などが提供されています。特に、セキュリティとプライバシーに最大限配慮した設計が強調されており、企業が安心してAIを業務プロセスに導入できる環境が整備されています。この進化は、ビジネスアプリケーション開発者にとって、Geminiを基盤とした新たなソリューションを構築する大きな機会をもたらすでしょう。","source":"Google Cloud Blog","url":"https://cloud.google.com/blog/ja/products/ai-ml/google-gemini-is-available-in-the-vertex-ai-model-garden","impact":"high","tags":["Gemini","企業向けAI","LLM"]},{"title":"Microsoft Copilot、Windows 11に統合され、よりパーソナルなAIアシスタントへ進化","summary":"MicrosoftのAIアシスタント「Copilot」が、Windows 11の主要機能として深く統合されました。これにより、ユーザーはOSレベルでファイル検索、設定変更、コンテンツ作成といった日常業務をAIの支援を受けて効率的に行えるようになります。この統合は、よりシームレスでパーソナルなコンピューティング体験を提供し、開発者はCopilotとの連携を通じて新たなアプリケーションやサービスを考案する機会を得るかもしれません。","source":"Windows Blog Japan","url":"https://blogs.windows.com/japan/2024/02/29/whats-new-in-windows-and-surface-ignite-2023/","impact":"medium","tags":["Copilot","Windows 11","AIアシスタント"]},{"title":"AIの進化と著作権、倫理に関する議論が国際的に活発化","summary":"生成AI技術の急速な発展に伴い、AIが生成したコンテンツの著作権帰属や、学習データに利用される既存作品の取り扱いに関する法的な議論が国際的に活発化しています。各国政府や業界団体は、クリエイターの権利保護とAI技術の健全な発展の両立を目指し、新たなガイドラインや規制の枠組みを検討中です。これは、AI開発者やコンテンツクリエイターにとって、今後の法的な枠組みを理解し、それに準拠した開発を進める上で非常に重要な動向となります。","source":"総務省","url":"https://www.soumu.go.jp/menu_news/s-news/01ryutsu02_02000438.html","impact":"high","tags":["著作権","AI倫理","法整備"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコードプラットフォーム、個人開発者の起業を加速","summary":"BubbleやAdaloといったノーコード・ローコード開発プラットフォームの進化が、プログラミングスキルを持たない個人でもアイデアを具現化し、ビジネスを立ち上げることを容易にしています。これにより、特定のニッチなニーズに応えるSaaSやモバイルアプリが次々と誕生し、個人開発者の起業が加速する傾向が見られます。これは、技術的な障壁が低減され、より多くの人々が自身のアイデアを市場に投入できるようになったことを示しており、個人開発者にとっては新たなビジネスチャンスが広がっています。","source":"note","url":"https://note.com/yuya_ogawa/n/n2b2256441b8c","impact":"high","tags":["ノーコード","ローコード","起業"]},{"title":"インディーゲーム開発、AIを活用したアセット生成と開発効率化が進む","summary":"個人でゲーム開発を行うインディーハッカーの間で、MidjourneyやStable Diffusionなどの画像生成AIを活用したアセット（キャラクター、背景、アイテムなど）の効率的な生成が急速に広がっています。この技術導入により、限られたリソースで開発期間を短縮しつつ、ゲームのビジュアルクオリティを大幅に向上させることが可能になっています。AIツールは、インディーゲーム開発者がより独創的で高品質な作品を生み出すための強力な味方となりつつあります。","source":"Mogura VR","url":"https://www.moguravr.com/ai-image-generation-for-game-development/","impact":"medium","tags":["インディーゲーム","AIアセット生成","開発効率化"]},{"title":"個人開発者のためのコミュニティと情報共有が活発化、成功事例を共有する動きも","summary":"GitHubやReddit、X（旧Twitter）などのオンラインプラットフォームでは、個人開発者やインディーハッカーが互いに情報やノウハウを共有し、協力し合うコミュニティが活発化しています。成功事例や失敗談がオープンに共有されることで、これから個人開発を始める人々にとって貴重な学びの場となっています。このような活発な情報交換は、個人開発者が直面する課題を解決し、新たなプロジェクトを成功させるための重要な基盤を提供しています。","source":"Forbes","url":"https://www.forbes.com/sites/forbestechcouncil/2024/03/05/the-rise-of-indie-hackers-and-the-future-of-startup-innovation/?sh=22081d0966f3","impact":"medium","tags":["コミュニティ","情報共有","インディーハッカー"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Apple Vision Pro、空間コンピューティングの新たな可能性を提示","summary":"Appleが発表した空間コンピュータ「Vision Pro」は、現実世界とデジタルコンテンツを融合させる革新的なユーザーインターフェースを提供しています。このデバイスは、エンターテイメント、コミュニケーション、生産性向上など、様々な分野での活用が期待されており、米国での発売後、今後のグローバル展開が注目されています。Vision Proは、開発者にとってAR/VR空間での全く新しいアプリケーション体験を創造する大きな機会をもたらし、空間コンピューティング時代の幕開けを告げるものとなるでしょう。","source":"Apple Japan","url":"https://www.apple.com/jp/apple-vision-pro/","impact":"high","tags":["Apple Vision Pro","AR/VR","空間コンピューティング"]},{"title":"半導体業界、AI需要の高まりで記録的な成長を継続","summary":"AI技術の急速な発展は、高性能な半導体チップの需要を大幅に押し上げており、半導体業界は記録的な成長を続けています。NVIDIAなどの主要企業は、AI向けチップの開発と生産を加速させ、データセンターやエッジデバイスにおけるAI処理能力の向上に貢献しています。この動向は、AIモデルのトレーニングや推論に必要なハードウェアの進化を促進し、AI開発者がより複雑で大規模なモデルを扱えるようになる基盤を提供しています。","source":"経済産業省","url":"https://www.meti.go.jp/press/2023/02/20240229003/20240229003.html","impact":"medium","tags":["半導体","AI需要","経済"]},{"title":"サイバーセキュリティの脅威が多様化、AIを活用した防御策が重要に","summary":"ランサムウェア攻撃やフィッシング詐欺など、サイバーセキュリティの脅威は年々高度化・多様化しています。これに対し、従来の防御策だけでは対応が困難になりつつあり、AIを活用した脅威検知、異常行動分析、自動対応といった先進的なセキュリティソリューションの導入が企業にとって不可欠となっています。開発者は、自身のアプリケーションやサービスにセキュリティを組み込む際、AIを活用した最新の防御策を考慮に入れることがこれまで以上に求められます。","source":"IPA","url":"https://www.ipa.go.jp/security/security-alert/2024/0229.html","impact":"high","tags":["サイバーセキュリティ","AI防御","脅威対策"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
