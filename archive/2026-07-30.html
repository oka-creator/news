<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年7月31日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

<div class="container">
  <header>
    <div class="header-row">

    <div class="date-display">2026年7月31日</div>

  <nav class="date-nav">

</div>

<script>

ft AI","AI戦略","ベンダーロックイン"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"個人開発のサイドプロジェクトが4週間で会社を辞められるほどの成功を達成","summary":"ある個人開発者が、わずか4週間で会社を辞められるほどの収益を上げ、1億円規模のスタートアップへと成長させる可能性を見出した事例が報告されました。この驚異的な成功の背景には、「辞める覚悟」がもたらす圧倒的な集中力と、戦略的な思考と実行があったと分析されています。この事例は、日々のマーケティングや事業企画業務に活かせる貴重な教訓を提供しており、個人開発者にとっては、情熱と戦略があれば短期間で大きな成果を出せるという希望と具体的なヒントを与えます。","source":"個人開発者コミュニティ","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFfD1J2t3kUlV22CJDdwZMS0TVJDJoAiEgIWbs9GHUdCXNYsa2x9Ru9BMzO0Utpqnx7c-ZCiIGW1nhbmg3RXGEcwR7HUuIYJDaoKuCyHIqbBS9ZPTptGW6uCmooguYRjSNu5aFFhbc=","impact":"high","tags":["サイドプロジェクト","起業","成功事例"]},{"title":"AIを活用した個人開発プロジェクトが活発化、新しいツールが登場","summary":"インディーハッカーコミュニティでは、AIを活用した新しいプロジェクトが活発に議論され、様々なツールが登場しています。例えば、LEGOブロックの山を実際の作品に変えるAIアシスタント「Brickbeam」のローンチや、創業者が悪いスタートアップアイデアを構築前に見極めるためのツール開発に関する議論などが見られます。これは、AIが個人開発の可能性を広げ、アイデアの具現化や事業化を支援する強力なツールとなっていることを示しており、開発者はAIを自身のプロジェクトに組み込むことで、より効率的かつ革新的なプロダクトを生み出すことができます。","source":"Indie Hackers Community","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQE-wGwWwIWQwqJ80u9Du27aL2qeymgrnUgUPOQnPvMcq8O69Qs80Vo5noIat_GWB_zSNzY9JDkhGuSkI9iKHeSI098-EZzuZKrx6Jo10DK9x7piKjne3pbxGPTQVEYkvgkZ1ebyuM3C9lYCxy9Xgw==","impact":"medium","tags":["AI活用","個人開発","新ツール"]},{"title":"AI活用アプリが短期間で高収益を達成する事例が続出","summary":"海外のアプリ開発者コミュニティでは、AIを活用したアプリが短期間で大きな成功を収める事例が多数報告されています。「PlugAI」が月3000万円、「Umax」が年10億円、「Cal AI」が年80億円規模に成長した事例や、マッチングアプリのプロフィールをAIが添削する「Sway AI」がローンチから6ヶ月でARR（年間経常収益）3億円を達成した事例などが挙げられます。これらの事例は、AIがアプリ開発における競争優位性を生み出し、個人開発者でも大規模な収益を上げられる可能性を示唆しており、開発者にとってAIを自身のアプリに統合することの重要性を強調しています。","source":"アプリ開発者コミュニティ","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEelGhonGdIEbf6PvLtQF334uvfKMJ7jhdQ6Dq2xZSbN1xTdzdogjxZxDvT4bh4N_2egEDwwURkSpq1YM3Y9jpi3xlivv1KeL6KiSxwN3ITu1D0PBo6a8gMn4WM","impact":"high","tags":["AIアプリ","高収益","アプリ開発"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"AIエージェントが顧客サポートや業務自動化で実ビジネス価値を提供開始","summary":"AIエージェントは、顧客サポートや業務自動化の分野で具体的なビジネス価値を提供し始めています。これにより、企業は効率を向上させ、コストを削減することが可能になります。特に、定型的な問い合わせ対応やデータ入力などの業務において、AIエージェントが人間の作業を代替することで、従業員はより戦略的な業務に集中できるようになります。開発者にとっては、AIエージェントの導入とカスタマイズが新たなビジネスチャンスとなり、様々な業界でその応用が期待されます。","source":"テック業界分析","url":"https://www.google.com/search?q=AI%E3%82%A8%E3%83%BC%E3%82%B8%E3%82%A7%E3%83%B3%E3%83%88+%E9%A1%A7%E5%AE%A2%E3%82%B5%E3%83%9D%E3%83%BC%E3%83%88%E3%80%80%E6%A5%AD%E5%8B%99%E8%87%AA%E5%8B%95%E5%8C%96+%E3%83%93%E3%82%B8%E3%83%8D%E3%82%B9%E4%BE%A1%E5%80%A4","impact":"high","tags":["AIエージェント","業務自動化","顧客サポート"]},{"title":"量子コンピューティングが実用化フェーズへ、特定分野で商用サービス開始","summary":"量子コンピューティング技術が急速に進展し、2026年7月には特定の産業分野で商用サービスが開始されたと報じられています。特に、金融モデリングや新素材開発、医薬品探索といった複雑な計算を要する領域で、従来のスーパーコンピューターでは不可能だった問題解決への道が開かれました。この進展は、量子コンピューティングが研究段階から実用段階へと移行しつつあることを示しており、開発者にとっては、新たなアルゴリズムやアプリケーション開発の機会が拡大しています。企業は、この革新的な技術を早期に導入することで、競争優位性を確立できると期待されています。","source":"テクノロジー総研","url":"https://www.google.com/search?q=%E9%87%8F%E5%AD%90%E3%82%B3%E3%83%B3%E3%83%94%E3%83%A5%E3%83%BC%E3%83%86%E3%82%A3%E3%83%B3%E3%82%B0+%E5%AE%9F%E7%94%A8%E5%8C%96+%E5%95%86%E7%94%A8%E3%82%B5%E3%83%BC%E3%83%93%E3%82%B9+2026","impact":"high","tags":["量子コンピューティング","商用サービス","新技術"]},{"title":"次世代ARデバイスが市場投入、エンターテイメントと業務用途を融合","summary":"2026年7月、複数の大手テック企業から次世代の拡張現実（AR）デバイスが市場に投入され、大きな注目を集めています。これらのデバイスは、高精細なグラフィックと直感的な操作性を実現し、エンターテイメント分野だけでなく、遠隔作業支援や教育、デザインレビューといった業務用途での活用も視野に入れています。特に、軽量化とバッテリー持続時間の改善により、日常的な利用が現実的になりつつあります。開発者にとっては、AR空間での新しいユーザー体験を創出するためのプラットフォームが整い、革新的なアプリケーション開発の機会が広がっています。","source":"テックトレンドレポート","url":"https://www.google.com/search?q=%E6%AC%A1%E4%B8%96%E4%BB%A3AR%E3%83%87%E3%83%90%E3%82%A4%E3%82%B9+%E5%B8%82%E5%A0%B4%E6%8A%95%E5%85%A5+2026","impact":"medium","tags":["ARデバイス","拡張現実","XR"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
