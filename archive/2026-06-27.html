<head>

<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);

    text-align: center;
    line-height: 1.4;
    white-space: nowrap;

  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }

    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>

G2hYYQGbC1E6zP2j7t2j8-fB","impact":"high","tags":["動画生成AI","バイトダンス","コンテンツ制作","AIモデル"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"個人開発ゲーム「めっちゃカメレオン」、発売12日で700万本突破の異次元ヒット","summary":"日本の個人開発者が手掛けたかくれんぼゲーム「めっちゃカメレオン」が、Steamでの発売からわずか12日間で販売本数700万本を突破する異例の大ヒットを記録しました。このゲームは、真っ白なキャラクターに絵を描いて背景に紛れるという独自のシステムが特徴で、SNSやYouTubeでの実況動画を通じて世界中に拡散されました。この成功は、斬新なアイデアとSNSを通じた効果的なプロモーションが、大規模な開発チームを持たない個人開発者でも世界的なヒットを生み出せることを証明しています。インディーゲーム開発者にとって、創造性とコミュニティの力が成功の鍵となることを示す、大きな励みとなる事例です。","source":"ITmedia NEWS","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFjl5lWXDNaDjn9tLbjDfx0q9CCSrYkGnks_luVvU94P_438FDutEypxnlCvGbmzrjZeozi_9ugKO4EGasupkzf1YuuUO18jnx0GNr66SJcj0c3AarpfP_JXHHJIXetiBmUjjCKKU2vH2jh39eFSjC8NJe63c8k","impact":"high","tags":["インディーゲーム","個人開発","Steam","ヒット事例"]},{"title":"個人開発ハイスピードメカシューティング『オメガフェネクス』、クラファン開始1日で目標300万円達成","summary":"個人開発者のするめまんじゅう氏が開発するハイスピードメカシューティングゲーム『OMEGA PHENEX COMMENCED PROJECT SIX』のクラウドファンディングが、開始わずか1日で目標金額300万円を達成しました。この迅速な目標達成は、ゲームに対するコミュニティの高い期待と、個人開発者の情熱が支持された結果と言えるでしょう。クラウドファンディングは、インディーゲーム開発者が資金を調達し、プロジェクトを推進するための強力な手段であることを改めて示しています。開発者にとっては、自身のアイデアが市場に受け入れられる可能性を測り、直接ユーザーと繋がる貴重な機会を提供します。","source":"PR TIMES","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFWnyP6qYFFd9NhHHKlGolvPhnAiw-DBat8KAKo7kAStFwDTXt0EYOL0l9T5pVOl2szxD_rHHvT_DEEqo3ipeRT2eWNRu-jsEGqYMmVGurUM2Bpjt6VHdZcX6oHGne5aPX8A29lxQeRZA==","impact":"medium","tags":["インディーゲーム","クラウドファンディング","シューティングゲーム","個人開発"]},{"title":"海外Indie Hackersの間でXとAIを掛け合わせた「Micro-SaaS」の極小起業トレンドが熱狂中","summary":"海外のX（旧Twitter）やIndie Hackersコミュニティで、「Micro-SaaS」と呼ばれる極小起業のトレンドが注目を集めています。これは、数日から1週間程度の短期間で小さなWebプロダクトを開発し、年商数千万円を達成する事例が多数出現している現象です。SNSでユーザーの不満を見つけ、それに対する解決策となるAIを活用したツールを迅速に提供するというアプローチが成功の鍵とされています。このトレンドは、個人開発者が少ないリソースで大きなビジネスチャンスを掴める可能性を示しており、AI技術とSNSを組み合わせた新しい起業モデルとして開発者コミュニティに大きな刺激を与えています。","source":"note（Masa | 仕組み化AI開発者）","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEYsB7-ydB5L77Eyfdb6r4bNn7rPv35XDFydLiAsKauTuaUWcN3OYDBX0qbodS0HZXANbB6lnmjziXhUTSI-Vml85edjpnw7V_PANr7Acgl4_fee4pq7tK5-_xEXzw2wvcJbYc=","impact":"high","tags":["Micro-SaaS","Indie Hackers","AI活用","起業トレンド"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Android XR対応グラス型デバイス「XREAL AURA」、2026年秋に日本を含む世界各国で発売予定","summary":"中国XREALが、米Google、米Qualcommと共同開発したグラス型XRデバイス「XREAL AURA」を2026年秋に世界各国で発売すると発表しました。このデバイスはGoogleのXRプラットフォーム「Android XR」とAIアシスタント「Gemini」を統合し、Qualcommの最新XRプラットフォーム「Snapdragon Reality Elite」を搭載した専用空間演算ユニットと有線接続することで、クラウドに頼らないオンデバイスAI処理に対応します。XR市場の競争が激化する中、主要テック企業が連携して開発を進めることで、高性能かつユーザーフレンドリーなXR体験が実現されるでしょう。開発者にとっては、Android XRプラットフォーム上での新しいアプリケーション開発の機会が広がり、オンデバイスAI処理の活用により、よりリッチでインタラクティブなXRコンテンツの創造が可能になります。","source":"ITmedia NEWS","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGmUmRPazVGTdp_T8Wh2J0INAQUEKVzhVpj8eyfQGdcjByBr44AteVxeLxcdNWBTU5clf9jA2YNa4qjqQwxXe2bpp9YuDIjcaO6JymWjcCLhr6K8I9d3IK0_iGgZy9KGCAsJhQm2qVxonfTAN-mXivUhqGA8hoD","impact":"high","tags":["XRデバイス","Android XR","AIアシスタント","空間コンピューティング"]},{"title":"AI普及による水需要増に対応、シンガポールで半導体・データセンター向け産官学同盟設置へ","summary":"シンガポール公益事業庁（PUB）は、AI普及拡大に伴うデータセンターや半導体プラントの水需要増大に対応するため、「産業用水ソリューション（IWS）イノベーション・エコシステム同盟」の設置に向けた覚書を締結しました。AIの普及により、データセンターのサーバー冷却や半導体製造工程で大量の水が必要となり、水資源の確保が喫緊の課題となっています。この産官学連携は、テクノロジーを活用して水資源の持続可能な利用を目指すもので、AIインフラの環境負荷低減に貢献するでしょう。開発者にとっては、AIソリューションを設計する際に環境影響、特に水資源への配慮がより重要になることを示唆しており、持続可能なAI開発への意識を高めるきっかけとなります。","source":"ジェトロ","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEkFrSfMGAsbToeN03VVKYjGaKneO-1i7Kxwuu2adZnN4fCDpj9LlXyfBSTNA5ou3DJQ4aSLjYxWGZlOzxb2blQLtWQvYlcTjCUIJ3rjqLJCWQuQpMUOE8eVvQOEzUWOMQWgCM4pLghrSu8VFrgmpJIrSWQiFkydg==","impact":"medium","tags":["AIインフラ","水資源","サステナビリティ","環境問題"]},{"title":"AI株と半導体株を中心に世界的なハイテク株の売りが激化","summary":"2026年6月23日、アメリカの半導体株が過去最高値から急落し、半導体指数(SOX)が7.9％下落しました。Micronやサンディスク、NVIDIAといった主要企業も大幅に株価を下げ、この売りは韓国のSK hynixやSamsung株にも波及し、世界的なハイテク株の売りが激化しています。AIブームを牽引してきた半導体セクターの調整は、市場が過熱感から冷静さを取り戻しつつある兆候と見られます。開発者にとっては、AI関連企業の資金調達や投資環境に影響が出る可能性があり、今後のプロジェクト計画やキャリアパスを考える上で市場動向を注視する必要があるでしょう。長期的なAI成長への期待は変わらないものの、短期的な市場の変動には注意が必要です。","source":"GIGAZINE","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHCQIUFG9Mzbwu67-xaXBjbvdcmwiM75mipY5n2rszeIIzYken0BAIlRNW76p7CEZSoj_KYNlVwpRdgtsznCG6bL--1xA4Fmd34lkWAbu94yH7Z8MAFUt0qx00rB6W98vqIMEpkch_yxNn4lKUDv5fu2ehuDw==","impact":"high","tags":["AI株","半導体株","市場動向","経済影響"]}]}];

    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
