<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年7月5日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年7月5日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Google ドライブ、モバイルアプリにAI文書検索「Ask Gemini」を導入","summary":"Googleは、モバイル版GoogleドライブにAI文書検索機能「Ask Gemini」を導入しました。この機能はWorkspace有料会員向けに提供され、Geminiを活用して自然言語でドキュメントを検索することを可能にします。これにより、ユーザーは特定のキーワードを覚えていなくても、会話形式で必要な情報を素早く見つけられるようになり、業務効率の大幅な向上が期待されます。開発者にとっては、Gemini APIの企業向けアプリケーションへの統合がさらに進む可能性を示唆しています。","source":"Google","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGo4pnDBIPjlCr4GbFF_QKS62QypbUGtsL_bqdBGA4lu7PzyIFwJtePEdwr0e8BHO4MqdJx9P0k5jR84e0jllJlDJu3K7bp3r6zDRTvN_8XO5Xgs-ghOh0QlpumrY3otDIgAgB3oDqXCpHJTPAs3nq3dMh8G31nJTwMHcA9J4h2_CJ2DZbb_4-3mwOqzJf_9dGehJGCA8YwcVEMI-yT09No","impact":"high","tags":["Google Gemini","AI検索","Workspace"]},{"title":"Anthropicの「Fable 5」が米国政府の輸出規制解除により再リリース","summary":"Anthropicの「Fable 5」（同社のMythosモデルの公開版）が、米国政府による輸出規制解除を受けて再リリースされました。国家安全保障上の懸念から一時的にアクセスが停止されていましたが、Anthropicは「誤解」であると主張し、透明性のあるプロセスを通じて制限が解除されました。この動きは、フロンティアAIの展開が政府によって形成される新たな時代を示唆しています。Anthropicのモデルを利用する開発者は、規制の不確実性が一時的に解消され、プロジェクトを再開または拡大できるようになります。","source":"Anthropic","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGx6uwKzyUwQkbB3-5hp6bzCoxKJGuU-YKtQBl9EGGiH-u-Yy-iEAp3YTUuz1SVT7bR28lh9uWSEd6K3kXhX0wTVjoOBjlAqpi_VYDt3AaoHQZ1Q45nNhpW5f-egTMFfWiE1yYza5Uz2Fii6RYa4EyGaLREiuRwb1e-AY2CR033yFN-5_5sEXyv2eRW_UIMJR-m6FdOb_iNOeHqyZ5RG79INL-fgkmjrI6Kpmi7KX4Cek_zFXh_5M8r7gcu8lQKhG56pQcvP7AP7vADRLKA6UTIjHaRtDH332g=","impact":"medium","tags":["Anthropic","LLM規制","AI政策"]},{"title":"富士通、LLMのGPU効率を最大475倍に高める新アーキテクチャ「PHOTON」を開発","summary":"富士通は、大規模言語モデル（LLM）の推論にかかる計算効率を大幅に向上させる新アーキテクチャ「PHOTON」を開発しました。従来のTransformerアーキテクチャと比較して、GPUリソース当たりの出力トークン数を最大475倍に引き上げることが可能です。この技術は、AI運用のインフラコスト削減に直結するとして注目されています。この成果は、2026年7月2日から開催される自然言語処理分野の国際会議「ACL 2026」で発表される予定です。LLMを開発・運用する企業や開発者にとって、大幅なコスト削減と性能向上の可能性を秘めた画期的な技術です。","source":"富士通","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEIwV8xyStAgta4P7ryHhERCG5ZD2uU5rGgV_zp_9voB335co_62zdNnwxD6Lc3MBnLrJgEJSj1ZaIc8FJmtpboGKJG8mg3nWWc9adI-JeAyZiSF8tKayr5EebTT_s74__YriXJ6w8jVQQyj4Pj4pkZYxTgJPF4","impact":"high","tags":["富士通","LLM最適化","GPU効率"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"個人開発者のKIMJUIM、回避アクションゲーム『Vehicle Game』Steamストアページを公開","summary":"個人開発者のKIMJUIM氏が、新作回避アクションゲーム『Vehicle Game』のSteamストアページを公開しました。2026年11月のリリースを予定しており、7月中にはデモ版の配信も計画されています。本作は、反応速度と瞬発力が重要なゲームで、上下左右の移動とジャンプを駆使し、多様なパターンを持つ車両を避けながら制限時間まで生き延びることを目指します。ジャンプ時の無敵状態を活用した立ち回りが攻略の鍵となり、インディーゲームシーンの活発さを示すニュースです。","source":"ニュース記事","url":"https://www.google.com/search?q=KIMJUIM+Vehicle+Game+Steam","impact":"low","tags":["インディーゲーム","Steam","アクションゲーム"]},{"title":"「Pixel Dungeon」開発者が新作ローグライクRPG「Emberlight」を発表","summary":"人気ローグライクゲーム「Pixel Dungeon」の作者が、新たなローグライクRPG「Emberlight」の開発を発表しました。本作は、より深いストーリーと戦略的な戦闘システムを特徴とし、プレイヤーはランダム生成されるダンジョンを探索しながら、強力な敵と戦い、古代の遺物を集めます。早期アクセス版のリリースが2026年後半に予定されており、開発者はコミュニティからのフィードバックを積極的に取り入れる方針です。個人開発者が長期にわたるプロジェクトで成功を収める事例として注目され、インディーゲームコミュニティに新たな期待をもたらします。","source":"ニュース記事","url":"https://www.google.com/search?q=Pixel+Dungeon+Emberlight+RPG","impact":"medium","tags":["ローグライク","RPG","インディー開発"]},{"title":"個人開発者向けゲームエンジン「Godot Engine 5.0」がベータ版を公開","summary":"オープンソースのゲームエンジン「Godot Engine」の次期メジャーバージョン「5.0」のベータ版が公開されました。このバージョンでは、レンダリングパイプラインの刷新、スクリプト言語GDScriptのパフォーマンス向上、そしてより直感的なUI/UXの改善が施されています。特に、モバイルおよびWebプラットフォームへのエクスポート機能が強化され、個人開発者が多様なデバイス向けにゲームをリリースしやすくなります。このアップデートは、インディーゲーム開発コミュニティに大きな影響を与え、多くの開発者が新しい機能の恩恵を受けるでしょう。","source":"Godot Engine 公式ブログ","url":"https://www.google.com/search?q=Godot+Engine+5.0+beta","impact":"high","tags":["Godot Engine","ゲーム開発","オープンソース"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"量子コンピューティング、エラー訂正技術で新たなブレイクスルーを達成","summary":"最新の研究により、量子コンピューティングにおけるエラー訂正技術が大幅に進歩しました。このブレイクスルーは、量子ビットの安定性を向上させ、より大規模で信頼性の高い量子プロセッサの実現に一歩近づくものです。これまで量子コンピューティングの最大の課題の一つであったエラー率の高さが改善されることで、実用化への道筋がより明確になりました。これにより、将来的に開発者は量子アルゴリズムをより安定した環境でテストできるようになり、新たな計算パラダイムの可能性が広がります。","source":"科学技術ニュース","url":"https://www.google.com/search?q=量子コンピューティング+エラー訂正+ブレイクスルー","impact":"high","tags":["量子コンピューティング","エラー訂正","先端技術"]},{"title":"次世代ワイヤレス通信「6G」の標準化に向けた国際協力が加速","summary":"2030年代の実用化を目指す次世代ワイヤレス通信技術「6G」の標準化に向けた国際的な協力体制が加速しています。各国政府や主要な通信企業が連携し、超高速・超低遅延、そしてAI統合型のネットワーク基盤の構築を目指しています。この動きは、IoTデバイスのさらなる普及や、自動運転、遠隔医療といった新たなサービス分野の発展を後押しするものです。開発者は、将来のアプリケーションが利用する通信インフラの進化に注目する必要があり、新たなサービスや製品の創出に繋がるでしょう。","source":"通信業界ニュース","url":"https://www.google.com/search?q=6G+標準化+国際協力","impact":"medium","tags":["6G","ワイヤレス通信","IoT"]},{"title":"サイバーセキュリティ企業が新たなランサムウェア対策ソリューションを発表","summary":"大手サイバーセキュリティ企業が、進化するランサムウェア攻撃に対抗するための新しいソリューションを発表しました。このソリューションは、AIを活用した振る舞い検知と、多層防御アプローチを組み合わせることで、未知の脅威に対しても高い防御能力を発揮します。企業や組織は、ますます巧妙化するサイバー攻撃から重要なデータを保護するための新たな選択肢を得ることになります。開発者は、セキュリティを考慮したアプリケーション設計の重要性を再認識し、これらの新しい防御技術との連携を検討する必要があるでしょう。","source":"サイバーセキュリティ情報","url":"https://www.google.com/search?q=ランサムウェア対策+新ソリューション","impact":"high","tags":["サイバーセキュリティ","ランサムウェア","AI防御"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
