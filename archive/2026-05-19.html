<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年5月20日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年5月20日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"NTT、LLM「tsuzumi 2 Visionモデル」で図表理解を強化","summary":"NTTが軽量で日本語処理に優れるLLM「tsuzumi 2」のアップデート版として「tsuzumi 2 Visionモデル」を発表しました。この新モデルは、新たに図表の入力や理解が可能になり、図表入りのビジネス文書の内容を「理解」して情報を容易に取り出せるようになります。これにより、電子化された情報の多くが「目視前提」で存在するという現状を打破し、幅広い日本語ビジネス文書を生成AIで活用できるようになるため、業務支援の幅が大きく広がると期待されています。開発者にとっては、より複雑なデータ形式を扱えるAIソリューションを構築する道が開かれ、新たなビジネス機会が生まれるでしょう。","source":"Impress Watch","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHY_PxNiYuHtZBDiPLkmh1boArQtJtCVt2IMKUB9kOFf7SWvk5hFnh-5kJNRr_GLOoKO2nSv6EiFOTMiM0kEl_rX8SenV2PQwFf9b9BA5fP_drBKmn4ezEdnbRR7_4zpjlgO7kgFB0garABcQjuVUZy6A==","impact":"high","tags":["LLM","NTT","画像認識AI","業務効率化"]},{"title":"Google I/O 2026で新AIモデル「Gemini Omni」と「Gemini 3.5 Flash」が発表","summary":"GoogleはGoogle I/O 2026にて、新たなAIモデル「Gemini Omni」と「Gemini 3.5 Flash」を発表しました。Gemini Omniは、高度なインテリジェンスと最高峰の生成メディアモデルを融合させ、「どのような入力からでも、あらゆるものを作成できる」点が最大の特徴で、人工汎用知能（AGI）実現に向けた重要なステップとされています。また、Gemini 3.5 Flashは、エージェントやコーディングに特化したLLM系列のモデルとして、本日（2026年5月20日）より提供が開始されています。これらの発表は、AI技術の進化を加速させ、開発者にはより強力なツールと新たな開発の可能性を提供するでしょう。","source":"ケータイ Watch","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQE9DYaJV-fIqKugPl2uOFVi4njq9fqbGpZq0UAz5VupnzWEFjRU69rE7UunYyq48YIB6J4VBpJyf5kSZOTRnrUVnDuwZQGP7m1LchGwoVc9gxbEiQ1B7p9nD6pUSZQZK_wN033-_yfFjTuTcVbLOKLCwlvY","impact":"high","tags":["Google","Gemini","AGI","LLM"]},{"title":"LLM量子化技術が進化、生成AIのエッジ・オンプレミス展開を加速","summary":"大規模言語モデル（LLM）の実用化における大きな課題であったメモリー消費削減に向け、LLM量子化の研究が盛んになっています。この技術が進展すれば、生成AIをクラウドだけでなく、より小型の端末や社内サーバー、エッジ環境で動かすことが容易になり、AI普及のボトルネック解消につながると期待されています。開発者にとっては、より多様な環境でAIアプリケーションを展開できる可能性が広がり、新たなビジネスモデルの創出に貢献するでしょう。","source":"日経クロステック","url":"https://xtech.nikkei.com/atcl/nxt/column/18/00001/11749/","impact":"medium","tags":["LLM","量子化","エッジAI","オンプレミス"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"集英社ゲームズが新たなゲーム企画の公募を開始","summary":"株式会社集英社ゲームズは、2026年5月19日より新たなゲーム企画の公募を開始しました。今回の公募では、企画書とポートフォリオのみで応募が可能であり、すでに制作中のゲームだけでなく、これから制作を始める企画も対象となります。これは、インディーゲーム開発者にとって、自身のアイデアを実現し、世に送り出す大きなチャンスとなるでしょう。開発者はこの機会を活用し、独創的なゲームを世に問うことができるでしょう。","source":"IndieGamesJp.dev","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQF7x5_tfnF9DWGhFCq4Nt4pJZljNYscMuz2JORHU5VSyiJzMTZOlxVXCmYQeECnEEWY254Ma-64lUhxKH_6tm-E3cDSXQuc3TrOeoi70BArZe4qwq8=","impact":"high","tags":["インディーゲーム","ゲーム開発","集英社ゲームズ","公募"]},{"title":"AIを活用したユニークなWebサービス開発のアイデアと共同開発の呼びかけ","summary":"個人開発者の間で、AI、特にLLMのコンテキストキャッシュ機能とクラウドサービスを組み合わせたユニークなWebサービス開発への関心が高まっています。例えば、「AIマスターが客の噂話を媒介するレトロ喫茶」のような企画では、プログラミング知識がなくてもAIとチャットするだけでAIエージェントやWebアプリを自動生成する「バイブコーディング」ソリューションの活用や、GitHubでのオープンソース化を通じた共同開発の可能性が議論されています。これは、AIを活用した新しいサービス創出の動きを加速させ、開発者間のコラボレーションを促進するでしょう。","source":"note（korio）","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFvPFRV5rMTJH18pZF1yfTDZ02UUwEAEeLnsnSHlxSn8w0x5E5beTunSDRWJdmJ3ZoCviI9lp-zu-b9jRBLy5C066ZYJ33cMIGDb5jWKuFFZzohKjwvTOnoZOv3vSdWZ3ndjCdUA_dyvffa","impact":"medium","tags":["AI開発","Webサービス","LLM","共同開発"]},{"title":"xAIがオープンソースAIエージェント「Hermes Agent」への接続を提供、開発者層を狙う","summary":"xAIは、オープンソースAIエージェント「Hermes Agent」への接続を可能にしたと発表しました。これにより、個人開発者やインディーハッカーは、より手軽に高度なAIエージェントを自身のプロジェクトに組み込むことができるようになります。この動きは、AI開発の敷居を下げ、多様なアプリケーションの創出を促進すると注目されています。開発者にとっては、強力なAI機能を自身のサービスに統合する機会が広がり、イノベーションを加速させるでしょう。","source":"innovaTopia","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHN8KOOEqgXyxH3GSE3NwKfxCSJY5QMc7b-dNwjDdJgINRYkFyvM-D-mTroGbnQOEZZs5cGJwei-ACLJy0RI1QHnZBilgi5kb_6sVX9A9Ox0FCrtVZsOWdOTPdYpScFjhdr_fgjnjJ5b5mnaiJhte4","impact":"medium","tags":["xAI","AIエージェント","オープンソース","個人開発"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"KDDIがAI基盤・グロース領域に2兆円超の投資を計画","summary":"KDDIは新たな中期経営戦略を発表し、AI基盤やグロース領域に合計2兆円を超える大規模な投資を行う方針を明らかにしました。これは、通信キャリアがAI時代のインフラ企業へと転換する流れを示しており、日本のAIインフラ、クラウド、データセンター、法人DX市場に大きな影響を与えると予測されます。開発者にとっては、AI関連のインフラやプラットフォームが強化されることで、より安定した環境での開発や、新たなAIサービス展開の機会が増えるでしょう。","source":"日経クロステック (引用元: note IT-daytrading)","url":"https://xtech.nikkei.com/atcl/nxt/column/18/00001/11749/","impact":"high","tags":["KDDI","AI投資","インフラ","DX"]},{"title":"AppleがWWDC 2026の開催を発表、AI戦略でプライバシーを重視","summary":"Appleは、6月8日から12日（日本時間6月9日から13日）に開催されるWorldwide Developers Conference（WWDC）のラインナップを発表しました。このカンファレンスでは、AIにおける進化や新しいソフトウェアとデベロッパツールに関するアップデートが紹介される予定です。特に、Appleは次期Siriの刷新においてプライバシーを差別化要因として強調しており、チャットボット型のSiriアプリでユーザーデータの保持制限など、プライバシー重視の姿勢を打ち出すと報じられています。開発者にとっては、AppleのエコシステムにおけるAI開発の方向性と、プライバシー保護の重要性が示されることになります。","source":"Apple Newsroom","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFEsJVBF33M5Sui3Hta3giTpRvg0ceETBHI50t_LCijc9zRqErCxd_IvNdkrTti-tOpYSFYVbb4O5DUW64p5SklVBG0-CTDXZ2M7sbgZWZrBXSSpfJ_EDc4xZzEh5bYEeGMJB_wKPiYdoFH3bL8DihHX__9sWHDtp1Q8hKDt0NJpDgRuLtsjVRvM8pkc_nZg_","impact":"high","tags":["Apple","WWDC","AI","プライバシー"]},{"title":"Windows DNSにCVSS 9.8の「操作不要RCE」脆弱性が発覚","summary":"Windows DNSにおいて、CVSSスコア9.8の極めて高い深刻度を持つ「操作不要リモートコード実行（RCE）」の脆弱性が発覚しました。この脆弱性は、攻撃者がユーザーの操作なしにリモートからコードを実行できる可能性があるため、広範なシステムに影響を及ぼす恐れがあります。CISA（サイバーセキュリティ・インフラセキュリティ庁）も悪用を確認しており、早期の対応が求められます。開発者やシステム管理者にとっては、速やかなパッチ適用とセキュリティ対策の見直しが不可欠となるでしょう。","source":"＠IT","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQF_e6UdTN9zqOA5O2ehvgzaOUnQ7HKHFU-SxbYBVWJvu8VV3kvfk0L4RDLU-NfBs_P8P_FgiqlxcBMyUwklM3QHlxqnBZwuHvc1xw27slue7GCzkqMSy7beHVqsVpFPT2_feLJCh_I7aT4nkBcS","impact":"high","tags":["Windows","DNS","脆弱性","セキュリティ","RCE"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
