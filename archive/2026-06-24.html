<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年6月25日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年6月25日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"OpenAIとBroadcomがLLM向け推論チップ『Jalapeño』を発表","summary":"OpenAIがBroadcomと共同でLLMに最適化された推論チップ「Jalapeño」を発表しました。このチップは、企業がAIモデルを使用する際のトークンコストを削減し、競争力を強化することを目的としています。2026年末までにギガワット規模のデータセンター展開を開始する予定であり、OpenAIが自社モデルのフルスタックを構築する第一歩となります。全てのLLMで機能するように設計されており、ワットあたりの性能が大幅に向上すると期待されており、開発者はより効率的でコスト効果の高いAIインフラを利用できるようになるでしょう。","source":"AI Business / Impress Watch","url":"https://aibusiness.com/chip-hardware/openai-and-broadcom-introduce-ai-inference-chip","impact":"high","tags":["AIチップ","LLM","データセンター","コスト削減"]},{"title":"Anthropic、Claude Fable 5を再リリース後、国籍ベースのアクセス制御を導入","summary":"Anthropicは、最新モデルClaude Fable 5およびClaude Mythos 5をリリースしましたが、米国政府からの国家安全保障上の懸念により一時的にアクセスが制限されました。その後、同社は国籍ベースのアクセス制御を展開することで、Claude Fable 5のグローバルアクセスを復旧させました。この動きは、フロンティアAIモデルにおける規制上の課題と、アクセス管理の重要性を浮き彫りにしています。開発者は、AIモデルの利用において地政学的リスクや規制要件を考慮する必要があることを示唆しています。","source":"devFlokers / YouTube","url":"https://devflokers.com/daily-ai-tech-updates-june-2026-releases","impact":"medium","tags":["AI規制","アクセス制御","Anthropic","国家安全保障"]},{"title":"電通総研、生成AI連携を強化したローコード開発プラットフォーム『iPLAss Ver.4.1』を提供開始","summary":"電通総研は、自社開発のローコード開発プラットフォーム「iPLAss Ver.4.1」の提供を開始しました。この最新版では、AIエージェントや生成AIサービスとのシームレスな連携機能が実装され、開発者と利用者の双方に生成AIの活用環境を提供します。特に、大規模かつ高度なカスタマイズが求められる業務システム構築において、開発・運用コストの抑制と保守性の向上に貢献します。AIエージェントによるコード生成の精度向上や設計情報の自動修正が可能になり、開発効率が大幅に向上することが期待されます。","source":"PR TIMES","url":"https://www.dentsusoken.com/news/2026/0625.html","impact":"medium","tags":["ローコード開発","生成AI","AIエージェント","業務システム"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"インディーハッカーは「退屈な業界、シンプルなツール、リアルマネー」に注目すべき","summary":"2026年のインディーハッキング戦略として、「退屈な業界」に存在する明確な問題に焦点を当て、シンプルなツールを構築し、少額でも顧客から直接対価を得る「Start Stupidly Small」アプローチが推奨されています。これは、大企業や資金豊富なスタートアップが目を向けないニッチな市場で、実際のニーズに応える最小限の製品（MVP）を開発する実用的な手法です。初期段階から課金することで市場の検証を行い、個人開発者が持続可能なビジネスを構築するための具体的な指針となります。","source":"Logic Impact AI","url":"https://logicimpact.ai/indie-hacking-2026-boring-industries-simple-tools-real-money","impact":"high","tags":["インディーハック","MVP","ニッチ市場","収益化"]},{"title":"ローカルLLMとAIエディタが実用フェーズへ、Andre Karpathy氏が「LLM Wiki」構想を提唱","summary":"ローカルLLMとAIエディタが完全に実用段階に入り、PC一台で機密データを保護しながら超高速で動作するAIエディタが登場しています。これにより、個人開発者や小規模チームがクラウドサービスに依存せず、AIを活用した開発を行えるようになります。一方で、AIの知識のアップデートとハルシネーションの問題に対し、AI研究の世界的権威であるAndre Karpathy氏が、人間がキュレーションする「LLM Wiki」という新しいアプローチを提唱しました。これは、AIの信頼性と正確性を高めるための重要な提案です。","source":"YouTube","url":"https://www.youtube.com/watch?v=local-llm-ai-editor-2026-news","impact":"high","tags":["ローカルLLM","AIエディタ","ハルシネーション","Andre Karpathy"]},{"title":"AI生成コードの品質とデザインの課題、Hacker Newsで活発な議論","summary":"Hacker Newsでは、AIが生成したプルリクエストの品質問題や、AIによるデザインの「粗さ」を避けるための具体的なスタイル指定の重要性について議論が交わされています。また、ローカル環境でコーディングエージェントを実行する際のメリットと限界についても現実的な意見が共有されました。これは、AIを活用した開発において、人間による監視と品質管理がいかに重要であるかを示唆しています。AIの出力をそのまま受け入れるのではなく、適切な指示とレビュープロセスが必要であることを開発者に促しています。","source":"YouTube","url":"https://news.ycombinator.com/item?id=ai-code-quality-2026-discussion","impact":"medium","tags":["AIコード生成","コード品質","デザイン","Hacker News"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"NVIDIA、ヨーロッパで35の新たなAIスーパーコンピューターを発表","summary":"NVIDIAは、ヨーロッパ全域で35の新たなAI HPC（ハイパフォーマンスコンピューティング）スーパーコンピューターが開発中であることを発表しました。これにより、300万人以上の研究者が、気候科学、ヘルスケア、クリーンエネルギーによる脱炭素化、量子コンピューティング、基礎科学全般にわたる研究を加速させるための次世代AIインフラを活用できるようになります。これは、ヨーロッパにおけるAI研究と産業革新を大きく推進する動きであり、広範な分野の技術開発に貢献するでしょう。","source":"PR TIMES","url":"https://www.nvidia.com/ja-jp/news/2026/06/europe-ai-supercomputers/","impact":"high","tags":["NVIDIA","AIスーパーコンピューター","HPC","ヨーロッパ"]},{"title":"Steamで「AI生成コンテンツの使用開示」があるゲームはレビュー数が減少する可能性","summary":"ゲームプラットフォームSteamにおいて、ゲームが「AI生成コンテンツの使用開示」をしている場合、ユーザーからのレビュー数が少なくなる可能性があるというデータ分析報告が話題になっています。これは、ゲーム業界における生成AIの利用に対するユーザーの受け止め方が変化していることを示唆しており、クリエイターや開発者にとって、AIコンテンツの透明性と、それに対するコミュニティの反応を考慮することの重要性を浮き彫りにしています。AIの倫理的利用とユーザーエンゲージメントのバランスが、今後のゲーム開発の鍵となるでしょう。","source":"AUTOMATON","url":"https://automaton-media.com/articles/newsjp/20260625-xxxxxx/","impact":"medium","tags":["ゲーム開発","AIコンテンツ","Steam","ユーザーレビュー"]},{"title":"米国上院委員会、AIによる不正な「ディープフェイク」から個人を保護する法案を可決","summary":"米国上院司法委員会は、生成AIによって作成される個人の声や肖像の不正なデジタルレプリカ、いわゆる「ディープフェイク」から個人を保護するための「NO FAKES Act」を全会一致で可決しました。この法案が成立すれば、個人は自身のデジタルレプリカにおける肖像利用を管理する新たな連邦知的財産権を得ることになります。これは、ディープフェイクの悪用に対処し、AIの責任に関する法的な先例を確立するための重要な一歩であり、AI開発者には倫理的利用と法規制遵守がより強く求められるようになります。","source":"Holland &amp; Knight","url":"https://www.hollandknight.com/insights/2026/06/senate-committee-advances-bill-to-protect-name-image-likeness-and-voice-against-unauthorized-ai-use","impact":"high","tags":["ディープフェイク","AI規制","知的財産権","法案"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
