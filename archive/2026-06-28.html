<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年6月29日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

<div class="container">

    <div class="header-row">

    </div>
    <div class="date-display">2026年6月29日</div>

  <nav class="date-nav">

</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"OpenAI、推論特化型カスタムAIチップ『Jalapeño』を発表","summary":"OpenAIはBroadcomとの共同開発により、LLM（大規模言語モデル）の推論に特化した初の独自AIアクセラレーター『Jalapeño』を発表しました。わずか9ヶ月という異例の速さで開発されたこのASICは、2026年末に初期展開、2027年から2028年前半に本格量産を目指しています。NVIDIAへの依存を減らし、推論コストを大幅に削減する可能性を秘めており、AIインフラの主導権争いが本格化していることを示唆しています。開発者にとってはAIモデルの実行コストが下がることで、より多様なアプリケーション開発が促進されるでしょう。","source":"TechCreate","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHN1kaRepKBMBoV01-yRKWrQGpZztk6BPTM3iF5AQ865N4Tupaz_2-CUhaX_iOkRbemNVzfVqfaqmR1MrSwSiLSBTeKfJmLE-S4olczdJl5JBTfU0tck9qJmrIFik_rxFa9HJZ24nbPsBL_YIBPCFTp7iXe-WlCyg==","impact":"high","tags":["AIチップ","推論","OpenAI","半導体"]},{"title":"Microsoft、AIエージェントが自律的に業務を遂行する『Copilot Cowork』を一般提供開始","summary":"Microsoftは、AIの活用が「使う」から「働かせる」時代へと移行していると発表し、Microsoft 365 Copilotを中心にAIエージェントが複数の業務を自律的に実行する機能を強化しています。特に『Copilot Cowork』は、複数のツールを横断して長時間タスクを最後まで実行し、下書きではなく「完成した成果物」を返すエージェント機能として注目されています。Word、Excel、Outlook、Teamsを横断して処理が可能で、企業におけるAI活用の深化を促進します。開発者はAIを組み込んだより複雑な自動化ソリューションを構築する機会が増えるでしょう。","source":"note","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGYvODQfq62ZPQdcTF92SQE2iJrUltdt75qLby1ZJ33G8cbmZ7gFeiX2yPJHl4adIV02r1vnXiHCNaNCFVBEslTPOOh1gjSGyeJ73-kh7b8rAh-KMbsy-IKUOoL3LoyhxLF9HfonvZ_p0k=","impact":"high","tags":["AIエージェント","Microsoft Copilot","業務自動化","LLM活用"]},{"title":"AWS Summit Japan 2026、生成AIによる開発・生産DXが柱に","summary":"アマゾン・ウェブ・サービス（AWS）が主催する国内最大級のクラウドイベント「AWSサミットジャパン2026」が6月25日に開幕し、生成AIを軸とした業務変革が最大のテーマとなりました。自動車メーカーや部品メーカーがクラウドやAIを活用した開発・生産改革の取り組みを紹介し、車載ソフトウェア開発基盤、生成AIによる業務支援、デジタルツインを活用した設備管理などのソリューションが展示されました。AIが実証実験段階から本番導入へと移行していることが伺え、開発者にとってはAIを活用したDXソリューションの需要が高まることを意味します。","source":"日本自動車会議所","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEJz4rsUH_xGLD6XL1NxOmBStMbo3H1OXR0OWuidrFe4NsSBbMoA4894UiXbySE1xqY_I0UOfucJDHQ3gpXu6Enm0c-bOwozvNMbxRxZkgQ7RK3BGlBpFmItnY4dQFwziJwiPJyCPcV","impact":"medium","tags":["AWS","生成AI","DX","クラウド"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"2026年版インディーハッカー成功戦略：AIとコミュニティが鍵","summary":"2026年のインディーハッカーの成功には、単なる技術力だけでなく、AIの活用とコミュニティの力が不可欠であるという戦略が提示されています。AIアシスタントを活用した市場ニーズの深掘り、ノーコード・ローコード開発による高速なプロダクトリリース、そしてユーザーを開発プロセスに巻き込む「コミュニティドリブン開発」が成功への鍵とされています。これにより、アイデアの発掘から収益化まで一貫したアプローチが提供され、個人開発者はより効率的にプロダクトを市場に投入し、成長させることが期待されます。","source":"note","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQH0dTQaWhDVpQcI5Li43Q-DiCX6i7Ck1onN02P6BTzm1dyS-_6KA-TwTJEegqetLAWUfkdWmr73WQXRgGgK1IL1nbsgmMajuu3nusExaSEjQGKMlT3pbVniayieYwBM1My8dVVd","impact":"high","tags":["インディーハッカー","AI活用","コミュニティドリブン","ノーコード"]},{"title":"海外インディーハッカーの間で『Micro-SaaS』の極小起業トレンドが熱狂","summary":"海外のX（旧Twitter）やIndie Hackersコミュニティでは、数日から1週間程度で極小のWebプロダクト（Micro-SaaS）を開発し、年商数千万円を目指すトレンドが加速しています。この戦略は、AIをレバレッジし、ニッチな市場に焦点を当て、戦略的な流通（販売）を行うことで、迅速な収益化を目指すものです。顧客の具体的な不満を解決する「小さな仕掛け」を素早く作り、フィードバックを元に改善していくアプローチが重視されています。個人開発者にとって低リスクで起業する新たな道を示しています。","source":"note","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFsWNFjyK4QL7SizW6ZQAl5VHf0f7NC2KFesJ93mTeSZLuWtA8Ca6b8YGUSSmLt_1l506yORyipPzuN9FHYxZpQkOnp5paOnFj4dYDeKmtOCcXMR0Wt17zz4pTZqvjvlgESAcB","impact":"high","tags":["Micro-SaaS","インディーハッカー","AIレバレッジ","ニッチ市場"]},{"title":"SaaS個人開発者が語る「売る」ための泥臭い戦略：ローンチ後の「沈黙」を破る方法","summary":"あるSaaS個人開発者が、プロダクトローンチ後に直面した顧客獲得の困難と、そこから抜け出すための地道な戦略を共有しています。MVP完成からローンチ後、「純粋な沈黙」が続いたものの、有料広告（Reddit広告、Google広告）の試行錯誤とSEO（検索エンジン最適化）への注力により、費用対効果の高いクリック率と受動的なインバウンドリードを獲得できるようになったと述べています。開発だけでなく、販売と流通の重要性を強調しており、多くの個人開発者にとって、プロダクトを成功させるためにはマーケティング戦略が不可欠であるという実践的な教訓となります。","source":"note","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGoScXdhoEEn7uKlgLagjwVXKn5fA4rHWSXcjuicXy-3EEgPAy5G_-y-n8NJcGLW9UZW48k0eyr2-oQ8GFLVkm7PQmJfX1MCTKXRNVcObWxpo-zU9mMTJuE33oO9PFtpvjM_HoH6dI=","impact":"medium","tags":["SaaS","個人開発","マーケティング","顧客獲得"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"AI市場、半導体だけで2030年に150兆円規模へ拡大 – 中心は学習から推論へ","summary":"AI産業の成長を支える最重要テーマであるAI半導体市場が、2030年には150兆円規模にまで拡大する見通しが示されました。特に注目すべきは、市場の中心がこれまでの学習用GPUから、実運用を支える推論半導体へと構造変化している点です。これは、GPU、HBM、ASIC、AIアクセラレーター、エッジAI半導体の需要拡大に繋がり、AIモデル企業だけでなく、半導体製造、メモリ、後工程、冷却、電源、データセンターなど、幅広い分野に投資テーマが波及すると予測されています。開発者にとっては、推論効率の高いAIモデルやエッジデバイス向けAIソリューションの需要が高まることを示唆しています。","source":"note","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGjv7q-PltMS23ox2D9LP28W38dJJxJmw4-A_O2zVGBJUSbxDMTNPW3R_vZCMeUbYR_2eOmnh5Rp4yYvGjfWPmiQn2KwAcBNsjD_eo1tJldOqKD4RISC-AkPFFMY5Vb_kMynnNsjzGh7Uo=","impact":"high","tags":["AI半導体","市場予測","推論","GPU"]},{"title":"AIに不可欠なデータセンター、電力・冷却制約から宇宙空間への活路も浮上","summary":"AIの拡大に伴い、データセンターの電力、冷却、土地、通信網の問題が急増しています。これまでの地上インフラの制約を超える選択肢として、「宇宙データセンター」構想が浮上し、SpaceXのような宇宙企業が関与することで、AI、衛星通信、宇宙インフラ、電力技術が一体化する可能性が指摘されています。2026年上半期のトレンドワードでも「データセンター」が上位にランクインしており、AIの普及が電力インフラにまで影響を与えていることが企業の発信からも窺えます。これは、未来のインフラ開発に新たな視点をもたらし、関連技術の開発者にとって大きな機会となるでしょう。","source":"note","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGjv7q-PltMS23ox2D9LP28W38dJJxJmw4-A_O2zVGBJUSbxDMTNPW3R_vZCMeUbYR_2eOmnh5Rp4yYvGjfWPmiQn2KwAcBNsjD_eo1tJldOqKD4RISC-AkPFFMY5Vb_kMynnNsjzGh7Uo=","impact":"high","tags":["データセンター","宇宙インフラ","電力問題","AI普及"]},{"title":"『ITトレンド上半期ランキング2026』発表：AIの実装、法改正、人材経営が企業のIT導入を牽引","summary":"IT製品の比較・資料請求サイト「ITトレンド」が発表した「ITトレンド上半期ランキング2026」によると、2026年上半期に企業のIT導入を動かした主なキーワードは「AIの実装」「法改正」「人材経営」でした。特にAIエージェント、AI契約書レビューサービス、議事録作成ツールなどが急伸しており、AIが「使ってみる」ステージから「不可欠な業務基盤」へと進化していることが示されています。また、携帯電話不正利用防止法改正や中小受託取引適正化法（取適法）施行などの法改正が、IT導入の直接的なトリガーとなっています。開発者にとってはこれらのニーズに対応するソリューション開発が重要となるでしょう。","source":"PR TIMES","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGs1cgLtnWoHiTeo3cgmh7VQrbf-iC2AHo8GPNPMu8ftXm9zEmPxtDegg8eCD8wbCOLwPge-884o5zN13AMIrdAaANhEwNNIvCfTygtOYRrzHOWA1UC1dIzRCtzYF4-tG5P8J-JiBPuL99eQk9JQqnD_0xDM0=","impact":"medium","tags":["ITトレンド","AI実装","法改正","業務効率化"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
