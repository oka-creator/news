<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年7月14日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年7月14日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Umee Technologies、商談データをAI活用可能な構造化データに変換する「Front Agent log」を発表","summary":"Umee Technologiesは、2026年7月23日開催の「TECH BEAT Shizuoka 2026」で、AIが活用しやすい構造化された顧客データ基盤「Front Agent log」を展示します。このソリューションは、対面・Web会議・電話などあらゆるチャネルの商談録音データを自動で顧客情報と紐づけ、CRMに蓄積します。MCPを通じて生成AIとシームレスに連携し、AI議事録ツールなどで課題となっていたデータの構造化不足によるAI回答の偏りを解消します。これにより、業務効率が飛躍的に高まり、開発者にとっては新たなAI連携ソリューションの可能性が広がります。","source":"Umee Technologies","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQG8gXfszaMwlEEbGyvk-we7jz1udp8oXsGqrYn1Bt-YAqoT6fQQkS9SB0Rcyleh2_-znma1o64QnkSlADZxtu8A5vHaSyHj09w1zmvdZZgkCSeyU-DJxBbBtstuCU6tJMBiYxaUfH3J6mVU1MwSIIFhhoAHTjQ=","impact":"high","tags":["生成AI","CRM連携","業務効率化"]},{"title":"自治体AI zevo、OpenAIの最新モデル「GPT-5.6」の提供を開始","summary":"シフトプラス株式会社は、自治体向けAIサービス「自治体AI zevo」において、OpenAIの最新チャット最適化モデル「GPT-5.6」の3モデル（sol/terra/luna）を2026年7月13日より提供開始しました。これにより、自治体職員は行政手続きの案内、市民からの問い合わせ対応、文書の要約など、日々の業務を効率化できます。「sol」は高い推論力で複雑な条例解釈に対応し、「terra」はバランスの取れた性能で幅広い業務をカバー、「luna」はコストを抑えつつ大量処理に適しています。この導入は、自治体におけるAI活用の深化を促し、開発者には新たな行政向けAIソリューションの需要を示唆します。","source":"シフトプラス株式会社","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHZSWnk8q9EgQSRnOIZjlvieu3y_aNIsCikeV4VgPL-AlqNh65dN1DjDwdAHuyLFX-OMWIeMDwzT8CRXy5BgXj2f3PPxSF4w6LDLRgqi4dzbtGJ7WJewSgXQ8x7ERzZKm5w_DCZ0CwM_XdRkNQsz_Mpk5wrH8g=","impact":"high","tags":["GPT-5.6","自治体AI","業務効率化"]},{"title":"OpenAI、リアルタイム音声モデル「GPT-Live」を公開","summary":"OpenAIは、リアルタイムでの音声対話が可能な新モデル「GPT-Live」を発表しました。このモデルは、相づちや割り込みといった人間らしい会話のニュアンスをより自然に再現できる点が特徴です。ユーザーはまるで人間と話しているかのような体験を得られるため、カスタマーサポート、教育、エンターテイメントなど、幅広い分野での音声AIアプリケーションの可能性が拡大すると期待されています。開発者にとっては、より自然な音声UIを持つアプリケーション構築の機会が生まれるでしょう。","source":"OpenAI","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFakcDqe3RjL9ltrNBdqWSIDbt1ONQZWSQLdPvjwNdScKmqBfR-EFf5Osr0SkIE-W-pN-stdau9Q0aTTqil9sB2Tg9hA3fiH5S7634xZxcIccP8Jpw-6QxU8p6_jUB1AbCGHddCCjC1CQ==","impact":"high","tags":["OpenAI","音声AI","GPT-Live"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"人気インディーゲーム「めっちゃカメレオン」開発者が非公式グッズ販売に注意喚起","summary":"PC（Steam）向けインディーゲーム「めっちゃカメレオン」の開発者の一人であるLEMORION氏が、2026年7月12日に自身のXアカウントで、現在オンラインで販売されている関連グッズは全て非公式品であると注意喚起しました。同ゲームは、かくれんぼを題材にペイントツールで体を周囲の景色と同化させるユニークなゲーム性が話題を呼び、発売から1ヶ月足らずで1500万本という異例の販売数を突破しています。この注意喚起は、インディーゲームの成功に伴う知的財産権保護の重要性を示しており、開発者にはブランド管理の必要性を再認識させるものです。","source":"LEMORION氏 (Xアカウント)","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEIXwSp-HBgPWO2Q_FIzSdc1ta2DGRMl3jGyfdK9oofqEAewcTHdhJ0m0srtVc124ggVzCuVSm9jVsjGVMiIt6J3FwUVW_oiWJ4AcMjKDvkVMRftpAedVFHi1JWyQ5c_BFI0rYlqttPT5nAWqjcOhyl95jMKq90nA==","impact":"medium","tags":["インディーゲーム","知的財産","ゲーム開発"]},{"title":"個人開発者が2000円以下でAI問い合わせボットをWebサイトに実装","summary":"ある個人開発者が、Google AI Studioを活用し、わずか2000円以下の予算で自身のWebサイトにAI問い合わせボット機能を実装した事例が紹介されました。この事例は、低コストで実践的なAIツールを個人レベルでも導入できる可能性を示しています。個人開発者や中小企業が顧客対応の効率化を図る上で参考になる具体的な情報を提供しており、開発者にとっては手軽なAI導入のヒントとなるでしょう。","source":"Google AI Studio活用事例","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFGwyJC6XMqMAQq2KXJTQZQMr1YJ6_5LZW3eSxbEedf2w8uxwmaAIkALWK-8btcGxyp5Cr3Yp_Ndl7GEz-sg82dNlqLlWX1_vAidjcLHBdsO5bZF0xhk99inTm8zTN4BWn9JwNvhH1g75C4LWLjvRNWCO89PlDmR0g=","impact":"medium","tags":["AIボット","個人開発","低コストAI"]},{"title":"SaaSで月商4万ドルから7.2万ドルへ成長したインディーハッカーの6つの習慣","summary":"一人のインディーハッカーが、自身のSaaS事業で月商4万ドルから7.2万ドルへと成長を遂げた経験と、その「停滞」を突破するために実践した6つの習慣を共有しました。この事例は、個人でプロダクトを開発・運営する上で直面する課題を乗り越え、ビジネスをスケールさせるための具体的な戦略やマインドセットについて、実用的なヒントを提供しています。開発者にとっては、事業成長のための具体的な行動指針やモチベーションとなる情報です。","source":"インディーハッカーの事例共有","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFGwyJC6XMqMAQq2KXJTQZQMr1YJ6_5LZW3eSxbEedf2w8uxwmaAIkALWK-8btcGxyp5Cr3Yp_Ndl7GEz-sg82dNlqLlWX1_vAidjcLHBdsO5bZF0xhk99inTm8zTN4BWn9JwNvhH1g75C4LWLjvRNWCO89PlDmR0g=","impact":"high","tags":["SaaS","インディーハッカー","事業成長"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"TSMC、成熟製造プロセスの値上げを顧客に通知","summary":"ファウンドリー最大手の台湾積体電路製造（TSMC）が、来年1月から成熟製造プロセスを値上げすると顧客に通知した模様です。値上げ幅は製品や顧客によって異なりますが、10%未満と見込まれています。これは、今年6月に発表された7ナノメートル以降の先進製造プロセスの値上げに続くもので、成熟プロセスとしては新型コロナウイルス流行後、約3年ぶりの値上げとなります。この値上げは、半導体業界全体のコスト構造に影響を与え、最終製品の価格にも波及する可能性があり、開発者にとっては部品調達コストの上昇を考慮する必要が出てくるでしょう。","source":"YS Consulting","url":"http://www.ys-consulting.com.tw/news/129563.html","impact":"high","tags":["TSMC","半導体","サプライチェーン"]},{"title":"改正個人情報保護法が成立、AI開発なら「本人同意なし」でデータ提供が可能に","summary":"2026年7月10日、個人情報保護法の一部を改正する法律が成立しました。これにより、AI（人工知能）の開発や統計の作成を目的とする場合に限り、本人の同意を得ずに個人データ（病歴や犯罪歴、人種、信条といった要配慮個人情報を含む）を取得・第三者提供できる特例が新設されます。データ活用を後押しする規制緩和と同時に、課徴金という新たな制裁による事後規制の強化も盛り込まれています。この改正は、AI開発におけるデータ利用の障壁を下げ、開発者にとってはより多様なデータを用いたAIモデルの構築が可能になる一方で、セキュリティ実務の見直しが必須となります。","source":"情報ソース不明","url":"https://www.google.com/search?q=%E6%94%B9%E6%AD%A3%E5%80%8B%E4%BA%BA%E6%83%85%E5%A0%B1%E4%BF%9D%E8%AD%B7%E6%B3%95+AI%E9%96%8B%E7%99%BA+%E6%9C%AC%E4%BA%BA%E5%90%8C%E6%84%8F%E3%81%AA%E3%81%97","impact":"high","tags":["個人情報保護法","AI開発","データ活用"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
