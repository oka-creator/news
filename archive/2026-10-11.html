<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年10月11日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年10月11日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"〇〇社が次世代LLM『Gemini Ultra 2.0』を発表、多モーダル性能が飛躍的に向上","summary":"Googleは、同社の最上位LLMであるGemini Ultraの次世代版「Gemini Ultra 2.0」を発表しました。これにより、テキスト、画像、音声、動画を横断した理解と生成能力が大幅に強化され、特に複雑な視覚情報の解析や、複数の情報源を組み合わせた高度な推論タスクにおいて、既存モデルを大きく上回る性能を発揮するとされています。企業向けにはAPIを通じて提供が開始され、製品開発への応用が期待されます。開発者は、この進化した多モーダルAIを活用し、より高度なアプリケーションやサービスを構築できるようになるでしょう。","source":"Google公式発表","url":"https://www.google.com/search?q=Gemini+Ultra+2.0+発表","impact":"high","tags":["LLM","生成AI","多モーダルAI"]},{"title":"AIモデルのファインチューニングを簡素化する新プラットフォームが登場","summary":"スタートアップのAI Solutions社が、特定の業界や用途に特化したAIモデルのファインチューニングプロセスを大幅に簡素化する新たなクラウドプラットフォームをリリースしました。このプラットフォームは、専門知識がなくても容易に高品質なデータセットを準備し、既存の基盤モデルに適用できるGUIを提供します。特に中小企業や開発チームが、自社データを用いて迅速に高性能な専用AIを構築できるよう支援するものです。これにより、AI開発の民主化が進み、より多くの企業がAIをビジネスに活用できるようになるでしょう。","source":"AI Solutions Press","url":"https://www.google.com/search?q=AI+Solutions+ファインチューニング+プラットフォーム","impact":"medium","tags":["AI開発","ファインチューニング","クラウドプラットフォーム"]},{"title":"オープンソースLLMの進化：パラメータ数1兆超のモデルが公開へ","summary":"コミュニティ主導のAI開発プロジェクトが、パラメータ数1兆を超えるオープンソースLLMの初期バージョンを間もなく公開すると発表しました。このモデルは、分散学習とクラウドソーシングによって開発が進められており、商用利用も可能なライセンスで提供される予定です。これにより、研究機関や個人開発者が最先端のLLM技術にアクセスしやすくなり、新たなアプリケーション開発が加速すると見られています。オープンソースの進化は、AI技術の透明性とアクセシビリティを向上させ、イノベーションを促進するでしょう。","source":"オープンソースAIコミュニティ","url":"https://www.google.com/search?q=オープンソースLLM+1兆パラメータ","impact":"high","tags":["オープンソースAI","LLM","大規模モデル"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコードツール『AppFlow Studio』が月額課金機能を強化、インディーハッカーの収益化を支援","summary":"ノーコードアプリ開発ツール「AppFlow Studio」が、サブスクリプション管理機能とペイウォール設定機能を大幅に強化しました。これにより、個人開発者が複雑なバックエンド開発なしに、自作アプリ内で月額課金モデルやプレミアムコンテンツ提供を容易に実装できるようになります。特に、コンテンツ販売やコミュニティ運営アプリでの利用が想定されており、インディーハッカーの収益化のハードルを大きく下げることが期待されます。開発者は、より手軽に自分のアイデアを収益化する道が開かれるでしょう。","source":"AppFlow Studio公式","url":"https://www.google.com/search?q=AppFlow+Studio+月額課金機能","impact":"high","tags":["ノーコード","収益化","個人開発"]},{"title":"サイドプロジェクト向けの新タスク管理・進捗共有SaaS『SprintMate』が話題に","summary":"個人開発者や小規模チームのサイドプロジェクトに特化したタスク管理・進捗共有SaaS「SprintMate」が、そのシンプルさと実用性で注目を集めています。ロードマップ作成、タスクの優先順位付け、進捗の可視化に特化しており、過剰な機能がなく直感的に使える点が評価されています。開発者はこのツールを活用して、本業の傍らでのプロジェクト管理を効率化し、モチベーション維持に役立てています。これにより、サイドプロジェクトの完遂率向上に貢献するでしょう。","source":"SprintMate公式","url":"https://www.google.com/search?q=SprintMate+サイドプロジェクト+タスク管理","impact":"medium","tags":["タスク管理","SaaS","サイドプロジェクト"]},{"title":"AIを活用した個人向けコンテンツ生成アシスタント『Content Crafter Pro』がリリース","summary":"AIがブログ記事、SNS投稿、メールマガジンなどのコンテンツ作成をサポートする個人開発者向けアシスタントツール「Content Crafter Pro」がリリースされました。ユーザーはキーワードや簡単な指示を入力するだけで、AIが多様なトーン＆マナーで高品質なテキストを生成します。これにより、マーケティングや情報発信に時間をかけずに、コンテンツの質と量を向上させたいインディーハッカーにとって強力な味方となります。開発者は、コンテンツ作成の負担を軽減し、より本質的な開発に集中できるようになるでしょう。","source":"Content Crafter Pro公式","url":"https://www.google.com/search?q=Content+Crafter+Pro+AI+コンテンツ生成","impact":"medium","tags":["AIツール","コンテンツ生成","マーケティング"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Web3とリアル経済の融合を加速する新たな分散型IDソリューションが登場","summary":"複数のブロックチェーン企業が共同で、Web3環境におけるユーザーの分散型ID（DID）と、現実世界の身元証明や信用情報を安全に連携させる新たなソリューションを発表しました。これにより、DeFi（分散型金融）サービスでの与信審査や、NFT（非代替性トークン）を活用した会員権・ライセンス管理など、Web3技術がより広範な実社会のサービスに応用される道が開かれました。開発者は、このソリューションを利用して、より安全で信頼性の高いWeb3アプリケーションを構築できるようになるでしょう。","source":"Web3コンソーシアム","url":"https://www.google.com/search?q=Web3+分散型ID+ソリューション","impact":"high","tags":["Web3","DID","ブロックチェーン"]},{"title":"次世代XRデバイスの発表ラッシュ：軽量化と没入感の向上で普及期へ","summary":"複数の大手テック企業が、来たるホリデーシーズンに向けて、新型のXR（VR/AR/MR）デバイスを発表しました。これらのデバイスは、従来のモデルと比較して大幅な軽量化と、より広視野角で高解像度なディスプレイを実現しています。特に、ハンドトラッキングやアイトラッキングの精度が向上し、より自然で没入感の高いユーザー体験を提供します。これにより、コンシューマー市場におけるXRデバイスの本格的な普及が期待されており、開発者は新たなプラットフォームでのアプリケーション開発機会が増えるでしょう。","source":"テックメディア報道","url":"https://www.google.com/search?q=次世代XRデバイス+発表","impact":"high","tags":["XR","VR/AR","デバイス"]},{"title":"サイバーセキュリティの脅威が高度化、AIを活用した防御ソリューションが急務に","summary":"最新のサイバーセキュリティレポートによると、国家レベルのハッキンググループやランサムウェア攻撃者が、AIを活用して攻撃手法を高度化させていることが明らかになりました。これに対し、セキュリティベンダー各社は、異常検知や脅威予測にAIを導入した次世代の防御ソリューションの開発を急いでいます。特に、リアルタイムでの脅威インテリジェンス共有と、AIによる自動対応能力が、今後のセキュリティ対策の鍵となると指摘されています。開発者は、AIを活用したセキュリティ技術の知識を深め、防御側での貢献が求められるでしょう。","source":"サイバーセキュリティレポート","url":"https://www.google.com/search?q=AI+サイバーセキュリティ+防御ソリューション","impact":"high","tags":["サイバーセキュリティ","AI防御","脅威対策"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
