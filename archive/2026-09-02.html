<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年9月3日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年9月3日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"〇〇社、次世代LLM「GigaBrain X」を発表 - マルチモーダル性能が飛躍的に向上","summary":"大手テック企業〇〇社が、新たな大規模言語モデル『GigaBrain X』を発表しました。このモデルは、テキストだけでなく画像や音声の理解・生成能力が大幅に向上しており、特に複雑な指示に対する応答精度が注目されています。これにより、デザインアシスタントや動画コンテンツ生成など、クリエイティブ分野での応用が期待されます。開発者にとっては、より高度なマルチモーダルAIアプリケーションの構築が可能になり、新たなサービス創出の機会が広がるでしょう。","source":"〇〇社公式発表","url":"https://example.com/gigabrain-x-announcement","impact":"high","tags":["LLM","マルチモーダルAI","生成AI"]},{"title":"中小企業向けに特化したAIアシスタントサービス「BizAI」がローンチ - 業務効率化を支援","summary":"新興AIスタートアップの△△社が、中小企業向けのAIアシスタントサービス『BizAI』の提供を開始しました。このサービスは、議事録作成、メールの自動返信、データ分析レポートの生成など、中小企業が日常的に直面する業務の効率化に特化しています。月額定額制で利用でき、導入のハードルの低さから注目を集めています。これにより、中小企業は限られたリソースで業務効率を大幅に改善でき、開発者は特定のビジネス課題に特化したAIソリューションの市場拡大を期待できます。","source":"△△社プレスリリース","url":"https://example.com/bizai-launch","impact":"medium","tags":["AIアシスタント","SaaS","業務効率化"]},{"title":"オープンソースLLM「AlphaLM 7B」が公開 - 個人開発者によるカスタマイズが加速","summary":"オープンソースコミュニティから、新たな軽量大規模言語モデル『AlphaLM 7B』が公開されました。このモデルは、比較的小規模なデータセットでのファインチューニングでも高い性能を発揮するため、個人開発者や研究者が特定の用途に特化したAIモデルを構築しやすくなります。すでに多くの派生プロジェクトがGitHubで立ち上がっており、今後の発展が期待されます。これにより、開発者は既存の強力な基盤モデルをベースに、独自のAIソリューションを迅速に開発できるようになり、AIエコシステムの多様性が促進されるでしょう。","source":"GitHubコミュニティ","url":"https://github.com/alphalm-7b","impact":"high","tags":["オープンソース","LLM","ファインチューニング"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコードプラットフォーム「BuildFlow」が新機能追加 - AI連携で開発効率がさらに向上","summary":"個人開発者や小規模チームに人気のノーコード・ローコード開発プラットフォーム『BuildFlow』が、AI連携機能を大幅に強化しました。これにより、自然言語での指示によるUI生成や、既存のデータモデルに基づいた自動API生成が可能となり、プログラミング知識がなくてもより高度なアプリケーションを迅速に開発できるようになります。開発者にとっては、アイデアを素早く形にできる強力なツールとなり、開発の敷居がさらに下がることで、より多くのイノベーションが生まれることが期待されます。","source":"BuildFlow公式ブログ","url":"https://example.com/buildflow-ai-features","impact":"medium","tags":["ノーコード","ローコード","AI連携"]},{"title":"サブスクリプション管理アプリ「ChargeTrack」が月間収益100万円を突破 - ニッチな課題解決で成功","summary":"個人開発者によって開発されたサブスクリプション管理アプリ『ChargeTrack』が、月間収益100万円を突破したと発表しました。複数のサブスクリプションサービスを契約しているユーザーの「何にいくら払っているか分からない」という課題をシンプルに解決する機能が支持され、特に若年層のユーザーから高い評価を得ています。この成功は、ニッチな課題に焦点を当て、ユーザーのペインポイントを的確に解決することの重要性を示しており、他の個人開発者にとって大きなインスピレーションとなるでしょう。","source":"ChargeTrack開発者ブログ","url":"https://example.com/chargetrack-milestone","impact":"medium","tags":["個人開発","アプリ開発","成功事例"]},{"title":"「IndieDev Summit 2026」が開催決定 - 最新ツールと成功事例が共有される場に","summary":"毎年恒例の個人開発者向けイベント『IndieDev Summit 2026』の開催が発表されました。今年はオンラインとオフラインのハイブリッド形式で開催され、最新の開発ツールや技術トレンド、そして実際に成功を収めたインディーハッカーによるケーススタディが多数発表される予定です。このサミットは、個人開発者が新たなアイデアやビジネスチャンスを見つけ、スキルを向上させる絶好の機会を提供します。開発者コミュニティの活性化と知識共有の促進に大きく貢献するでしょう。","source":"IndieDev Summit運営委員会","url":"https://example.com/indiedev-summit-2026","impact":"low","tags":["イベント","個人開発","コミュニティ"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"次世代バッテリー技術「ソリッドステートバッテリー」の商用化が加速 - EV市場に大きな影響か","summary":"電気自動車（EV）の航続距離と充電時間に革命をもたらすと期待されている次世代バッテリー技術『ソリッドステートバッテリー』の商用化に向けた動きが加速しています。複数の自動車メーカーとバッテリーメーカーが共同で量産体制の構築を発表しており、数年内の本格的な市場投入が見込まれています。これにより、EVの普及がさらに加速する可能性があります。開発者にとっては、EV関連のソフトウェアやインフラ開発において、新たな性能基準に対応する必要が生じるでしょう。","source":"自動車業界ニュース","url":"https://example.com/solid-state-battery-commercialization","impact":"high","tags":["EV","バッテリー技術","ソリッドステート"]},{"title":"サイバーセキュリティ企業が共同でAIを活用した脅威検知システムを構築 - 巧妙化する攻撃に対抗","summary":"世界的なサイバー攻撃の巧妙化に対抗するため、複数の主要サイバーセキュリティ企業が共同で、AIを活用した新たな脅威検知システムの構築を発表しました。このシステムは、膨大なデータをリアルタイムで分析し、未知のマルウェアやゼロデイ攻撃の兆候を早期に発見することを目的としています。国際的な連携により、より強固なセキュリティ体制が期待されます。開発者にとっては、AIを活用したセキュリティソリューションの需要が高まり、新たなセキュリティ技術への理解と応用が求められるでしょう。","source":"セキュリティ業界団体","url":"https://example.com/ai-cybersecurity-alliance","impact":"high","tags":["サイバーセキュリティ","AI","脅威検知"]},{"title":"メタバースプラットフォームがビジネス用途での活用を強化 - リモートワークやコラボレーションの新たな形","summary":"大手メタバースプラットフォームが、個人向けエンターテインメントだけでなく、ビジネス用途での活用を本格的に強化すると発表しました。バーチャルオフィス機能の拡充や、3D空間での共同作業ツールの導入により、リモートワーク環境におけるチームコラボレーションや、グローバルなイベント開催の新たな選択肢として注目されています。開発者にとっては、メタバース上でのビジネスアプリケーションやツールの開発機会が増え、3DインタラクションやVR/AR技術への知見がより重要になるでしょう。","source":"メタバースプラットフォーム公式","url":"https://example.com/metaverse-for-business","impact":"medium","tags":["メタバース","リモートワーク","VR/AR"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
