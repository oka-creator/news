<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年4月2日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

零 ～Angel Zero～』のSteamストアページを公開","summary":"個人開発者のFcsVorfeed氏が、PC向けのアクションADVゲーム『残酷天使 | 零 ～Angel Zero～』のSteamストアページを公開しました。本作は「ジョン・ウィック」や『The Last of Us』などに影響を受けた泥臭いアクションが特徴で、美少女天使を操作してターゲットを襲撃する内容です。インディーゲーム開発者にとって、Steamでのストアページ公開は作品の認知度を高める重要な一歩であり、今後の開発やマーケティング戦略の参考となる事例と言えるでしょう。","source":"ニュース記事","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQF5kAG2nGQnTXp47Om96jafwbP3Daj_9ZikiypDjI3BT6ITMTVAzP96GXg2AlbVKzuUc5GFLESewkmx-EbONAwT9ETsfWo12Xh1MGQv5DwWKFi5S7O7kWDenoT3MZcR9J7pHcsKXg6eRZJ9Nm9b3aj3Mik=","impact":"low","tags":["インディーゲーム","Steam","アクションADV"]},{"title":"おまど氏、ChatGPTと遊ぶ高難度ローグライト『PASSIS』をブラウザで無料公開","summary":"個人ゲーム開発者のおまど氏が、数字4桁を入力するだけで進行する高難度ローグライトゲーム『PASSIS』をブラウザ上で無料公開し、注目を集めています。同氏は「ChatGPTなどのAIと一緒に遊ぶのがオススメ」とコメントしており、その複雑なゲームシステムからプレイヤーはAIツールを駆使して攻略に挑むという、現代的な遊び方を提案しています。この事例は、AIをゲームの攻略ツールとして活用するという新しいゲーム体験を提供しており、個人開発者がAIとユーザーのインタラクションをどのように設計できるかについて示唆を与えます。","source":"ニュース記事","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGvjrlftiC4-_-sT1n0tekLZSnqfPuXodJcItIE7TTMOEm-kLyU_FD7BBT-9Hhz6hbuz-8B_AhECmYQc5p6nOIHqV5y3eh-Aav7HoD6CpYNyPSKPuFGouNopoSpWpRDLftWF_V2t0sS5WpUtNF7m4IvVvQMvJZynQ==","impact":"low","tags":["インディーゲーム","ChatGPT","ローグライト","ブラウザゲーム"]},{"title":"AIコーディングツール活用で月収1億円超えのニッチアプリ開発事例が続々","summary":"2026年現在、AIコーディングツールの進化により、プログラミング経験がなくても個人開発者（インディーハッカー）が月収数百万円から1億円を超えるニッチアプリを生み出す事例が増加しています。「Formula Bot」や「Wave AI」といったアプリがその代表例で、AIツールがコードの大部分を生成することで、開発期間の短縮と収益化を両立させています。このトレンドは、個人開発者が技術的な障壁を乗り越え、アイデアを迅速に形にして市場投入できる可能性を大きく広げており、開発者にとってAIツールの習得が新たな収益源に直結することを示しています。","source":"ニュース記事","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGaPe-J6d2S86IXfX-luReSY53iWddorIpToWjCQsJw5_6N17uRj8_1upP_rlGLe5CY1wnPz8cdlG3ooE_IDWXVLylcp4B2d6LAXYsRYgftc_rmyr9JVxnhgmK0-gfZRkfJxRs_Vfi0biPvlbc=","impact":"high","tags":["AIコーディング","個人開発","ニッチアプリ","収益化"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Appleが創業50周年、「Think Different」の精神を再確認","summary":"Appleは2026年4月1日に創業50周年を迎え、CEOティム・クック氏による「50 Years of Thinking Different」というメッセージを公開しました。1976年の創業以来、既存の規範に疑問を抱き、業界全体を変革する製品やサービスを生み出してきた同社の「Think Different」の精神が、改めて強調されています。この節目は、Appleが今後も革新的な技術とデザインで業界をリードし続けることを示唆しており、開発者にとっては、Appleのエコシステムが引き続き重要なプラットフォームであり続けることを再認識させるものです。","source":"Apple","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQE1QMd48D3sskWw6b2jsMcj047weP_Q4-CzftobgxVmfF7SRoMYLfu-1MW7F6Uss6w1Y0jXmPHA1sqjXGJPpLNYXTmtZRJWiqcmgqlkY4mzcCEYD0raRCpmNQ==","impact":"low","tags":["Apple","創業記念","Think Different"]},{"title":"「第5回 アスリートパフォーマンス EXPO」が4月15日から開催、スポーツテックの最前線が集結","summary":"2026年4月15日から17日まで東京ビッグサイトで「第5回 アスリートパフォーマンス EXPO」が開催されます。世界的なスポーツイベントが続く「スポーツイヤー」である2026年において、スポーツ界は経験と勘からデータと科学に基づく戦略へと進化しており、本EXPOでは選手のパフォーマンスを最大化させる最新スポーツテックや高度な撮影技術などが展示されます。このイベントは、スポーツとテクノロジーの融合が加速している現状を示しており、開発者にとっては、スポーツ分野における新たな技術開発やビジネスチャンスを探る良い機会となるでしょう。","source":"ニュース記事","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQER2G2vUD83Tbus8ytkpxfOov49WWRl0I7WzEcER7mKwrjul6Z0lnKzcBAa31nKOCNpgJ9vWInZ5Xv1UPhVP-qeBDhdsINocBcywbOGlxkFwx8LhR4tw4l0VLX8ox-RJnWCaxB0DQh7_QqkFGfrdbQfmzr7yEo=","impact":"medium","tags":["スポーツテック","EXPO","データ活用"]},{"title":"伊藤忠商事とBelong、米国ERI社と提携し日本でIT機器リサイクル事業を展開へ","summary":"伊藤忠商事と株式会社Belongは、米国最大の電気電子機器リサイクル事業を手掛けるElectronic Recyclers International Inc.（ERI社）と資本・業務提携し、2026年4月を目途に日本でIT機器全般のリサイクル事業を展開する合弁会社「株式会社ERI Japan」を設立することに合意しました。サーキュラーテクノロジーを活用した循環型ビジネスの構築を目指し、IT機器のデータ消去、破砕処理、再販、リサイクル、物流機能、法令対応までワンストップで提供します。この動きは、サステナビリティと循環型経済への関心の高まりを反映しており、開発者にとっては、環境負荷の低い製品設計やリサイクルを考慮したソフトウェア開発の重要性が増すことを意味します。","source":"ニュース記事","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEHnLhhD08_xvDXnF9OpB3sZy7fAOK3frx0O5GnbaUGkgoQBrio03V3IiF1qQ7Zz2ikyn-m8UDzp-IFpq2sjUM1ZGxU6F4I2NsKyNgpOOanHGSFTPJ_dmfrU1aM-AGeenRA_ZcM7mlbsVgej7Y7jsABAnY=","impact":"medium","tags":["ITリサイクル","循環型経済","サステナビリティ"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}
