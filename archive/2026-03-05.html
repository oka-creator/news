<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月6日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年3月6日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"OpenAIとGoogle、軽量・高性能な新モデルを同時リリースしAIエージェント構築を加速","summary":"OpenAIがハルシネーションを削減した「GPT-5.3 Instant」を、Googleが低価格・高速レスポンスの「Gemini 3.1 Flash-Lite」を同時リリースしました。これらの軽量かつ高性能なモデルの登場は、特定の業務を自動化するAIエージェントの構築をより身近にします。これにより、個人事業主や中小企業向けのAIエージェント構築代行・コンサルティングサービスは高い利益率が見込めるとされています。開発者にとっては、より手軽に高性能なAIエージェントを構築できる環境が整い、新たなビジネスチャンスが生まれるでしょう。","source":"Windflash Daily Report","url":"https://windflash.us/daily-report/en/2026-03-04","impact":"high","tags":["生成AI","LLM","AIエージェント","ビジネスチャンス"]},{"title":"AlibabaのLLM『Qwen3.5』開発コアメンバー辞任もオープンウェイト戦略は継続","summary":"中国Alibabaが提供するオープンソースLLM「Qwen3.5」の開発コアメンバーが辞任を発表しましたが、Alibabaは「オープンウェイトモデル戦略は継続する」とコメントしました。Qwen3.5はオープンながら最新のクローズドモデルに匹敵する性能を見せており、今回の発表はオープンソースAIコミュニティにとって重要な安心材料となります。開発者にとっては、高性能なオープンソースLLMが引き続き利用可能であるという確信が得られ、多様なAI開発プロジェクトに活用できるでしょう。","source":"ITmedia AI＋ (via Alibaba)","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHfbX39BdNz6XYEJ884o2WANykCpRSde2VMY1xSGx18KDLz44TJGmZy6eUHRNMKt40iaxRLaoQR2JjTPgV3aAOVf4JfwwdRfaks9jkQdWmygCAjZYZ8aK9nPW5CT3aSBYCylaGNWOBsp1xbykyjrWuL0fmx3zz83IPy","impact":"medium","tags":["オープンソースAI","LLM","Alibaba","Qwen"]},{"title":"さくらインターネット、東大開発の医療特化型LLMを研究者向けに無償提供開始","summary":"さくらインターネットは、東京大学大学院工学系研究科が開発した医療特化型LLM「Weblab-MedLLM-Qwen-2.5-109B-Instruct」を、生成AI向け推論API基盤「さくらのAI Engine」から研究用途限定で無償提供を開始しました。この取り組みにより、日本語環境における医療AI研究の発展が支援され、医療に関する自然言語処理の実証や研究が加速することが期待されます。開発者や研究者は、高度な医療AIモデルを無償で利用できるようになり、臨床現場でのAI導入に向けた検証に大きく貢献できるでしょう。","source":"さくらインターネット ニュースリリース","url":"https://www.sakura.ad.jp/corporate/newsreleases/2026/03/05/1971/","impact":"high","tags":["医療AI","LLM","さくらインターネット","研究開発"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"Indie Hackers、AIを『規律あるエンジニアリングパートナー』として活用する重要性を議論","summary":"個人開発者コミュニティIndie Hackersでは、AIを単なるチャットボットではなく「規律あるエンジニアリングパートナー」として活用する重要性が議論されています。目標を控えめに設定し月間経常収益2.5万ドル以上を達成した事例や、GDPR準拠のカレンダー同期ツールを開発した事例が紹介されました。AIを開発の強力なパートナーとして活用し、特定のニッチ市場を狙う戦略が個人開発成功の鍵として注目を集めています。開発者はAIを効果的に利用することで、効率的にニッチな市場で成功を収めるヒントを得られるでしょう。","source":"Indie Hackers","url":"https://www.indiehackers.com/newest","impact":"medium","tags":["個人開発","AI活用","ニッチ市場","Indie Hackers"]},{"title":"AI搭載スライド自動生成サービス『イルシル』が無料トライアルを提供開始","summary":"AI搭載スライド自動生成サービス「イルシル」が、新プラン「パーソナルプラスプラン」の3日間無料トライアルの提供を開始しました。このサービスは生成AIを活用してスライド資料作成を効率化できるため、プレゼンテーション資料作成に時間を要する個人開発者やフリーランス、中小企業などが手軽にAIによる業務効率化を試すことができます。開発者は、自身のプロジェクト発表やビジネス提案のための資料作成時間を大幅に削減し、本業に集中できるメリットを享受できるでしょう。","source":"PR TIMES (イルシル)","url":"https://prtimes.jp/main/html/rd/p/000000010.000122340.html","impact":"medium","tags":["生産性向上","AIツール","スライド作成","無料トライアル"]},{"title":"個人開発のアイデア枯渇問題にZennが提言：ニッチなニーズとAI活用が鍵","summary":"Zennに「個人開発のアイデアはもう枯渇している？競合だらけの市場で生き残るために考えていること」と題する記事が公開されました。この記事では、AIプロンプト管理ツール「PromptStash」やWebページデータ抽出ツール「DataPick」、YouTubeショート非表示ツール「YouTube Shorts Killer」などの具体的な個人開発事例を紹介しています。ニッチなニーズを捉えることやAIを効果的に活用することの重要性を解説しており、個人開発者がアイデアを見つけ、市場で成功するための具体的なヒントを提供しています。","source":"Zenn","url":"https://zenn.dev/shibe_shiba/articles/personal-dev-ideas-20260209","impact":"medium","tags":["個人開発","アイデア創出","AI活用","Zenn"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"米アマゾン、OpenAIに最大500億ドルを投資し戦略提携を強化","summary":"米アマゾンは、生成AIのOpenAIに最大500億ドルを投資する戦略提携を発表しました。この提携により、アマゾンのクラウド事業子会社AWSはOpenAIの企業向けAI基盤「フロンティア」を独占的に配信する権利を獲得し、OpenAIはAWSのAI専用半導体チップ「トレイニウム」を大規模に利用します。両社は、AIモデルが記憶を維持し長期作業に特化した新基盤「ステートフル・ランタイム・エンバイロメント」を共同開発し、Amazon Bedrock上で提供する計画です。開発者にとっては、AWS上でOpenAIの高度なAI基盤や共同開発される新技術が利用可能となり、より複雑なAIアプリケーション構築の可能性が広がります。","source":"JETRO","url":"https://www.jetro.go.jp/biznews/2026/03/4862419f71b953a9.html","impact":"high","tags":["AI投資","戦略提携","AWS","OpenAI","生成AI"]},{"title":"ソフトバンク、日本発のGPUクラウド基盤ソフトウェア『Infrinia AI Cloud OS』を発表","summary":"ソフトバンクは2026年1月に、日本発のまったく新しいGPUクラウドOS「Infrinia AI Cloud OS」（インフリニア・エーアイ・クラウド・オーエス）を発表しました。このソフトウェアは、急速に拡大するAI市場において不可欠なリソースであるGPUを効率的に管理・提供するためのクラウド基盤です。これまでGPUクラウド運用に存在した制限や非効率な点を解決し、AIデータセンター事業者をはじめとする多様な事業者がGPUクラウドサービスを提供できるようになります。開発者にとっては、より効率的でアクセスしやすいGPUリソースが提供されることで、AIモデルの学習や推論が加速し、開発サイクルが短縮されることが期待されます。","source":"Impress Watch","url":"https://smg.impress.co.jp/news/2026/03/05/edit00126.html","impact":"high","tags":["GPUクラウド","AIインフラ","ソフトバンク","クラウドOS"]},{"title":"サイバーエージェント調査：検索行動の『生成AIシフト』が加速、利用率37.0%に","summary":"サイバーエージェントGEOラボの調査によると、検索行動における生成AIの利用率が37.0%に達し、全世代で利用が上昇、特に20代では初めて過半数を突破しました。Google検索の「AIモード」も全体の21.0%が利用し、AIのおすすめをきっかけに約半数（47.5%）が購買行動に至ったことが判明しました。この結果は、消費者の情報収集や購買プロセスにおいて生成AIが本格的に影響を及ぼし始めていることを示しており、企業はAIを活用したマーケティング戦略の再考が求められます。開発者にとっては、ユーザーの行動変容を理解し、AIを活用した新しい情報提供や購買体験を設計する機会が増えることを意味します。","source":"サイバーエージェント ニュースリリース","url":"https://www.cyberagent.co.jp/news/detail/id=31464","impact":"high","tags":["生成AI","検索行動","消費者行動","マーケティング"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
