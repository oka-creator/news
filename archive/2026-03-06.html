<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月7日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年3月7日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"GPT-5、年内リリースに向けて最終調整か？","summary":"OpenAIが次世代LLM「GPT-5」の年内リリースを目指し、最終的な性能評価と安全性テストを進めていると報じられています。特に、推論能力とマルチモーダル機能の大幅な向上が期待されており、企業向けのAPI提供も視野に入っている模様です。これにより、より複雑なタスクの自動化やクリエイティブ分野でのAI活用が加速すると見られています。開発者にとっては、新たな強力なツールが登場し、これまで不可能だったアプリケーション開発の可能性が広がります。","source":"Search Engine Journal","url":"https://www.searchenginejournal.com/gpt-5/508496/","impact":"high","tags":["GPT-5","OpenAI","LLM","AI"]},{"title":"Google、Gemini Pro 1.5の一般提供を開始","summary":"Googleが、大規模なコンテキストウィンドウ（最大100万トークン）を特徴とする「Gemini Pro 1.5」の一般提供を開始しました。これにより、開発者は非常に長いドキュメントや動画全体を一度に処理できるようになり、要約、分析、質疑応答などのアプリケーション開発が容易になります。特に企業が大量のデータを扱う際にその真価を発揮すると期待されており、開発者はより複雑なデータ処理を伴うAIソリューションを構築できるようになります。","source":"Google Cloud Blog","url":"https://cloud.google.com/blog/products/ai-machine-learning/gemini-1-5-pro-and-flash-are-now-generally-available","impact":"high","tags":["Gemini Pro 1.5","Google","LLM","AI"]},{"title":"Stability AI、画像生成モデルの新たなオープンソース版を発表","summary":"Stability AIが、より高品質な画像生成と高速化を実現した新たなオープンソースの画像生成モデルを発表しました。これにより、個人開発者や中小企業でも、より高度なビジュアルコンテンツを生成することが可能になります。特に、特定のスタイルやテーマに特化した画像生成のカスタマイズが容易になり、クリエイティブ産業におけるAI活用の裾野が広がると予想されます。開発者は、このオープンソースモデルを活用して、独自の画像生成アプリケーションやサービスを構築できます。","source":"Stability AI News","url":"https://stability.ai/news/stable-diffusion-3-medium-release","impact":"medium","tags":["Stability AI","画像生成AI","オープンソース","Stable Diffusion"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコードツールを活用したMVP開発が加速","summary":"個人開発者の間で、AdaloやBubbleなどのノーコード・ローコードツールを利用して、アイデアを迅速にMVP（Minimum Viable Product）として形にする動きが活発化しています。これにより、開発コストと時間を大幅に削減し、市場のフィードバックを早期に得られるため、インディーハッカーが成功する確率が高まっています。特にAI連携機能が強化され、より複雑なアプリケーションも容易に構築できるようになり、開発者はプログラミングスキルに依存せずアイデアを具現化できます。","source":"Forbes","url":"https://www.forbes.com/sites/forbes-advisor/2024/05/29/business/software/no-code-low-code-development/","impact":"high","tags":["ノーコード","ローコード","MVP","個人開発"]},{"title":"サブスクリプション型SaaSの個人開発が引き続き人気","summary":"月額課金モデルのSaaS（Software as a Service）を個人で開発し、収益を上げるインディーハッカーが増加傾向にあります。特に、特定のニッチな問題を解決するツールや、既存サービスにはないユニークな付加価値を提供するサービスが成功事例として注目されています。StripeやPaddleといった決済サービスの統合が容易になったこともこのトレンドを後押ししており、開発者は安定した収益源を構築しやすくなっています。","source":"Indie Hackers Blog","url":"https://www.indiehackers.com/blog/indie-hacker-report-2023","impact":"medium","tags":["SaaS","サブスクリプション","インディーハッカー","収益化"]},{"title":"AIアシスタントを活用した開発効率の向上","summary":"GitHub CopilotやChatGPTなどのAIアシスタントツールが、個人開発者の間でコーディングの効率化に不可欠なツールとなっています。コードの自動生成、デバッグ支援、ドキュメント作成など、開発プロセスのあらゆる段階でAIを活用することで、一人で複数の役割をこなすインディーハッカーの生産性が飛躍的に向上しています。これにより、より複雑なプロジェクトへの挑戦や、開発期間の短縮が可能になり、開発者はより多くのアイデアを実現できるようになります。","source":"GitHub Blog","url":"https://github.blog/2023-11-08-github-copilot-enterprise-is-now-available/","impact":"high","tags":["AIアシスタント","GitHub Copilot","開発効率","生産性"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Apple、Vision Proの国際展開を加速か","summary":"Appleが、空間コンピュータ「Vision Pro」の国際市場への投入を準備しているとの観測が高まっています。米国での発売後、日本を含む主要国での展開が間近とされており、開発者向けには多言語対応やローカライズされたコンテンツの準備が推奨されています。これにより、XRデバイス市場がさらに活性化し、新たなアプリケーションやサービスが生まれることが期待され、開発者は新しいプラットフォームでの機会を得られます。","source":"MacRumors","url":"https://www.macrumors.com/2024/05/17/apple-vision-pro-international-expansion-soon/","impact":"medium","tags":["Apple Vision Pro","XR","空間コンピュータ","国際展開"]},{"title":"サイバーセキュリティ脅威の高度化と対策の強化","summary":"ランサムウェア攻撃やサプライチェーン攻撃など、サイバーセキュリティの脅威が高度化しており、企業はAIを活用した脅威検知システムやゼロトラストセキュリティモデルの導入を加速させています。特に中小企業を狙った攻撃が増加しているため、基本的なセキュリティ対策の徹底と、従業員へのセキュリティ教育の重要性が改めて強調されています。開発者は、セキュアなコード開発やセキュリティ対策を考慮したシステム設計がこれまで以上に求められます。","source":"Trend Micro","url":"https://www.trendmicro.com/vinfo/us/security/news/cybercrime-and-digital-threats/cybersecurity-predictions-2024-and-beyond","impact":"high","tags":["サイバーセキュリティ","ランサムウェア","ゼロトラスト","脅威対策"]},{"title":"量子コンピューティングの実用化に向けた進展","summary":"IBMやGoogleなどの主要プレイヤーが、量子コンピューティングの実用化に向けた研究開発を加速させています。特にエラー訂正技術の進歩や、特定の問題に対する量子アルゴリズムの効率化が進んでおり、創薬、金融モデリング、新素材開発などの分野での応用が期待されています。まだ一般への普及には時間がかかるとみられますが、企業は将来の競争力を見据え、量子技術への投資を強化しており、開発者は将来の技術トレンドとして注目すべきです。","source":"IBM Research Blog","url":"https://www.ibm.com/blogs/research/2023/12/quantum-roadmap-2023/","impact":"low","tags":["量子コンピューティング","IBM","Google","未来技術"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
