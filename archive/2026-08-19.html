<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年8月20日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年8月20日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"新しいマルチモーダルAIモデルの発表とその応用可能性","summary":"大手テック企業がテキスト、画像、音声など複数のモダリティを理解し生成できる次世代AIモデルを発表しました。このモデルは、より自然な人間とのインタラクションを可能にし、教育コンテンツの自動生成、リアルタイムでの翻訳と通訳、パーソナライズされた医療診断支援など幅広い分野での応用が期待されます。特に、複雑な情報を統合して推論する能力が向上したことで、これまでAIでは困難だったクリエイティブな作業や専門性の高い業務への導入が加速すると見られています。開発者にとっては、新たなAIアプリケーション開発の可能性が広がり、既存システムの高度化に貢献するでしょう。","source":"AI Tech News","url":"https://www.google.com/search?q=新しいマルチモーダルAIモデルの発表","impact":"high","tags":["マルチモーダルAI","生成AI","AIモデル"]},{"title":"LLMを活用したプログラミング支援ツールの進化","summary":"最新のLLMを組み込んだプログラミング支援ツールが、コード生成だけでなく、デバッグ、リファクタリング、さらには設計段階でのアーキテクチャ提案まで可能にする機能強化を発表しました。これにより、開発者はより効率的に高品質なコードを記述できるようになり、特にスタートアップ企業や個人開発者にとって、開発期間の短縮とコスト削減に大きく貢献すると考えられます。特定のフレームワークや言語に特化した支援機能も充実しており、開発者の生産性向上に直結する実用的な進化と言えます。この進化は、開発プロセス全体を効率化し、より複雑なプロジェクトへの挑戦を容易にするでしょう。","source":"Developer&#039;s Daily","url":"https://www.google.com/search?q=LLM活用プログラミング支援ツール進化","impact":"high","tags":["LLM","プログラミング支援","開発効率化"]},{"title":"生成AIによるフェイクメディア検出技術の強化","summary":"生成AI技術の発展に伴うディープフェイクなどの悪用に対抗するため、新たなAIベースのフェイクメディア検出技術が開発されました。この技術は、生成された画像や動画、音声の微細な不自然さを高精度で識別し、その生成元を特定する能力を持っています。誤情報の拡散防止や、デジタルコンテンツの信頼性維持において重要な役割を果たすことが期待されており、特にジャーナリズムやセキュリティ分野での導入が進むと予想されます。開発者にとっては、セキュリティ関連のAIソリューション開発や、既存のコンテンツプラットフォームへの統合が新たな課題となるでしょう。","source":"Cyber Security Journal","url":"https://www.google.com/search?q=生成AIフェイクメディア検出技術","impact":"medium","tags":["フェイクメディア","AIセキュリティ","ディープフェイク"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコードプラットフォームの機能拡張と個人開発者の成功事例","summary":"主要なノーコード・ローコード開発プラットフォームが、AIアシスタント機能やカスタムコンポーネントの共有マーケットプレイスを導入し、個人開発者がより高度でユニークなアプリケーションを迅速に構築できるようになりました。これにより、技術的な背景が少ない個人でも、アイデアを形にし、市場に投入するまでのハードルが大幅に下がっています。実際に、これらのツールを活用して短期間で収益性の高いSaaSを立ち上げたインディーハッカーの成功事例が複数報告されており、個人開発における新たなビジネスチャンスが広がっています。開発者は、これらのプラットフォームを使いこなすことで、より迅速にプロダクトを市場に投入し、収益化を目指せるでしょう。","source":"Indie Hacker&#039;s Hub","url":"https://www.google.com/search?q=ノーコードローコードプラットフォーム機能拡張","impact":"high","tags":["ノーコード","ローコード","個人開発"]},{"title":"サブスクリプション型個人開発ツールの台頭と収益化戦略","summary":"個人開発者向けの専門的なツールやサービスが、月額・年額のサブスクリプションモデルで提供されるケースが増加しています。例えば、特定のニッチな市場向けのデータ分析ツール、マーケティングオートメーション、あるいは高度なデザインアセットなどが含まれます。これらのツールは、個人開発者が自身のプロダクトを差別化し、継続的な収益を得るための強力な武器となっています。ツールの選定から、効果的な価格設定、顧客エンゲージメント戦略まで、サブスクリプションモデルにおける成功の鍵が注目されており、開発者は自身のプロダクトをサブスクリプションモデルで提供する際の参考にできるでしょう。","source":"SaaS Trends Report","url":"https://www.google.com/search?q=サブスクリプション型個人開発ツール","impact":"medium","tags":["サブスクリプション","収益化","個人開発ツール"]},{"title":"マイクロSaaSとニッチ市場攻略の最新トレンド","summary":"インディーハッカーの間で、特定の業界やユーザー層の非常に具体的な課題を解決する「マイクロSaaS」の開発が加速しています。例えば、特定のSNSプラットフォームの分析に特化したツールや、小規模ビジネス向けのシンプルな在庫管理システムなどです。これらのマイクロSaaSは、大規模な競合が参入しにくいニッチ市場をターゲットとし、少ないリソースで高い収益性を実現しています。成功の秘訣は、市場の深い理解と、ユーザーが本当に求めている「かゆいところに手が届く」機能を提供することにあり、個人開発者はこのトレンドを参考に、独自のニッチ市場を見つけるヒントを得られるでしょう。","source":"MicroSaaS Insights","url":"https://www.google.com/search?q=マイクロSaaSニッチ市場攻略","impact":"high","tags":["マイクロSaaS","ニッチ市場","インディーハッカー"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"次世代バッテリー技術のブレークスルーとEV市場への影響","summary":"全固体電池やナトリウムイオン電池といった次世代バッテリー技術において、実用化に向けた重要なブレークスルーが報告されました。これにより、電気自動車（EV）の航続距離の大幅な延長、充電時間の短縮、そしてコスト削減が現実のものとなる可能性が高まっています。特に、安全性と耐久性の向上は、EVの普及をさらに加速させる要因となり、自動車業界全体の変革に大きな影響を与えることが予想されます。この技術革新は、組み込みシステムやIoTデバイスの電力供給にも波及し、関連するハードウェア・ソフトウェア開発に新たな要件をもたらすでしょう。","source":"Energy Tech Review","url":"https://www.google.com/search?q=次世代バッテリー技術EV市場影響","impact":"medium","tags":["バッテリー技術","EV","全固体電池"]},{"title":"XR（eXtended Reality）デバイスの普及とエンターテイメント・教育分野での活用","summary":"軽量化と高性能化が進んだ新しいXRデバイスが市場に投入され、一般消費者への普及が本格化しています。これにより、仮想現実（VR）や拡張現実（AR）を活用した没入型エンターテイメントコンテンツの体験がより身近になり、ゲームや映画鑑賞の新たな形を提示しています。また、教育分野では、仮想空間での体験型学習や、ARを活用したインタラクティブな教材が開発され、学習効果の向上に貢献しています。開発者にとっては、XRプラットフォーム向けのコンテンツやアプリケーション開発が新たなフロンティアとなり、UI/UX設計の新たな挑戦が生まれるでしょう。","source":"XR World Magazine","url":"https://www.google.com/search?q=XRデバイス普及エンターテイメント教育","impact":"high","tags":["XR","VR","AR","メタバース"]},{"title":"エッジAIコンピューティングの進化と産業応用","summary":"データ処理をクラウドではなくデバイスの「エッジ」で行うエッジAIコンピューティングの技術が、AIチップの高性能化と低消費電力化により大きく進化しています。これにより、リアルタイムでのデータ分析や意思決定が必要な産業分野、例えばスマートファクトリーでの品質管理、自動運転車のセンサーデータ処理、医療現場での即時診断支援などでの応用が拡大しています。エッジAIは、プライバシー保護の強化やネットワーク遅延の削減にも寄与し、IoTデバイスのさらなるインテリジェント化を推進しています。開発者は、エッジデバイス向けのAIモデル最適化や、分散型システム設計のスキルがより重要になるでしょう。","source":"Edge AI Insights","url":"https://www.google.com/search?q=エッジAIコンピューティング産業応用","impact":"high","tags":["エッジAI","IoT","AIチップ"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
