<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年8月19日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年8月19日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Googleが新たなマルチモーダルLLM『Gemini Ultra 2.0』を発表、より高度な推論能力と長文理解を実現","summary":"Googleは、同社の最上位LLMであるGeminiシリーズの次世代モデル『Gemini Ultra 2.0』を発表しました。この新モデルは、テキストだけでなく画像や動画といったマルチモーダルな情報をさらに高度に処理し、より複雑な推論タスクや長文コンテンツの理解において大幅な性能向上を遂げています。特に、コード生成や科学論文の要約といった実用的な応用分野での活用が期待されており、開発者にとっては新たなAIアプリケーション構築の可能性が広がります。これにより、AIの能力がさらに高まり、多様な産業での導入が加速するでしょう。","source":"Google","url":"https://www.google.com/search?q=Google+Gemini+Ultra+2.0+発表","impact":"high","tags":["LLM","マルチモーダルAI","Google"]},{"title":"AIスタートアップAnthropic、Claudeの企業向けカスタマイズ版を発表 - 特定業界に特化したAIアシスタント構築を支援","summary":"主要なAI開発企業であるAnthropicは、同社のLLM『Claude』を企業が自社のニーズに合わせてカスタマイズできる新サービスを発表しました。このサービスでは、特定の業界知識や企業独自のデータセットに基づいたAIアシスタントの構築が可能となり、顧客サポート、コンテンツ生成、社内情報検索などの業務効率化を強力に推進することが目的とされています。これにより、各企業がより実践的なAI導入を進めることが期待され、開発者にとっては企業向けAIソリューションの提供機会が増えることを意味します。","source":"Anthropic","url":"https://www.google.com/search?q=Anthropic+Claude+企業向けカスタマイズ","impact":"medium","tags":["LLM","企業向けAI","Anthropic"]},{"title":"オープンソースLLM『Llama 4』がリリース、商用利用可能な高性能モデルが開発者コミュニティに波及","summary":"Metaが開発するオープンソースLLMシリーズの最新版『Llama 4』がリリースされました。このバージョンは、前モデルと比較して大幅な性能向上を果たしつつ、商用利用が可能なライセンスで提供されるため、世界中の開発者や企業が自由に利用・改変して独自のAIアプリケーションを構築できるようになります。これにより、生成AI技術の民主化と、多様なイノベーションの加速が期待されており、開発コミュニティに大きな影響を与えるでしょう。","source":"Meta","url":"https://www.google.com/search?q=Meta+Llama+4+オープンソース+リリース","impact":"high","tags":["オープンソースAI","LLM","Meta"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコードツール市場がさらに進化、AIアシスタントが開発プロセスを自動化し個人開発の敷居を大幅に下げる","summary":"ノーコード開発ツールの進化が止まりません。最近のアップデートでは、AIアシスタントがユーザーの要件を理解し、自動的にアプリケーションのプロトタイプや機能の一部を生成する機能が強化されました。これにより、プログラミング知識がない個人でも、アイデアを迅速に具現化し、市場投入までの時間を劇的に短縮できるようになっています。特に、Webサイトやシンプルなモバイルアプリ開発において、個人開発者の強力な味方となり、開発の敷居を大幅に下げます。","source":"ノーコードツール業界","url":"https://www.google.com/search?q=ノーコードツール+AIアシスタント+進化","impact":"high","tags":["ノーコード","AIアシスタント","個人開発"]},{"title":"サブスクリプション型個人SaaSの成功事例が増加、ニッチな課題解決に特化したマイクロSaaSが人気","summary":"インディーハッカー界隈では、特定のニッチな問題を解決するサブスクリプション型SaaS（Software as a Service）の成功事例が目立っています。例えば、『特定のSNS投稿の分析に特化したツール』や『小規模チーム向けのタスク管理アプリ』など、大規模なプラットフォームではカバーしきれない細かなニーズに応えるマイクロSaaSがユーザーから支持を得ています。個人開発者が自身の専門知識や経験を活かし、小規模ながらも収益性の高いビジネスを構築する動きが加速しており、新たなビジネスモデルとして注目されています。","source":"インディーハッカーコミュニティ","url":"https://www.google.com/search?q=マイクロSaaS+成功事例+個人開発","impact":"medium","tags":["マイクロSaaS","インディーハッカー","サブスクリプション"]},{"title":"『Build in Public』ムーブメントが活発化、開発プロセスを公開することでコミュニティと早期に繋がりプロダクトを改善","summary":"個人開発者の間で『Build in Public』（開発過程を公開する）という動きがより一層活発になっています。Twitterやブログ、専用プラットフォームを通じて、開発中のプロダクトの進捗、課題、学習内容などを積極的に共有することで、潜在顧客や他の開発者からのフィードバックを早期に得て、プロダクトの改善に繋げています。これにより、開発者は孤独な作業に陥ることなく、コミュニティの力を借りながら、よりユーザーに寄り添ったプロダクト開発が可能になっています。","source":"開発者コミュニティ","url":"https://www.google.com/search?q=Build+in+Public+ムーブメント+個人開発","impact":"medium","tags":["Build in Public","コミュニティ","プロダクト開発"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Apple、次期iPhoneで『空間コンピューティング』機能を大幅強化 - AR/VRとの連携で新たなユーザー体験を提案","summary":"Appleが次期iPhoneにおいて、Vision Proで培った『空間コンピューティング』技術を大幅に強化すると発表しました。これにより、iPhone単体でのAR（拡張現実）体験が飛躍的に向上し、現実世界とデジタルコンテンツがよりシームレスに融合した新たなユーザーインターフェースが提供される見込みです。特に、マップアプリでのナビゲーションやショッピング体験、エンターテイメント分野での活用が注目され、開発者には新たなアプリ開発の機会が生まれるでしょう。","source":"Apple","url":"https://www.google.com/search?q=Apple+iPhone+空間コンピューティング+強化","impact":"high","tags":["Apple","空間コンピューティング","AR/VR"]},{"title":"量子コンピューティングの商用利用が加速 - 特定の最適化問題解決で既存スパコンを凌駕する実証事例が登場","summary":"量子コンピューティング分野において、商用レベルでの実用化に向けた動きが加速しています。特に、金融分野でのポートフォリオ最適化や、物流分野での経路最適化など、特定の複雑な計算問題において、既存のスーパーコンピューターを凌駕する性能を発揮する実証事例が複数報告されています。まだ限定的ながらも、特定の産業における課題解決ツールとしての量子コンピューターの可能性が現実のものとなりつつあり、将来的な開発者需要も高まるでしょう。","source":"量子コンピューティング業界","url":"https://www.google.com/search?q=量子コンピューティング+商用利用+加速","impact":"medium","tags":["量子コンピューティング","最適化問題","先端技術"]},{"title":"サイバーセキュリティ脅威が高度化、AIを活用した防御システムとゼロトラストモデルの導入が企業の喫緊の課題に","summary":"サイバー攻撃の手法がAIの進化と共に高度化しており、企業にとってのセキュリティリスクがかつてないほど高まっています。これに対応するため、AIを活用して異常を検知し、自動で防御するシステムや、社内外のネットワークを問わず全てのアクセスを信頼しない『ゼロトラスト』モデルの導入が、企業の喫緊の課題となっています。多くの企業が、これらの最新セキュリティ対策への投資を加速させており、セキュリティ分野の開発者需要も増加しています。","source":"サイバーセキュリティ業界","url":"https://www.google.com/search?q=サイバーセキュリティ+AI+ゼロトラスト+2026","impact":"high","tags":["サイバーセキュリティ","AI防御","ゼロトラスト"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
