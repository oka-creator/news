<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月25日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年3月25日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"OpenAI、動画生成AI『Sora』の提供を終了へ","summary":"OpenAIは、動画生成AI「Sora」のアプリとAPIの提供を終了すると発表しました。これは、同社が「スーパーアプリ」などの新たな大規模プロジェクトへリソースを集中させるための戦略的判断と見られています。同時に、The Walt Disney Companyとのライセンス契約も解消される見込みです。SoraのユーザーやAPIを利用していた開発者は、代替となる動画生成ソリューションの検討が必要となり、OpenAIの今後の方向性を示す重要な動きです。","source":"ITmedia NEWS","url":"https://www.itmedia.co.jp/news/articles/2603/25/news043.html","impact":"high","tags":["生成AI","動画生成","OpenAI","Sora"]},{"title":"楽天、7000億パラメータの国産LLM『Rakuten AI 3.0』をオープン公開","summary":"楽天グループは、経済産業省・NEDOの「GENIACプロジェクト」の一環として、日本語に最適化された大規模言語モデル「Rakuten AI 3.0」を公開しました。これは国内企業が開発したLLMとしては最大規模の7000億パラメータを持ち、文章作成、コード生成、文書解析・抽出など幅広い用途でのテキスト処理に優れています。日本語のニュアンスや文化を深く理解できるため、国内でのAI活用を大きく加速させることが期待されます。開発者にとっては、高品質な国産LLMの選択肢が増え、日本市場に特化したAIアプリケーション開発が促進されるでしょう。","source":"note, 楽天グループ株式会社","url":"https://note.com/ai_gakkou/n/ne76116f39d73","impact":"high","tags":["LLM","国産AI","楽天","日本語AI"]},{"title":"ELNETとNTTドコモビジネス、新聞記事を活用した生成AIサービス『ELNET AI』を共同開発","summary":"株式会社エレクトロニック・ライブラリー（ELNET）とNTTドコモビジネス株式会社は、最新の新聞記事を横断的に活用し、効率的な情報整理を実現する法人向け生成AIサービス「ELNET AI」を共同開発しました。本サービスは、チャット画面から質問を入力するだけで、信頼性の高い新聞情報をもとに生成AIが回答を作成し、参照元記事も確認可能です。2026年4月1日よりパイロット版の提供が開始され、企業のDX推進と意思決定の高度化に貢献します。開発者にとっては、信頼性の高い情報源に基づいたAIサービスの新たなユースケースとして注目されます。","source":"共同通信PRワイヤー, ELNET","url":"https://kyodonewsprwire.jp/release/202603248381","impact":"medium","tags":["生成AI","法人向け","情報整理","新聞記事"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"AI時代のコーディング環境を構築！2026年おすすめ開発ツール Top10","summary":"AIの進化に伴い、開発環境は大きく変化しており、AIネイティブなツールの導入が不可欠になっています。特にPostmanの無料プラン大幅制限のような動きを受け、多くのエンジニアが開発ワークフローの見直しを迫られています。この記事では、AIを活用した効率的なコーディングを支援する最新の開発ツールが紹介されており、個人開発者やインディーハッカーが生産性を向上させるための具体的なヒントが得られます。開発者にとっては、自身のツールセットを最新化し、AIの恩恵を最大限に受けるための重要な情報源となるでしょう。","source":"はてなブックマーク","url":"https://b.hatena.ne.jp/entry/s/zenn.dev/yuuto127/articles/e83f053597d3f8","impact":"high","tags":["開発ツール","AI開発","生産性向上","インディーハッカー"]},{"title":"龍脳編纂局、3D潜入アクションゲーム『幽鬼電脳ブレイクロア』をunityroomで無料公開","summary":"制作チーム「龍脳編纂局」が、3D潜入アクションゲーム『幽鬼電脳ブレイクロア』をフリーゲーム投稿サイト「unityroom」で無料公開しました。プレイヤーは裏社会のハッカーとなり、敵の視線を掻い潜りながら侵入し、ハッキングによって目的を達成するステルスゲームです。ギミック満載の4ステージや退廃的なサイバー世界観が特徴で、個人開発によるゲームの質の高さを示しています。これは、インディーゲーム開発者がUnityのようなツールを使って高品質な作品を生み出せることを示す好例であり、他の開発者への刺激となるでしょう。","source":"gamebiz","url":"https://gamebiz.jp/news/384777","impact":"medium","tags":["インディーゲーム","Unity","ゲーム開発","フリーゲーム"]},{"title":"Android StudioにGeminiが搭載され、AIアシスタント機能で開発を支援","summary":"Android Studioに「Gemini in Android Studio」が搭載され、AIアシスタント機能が強化されました。これにより、コードの生成、既存コードの修正、Androidアプリ開発に関する質問への回答など、開発作業を効率化する支援が提供されます。個人開発者にとって、AIを活用した開発支援ツールは、より迅速かつ高品質なアプリ開発を実現するための強力な味方となります。Androidアプリ開発者は、この新機能により開発プロセスを大幅に改善できるでしょう。","source":"Android デベロッパー","url":"https://developer.android.com/studio?hl=ja","impact":"high","tags":["Android開発","AIアシスタント","Gemini","開発効率化"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"シャオミ・ジャパン、Mini LED搭載フラッグシップスマートテレビ『Xiaomi TV S Mini LED 2026 シリーズ』を発売","summary":"小米技術日本株式会社（シャオミ・ジャパン）は、Mini LEDテクノロジーを採用した最新のチューナーレススマートテレビ「Xiaomi TV S Mini LED 2026 シリーズ」の4モデル（65 / 75 / 85 / 98インチ）を2026年3月24日より発売開始しました。最大98インチの超大画面、Mini LEDローカルディミングによる精緻な光制御、ピーク輝度1200nits、量子ドット（QLED）テクノロジーによる10億色の色彩美が特徴で、ホームエンターテインメントの新たな基準を提示します。これは最新のディスプレイ技術が一般消費者向け製品に普及していることを示し、関連技術開発者にとっては市場の動向を把握する上で重要です。","source":"PR TIMES","url":"https://prtimes.jp/main/html/rd/p/000000075.000062431.html","impact":"low","tags":["スマートテレビ","Mini LED","ディスプレイ技術","シャオミ"]},{"title":"伊藤忠商事、サーキュラーテクノロジーを活用したIT機器の循環型ビジネスを構築","summary":"伊藤忠商事株式会社は、米国最大の電気電子機器リサイクル事業者であるERI社と資本・業務提携し、日本においてIT機器全般のリサイクル事業を展開する合弁会社「株式会社ERI Japan」を2026年4月を目途に設立することに合意しました。この取り組みは、世界のIT資産処分市場が拡大する中で、サーキュラーテクノロジーを活用し、IT機器の持続可能な循環型ビジネスモデルを構築することを目指しています。これは環境負荷低減と資源の有効活用を促進するものであり、IT業界全体における持続可能性への意識の高まりを反映しています。","source":"伊藤忠商事","url":"https://www.itochu.co.jp/ja/news/press/2026/260324.html","impact":"medium","tags":["サーキュラーエコノミー","ITリサイクル","持続可能性","環境技術"]},{"title":"データセクション、『Data Center Japan 2026』に初出展し、AIインフラ戦略を講演","summary":"データセクション株式会社は、データセンター業界最大級の展示会「Data Center Japan 2026」に初出展し、代表取締役社長執行役員CEO石原紀彦氏が「戦略的資産としてのAIインフラ構築によるビジネス戦略の再定義」をテーマに講演を行いました。同社は自社開発のAIクラウドスタック「TAIZA」を基盤としたGPU運用の拡大を推進しており、2026年内には10万〜30万個の規模への拡張を目指しています。これは、生成AIの急速な普及に伴うAIインフラ需要の拡大に対応し、日本企業の国際競争力強化に貢献するものであり、AI関連の開発者や企業にとって、今後のインフラ利用の選択肢やコストに影響を与える可能性があります。","source":"データセクション株式会社","url":"https://www.datasection.co.jp/news/2026/03/24/data-center-japan-2026","impact":"high","tags":["AIインフラ","データセンター","GPU","クラウドスタック"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
