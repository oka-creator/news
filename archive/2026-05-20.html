<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年5月21日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"「集英社ゲームズが新たなゲーム企画の公募を開始」","summary":"株式会社集英社ゲームズは、2026年5月19日より新たなゲーム企画の公募を開始しました。この公募は、すでに制作中のゲームだけでなく、これから制作を始める企画も対象とし、企画書とポートフォリオのみで応募が可能です。これはインディーゲーム開発者にとって、大手パブリッシャーからの資金やマーケティング支援を得る大きな機会となります。特に、まだ開発段階にないアイデアでも応募できるため、多くの個人開発者が挑戦しやすい環境が提供されるでしょう。","source":"IndieGamesJp.dev","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQF0OKufo-gY5S2uOw8nyX7RDvnt_6SEzxvYlEsT2QR_SsvCCJ-Vu_Fxr1MHgkbgYpWyCx4098rGVsfoKKUfXqovi_1XF54Wfkt1IptFUBaawVqWDoM=","impact":"high","tags":["インディーゲーム","ゲーム開発","公募"]},{"title":"「スクウェア・エニックスが賞金総額10億円の『SQUARE ENIX GAME CONTEST 2026』を発表」","summary":"スクウェア・エニックスは、賞金総額10億円規模の「SQUARE ENIX GAME CONTEST 2026」の開催を発表しました。応募受付は2026年12月から開始され、日本国内在住の個人、グループ、または法人が対象となります。これはインディーゲーム開発者にとって、資金面での大きな支援と、大手パブリッシャーの知名度を活用できる非常に魅力的なチャンスです。開発者は、このコンテストに向けて独創的なゲーム企画を練り上げ、自身の作品を世に送り出す絶好の機会と捉えるべきでしょう。","source":"IndieGamesJp.dev","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQF0OKufo-gY5S2uOw8nyX7RDvnt_6SEzxvYlEsT2QR_SsvCCJ-Vu_Fxr1MHgkbgYpWyCx4098rGVsfoKKUfXqovi_1XF54Wfkt1IptFUBaawVqWDoM=","impact":"high","tags":["ゲームコンテスト","スクウェア・エニックス","インディーゲーム"]},{"title":"「GitHub、約3800件の内部データが流出か―ソフトウェア開発プラットフォームが不正アクセス被害に遭う」","summary":"ソフトウェア開発プラットフォームのGitHubは2026年5月20日、同社の内部リポジトリへの不正アクセスについて調査を行っていると発表しました。この侵害にはVisual Studio Codeの拡張機能が関与していたとされ、約3,800件のリポジトリからのデータ流出が確認されています。個人開発者も多く利用するプラットフォームであるため、自身のプロジェクトのセキュリティ対策を見直す良い機会となるでしょう。特に、APIキーや認証情報などの機微な情報をリポジトリに直接コミットしていないか、二段階認証を有効にしているかなど、改めて確認することが推奨されます。","source":"Game*Spark","url":"https://vertexaisearch.google.com/grounding-api-redirect/AUZIYQE2xKlUI5xVLCFoPSuIW9Kt6NjXSgMKrSZcbRxc-NKIG6Ru5HSrjnhcYbRkb3vn5z4B-VuFzaSmCDTFkmhUHg7wisUCScMUAmJv2PeHuXN03de4YC2I2l6-rNcqVYhIAW1pSj-HTn3YhNhXpzZ0fL_0pC8=","impact":"high","tags":["GitHub","セキュリティ","データ流出"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"「MetaのAIグラスが日本発売、視力補正と日常利用に注力」","summary":"AIグラスでトップシェアを持つMetaが、ついに日本市場に参入しました。価格は7万円台からで、「Ray-Ban Meta(Gen 2)」や度付きレンズ対応の「Ray-Ban Meta Optics(Gen 2)」などがラインナップされます。日本での視力矯正用メガネの普及率が高いことを踏まえ、Metaは度付きレンズ対応を重視し、日常的にアイウェアを使用する日本のユーザー層への浸透を目指しています。この動きは、ウェアラブルデバイス市場、特にARグラス分野の競争を激化させ、開発者には新たなプラットフォームでのアプリケーション開発の機会をもたらすでしょう。","source":"Impress Watch","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFv1LRf23cppb9JodyOK-uq6EStllRtpmcEBG0OJODy4rEcgNvU-HrXhToGq3h2KafFudRGNyjOYCElnV9EYfxW6eCzY-JSrXyICsKEt31oiybg7L0ng_5WgLzWvbtDLLA44m80R8D8ogcJyY2JC1XnGCM=","impact":"medium","tags":["Meta","AIグラス","ウェアラブル"]},{"title":"「Google検索が25年ぶりの大刷新、『ググる』から『AIエージェントに任せる』時代へ」","summary":"Googleは検索サービスに大規模なAI機能拡張を導入すると発表し、25年以上で最大級の刷新と位置付けています。AIモードに新モデル「Gemini 3.5 Flash」を標準搭載し、検索欄の全面刷新、情報探索用エージェント、生成型UI、個人データ連携機能を順次投入します。これにより、ユーザーは自ら情報を検索する「ググる」から、AIエージェントに任せて必要な情報を得る、よりパーソナライズされた体験へと移行する見込みです。開発者は、検索エンジンのアルゴリズム変更や、AIエージェントによる情報収集・提示方法の変化に対応したSEO戦略やコンテンツ作成が求められるでしょう。","source":"ITmedia エンタープライズ","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGL5oaAYefSR-wVgoFcqnNtQC3hZrrgFyNa5y2hl3Eh7DqT9SiJkXxJAlNli1qT39rolh7kH0pbMQVSVKO2KSK1Gn_EKFp73XR4vpTa_JMEqYv-fkbEH1uOplwrzr4NwMlKefCcV4ly-0tU3ZPcQ85MMfS8wjiNRKF9lDjagg==","impact":"high","tags":["Google検索","AI検索","Gemini"]},{"title":"「G7がAIを悪用したサイバー攻撃への国際対策で合意、政府はClaude Mythos対策を策定」","summary":"G7は、AIを悪用したサイバー攻撃への国際的な対策をまとめることで合意しました。これを受けて、日本政府はAnthropicが開発した「危険すぎて一般公開できない」とされるフロンティアAIモデル「Claude Mythos」への対策方針を策定しています。Claude Mythosは現在、防衛目的限定のイニシアチブ「Project Glasswing」を通じて、厳格な審査を経た組織のみが利用可能であり、日本政府や金融機関もアクセス権取得に向けた交渉を進めているとのことです。この動きは、AIの倫理的利用とセキュリティ確保の重要性を浮き彫りにし、開発者にはAIシステムの安全性と悪用防止に関する意識を高めることが求められます。","source":"innovaTopia","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHf5VG1tpouCKpDbfTcZq2Z_ULRVgLowjLrLgeSUHqNIHU-fg2CfJbB2XPaOvQrfbRhKPt9BUb_j7b2t9DT1THXcsXB1_v5CG7gZLzbt69CghktJgbSCdfZG0nLczOZK6GMs9TwiuHr0uUIijPFgs4nNGG3l-LgKmWb4na4akI8PhiaKIKTaZQhhZvuj6zmH-o4C9A9DHUW-0knPg==","impact":"medium","tags":["サイバーセキュリティ","AI倫理","G7"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
