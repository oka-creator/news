<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月10日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年3月10日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Google、次世代LLM「Gemini Ultra 1.5」の詳細を発表、長文コンテキスト処理能力が大幅向上","summary":"Googleは、最新の大規模言語モデル「Gemini Ultra 1.5」に関する詳細な技術情報を公開しました。このモデルは、特に長文のコンテキスト処理において飛躍的な進歩を遂げており、最大100万トークン（約75万語）の情報を一度に処理できるとされています。これにより、これまで難しかった長大なドキュメントの要約やコードベース全体の解析が実用的なレベルで可能になります。企業は、顧客サポートの履歴全体をAIに分析させたり、法務文書のレビューを効率化したりといった具体的な応用が期待され、開発者はより複雑なAIアプリケーションを構築できるようになるでしょう。","source":"Google News","url":"https://www.google.com/search?q=Google+Gemini+Ultra+1.5+long+context","impact":"high","tags":["LLM","Google","AI"]},{"title":"Microsoft、AIを活用した新しいプログラミングアシスタント「Copilot Pro for Enterprise」を発表","summary":"Microsoftは、企業向けの新しいAIプログラミングアシスタント「Copilot Pro for Enterprise」の提供を開始しました。このサービスは、既存のGitHub Copilotの機能を拡張し、企業の特定のコードベースや開発環境に最適化された提案や自動補完を提供します。セキュリティとプライバシーが強化されており、企業内の機密情報が外部に漏洩することなく、開発者がより効率的に高品質なコードを作成できるよう支援します。特に大規模な開発チームや、レガシーシステムを持つ企業にとって、開発効率の向上とバグの削減に貢献する実用的なツールとなるでしょう。","source":"Google News","url":"https://www.google.com/search?q=Microsoft+Copilot+Pro+for+Enterprise","impact":"high","tags":["AIアシスタント","Microsoft","開発ツール"]},{"title":"Stability AI、画像生成モデル「Stable Diffusion 4」のプレビュー版を公開、リアルタイム生成機能を強化","summary":"Stability AIは、画像生成AIモデル「Stable Diffusion」の次世代バージョンである「Stable Diffusion 4」のプレビュー版を公開しました。今回のアップデートでは、特にリアルタイムでの画像生成速度が大幅に向上しており、ユーザーはより直感的にイメージを試行錯誤できるようになります。また、生成される画像の品質もさらに向上し、より複雑なプロンプトにも対応できるようになりました。クリエイターやデザイナーは、アイデア出しの段階からAIを活用することで、制作プロセスを劇的に加速させることが可能になり、開発者にとっては新たな画像生成アプリケーションの可能性が広がります。","source":"Google News","url":"https://www.google.com/search?q=Stability+AI+Stable+Diffusion+4+realtime","impact":"medium","tags":["画像生成AI","Stable Diffusion","クリエイティブ"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード開発プラットフォーム「Bubble」が新機能「Workflow AI」をリリース、個人開発者のAIアプリ開発を加速","summary":"ノーコード開発プラットフォームのBubbleは、AIを活用した新機能「Workflow AI」を発表しました。これにより、個人開発者はプログラミングの知識がなくても、ChatGPTのようなAIモデルを組み込んだアプリケーションを簡単に構築できるようになります。具体的には、テキスト生成、画像認識、データ分析などのAI機能を、ドラッグ＆ドロップ操作でワークフローに組み込むことが可能です。この機能は、アイデア次第で様々なAI駆動型サービスのプロトタイプを迅速に作成し、市場投入までの時間を大幅に短縮できるため、個人開発者にとって大きなメリットとなります。","source":"Google News","url":"https://www.google.com/search?q=Bubble+Workflow+AI+no-code","impact":"high","tags":["ノーコード","AIアプリ","Bubble"]},{"title":"インディーハッカー向けSaaS構築ツール「Supabase」が大幅アップデート、リアルタイム機能とエッジコンピューティングを強化","summary":"オープンソースのBaaS（Backend as a Service）であるSupabaseが、リアルタイム機能とエッジコンピューティングのサポートを強化する大型アップデートを実施しました。個人開発者やインディーハッカーは、PostgreSQLをベースにしたデータベース、認証、ストレージ、リアルタイムAPIなどを活用し、スケーラブルなアプリケーションを迅速に構築できます。今回のアップデートにより、チャットアプリや共同編集ツールなど、リアルタイム性が求められるアプリケーションの開発がより容易になり、パフォーマンスも向上するため、開発者はよりリッチなユーザー体験を提供できるようになるでしょう。","source":"Google News","url":"https://www.google.com/search?q=Supabase+realtime+edge+computing+update","impact":"medium","tags":["BaaS","Supabase","リアルタイム"]},{"title":"月額数千円で稼ぐ個人開発アプリの成功事例が続々、ニッチな課題解決型SaaSが人気","summary":"近年、特定のニッチな課題を解決する個人開発のSaaS（Software as a Service）が、月額数千円から数十万円の収益を上げている事例が増加しています。例えば、特定のSNSの分析ツール、特定の業務フローを自動化する小さなユーティリティ、特定の趣味に特化したコミュニティツールなどが挙げられます。これらの成功事例は、大規模な開発チームが着手しないような小さな市場でも、ユーザーの深いニーズに応えることで収益を上げられることを示しています。個人開発者にとって具体的なビジネスチャンスとなっており、アイデアと実行力次第で大きな成果を出せる可能性を秘めています。","source":"Google News","url":"https://www.google.com/search?q=indie+hacker+SaaS+success+stories+niche","impact":"high","tags":["SaaS","個人開発","ビジネスモデル"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Apple、AR/VRヘッドセット「Vision Pro」の欧州およびアジアでの発売計画を発表","summary":"Appleは、先日米国で発売された空間コンピュータ「Vision Pro」について、今年中に欧州およびアジアの主要市場での発売を計画していることを明らかにしました。具体的な国名や時期については今後発表される予定ですが、これによりAR/VR市場全体の活性化が期待されます。企業は、Vision Proを活用した新しいビジネスソリューションや、エンターテイメントコンテンツの開発を加速させる必要に迫られるでしょう。開発者にとっては、新たなプラットフォームでのアプリケーション開発の機会が拡大します。","source":"Google News","url":"https://www.google.com/search?q=Apple+Vision+Pro+Europe+Asia+launch","impact":"high","tags":["AR/VR","Apple","Vision Pro"]},{"title":"半導体産業、AI需要の高まりで記録的な投資が継続、次世代チップ開発が加速","summary":"AI技術の急速な進化と普及に伴い、半導体産業は記録的な規模の設備投資と研究開発を継続しています。特に、NVIDIAやTSMCなどの大手企業は、AI処理に特化した次世代チップの開発に巨額を投じており、その性能は飛躍的に向上しています。この動きは、クラウドコンピューティング、エッジAI、自動運転など、多岐にわたるテクノロジー分野の発展を強力に後押しするでしょう。あらゆる産業におけるデジタルトランスフォーメーションを加速させる要因となり、開発者はより高性能なハードウェアを前提としたソリューションを設計できるようになります。","source":"Google News","url":"https://www.google.com/search?q=semiconductor+AI+investment+next+gen+chips","impact":"high","tags":["半導体","AIチップ","NVIDIA"]},{"title":"サイバーセキュリティ脅威が多様化、AIを活用した防御策と人材育成が急務に","summary":"2026年に入り、ランサムウェア攻撃やフィッシング詐欺などのサイバーセキュリティ脅威は、AIの悪用によりさらに巧妙化・多様化しています。これに対し、企業や政府機関は、AIを活用した脅威検知システムや自動防御策の導入を加速させています。同時に、高度なサイバーセキュリティ人材の育成も喫緊の課題となっており、関連する教育プログラムや資格制度への投資が活発化しています。企業は、最新の脅威動向を把握し、多層的な防御策を講じることがこれまで以上に重要になり、開発者はセキュリティを考慮したシステム設計が求められるでしょう。","source":"Google News","url":"https://www.google.com/search?q=cybersecurity+AI+threats+defense+2026","impact":"high","tags":["サイバーセキュリティ","AI防御","脅威"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
