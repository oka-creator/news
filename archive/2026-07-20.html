<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);

  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

    text-align: center;
    margin-bottom: 8px;
  }

    align-items: center;
    justify-content: center;

    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;

  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);

    border: none;
    background: none;

    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);

  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {

    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }

  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  footer {

    margin-top: 36px;
    padding-top: 18px;

  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>

e.com/grounding-api-redirect/AUZIYQFp5gmGzp17Qdl-_gjBOGvpavKCbsxwmgDjJkFhC5oz8Uuyo5eSltwaTY27y0EtbGRbXg3HUEDjvuvxinWP9yVZtkO9Biksb999QEpIB5_rrLhN2jhHLGcA_--IxELr2CGQf6Saw0uxOQPMkCCAnUZBgXWQrFfv","impact":"high","tags":["NVIDIA","FRONTia","AIインフラ","国産AI"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"AI時代の「ソロプレナー」育成プログラム「AXSC」が第3期Demo Dayを開催","summary":"AI駆動アクセラレーターのAxla合同会社は、AIとゼロイチスキルを身につけて「作れるソロプレナー」を目指すアクセラレータープログラム「AXSC」の第3期Demo Dayを7月22日に渋谷で開催します。生成AIの普及により、個人がアイデアをプロダクトとして形にするハードルが大きく下がり、個人がAIをパートナーに事業を構想し、MVPを作り、顧客に届ける新しい起業スタイルが広がっています。AXSCは「AI × 事業開発」「AI × MVP開発」「AI × マーケティング」を横断的に学ぶ150日間のプログラムで、受講生が約半年間で構築したサービス・プロダクトを発表します。個人開発者はこのプログラムを通じて、AIを活用した事業開発スキルを習得し、自身のプロダクトを市場に投入する機会を得られるでしょう。","source":"ニュース情報","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQF4Rl8sPkc-ZeV0FlcTWGJvgU2t6qJ-7p5lwIE4dmvmoFcu0psHF4ayQtKtBGPk6ao57SvpAu6cTAMyR2A72aOgcFrL0VVGv4ZcFzLudTfqw-3tuD1EruchrNtwatJVeKZWWtQknuJfFG7MOdWAxr48odlfqlo=","impact":"medium","tags":["ソロプレナー","AI起業","アクセラレーター","MVP開発"]},{"title":"海外ソロプレナーが「マイクロSaaS」開発で月5万ドルを目指す新潮流","summary":"2026年、海外の一人経営者（ソロプレナー）の間で、顧客の業務を代行するモデルから「狭い課題を解く小さなソフトウェアを自分で作って売る」プロダクト型、すなわちマイクロSaaSへの移行が加速しています。AIによるコーディング支援が開発時間を約50%短縮し、インフラやホスティングは月額数十ドルのサービスが肩代わり、決済もStripeのような基盤を数クリックで組み込めるようになり、個人がプロダクトを立ち上げ月5万ドル（約750万円）の収益に到達する構造が現実味を帯びています。個人開発者は、AIツールと既存のクラウドサービスを組み合わせることで、低コストかつ短期間で収益性の高いSaaSを開発・運用できる新たなビジネスチャンスが広がっています。","source":"ニュース情報","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHpzqOOHSJey9O7-yVuP5lprhnRpLMY2edFhvUJhDW6-CQ2u22pMrVktMO_PVtmT-1SdVslepoGE5jNmVsCM-DAiNx3lQ1VpCeB8WCQcOBZtjIFZvTGFfm5JM9FNP1s95mkRMvj4DyCoQXp","impact":"high","tags":["マイクロSaaS","ソロプレナー","AI開発支援","起業"]},{"title":"ヘッドレスCMS「microCMS」がノーコードWeb制作「Studio」と連携","summary":"ヘッドレスCMS「microCMS」を提供するmicroCMSは、ノーコードのWeb制作プラットフォーム「Studio」との機能連携に対応したと発表しました。これにより、microCMSで管理する記事、導入事例、採用情報などのコンテンツを、Studioで制作したWebサイト上に表示・活用できるようになります。Studioのデザインエディタ上でAPI認証情報とエンドポイントを設定するだけで連携が完了し、microCMSで追加・     var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
