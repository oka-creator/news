<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年9月17日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年9月17日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"ChatGPT共同開発者がLLMとは異なる高速・低コストAIモデル「Jev」を発表","summary":"ChatGPTの共同開発者であるディオゴ・アルメイダ氏がCEOを務めるTypeSafe AIが、既存のLLMとは根本的に異なるアプローチでタスクを解決するAIモデル「Jev」を発表しました。Jevはテキスト生成を目的とせず、事前に定義された構造に従って成果物を一度に出力するため、LLMに比べて20～200倍高速で、コストも40～400分の1に抑えられるのが特徴です。特に、入力100万トークンあたりの料金は0.042ドルと非常に安価であり、GPT-5.6 Terraと同等の品質でタスクを実行できるとされています。この技術は、開発者がAIを活用する際のコストと速度のボトルネックを解消し、新たなAIアプリケーションの可能性を広げるでしょう。","source":"GIGAZINE","url":"https://gigazine.net/news/20260917-chatgpt-co-developer-jev-ai-model/","impact":"high","tags":["AIモデル","LLM代替","高速AI"]},{"title":"OpenAIがAIエージェント構築・実行のための「Agents API」を発表","summary":"OpenAIは9月10日、クラウド上でAIエージェントを構築・実行するための「Agents API」を発表しました。このAPIにより、開発者はCodexのエージェント実行基盤をマネージドサービスとして利用できるようになります。OpenAIが提供するサンドボックス環境で長時間タスクやツール利用、サブエージェントによる並列処理などを扱えるため、AIエージェントの本格運用における実行環境や権限管理、長時間ジョブの管理といったアプリケーション側の負担が大幅に軽減される可能性があります。これにより、開発者はより複雑で実用的なAIエージェントを容易に構築・デプロイできるようになり、AI活用の幅が大きく広がるでしょう。","source":"Zenn","url":"https://zenn.dev/news/20260911-it-news-summary-ai-agents","impact":"high","tags":["OpenAI","AIエージェント","API"]},{"title":"macOS 27にローカルLLM「fmコマンド」が標準搭載","summary":"Appleの最新OSであるmacOS 27には、Appleの言語モデルをTerminalから直接使える「fm」コマンドが標準で搭載されました。これにより、追加アプリやAPIキーなしで、Terminalから直接AIとの会話や質問応答、さらには画像入力まで可能になります。搭載モデルは「AFM 3 Core Advanced」で、8,192トークンのコンテキスト長に対応しており、ローカル環境でのAI活用がOSレベルで統合されるという点で実用面で大きな進歩を示しています。開発者は、ローカル環境でセキュアかつ高速にAIを利用できるようになり、新たなアプリケーション開発や既存ワークフローへのAI統合が容易になるでしょう。","source":"Qiita","url":"https://qiita.com/articles/20260917-macos-27-local-llm","impact":"high","tags":["macOS","ローカルLLM","Apple AI"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"20代エンジニア向けAIハッカソン「AI HACK 2026」第2回が開催","summary":"FlashLabs株式会社は、2026年9月19日から9月23日までの5日間、20代エンジニアを対象としたAIハッカソン「AI HACK 2026」の第2回を開催します。賞金最大100万円が用意され、参加者全員には3,000円分のAIクレジットが提供されるため、AIプロダクトをゼロから作り切る絶好の機会です。LLM活用、AI×業務自動化、AI×新規プロダクトといったテーマが想定されており、個人開発者やインディーハッカーがAIを活用したプロダクト開発に挑戦し、スキルアップやネットワーキングを図る貴重な場となるでしょう。","source":"PR TIMES","url":"https://prtimes.jp/main/html/rd/p/000000001.000000000.html","impact":"medium","tags":["AIハッカソン","個人開発","エンジニアイベント"]},{"title":"AIによる開発効率が劇的に向上、1年かかるアプリ開発が1週間（実働16時間）に短縮される事例も","summary":"2026年のシステム開発現場では、AIによる超高速開発が現実のものとなり、米Anthropic社の「Claude Fable 5」などの高度なAIモデルを活用することで、従来ならエンジニア3人で1年を要したアプリ開発が、わずか1週間（実働16時間）で完了した事例が報告されています。この事例では、1万件を超える多言語解説文の生成から、ゲーム機能の実装、アプリ公開までをAIが主導したとされています。個人開発者もAIを効果的に活用することで、開発期間の大幅な短縮とアウトプットの最大化が期待でき、少人数での大規模プロジェクト実現の可能性が広がります。","source":"【2026年09月03日】AIで開発が1年→16時間に！2026年最新インフラと業務システムの限界","url":"https://example.com/ai-dev-speed-up-20260903","impact":"high","tags":["AI駆動開発","開発効率化","高速開発"]},{"title":"AI駆動開発が「単なる効率化ツール」から「不可欠なインフラ」へ進化","summary":"2026年9月現在、AI駆動開発（AIDD）は、単なる効率化ツールとしての段階を脱し、組織構造やエンジニアの職能定義、品質保証のあり方そのものを変容させています。AIなしではタスクに取り組むことを拒否する開発者が3〜5割に達しており、AIがもはや開発者の思考における不可欠なインフラとなっていることを示唆しています。開発生産性が数え方次第で最大33倍に達する極端な事例も報告されており、個人開発者もAIを前提とした開発プロセスやスキルセットの習得が、今後の競争力を左右する重要な要素となっています。AIを使いこなすことが、現代のエンジニアにとって必須の能力となりつつあると言えるでしょう。","source":"【2026年09月05日】生産性33倍の衝撃！AI抜きは拒否？2026年エンジニア生存の鍵「FDE」","url":"https://example.com/ai-dev-infrastructure-20260905","impact":"high","tags":["AI駆動開発","エンジニアスキル","生産性向上"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Microsoftが2026年9月の月例パッチで974件の脆弱性を修正","summary":"Microsoftは2026年9月の月例パッチで、974件もの脆弱性を修正したと発表しました。この中には、110件を超える緊急（Critical）レベルの脆弱性が含まれており、特にWindows ALPCのヒープバッファオーバーフロー（CVE-2026-85880）など、すでに実環境での悪用が確認されているものも存在します。米連邦政府機関には9月17日までの適用が義務付けられるなど、サイバーセキュリティ対策の重要性が改めて浮き彫りになっています。開発者は、自身のアプリケーションが依存するシステムやライブラリのセキュリティパッチ適用状況を常に確認し、最新の状態に保つことが不可欠です。","source":"Qiita","url":"https://qiita.com/articles/20260916-security-news-microsoft-patch","impact":"high","tags":["セキュリティ","Microsoft","脆弱性"]},{"title":"セブン‐イレブン・ジャパンが「リマニ（リマニュファクチャリング）キュービクル」の運用を開始","summary":"セブン‐イレブン・ジャパンは9月15日、伊藤忠プランテック、パナソニック エレクトリックワークスと連携し、店舗の高圧受電設備（キュービクル）を再構築して新品同様の状態で再活用する「リマニキュービクル」の運用を開始しました。これにより、店舗の建て替えや閉店に伴い撤去されたキュービクルから活用可能な部品を取り出し、新店舗の仕様に合わせて再構築・再設置することで、資源の有効活用と環境負荷低減を図ります。また、資源価格の変動や部材調達リスクに対し、新品調達だけに依存しない安定的な設備運用モデルの確立を目指しており、持続可能なサプライチェーン構築への一歩となります。","source":"流通ニュース","url":"https://ryutsuu.biz/strategy/s091549.html","impact":"low","tags":["サステナビリティ","リサイクル","環境技術"]},{"title":"神戸市がオープンソースLLMアプリ開発プラットフォーム「Dify」で生成AI基盤「KOBE AI PORT」を構築","summary":"神戸市は2026年4月、Microsoft Copilotの活用で直面した自治体特有のネットワーク環境や機密情報扱いの課題を解決するため、オープンソースのLLMアプリ開発プラットフォーム「Dify」を活用した生成AI基盤「KOBE AI PORT」を構築しました。導入後わずか2カ月で利用者の9割が業務効率化を実感し、業務品質向上や心理的安全性の確保といった効果も現れています。これにより、インターネットから切り離された行政専用ネットワーク（LGWAN）環境でも、安全かつセキュアに生成AIを活用できる具体的なソリューションが示され、他の自治体や機密性を要する組織におけるAI導入のモデルケースとなるでしょう。","source":"神戸市、Copilotの弱点を「Dify」でどう解決？ あえて自前でAI環境を構築した理由","url":"https://example.com/kobe-ai-port-dify-lgwan","impact":"medium","tags":["自治体AI","Dify","オープンソース"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
