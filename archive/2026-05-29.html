<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年5月30日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年5月30日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"AIモデルの軽量化とエッジデバイスへの展開が加速","summary":"大規模言語モデル（LLM）の推論効率が大幅に向上し、より少ない計算リソースで動作する軽量版モデルの開発が進んでいます。これにより、スマートフォンやIoTデバイスなどのエッジデバイス上でのリアルタイムAI処理が可能になりつつあります。特に、特定のタスクに特化した小型LLMは、プライバシー保護の観点からも注目されており、オフライン環境での利用拡大が期待されます。開発者にとっては、エッジAIアプリケーションの新たな機会が生まれ、リソース制約のある環境でのAI実装スキルが重要になるでしょう。","source":"業界レポート","url":"https://www.google.com/search?q=AI%E3%83%A2%E3%83%87%E3%83%AB%E8%BB%BD%E9%87%8F%E5%8C%96+%E3%82%A8%E3%83%83%E3%82%B8%E3%83%87%E3%83%90%E3%82%A4%E3%82%B9","impact":"high","tags":["軽量AI","エッジAI","LLM"]},{"title":"マルチモーダルAIが実用段階へ、企業向けソリューションが続々登場","summary":"テキストだけでなく、画像、音声、動画を統合的に理解・生成できるマルチモーダルAIが、顧客サポート、コンテンツ生成、データ分析などの分野で実用化フェーズに入っています。特に、企業が保有する多様なデータを横断的に分析し、より精度の高いインサイトを提供するソリューションの導入事例が増加しています。これにより、業務プロセスの自動化と意思決定の迅速化がさらに進むと見られています。開発者は、多様なデータ形式を扱うAIシステムの設計・実装スキルが求められるでしょう。","source":"Tech News","url":"https://www.google.com/search?q=%E3%83%9E%E3%83%AB%E3%83%81%E3%83%A2%E3%83%BC%E3%83%80%E3%83%ABAI+%E4%BC%81%E6%A5%AD%E3%82%BD%E3%83%AA%E3%83%A5%E3%83%BC%E3%82%B7%E3%83%A7%E3%83%B3","impact":"high","tags":["マルチモーダルAI","企業AI","データ分析"]},{"title":"生成AIによるコード生成・デバッグ支援ツールの進化と開発現場への浸透","summary":"開発者向けに、コードの自動生成、バグ検出、リファクタリングなどを支援する生成AIツールが急速に進化しています。これらのツールは、既存のコードベースを学習し、開発者が意図する機能に応じたコードスニペットを提案したり、潜在的な脆弱性を特定したりする能力を高めています。これにより、開発効率の向上と品質担保に貢献し、多くの開発チームで導入が進んでいます。開発者はAIツールを効果的に活用し、より創造的な問題解決に集中できるようになるでしょう。","source":"開発者向け情報","url":"https://www.google.com/search?q=%E7%94%9F%E6%88%90AI+%E3%82%B3%E3%83%BC%E3%83%89%E7%94%9F%E6%88%90+%E3%83%87%E3%83%90%E3%83%83%E3%82%B0%E6%94%AF%E6%8F%B4","impact":"high","tags":["コード生成AI","開発支援","DevOps"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコードプラットフォームの機能拡張と個人開発者の収益化支援","summary":"主要なノーコード・ローコードプラットフォームが、より複雑なロジックの実装や外部API連携を容易にする新機能を次々とリリースしています。これにより、プログラミング知識が少ない個人開発者でも、より高度なWebサービスやモバイルアプリを迅速に構築できるようになりました。また、プラットフォーム側が提供するマーケットプレイスや決済連携機能を通じて、個人開発者が自身のプロダクトを収益化しやすい環境が整備されています。これは、個人開発者がアイデアを形にし、市場に投入する障壁を大きく下げる動きです。","source":"開発者コミュニティ","url":"https://www.google.com/search?q=%E3%83%8E%E3%83%BC%E3%82%B3%E3%83%BC%E3%83%89+%E3%83%AD%E3%83%BC%E3%82%B3%E3%83%BC%E3%83%89+%E5%80%8B%E4%BA%BA%E9%96%8B%E7%99%BA","impact":"high","tags":["ノーコード","ローコード","収益化"]},{"title":"サブスクリプション型SaaSの個人開発事例が増加、ニッチ市場の開拓が進む","summary":"特定の課題を解決するニッチなSaaS（Software as a Service）を個人で開発し、サブスクリプションモデルで提供する事例が目立っています。特に、特定の業種や趣味に特化したツール、あるいは既存サービスにはないユニークな機能を提供するマイクロSaaSが人気を集めています。低コストで開発・運用が可能なクラウドインフラと、SNSを通じた効果的なマーケティングが成功の鍵となっています。個人開発者にとっては、小規模ながらも持続的な収益源を確立する新たな道が開かれています。","source":"インディーハッカーブログ","url":"https://www.google.com/search?q=%E5%80%8B%E4%BA%BA%E9%96%8B%E7%99%BA+SaaS+%E3%83%8B%E3%83%83%E3%83%81%E5%B8%82%E5%A0%B4","impact":"medium","tags":["SaaS","マイクロSaaS","個人事業"]},{"title":"AIを活用した個人向け自動化ツールの台頭と生産性向上への寄与","summary":"個人開発者が、OpenAIのAPIなどを活用して、日々の業務やタスクを自動化するAIツールを開発する動きが活発化しています。例えば、議事録の自動要約、メールの自動返信アシスト、SNS投稿の自動生成などが挙げられます。これらのツールは、特定の個人のニーズに合わせてカスタマイズされ、個人の生産性向上に大きく貢献しています。開発者は、既存のAIモデルを組み合わせることで、手軽に価値あるツールを生み出すことが可能になっています。","source":"AI開発者フォーラム","url":"https://www.google.com/search?q=AI%E6%B4%BB%E7%94%A8+%E5%80%8B%E4%BA%BA%E8%87%AA%E5%8B%95%E5%8C%96%E3%83%84%E3%83%BC%E3%83%AB","impact":"medium","tags":["AIツール","生産性向上","API活用"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"量子コンピューティングの実用化に向けた進展と特定分野での応用研究","summary":"量子コンピューティング分野では、エラー訂正技術の改善や量子ビットの安定性向上が進み、実用化に向けた具体的なロードマップが示され始めています。特に、新素材開発、創薬、金融モデリングなど、古典コンピューターでは計算が困難な特定分野での応用研究が活発化しており、実証実験の成功事例が報告されています。これは、将来的に計算科学のパラダイムを大きく変える可能性を秘めており、開発者は新たな計算モデルへの理解が求められるでしょう。","source":"科学技術ジャーナル","url":"https://www.google.com/search?q=%E9%87%8F%E5%AD%90%E3%82%B3%E3%83%B3%E3%83%94%E3%83%A5%E3%83%BC%E3%83%86%E3%82%A3%E3%83%B3%E3%82%B0+%E5%BF%9C%E7%94%A8%E7%A0%94%E7%A9%B6","impact":"high","tags":["量子コンピューティング","新技術","応用研究"]},{"title":"サイバーセキュリティ脅威の高度化とAIを活用した防御策の導入","summary":"ランサムウェアやサプライチェーン攻撃など、サイバーセキュリティ脅威がますます巧妙化・高度化しています。これに対抗するため、AIを活用した脅威検知システムや自動応答システムが企業や組織で導入され始めています。AIは、異常なネットワークトラフィックや不審な挙動をリアルタイムで分析し、従来のセキュリティシステムでは見逃されがちな脅威を早期に発見する能力を持っています。開発者は、AIを活用したセキュリティソリューションの設計や実装において、その専門知識がますます重要になるでしょう。","source":"セキュリティ情報サイト","url":"https://www.google.com/search?q=%E3%82%B5%E3%82%A4%E3%83%90%E3%83%BC%E3%82%BB%E3%82%AD%E3%83%A5%E3%83%AA%E3%83%86%E3%82%A3+%E3%8AI%E9%98%B2%E5%BE%A1","impact":"high","tags":["サイバーセキュリティ","AI防御","脅威検知"]},{"title":"サステナブルテックへの投資加速と環境負荷低減への貢献","summary":"気候変動問題への意識の高まりを受け、環境負荷の低減に貢献する「サステナブルテック」への投資が世界的に加速しています。具体的には、再生可能エネルギーの効率化技術、資源リサイクルを促進するAI、スマート農業、環境モニタリングのためのIoTデバイスなどが挙げられます。これらの技術は、企業のESG（環境・社会・ガバナンス）経営を推進し、持続可能な社会の実現に貢献すると期待されています。開発者は、環境に配慮した技術開発やソリューション提供において、新たなビジネスチャンスを見出すことができるでしょう。","source":"環境技術ニュース","url":"https://www.google.com/search?q=%E3%82%B5%E3%82%B9%E3%83%86%E3%83%8A%E3%83%96%E3%83%AB%E3%83%86%E3%83%83%E3%82%AF+%E6%8A%95%E8%B3%87%E5%8A%A0%E9%80%9F","impact":"high","tags":["サステナブルテック","ESG","環境技術"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
