<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年7月22日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年7月22日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"GoogleがGeminiの新モデル「Flash」シリーズを発表、開発者向けに提供開始","summary":"米Googleは、AIモデルの最新版として「Gemini 3.6 Flash」「Gemini 3.5 Flash-Lite」「Gemini 3.5 Flash Cyber」を発表しました。これらのモデルは同日より開発者向けAPIやGeminiアプリを通じて提供が開始されています。特に「3.5 Flash-Lite」はGoogle検索への順次展開も予定されており、広範な影響が期待されます。これらのモデルは、AIエージェントの構築や運用における処理効率、応答スピード、コスト削減の要求に対応するために開発されました。開発者にとっては、より効率的で高速なAIアプリケーションの構築が可能となるでしょう。","source":"ケータイ Watch","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEB0i5t5Ta5P7ELaRpxs6zIK0EljZmmyj6J8otNvblNNHf4bjYU-ShQ69Pz63dzTi41G-kbY0tBgDx8wTFxXZVJnXrOzHpusIwOqNWA0P7MAmiIFs7quy9m-SFzYMXiKxyGWKkcMiKAvNnTDXU988R-em0=","impact":"high","tags":["生成AI","LLM","Google Gemini","開発者向けAPI"]},{"title":"OpenAIがGPT-5.6ファミリーをリリース、エージェント向け「ultra」モードで効率向上","summary":"OpenAIは、新モデルファミリー「GPT-5.6」（Sol/Terra/Luna）を一般公開しました。特に「Sol」モデルには、処理をより深く行い、サブモデルへ作業を委譲する「ultra」モードが追加されています。この新モードにより、エージェント的なコーディングタスクにおいてトークン効率が約54%改善したと報告されています。また、同モデルは「これまでで最も強力なサイバーセキュリティモデル」と位置づけられており、セキュリティ分野での応用も期待されます。これはAIエージェント開発者にとって大きな進歩となるでしょう。","source":"Qiita","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQE-YDX1R3NIvzfZr6kc-uX5zU7NU1JFEf0tWje2edGiA4ygBTe2hX2T55XfN_FYrDsa0E_s4jJz_ZtpZ6L_-39l8LiXd9xZZIHFftsu9zvS4Js7B3BBfSmnMZ4PL4HpaVJgGYP5QkFKcLl1fyIDiEPpHkjpfw==","impact":"high","tags":["OpenAI","GPT-5.6","AIエージェント","サイバーセキュリティ"]},{"title":"国内大手44社が出資する「Noetra」が始動、国産フィジカルAI開発を推進","summary":"ソフトバンク、ソニーグループ、ホンダなど国内大手44社が出資する新会社「Noetra（ノエトラ）」が本格始動しました。同社は、リアルなモノを動かす「フィジカルAI」の社会実装を強力に推進することを目的としています。NVIDIAの高度な計算基盤を活用し、ロボットの視覚認識や物理特性、複雑な制御を統合処理できるマルチモーダル基盤モデルの開発を目指します。ファナック、安川電機、川崎重工といったFAロボット大手とも共同検討を開始しており、少子高齢化・人手不足の解決策として大きな期待が寄せられています。","source":"オートメーション新聞","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQG1uvAB6iN779wQexHRw1qpbG1vruDF9yojx-45LV6XcRA2C8WDrHk3xF-FnCSbHtmQDWljqqfPPEFXdCDOIZDSAeA7fo6va_vJJeS-x0H152_CU7IBJrWGyuKu2Vf-h0GHWW6lqCTbWA==","impact":"high","tags":["フィジカルAI","ロボット","国産AI","Noetra"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"個人開発ゲーム『Slow Summit』のSteamストアページが公開、協力プレイで山の旅へ","summary":"個人開発者のurytobits氏が、開発中のアウトドアアクティビティゲーム『Slow Summit』のSteamストアページを公開しました。本作は、美しいローポリゴンの世界で、友達と一緒にのんびりと山頂を目指す協力型ゲームです。ひとりで気ままにハイキングするだけでなく、最大5人のオンライン協力プレイに対応しています。道中ではスタミナ管理が必要となり、休憩所ではアイテム交換や料理、釣り、凧揚げなどの寄り道も楽しめます。このゲームは、リラックスした体験を求めるプレイヤーに魅力的でしょう。","source":"Game*Spark","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHOUZl6Icg7TI7O9Th2s4AhQ3VcIpv7sjHUK8ag0ROVmD4Qm8p_rIGAqOCb7hoqAOpIv9Qclz-4SVffFQPSuduKtb_-b4M03OvqKlsFZISfEJkbVBCjS1UqfNyddOlDB8jx0OjBG0EvEQ==","impact":"medium","tags":["個人開発ゲーム","Steam","協力プレイ","インディーゲーム"]},{"title":"個人開発ホラーコメディゲーム『100均除霊師』が11月12日に発売決定","summary":"個人ゲーム開発者のAlleyInn氏は、PC（Steam）向けサバイバルホラーコメディゲーム『100均除霊師』を2026年11月12日に発売すると発表しました。本作は、学校に取り憑いた悪霊を100均グッズで「お掃除」する短編ホラーゲームです。正しい手順で悪霊を清掃することもできますが、面倒な調査を省いて支給品を悪霊に投げつける「脳筋プレイ」も可能というユニークな内容です。この斬新なゲームプレイは、多くのプレイヤーの注目を集めることでしょう。","source":"電ファミニコゲーマー","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHiFS7L-RlO2Zf48Z5C9YtIKhTfWBypCIT-rjc3VLu7sNJtMbGFBncA3NK5EUZZECA5ilb9c5ShLlCQ7VH7awfAmWi-IjEo69L6O16E2ZP9dVKODrUqzI-lvzVjSsxXnpGPYxZSvSGhMw==","impact":"medium","tags":["ホラーコメディ","個人開発ゲーム","Steam","ユニークゲーム"]},{"title":"大企業社員のスタートアップ越境支援プログラム「side project」が活発化","summary":"株式会社ローンディールが提供する社外兼務型越境プログラム「side project」の第8期が始動し、KDDIを含む大企業8社から34名が参加しました。このプログラムでは、26名がスタートアップ20社にマッチングされ、AI活用による事業変革推進や経営管理体制の設計など、多岐にわたるプロジェクトに業務時間の約20%を割いて参画しています。これにより、大企業人材の新たな知見獲得とスタートアップの事業成長支援が図られています。この取り組みは、日本のイノベーションエコシステムを活性化させる重要な役割を担っています。","source":"PR TIMES, Biz/Zine","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGasG7lukrecgGlbPxZQiucf3CIBVC4ZRixw3hLfjDKhS-OIIq34QM3DAk4LqMhxp5pJ7ig3VxbdPXNGF_r7c0la_vP75e9FeQ86AkTLbrGNyggrJiNcyDG5wZz88171KLLwzCcOyG4Os7vmT-xjG_KnL9eZw==","impact":"medium","tags":["スタートアップ支援","越境学習","人材育成","イノベーション"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"AMDがTSMC 2nm採用の次世代サーバー向けプロセッサ「EPYC Venice」を発表へ","summary":"AMDは、2026年7月22日から23日にサンフランシスコで開催される「Advancing AI 2026」イベントにおいて、次世代サーバー向けプロセッサ「EPYC Venice」を商用発表する予定です。この「Venice」はTSMCの2ナノメートル（nm）プロセス「N2」で量産段階に入った、業界初のハイパフォーマンスコンピューティング（HPC）向けチップとなります。最大256コアを搭載するとされており、データセンターやAIワークロードにおける性能が飛躍的に向上することが期待されます。これは半導体業界における重要なマイルストーンとなるでしょう。","source":"ASCII.jp, Phemex","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFRa_xObaAMZpLrtww2JZaPeLv5Kj1CoBgCnZYf9X7hR1vsNfRr8V9uO_wlYz1IWgmWcbVlKIBrAhcRdnwERut2r_-4_mV_fuSkmRruUurjjqJGsZ2O15N5a-ZFinS8pAmrPPCjSZrQjgo32uPsJh4=","impact":"high","tags":["AMD","EPYC","2nmプロセス","HPC","サーバープロセッサ"]},{"title":"日本国内のメインフレーム市場が大きな転換期、富士通・日立などが撤退方針","summary":"日本国内のメインフレーム市場が、富士通、日立製作所、BIPROGYといった主要企業の事業撤退方針公表により、大きな転換点を迎えています。富士通は2035年までに、日立製作所はメインフレーム向けOSの販売・保守を終了する方針を表明しました。これにより、多くの日本企業にとってレガシーシステムの刷新が喫緊の課題となっています。この動きは、クラウド移行やオープンシステムへのシフトを加速させる要因となるでしょう。","source":"ITmedia","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHRwsjp2LlZj6hVpxpNMtYuLQRYO383UVYQ_SXpVNR_W_ExcQmwzEXPjztHgN1awYFEP0pzeMYBGR8IX7OrmA7dYe_fPV_hdbacxkSriKw7N8yUg-T-6pOp_TqYOYWCxNosT35Nkk2M91DYcG-deP1CVf40y_5_fMneOQ==","impact":"high","tags":["メインフレーム","レガシーシステム","ITインフラ","日本市場"]},{"title":"改正個人情報保護法が公布、AI開発におけるデータ利活用に同意特例を新設","summary":"「個人情報の保護に関する法律等の一部を改正する法律」（改正個人情報保護法）が7月17日に公布され、政令で定める2年以内に施行されることになりました。この改正では、AI開発などのデータ利活用を目的とする場合に限り、本人の同意なしで個人データの第三者提供を可能にする特例が新設されています。一方で、重大な違反に対する課徴金制度の導入や、16歳未満の個人情報、顔認証データなどの保護に関する規制強化も盛り込まれています。この法改正は、AI開発の促進とプライバシー保護のバランスを再定義する重要な一歩となります。","source":"Web担当者Forum","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQG8cNZ2QOchJDT9haagLtg1ew0Li7iLE7nD3hr_jhDiBJvFsC9Ystab-xMmlEmzGxSXa-jXC6At48a6jQwoO8JCNnWCsC9Or5taGHP6z3hZy_s_mjDcab42TXH3XE4HB3HqWJvvEdbcWT4=","impact":"high","tags":["個人情報保護法","AI開発","データ利活用","法改正","プライバシー"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
