<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年7月1日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年7月1日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"ソフトバンク傘下のSB Intuitionsが国産LLM「Sarashina3」シリーズを提供開始","summary":"ソフトバンク傘下のSB Intuitionsが、高品質な日本語出力に特化した国産大規模言語モデル「Sarashina3シリーズ」の提供を開始しました。標準モデル「Sarashina3 mini」はエージェント機能やコード生成能力を備え、日本語対話やコーディングのベンチマークで性能が向上し、他社モデルと同等とされています。ビジネスシーンで日本語に特化した高精度なLLM活用を検討する企業は、国内データセンターで運用されるクラウドサービス「Cloud PF Type A」を通じてセキュアに利用できる点が大きなメリットです。この動きは、国内における生成AI技術の競争を加速させ、日本市場に特化したAIソリューションの選択肢を広げるものとして重要です。開発者にとっては、日本語に特化した高性能なLLMをセキュアな環境で利用できる新たな選択肢となります。","source":"SB Intuitions","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQE1tAZIs-xu_VYgIXwxBbEBOxwAVaKkmxXwwSE_ayxwwL21vwmzML2tpzMBUg96pJFWOVAl4rAmRhXuHq0FqwUd3TE0FwwNyS48PMF5NzgAKs_PZYj2qDzisbFJhCognN4g7lxWI2BqbeoGpcCyWhZEbhZ5SkMIZw==","impact":"high","tags":["国産LLM","生成AI","日本語特化"]},{"title":"Wix傘下のアプリ開発プラットフォームBase44が独自開発LLM「Base 1」の提供開始","summary":"Webサイト制作プラットフォームWix傘下のBase44が、独自開発の大規模言語モデル「Base 1」の提供を開始しました。このLLMは、Base44プラットフォーム上で生成された数千万件のユーザー操作記録をもとに最適化されており、競争力のある性能を発揮します。専門的なプログラミング知識がないユーザーでも、現場のアイデアを実用的なアプリに変えられる体験の質が向上し、開発者にとってはノーコード・ローコード開発の可能性を広げます。また、自社モデル保有によりコンピューティングコストを直接管理できるため、長期的な収益性改善に繋がる可能性があります。これは、AIを活用したアプリ開発の民主化を加速させる重要な動きです。","source":"Base44","url":"https://prtimes.jp/main/html/rd/p/000000071.000025208.html","impact":"medium","tags":["LLM","ノーコード","アプリ開発"]},{"title":"NTTドコモビジネスが生成AIを活用した自動応答ボイスボットサービス「docomo business ANCAR® Voice」を提供開始","summary":"NTTドコモビジネスは、生成AIを組み込んだ高度な自動応答を実現するボイスボットサービス「docomo business ANCAR® Voice」の提供を開始しました。Web管理画面から業務・業界に特化したテンプレートを選択するだけで利用でき、主要CRM/SaaSとの連携により、AIで応対内容を情報連携しタスク完了までをスムーズに実現します。個社ごとのSI構築が不要で、既存のCRMやSaaSと連携できるため、企業の顧客対応業務の効率化と品質向上に大きく貢献します。これは、顧客サービスにおけるAI活用の新たな標準を提示し、開発者にとっては既存システムとの連携を考慮したAIソリューションの設計が重要になることを示唆しています。","source":"NTTドコモビジネス","url":"https://www.docomo.biz/news/2026/0630_01/","impact":"medium","tags":["ボイスボット","顧客対応AI","SaaS連携"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"StartPass、IVS2026サイドイベントで「事前接続型マッチング！会いたい相手に面談が組める成果直結イベント」を開催","summary":"株式会社StartPassは、東京都のスタートアップ支援拠点「NEXs Tokyo」と共同で、国内最大級のスタートアップカンファレンス「IVS2026」のサイドイベントを京都で7月2日に開催します。このイベントでは、起業家、投資家、事業会社、先輩起業家、専門家との面談を事前にマッチングする仕組みが提供されます。偶発的な出会いではなく、事前ヒアリングに基づいて「本当に会うべき相手」との面談を設計するため、資金調達、協業、採用、事業成長に直結する成果が期待できます。AIネイティブCRM「Frictio」を活用し、壁打ち内容の自動構造化・蓄積で次のアクションにつなげるため、個人開発者やスタートアップは効率的に人脈を構築し、事業を加速させる貴重な機会となるでしょう。","source":"StartPass","url":"https://prtimes.jp/main/html/rd/p/000000018.000085189.html","impact":"high","tags":["スタートアップ","資金調達","ネットワーキング"]},{"title":"AZOO代表・横田氏、IVS2026公式サイドイベントに登壇 ― ホテル運営AI化の実践知をもとに「AI時代のSaaS」を議論","summary":"ホテル向けAIソフトウェア「WASIMIL」を提供する株式会社AZOOの代表取締役である横田裕子氏が、7月2日に京都で開催されるIVS2026の公式サイドイベント「Beyond Software」に登壇します。このイベントでは、AI時代におけるSoftware/SaaSの進化とその在り方について議論が行われる予定です。ホテル運営のAI化による人手不足解消と高品質な運営モデル構築の実践知が共有されるため、AIを活用したSaaS開発や事業展開を検討している個人開発者にとって、具体的な成功事例や課題解決のヒントを得る貴重な機会となります。AIとSaaSの融合がもたらすビジネスチャンスと課題を深く理解する上で重要な情報源です。","source":"AZOO","url":"https://prtimes.jp/main/html/rd/p/000000009.000091392.html","impact":"medium","tags":["SaaS","AI活用","ホテルテック"]},{"title":"Indie Hacker NewsがAIによるRAM枯渇とAppleのMac価格引き上げ、GPT-5.6の制限を報告","summary":"Indiehacker.newsの6月26日号では、AIデータセンターによるDRAM供給の枯渇が、AppleのMac全製品の価格引き上げに繋がったこと、そしてホワイトハウスがGPT-5.6の顧客利用を制限したことなど、インディーハッカーが注目すべきテック動向が報じられました。この情報は、AI開発や関連ハードウェアのコスト高騰がプロダクト開発に与える影響を明確に示しています。また、大手AIモデルの利用制限は、今後の個人開発における戦略立案に大きな影響を与える可能性があります。インディーハッカーは、これらの市場動向を把握し、事業戦略を立てる上で考慮する必要があるでしょう。","source":"Indie Hacker News","url":"https://www.indiehacker.news/editions/086","impact":"high","tags":["ハードウェアコスト","AI規制","市場動向"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Samsung、SK hynix、MicronがRAM価格吊り上げで米国で提訴される","summary":"世界3大メモリメーカーであるSamsung Electronics、SK hynix、Micronが、DRAM供給を制限し、AIメモリへのシフトを促すことでRAM価格を吊り上げたとして、米国の連邦集団訴訟で提訴されました。この訴訟は、2022年10月26日以降にDRAMまたはDRAMを搭載したデバイスを購入した数百万の消費者や企業を代表するものです。AIブームがメモリ価格に与える影響や、それが消費者や企業にどのように波及しているかを示す重要な事例であり、半導体サプライチェーンにおける価格操作のリスクとそれが最終製品のコストに与える影響を理解する上で重要です。開発者にとっては、ハードウェアコストの変動がプロダクトの価格設定や開発予算に影響を与える可能性を考慮する必要があります。","source":"Tech-ish","url":"https://tech-ish.com/2026/06/30/samsung-sk-hynix-and-micron-sued-in-the-us-for-colluding-to-inflate-ram-prices/","impact":"high","tags":["半導体","DRAM価格","集団訴訟"]},{"title":"ソニーグループ、アドバンストテクノロジーとソニーリサーチを統合し「コーポレートテクノロジーセンター」を新設","summary":"ソニーグループは2026年7月1日付で組織変更を行い、デジタル&amp;テクノロジープラットフォーム内のアドバンストテクノロジーと株式会社ソニーリサーチを統合し、「コーポレートテクノロジーセンター」を新設することを発表しました。この組織再編は、ソニーグループが先端技術の研究開発を加速させ、グループ全体の技術戦略を強化する狙いがあると考えられます。今後のイノベーション創出や、同社の技術開発の方向性に注目が集まるでしょう。これは、大手企業が技術競争力を維持・向上させるための戦略的な動きであり、開発者にとってはソニーの今後の技術ロードマップや提携機会を探る上で重要な情報となります。","source":"ソニーグループ","url":"https://www.sony.com/ja/SonyInfo/News/Press/202606/26-0630/","impact":"medium","tags":["組織再編","研究開発","先端技術"]},{"title":"NTTドコモビジネス、東芝、NECが国内初となる東名阪約600kmの広域量子暗号通信ネットワークの構築を開始","summary":"NTTドコモビジネス、東芝、NECの3社は6月30日、東名阪を結ぶ約600kmにおよぶ広域量子暗号通信ネットワークの構築を開始しました。本実証では、国家安全保障に関わる情報や個人情報など、機密性の高いデータを扱う医療、金融、電力業界での社会実装を見据え、量子技術による安全な通信の検証を進めます。これは、将来のサイバー攻撃、特に「Harvest Now, Decrypt Later (HNDL)」攻撃に対する耐性を持つセキュアな通信インフラの構築に向けた重要な一歩です。特に高いセキュリティが求められる分野でのデータ保護に貢献し、開発者にとっては次世代のセキュリティ技術の動向を理解する上で不可欠な情報となります。","source":"NTTドコモビジネス","url":"https://www.nttdocomo.co.jp/biz/news/press/2026/0630/index.html","impact":"high","tags":["量子暗号","通信ネットワーク","セキュリティ"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
