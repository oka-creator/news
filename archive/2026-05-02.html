<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年5月3日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"OpenAIが「GPT-5.5」を発表、GeminiチャットでWordやExcel、PDFファイルなどを生成可能に","summary":"OpenAIは2026年4月23日に最新の大規模言語モデル「GPT-5.5」を発表し、ChatGPTとコーディング支援ツール「Codex」での展開を開始しました。このモデルは有料プランユーザーが利用可能で、Microsoft 365 Copilotへの組み込みも発表されています。GPT-5.5は複雑なコマンドラインワークフローで高い評価を達成し、Webブラウジングや複数ステップタスクの自律遂行能力が大幅に強化されました。これにより、AIが情報源を能動的に探索・検証する精度が向上し、ビジネス情報の検索や意思決定支援に大きく貢献すると期待されます。開発者にとっては、より高度なAIアシスタントや自動化ツールを構築するための基盤が提供され、生産性向上に繋がるでしょう。","source":"OpenAIが「GPT-5.5」を発表／GeminiのチャットでWordやExcel、PDFファイルなどを生成可能に","url":"https://www.google.com/search?q=OpenAI+GPT-5.5+announcement+2026","impact":"high","tags":["生成AI","LLM","OpenAI","GPT-5.5","生産性向上"]},{"title":"Anthropicが「Claude Security」を発表、AIが脆弱性検出からパッチ生成までを全自動化","summary":"Anthropicは2026年5月1日、AIがコードベースの脆弱性スキャンからパッチ生成までをワンストップで自動化する新ツール「Claude Security」のパブリックベータ版を発表しました。このツールは「Claude Opus 4.7」をベースとし、リポジトリ全体をスキャンしてSQLインジェクションなどの脆弱性を検出・修正する能力を持ちます。現時点ではClaude Enterprise顧客のみが利用可能ですが、将来的には個人開発者も利用できるようになる見込みです。これにより、セキュリティ専門家を雇うコストが削減され、開発プロセスの効率化とセキュリティレベルの向上が期待され、開発者にとってはセキュリティ対策の負担が大幅に軽減されるでしょう。","source":"Claude Security発表で開発の常識が変わる｜AIが脆弱性検出→パッチ生成まで全自動｜個人開発者にも降りてくるMaxプラン展開の衝撃【2026年5月最新】｜ひで - note","url":"https://www.google.com/search?q=Anthropic+Claude+Security+announcement+2026","impact":"high","tags":["AIセキュリティ","脆弱性検出","Anthropic","Claude","開発効率化"]},{"title":"Project Prometheusが100億ドルを調達、物理AI（Physical AI）市場が拡大","summary":"ジェフ・ベゾス氏が率いる「Project Prometheus」が2026年4月に追加で100億ドルを調達し、バリュエーションは380億ドルに達しました。この巨額調達により、製造業、物流、建設業など現実世界の物理法則を理解し、ロボット操作や製造ワークフローから学習する「物理AI」分野への注目が急速に高まっています。金融機関のBlackRockとJPMorganも大型参加しており、AIブームがテキスト系AIから物理世界を扱うAIへとシフトする兆候が見られます。これにより、新たな産業変革が期待され、開発者にとってはロボティクスやIoT、産業オートメーション分野での新たなAIアプリケーション開発の機会が拡大するでしょう。","source":"【2026年5月】Prometheus 100億ドル調達｜物理AI市場の全貌 - 株式会社Uravation","url":"https://www.google.com/search?q=Project+Prometheus+100億ドル調達+物理AI+2026","impact":"high","tags":["物理AI","ロボティクス","産業AI","投資","Project Prometheus"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"個人インディー開発者Ivan Konorkin氏、RTSとローグライト要素を組み合わせた新作『Hexroads』Steamストアページを公開","summary":"個人インディーデベロッパーのIvan Konorkin氏は2026年5月1日、リアルタイムストラテジーとローグライト要素を組み合わせた新作ゲーム『Hexroads』のSteamストアページと日本語トレーラーを公開しました。PC(Steam)向けに2026年第4四半期の発売を予定しており、RTSの戦略性とローグライトの繰り返し性を掛け合わせた「ラン型ストラテジー」として、短時間で高密度なプレイ体験を目指しています。この発表は、インディーゲーム開発者がニッチなジャンルを組み合わせることで独自のゲーム体験を創出し、市場に挑戦し続けていることを示しています。他の個人開発者にとっても、ジャンル融合の可能性やSteamプラットフォームの活用事例として参考になるでしょう。","source":"個人インディー開発者Ivan Konorkin氏、RTSとローグライト要素を組み合わせた新作『Hexroads』Steamストアページとトレーラー公開 | gamebiz","url":"https://www.google.com/search?q=Ivan+Konorkin+Hexroads+Steam+2026","impact":"medium","tags":["インディーゲーム","RTS","ローグライト","Steam","ゲーム開発"]},{"title":"インディーゲーム開発者Ushurileo氏、農業経営SLG『アグロ・タイクーン』を2027年にリリース予定と発表","summary":"ブラジルのインディーゲーム開発者Ushurileo氏は2026年5月2日、アイソメトリック・ピクセルアートの農業経営シミュレーションゲーム『Agro Tycoon (アグロ・タイクーン)』を発表しました。2027年のリリースを目指しており、プレイヤーは農業ビジネスのCEOとして初期資金を投資し、重機を操作しながら巨大な農業帝国を築くことを目指します。開発者の家族の物語から生まれたという背景も特徴的で、個人的なインスピレーションがゲーム制作の原動力となっている事例です。この発表は、インディー開発者が多様なテーマでゲームを制作し、独自のストーリーテリングを通じてプレイヤーに訴えかける可能性を示しており、他の個人開発者にも創作意欲を刺激するでしょう。","source":"インディーゲーム開発者のUshurileo、農業経営SLG『アグロ・タイクーン』を2027年にリリース gamebiz","url":"https://www.google.com/search?q=Ushurileo+Agro+Tycoon+2027+release","impact":"low","tags":["インディーゲーム","SLG","ピクセルアート","ゲーム開発","Ushurileo"]},{"title":"HashiCorp創業者のミッチェル・ハシモト氏、「GitHubはもはや真剣に仕事に取り組める場所ではなくなった」と表明し主要プロジェクトを移行","summary":"「Vagrant」や「Terraform」の生みの親であり、HashiCorpの創業者であるミッチェル・ハシモト氏は2026年4月、自身のブログでGitHubが頻繁な不具合により「真剣に仕事に取り組める場所ではない」との認識を示しました。彼は自身の最新プロジェクト「Ghostty」をGitHubから完全に撤退させることを宣言し、この声明は開発者コミュニティの間で大きな反響を呼んでいます。GitHub ActionsやPull Request機能の障害が日常的に発生していることが背景にあり、これは多くの開発者が共有する懸念を代表するものです。この動きは、開発プラットフォームの信頼性がいかに重要であるかを再認識させ、他の開発者にも代替プラットフォームの検討を促す可能性があります。","source":"HashiCorp創業者のミッチェル・ハシモト氏「GitHubはもはや真剣に仕事に取り組める場所ではなくなった」 “決別”宣言に大きな反響 - ITmedia","url":"https://www.google.com/search?q=Mitchell+Hashimoto+GitHub+Ghostty+2026","impact":"high","tags":["GitHub","開発プラットフォーム","ミッチェル・ハシモト","Ghostty","開発ツール"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"RAM不足が深刻化、「RAMageddon Watch」がPCゲーマーやコンソールユーザーに価格上昇を警告","summary":"近年、PCゲーマーにとってRAMの入手が困難になっており、「RAMageddon Watch」は今後数年間、コンソールユーザーを含むRAMやストレージを使用するほぼすべてのテクノロジー製品の価格がさらに上昇する可能性が高いと報じています。この「RAM危機」は、世界のテック製造において重要な役割を果たす機械が倉庫で未使用のままになっていることが一因とされています。この状況は、PCビルドやコンソール購入を検討している消費者だけでなく、ハードウェアを必要とするすべての開発者にとってコスト増に直結する深刻な問題です。開発者は、リソース効率の良いソフトウェア設計をさらに重視する必要があるかもしれません。","source":"RAMageddon Watch (May 2026): The Latest Tech News and Developments Regarding the RAM Crisis - GameRant","url":"https://www.google.com/search?q=RAMageddon+Watch+May+2026+RAM+crisis","impact":"high","tags":["RAM","ハードウェア","半導体不足","PCゲーマー","価格上昇"]},{"title":"WindowsのAI更新が「シリコン別独立配信」へ移行、次世代PCスタックの設計図が明らかに","summary":"Microsoftは2026年4月30日、Intel Copilot+ PC向けにAI画像処理モジュールをシリコン別に単独配信するWindows Update「KB5089871」を公開しました。これは、Windowsのサービス方式が従来のOSバージョンやエディションを軸としたものから、「OSバージョン × シリコンベンダー × コンポーネント × 実行プロバイダー」という多次元マトリクスに基づく「シリコン別配信」へと移行していることを示しています。これにより、AIコンポーネントが年次の機能アップデートを待たずに個別に更新可能となり、AIインフラのモジュール化が進みます。開発者にとっては、特定のハードウェアに最適化されたAI機能をより迅速に活用できるようになり、Windows上でのAIアプリケーション開発に新たな柔軟性をもたらすでしょう。","source":"WindowsのAI更新が「シリコン別独立配信」へ移行——KB5089871が示す次世代PCスタックの設計図 | ebisuda.net","url":"https://www.google.com/search?q=Windows+AI+更新+シリコン別独立配信+2026","impact":"medium","tags":["Windows","AI","Microsoft","Copilot+","OSアップデート"]},{"title":"経済産業大臣、重要インフラ事業者と高性能AIへの対応に関して意見交換を実施","summary":"2026年5月1日、赤澤経済産業大臣は電力、ガス、化学、クレジット、石油分野の重要インフラ事業者と、高性能AIがもたらすサイバーセキュリティ上のリスクと対応について意見交換を実施しました。高性能AIは未知の脆弱性の早期発見に役立つ一方で、悪意ある者に使われた場合、サイバーセキュリティ上のリスクが一気に高まるおそれがあるため、各事業者は「ゼロトラスト」への移行や人材育成を含むさらなる対策を業界全体で進めることが求められています。政府は情報提供や高度人材育成などの支援策に期待を寄せており、開発者にとっては、AIを活用したセキュリティソリューション開発や、AIの悪用を防ぐための倫理的ガイドライン遵守がより重要になるでしょう。","source":"高性能AIへの対応に関して赤澤経済産業大臣が重要インフラ事業者との意見交換を実施しました","url":"https://www.google.com/search?q=経済産業大臣+重要インフラ+高性能AI+意見交換+2026","impact":"high","tags":["AI規制","サイバーセキュリティ","重要インフラ","政府","AI倫理"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
