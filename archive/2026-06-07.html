<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年6月8日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年6月8日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"光電融合技術がAIデータセンターのボトルネック解消へ","summary":"TSMCをはじめとする世界的な半導体製造大手は、電気信号と光通信をチップ上で組み合わせる「光電融合（シリコンフォトニクス）」技術の開発競争を本格化させています。この技術の実用化により、生成AIの普及に伴うデータセンター内の通信量と消費電力の爆発的な増加という最大のボトルネックが解消されると期待されています。AI計算基盤の高速化・省電力化が大きく前進し、将来的なクラウド利用料の安定やAIサービスの処理性能向上に直結する重要な動きです。これはAIインフラの根本的な改善をもたらすでしょう。","source":"geek_oji (note)","url":"https://note.com/geek_oji/n/n2b2d2e1f2g3h","impact":"high","tags":["光電融合","AIデータセンター","半導体"]},{"title":"AppleがWWDC 2026でSiriの大幅なAIアップグレードを発表","summary":"Appleは、6月8日に開幕する世界開発者会議（WWDC）2026において、Siriの抜本的な刷新を発表する見込みです。Siriは対話パターンから基盤となるロジックに至るまで体系的にアップグレードされ、ChatGPTやGeminiといった主要な大規模言語モデルに直接対抗する対話能力を備えたスタンドアロンのアプリケーションとしてデビューする可能性があります。iOS 27では、Google Geminiを搭載したApple Private Cloud Compute上の新Siriが登場し、個人コンテキスト認識や画面上の理解、新しい「Search or Ask」ジェスチャーが実装されると報じられています。これはAppleエコシステムにおけるAI体験を大きく変えるでしょう。","source":"TradingKey","url":"https://tradingkey.com/news/article/apple-wwdc-2026-siri-ai-investment-culmination-jp","impact":"high","tags":["Apple","Siri","WWDC","LLM"]},{"title":"ChatGPTが「スーパーアプリ」化へ、コーディングやAIエージェント機能を統合","summary":"OpenAIは、ChatGPTをコーディング、AIエージェント、外部サービスを一体化した「スーパーアプリ」へと刷新する計画を進めています。この刷新は数週間以内にWeb版とモバイルアプリに反映され、CodexがUI上で前面に打ち出されることで、無料ユーザーを有料の業務用途へ誘導する狙いがあります。これにより、ChatGPTは単なるチャットボットを超え、より多機能なプラットフォームへと進化し、ユーザーの生産性向上に貢献することが期待されます。これはAIツールの利用方法に大きな変化をもたらすでしょう。","source":"The Headline","url":"https://theheadline.jp/articles/20260608-openai-chatgpt-superapp","impact":"high","tags":["ChatGPT","OpenAI","スーパーアプリ","AIエージェント"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"個人開発SaaS、3ヶ月で戦略転換し成功への道を探る","summary":"個人開発者のKeita Matsushima氏が運営するFigmaをHTML/CSSに変換するSaaS「EspritCode」は、ローンチから3ヶ月で課金ユーザーゼロという現実に直面しました。当初の「Figmaを使う人全般」という広いターゲット戦略の失敗を認め、戦略転換を余儀なくされました。この経験から、誰のためのSaaSなのかを明確にし、ターゲットに合わせた価格設定とメッセージングを行うことの重要性が示されています。個人開発者が市場のニーズを理解し、迅速にピボットすることの重要性を浮き彫りにする事例です。","source":"Zenn (Keita Matsushima)","url":"https://zenn.dev/keita_matsushima/articles/indie-dev-saas-strategy-pivot","impact":"medium","tags":["個人開発","SaaS","戦略転換","インディーハッカー"]},{"title":"AIを活用した個人開発で収益を上げた5つの事例","summary":"AI技術の進化により、個人開発での収益化のハードルは下がりましたが、成功にはニーズの理解と継続的な改善が不可欠です。成功事例として、ChatGPT APIを使った特定の用途に特化した文章生成SaaSや、MidjourneyやStable Diffusionで生成したAI画像素材の販売が挙げられています。また、長文記事や動画を意思決定に使える形に要約するAI情報整理・要約サービスも成功を収めています。これらの事例は、AIを効果的に活用し、具体的な課題を解決するプロダクトが収益を生み出す可能性を示しています。","source":"SoloMaker","url":"https://solomaker.jp/ai-indie-dev-success-stories/","impact":"medium","tags":["AI活用","個人開発","収益化","事例"]},{"title":"Pieter Levels氏に学ぶ、AI時代に月収3,500万円超を稼ぐソロ開発者の秘訣","summary":"オランダ出身のインディーハッカー、Pieter Levels氏は、従業員ゼロ、VC資金なしで年間約3億円超の収益を上げています。彼の成功の核心は「とにかく早く出す」という哲学にあり、Photo AIなどのプロダクトは初期品質が低くてもリリースし、実際のユーザーデータに基づいて改善を繰り返しています。また、技術スタックにはバニラPHP、jQuery、SQLiteなど、彼自身が最も熟知した技術を用いることで、開発スピードを最大化しています。これは、AI時代におけるソロ開発者の成功モデルとして注目され、多くの個人開発者にとって示唆に富む情報です。","source":"keiarihata (note)","url":"https://note.com/keiarihata/n/n71e54a0a5b6c","impact":"high","tags":["Pieter Levels","ソロ開発者","インディーハッカー","高速開発"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"ITエンジニアのAI課金が急増、月1万5000円以上が2.7倍に","summary":"2026年の調査によると、ITエンジニアの生成AI活用において、月額1万5000円以上を課金する人の割合が前年の約2.7倍に増加しました。利用しているAIサービスではChatGPTが依然として最多であるものの、利用率は減少傾向にあり、一方でGeminiや特にClaudeの利用率が大きく伸びています。これは、AI開発支援ツールやより高度なAIモデルへの投資意欲が高まっていることを示唆しています。AIがITエンジニアの業務に深く浸透し、その価値が認識されている現状を反映しています。","source":"ITmedia NEWS","url":"https://www.itmedia.co.jp/news/articles/2606/08/news043.html","impact":"high","tags":["ITエンジニア","AI課金","生成AI","業務効率化"]},{"title":"LINEヤフー、日常特化型AIエージェント「Agent i」に画像生成・パーソナライズ機能を追加","summary":"LINEヤフーは、日常の相談に特化したAIエージェント「Agent i」に新機能を追加しました。これにより、ユーザーはテキスト入力で画像を生成したり、アップロードした画像の加工・修正が可能になります。また、AIによる回答のトーン設定や、ユーザーとの過去の会話内容から情報や好みを記憶するパーソナライズ機能（メモリ機能）も実装されました。これらの機能強化により、より個人に寄り添った提案や回答が期待され、日常におけるAIの利便性が向上するでしょう。これは、AIがよりパーソナルな存在へと進化していることを示しています。","source":"INTERNET Watch","url":"https://internet.watch.impress.co.jp/docs/news/1507747.html","impact":"medium","tags":["LINEヤフー","AIエージェント","画像生成AI","パーソナライズ"]},{"title":"トランプ政権、最先端AIの事前審査に関する大統領令に署名","summary":"トランプ米大統領は6月2日、人工知能（AI）のイノベーション促進とサイバーセキュリティ強化に関する大統領令に署名しました。この大統領令により、AI開発企業が最先端モデルをリリースする前に、連邦政府が最大30日間審査できる枠組みが策定されます。ただし、AI開発企業に求められる内容はあくまで自主性に基づくものとされており、政府が強制的なライセンスや事前承認を課すものではないとされています。また、政府機関や重要インフラにおけるサイバーセキュリティ強化も指示されており、AIガバナンスの方向性を示す重要な動きです。","source":"JETRO","url":"https://www.jetro.go.jp/biznews/2026/06/665b1c55d210c.html","impact":"high","tags":["AI規制","米国政府","サイバーセキュリティ","大統領令"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
