<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月31日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

OEeX5Wj2X1AGPb4tf9vfHFbNtqe_dH0psMYuoXc6wwBcfiyuA==","impact":"medium","tags":["副業","AI活用","高収益"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"MWC Barcelona 2026、AI一色に染まる。『通信×AI』が主要キーワード、AI-RAN開発が加速","summary":"2026年3月2日から5日に開催された「MWC Barcelona 2026」では、AIが主要テーマとなり、「通信×AI」が大きなキーワードとして注目を集めました。ソフトバンクは「Telco AI Cloud」構想を中心に、AI-RANの最新取り組みを紹介。AI-RANは、AIと無線アクセスネットワーク（RAN）の運用・処理を同一プラットフォーム上で統合的に行うアーキテクチャであり、AIを活用した通信ネットワークの高度化やエッジAIサーバーでの低遅延なAI処理、計算資源の効率化を実現する技術として期待されています。これは通信インフラの未来を大きく変える可能性を秘めており、関連する開発者には新たな技術スタックと最適化の機会が生まれるでしょう。","source":"MWC Barcelona 2026レポート","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGtJu0HD02IfBBqKe-XHBZ_LY_3IPT3KK7B4nlAAFxFqnHo_qQD3WzW2gnQYn7RNqL1veMykWtPE-tut0DSmogtzknmiaVsHeXnjrEZW9c0RZx9qGI0RoiIxntZk2RzcmLHYuu-GDKYPhsOsQ==","impact":"high","tags":["MWC","通信×AI","AI-RAN"]},{"title":"世界初のカメラ搭載AIイヤホンがシードで約70億円調達、『スマホの次』を狙う","summary":"スタートアップ「光帆科技（LightSail Technology）」が、世界初のカメラ搭載AIイヤホンを開発し、シードラウンドで累計約3億元（約70億円）の資金調達を完了しました。同社は、スマートフォンと連携せず単独で動作可能なAIイヤホンとスマートウォッチを組み合わせることで、「スマートフォンに次ぐ第2のメインデバイス」という新たなコンセプトを提示しています。この製品はeSIM、カメラ、指紋認証などを搭載し、センサーとカメラで周囲の状況を把握してAIがユーザーの意図を正確に理解します。計算負荷の高いAI処理はクラウド側で実行する分離型アーキテクチャを採用しており、ウェアラブルデバイスにおける新たな開発領域とユーザーインターフェースの可能性を広げるでしょう。","source":"光帆科技","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGafXK7tPw3JLduzdwzSNSzK7308G-fyePkrjy_A8A8oJM9a0OXXZ7ZhbigN7AN6sASWK5sHVZUoOw4Y99BWs-mFs7LwQ5JlRXKJ3VHAAF7_yoK","impact":"high","tags":["AIイヤホン","ウェアラブル","次世代デバイス"]},{"title":"エンジニアの8割超がAI積極活用企業への転職を希望、キャリア支援もAI時代に対応","summary":"ファインディが2025年11月に実施した「AIユーザーレポート」によると、エンジニアの88.7%が既に業務でAIツールを活用しており、転職先を選定する際に82.4%のエンジニアが「AI活用に積極的な企業」を希望していることが明らかになりました。このデータは、AI環境の充実が企業にとって人材確保と組織エンゲージメントの死活問題となりつつあることを示唆しています。ファインディは、この変化に対応するため、「Findy Insights」や「Findy AI+」など、AI時代のエンジニアのキャリア支援を強化する4つの新規事業を発表しています。開発者にとって、AIツールへの習熟とAI活用企業への転職は、キャリア形成において不可欠な要素となるでしょう。","source":"ファインディ","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEeF0Kl     }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
