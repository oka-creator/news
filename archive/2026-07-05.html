<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年7月6日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年7月6日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"新しいマルチモーダルLLMが画像生成とテキスト理解を統合し、より複雑な指示に対応","summary":"最新の研究により、画像生成能力と高度なテキスト理解を統合した新しいマルチモーダル大規模言語モデルが発表されました。このモデルは、単なるテキストから画像を生成するだけでなく、画像内の要素やテキストの文脈をより深く理解し、ユーザーの複雑な指示に基づいて詳細なビジュアルコンテンツを作成できると期待されています。これにより、デザイン、マーケティング、コンテンツ制作のワークフローが大幅に効率化される可能性があり、特にクリエイティブ産業におけるAI活用の新たな地平を切り開くと見られています。開発者にとっては、より高度なAIアプリケーション構築の機会が広がり、ユーザー体験の向上に貢献するでしょう。","source":"ITmedia NEWS","url":"https://www.itmedia.co.jp/news/articles/2405/14/news130.html","impact":"high","tags":["マルチモーダルAI","LLM","画像生成","コンテンツ制作"]},{"title":"企業向けAI倫理ガイドラインの国際標準化が進展、ガバナンス強化が急務に","summary":"生成AIの普及に伴い、企業がAIを安全かつ倫理的に利用するための国際的なガイドライン策定が加速しています。特に、透明性、公平性、説明責任を確保するための技術的・組織的要件が議論されており、2026年後半には新たな国際標準が発表される見込みです。企業は、AIシステムの開発・導入において、これらのガイドラインを早期に取り入れ、ガバナンス体制を強化することが求められています。開発者にとっては、倫理的AI設計の知識と実践が不可欠となり、新たな開発プロセスやツールへの適応が求められるでしょう。","source":"OECD AI Policy Observatory","url":"https://www.oecd.org/going-digital/ai/oecd-ai-principles-and-ai-observatory.htm","impact":"high","tags":["AI倫理","ガバナンス","国際標準","企業AI"]},{"title":"エッジAIデバイス向けの軽量LLM開発が加速、オフラインでの利用が拡大へ","summary":"スマートフォンやIoTデバイスなどのエッジデバイス上で動作する軽量な大規模言語モデル（LLM）の開発が急速に進んでいます。これにより、クラウドへの接続なしに、デバイス単体で高度な自然言語処理や推論が可能になります。プライバシー保護の観点からもメリットが大きく、将来的にはオフライン環境での音声アシスタントやリアルタイム翻訳、パーソナライズされた情報提供などがより身近になると予測されます。開発者にとっては、リソース制約のある環境でのモデル最適化や、新しいオフラインアプリケーションの創出が重要な課題となるでしょう。","source":"Qualcomm News","url":"https://www.qualcomm.com/news/onq/2023/10/on-device-ai-and-llms-are-the-future-of-mobile","impact":"medium","tags":["エッジAI","軽量LLM","オフラインAI","プライバシー"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコードツールを活用した個人開発者の収益化事例が急増、ニッチ市場開拓が鍵","summary":"個人開発者の間で、AdaloやBubble、Glideなどのノーコード・ローコードツールを利用して短期間でプロダクトを開発し、収益を上げる事例が増加しています。特に、特定のニッチな課題を解決するSaaSやモバイルアプリが成功しており、開発コストと時間を抑えつつ市場の需要に応えるアプローチが注目されています。成功の鍵は、ターゲットユーザーの具体的なペインポイントを深く理解し、素早くMVP（Minimum Viable Product）をリリースすることにあると指摘されています。これにより、非開発者や少人数チームでも、アイデアを迅速に形にし、市場投入する機会が拡大しています。","source":"Bubble Blog","url":"https://www.bubble.io/blog/no-code-success-stories/","impact":"high","tags":["ノーコード","ローコード","個人開発","収益化","ニッチ市場"]},{"title":"サブスクリプション型ニュースレタープラットフォームが個人クリエイターの新たな収入源に","summary":"SubstackやGhostなどのサブスクリプション型ニュースレタープラットフォームが、個人開発者や専門家にとって安定した収益源となっています。特定のテーマに関する深い洞察や専門知識を提供する有料ニュースレターが読者からの支持を集め、広告収入に依存しないビジネスモデルを確立しています。これにより、個人が自身のコンテンツを直接収益化し、独立した活動を継続するための強力なツールとなっています。開発者やクリエイターは、自身の専門知識を活かして直接読者と繋がり、持続可能なビジネスモデルを構築する新たな道を見出しています。","source":"Substack About","url":"https://substack.com/about","impact":"medium","tags":["クリエイターエコノミー","サブスクリプション","ニュースレター","個人収益化"]},{"title":"AIを活用した個人開発の効率化ツールが登場、アイデアからプロトタイプまでを高速化","summary":"個人開発者向けに、AIがコード生成、UI/UXデザイン提案、テストケース作成などを支援するツールが登場しています。これにより、アイデア段階から機能するプロトタイプを作成するまでの時間が大幅に短縮され、非開発者でもより容易にプロダクト開発に取り組めるようになっています。特に、繰り返し発生するコーディング作業やデザインの初期案作成において、AIの支援が開発効率を劇的に向上させています。開発者は、AIツールを導入することで、より創造的な作業に集中し、市場投入までのサイクルを加速させることが可能になります。","source":"Product Hunt","url":"https://www.producthunt.com/topics/ai-developer-tools","impact":"high","tags":["AI開発ツール","コード生成","プロトタイピング","開発効率化"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"次世代バッテリー技術がEVの航続距離と充電時間を刷新、普及に弾み","summary":"全固体電池やリチウム硫黄電池など、次世代バッテリー技術の開発が最終段階に入りつつあります。これらの新技術は、現在のリチウムイオン電池と比較してエネルギー密度が大幅に向上し、電気自動車（EV）の航続距離を飛躍的に伸ばしつつ、充電時間を大幅に短縮すると期待されています。これにより、EVの価格競争力と利便性が向上し、世界のEV市場のさらなる拡大に貢献すると見られています。開発者にとっては、新しいバッテリー技術に対応したEV設計や充電インフラの開発が重要となり、関連産業全体に大きな影響を与えるでしょう。","source":"TechCrunch","url":"https://techcrunch.com/tag/solid-state-batteries/","impact":"high","tags":["EV","バッテリー技術","全固体電池","充電インフラ"]},{"title":"量子コンピューティングの実用化に向けたマイルストーン達成、特定分野での優位性示す","summary":"量子コンピューティング分野において、特定の問題解決において従来のスーパーコンピューターを凌駕する「量子優位性」を示す新たなマイルストーンが達成されました。まだ汎用的な実用化には時間を要するものの、材料科学、創薬、金融モデリングなどの特定の研究開発分野において、量子コンピューターが具体的な成果を生み出し始めています。企業や研究機関は、将来の競争力を確保するため、量子技術への投資を加速させています。開発者にとっては、量子アルゴリズムの研究や、量子コンピューターと古典コンピューターを組み合わせたハイブリッドソリューションの構築が新たなフロンティアとなるでしょう。","source":"IBM Quantum","url":"https://www.ibm.com/quantum-computing/what-is-quantum-computing/quantum-advantage/","impact":"medium","tags":["量子コンピューティング","量子優位性","材料科学","創薬"]},{"title":"Web3技術がエンターテイメント業界に変革をもたらす、ファン参加型エコシステムが拡大","summary":"ブロックチェーンを基盤とするWeb3技術が、音楽、ゲーム、映画といったエンターテイメント業界に新たなビジネスモデルをもたらしています。NFT（非代替性トークン）を活用したデジタルアセットの所有権や、DAO（分散型自律組織）によるファン主導のプロジェクト運営など、クリエイターとファンがより直接的に繋がり、価値を共有するエコシステムが拡大しています。これにより、クリエイターは収益源を多様化し、ファンはコンテンツ制作により深く関与できるようになっています。開発者にとっては、Web3技術を用いた新しいエンターテイメントプラットフォームやツールの開発が、大きなビジネスチャンスとなるでしょう。","source":"Cointelegraph","url":"https://cointelegraph.com/tags/web3-entertainment","impact":"medium","tags":["Web3","NFT","DAO","エンターテイメント","ブロックチェーン"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
