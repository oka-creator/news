<html lang="ja">
<head>

<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {

    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;

    border-radius: 9px;

    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

ct/AUZIYQE4LmKDo9LWjdmgZg_X_hLR8ZmBrfySWzBkGnxz7jOBFMWVEUi1eTyEtq_lekmteQ6oix3I7RC2spjEithsSSf4RJSWm4zqMs9jpBYu4fY-2V1rRpKTnaGLCfois2syRrNtXddbVq6_dLFCu4S1KGXUgMyi","impact":"medium","tags":["開発効率","Kill Criteria","プロダクト検証"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"AWE2026（家電・エレクトロニクス世界博覧会）が閉幕、スマートAIリビングの未来を提示","summary":"2026年3月19日に閉幕したAWE2026では、「スマートAI、よりスマートな未来」をテーマに、1,200社を超えるグローバル企業やイノベーターがAIを活用したスマート・リビングの最新技術を披露しました。来場者数は前年比30%以上急増し、HaierはAI Eye 2.0搭載の家庭用サービス・ロボットを、Dreameは衣類折りたたみロボットなどを発表し、AIが組み込まれた家電の進化が顕著になりました。開発者にとっては、家電製品へのAI組み込みが加速していることを示しており、エッジAIやIoTデバイス向けのAIソリューション開発の需要が高まるでしょう。スマートホームエコシステムにおける新たな連携やサービス開発の機会も増えることが予想されます。","source":"PR Newswire","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFsQ9-gsx0Jcc6N3ivOK04PINbKCGtnEkpwYwF-rCAwjv3qJjw_rL3t1D13aT_hOvI1jqln1tbFDdzhlKZXreefRZ7vOICCQNc6cQxX0pNftxhBgK1SSRuyVIU-dTchLso-DIEpL_NqmYrsjW3spDJKmiB0VuieMHYaWaoQaZtW","impact":"high","tags":["スマートリビング","AI家電","IoT"]},{"title":"Gartnerが2026年の戦略的テクノロジートレンドトップ10を発表、AIがビジネスの前提条件に","summary":"Gartnerは、2026年のビジネスとIT戦略を形成する10の主要なテクノロジートレンドを発表しました。これらのトレンドには、「AIネイティブ開発プラットフォーム」「マルチエージェントシステム」「ドメイン特化型言語モデル」「予防型サイバーセキュリティ」などが含まれており、AIが企業にとって「選択肢」ではなく「前提条件」となっている現状が浮き彫りになりました。開発者にとっては、AI技術への深い理解と、これらのトレンドに対応できるスキルセットの習得が不可欠となるでしょう。特に、AIを前提としたシステム設計や開発手法への適応が求められ、新たな開発ツールやフレームワークの需要も高まります。","source":"SotaTek","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQH4rUmymGRPMB9vgWacl4qE9I3lgwYXDA7iwvPKqmihBPFshfClBNLDQXMd5CzH-A59BG25gSG-05t_S5VWCHLAkdcXUPDLlyCMSGf2q4GhEfod2GU-u8mTZ5rpNvTfbJro12sFardCgaGnaw==","impact":"high","tags":["テクノロジートレンド","Gartner","AIビジネス"]},{"title":"NEC、明文化されていない危険の予兆をAIで捉え、改善アドバイスを自動生成する技術を開発","summary":"NECは、AIやLLMを活用した映像分析により、物流・運送や製造などの現場映像から明文化されていない危険の予兆を捉え、その根拠となる映像シーンとともに危険回避に役立つアドバイスを文章で自動生成する技術を世界で初めて開発しました。この技術は2026年度中の実用化を目指しており、安全運転指導や現場作業指導における標準化、属人化の解消、効率的な人材育成のDX推進に貢献することが期待されています。開発者にとっては、産業現場におけるAIとLLMの新たな応用分野を示しており、映像解析、自然言語処理、安全管理システム開発の需要が高まるでしょう。特に、既存のルールでは捉えきれない潜在的リスクをAIで可視化するソリューションは、多くの産業で価値を生み出す可能性があります。","source":"NEC","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQE0RBhDgxI0cLTy_lKmmmRyavBoggZIERyTRy-vPmRz-vyWYlARDswUNJO0cpy8sLNJLleYlJt75lBBWjP37xS6QC3SOeFd87jxGgbyil_yPdrmDkgP2qON2agDsZLFQ4JpuFzA1zilwWj3MEs==","impact":"medium","tags":["産業AI","安全管理","映像分析"]}]}];

    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
