<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年9月20日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年9月20日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"OpenAIが「Agents API」を発表、クラウド上でのAIエージェント構築・実行を容易に","summary":"OpenAIは2026年9月10日、「Agents API」を発表し、クラウド上でのAIエージェント構築・実行を大幅に簡素化しました。このAPIにより、開発者はエージェントの実行基盤を自前で用意する負担から解放されます。長時間タスクやツール利用、サブエージェントによる並列処理などをOpenAI提供のサンドボックス環境で扱えるため、AIエージェント開発の敷居が大きく下がると期待されます。これにより、より複雑で自律的なAIアプリケーションの実現が加速し、開発者はコアロジックに集中できるようになるでしょう。","source":"Zenn","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGiYh8BmHE0ZoIgciszNfbrkigL73JnziDWGMy3-QYNiLXZSNIg4c67q_U07jnG8WCwSjVAY5plFFUkMJ2IiU51fub2fvSxD0muDU7g3OeGsuM9urfMzxZJUB3RWhzEnk_EhiNKvCjDYtJPmNyWfltX5NGZvwhG-qSCSyw=","impact":"high","tags":["AIエージェント","OpenAI","API開発"]},{"title":"TypeSafe AIが構造化判断に特化した新型AIモデル「Jev」の早期アクセスを提供開始","summary":"AIスタートアップのTypeSafe AIは2026年9月15日、構造化判断に特化した新型AIモデル「Jev」の早期アクセスを開始しました。Jevは文章生成ではなく、型が保証された判断結果を直接返す設計で、分類・ルーティング・採点・ガードレール検証といったワークフロー組み込み型の自動化に最適です。既存LLMより大幅に高速な応答速度（70〜500ミリ秒）と低料金（100万トークンあたり0.042ドル）を実現しており、開発者はより効率的かつコストを抑えてAIを業務プロセスに統合できるようになります。これは、特定のタスクに特化したAIの進化を示す重要な動きです。","source":"TypeSafe AI","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEKyOOE6stIiKjdKReDYoDc5y9wxGLXBjGKWipKBcboMHrQtOrdj6hEeTZeTYbKr9jSJoSghm127wXDnRa1Wfr-MTrQxw-YlpzHRmd2hK9SIaeWtmzZrxCr3rYG5a5ECQU6jcns9JPPkxzmUhA38ILs4YbYtNpy4w_e9FLf_O_L","impact":"medium","tags":["構造化AI","LLM","自動化"]},{"title":"OpenAIが次世代AIモデル「GPT-6 Astra」を投入、パソコンやブラウザ操作を強化","summary":"OpenAIは2026年9月3日、次世代AIモデル「GPT-6 Astra」を発表し、企業向けDaybreak利用者への提供を開始しました。このモデルは、パソコンやブラウザを人間のように操作する能力を持ち、複数のアプリケーションにまたがる業務やソフトウェア開発を代行できる点が特徴です。AIが単なる情報提供や文書作成を超え、自律的に業務を遂行する方向へと進化していることを強く示唆しており、開発者はAIを活用した新たな自動化ソリューションや、より高度なエージェントシステムの構築が可能になるでしょう。","source":"Buttondown","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFOAIGb_IzUYavCwlwaSGMKgrsZblbq75oF1cO7MARPwiDMMLPePNDSQb0R58gAworJ5_YlVHstbFPdCjYKXue0URRo-btAhzqGbR7YYFGzD1MI6EmM2ae4pQ-Pwm7xXfzXRO-iVmBk8WIRARK_jwY8dxrxb6EGnvOd8wPE7SJEN7Tcgm5zhcOw2EOoXSthOuSJXF8=","impact":"high","tags":["GPT-6 Astra","自律AI","業務自動化"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"51歳の個人開発者が「声ものこせる」家族アルバムアプリ「キオクノワ」を正式公開","summary":"神奈川県川崎市在住の51歳の個人開発者、鈴木雄介氏が2026年9月15日、家族アルバムアプリ「キオクノワ」を正式公開しました。このアプリは、写真・動画に加えて「声」と「ひとこと」を残し、後から「ことば」で検索できる点が特徴です。開発前に需要を検証し、3人に1人が有料でも使いたいと回答したことから「声」を核とした開発が進められました。広告掲載なしを公約し、クラウドファンディングで応援団を募るなど、個人開発ならではの情熱とユーザーファーストな姿勢が際立っています。","source":"PR TIMES","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEdDTdAkH3JqqVCFFoHlk8H4rySmNDXR6Z6Rqi-YYDyMeYrc3ziHnM-jNXHJZKCjYTBznYbooHjfTYzMYAtK4ApVxyshe5wiH0GnWIKAeAysLzfdQP4fJfCn5WPSknspRibEZXYC1bWXt3uE2aeuuxzu54Baw==","impact":"low","tags":["個人開発","家族アプリ","音声記録"]},{"title":"2026年9月版ノーコード・ローコード開発ツールの最新ランキングが発表","summary":"ITトレンドは2026年9月7日、ノーコード・ローコード開発ツールの資料請求ランキングを更新し、「JUST.DB」「SmartDB」「Platio Canvas」などが上位にランクインしたと発表しました。これらのツールはプログラミング知識が不要で、Webデータベースや業務アプリを容易に構築できるため、個人開発者や中小企業の業務効率化に大きく貢献しています。開発の民主化を推進し、非エンジニアでもアイデアを形にできる環境がさらに広がっていることを示しており、今後もその需要は高まるでしょう。","source":"ITトレンド","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQF4YPCgWVj86VmFBct-w_1U6BsBVAXfIjoLxny8Azt3rMcJ17zbRxGqyiQArtNyZR9BmmW8qGlfR8j5QIfRBmqs1mNBTw-qVuLXttbRE9yo6rpcKkSJWzPNaGxuH1kir6fJ4Vil6xvCq7hnHgghiLnRlWg==","impact":"medium","tags":["ノーコード","ローコード","業務効率化"]},{"title":"AIツールの進化により個人開発の成功確率が過去最高に、プロダクトリリース率が2.5倍に向上","summary":"ShiftBの調査によると、2026年現在、AIツールの進化が個人開発の成功確率を過去最高レベルに押し上げており、AI駆動開発を導入した受講生のプロダクトリリース率が従来の約2.5倍の77%に達したと報じられました。これは、AIが開発コストと時間を大幅に削減し、個人開発者がより容易にアイデアを具現化できる環境が整ったことを示唆しています。AIの活用は、個人開発者にとって強力な武器となり、より多くのイノベーションが生まれる可能性を秘めています。","source":"ShiftB","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQF2fobVAOtASzC9q3o0QSyrv9dhKiAjJWS20R-5mBX4uDHxDe9Zd3IrQ6qbJa7FQz578vRfs8e3Oxn5bKkVXvAsl5lMR3ogpWW1SZr259jl7c8wxyk8r94mLvwKls3lbAI9aV1wKpQcNQ4b8wUi3l8=","impact":"high","tags":["AI開発","個人開発","生産性向上"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"「ガジェット展示会2026 秋 Supported by Ulanzi」が開幕","summary":"2026年9月19日より二子玉川 蔦屋家電にて「ガジェット展示会2026 秋 Supported by Ulanzi」が開幕しました。株式会社infinityは、世界的に注目されるオーディオ・ガジェットブランド「Divoom」や、夜間の愛犬との散歩を安全・快適にするペット用品ブランド「よるんぽ応援隊」などを展示しています。来場者は実際に製品を体験できる機会となっており、最新のライフスタイルガジェットに触れることで、今後の製品トレンドや技術動向を肌で感じることができます。","source":"PR TIMES","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEY8mlUJChaID0PSoO2OL9gDoFqdgDqd0FiUPw7Nf_rBCyRa168JoPtnxrxrIYeWkGBrcylmtwflPWFwl_xROljynGdre_3h46y9AcmxTviXKE0nV040P6sFO_oNjb3Isc5su6sNnlVm8zeUjMH4sbGrDpiJQ==","impact":"low","tags":["ガジェット","展示会","ライフスタイル"]},{"title":"Appleが初の折りたたみスマートフォン「iPhone Duo」を発表","summary":"Appleは2026年9月9日、同社初となる折りたたみスマートフォン「iPhone Duo」を発表しました。長年噂されてきた新形状のiPhoneが正式に登場したことは、スマートフォン市場において数年ぶりの大きな製品転換として世界的に報じられています。この発表は、モバイルデバイスのフォームファクタにおける新たな可能性を示し、アプリ開発者にとっては折りたたみ画面に対応したUI/UX設計の重要性が増すことを意味します。これにより、新たなアプリケーション体験の創出が期待されます。","source":"note","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEZvJQVBg3ku9J6SnWJNpcsOgxh-3NiiBLP7CFN4toqS8acOpZNh25vYtZM-N77GZXBZjQR3riin3kVO0k2EqzJGps9il9l5Xp2rrZPBm5YRIemvySoleVh-k2FprFmIfGkySUxAw==","impact":"high","tags":["Apple","折りたたみスマホ","iPhone Duo"]},{"title":"TGS2026でゲーム開発に「ローカルLLM」を取り込む必然性が議論、AI特化PCの変革が示される","summary":"東京ゲームショウ2026では、ゲーム開発における「ローカルLLM」活用の必然性が熱く議論されました。クラウド型AI利用時の情報漏洩リスクや利用コスト・制限といった課題に対し、手元のマシン上でLLMを動かすローカル運用が注目されています。メインメモリーの96GBをVRAM化するAI特化PC「DAIV」などがその変革を示しており、ゲーム開発者はよりセキュアでコスト効率の高いAI活用が可能になります。これは、AI開発の新たな方向性を示唆し、特にプライバシーやリアルタイム性が求められる分野での応用が期待されます。","source":"週刊アスキー","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGQsDuwNs71zAhCtbgmsRrTtFgk0ypCULn1_nVMix45A37_0O1hbb7Yj4YO7MReHEZ2LtIivJm8yaRtCJ7i9d7YMXNqN0TgQ-GCpicDktly7QVDEDfJFFGbwDXZTdWdmxPzyQBS2ActMG3npA==","impact":"medium","tags":["ローカルLLM","ゲーム開発","AI特化PC"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
