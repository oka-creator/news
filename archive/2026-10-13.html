<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年10月13日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年10月13日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"OpenAIが新モデル『GPT-6』を発表、対話型UI『Intelligent UI』を導入","summary":"OpenAIはChatGPTに新モデル『GPT-6』を搭載し、順次提供を開始しました。このモデルは、テキストだけでなく図や操作可能なボタン、フォームなどを回答として生成する『Intelligent UI』を導入しています。思考しながら回答を出力する機能も備えており、これにより回答画面内でデータ入力や計算を完結できるため、顧客向けダッシュボードやセルフサービスツールの構築コストを大幅に削減できると期待されています。開発者にとっては、よりインタラクティブで機能的なAIアプリケーションを構築するための新たな可能性が広がり、開発効率の向上にも寄与するでしょう。","source":"ITmedia AI+","url":"https://www.youtube.com/watch?v=Rk_qY8W3L5c","impact":"high","tags":["GPT-6","Intelligent UI","OpenAI","生成AI"]},{"title":"リコージャパン、生成AI開発プラットフォーム『Dify』のホスティング環境運用サービスを提供開始","summary":"リコージャパンは、生成AIアプリケーション開発プラットフォーム『Dify』の有償ライセンス利用者向けに『Difyホスティング環境運用サービス』を2026年10月13日より提供開始しました。このサービスでは、顧客がAWSの契約・管理をする必要なく、リコージャパンがAWS環境の提供・運用を行うことで、中堅・中小企業のDify導入負荷を軽減します。さらに、Amazon BedrockのLLMを利用できる『LLM利用サービス』も提供され、クラウド環境の構築から導入、運用、技術伴走支援までをワンパッケージで支援します。これにより、開発者はインフラ管理の負担から解放され、AIアプリケーション開発に集中できるようになり、AI活用の迅速な開始が期待されます。","source":"リコーグループ 企業・IR","url":"https://jp.ricoh.com/release/2026/1013_1","impact":"medium","tags":["Dify","ホスティング","リコージャパン","AWS"]},{"title":"樹林AI、日本企業向けAI意思決定モデル群『JJ-1』を発表","summary":"樹林AI株式会社は、日本企業の業務に最適化されたAI意思決定モデル群『JJ-1』を発表しました。このモデルは、日本独自のビジネスワークフローを対象とした評価で97.43%の正答率を達成し、生成型大規模言語モデル（LLM）と比較して推論コストを最大99%削減、ミリ秒単位の高速処理を実現します。JJ-1は、回答をトークン単位で生成するのではなく、定義された選択肢を直接スコアリングし、ソフトウェアが次のアクションを決定するための確率値を返すことで、高速かつ目的特化型の構造化された出力を提供します。開発者にとっては、日本市場に特化した高精度かつ低コストなAI意思決定機能を既存システムに組み込む新たな選択肢となり、業務効率化や意思決定プロセスの改善に貢献するでしょう。","source":"PR TIMES","url":"https://www.google.com/search?q=%E6%A8%B9%E6%9E%97AI+JJ-1","impact":"medium","tags":["意思決定AI","JJ-1","樹林AI","高速処理"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"海外インディー開発者の成功事例から学ぶ『配布』の重要性","summary":"『18ヶ月かけて開発したプロダクトの売上ゼロドル』だったインディーハッカーが、30日間『配布』に集中した結果、月43,000ドル（約650万円）の収益を達成した事例が紹介されました。これは『1時間のマーケティングは、10時間の開発に勝る』という英語圏のインディーハッカー界隈で広まる考え方を裏付けるものです。プロダクトの完成度を追求するだけでなく、いかにユーザーに届け、広めるかが収益化において極めて重要であることを示唆しています。開発者は、開発フェーズだけでなく、マーケティングやプロモーション活動にも同等かそれ以上の労力を割くべきであるという教訓を得られるでしょう。","source":"note『1人で億稼ぐ人たち｜朝日けけ。』","url":"https://www.google.com/search?q=%E3%82%A4%E3%83%B3%E3%83%87%E3%82%A3%E3%83%BC%E3%83%8F%E3%83%83%E3%82%AB%E3%83%BC+%E9%85%8D%E5%B8%83+%E6%88%A6%E7%95%A5","impact":"high","tags":["マーケティング","配布戦略","インディーハッカー","収益化"]},{"title":"習慣化アプリ『HabitKit』がApp Store検索だけで月1,500万円の収益を達成","summary":"ドイツ人開発者セバスチャン氏が開発した習慣化アプリ『HabitKit』が、App Store検索からの流入だけで年間9,000万円、2026年1月には月10万ドル（約1,500万円）以上の収益を上げていることが報じられました。激戦区である習慣化アプリ市場において、後発ながらもASO（アプリストア最適化）戦略を駆使して成功を収めた事例として注目されています。この成功は、プロダクトの質だけでなく、アプリストアにおける可視性を高めるASOの重要性を改めて示しています。個人開発者にとって、ASOは少ないマーケティング予算で大きな成果を出すための重要な戦略であり、その具体的な成功例として大いに参考になるでしょう。","source":"みんなのニュースレター『海外アプリ成功事例分析ニュースレター』","url":"https://minnano.substack.com/p/202610-81","impact":"high","tags":["ASO","アプリ開発","HabitKit","収益化"]},{"title":"日本のインディーハッカーにとって2026年が好機となる理由","summary":"日本のソロプレナー（個人事業主）向けに、AIツールの進化、BaaS（Backend as a Service）の成熟、そして海外顧客向けの決済代行サービスの登場が、個人開発での収益化を加速させる要因として挙げられています。特にClaude CodeやCursorといったAIツールがMVP（Minimum Viable Product）完成までの期間を数日に短縮し、SupabaseのようなBaaSがデータベース、認証、ストレージを肩代わりすることで、開発者はよりプロダクトのコア機能に集中できるようになっています。これにより、個人開発者は少ないリソースで高品質なプロダクトを迅速に市場投入し、グローバルな顧客を獲得するチャンスが拡大しています。開発者にとっては、これらのツールやサービスを積極的に活用することで、開発効率と市場展開の可能性を飛躍的に高めることができるでしょう。","source":"インディーハッカー スタック 日本 2026: ソロプレナーのためのツール、税務、コミュニティ","url":"https://www.google.com/search?q=%E6%97%A5%E6%9C%AC%E3%81%AE%E3%82%A4%E3%83%B3%E3%83%87%E3%82%A3%E3%83%BC%E3%83%8F%E3%83%83%E3%82%AB%E3%83%BC+2026+%E5%A5%BD%E6%A9%9F","impact":"high","tags":["ソロプレナー","AIツール","BaaS","MVP"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"CEATEC 2026が10月13日に開幕、AI社会実装に向けた先端技術が集結","summary":"国内最大級のデジタルイノベーション総合展『CEATEC 2026』が、2026年10月13日から16日まで千葉市美浜区の幕張メッセで開催されます。『Transformation ―企業が、産業が、そして社会が変わる―』をテーマに掲げ、AIやロボティクス、ウェルビーイング、社会インフラなど多岐にわたる分野で、Society 5.0実現に向けた先端技術や具体的な実装事例が展示されます。特に、自律搬送ロボットの実機デモや国産大規模言語モデル（LLM）の活用事例、企業の業務効率化を支援する各種AIソリューションなどが注目されています。開発者にとっては、最新の技術トレンドやビジネスチャンスを探る絶好の機会であり、新たなインスピレーションを得る場となるでしょう。","source":"風傳媒日本語版、電波新聞デジタル","url":"https://www.storm.mg/jp/article/4882069","impact":"medium","tags":["CEATEC","AI社会実装","ロボティクス","Society 5.0"]},{"title":"オムロン、米OnLogicを買収しフィジカルAIプラットフォームを強化","summary":"オムロンは2026年10月13日、産業用PC（IPC）を手がける米OnLogicとその親会社である米Interlogicを約1,046億円で買収することで合意したと発表しました。この買収は、OnLogicの産業用PCにオムロンの高精度制御技術を組み合わせることで、次世代のフィジカルAIプラットフォームの開発を加速することを狙いとしています。ロボットなどを制御するフィジカルAIの領域で、ものづくりや作業現場でのAI活用をさらに推進する動きとして注目されます。開発者にとっては、産業用AIやロボティクス分野における新たなハードウェア・ソフトウェア統合ソリューションの登場が期待され、より高度な制御システム開発の可能性が広がるでしょう。","source":"ビジネス+IT","url":"https://www.google.com/search?q=%E3%82%AA%E3%83%A0%E3%83%AD%E3%83%B3+OnLogic+%E8%B2%B7%E5%8F%8E","impact":"medium","tags":["オムロン","OnLogic","フィジカルAI","産業用PC"]},{"title":"NTTドコモビジネスと日本IBM、AIガバナンス領域で協業を開始","summary":"NTTドコモビジネスと日本IBMは、AIの開発・導入・利用における法令や倫理、社内規程などに沿ったAIの適切な管理・運用を支援するAIガバナンス領域での協業に関する基本合意書を2026年10月7日に締結しました。AIエージェントの活用が広がる中で、企業がAIエージェントの利用状況を把握し、法令や社内規程に沿って継続的に管理・監査できる仕組みの確立を目指します。これは、AIによる誤った判断や想定外の利用による情報漏えいなどのリスクに対応し、企業が安心してAIエージェントを活用できる環境を実現するための重要な取り組みです。開発者にとっては、AIシステムを構築する際に、倫理的・法的側面を考慮した設計や、ガバナンスフレームワークへの準拠がより一層求められるようになることを示唆しています。","source":"NTTドコモビジネス","url":"https://www.nttdocomo.biz/news/2026/1007.html","impact":"high","tags":["AIガバナンス","NTTドコモビジネス","日本IBM","AIエージェント"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
