<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月14日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年3月14日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"OpenAI、GPT-4.5 Turboを発表か？次世代モデルへの期待高まる","summary":"OpenAIが次期大規模言語モデル「GPT-4.5 Turbo」を間もなく発表するとの憶測が飛び交っています。このモデルは現行のGPT-4 Turboよりも高速かつ高性能になると予想されており、特にリアルタイム処理や複雑な推論能力の向上が期待されています。開発者コミュニティでは、APIの応答速度向上やコスト効率の改善に関する議論が活発に行われています。これにより、AIを活用したアプリケーション開発の可能性がさらに広がると見られています。","source":"ITmedia NEWS","url":"https://www.itmedia.co.jp/news/articles/2403/07/news043.html","impact":"high","tags":["生成AI","LLM","OpenAI"]},{"title":"Google、Gemini Pro 1.5の一般提供を開始し、コンテキストウィンドウを大幅拡大","summary":"Googleは、高性能LLM「Gemini Pro 1.5」の一般提供を開始しました。このモデルの最大の特長は、最大100万トークンという驚異的なコンテキストウィンドウです。これにより、非常に長いドキュメントや複数のデータソースを一度に処理することが可能になります。企業は、契約書の分析、長文のレポート作成、顧客サポートの履歴分析など、より複雑な業務へのAI導入を加速させることが期待されます。開発者は、より大規模で複雑なデータセットを扱うAIアプリケーションを構築できるようになります。","source":"Publickey","url":"https://www.publickey.jp/blog/24/google_gemini_pro_15100.html","impact":"high","tags":["生成AI","LLM","Google","Gemini"]},{"title":"Stability AI、画像生成モデルStable Diffusion 3 Mediumを公開","summary":"Stability AIは、最新の画像生成AIモデル「Stable Diffusion 3 Medium」を発表しました。このモデルは、高品質な画像生成能力を維持しつつ、より軽量で効率的な動作が特徴です。これにより、個人開発者や中小企業でも、より手軽に高度な画像生成AIを導入・活用できるようになります。特に、広告クリエイティブ、ゲームアセット、SNSコンテンツ制作などでの利用が期待され、クリエイティブ分野でのAI活用がさらに加速するでしょう。","source":"GIGAZINE","url":"https://gigazine.net/news/20240516-stable-diffusion-3-medium/","impact":"medium","tags":["画像生成AI","Stable Diffusion","Stability AI"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコードツールが個人開発者の生産性をさらに向上","summary":"2026年に入り、ノーコード・ローコードプラットフォームはAIとの連携を深め、より高度なアプリケーション開発を可能にしています。Bubble、Adalo、Webflowなどの主要ツールは、生成AIによるUI/UXデザインの自動生成機能や、自然言語での機能追加・修正機能を実装しました。これにより、プログラミング知識がない個人開発者でも複雑なビジネスロジックを持つサービスを構築できるようになっています。アイデアからリリースまでの期間が大幅に短縮され、インディーハッカーが市場に投入できるプロダクトの多様性が増しています。","source":"株式会社スタイル・エッジ","url":"https://styleedge.co.jp/blog/nocode-lowcode-development-tool/","impact":"high","tags":["ノーコード","ローコード","個人開発"]},{"title":"サブスクリプション型個人開発プロダクトの成功事例が続々登場","summary":"ニッチな市場をターゲットにした、月額課金制の個人開発プロダクトが注目を集めています。特定の業界向けのSaaSツールや、特定の趣味に特化したコミュニティプラットフォームなど、小規模ながらも熱心なユーザーベースを獲得し、安定的な収益を上げている事例が増加しています。これらの成功事例は、大規模な投資を必要とせずとも、アイデアと実行力で持続可能なビジネスを構築できることを示しています。個人開発者にとって、収益化の新たな道筋が明確になりつつあります。","source":"Toptal","url":"https://www.toptal.com/freelance/how-to-become-an-indie-hacker","impact":"medium","tags":["インディーハッカー","サブスクリプション","SaaS"]},{"title":"AIを活用したコンテンツ自動生成ツールが個人メディア運営を効率化","summary":"個人でブログ、ニュースレター、YouTubeチャンネルなどを運営するインディーハッカーの間で、AIを活用したコンテンツ自動生成ツールが普及しています。記事の草稿作成、SNS投稿文の生成、動画のスクリプト作成、さらには画像・動画素材の生成まで、AIがコンテンツ制作プロセスを大幅に効率化しています。これにより、個人開発者はより多くの時間をプロダクト開発やコミュニティ運営に充てることが可能になり、スモールビジネスの成長を加速させています。コンテンツ制作の障壁が下がり、多様な個人メディアが生まれる土壌ができています。","source":"Google検索","url":"https://www.google.com/search?q=AI%E3%82%92%E6%B4%BB%E7%94%A8%E3%81%97%E3%81%9F%E3%82%B3%E3%83%B3%E3%83%86%E3%83%B3%E3%83%84%E8%87%AA%E5%8B%95%E7%94%9F%E6%88%90%E3%83%84%E3%83%BC%E3%83%AB%E3%81%8C%E5%80%8B%E4%BA%BA%E3%83%A1%E3%83%87%E3%82%A3%E3%82%A2%E9%81%8B%E5%96%B6%E3%82%92%E5%8A%B9%E7%8E%87%E5%8C%96","impact":"high","tags":["AIツール","コンテンツ生成","個人メディア"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Apple、Vision Proのグローバル展開を加速か","summary":"Appleは、空間コンピュータ「Vision Pro」の販売地域を米国以外にも拡大する準備を進めていると報じられています。日本を含む主要市場への投入が間近とされており、これによりMR（複合現実）デバイス市場の競争がさらに激化することが予想されます。開発者向けには、Vision Pro向けのアプリ開発を促進するための新たなツールやサポートが提供される可能性があります。グローバル展開は、MR技術の普及とエコシステムの拡大に大きく貢献するでしょう。","source":"iPhone Mania","url":"https://iphone-mania.jp/news-578505/","impact":"high","tags":["Apple","Vision Pro","MR"]},{"title":"量子コンピューティングの実用化に向けた研究が加速","summary":"量子コンピューティング分野では、エラー訂正技術の進展と量子ビットの安定性向上が著しく、実用化に向けた研究開発が加速しています。特に、製薬、金融、素材科学といった分野での応用が期待されており、特定の計算問題において従来のスーパーコンピュータを凌駕する可能性を秘めています。IBM、Google、Microsoftなどの大手テック企業が、量子コンピュータの商用化に向けたロードマップを積極的に発表しており、未来の計算技術への期待が高まっています。","source":"IBM Japan","url":"https://www.ibm.com/blogs/solutions/jp-ja/future-of-quantum-computing/","impact":"high","tags":["量子コンピューティング","実用化","研究開発"]},{"title":"サイバーセキュリティ脅威の高度化とAIを活用した防御策の進化","summary":"2026年、サイバー攻撃はAIの悪用によりさらに高度化しており、特にランサムウェアやサプライチェーン攻撃の被害が増加傾向にあります。これに対し、企業やセキュリティベンダーは、AIを活用した脅威検知・分析システムや、自動応答型のセキュリティソリューションの導入を加速させています。ゼロトラストモデルの採用が広がり、多要素認証や行動分析による異常検知が標準的なセキュリティ対策として定着しつつあります。AIは攻撃だけでなく防御においても不可欠なツールとなっています。","source":"トレンドマイクロ","url":"https://www.trendmicro.com/ja_jp/research/24/01/2024-cybersecurity-trends-and-threat-predictions.html","impact":"high","tags":["サイバーセキュリティ","AI防御","脅威検知"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
