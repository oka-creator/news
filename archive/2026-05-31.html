<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年6月1日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年6月1日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Amazon MGM Studiosが生成AIを活用した映像制作に本格参入","summary":"米Amazon MGM Studiosは、生成AIを使った映像制作を支援する新ファンド「GenAI Creators&#039; Fund」を立ち上げ、映像制作に特化したAI制作プラットフォーム「Project Nara」を同時に発表しました。Prime Video向けにアニメシリーズ3本の製作も決定しており、「人間を強化するためのAI」を掲げています。これは、映像業界におけるAIの本格的な導入を示し、クリエイターは新たな制作ツールや資金源を得る機会が増えるでしょう。開発者にとっては、映像制作AIプラットフォームの需要増と関連技術への貢献の機会が生まれます。","source":"映画.com","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGu9o1Y08cnpDgErfRhhFaZySqNK2Sawy1ZdzyAd8rUs7ZILkmaKF5e-fWdCfFpWqX0Ee68d9UvfdQwJf48gXYeEQ1T0RREdvOjliwRoGo5NDCIQYcpaw9L6XEmGQ==","impact":"high","tags":["生成AI","映像制作","Amazon"]},{"title":"NTTが国産LLM『tsuzumi 2 Visionモデル』を発表、複雑な図版入り文書に対応","summary":"NTTは、独自開発の大規模言語モデル（LLM）「tsuzumi 2」のアップデート版として「tsuzumi 2 Visionモデル」を発表しました。このモデルは、複雑な図表やグラフを含む日本語のビジネス文書を画像として読み込み、内容を理解して回答することが可能です。機密情報を扱う企業向けに、1基のGPUで稼働する軽量性を維持しながら業務のデジタル化を推進します。これにより、日本の企業における文書処理の効率化が期待され、LLM開発者は多モーダル対応や軽量化技術の重要性を再認識するでしょう。","source":"ビジネス+IT","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFkt7XKiWUo3z2HfDA678c-JpG7r-z_6cNWONO_NCRrPcTHAoK1rCIm7qDxD62TmMWWBZz8RI08yeARgmGRJ6CI4boZPVwnVgaQfj9OQw5VgO4OgmJsLbOhptnW3N8BcbMIrt8=","impact":"medium","tags":["LLM","NTT","国産AI","多モーダル"]},{"title":"GitHub Copilotが料金体系をAIクレジット制へ移行","summary":"コード生成AIのGitHub Copilotは、2026年6月1日から料金プランを従来の月額制から、トークン使用量ベースのAIクレジット制へ移行すると発表しました。これにより、利用者は使用量に応じた課金となり、法人導入時にはSSO・監査ログ・IP補償が標準で提供されます。この変更は、開発者のコスト管理に直接影響を与え、より効率的なAI利用が求められるようになるでしょう。企業にとっては、より安心してCopilotを導入できるメリットがあります。","source":"JAPAN AI","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQE1VYvagPROW0jKnJ3fgA1ILVpa_fu8SKBfCZknbhY-nCiY1yWo3VHy0TRsWaESiX6kDGlAc7Hgx34MCFku3SoXx0pxIn3h4NigiKRRP9rAfY3tc6TJHfHArvSKag==","impact":"high","tags":["GitHub Copilot","AI開発","料金体系","コード生成AI"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"個人ゲーム開発者のセイド氏が1対1対戦カードゲーム『Caldra』をSteamでリリース","summary":"個人ゲーム開発者のセイド氏は、2026年5月29日に1対1対戦カードゲーム『Caldra』をSteamにて無料リリースしました。本作は、試合中にショップでのカード売買を通じてデッキを育成できる革新的なシステムが特徴で、プレイヤーは共通の初期デッキからスタートし、短期的な盤面制圧と長期的なデッキ育成という戦略的な判断が求められます。これは、個人開発者が独自のアイデアで市場に挑戦し、成功する可能性を示しており、他のインディー開発者にとって大きな刺激となるでしょう。","source":"gamebiz","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHpiMK8UTPdhKgULiACjUbL5-02yC4Vkgfa8lJsOJdpjakbbYmMOPOT8tudmaCq-MWlBz4dI7VVCOwwxHl7CnzeWehVxK3zl63n2pRmM-i_OzvCR3ln9yUH","impact":"medium","tags":["個人開発","インディーゲーム","Steam","カードゲーム"]},{"title":"大学1年生が個人開発した対戦型タイピング練習サイト『タイピング無双』が学校展開へ","summary":"大学1年生の個人開発者である横山誠氏は、ゲームとして遊ぶうちに自然とタイピングが上達する対戦型タイピング練習サイト「タイピング無双」を開発・運営しています。今後は、クラス内で対戦できる形を目指し、学校への展開を本格的に進めていく方針です。この事例は、若手開発者の創造性と社会貢献への意欲を示しており、教育分野における個人開発ツールの可能性を広げます。開発者にとっては、教育市場への参入やゲーミフィケーションの有効性を示す良い例となるでしょう。","source":"ICT教育ニュース","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFXolqu_n_eVAmEb-18b06ZGvq40wljNMZaUIW37axzR_bTPdznuKEVl_jEY4P64Ec_NVUJbJ7mbVh-BcKEHy-X3JRfUqnbrJJT3A73awkd716EhgwBdwsdmU-_XCdwgh2MdcFXbqI=","impact":"medium","tags":["個人開発","教育テック","ゲーミフィケーション","タイピング"]},{"title":"個人開発・インディーハッカー界隈でAIツールの『オーケストレーション』が主流に","summary":"2026年現在、個人開発者やインディーハッカーの間では、複数のコード生成AIツールを役割分担して併用する「オーケストレーション」が主流となっています。例えば、「CursorでIDE作業、Claude Codeで大規模リファクタリング、ChatGPTで設計相談」といった使い分けにより、開発効率と品質を向上させる実践的なアプローチが推奨されています。これは、AIツールの単体利用から複合的な活用へと開発パラダイムが変化していることを示しており、開発者は各AIツールの特性を理解し、最適な組み合わせを見つけるスキルが求められるでしょう。","source":"JAPAN AI","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQE1VYvagPROW0jKnJ3fgA1ILVpa_fu8SKBfCZknbhY-nCiY1yWo3VHy0TRsWaESiX6kDGlAc7Hgx34MCFku3SoXx0pxIn3h4NigiKRRP9rAfY3tc6TJHfHArvSKag==","impact":"high","tags":["AIツール","開発効率","オーケストレーション","インディーハッカー"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Gartnerが2026年の戦略的テクノロジートレンドを発表","summary":"Gartnerが発表した「2026年の戦略的テクノロジのトップ・トレンド」によると、AIネイティブ開発プラットフォーム、AIスーパーコンピューティング・プラットフォーム、マルチエージェント・システム、ドメイン特化言語モデル、フィジカルAIなどが今後のビジネスを形作る主要技術として注目されています。企業はAIを前提とした競争力の再構築へと投資を明確に移しており、これらは変化に強いIT基盤を築くための戦略ツールと位置づけられています。開発者にとっては、これらのトレンド技術への理解とスキル習得がキャリア形成において不可欠となるでしょう。","source":"SHIFT ASIA","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQF67VjD2aMMsujQtdMd8wprHHXuzLcQAML0dcbZEbe0FrILcHyZBvnJOImbvOAGFwdWzDDaRrKgvqWw79BM5zUPU5iK8ua4PzGxeoYlGVjm6Zn6Zj6UpCOnYXEJ5B1oc3u_PnlHyRtN8Fmm0K60k3s4dB_1MbgPoacnQ02KXyHqWHuVcT_vjX-bKWuN7qBxxAAR2SaIwjk8E0Qdlh3-46QZoDcF33hqtYzlRcDDYTDbfqq9zQaQP-9G8cFgwVIPiBtG40X-cpwL68-3-ae2s6MvoQHmd02ihUBA2qNAZZoUHkka","impact":"high","tags":["テクノロジートレンド","Gartner","AIネイティブ","IT戦略"]},{"title":"ITインフラの物理層で革命的変化が進行中：AI、6G、宇宙通信が牽引","summary":"2026年5月、ITインフラは「物理層の革命」とも呼べる劇的な転換期を迎えています。AnthropicとSpaceXの提携による巨大データセンター「Colossus 1」の誕生、次世代通信規格6Gの実用化に向けた動き、AppleとStarlinkによる衛星経由の完全通話サービスの開始、そしてTSMCによる1.4nmプロセス歩留まり目標達成など、ハードウェアと通信技術の進化が加速しています。この変化は、AIの進化を支える基盤技術の飛躍的な向上を意味し、開発者はより高性能なインフラを前提としたアプリケーション設計が可能になるでしょう。","source":"YouTube","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHsBrR-wIihpwVPa-FqjuPxF8fyk4qVYcJwgOQ3IF6zJkk3-lxBrbau3YHDUdQdXWPJ1e02uQqjiwDuVILfEjVit18TF2ANgdSZmebNbSjAMh5m_LzsnAqLp5WEbS7wSCcnyRKEEA==","impact":"high","tags":["ITインフラ","6G","宇宙通信","半導体","データセンター"]},{"title":"静岡県が欧州最大級のスタートアップカンファレンス『VivaTechnology 2026』に初出展","summary":"静岡県は、2026年6月にフランス・パリで開催される欧州最大級のスタートアップカンファレンス「VivaTechnology 2026」に初出展することを発表しました。東京都などの自治体や企業と連携して「JAPAN VILLAGE」を設置し、県内スタートアップの海外展開を支援するとともに、日本の技術力やイノベーションを世界に発信します。この出展は、日本の地方自治体がグローバルなスタートアップエコシステムに積極的に関与する姿勢を示しており、国内のスタートアップ開発者にとって海外市場への足がかりとなる重要な機会を提供するでしょう。","source":"静岡県","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFSuiAWqa1Rwh8E7QihlzQ23glIa5mMTfzkymbmsIxovwsyYtQ2wa0N0OMFxlBYBquf0lntkcYa6PslmADDj2ToVK3TTJ4iuX9oGLe5sTKDS4TqHogTsIJ_dOme2gISz8gY-BilhkCvXPZWYSc4PGxJOynrTQ==","impact":"low","tags":["スタートアップ","国際カンファレンス","地方創生","海外展開"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
