<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月22日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年3月22日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"MicrosoftがAIモデルの著作権保護を強化、法務サポートを拡大へ","summary":"Microsoftは、Copilotなどの生成AIサービスを利用して作成されたコンテンツに関する著作権侵害の訴訟リスクに対し、顧客への法的支援を強化する方針を発表しました。これは、企業がAIの導入を加速させる上で懸念となる著作権問題を軽減し、より安心してAIを活用できる環境を提供することを目的としています。特に、商用利用における法的リスクを懸念する企業にとって、AI導入の障壁を下げる実用的な動きと言えます。この動きは、AIの企業導入を促進し、法的な安心感を提供することで、生成AI市場全体の成長に寄与すると考えられます。","source":"Microsoft Legal","url":"https://www.microsoft.com/en-us/legal/copyright/ai-indemnification","impact":"high","tags":["著作権","生成AI","法務"]},{"title":"Google DeepMind、次世代LLM『Gemini Ultra 2』の開発状況を公開","summary":"Google DeepMindは、次世代大規模言語モデル『Gemini Ultra 2』の開発が順調に進んでおり、特に長文理解能力と多モーダル対応において大幅な改善が見られると発表しました。医療分野での診断支援や、複雑な科学論文の要約など、専門性の高い領域での応用が期待されています。企業は、より高度な情報処理を必要とする業務にGemini Ultra 2の導入を検討することで、業務効率の大幅な向上が見込めます。この進化は、AIが解決できる問題の範囲を広げ、多くの産業に革新をもたらす可能性を秘めています。","source":"Google DeepMind","url":"https://deepmind.google/","impact":"high","tags":["LLM","Google DeepMind","多モーダルAI"]},{"title":"AIを活用したコード生成ツールの進化：開発効率を最大化する新機能","summary":"GitHub CopilotやAmazon CodeWhispererといったAI駆動型コード生成ツールが、新たな機能アップデートを発表しました。これにより、単なるコード補完だけでなく、特定のフレームワークやライブラリに特化した最適化されたコードスニペットの提案、セキュリティ脆弱性を自動検出する機能などが追加されています。個人開発者やスタートアップ企業は、これらのツールを導入することで開発期間を短縮し、より高品質なソフトウェアを迅速に市場投入できるようになります。これらの新機能は、開発者の生産性を飛躍的に向上させ、ソフトウェア開発の未来を形作るでしょう。","source":"GitHub Engineering Blog","url":"https://github.blog/","impact":"medium","tags":["コード生成AI","開発効率","GitHub Copilot"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコードプラットフォームの台頭：個人開発者の成功事例が続々","summary":"BubbleやAdaloといったノーコード・ローコード開発プラットフォームを活用し、短期間で収益性の高いSaaSプロダクトを立ち上げる個人開発者が増加しています。特に、特定のニッチ市場をターゲットにした業務効率化ツールやコミュニティアプリが成功を収めており、開発スキルが限定的でもアイデア次第でビジネスを創出できる可能性が示されています。これから個人開発を始める方にとって、開発コストと時間を大幅に削減できる有効な選択肢となっています。このトレンドは、技術的な背景がない個人でもイノベーションを起こせる機会を広げています。","source":"Indie Hackers","url":"https://www.indiehackers.com/","impact":"high","tags":["ノーコード","ローコード","個人開発"]},{"title":"サブスクリプション型個人開発プロダクトの最新トレンド：マイクロSaaSの収益化戦略","summary":"個人開発者によるマイクロSaaS（Small SaaS）が注目を集めており、特に月額課金モデルで安定した収益を上げるための戦略が共有されています。顧客サポートの自動化、オンボーディングプロセスの改善、コミュニティ構築によるユーザーエンゲージメント強化などが成功の鍵とされており、少人数で運営しながらも持続可能なビジネスモデルを構築するヒントが多数紹介されています。これにより、個人開発者はより効率的に収益を最大化し、長期的なビジネス成長を目指すことができます。マイクロSaaSは、ニッチな市場で大きな価値を生み出す可能性を秘めています。","source":"SaaS Business Media","url":"https://www.saasclub.io/","impact":"medium","tags":["マイクロSaaS","収益化","サブスクリプション"]},{"title":"AIツールを駆使した個人開発：アイデアからリリースまでの高速化","summary":"ChatGPTなどの生成AIをアイデア出し、企画書作成、プロモーション文言生成、さらには一部のコード生成に活用することで、個人開発における開発サイクルを劇的に短縮する手法が広まっています。これにより、限られたリソースの中で複数のプロダクトを並行して開発したり、より迅速に市場のフィードバックを得て改善を進めることが可能になっています。AIツールの活用は、個人開発者が直面する時間とリソースの制約を大きく緩和し、イノベーションのスピードを加速させています。これは、個人開発のあり方を根本から変える可能性を秘めています。","source":"Qiita","url":"https://qiita.com/","impact":"high","tags":["AI活用","開発効率化","個人開発"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"量子コンピューティングの実用化に向けた新たな一歩：エラー訂正技術の進展","summary":"IBMやGoogleなどの主要テック企業が、量子コンピューティングにおける最大課題の一つであるエラー訂正技術において、新たなブレークスルーを発表しました。これにより、より安定した量子ビットの維持が可能となり、実用的な量子コンピュータの実現に向けたロードマップが具体化しつつあります。将来的には、新薬開発、素材科学、金融モデリングなど、従来のコンピュータでは解決困難な問題への応用が期待されます。この技術進展は、量子コンピューティングが社会に与える影響を大きく加速させる重要なマイルストーンです。","source":"IBM Research Blog","url":"https://www.ibm.com/blogs/research/","impact":"high","tags":["量子コンピューティング","エラー訂正","ブレークスルー"]},{"title":"サイバーセキュリティの脅威が多様化：AIを活用した防御策の重要性","summary":"ランサムウェア攻撃やサプライチェーン攻撃が高度化・巧妙化する中、企業はAIを活用したサイバーセキュリティソリューションの導入を加速させています。特に、異常検知、脅威インテリジェンスの自動分析、インシデント対応の迅速化においてAIの活用が進んでおり、従来の防御策だけでは対応しきれない新たな脅威への対策として不可欠なものとなっています。AIは、膨大なデータをリアルタイムで分析し、未知の脅威パターンを特定することで、企業の防御力を大幅に向上させます。この動向は、現代のデジタル環境におけるセキュリティ戦略の根幹をなすものです。","source":"Symantec Security Center","url":"https://www.broadcom.com/info/security/security-center","impact":"high","tags":["サイバーセキュリティ","AI防御","脅威インテリジェンス"]},{"title":"メタバースのビジネス応用が加速：産業分野での導入事例が増加","summary":"エンターテイメント分野だけでなく、製造業におけるリモートコラボレーション、医療分野での手術シミュレーション、小売業でのバーチャルショッピングなど、多様な産業分野でメタバース技術の導入が進んでいます。企業は、メタバースを活用することで、従業員のトレーニング効率向上、顧客体験の変革、新たなビジネスモデルの創出を目指しており、実用的な投資としての側面が強まっています。この動きは、メタバースが単なる仮想空間ではなく、現実世界の課題解決に貢献する強力なツールへと進化していることを示しています。ビジネスにおけるメタバースの可能性は、今後さらに拡大していくでしょう。","source":"Meta for Business Blog","url":"https://www.facebook.com/business/news","impact":"medium","tags":["メタバース","ビジネス応用","産業DX"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
