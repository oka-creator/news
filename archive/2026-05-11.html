<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年5月12日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年5月12日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"AnthropicがSpaceXと提携し、Claudeの計算資源を大幅強化","summary":"AnthropicはSpaceXとの提携により、22万基ものGPUへのアクセスを獲得し、AI業界の計算資源不足に一石を投じました。これにより、Claude Codeのレート上限が2倍になるなど、Claudeユーザーの利用枠が大幅に拡大しています。この動きは、高性能AIモデルの安定的な提供と利用拡大に大きく貢献すると見られています。開発者にとっては、Claudeの利用がより安定し、大規模なAIモデルを効率的に活用できる機会が増えるでしょう。特に、計算資源の確保はAI開発のボトルネックとなっていたため、この提携は業界全体にポジティブな影響を与えます。","source":"Forbes JAPAN 公式サイト（フォーブス ジャパン）","url":"https://forbesjapan.com/articles/detail/70275","impact":"high","tags":["Anthropic","SpaceX","計算資源","GPU"]},{"title":"OpenAIが企業向けAI導入支援を本格展開する「Deployment Company」を設立","summary":"OpenAIは、企業がAIを業務に最大限活用できるよう支援する新会社「OpenAI Deployment Company」を設立しました。AIコンサルティング企業のTomoroを買収し、約150人のAI導入スペシャリストを顧客企業に派遣することで、AI前提の業務フローやシステムの開発・実装を推進します。TPGやソフトバンクなどから40億ドル超の資金を確保しており、企業におけるAI導入の障壁を下げることが期待されます。開発者は、AI導入の専門知識を持つFDEのサポートを受けながら、よりスムーズにAIソリューションを業務に組み込むことが可能になります。これは、AIの社会実装を加速させる重要な一歩と言えるでしょう。","source":"ITmedia NEWS","url":"https://www.itmedia.co.jp/news/articles/2605/12/news057.html","impact":"high","tags":["OpenAI","企業AI導入","AIコンサルティング"]},{"title":"LLMの「ブラックボックス」を解明するデバッグツール「Silico」が登場","summary":"大規模言語モデル（LLM）の内部構造を可視化し、訓練中にパラメーターを調整できる新ツール「Silico」が、スタートアップのGoodfireからリリースされました。これにより、開発者はAIモデルの動作原理をより深く理解し、これまで困難だった欠陥の修正や望ましくない動作のブロックをきめ細かく制御できるようになる可能性があります。このツールは、LLMの信頼性と透明性を向上させ、より安全で予測可能なAIシステムの開発に貢献します。開発者にとっては、AIモデルのデバッグと改善が劇的に容易になる画期的な進展です。","source":"MITテクノロジーレビュー","url":"https://www.technologyreview.jp/s/320146/the-tool-that-can-debug-llms/","impact":"high","tags":["LLMデバッグ","Silico","AI透明性"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"AIエージェント時代の「Cracked Engineer」論とチーム開発の必要性","summary":"AIエージェントの進化により「1人でユニコーンを作れる」といった言説が広まる中、「Cracked Engineerは成立する？ AIエージェントの時代でも『仲間』が必要な理由」という記事が公開されました。AIを駆使する突出した個人エンジニア「Cracked Engineer」の可能性を探りつつも、現代の開発においてチームやコミュニティの重要性が改めて問われています。個人開発者にとっては、AIツールを最大限活用しつつも、複雑なプロジェクトや大規模なサービス開発には依然としてチームの協力が不可欠であるという示唆を与えます。AIが進化しても、人間同士の協業の価値は変わらないという視点が重要です。","source":"ITmedia","url":"https://www.itmedia.co.jp/news/articles/2605/12/news055.html","impact":"medium","tags":["AIエージェント","個人開発","チーム開発"]},{"title":"個人開発における収益化の現実とAIツールの活用事例","summary":"個人開発でアプリをリリースし、収益化を目指す道のりの現実について、具体的な方法と事例が紹介されています。特に、Claude CodeなどのAIツールを活用することで、開発速度が劇的に向上し、最小限のMVP（Minimum Viable Product）で早期に市場投入し、フィードバックを得ながら改善していくアプローチが推奨されています。開発者にとっては、AIツールが開発プロセスを効率化し、少ないリソースでプロダクトを市場に出すための強力な味方となることが示されています。これにより、個人開発のハードルが下がり、収益化への道筋が見えやすくなるでしょう。","source":"note","url":"https://note.com/aperone_yusuke/n/n26f2402167d3","impact":"high","tags":["個人開発","収益化","AIツール","MVP開発"]},{"title":"無料・完全オフラインで利用可能な「ローカルLLM」の進化と個人開発での可能性","summary":"2026年に入り、無料で自分のPC上で動作させられる「ローカルLLM」の性能が大幅に向上しています。OllamaやLM Studioといったツールを使えば、インターネット接続なしでAIを利用でき、情報漏洩のリスクをゼロに抑えながら、要約や翻訳、プログラミング支援などのタスクを実行可能です。これにより、個人開発者はプライバシーを重視したAIアプリケーションの開発や、月額料金なしでのAI活用が可能になります。開発者にとっては、コストやセキュリティの制約を受けずにAI機能を組み込んだアプリケーションを開発できる新たな選択肢が広がり、イノベーションを促進するでしょう。","source":"ギズモード・ジャパン","url":"https://www.gizmodo.jp/2026/05/local-llm-2026.html","impact":"high","tags":["ローカルLLM","オフラインAI","個人開発"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"SK hynixとIntelが次世代パッケージング「EMIB」で協業、AI半導体供給網に変化の兆し","summary":"AI半導体の供給不足が続く中、SK hynixがIntelと次世代パッケージング技術「EMIB」で協業すると報じられました。これにより、TSMC一強だったAI半導体の供給網に大きな変化が生じる可能性があります。GoogleやMetaといった巨大IT企業が、自社のカスタムAIチップ製造にIntelのEMIBを採用する方針を固めつつあるとされており、Intelのファウンドリ事業再建に追い風となるでしょう。開発者にとっては、AI半導体の供給安定化や多様な選択肢の登場が、将来的なAIハードウェアの性能向上やコスト効率化に繋がる可能性があります。これは、AI開発の基盤を支える重要な動きです。","source":"XenoSpectrum","url":"https://xenospectrum.com/2026/05/12/sk-hynix-intel-emib-ai-semiconductor-supply-chain/","impact":"high","tags":["AI半導体","SK hynix","Intel","EMIB"]},{"title":"AIイベント特化プラットフォーム「Weabee」がベータ公開","summary":"AIリスキル株式会社は、AIイベントに特化したプラットフォーム「Weabee」のベータ版を公開しました。全国180施設のAIイベントを、ツール、カテゴリ、地域といった条件で構造化して検索・比較できるのが特徴です。主催者にとっては掲載・受付が完全無料で、既存の申込導線を変更せずに利用できるメリットがあり、AI学習やコミュニティ形成を効率化するツールとして注目されます。開発者やAI学習者にとっては、自身のスキルアップやネットワーキングに役立つイベントを効率的に見つけられる便利なプラットフォームとなるでしょう。これは、AIコミュニティの活性化に貢献します。","source":"PR TIMES","url":"https://prtimes.jp/main/html/rd/p/000000004.000137353.html","impact":"medium","tags":["AIイベント","Weabee","リスキリング"]},{"title":"楽天シンフォニーと米国船級協会、海事業界のサイバーセキュリティ強化へ連携","summary":"楽天グループでサイバーセキュリティ対策などを手掛ける楽天シンフォニーは、American Bureau of Shipping（米国船級協会）と、海事業界のサイバーセキュリティ強化に向けた連携を発表しました。両者は強靭な基盤構築を図り、DX推進なども想定しています。これは、国際的なサプライチェーンにおけるデジタル化が進む中で、サイバー攻撃への対策が喫緊の課題となっていることを示しています。開発者にとっては、海事業界のような重要インフラ分野におけるセキュリティ要件の高まりを理解し、より堅牢なシステム開発が求められるようになるでしょう。これは、広範な産業におけるデジタル化とセキュリティの重要性を浮き彫りにします。","source":"LOGI-BIZ online（ロジビズ・オンライン）","url":"https://logi-biz.com/2026/05/12/post-83864.html","impact":"low","tags":["サイバーセキュリティ","楽天シンフォニー","海事業界"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
