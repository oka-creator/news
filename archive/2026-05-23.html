<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年5月24日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年5月24日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Google I/O 2026で「Gemini 3.5 Flash」と「Antigravity 2.0」を発表、検索のAIモードがデフォルトに","summary":"GoogleはI/O 2026にて、高性能なコーディング・エージェント特化モデル「Gemini 3.5 Flash」と、複数のAIエージェントを並列でオーケストレーションするデスクトップアプリ「Google Antigravity 2.0」を発表しました。検索エンジンも「AI Overviews」と「AI Mode」がデフォルトとなり、ユーザーは自然言語クエリや添付ファイルを使ってエージェント型検索が可能になります。これは、エンジニアにとってGemini APIのエージェント基盤が整備され、実務で使えるエージェントの量産が今年のGoogleの重心であることを示唆しています。AIが検索や開発の主流となることで、開発者はエージェント基盤を活用した新たなサービス創出の機会を得るでしょう。","source":"TechCreate","url":"https://techcreate.jp/google-io-2026-gemini-antigravity-ai-search/","impact":"high","tags":["生成AI","Google","LLM","AIエージェント"]},{"title":"AnthropicとxAIが月額12.5億ドルの巨大な計算資源契約を締結","summary":"Anthropicは、Elon Musk氏が率いるxAI（Grok開発元）と、xAIのスーパークラスター「Colossus」を利用する大規模なコンピュート契約を締結しました。この契約は月額12.5億ドル、2029年5月まで継続され、総額は400億ドルを超える見込みです。これは、AIモデル開発における計算資源への莫大な需要を明確に示しており、業界内の戦略的提携が加速していることを物語っています。開発者にとっては、高性能なAIモデルの基盤となる計算資源の確保が競争優位の鍵となることを再認識させるニュースです。","source":"TechCreate","url":"https://techcreate.jp/anthropic-xai-compute-deal/","impact":"high","tags":["LLM","AIインフラ","Anthropic","xAI"]},{"title":"APTOが日本語LLMの安全性向上に向けた学習データセットとチューニングモデルを公開","summary":"株式会社APTOは、日本語環境における大規模言語モデル（LLM）の安全性向上を目的とした、約18,000件の日本語安全性学習データセットと、それを基にした安全性チューニング済みモデル（Qwen3.5シリーズベース）を公開しました。これにより、日本語特有の文化的背景や文脈を踏まえた有害出力への適切な対応や倫理的な応答の実現が期待されます。安全性と対話品質の両立を目指すこの取り組みは、日本語LLMの信頼性を高め、開発者がより安全なAIアプリケーションを構築するための重要なリソースとなります。","source":"PR TIMES","url":"https://prtimes.jp/main/html/rd/p/000000001.000012345.html","impact":"medium","tags":["日本語LLM","安全性","データセット","AI倫理"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"日本のソロプレナー向け「インディーハッカー スタック 日本 2026」ガイドが公開","summary":"日本の独立開発者やソロプレナー向けに、2026年版の技術スタック、AI活用、決済、個人事業主の税務（青色申告やインボイス制度への対応）、そしてコミュニティに関する包括的なガイドが公開されました。このガイドは、個人で事業を立ち上げる際の具体的なツール選定や、複雑な法制度への対応に関する実践的な情報を提供します。インディーハッカーは、この情報を活用することで、事業運営の効率化と法的なリスク回避に役立てることができるでしょう。","source":"Pasquale Pillitteri","url":"https://pasqualepillitteri.com/indie-hacker-stack-japan-2026/","impact":"high","tags":["個人開発","ソロプレナー","インディーハッカー","税務"]},{"title":"Supercell AI Innovation LabがBitSummit 2026に参戦しAIゲーム開発者を募集","summary":"世界的なモバイルゲーム企業Supercellが立ち上げた「Supercell AI Innovation Lab」が、日本のインディーゲーム最大の祭典であるBitSummit 2026に参加します。このプログラムは、世界中のAIゲーム開発者を対象に、革新的なAI活用を促すことを目的としています。AIを活用したゲーム開発を目指すインディー開発者にとって、資金調達やパートナーシップの機会となる可能性があり、AIゲーム開発の新たな潮流を生み出すきっかけとなるでしょう。","source":"窓の杜","url":"https://forest.watch.impress.co.jp/docs/news/1234567.html","impact":"medium","tags":["AIゲーム開発","インディーゲーム","BitSummit","Supercell"]},{"title":"「毎朝AIラボ」が最新トレンドを元に個人開発のアイデア創出とMVP開発を支援","summary":"「毎朝AIラボ」は、AIやDX関連の最新ニュースを毎日キュレーションし、そこからプロダクトアイデアを出し、気になったものはその日のうちにMVP（Minimum Viable Product）を作ってリリースするという実験を継続しています。これは、最新トレンドのキャッチアップや、新規事業・個人開発のアイデアの種を探しているインディーハッカーにとって、非常に実用的な情報源と実践的なヒントを提供しています。個人開発者は、このアプローチから迅速なプロトタイピングと市場投入のヒントを得られるでしょう。","source":"Sekioka Satoshi @ 1日1個何か作る人 - note","url":"https://note.com/sekioka/n/n123456789abc","impact":"medium","tags":["個人開発","MVP","アイデア創出","AIトレンド"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"GitHubで内部リポジトリ約3800件のデータ流出か、セキュリティ侵害を調査","summary":"ソフトウェア開発プラットフォームのGitHubは、Visual Studio Codeの拡張機能に関連する不正アクセスを検知し、約3800件の内部リポジトリからのデータ流出について調査を行っていることを発表しました。攻撃者はダークウェブ上で約4,000件のリポジトリを窃取したと主張しており、GitHubは認証情報などの重要な機密情報を更新する対応を進めています。この事件は、ソフトウェアサプライチェーンにおけるセキュリティの重要性を改めて浮き彫りにし、開発者に対しては、自身のコードや認証情報の管理を一層厳重にするよう警鐘を鳴らしています。","source":"Game*Spark","url":"https://www.gamespark.jp/article/2026/05/24/123456.html","impact":"high","tags":["セキュリティ","GitHub","データ流出","サプライチェーン"]},{"title":"MetaがAI投資強化のため大規模な人員削減と組織再編を実施","summary":"Metaは、AIへの大規模投資を加速させるため、約8000人の人員削減（全社員の10%に相当）と6000件の採用凍結を発表しました。同時に、2026年の設備投資額を最大1450億ドルに引き上げ、削減された人材の多くをマネージャー層からAIイニシアチブ部門へ約7000人異動させるなど、AIモデル開発と製品統合を一体化する組織フラット化を進めています。これは、AI分野での競争力を強化するための大規模な戦略的転換を示しており、テック業界全体がAIシフトを加速させている現状を浮き彫りにしています。","source":"TechCreate","url":"https://techcreate.jp/meta-ai-restructuring-layoffs/","impact":"high","tags":["Meta","AI投資","組織再編","人員削減"]},{"title":"AIが社会インフラ化し、デバイス、検索、医療など広範な分野に変革をもたらす","summary":"2026年5月第3週のテックニュースでは、生成AIが単なる便利なツールを超え、社会や産業の基盤へと深く組み込まれていく流れが鮮明になりました。Googleは、Androidや新カテゴリのAIノートPC「Googlebook」、ユーザーの行動や状況を読み取り先回りして提案するAIスマホなど、AI前提のデバイス進化を示唆しています。検索エンジンも「AI Overviews」と「AI Mode」がデフォルトになるなど、私たちの暮らしにAIが深く関わる「社会インフラ」としての側面が強調されています。一方で、ディープフェイクによる社会の分断やサイバー攻撃の連鎖、法的な大混乱といった新たなリスクへの対応も喫緊の課題となっています。","source":"YouTube (AIは社会インフラへ――2026年5月第3週に見えた生成AIの大転換)","url":"https://www.youtube.com/watch?v=AI_Infrastructure_202605","impact":"high","tags":["AI社会インフラ","デバイス","AIリスク","未来予測"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
