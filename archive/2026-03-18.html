<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月19日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年3月19日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"OpenAIの軽量モデル「GPT-5.4 nano」がリリース","summary":"株式会社SUPERNOVAは、OpenAIが2026年3月17日に発表した最新軽量モデル「GPT-5.4 nano」を自社の生成AIサービス「Stella AI」および「Stella AI for Biz」に提供開始しました。このモデルは処理速度とコスト効率に最適化されており、テキスト生成、要約、翻訳、分類、データ抽出といった日常的なタスクにおいて、高速かつ高品質な応答を実現します。素早い応答が求められる場面や、手軽に最新AIを活用したい企業にとって実用的な選択肢となります。開発者にとっては、より低コストで高速なAI機能をアプリケーションに組み込むことが可能になり、ユーザー体験の向上に貢献するでしょう。","source":"PR TIMES","url":"https://prtimes.jp/main/html/rd/p/000000005.000137257.html","impact":"high","tags":["生成AI","LLM","OpenAI","コスト効率"]},{"title":"楽天グループが日本語特化の大規模AIモデル「Rakuten AI 3.0」を提供開始","summary":"楽天グループは、経済産業省とNEDOの「GENIAC」プロジェクトの一環として、国内最大規模のAIモデル「Rakuten AI 3.0」の提供を開始しました。Apache 2.0ライセンスで無償公開され、日本語の語彙・表現、日本の文化・価値観、大学院レベルの推論能力などを強化しているのが特徴です。行政文書の作成補助や窓口業務の自動化など、日本語に特化した高精度なAI活用を求める組織にとって非常に実用的な選択肢となります。開発者は、オープンソースであるこのモデルを利用して、日本語に最適化されたAIアプリケーションを開発・導入しやすくなるでしょう。","source":"Impress Watch","url":"https://www.watch.impress.co.jp/docs/news/1576402.html","impact":"high","tags":["国産AI","LLM","オープンソース","日本語特化"]},{"title":"デジタル庁が政府向けAI「ガバメントAI（源内）」に国産LLM7モデルを選定","summary":"デジタル庁は、政府のAI利用環境「ガバメントAI（源内）」で試用する国産の大規模言語モデル（LLM）として、NTTの「tsuzumi 2」やKDDI・ELYZAの「Llama-3.1-ELYZA-JP-70B」など計7モデルを選定しました。全府省庁の約18万人の職員を対象とした大規模な実証実験が2026年5月頃に開始され、行政文書作成補助や情報抽出など多岐にわたる業務での有効性が評価されます。これにより、機密データの取り扱いやすさや日本語特有の表現への適応力、経済安全保障の観点から国産AIの活用が加速します。国産LLMの開発者にとっては、政府機関での採用という大きな市場機会が生まれ、技術のさらなる発展と信頼性向上へのインセンティブとなるでしょう。","source":"Impress Watch","url":"https://www.watch.impress.co.jp/docs/news/1572005.html","impact":"high","tags":["国産AI","LLM","政府利用","実証実験"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"個人開発者フィア氏が心理戦ゲームPF兼ゲームエンジン『心理戦デスゲーム～騙シアイブラウザゲーム～』をリリース","summary":"個人開発者のフィア氏は2026年3月16日、心理戦のデスゲームを体験できる新しいゲームプラットフォーム兼ゲームエンジンとなるブラウザゲームサイトの正式版を配信しました。基本無料で遊べるゲームは全てRound制の心理戦ボードゲームで、プレイヤーは選択肢を選びながら勝利条件達成を目指します。また、自分のアイコンや立ち絵をアップロードしてゲーム内に登場させられる機能や、環境構築不要で独自の心理戦ゲームを制作できるビジュアルプログラミング言語が特徴です。これはVtuberや実況者、心理戦ゲーム愛好家にとって新たな創造と交流の場を提供し、個人開発者にとっては、独自のゲームエンジンを開発し、それをプラットフォームとして提供する成功事例として参考になるでしょう。","source":"gamebiz.jp","url":"https://gamebiz.jp/news/366318","impact":"medium","tags":["個人開発","ゲームエンジン","ブラウザゲーム","ビジュアルプログラミング"]},{"title":"Indie Hackersで創業者向けAIエージェント開発のフィードバック募集が話題に","summary":"インディーハッカーのコミュニティでは、「創業者向けのワークフローを24時間365日実行するAIエージェントを構築中であり、フィードバックを求めている」という投稿が注目を集めています。これは、AIを活用してビジネス運営の効率化を目指す個人開発者にとって、具体的なアイデアや検証プロセスを学ぶ良い機会を提供するとともに、自身のプロジェクトにAIエージェントを組み込む際の参考にできる実用的な情報源となります。開発者は、このようなコミュニティでの情報共有を通じて、自身のAIプロジェクトの方向性を検討したり、潜在的なユーザーからの貴重な意見を得たりすることができます。","source":"Indie Hackers","url":"https://www.indiehackers.com/post/im-building-a-24-7-ai-agent-that-runs-workflows-for-founders-looking-for-feedback-08149171f2","impact":"medium","tags":["AIエージェント","Indie Hackers","フィードバック","ビジネス効率化"]},{"title":"個人開発者がWebサービス公開後に偽の開発者アカウント出現に注意喚起","summary":"Zennにて、ある個人開発者が自身がリリースしたWebサービスの開発者を名乗る見知らぬアカウントがSNS上に現れた事例を共有し、注意を促しました。このケースでは、AIエージェントによる開発の高速化で動作確認が追いつかない中で、偽アカウントがRedditへの投稿内容を転載し、自身のプロフィールに「Developer」と記載していました。個人開発者にとって、リリース後のブランド保護や情報発信の管理の重要性を再認識させる実用的な教訓となります。開発者は、自身のプロジェクトの知的財産権やブランドイメージを守るために、リリース後の情報監視や公式アカウントの明確化といった対策を講じる必要性を学ぶことができます。","source":"Zenn","url":"https://zenn.dev/satetsu888/articles/a7940183b51608","impact":"low","tags":["個人開発","ブランド保護","SNS","セキュリティ"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Google Gemini for Homeが2026年3月のアップデートで応答時間を40%高速化","summary":"Googleは、スマートホームアシスタント「Gemini for Home」の2026年3月アップデートで、応答時間を約40%高速化しました。これにより、照明の点灯などの基本的なコマンド処理が迅速になり、音声アシスタントがより自然で応答性の高いものになります。また、アラームやタイマー機能も強化され、実世界のイベントに基づいたアラーム設定が可能になるなど、スマートホーム体験が向上します。スマートホームデバイスやAIアシスタント関連の開発者にとっては、ユーザー体験の向上に直結するパフォーマンス改善の重要性を示しており、今後の開発におけるベンチマークとなるでしょう。","source":"Gizmochina","url":"https://www.gizmochina.com/2026/03/18/google-gemini-for-home-40-faster-response-time/","impact":"medium","tags":["スマートホーム","Google Gemini","AIアシスタント","パフォーマンス改善"]},{"title":"2026年第1四半期もテック業界のレイオフが継続、AIが要因の一つに","summary":"2026年第1四半期もMetaやAmazonなどの大手テック企業で大規模なレイオフが続いており、AtlassianのようにAIが人員削減の要因として挙げられています。RationalFXの調査によると、1月以降に45,000人以上の雇用が削減され、AIによる自動化とコスト削減策がこの傾向を加速させています。これは、AI技術の進化が労働市場に与える影響を考える上で重要な情報であり、今後のキャリアプランやスキルアップを検討する上で注目すべきトレンドです。開発者は、AIによる自動化が進む中で、自身のスキルセットを再評価し、AIと共存・協調できる能力を身につける必要性を認識するでしょう。","source":"Times of India","url":"https://timesofindia.indiatimes.com/gadgets-news/tech-layoffs-meta-amazon-and-other-companies-cutting-jobs-in-2026/articleshow/108589083.cms","impact":"high","tags":["テック業界","レイオフ","AIの影響","労働市場"]},{"title":"パナソニックHDが視覚検査向けAIプラットフォームのグローバルライセンス提供を開始","summary":"パナソニック ホールディングスは2026年3月13日、傘下のパナソニックR&amp;Dセンターシンガポールが開発した視覚検査向けAIプラットフォームのグローバルでのライセンス提供を開始しました。このプラットフォームは、インフラ点検、工事品質検査、工場安全管理、生産ライン品質検査など、多岐にわたる現場業務の自動化と高度化に貢献します。高性能なAIをスピーディに提供することで、さまざまな産業のDX推進を支援する実用的なソリューションとして期待されます。開発者にとっては、産業分野におけるAI活用の具体的な事例として参考になり、特定の業界向けAIソリューション開発のヒントとなるでしょう。","source":"Panasonic Newsroom","url":"https://news.panasonic.com/jp/press/jn260313-2","impact":"medium","tags":["産業AI","DX推進","視覚検査","AIプラットフォーム"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
