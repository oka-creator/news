<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年8月4日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年8月4日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"MiniMax、2Kマルチモーダル動画生成モデル「H3」のオープンウェイトを公開","summary":"中国のMiniMaxが、2K解像度の動画生成モデル「H3」のモデルウェイトをHugging Faceで公開しました。H3は4～15秒の2K解像度動画（24fps、32kHzステレオ音声）を出力できる33Bパラメータのオムニモーダルモデルです。テキスト、画像、動画、音声を同時に参照しながら動画を生成できる点が特徴です。これにより、これまで有料サービスでしか利用できなかった高品質な動画生成技術が、研究者や開発者にとってローカル環境で利用可能となり、動画生成AIのオープンソース化が本格的に進むと期待されています。これは動画生成AI分野の民主化を加速させる重要な一歩と言えるでしょう。","source":"Hugging Face","url":"https://huggingface.co/MiniMaxAI/MiniMax-H3","impact":"high","tags":["動画生成AI","マルチモーダル","オープンソース"]},{"title":"GMO NIKKO、国内初の総合AIO（生成AI最適化）対策ツールを提供開始","summary":"GMOインターネットグループのGMO NIKKOが、生成AI時代における企業情報の可視性を最適化するサービス「GMO AI最適化ブースト」において、国内初の総合AIO対策ツールを2026年8月3日より提供開始しました。このツールは、ChatGPTやGeminiなどの生成AIにおいて、企業や製品に関する情報が正確かつ優先的に言及・引用されるよう最適化を図ります。AIO対策に必要なデータの収集・分析・改善を一元化し、自社情報が生成AIにどの程度反映されているかを可視化・改善できる環境を提供します。これにより、企業は生成AI上でのブランドプレゼンスを効果的に管理できるようになります。","source":"GMO NIKKO","url":"https://koukoku.jp/service/aio","impact":"medium","tags":["AIO","SEO","企業マーケティング"]},{"title":"EU AI法が本格執行、カリフォルニア州もAI透明性法を施行","summary":"2026年8月2日、EUのAI法（AI Act）の重要な規定が本格的に運用され始め、汎用AIモデル提供者に対する執行権限が欧州委員会に与えられました。同時に、チャットボットがAIであることをユーザーに伝える義務や、ディープフェイクへのラベル表示、AI生成コンテンツへの機械可読な標識の埋め込みなどが義務化されました。また、同じ日にはカリフォルニア州のAI透明性法も施行され、月間100万ユーザーを超える事業者に対し、無料で使える公開検知ツールの用意などが求められます。これにより、AI開発は「性能」だけでなく「法令順守」が不可欠な時代へと突入し、世界的なAI規制の動きが加速しています。","source":"Note (m_hiroki)","url":"https://note.com/m_hiroki/n/na8c9096181f2","impact":"high","tags":["AI規制","EU AI法","透明性"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"コードが書けない25歳女性がAIだけで作ったアプリを2ヶ月で月5000万円に","summary":"コーディング経験ゼロの25歳女性サラ・パール氏が、AIツールのみを活用して開発した自己啓発系アプリが、わずか2ヶ月で月間収益5000万円を突破したと報じられました。この事例は、AIの進化が個人開発者、特に非プログラマーにとって、アイデアを迅速に具現化し、大きな収益を上げる機会を創出していることを示す顕著なものです。AIを活用することで、技術的な障壁が低くなり、誰もがクリエイターとして成功できる可能性が広がっていることを示唆しています。これは、今後の個人開発のあり方を大きく変える可能性を秘めています。","source":"みんなのニュースレター","url":"https://minnano-newsletter.com/posts/ai-app-success-story-aug-2026","impact":"high","tags":["ノーコード","AI活用","アプリ開発"]},{"title":"インディーゲーム『Garbage Growth』がほとんど宣伝なしで大ヒット","summary":"ゲーム開発者のapepatrick氏が6月23日にリリースしたインディーゲーム『Garbage Growth』が、ほとんどマーケティングを行わなかったにもかかわらず、想定をはるかに超える売上を記録し、開発者を驚かせました。ウィッシュリスト登録数は少なかったものの、プレイヤーからのフィードバックを重視し、RedditやX（旧Twitter）での投稿、Webブラウザ版デモの公開などを通じてコミュニティと積極的に交流したことが成功の要因とみられています。この事例は、大規模な宣伝費をかけずとも、コミュニティとの密な連携がインディーゲームの成功に繋がることを示しています。","source":"Automaton Media","url":"https://automaton-media.com/articles/newsjp/20260627-444732/","impact":"medium","tags":["インディーゲーム","コミュニティマーケティング","ゲーム開発"]},{"title":"日本語アプリで月50万円、合計で月70万円を達成した個人開発者の事例","summary":"ある個人開発者が、日本語アプリ単体で月50万円超え、合計で月70万円の収益を達成したと報告しました。先月はマーケティングにかなり力を入れた結果が出たとしており、特に日本語市場に特化したアプリでの成功は、ニッチな市場でも適切な戦略と努力によって大きな成果を上げられることを示しています。この事例は、特定の言語圏や市場に焦点を当てることで、個人開発者でも安定した収益を確保できる可能性を示唆しています。ローカライズされたアプリ開発の重要性を再認識させるものです。","source":"みんなのニュースレター","url":"https://minnano-newsletter.com/posts/ai-app-success-story-aug-2026","impact":"medium","tags":["日本語アプリ","ニッチ市場","収益化"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"米国の州がデータセンター税制優遇の廃止へ、AI計算コスト7%以上上昇の試算","summary":"米国の複数の州がデータセンターへの税制優遇措置を廃止する動きを見せており、これによりAIの計算コストが7%以上上昇するとの試算が発表されました。この動きは、AI開発やクラウドサービス提供に大きな影響を与える可能性があります。特に電力消費量の多いAIデータセンターの運営コスト増加は、今後のAIインフラ投資戦略に再考を促すことになりそうです。企業はコスト増加を吸収するか、他の地域への移転を検討する必要が出てくるかもしれません。","source":"YouTube (R_0_b_f_w_o)","url":"https://www.youtube.com/watch?v=R_0_b_f_w_o","impact":"high","tags":["データセンター","税制優遇","AIコスト"]},{"title":"米国株式市場、AI・大型テック主導の全面高を記録","summary":"2026年8月3日の米国株式市場は、S&amp;P500が1.48%高、ダウが1.32%高と続伸し、AIへの期待が継続する中でオラクル、メタ、マイクロソフトなどの大型テック株が軒並み急伸しました。一方で医薬などのディフェンシブ株は売られるなど、成長期待の高いAI関連へと資金がシフトする典型的なローテーションが見られました。これは、投資家がAI分野の将来性に強い確信を持っていることを示しており、今後もAI関連企業への資金流入が続く可能性が高いです。市場全体のトレンドをAIが牽引している状況が浮き彫りになりました。","source":"LIMO Media","url":"https://limo.media/articles/-/50361","impact":"high","tags":["株式市場","AI投資","テック株"]},{"title":"Xboxの欧州での値上げが発効、最大200ユーロ引き上げ","summary":"Xboxの欧州における値上げが発効され、最大で200ユーロの価格引き上げとなりました。これは、半導体不足や製造コストの上昇、あるいはAIデータセンター向けのメモリー需要急増が家庭用ゲーム機の価格にまで波及した象徴的な事例とみられています。AI分野の急速な成長が、直接的ではないものの、サプライチェーン全体に影響を与え、最終消費財の価格にも影響を及ぼしていることを示唆しています。消費者にとっては、AIの進化が身近な製品価格に影響を与える一例として注目されます。","source":"YouTube (R_0_b_f_w_o)","url":"https://www.youtube.com/watch?v=R_0_b_f_w_o","impact":"medium","tags":["ゲーム機","価格上昇","サプライチェーン"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
