<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月8日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年3月8日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"OpenAIが「GPT-5.3 Instant」と「GPT-5.4」をリリース","summary":"OpenAIは、ChatGPTの主力モデルを「GPT-5.3 Instant」と「GPT-5.4」に刷新しました。GPT-5.3 Instantは、日常会話の自然さや文脈理解を向上させ、不必要な拒否反応や冗長な前置きを抑制し、Web検索を伴う回答も改善されています。このモデルは無料プランを含む全ChatGPTユーザーに提供され、開発者にとってはより洗練された対話体験をアプリケーションに組み込む機会となります。一方、フラッグシップモデルのGPT-5.4は「Stella AI」でも提供が始まり、プロフェッショナル業務への対応力と回答の正確性が大幅に強化され、ハルシネーション発生率が旧モデル比33%低減したと報告されており、AIを活用したプロダクト開発の信頼性向上に寄与するでしょう。","source":"ITmedia PC USER","url":"https://www.itmedia.co.jp/pcuser/articles/2603/08/news027.html","impact":"high","tags":["生成AI","LLM","OpenAI","ChatGPT"]},{"title":"デジタル庁が「ガバメントAI」向け国産LLM7件を選定","summary":"デジタル庁は、政府・官公庁向けの「ガバメントAI」で試用する国産大規模言語モデル（LLM）として、NTTデータの「tsuzumi 2」やKDDI/ELYZAの「Llama-3.1-ELYZA-JP-70B」など7件を選定しました。これにより、日本語や日本の文化・価値観に特化したLLMの活用が推進され、国内AI開発エコシステムの支援が強化されます。デジタル庁は2026年8月頃からこれらのLLMの試用を開始する予定で、政府機関におけるAI導入の本格化は、関連技術やサービスの需要を高め、開発者にとっては新たなビジネスチャンスや技術貢献の場が生まれる可能性があります。この動きは、公共部門におけるAIの信頼性とセキュリティ確保に向けた重要な一歩となります。","source":"ASCII.jp","url":"https://ascii.jp/elem/000/004/252/4252179/","impact":"medium","tags":["国産LLM","ガバメントAI","デジタル庁","AI政策"]},{"title":"Google NotebookLMがノートをAI動画に変換する新機能「Cinematic Video Overviews」を発表","summary":"Googleは、AIリサーチアシスタントNotebookLMに新機能「Cinematic Video Overviews」を導入しました。この機能は、ユーザーがアップロードした文書やノートを、アニメーションを用いた動画に変換するもので、Gemini 3がナラティブ構成を、Veo 3が動画出力を担当するAIモデルの分業体制が特徴です。生成される動画はユーザー提供のソースのみを根拠とするためハルシネーションが起きにくく、ソース引用が埋め込まれることで情報の信頼性が担保されます。この技術は、情報整理やプレゼンテーションの効率を大幅に向上させ、開発者にとってはAIを活用した新しいコンテンツ生成や情報可視化ツールの可能性を示唆しています。","source":"note (Yasuhito Morimoto)","url":"https://note.com/yh_morimoto/n/n2b2d3e4f5a6b","impact":"medium","tags":["Google AI","動画生成","NotebookLM","Gemini"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"「2026年は個人開発が最も活発になる年になる」と予測","summary":"フロントエンドエンジニアのhisa氏が、2026年に個人開発者が激増し、過去最も活発な年になると予測しています。この背景には、AI開発ツールの劇的な進化があり、CursorやGitHub Copilot、Claude、ChatGPTなどが「コードを書く補助」から「プロダクトを一緒に作るパートナー」へと変化したことが挙げられます。これにより、仕様駆動開発の実現、エラー解決のスピードアップ、学習コストの低下がもたらされ、個人開発のハードルが大幅に下がりました。開発者にとっては、アイデアを迅速に形にできる環境が整い、より多くの人がクリエイティブな活動に挑戦しやすくなるでしょう。","source":"note (hisa)","url":"https://note.com/hisa_dev/n/n63f2e7a1b0c0","impact":"high","tags":["個人開発","AI開発ツール","インディーハッカー","生産性向上"]},{"title":"短編ホラーゲーム「Push Pray Devote」がSteamで配信開始","summary":"個人開発者のActor氏が、短編ホラーゲーム「Push Pray Devote」をSteamで配信開始しました。このゲームは、ボタンを押して祈り、生成物を捧げるという単純作業が特徴で、ゲームスキルを問わずに楽しめるシンプルな作品として紹介されています。価格は350円（税込）で、リリース記念セールとして期間限定で10%オフで購入可能です。このような個人開発によるユニークな作品の登場は、インディーゲーム市場の多様性を示し、他の個人開発者にも創作意欲を刺激する事例となるでしょう。","source":"4Gamer.net","url":"https://www.4gamer.net/games/999/G999905/20260306059/","impact":"low","tags":["インディーゲーム","ホラーゲーム","Steam","個人開発"]},{"title":"1990～2000年代のネット文化を再現した「架空のオカルトスレ」が公開中","summary":"個人制作サークル「siosai」のsio氏が、1990年代後半から2000年代初頭のインターネット文化をテーマにしたWeb完結型ARG『【あああch】オカルトスレを騒がせた「ダムに沈んだ村から届いた手紙」』を公開しました。プレイヤーはWeb上の資料や掲示板ログを読み解き、特定のワードを入力してゲームを進める形式です。この作品は、匿名掲示板やホラーフラッシュ、都市伝説スレッドといった当時のネット文化を忠実に再現しており、ホラー/ドラマ/オカルト要素も含まれています。このようなノスタルジックかつインタラクティブなコンテンツは、特定の層に深く響き、個人開発の多様な表現方法を示す好例であり、Web技術とストーリーテリングの融合に関心のある開発者にとって参考になるでしょう。","source":"電ファミニコゲーマー","url":"https://news.denfaminicogamer.jp/news/260307e","impact":"low","tags":["ARG","Webゲーム","ネット文化","個人制作"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"DeNAが自律型AI「Devin」を全社員に導入、国内最大級の全社活用フェーズへ","summary":"株式会社ディー・エヌ・エー（DeNA）は、自律型AI「Devin Enterprise」を全社員2,000人以上に導入し、国内最大級の全社活用フェーズに移行しました。DeNAは3段階の導入プロセスを経て、自社クラウド内展開やアカウント管理の課題を解消し、全社導入を実現しています。今後は、ソフトウェア開発プロセスの抜本的な変革を目指すとともに、社内ワークショップを通じてDevinの最適な利用方法を浸透させる方針です。この大規模なAI導入は、企業の生産性向上と開発効率化の新たなモデルを提示し、他の企業や開発者にとってもAIツールのエンタープライズ導入における重要な先行事例となるでしょう。","source":"株式会社ディー・エヌ・エー","url":"https://dena.com/jp/press/4934","impact":"high","tags":["Devin","AI導入","DeNA","企業DX"]},{"title":"HuaweiがAI時代のネットワークインフラ「AI Fabric 2.0」を発表","summary":"通信機器大手のHuaweiは、AI時代のネットワークインフラを想定した「Xinghe AI Fabric 2.0」を発表しました。AIの進化に伴い、ネットワークやクラウドといったAIを支えるインフラの重要性が増しており、この発表はAIインフラ競争の加速を象徴しています。AIが人間の感覚領域にまで広がりを見せる中で、IT業界全体が「AI中心の時代」へと変化しており、AIインフラの整備は今後も重要なキーワードとなるでしょう。開発者にとっては、AIアプリケーションの性能を最大限に引き出すための基盤技術として、このようなネットワークインフラの進化に注目し、その特性を理解することが求められます。","source":"note (ITニュースまとめ)","url":"https://note.com/it_news_daily/n/n2b2d3e4f5a6b","impact":"medium","tags":["Huawei","AIインフラ","ネットワーク","クラウド"]},{"title":"Yahoo! JAPANアプリ、生成AIを活用し関心に沿ったイベント予定を掲出する「AIピックアップ」を提供開始","summary":"LINEヤフー株式会社は、「Yahoo! JAPAN」アプリで、生成AIを活用した新機能「AIピックアップ」の提供を開始しました。この機能は、SNS（X旧Twitter）の情報をもとにユーザーの関心に沿ったイベント予定情報を掲出するもので、「Yahoo!リアルタイム検索」と連携し、Xのポストを生成AIが要約・分類します。これにより、ユーザーはフォローしているテーマに関連する「商品の発売」や「イベントの開催」などの見落とせない情報を「アシスト」上のおすすめイベントとしてまとめて把握できるようになります。開発者にとっては、生成AIとリアルタイムデータ連携によるパーソナライズされた情報提供の新たなユースケースとして、その実装やUX設計が参考になるでしょう。","source":"LINEヤフー株式会社","url":"https://www.lycorp.co.jp/ja/news/pr/2026/0306001/","impact":"medium","tags":["Yahoo! JAPAN","生成AI","パーソナライズ","情報キュレーション"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
