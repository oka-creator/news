<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年6月19日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年6月19日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Midjourneyが医療分野に進出、全身スキャン可能な「Midjourney Scanner」を開発中","summary":"画像生成AIで知られるMidjourneyが「Midjourney Medical」という新部門を設立し、医療機器開発に乗り出しました。開発中の「Midjourney Scanner」は、わずか30秒で全身をスキャンし、体内の3Dマップをミリメートル単位で作成できる画期的なデバイスです。MRIの100倍のスピードでの3Dマップ作成を謳っており、2027年末頃にはサンフランシスコに体験スパを設置する予定です。医療グレードの機器としてFDAの承認を目指しており、AIが医療診断の効率と精度を劇的に向上させる可能性を示唆し、開発者にとっては新たな市場と技術応用への道を開くものです。","source":"GIGAZINE","url":"https://www.midjourney.com/medical","impact":"high","tags":["生成AI","医療AI","Midjourney"]},{"title":"Adobe Creative Cloud全体でAIエージェントが利用可能に、Firefly AIアシスタントも強化","summary":"アドビが、有料サブスクリプションサービス「Adobe Creative Cloud」にAIエージェント機能を全面的に導入しました。これにより、Premiere、Photoshop、Illustratorなどの各アプリで、自然言語による指示で複数の作業工程を自動化できるようになります（パブリックβ版として提供）。また、生成AI「Adobe Firefly」のアシスタント機能も大幅に強化され、アセット検索機能やユーザーの好みを学習するパーソナライズ機能が追加されています。これによりクリエイターの作業効率が大幅に向上し、開発者にとってはAIを活用したクリエイティブツールの進化が加速する兆候と言えます。","source":"ITmedia PC USER","url":"https://www.itmedia.co.jp/pcuser/articles/2606/18/news093.html","impact":"medium","tags":["Adobe","AIエージェント","Creative Cloud"]},{"title":"Anthropic、AIデザインツール「Claude Design」を大規模アップデート、Code連携を強化","summary":"Anthropicは、AIデザインツール「Claude Design」をアップデートし、同社のコーディング支援AI「Claude Code」とのシームレスな連携を可能にしました。これにより、キャンバス上での直接編集機能が追加され、ユーザーが指定したデザインシステムをプロジェクト横断で利用できるようになります。GitHubリポジトリやデザインファイル、画像などから複数のデザインシステムを取り込み、組織のデザインガイドラインに沿った統一されたデザイン作成が容易になります。この連携強化は、デザインと開発の間のギャップを埋め、開発者がより効率的にデザインを実装できる環境を提供します。","source":"Impress Watch","url":"https://www.watch.impress.co.jp/docs/news/1794793.html","impact":"medium","tags":["Anthropic","AIデザイン","Claude"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"『アーマード・コア』ファンが8年かけて開発したメカ・アクションゲーム『オメガフェネクス』のクラファンページ公開","summary":"個人開発者のするめまんじゅう氏が、人気ゲーム『ARMORED CORE for Answer』に影響を受け、8年の歳月をかけて制作中のハイスピードメカシューティングゲーム『OMEGA PHENEX COMMENCED PROJECT SIX』（通称『オメガフェネクス』）のクラウドファンディング支援ページをCAMPFIREで公開しました。Steamでは既にオープンベータテストが開催されており、参加者数は6万8000人、ウィッシュリスト登録数は12万5000件を突破しています。集まった資金は、音声収録やモデリングの外注費用に充てられ、2027年内の発売を目指しており、個人開発の情熱とコミュニティの支持が融合した成功事例として注目されます。","source":"電ファミニコゲーマー","url":"https://news.denfaminicogamer.jp/news/260618u","impact":"medium","tags":["インディーゲーム","クラウドファンディング","メカアクション"]},{"title":"個人開発のかくれんぼゲーム「めっちゃカメレオン」発売1週間で300万本突破","summary":"個人ゲーム開発者のLEMORION氏とはがねいろ氏が手がけたマルチプレイかくれんぼゲーム「めっちゃカメレオン」が、6月10日の発売からわずか6日で累計販売本数300万本を突破しました。Steamストアでは8000件以上のレビューを集め、「非常に好評」のステータスを獲得しています。プレイヤーがキャラクターの体に絵を描き、ステージの背景やオブジェクトに紛れて鬼から逃れるという独自の擬態システムが特徴で、今後も新マップ追加などのアップデートが予定されています。この驚異的な成功は、斬新なアイデアと迅速な開発が個人開発でも大きな成果を生み出すことを示しています。","source":"ITmedia NEWS","url":"https://www.itmedia.co.jp/news/articles/2606/18/news091.html","impact":"high","tags":["インディーゲーム","マルチプレイ","ヒット作"]},{"title":"AI時代に月100万円以上稼ぐ海外個人開発者の成功事例が続々登場","summary":"AIを活用した個人開発が活況を呈しており、月額100万円以上の収益を上げる海外インディーハッカーの事例が複数報告されています。例えば、TikTok自動化ツールを開発した25歳のMatt氏は、100日で1500万円の収益を達成し、2025年には合計7500万円の収益を見込んでいます。また、2週間でアプリを開発し80日で2000万円を稼いだ大学生の事例など、トレンドの嗅覚と迅速な開発、ショート動画を活用したマーケティングが成功の鍵となっています。これは、AI技術が個人開発者に新たなビジネスチャンスと収益源をもたらしていることを明確に示しており、開発者にとって非常に刺激的な情報です。","source":"みんなのニュースレター","url":"https://minnano.substack.com/p/20266","impact":"high","tags":["AI活用","個人開発","収益化"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Qualcomm、AI半導体分野へ本格進出か、Tenstorrent買収交渉の報道も","summary":"Qualcommが6月下旬に開催されるインベスター・デイで、AI半導体分野における成長戦略の概要を説明する準備を進めています。同社は、AIチップ設計スタートアップであるTenstorrentを80億ドルから100億ドル規模で買収する交渉を行っていると報じられており、これによりカスタム高性能シリコンおよびデータセンター・コンピューティングにおける能力を加速させる狙いがあると見られています。この動きは、Qualcommがモバイル分野だけでなく、データセンターやエッジAIといった広範なAI市場での存在感を高めようとしていることを示唆しており、AI半導体市場の競争がさらに激化する可能性があります。","source":"TradingKey","url":"https://tradingkey.com/news/qcom-stock-rises-3-49-on-june-18-what-investors-need-to-know/","impact":"high","tags":["Qualcomm","AI半導体","M&amp;A"]},{"title":"ASML、AIインフラ需要とEUV露光装置増産で株価上昇","summary":"半導体製造装置メーカーのASMLの株価が、旺盛なAIインフラ需要とEUV露光装置の増産の可能性を背景に上昇しています。複数の金融機関が、同社の技術的優位性と業績成長を理由に目標株価を引き上げました。ASMLは先端露光技術において比類なき独占的な地位を確立しており、2020年代末までの大幅な収益成長への明確な道筋が市場で高く評価されています。これは、AIの進化が半導体製造装置市場にも大きな恩恵をもたらしていることを示し、開発者にとっては高性能半導体の供給安定化に繋がる重要な動向です。","source":"TradingKey","url":"https://tradingkey.com/news/asml-holding-nv-asml-stock-rises-3-61-on-june-18-what-investors-need-to-know/","impact":"medium","tags":["ASML","半導体","EUV"]},{"title":"ソニーとimec、次世代3D集積向け裏面接続技術を開発","summary":"ソニーセミコンダクタソリューションズ（SSS）とベルギーの半導体研究機関imecが、次世代の3D集積を可能にする高密度裏面インターコネクト技術を共同開発しました。この技術は、セルフアライン型絶縁構造を用いた新たなTSV（貫通ビア）技術により、従来方式と比較して低抵抗かつ低リークな接続を実現するとともに、位置ずれ許容範囲を大幅に拡大します。先端ロジックやメモリ向けの新たな3D集積アーキテクチャを支える基盤技術となることが期待されており、将来の高性能半導体開発において重要なブレークスルーとなるでしょう。","source":"EE Times Japan","url":"https://eetimes.itmedia.co.jp/hc/articles/2606/18/news093.html","impact":"medium","tags":["ソニー","imec","3D集積"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
