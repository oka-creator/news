<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

ounding-api-redirect/AUZIYQG1aAgY4u6XAhkaB73fTjXvKI7gxf50vk3T2ylH_GgSbHC-Kr38kncbU_RSm1NVRGHnqzQ98nm0KCfpPrPyPNi0ob-Q_3D_zmsFsODXxSi6FV9lLqGZfG6rFXo5G5srpnz9x0Pb8s_izIr2IwvloIgRVBIroLg==","impact":"medium","tags":["キャリア開発","越境学習","ベンチャー"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"PCの約7割がローカルAIに対応へ、AMDがデータセンター技術転用で攻勢","summary":"2026年6月23日付けの電波新聞デジタルによると、パソコンの約7割がローカルAIに対応する見込みであり、半導体メーカーのAMDはデータセンター技術を転用してこの分野で攻勢をかけています。これは、AI処理能力がクラウドだけでなく、個々のデバイスレベルで広く普及し、PCの性能と用途が大きく変化する可能性を示唆しています。AI機能が組み込まれたPCの需要が高まることで、ハードウェア市場に新たな競争が生まれ、開発者はローカルAIを活用したアプリケーション開発の機会が増加すると予想されます。","source":"電波新聞デジタル","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQF7tKLMe3FR0sN-JC7_yo9jRuox6teZDlEUAYWu-M0zH--bVZ1WYC-QLp6_Qu8w3_F2lzp2InJ31EuR0yQpwBeVHxZWLQTnFfhEKlk9Ub7-yWrsKl28Fn35ZtFBy44SSz6g6TxufO2-XknpAPg=","impact":"high","tags":["ローカルAI","PC","半導体"]},{"title":"COMPUTEX 2026で新プロセッサーや革新的な展示が多数発表","summary":"2026年6月23日発行の週刊アスキーでは、台湾で開催されたCOMPUTEX 2026での発表が特集されています。このイベントでは、パソコン業界の勢力図を塗り替える可能性のある新プロセッサーの登場や、マニア心をくすぐる革新的な新製品が多数展示されました。特にAI関連のハードウェア進化が顕著であり、今後のPC性能向上や新たなデバイス開発の方向性を示す重要な発表が多く見られました。開発者は、これらの新しいハードウェアの進化がもたらすパフォーマンス向上や、AI機能の活用方法について常に情報を収集し、自身の開発に活かすべきです。","source":"ASCII.jp：週刊アスキー No.1601(2026年6月23日発行)","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQH9XdjujkdMB8BnOCrkK7l10YYMWEwmwUWsNlRdghvX7Q4VanFnXZgH-HxqJCm-1oqbvbYGDAC93TwE1a8qanwNe9lx7a4kcJ-xZM76S656iTF1cJdPlWfqc431dRNxzYqoGqRv-g==","impact":"high","tags":["COMPUTEX","ハードウェア","AIチップ"]},{"title":"GitHub Code Qualityが有料サービス化、GitHub Modelsは新規提供を終了し再編へ","summary":"GitHubは、開発者ツールエコシステムの再編を進めており、GitHub Copilot for JetBrainsはエージェントの実行基盤をCopilot CLIへ移行することで機能強化を図ります。これまで提供されてきたGitHub Code Qualityは2026年7月20日からアクティブコミッター1人あたり月額10ドルの有料製品として提供開始されます。また、GitHub Modelsは新規顧客への提供を終了し、段階的に廃止される方向にあるとのことです。これは、AI関連サービスのビジネスモデルが成熟し、提供戦略が変化していることを示しており、開発者や企業は今後のツール利用戦略の見直しを迫られる可能性があります。","source":"Qiita","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AU       '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
