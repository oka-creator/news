<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年5月10日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

s1pFPt1rrIgJQ==","impact":"medium","tags":["生成AI","LLM市場","AIエージェント"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"AIコーディング普及後の個人開発の現実：開発速度10倍も「誰に売るか」が重要課題に","summary":"AIコーディングツール、特にClaude Codeの普及により、個人開発における開発速度はかつての1ヶ月かかった工程が1日で完了するなど、10倍に向上していると報告されています。しかし、AIはプロダクトを「作れる」ようにはなっても、「誰に売るか」「なぜ使われるか」といった課題発見までは代行できないと指摘されており、人間特有の役割の重要性が強調されています。これは、開発者にとって技術的なスキルだけでなく、市場のニーズを理解し、独自の価値提案を行うビジネススキルがより一層重要になることを意味します。","source":"Hinakira AI News","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEu5EQOHpdmnzrnYv42EVng8Lt4jhawDFq9xtSNq0-GHmy9hZZypanepOWs3GVcN5eLKoCgqNBJ39e83sABKocvF7xurjc9AtTdWWgx1SDQq199YLeEHECpnzF9RWd27p_yUVvZMeg==","impact":"high","tags":["AIコーディング","個人開発","課題発見"]},{"title":"【2026年版】1人で1億円稼ぐソロ創業者スタック完全ガイドが公開","summary":"共同創業者ゼロ、代理店ゼロで年商1億円を目指すソロ創業者のためのAIファーストなスタックが詳細に解説されています。エンジニアリングにはClaude Code、バックオフィスにはAIエージェントによる5つのパイプライン自動化、マーケティングにはHiggsfield Marketing Studio（Hermes Agent + Seedance 2.0）が推奨されており、AIを最大限に活用して少人数で事業をスケールさせる具体的な戦略が示されています。これは、個人開発者がAIツールを駆使することで、大規模なチームなしでも高収益を目指せる可能性を示唆しており、開発者はAIを活用した効率的な事業運営のノウハウを学ぶ良い機会となるでしょう。","source":"Zenn","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEPDNrwRVQO7HPhtMBOr2l4G1IKncTueUngAiaw7RlAy79_UQblSJX2Y3sBs2EP0g0-SgZGmJs03Wels6XTq_Z_2QH4VZhoZzZPTtyDx3-yKqcGjp7_RhzGhFCuikXjWNqBTaFuHocKB36RLzBBA32Z1YgUbtncuyQUcjXDoph5VQ==","impact":"high","tags":["ソロ創業者","AI活用","事業スケール"]},{"title":"個人開発で収益を得る現実とAIツールの活用事例（2026年版）","summary":"個人開発でアプリをリリースし収益化を目指す上での現実的な方法と事例が紹介されています。特に、YouTube動画からSNS投稿を自動生成するツール「Castify」の開発・運用を通じて、AIツール（Claude Codeなど）を駆使することで開発スピードが格段に向上し、最小限の機能でリリースしフィードバックを得るアプローチが成功への近道であると語られています。これは、個人開発者がAIを効果的に利用することで、迅速なプロトタイピングと市場投入が可能になり、ユーザーからのフィードバックを基にした改善サイクルを加速できることを示しています。","source":"note","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGN9qLhG4wXRRGiqBRCrsPQGdzId87vtC96_GMQvoBH7fbGSaOHLPkCDn7dVNXuLuW4EYeLFBi7FMVEskoVqHaTdqvzro69X3duWDeMZ-rqiwcm3oHXF1bscLCqHBd91ztrV80_E4=","impact":"medium","tags":["収益化","AIツール","アジャイル開発"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"BigTech4社、2026年のAIインフラ投資が合計7000億ドル（約100兆円）を突破","summary":"Amazon、Google、Meta、Microsoftの4社が2026年にAIインフラ関連の設備投資額として合計7000億ドル（約100兆円）を超えることが確実となりました。これは2025年の約4100億ドルから70%超の急増であり、支出の大半が「推論インフラ」（モデル訓練ではなく、利用者にリアルタイムで応答するための基盤）に集中していると報じられています。一方で、需要の先を走り過ぎた「オーバービルド」になる可能性も懸念されています。この巨額投資は、AIサービスの基盤がさらに強化され、開発者はより高性能で安定したAIインフラを利用できるようになる一方で、特定のプラットフォームへの依存度が高まる可能性も考慮する必要があります。","source":"TechCreate","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFSDuj0y_mtG52gEAGo9TucjCppXSWJQW6X7MJF8XFHYD47-5zWqDBn8vuErYoZ-4RtGj7KcH4cIms9ziOqMo1HlVTukds-S3hHk5c-qU_QHz9i0N1DPLE9p05lsFnHiS2nTp2V5zUJvqc=","impact":"high","tags":["AIインフラ","BigTech","設備投資"]},{"title":"テレマティクス市場が2035年までに5億6404万米ドルに急成長、AI主導型エコシステムが競争を加速","summary":"テレマティクス市場は、輸送、保険、物流、フリート運営企業がコネクテッドモビリティ技術を急速に統合する中で、高成長段階に突入しています。市場規模は2025年の1億4,550万米ドルから2035年には5億6,404万米ドルへ拡大し、年平均成長率（CAGR）14.5%で成長すると予測されています。特にAI主導型テレマティクスエコシステムにおける競争革新が加速しており、予測型運用インサイトを可能にする機械学習機能搭載のIoT対応ソリューションが継続的に投入されています。これは、モビリティ分野におけるAIとIoTの融合が新たなビジネスチャンスを生み出しており、開発者はこの分野での専門知識やソリューション開発に注力することで、大きな市場を獲得できる可能性を秘めていることを示唆しています。","source":"アットプレス","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHSv_HWprGR49yuoUeW7pEbggQe2I7DhNt-g6a6cP8eM5p6Opp_hJB3O0rA25026dE6rIqIybQ3hytEqlON1KtZmu5XFmTcx6OgS2SYdfOtR-RpNYCp_RPQxYYt0VdNFLx2","impact":"medium","tags":["テレマティクス","IoT","モビリティ"]},{"title":"米国防総省、OpenAI・Googleら8社と機密ネットワークでのAIツール展開で合意、Anthropicは排除","summary":"米国防総省（DoD）は、SpaceX、OpenAI、Google、Microsoft、Nvidia、Amazon（AWS）、Oracle、Reflectionの8つのテクノロジー企業と、AIツールを機密ネットワーク（インパクトレベル6および7）に展開する協定を結びました。注目すべきは、Anthropicが「自律型兵器を含むすべての合法的目的への使用」を認めることを拒否したため、この協定から排除された点です。これは、AIの軍事利用における倫理的・政策的側面が現実のビジネスに影響を与えていることを示しており、開発者はAI技術の倫理的な利用と、その社会的な影響について深く考慮する必要があることを浮き彫りにしています。","source":"TechCreate","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFSDuj0y_mtG52gEAGo9TucjCppXSWJQW6X7MJF8XFHYD47-5zWqDBn8vuErYoZ-4RtGj7KcH4cIms9ziOqMo1HlVTukds-S3hHk5c-qU_QHz9i0N1DPLE9p05lsFnHiS2nTp2V5zUJvqc=","impact":"high","tags":["AI倫理","軍事利用","政府契約"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
