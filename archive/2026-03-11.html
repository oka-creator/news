<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月12日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年3月12日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"アリババクラウドが日本でのAI計算資源を強化、国内データセンター新設と人員2.5倍増を発表。","summary":"アリババクラウドは、日本市場における生成AI活用を支援するため、国内データセンターを新たに開設し、関連人員を2.5倍に増員すると発表しました。これにより、AI活用の前提となる計算基盤が日本国内で強化され、企業のAI導入や低遅延サービスの拡大に直結すると期待されます。この動きは、日本企業がAI技術を導入し、競争力を高める上で重要なインフラ投資となります。特に、国内でのデータ処理はセキュリティや規制遵守の観点からもメリットが大きく、幅広い産業でのAI活用を促進するでしょう。","source":"日経クロステック","url":"https://xtech.nikkei.com/atcl/nxt/news/24/03131/","impact":"high","tags":["クラウドAI","データセンター","日本市場"]},{"title":"特注設備メーカーがMicrosoft Teamsに独自AIを組み込み、残業時間を4割削減。","summary":"製造業の特注設備メーカーが、Microsoft Teamsに独自のAIを導入することで、業務指示や理解の精度を向上させ、残業時間を4割削減したと報じられました。これは、生成AIがPoC（概念実証）段階を越えて、業務改善の実効フェーズに入った具体的な事例と言えます。AIが日常業務に深く統合され、生産性向上に直接貢献する可能性を示しており、他企業にとってもAI導入のモデルケースとなるでしょう。特に、コミュニケーションの効率化と情報共有の精度向上は、多くの企業が直面する課題解決に役立ちます。","source":"日経クロステック","url":"https://www.google.com/search?q=特注設備メーカー+Microsoft+Teams+AI+残業4割削減+日経クロステック","impact":"medium","tags":["業務効率化","生成AI活用","Microsoft Teams"]},{"title":"デジタル庁、ガバメントAI「源内」で試用する国内大規模言語モデル（LLM）として7モデルを選定。","summary":"デジタル庁は、政府のAI利用環境「ガバメントAI（源内）」において試用する国内の大規模言語モデル（LLM）として、KDDIとELYZAのモデルを含む計7モデルを選定しました。全府省庁の約18万人の職員を対象とした大規模な実証実験を通じて、2026年度内の本格運用を目指し、行政におけるAIの自国生産・自国運用を加速させる方針です。この取り組みは、政府機関におけるAI導入の具体的なステップであり、国内LLM開発の促進にも繋がります。行政サービスの効率化と高度化に大きく貢献すると期待され、日本のAI戦略における重要な一歩です。","source":"デジタル庁","url":"https://www.digital.go.jp/news/20240312_llm_selection/","impact":"high","tags":["ガバメントAI","LLM","デジタル庁"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"インディー開発者Kei26氏によるパズルアクション「ロープくんアドベンチャー」がPC/Switchで3月12日に配信開始。","summary":"個人開発者のKei26氏が手掛けるパズルアクションゲーム「ロープくんアドベンチャー」が、本日3月12日にPC（Steam）とNintendo Switchで配信を開始しました。ロープを使った多彩なアクションでギミックを攻略する内容で、配信記念として20％オフセールも実施されます。このリリースは、インディーゲーム開発者の創造性と技術力を示すものであり、多様なゲーム体験をユーザーに提供します。個人開発者がプラットフォームを横断して作品をリリースできる環境が整っていることを示唆しており、今後のインディーゲームシーンの活性化に貢献するでしょう。","source":"4Gamer.net","url":"https://www.4gamer.net/games/790/G079075/20240312061/","impact":"low","tags":["インディーゲーム","パズルアクション","ゲームリリース"]},{"title":"フリーランスPythonエンジニアの平均年収は944万円、リモート案件比率は86.5%に。","summary":"フリーランスボードの最新調査によると、2026年3月時点でのフリーランスPythonエンジニアの平均年収は944万円と高水準を維持しており、リモートワーク案件の比率も86.5%と非常に高いことが明らかになりました。AI・フィンテック・SaaS系のテック企業で特に需要が高く、データ基盤構築やMLOps関連の案件が増加しています。このデータは、Pythonスキルを持つエンジニアにとって魅力的な市場環境を示しており、キャリアパスを検討する上で重要な情報です。リモートワークの普及は、働き方の柔軟性を高め、地方在住者にも機会を広げる効果があります。","source":"PR TIMES","url":"https://www.google.com/search?q=フリーランスPythonエンジニア+平均年収+944万円+リモート案件比率+86.5%25+PR+TIMES","impact":"medium","tags":["フリーランス","Python","リモートワーク"]},{"title":"Steam向けミステリーアドベンチャーゲーム「忘却前夜」が本日3月12日に正式リリース。","summary":"Steamで展開されるミステリーアドベンチャーゲーム「忘却前夜」が、2026年3月12日に正式リリースされました。自ら街を探索しながら事件を解き明かす体験型ミステリーで、リリースを記念したゲーム内外イベントも順次開催される予定です。このゲームのリリースは、インディーゲーム市場の多様性をさらに豊かにするものであり、プレイヤーに新たな選択肢を提供します。特に、探索型ミステリーというジャンルは、物語性と没入感を重視するゲーマーにとって魅力的な体験となるでしょう。","source":"Gamer","url":"https://www.gamer.ne.jp/news/202403120005/","impact":"low","tags":["Steam","ミステリーゲーム","アドベンチャー"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Samsung、「Galaxy S26」シリーズを本日3月12日に発売。「プライバシーディスプレイ」などAI機能を強化。","summary":"サムスン電子は、最新の「Galaxy AI」と業界初の新機能「プライバシーディスプレイ」を搭載した&quot;先回りするAIフォン&quot;「Samsung Galaxy S26」、「S26+」、「S26 Ultra」を本日3月12日よりauとソフトバンクから発売しました。特に「プライバシーディスプレイ」は、公共の場での画面の覗き見を制限できる実用的な機能として注目されます。この新シリーズは、スマートフォンにおけるAI機能の進化と、ユーザーのプライバシー保護への配慮を両立させるトレンドを示しています。AIを活用した新しいユーザー体験とセキュリティ機能の融合は、今後のスマートフォン開発の方向性を示す重要な一歩となるでしょう。","source":"サムスン電子ジャパン株式会社","url":"https://www.google.com/search?q=Samsung+Galaxy+S26+プライバシーディスプレイ+AI機能","impact":"high","tags":["スマートフォン","Galaxy AI","プライバシー保護"]},{"title":"シンガポール、職住一体型のAI共創新拠点「カンポンAI」を2028年に完成予定。","summary":"シンガポール政府機関JTCは、AI関連の新たな共創拠点「カンポンAI」を2028年に完成させると発表しました。これは国内初のスタートアップ向け職住一体型施設となり、AI関連企業や起業家、研究者が集結し、相乗効果を生み出すエコシステムを育むことを目指します。また、AI専門人材を対象とした高度人材ビザの対象拡大も予定されており、AI人材誘致を強化します。このプロジェクトは、シンガポールがAI分野での国際的なハブとなることを目指す国家戦略の一環であり、AIエコシステムの構築と人材育成に大きく貢献するでしょう。","source":"ジェトロ","url":"https://www.jetro.go.jp/biznews/2024/03/79f579997193237a.html","impact":"high","tags":["AIハブ","シンガポール","スタートアップ"]},{"title":"マクセルが対面での本人確認業務を支援する「本人確認ソリューション」を提供開始。","summary":"マクセルは、対面での本人確認業務を支援する「本人確認ソリューション」を2026年3月下旬より販売開始します。既存のWindows PCに容易に導入でき、マイナンバーカードや運転免許証のICチップを読み取り、偽造カード検知や本人照合支援を行うことで、業務効率化とセキュリティ強化に貢献します。このソリューションは、金融機関や行政サービスなど、厳格な本人確認が求められる業界にとって非常に有用です。デジタル化が進む中で、対面での本人確認の信頼性と効率性を高める重要なツールとなるでしょう。","source":"PR TIMES","url":"https://www.google.com/search?q=マクセル+本人確認ソリューション+2026年3月+PR+TIMES","impact":"medium","tags":["本人確認","セキュリティ","業務効率化"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
