<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年4月1日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年4月1日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"「時系列基盤モデル」に世界が熱視線、ビッグテックや研究機関の参画続く","summary":"生成AIの次の主要なトレンドとして、時系列データを扱う基盤モデルへの注目が高まっています。これは、需要予測、金融、設備保全、IoT、需給最適化など幅広い産業での応用が期待されており、AIの実装範囲を大きく広げる可能性を秘めています。開発者にとっては、新たなデータタイプとモデルアーキテクチャへの理解が求められ、多様なビジネス課題解決の機会が生まれるでしょう。ビッグテックや研究機関の参画が続くことで、この分野の進化は加速すると予測されます。","source":"日経クロステック","url":"https://xtech.nikkei.com/atcl/nxt/column/18/03559/032600001/","impact":"high","tags":["時系列AI","基盤モデル","産業応用"]},{"title":"ClaudeがMacを自律操作——Claude CodeとCoworkにコンピューター使用機能が追加","summary":"Anthropic社は、アシスタント「Claude」にコンピューター使用機能を追加し、Mac上での自律操作を可能にしました。これにより、「Claude Code」と「Cowork」がアプリを開き、ブラウザを操作し、スプレッドシートへの入力などを自動で実行できるようになります。開発者は、AIエージェントによる業務自動化の進展を目の当たりにし、より複雑なタスクの自動化や、AIと連携するアプリケーション開発の可能性を探る必要が出てくるでしょう。スマホからのタスク指示でMacを自動実行させる機能は、AIの日常業務への統合を加速させます。","source":"TECH NOISY","url":"https://technoisy.com/claude-mac-computer-use/","impact":"high","tags":["AIエージェント","Claude","業務自動化"]},{"title":"リコー、企業の暗黙知をAI対応にするマルチモーダル新モデルを発表","summary":"リコーは、企業内の図表や画像に含まれる「暗黙知」をAIが活用できるデータにするため、マルチモーダルな新モデルを開発しました。このモデルにより、従来のテキスト検索では困難だった複雑なフロー図や複数グラフの読み取り、部品図と表情報を統合した推論などが可能になります。開発者にとっては、非構造化データからの情報抽出や、企業内データのAI活用における新たなアプローチが提供され、業務情報活用の幅が大きく広がります。これは、企業のDX推進において重要な一歩となるでしょう。","source":"Impress Watch","url":"https://www.watch.impress.co.jp/docs/news/1579899.html","impact":"medium","tags":["マルチモーダルAI","暗黙知","企業DX"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ハッカーイルカのギャンブルローグライク『Dolphin Keno』発表。ハッキングで一攫千金、バレそうになったら“小細工”で乗り切る","summary":"LCB Game Studioは、イルカのハッカーとなってギャンブルに挑み、大金を稼ぐローグライクゲーム『Dolphin Keno』を発表しました。プレイヤーはハッキングや「小細工」を駆使して困難を乗り越えるユニークなゲームプレイを体験できます。このニュースは、インディーゲーム開発における自由で創造的な発想の重要性を示しており、個人開発者にとっては、既存のジャンルに新しいひねりを加えることの可能性を教えてくれます。技術的な挑戦だけでなく、アイデアの独自性が成功の鍵となることを示唆しています。","source":"AUTOMATON","url":"https://automaton-media.com/articles/newsjp/20260331-285600/","impact":"low","tags":["インディーゲーム","ローグライク","ゲーム開発"]},{"title":"インターリンク、人間用のHTMLを廃止しAI用のMarkdown中心の「AI-Firstサイト」へ移行","summary":"株式会社インターリンクは、コーポレートサイトを人間向けのHTML主体から、生成AIやAIエージェントが直接読み取りやすいMarkdownファイル（.md）中心の「AI-Firstホームページ」へと移行しました。ごく一部を除きHTMLファイルを削除し、AIエージェント向けの案内ファイル「llms.txt」や機械可読なJSON APIも公開しています。これは、AI時代に最適化された情報構造を実践する先進的な取り組みであり、個人開発者や企業がウェブサイトを設計する上で、AIによる情報消費を意識した構造化の重要性を示唆しています。AIフレンドリーな設計が今後の標準となる可能性を提示しています。","source":"ASCII.jp","url":"https://ascii.jp/elem/000/004/289/4289456/","impact":"high","tags":["AI-First","Markdown","ウェブ開発"]},{"title":"「AIでコードを書いてもレビューで止まる」開発現場の課題、NECはどう解消したか","summary":"AIによるコード生成が普及する一方で、「AIが書いたコードがレビューで止まる」という課題が開発現場で顕在化しています。NECは、この課題に対し、AIを活用したレビュー支援や開発プロセスの改善を通じて解消を図る取り組みを進めています。個人開発者にとっても、AIをコーディングに活用する際の具体的な課題と、その解決策を考える上で示唆に富むニュースです。AI生成コードの品質向上や、人間とAIの協調作業におけるレビュープロセスの最適化が、今後の開発効率を左右する重要な要素となるでしょう。","source":"＠IT","url":"https://www.atmarkit.co.jp/ait/articles/2603/31/news051.html","impact":"medium","tags":["AIコーディング","コードレビュー","開発プロセス"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"国の最新版「AI事業者ガイドライン」発表、AIエージェント時代のリスク管理を明示","summary":"総務省と経済産業省は、新たに改定した「AI事業者ガイドライン（第1.2版）」を公表しました。今回の改訂では、「AIエージェント」や「フィジカルAI」の登場を踏まえたリスク整理や、AIガバナンスの具体化が大きな柱となっています。AI開発者、提供者、利用者それぞれが「人間中心」「安全性」「プライバシー保護」といった共通指針に沿って取り組むべき事項が整理されており、今後のAI活用における重要な指針となります。開発者は、これらのガイドラインを理解し、自身のAI開発やサービス提供に組み込むことで、法的・倫理的リスクを管理する必要があります。","source":"トラベルボイス","url":"https://www.travelvoice.jp/20260331-1579899","impact":"high","tags":["AIガバナンス","AIエージェント","法規制"]},{"title":"6Gは「AIとロボットのため」のインフラに？ MWC 2026で注目を集めた新デバイスと日本発“推しカメラ”","summary":"2026年のMWC Barcelonaでは、AIとロボットが主役となり、通信キャリア各社が6G時代を見据えた新技術を披露しました。NTTドコモのAIエージェントサービス「SyncMe」や、ペンと音声で入力するデバイス「コンポーザー」、ZTEのペット型AIロボット「iMoochi」などが注目を集めました。このイベントは、6GがAIとロボットの進化を支える基盤インフラとなる可能性を示唆しており、開発者にとっては、超高速・低遅延・多接続な次世代通信環境を前提としたAIアプリケーションやロボットシステムの開発が重要になることを意味します。新たなデバイスと通信技術の融合が、未来のテックランドスケープを形作るでしょう。","source":"ITmedia Mobile","url":"https://www.itmedia.co.jp/mobile/articles/2603/31/news078.html","impact":"high","tags":["6G","AIロボット","次世代通信"]},{"title":"大和総研、耐量子計算機暗号の実証実験でWebサービスへの影響は限定的と発表","summary":"大和総研は、量子コンピュータの進展による現在の公開鍵暗号の解読リスクに対応するため、耐量子計算機暗号（PQC）の実証実験を行いました。その結果、一般的なWebサービス用途では、鍵交換（KEM）のPQC対応による通信への影響は限定的であることが確認されました。TLSハンドシェイク時間の増加は限定的で、CPU・メモリ使用率にも顕著な増加は見られず、通信量増加も約5％に留まったとのことです。これは、将来的な量子コンピュータの脅威に対し、PQCへの移行が現実的であることを示しており、開発者にとっては、セキュリティ対策のロードマップを計画する上で重要な情報となります。","source":"大和総研","url":"https://www.dir.co.jp/report/research/security/20260331_01.html","impact":"medium","tags":["耐量子暗号","セキュリティ","Webサービス"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
