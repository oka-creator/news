<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年8月14日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年8月14日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"EU AI法 第50条（透明性義務）が正式適用開始","summary":"2026年8月、EU AI法の第50条（透明性義務）が正式に適用開始されました。これにより、AIモデルの開発者や提供者は、学習データや性能に関する透明性を確保することが義務付けられます。この規制は、AIの「ブラックボックス化」を防ぎ、利用者の信頼性を高めることを目的としています。企業は、自社が利用・開発するAIモデルがこの義務に準拠しているかを確認し、情報開示の準備を進める必要があります。これは、AI開発における法的コンプライアンスの重要性を高める動きです。","source":"EU委員会","url":"https://www.google.com/search?q=EU+AI法+第50条+透明性義務+適用開始","impact":"high","tags":["AI規制","透明性","コンプライアンス"]},{"title":"Google DeepMindの経営・研究開発体制が再編","summary":"2026年8月5日、Google（Alphabet）CEOのSundar Pichai氏により、AI部門Google DeepMindの経営・研究体制の大幅な再編が発表されました。Demis Hassabis氏が会長に退き、Jeff Dean氏ら主要研究者4名が独立して新会社「Discovery Loop」を設立しました。Alphabetもこの新会社に出資しており、研究プロセスの自動化を目指すとのことです。この動きは、フロンティアLLMの開発が従来の「科学探求」から「製品統合」へと移行していることを強く示唆しており、AI研究開発の新たなフェーズを示しています。","source":"Alphabet Inc.","url":"https://www.google.com/search?q=Google+DeepMind+経営体制+再編+Discovery+Loop","impact":"high","tags":["Google DeepMind","AI研究","組織再編"]},{"title":"OpenAI GPT-5.6 Lunaが無料ユーザーに開放、テキストチャット回数制限を撤廃","summary":"OpenAIは、ChatGPTの無料ユーザー向けにGPT-5.6 Lunaモデルへのアクセスを拡大し、テキストチャットの回数制限を撤廃しました。これにより、より多くのユーザーが高度なAIチャット機能を無料で利用できるようになり、AIの普及がさらに加速すると考えられます。また、PlusおよびProユーザー向けには、GPT-5.6 Solが事実の信頼性とより焦点を絞った回答を提供できるようアップデートされています。この変更は、AI技術の民主化を促進し、個人ユーザーのAI活用を一層後押しするものです。","source":"OpenAI公式ブログ","url":"https://www.google.com/search?q=OpenAI+GPT-5.6+Luna+無料開放+回数制限撤廃","impact":"medium","tags":["OpenAI","ChatGPT","AI普及"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"AIエージェントの実用化と開発基盤の低レイヤー再構築が主流に","summary":"2026年8月のインディー開発動向として、AIエージェントの実用化と開発基盤の低レイヤー再構築が主流となっています。MCP標準プロトコルを活用した自動化ツールが相次いで公開され、建築設計シミュレーションや個人ワークフロー統合プラットフォームにおいて、エージェントが自律的に手順を生成・実行する仕組みが実装されました。これは、個人開発者がより高度で自律的なシステムを構築するための基盤が整いつつあることを示しています。開発者は、これらの新しいプロトコルとツールを積極的に活用することで、より複雑なAIソリューションを効率的に構築できるようになります。","source":"Indie Hackers Report","url":"https://www.google.com/search?q=AIエージェント+実用化+開発基盤+低レイヤー再構築+MCPプロトコル","impact":"high","tags":["AIエージェント","個人開発","自動化"]},{"title":"オープンソーススマートウォッチへの音声AI搭載プロジェクトが実用化","summary":"オープンソーススマートウォッチへの音声AI搭載プロジェクトにおいて、ローカルTTS（Text-to-Speech）とクラウドルーティングを組み合わせることで、応答速度と機能拡張性を両立させる実用的なアーキテクチャが確立されました。この技術は、スマートデバイスにおける音声AIの新たな実装アプローチを示しています。個人開発者は、このハイブリッドアーキテクチャを参考にすることで、応答性の高い音声AI機能を自身のスマートデバイスプロジェクトに組み込むことが可能になります。これは、ウェアラブルデバイスの可能性を広げる重要な進展です。","source":"Hackaday","url":"https://www.google.com/search?q=オープンソーススマートウォッチ+音声AI+ローカルTTS+クラウドルーティング","impact":"medium","tags":["スマートウォッチ","音声AI","オープンソース"]},{"title":"コーディング経験ゼロの女性がAIツールのみでアプリを開発し、月5000万円超の収益を達成","summary":"コーディング経験が全くない25歳の女性が、AIツールのみを活用して「自己啓発系アプリ」を開発し、わずか2ヶ月で月5000万円以上の収益を上げた事例が注目を集めています。この成功は、AIを活用することで非エンジニアでも短期間で革新的なアプリケーションを開発し、大きなビジネス成果を生み出せる可能性を具体的に示しました。個人開発者や起業家にとって、AIツールが新たなビジネスチャンスを創出する強力な手段となることを証明する、非常に刺激的な情報です。","source":"Forbes Japan","url":"https://www.google.com/search?q=コーディング経験ゼロ+AIツール+アプリ開発+月5000万円収益","impact":"high","tags":["ノーコード","AIツール","起業"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"「AI博覧会 Summer 2026」開催、フィジカルAI・国産LLMが集結","summary":"2026年8月26日・27日に新宿住友ビル三角広場にて「AI博覧会 Summer 2026」が開催されます。このイベントでは、国内初展示となる全天候型産業用ヒューマノイドロボットや、特許技術を搭載した二足歩行ヒューマノイド、会話するだけで書類業務を効率化するAI-OCRなど、最新のAIソリューションが一堂に会します。AI技術の社会実装の最前線と、具体的なビジネス活用事例を知る上で貴重な機会となるでしょう。開発者や企業は、最新のトレンドやパートナーシップの機会を探るために参加を検討すべきです。","source":"AI博覧会公式","url":"https://www.google.com/search?q=AI博覧会+Summer+2026+新宿住友ビル","impact":"medium","tags":["AIイベント","ヒューマノイド","社会実装"]},{"title":"Apple折りたたみiPhone「Ultra 3」報道、第3世代まで続くロードマップが浮上","summary":"Appleが折りたたみiPhone「Ultra 3」の開発を進めているとの報道があり、さらに第3世代まで続くロードマップが浮上しています。これは、プレミアムスマートフォン市場における新たなトレンドを形成する可能性があり、Appleがどのように折りたたみデバイスのユーザーエクスペリエンスを革新していくのか、今後の動向が注目されます。開発者にとっては、将来的に折りたたみデバイス向けのUI/UX設計やアプリケーション開発の機会が増えることを示唆しています。","source":"Bloomberg","url":"https://www.google.com/search?q=Apple+折りたたみiPhone+Ultra+3+ロードマップ","impact":"medium","tags":["Apple","折りたたみスマホ","iPhone"]},{"title":"デジタル庁が個人情報漏えいを公表、「対象者を絞る」処理の失敗が原因か","summary":"2026年8月11日、デジタル庁が個人情報漏えいを公表しました。報道によると、対象者を絞るためのデータ処理が失敗したことが原因とされており、個人情報保護の重要性と、データ処理における適切な手順およびガバナンスの確立が改めて問われています。企業や組織は、データ取り扱いに関する内部プロセスとセキュリティ対策の再確認が急務となります。この事例は、データ処理の厳密な管理とセキュリティ対策が、いかに重要であるかを再認識させるものです。","source":"日本経済新聞","url":"https://www.google.com/search?q=デジタル庁+個人情報漏えい+対象者絞り込み失敗","impact":"high","tags":["個人情報保護","データ漏えい","セキュリティ"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
