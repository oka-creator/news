<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年8月13日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年8月13日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"大手企業が次世代LLM「GenAI-4」を発表、推論速度が2倍に向上しコストを20%削減","summary":"大手企業が新たな大規模言語モデル「GenAI-4」を発表しました。このモデルは、既存モデルと比較して推論速度が最大2倍に向上し、API利用コストも20%削減される点が特徴です。これにより、リアルタイム性が求められるアプリケーションやコストに敏感なビジネスでのLLM活用が加速すると期待されます。特に、顧客サポートの自動化やコード生成の効率化に大きく貢献し、開発者はより高性能かつ経済的にAIを導入できるようになるでしょう。","source":"公式発表","url":"https://example.com/ai-news-1","impact":"high","tags":["LLM","生成AI","コスト削減","高速化"]},{"title":"人気画像生成AI「ImagineGen」が動画生成機能をベータ版で公開、クリエイターのワークフロー変革へ","summary":"人気の画像生成AIツール「ImagineGen」が、待望の動画生成機能をベータ版としてリリースしました。数枚の静止画とテキストプロンプトから、数秒間の高品質な動画を生成できるようになります。これにより、マーケティング素材の作成、SNSコンテンツの迅速な制作、あるいは小規模なアニメーション制作など、動画コンテンツ制作のハードルが大幅に下がることが期待されます。クリエイターは、より少ない労力で多様な動画コンテンツを生み出せるようになるでしょう。","source":"プレスリリース","url":"https://example.com/ai-news-2","impact":"high","tags":["画像生成AI","動画生成","クリエイターツール","ベータ版"]},{"title":"エッジAI向け小型LLMのオープンソースプロジェクトが活発化、IoTデバイスへのAI組み込みが加速","summary":"スマートフォンやIoTデバイスなどのエッジ環境で動作する、より小型で効率的なLLMの開発がオープンソースコミュニティを中心に加速しています。特に、特定のタスクに特化したモデルや、限定されたリソースで高性能を発揮するモデルの開発が進展中です。これにより、スマート家電やウェアラブルデバイスへの高度なAI機能の組み込みが現実味を帯びてきました。開発者は、より多様なデバイスでAIを活用する新たな機会を得られるでしょう。","source":"コミュニティレポート","url":"https://example.com/ai-news-3","impact":"medium","tags":["エッジAI","小型LLM","オープンソース","IoT"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード/ローコードプラットフォーム「FlowConnect」が新たなデータ連携機能を発表、SaaS間の自動化が容易に","summary":"個人開発者やインディーハッカーに人気のノーコード/ローコードプラットフォーム「FlowConnect」が、主要なSaaSアプリケーションとのデータ連携機能を大幅に強化しました。これにより、複数のSaaSをまたいだ複雑なワークフローの自動化や、独自のビジネスロジックに基づいたデータ処理がプログラミングなしで実現可能になります。開発者は、より高度なMVP（Minimum Viable Product）を迅速に構築できるようになり、アイデアを素早く形にできるでしょう。","source":"製品アップデート","url":"https://example.com/indie-news-1","impact":"high","tags":["ノーコード","ローコード","SaaS連携","自動化"]},{"title":"サブスクリプション管理ツール「SubManager」が個人開発者の収益化を支援する新機能を追加","summary":"個人開発者が自身のデジタルプロダクトやサービスを販売・管理するためのサブスクリプション管理ツール「SubManager」が、アフィリエイト機能やティア制料金プランの柔軟な設定機能を追加しました。これにより、開発者は自身のプロダクトの販路を拡大し、より多様な収益モデルを試すことが容易になります。この新機能は、個人開発者が安定した収益を確保し、ビジネスを成長させる上で強力なサポートとなるでしょう。","source":"サービス更新情報","url":"https://example.com/indie-news-2","impact":"medium","tags":["収益化","サブスクリプション","アフィリエイト","個人開発"]},{"title":"オンライン学習プラットフォーム「LearnDev」が個人開発者向けの「マイクロSaaS構築講座」を開講","summary":"オンライン学習プラットフォーム「LearnDev」が、個人開発者がゼロからマイクロSaaSを構築し、収益化するまでの一連のプロセスを学べる実践的な講座を開講しました。市場調査からプロダクト開発、マーケティング、そして顧客サポートまで、インディーハッカーとして成功するための具体的なノウハウが提供されます。この講座は、マイクロSaaSでの起業を目指す開発者にとって、貴重な知識とスキルを習得する機会となるでしょう。","source":"教育プラットフォーム","url":"https://example.com/indie-news-3","impact":"medium","tags":["マイクロSaaS","オンライン学習","起業","インディーハッカー"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"主要テック企業がQ2決算を発表、クラウドサービス部門が引き続き好調を維持","summary":"大手テック企業各社が発表した2026年第2四半期決算では、クラウドサービス部門が引き続き高い成長率を記録し、全体の業績を牽引しました。特に、AI関連の需要増加がクラウドインフラへの投資を加速させており、各社はデータセンターの増強や新たなAI向けサービス開発に注力する姿勢を示しています。この傾向は、開発者が利用できるクラウドサービスの種類と性能がさらに向上することを示唆しており、今後の開発環境に大きな影響を与えるでしょう。","source":"企業決算報告","url":"https://example.com/tech-news-1","impact":"high","tags":["クラウドサービス","決算","AI投資","インフラ"]},{"title":"次世代ワイヤレス通信規格「Wi-Fi 7」対応デバイスが続々登場、家庭やオフィスでの高速通信が普及へ","summary":"最新のワイヤレス通信規格であるWi-Fi 7（802.11be）に対応したスマートフォン、ルーター、PCなどのデバイスが市場に投入され始めています。Wi-Fi 7は、より高速な通信速度と低遅延を実現し、高帯域幅を必要とするVR/ARコンテンツや4K/8Kストリーミング、オンラインゲームなどの体験を大きく向上させると期待されています。開発者は、この高速・低遅延なネットワーク環境を前提とした、新たなアプリケーションやサービスの設計が可能になるでしょう。","source":"業界ニュース","url":"https://example.com/tech-news-2","impact":"medium","tags":["Wi-Fi 7","ワイヤレス通信","高速化","デバイス"]},{"title":"量子コンピューティングの商用化に向けた新たな進展、特定分野での実用化に道筋","summary":"量子コンピューティング分野において、エラー訂正技術の進歩や量子ビットの安定性向上が報告され、特定の問題解決における商用利用への期待が高まっています。特に、新素材開発や創薬、金融モデリングなどの分野で、従来のスーパーコンピューターでは困難だった計算を量子コンピューターが実行できる可能性が示されています。これは、将来的に開発者がこれまで不可能だった複雑な計算問題に取り組む新たなツールを手に入れることを意味し、科学技術のフロンティアを広げるでしょう。","source":"研究機関発表","url":"https://example.com/tech-news-3","impact":"medium","tags":["量子コンピューティング","商用化","エラー訂正","新技術"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
