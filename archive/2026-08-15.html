<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年8月16日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年8月16日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Google、最新AIモデル「Gemini 3.7 Flash」を「Gemini Spark」で提供開始","summary":"Googleは8月14日、Web開発やナレッジワークの性能を向上させた最新AIモデル「Gemini 3.7 Flash」を公開しました。個人向けには常時稼働型AIエージェント「Gemini Spark」を通じて提供され、Google Workspaceアプリとの連携やツール活用の精度が高まります。これにより、複雑なタスク処理能力が向上し、ユーザーはより効率的に作業を進めることが可能になります。開発者向けには「Google Antigravity」などで提供され、12月31日まで特別価格が設定されており、AI開発の促進が期待されます。","source":"Google","url":"https://k-tai.watch.impress.co.jp/docs/news/1814674.html","impact":"high","tags":["生成AI","LLM","Google Gemini"]},{"title":"Anthropic、「Claude」で生成したテキストに“見えない透かし”を導入","summary":"Anthropicは、生成AIモデル「Claude」によって作成されたテキストに、コピー＆ペースト後も検出可能な「見えない透かし」を導入しました。これは欧州AI法の透明性要件に対応するもので、AI生成コンテンツの識別を可能にし、信頼性と倫理的な利用を促進します。テキストの意味や品質、可読性を損なうことなく機能するため、ユーザー体験への影響は最小限です。Anthropicは、第三者がこの透かしを検出できるツールの開発も進めており、AIコンテンツの透明性確保に向けた重要な一歩となります。","source":"Anthropic","url":"https://www.itmedia.co.jp/news/articles/2608/11/news039.html","impact":"medium","tags":["AI倫理","コンテンツ識別","Claude"]},{"title":"OpenAI、「ChatGPT Enterprise」の利用実態を分析：若手社員が高頻度で利用","summary":"OpenAIと米大学の研究チームによる大規模分析で、企業向け生成AI「ChatGPT Enterprise」の利用実態が明らかになりました。1,764組織、1,700万件以上のメッセージを分析した結果、幹部層よりも初期キャリアの若手社員や研修生が高頻度で利用していることが判明しました。これは「AIが若手の仕事を代替する」という一般的な見方とは異なる傾向を示しており、企業内でのAI活用が職位によって異なる形で浸透している実態が浮き彫りになっています。若手社員がAIを積極的に活用し、業務効率化やスキルアップに役立てている可能性を示唆しており、企業はAI導入戦略を見直すきっかけとなるでしょう。","source":"OpenAI","url":"https://newswitch.jp/p/47101","impact":"medium","tags":["ChatGPT Enterprise","AI活用","働き方"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"個人ゲーム開発者mikouri、ダークファンタジーRPG『ハイブラシルの魔王』のSteamストアページを公開","summary":"個人ゲーム開発者mikouri氏は、開発中のPC向けダークファンタジーRPG『ハイブラシルの魔王』のSteamストアページを8月15日に公開しました。本作は2027年配信予定で、魔王が勝利し停滞に覆われた世界を舞台に、記憶を失った主人公「ペペル」が世界を守護する神々を倒す旅に出るという壮大なストーリーが展開されます。序盤クリア後は、ムーンガードを倒す順番を自由に選択できるなど、高い自由度が特徴であり、プレイヤーは自分だけの冒険を楽しむことができます。インディーゲームシーンにおける期待の新作として注目されており、開発者の情熱が詰まった作品となるでしょう。","source":"mikouri","url":"https://gamebiz.jp/news/373977","impact":"low","tags":["インディーゲーム","RPG","Steam"]},{"title":"個人ゲーム開発者・秋月夢、推理アドベンチャー『Trick × Trick』をSteamで配信開始","summary":"個人ゲーム開発者・秋月夢氏は、超能力×ミステリー×デスゲームをテーマにした推理アドベンチャーゲーム『Trick × Trick』を8月15日よりSteamで配信開始しました。12人の高校生が生き残りをかけた議論に挑むという緊迫感あふれる内容で、プレイヤーは推理力を駆使して真実を解き明かす必要があります。発売延期を経てのリリースとなり、開発者のこだわりが詰まった作品として期待されています。インディーゲームファンにとっては、新たな刺激的な体験を提供するタイトルとなるでしょう。","source":"秋月夢","url":"https://www.famitsu.com/news/202608/15350912.html","impact":"low","tags":["インディーゲーム","アドベンチャー","Steam"]},{"title":"Android向けオフラインFPSがGoogle Playで公開","summary":"インディー開発者がAndroid向けのオフラインFPSゲームをGoogle Playで公開したと8月16日に報じられました。具体的なゲームタイトルは記載されていませんが、個人開発者が手軽に楽しめるゲームをリリースする動きが続いています。この動きは、モバイルゲーム市場におけるインディー開発者の存在感を示しており、多様なゲーム体験をユーザーに提供する機会を増やしています。オフラインで楽しめるため、インターネット接続がない環境でも気軽にプレイできる点が魅力であり、幅広いユーザー層にアピールする可能性があります。","source":"インディー開発者","url":"https://rio.st/2026/08/16/android-offline-fps-release/","impact":"low","tags":["モバイルゲーム","インディー開発","Android"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"ソニーとTSMCが次世代イメージセンサー開発に向け合弁会社設立へ","summary":"ソニーとTSMCが次世代イメージセンサーの開発を目的とした合弁会社を設立する方向で動いていると報じられています。この動きは、AIやIoTデバイスの進化に伴い高まる高性能イメージセンサーの需要に対応するための戦略的な提携と見られます。両社の技術とノウハウが融合することで、革新的なイメージセンサーが生まれ、自動運転やAR/VR、産業用ロボットなど多岐にわたる分野での技術革新を加速させるでしょう。半導体業界における重要な動きであり、今後の技術トレンドに大きな影響を与える可能性があります。","source":"ソニー、TSMC","url":"https://www.itmedia.co.jp/pcuser/articles/2608/16/news001.html","impact":"high","tags":["半導体","イメージセンサー","AIハードウェア"]},{"title":"SoftBank、コミケ108でミリ波Wi-Fiや移動基地局車を投入し通信対策を強化","summary":"ソフトバンクは、2026年8月15日と16日に東京ビッグサイトで開催される「コミケ108」に向けて、ミリ波を活用したWi-Fiサービスの提供や周辺基地局の増強など、複数の電波対策を実施すると発表しました。これは、十数万人が集まる大規模イベントでのアクセス集中による混雑緩和を目指し、最新技術を投入するものです。高密度なユーザー環境での通信品質確保は、5G技術の応用事例として重要であり、今後のイベント運営や都市インフラ整備にも示唆を与えます。ユーザーは快適な通信環境でイベントを楽しめるようになり、技術の社会実装が進む一例と言えるでしょう。","source":"SoftBank","url":"https://robotstart.info/2026/08/14/softbank-comiket108-5g.html","impact":"medium","tags":["5G","通信インフラ","イベントテクノロジー"]},{"title":"「Qwen3.8-27B」が8月15日にオープンウェイト公開：ローカル駆動可能なLLM","summary":"Alibabaが開発した、コンシューマ向けハードウェアでローカル駆動できる規模のLLM「Qwen3.8-27B」が8月15日0時にオープンウェイト公開されました。これは、ローカルで実行できるLLMとして人気が高い「Qwen3.6-27B」の後継モデルであり、個人ユーザーや小規模開発者が高性能なLLMをオフライン環境で利用できる機会を拡大します。上位の「Qwen3.8 Max」ではコーディングやプロフェッショナルワーク、科学分野での性能向上が期待されており、エッジAIやプライバシー重視のアプリケーション開発に大きな影響を与えるでしょう。オープンソースLLMの進化を示す重要な発表です。","source":"Alibaba","url":"https://pc.watch.impress.co.jp/docs/news/1814658.html","impact":"high","tags":["オープンソースLLM","ローカルAI","Alibaba"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
