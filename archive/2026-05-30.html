<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年5月31日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年5月31日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"NTTの国産LLM『tsuzumi 2 Visionモデル』発表、複雑な図表含むビジネス文書に対応","summary":"NTTが独自開発LLM「tsuzumi 2」のアップデート版「tsuzumi 2 Visionモデル」を発表しました。このモデルは、複雑な図表やグラフを含む日本語ビジネス文書を画像として読み込み、内容を理解して回答できる点が特徴です。1基のGPUで稼働する軽量性を維持しつつ、機密情報を扱う企業向けに業務のデジタル化を推進します。これまで人間による目視確認や手作業に頼っていた帳票類や会議資料の自動処理を可能にし、開発者にとっては新たなビジネスアプリケーション開発の機会を創出するでしょう。","source":"ITmedia ビジネスオンライン","url":"https://business.itmedia.co.jp/ait/articles/2605/28/news093.html","impact":"high","tags":["国産LLM","画像認識AI","ビジネスDX"]},{"title":"自治体AI zevoでClaude Opus 4.8が利用可能に、誠実さと安全性が向上","summary":"シフトプラス提供の自治体向け生成AIシステム「自治体AI zevo」で、Anthropicの最新AIモデル「Claude Opus 4.8」が利用可能になりました。Claude Opus 4.8は、回答の「誠実さ」と「安全性」が大幅に向上しており、根拠の乏しい主張を抑え、不確実な部分を明確に示すことで信頼性を高めます。これにより、自治体業務でのAI活用がより安全かつ効率的に進むことが期待されます。開発者にとっては、より信頼性の高いAIモデルを組み込んだソリューション提供の機会が広がります。","source":"PR TIMES","url":"https://prtimes.jp/main/html/rd/p/000000005.000085442.html","impact":"medium","tags":["Claude Opus","自治体AI","AI安全性"]},{"title":"リコー、生成AIの推論性能を測る独自ベンチマーク『JDocQA Reasoning Benchmark』を無償公開","summary":"リコーは、図表を含む日本語業務文書のAI推論（リーズニング）性能を評価するベンチマークツール「JDocQA Reasoning Benchmark」を無償公開しました。本ベンチマークは、単なる情報抽出に留まらず、計算・比較・傾向分析など複数段階の推論能力を評価できる点が特徴です。生成AIの実用化に向けた技術基盤の高度化に寄与し、Apache License 2.0およびCC BY-SA 4.0で商用・非商用問わず利用可能です。開発者はこれを利用して、自社AIモデルの性能を客観的に評価し、改善に役立てることができます。","source":"リコー","url":"https://jp.ricoh.com/release/2026/0529_1","impact":"high","tags":["AIベンチマーク","推論能力","日本語LLM"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"2026年のインディーハッキングは3年前と全く異なる、AIが製品構築・検証・成長をどう変えたか","summary":"RedditのIndieHackersコミュニティで、AIツールの進化がインディーハッキングを根本的に変えたという議論が注目を集めています。コーディングがボトルネックではなくなり、競争優位性が「流通」「ポジショニング」「ワークフロー設計」「データ優位性」に移ったと指摘されています。特に、ニッチなAIツールやAIエージェントが従来のSaaSを置き換える可能性が示唆されており、個人開発者にとっては実用的な戦略転換のヒントとなるでしょう。これは、AIを最大限に活用し、市場で差別化を図るための新たな視点を提供します。","source":"Reddit","url":"https://www.reddit.com/r/IndieHackers/comments/1bba70j/indie_hacking_in_2026_is_completely_different/","impact":"high","tags":["インディーハック","AI活用","競争優位性"]},{"title":"AIゲーム開発でClaude利用料が月額100万円超え、インディー開発者が直面するコスト課題","summary":"インディーゲーム開発者がAI（Claude Code）を本格的に利用した結果、月額利用料が100万円を超えたという具体的な事例が報告されました。AIを活用した開発の加速は可能であるものの、それに伴うコスト管理の重要性が浮き彫りになっています。この事例は、個人開発者が大規模LLMを開発ワークフローに組み込む際の費用対効果について真剣に考えるきっかけを提供します。開発者は、AIの恩恵とコストのバランスを慎重に評価する必要があるでしょう。","source":"窓の杜","url":"https://forest.watch.impress.co.jp/docs/genai/1802100.html","impact":"high","tags":["AIコスト","インディーゲーム","LLM利用料"]},{"title":"オンライン決済サービスStripeにおける『フレンドリー詐欺』問題、インディー系開発者が体験談を共有","summary":"インディー系開発ブランド「Gingerlime」を運営するヨアブ・アネル氏が、オンライン決済サービスStripeにおける「フレンドリー詐欺」（商品を受け取ったにもかかわらずチャージバックを申し立てる不正行為）について体験談を共有しました。彼はStripeの対応に疑問を呈しており、これはオンラインで商品を販売する多くのインディーハッカーにとって重要な情報です。開発者は、決済トラブルやチャージバックへの具体的な対策を検討し、自身のビジネスを守るための準備をする必要があります。","source":"GIGAZINE","url":"https://gigazine.net/news/20260527-stripe-friendly-fraud/","impact":"medium","tags":["Stripe","フレンドリー詐欺","決済トラブル"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"デジタル庁、政府職員向け生成AIプラットフォーム『ガバメントAI（源内）』の大規模実証を開始、約10万人が利用可能に","summary":"デジタル庁は、政府職員向けの生成AIプラットフォーム「ガバメントAI（源内）」の大規模実証を開始しました。5月29日時点で約10万人の職員が利用できる状態となり、今後全府省庁の約18万人に順次対象を拡大します。機密性2情報までの入力が許可され、国会答弁の原案作成など具体的な業務への適用が想定されており、公共部門のDX推進において重要な動きです。これは、政府機関におけるAI導入の本格化を示し、関連するシステム開発やセキュリティ対策の需要を高める可能性があります。","source":"ITmedia ビジネスオンライン","url":"https://business.itmedia.co.jp/ait/articles/2605/28/news093.html","impact":"high","tags":["デジタル庁","政府AI","DX推進"]},{"title":"米スタートアップのサイクオンタム、商務省と1億ドル支援の意向書に署名、量子コンピューティングと半導体製造を強化","summary":"米国の量子コンピューティングスタートアップPsiQuantumが、CHIPSおよび科学法に基づき最大1億ドルの連邦支援に関する意向書に署名しました。この支援は、高性能光スイッチや高温動作単一光子検出器、先端パッケージング技術の開発に充てられます。量子コンピューティングおよび半導体製造における米国のリーダーシップ強化を目的としており、国家レベルでの次世代コンピューティング産業と半導体基盤の強化に向けた重要な投資となります。これは、将来の技術トレンドを形成する上で注目すべき動きです。","source":"JETRO","url":"https://www.jetro.go.jp/biznews/2026/05/8504546a16b9d62d.html","impact":"high","tags":["量子コンピューティング","半導体","国家戦略"]},{"title":"GitHub、内部リポジトリへの不正アクセス被害を公表、約3800件のデータ流出か","summary":"ソフトウェア開発プラットフォームのGitHubは、従業員が使用しているデバイスへの不正アクセスを検知し、約3800件の内部リポジトリからのデータ流出が確認されたと発表しました。この侵害にはVisual Studio Codeの拡張機能が関与していたとされ、重要な機密情報は既に更新されたとのことです。この事件は、開発者や企業にとってサプライチェーンセキュリティ、特に開発ツールや環境のセキュリティ対策の重要性を再認識させる事例となります。開発者は、自身の開発環境のセキュリティを定期的に見直す必要があります。","source":"Game*Spark","url":"https://www.gamespark.jp/article/2026/05/20/157242.html","impact":"high","tags":["GitHub","セキュリティ侵害","サプライチェーンセキュリティ"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
