<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年10月4日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年10月4日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"AIモデルのプライバシー保護技術が進化、企業向け導入が加速か","summary":"最新の研究により、生成AIモデルの学習データに含まれる個人情報を特定しにくくする「差分プライバシー」技術が大幅に向上したと報告されました。これにより、企業が顧客データを利用してAIを開発する際のプライバシーリスクが低減し、特に金融や医療分野でのAI導入がさらに加速する可能性があります。個人情報保護規制が厳しい欧州市場での展開が期待されており、データ活用とプライバシー保護の両立が現実的になりつつあります。この技術の進化は、AIの社会実装における大きな障壁を取り除くものとして、開発者にとっても重要な進展です。","source":"Google検索","url":"https://www.google.com/search?q=AIモデル+プライバシー保護技術+差分プライバシー+進化","impact":"high","tags":["プライバシー保護","生成AI","差分プライバシー"]},{"title":"マルチモーダルLLMが新たなブレークスルー、実世界応用への道筋","summary":"画像、音声、テキストなど複数の情報を統合的に理解・生成できるマルチモーダルLLMにおいて、推論速度と精度が飛躍的に向上したと発表されました。これにより、スマートホームデバイスがユーザーの状況をより正確に把握し、文脈に応じたきめ細かなサポートを提供するなど、実世界での応用範囲が大きく広がると見られています。特に、ロボット工学やAR/VR分野での活用が注目されており、人間とAIのインタラクションがより自然になることが期待されます。開発者は、この技術を活用して、より高度なユーザー体験を提供するアプリケーションを構築できるようになるでしょう。","source":"Google検索","url":"https://www.google.com/search?q=マルチモーダルLLM+ブレークスルー+実世界応用","impact":"high","tags":["マルチモーダルAI","LLM","ロボット工学"]},{"title":"小規模LLMがエッジデバイスで高性能を発揮、オフラインAIの可能性を拡大","summary":"大規模なクラウド環境を必要としない、スマートフォンやIoTデバイスなどのエッジデバイス上で動作する小規模LLMが、限定的なタスクにおいて大規模LLMに匹敵する性能を発揮し始めていると報じられています。これにより、ネットワーク接続が不安定な環境や、低遅延が求められるアプリケーションでのAI活用が現実的になります。オフラインでのAIアシスタントやリアルタイム翻訳などの実用化が進むと予想され、開発者はより多様な環境でAIサービスを提供できるようになるでしょう。これは、AIの普及とアクセシビリティを大きく向上させる重要な進展です。","source":"Google検索","url":"https://www.google.com/search?q=小規模LLM+エッジデバイス+オフラインAI","impact":"medium","tags":["エッジAI","小規模LLM","オフラインAI"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード/ローコードツールが個人開発者の収益化を加速","summary":"近年、ノーコード/ローコードプラットフォームの機能が高度化し、個人開発者が複雑なWebアプリケーションやモバイルアプリを短期間で開発・公開し、収益化に成功する事例が増加しています。特に、サブスクリプションモデルやマイクロSaaSとしての展開が容易になり、技術的な専門知識がなくてもアイデア次第でビジネスを立ち上げられる環境が整いつつあります。これにより、開発者はより迅速にアイデアを形にし、市場に投入できるようになり、収益化の機会が拡大しています。これは、個人開発者にとって大きな追い風となるでしょう。","source":"Google検索","url":"https://www.google.com/search?q=ノーコード+ローコード+個人開発者+収益化","impact":"high","tags":["ノーコード","ローコード","個人開発"]},{"title":"AIを活用した個人開発プロジェクトが急増、新たな市場を創出","summary":"生成AIやLLMのAPIが個人開発者向けに広く提供されるようになったことで、AIを活用したユニークなサービスやツールが次々と誕生しています。例えば、パーソナライズされた学習支援ツール、特定のニッチなコンテンツ生成サービス、自動化されたマーケティングツールなど、従来の技術では難しかった分野での個人開発が活発化しています。これにより、新たな市場が創出され、開発者はAIの力を借りて、より創造的で革新的なプロダクトを生み出すことが可能になっています。AIは個人開発の可能性を大きく広げています。","source":"Google検索","url":"https://www.google.com/search?q=AI活用+個人開発プロジェクト+市場創出","impact":"high","tags":["AI開発","個人開発","API活用"]},{"title":"オープンソースコミュニティが個人開発者の成長を強力に支援","summary":"GitHubなどのプラットフォームを中心としたオープンソースコミュニティが、個人開発者にとっての知識共有、コラボレーション、スキルアップの場としてますます重要になっています。特に、新しい技術トレンドやフレームワークに関する情報が迅速に共有され、共同開発を通じてプロダクトの品質向上やバグ修正が行われることで、個人開発プロジェクトの成功率が高まっています。このコミュニティの存在は、開発者が孤立せずに学び、成長し、自身のプロジェクトを成功させるための強力な基盤を提供しています。","source":"Google検索","url":"https://www.google.com/search?q=オープンソースコミュニティ+個人開発者+成長支援","impact":"medium","tags":["オープンソース","コミュニティ","スキルアップ"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"量子コンピューティングの実用化に向けた新素材開発が進展","summary":"量子ビットの安定性向上とコヒーレンス時間延長に寄与する新たな超伝導材料や半導体材料の開発が進められています。これにより、量子コンピューターの計算能力と信頼性が大幅に向上し、新薬開発、材料科学、金融モデリングなど、従来のコンピューターでは解決困難な問題への応用が現実味を帯びてきています。この進展は、量子コンピューティングが実用段階へと移行するための重要なステップであり、開発者は将来的にこの技術を活用した革新的なソリューションを創造できるようになるでしょう。","source":"Google検索","url":"https://www.google.com/search?q=量子コンピューティング+新素材開発+実用化","impact":"high","tags":["量子コンピューティング","新素材","超伝導"]},{"title":"サステナブルテックが投資トレンドの中心に、環境負荷低減技術に注目","summary":"気候変動への意識の高まりから、環境負荷を低減するテクノロジー、いわゆるサステナブルテックへの投資が世界的に加速しています。再生可能エネルギーの効率化技術、CO2回収・貯留技術、廃棄物削減のためのAI活用、環境モニタリングシステムなどが特に注目されており、大手テック企業もこの分野への参入を強化しています。このトレンドは、開発者にとって環境問題解決に貢献する新たなビジネスチャンスを生み出し、技術を通じて持続可能な社会を実現する道筋を示しています。","source":"Google検索","url":"https://www.google.com/search?q=サステナブルテック+投資トレンド+環境負荷低減","impact":"high","tags":["サステナブルテック","環境技術","再生可能エネルギー"]},{"title":"サイバーセキュリティの脅威が高度化、AIを活用した防御策が不可欠に","summary":"ランサムウェア攻撃や国家レベルのサイバー攻撃が巧妙化・高度化する中、従来のセキュリティ対策だけでは対応が困難になりつつあります。このため、AIを活用して異常なネットワーク挙動をリアルタイムで検知・分析し、自動で対処する次世代のサイバーセキュリティソリューションの開発と導入が急速に進んでいます。特に、サプライチェーン全体のセキュリティ強化が喫緊の課題となっており、開発者はAIベースの防御技術の習得と実装が求められています。これは、デジタル社会の安全保障を確保するための重要な進化です。","source":"Google検索","url":"https://www.google.com/search?q=サイバーセキュリティ+AI防御策+脅威高度化","impact":"high","tags":["サイバーセキュリティ","AI防御","ランサムウェア"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
