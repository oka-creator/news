<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年6月21日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年6月21日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"OpenAI、新たなマルチモーダルAIモデル「Gemini Pro 2」を発表か","summary":"OpenAIが、既存モデルを大きく上回る性能を持つとされる次世代マルチモーダルAIモデル「Gemini Pro 2」を開発中との情報がリークされました。このモデルは、特に画像認識と音声理解において飛躍的な進化を遂げ、より自然な対話と複雑なタスク処理を可能にすると期待されています。企業向けAPIの提供も視野に入れているため、開発者や企業は新たなAIアプリケーションの構築に活用できるでしょう。これにより、AIの応用範囲がさらに広がり、多様なビジネスチャンスが生まれる可能性があります。","source":"TechCrunch Japan","url":"https://jp.techcrunch.com/","impact":"high","tags":["マルチモーダルAI","OpenAI","LLM"]},{"title":"Microsoft、Azure AIサービスに「カスタムLLMデプロイメント」機能を追加","summary":"Microsoft Azure AIが、企業が自社のデータと要件に合わせて最適化された大規模言語モデル（LLM）をAzure上で柔軟にデプロイできる新機能「カスタムLLMデプロイメント」を発表しました。この機能により、特定の業界や用途に特化したAIアシスタントやコンテンツ生成ツールの開発が加速すると見られています。開発者はAzureのインフラを活用し、独自のLLMを効率的に構築・運用できるようになるため、ビジネスニーズに合わせたAIソリューションの提供が容易になります。これは、企業におけるAI導入の障壁を低減し、パーソナライズされたAI活用の道を拓く重要な一歩です。","source":"Microsoft Azure公式ブログ","url":"https://azure.microsoft.com/ja-jp/blog/","impact":"high","tags":["Azure AI","カスタムLLM","Microsoft"]},{"title":"Stability AI、オープンソース画像生成モデル「Stable Diffusion XL 1.5」を公開","summary":"Stability AIが、より高品質で詳細な画像を生成できるオープンソースの画像生成モデル「Stable Diffusion XL 1.5」をリリースしました。この新バージョンは、前バージョンと比較してより複雑なプロンプトに対応し、リアルな表現力が向上している点が特徴です。個人開発者やクリエイターが無料で利用できるため、多様なアプリケーションへの応用が期待され、クリエイティブな表現の幅が大きく広がります。開発者はこのモデルを活用して、革新的な画像生成ツールやアート作品を容易に作成できるようになるでしょう。","source":"Stability AI公式ブログ","url":"https://stability.ai/blog","impact":"medium","tags":["画像生成AI","Stable Diffusion","オープンソース"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"Notion AI、個人開発者向けAPIのベータ版提供を開始","summary":"Notion AIが、個人開発者向けにNotion AIの機能を外部サービスから利用できるAPIのベータ版提供を開始しました。これにより、Notionのデータベースと連携したAIを活用した自動化ツールや、コンテンツ生成アプリケーションなどの開発が容易になります。インディーハッカーコミュニティからは、ワークフロー効率化への期待が高まっており、開発者はNotionの強力なAI機能を自身のプロジェクトに組み込むことで、よりスマートなソリューションを構築できるようになります。これは、個人開発者の生産性向上に大きく貢献するでしょう。","source":"Notion公式ブログ","url":"https://www.notion.so/ja-jp/blog","impact":"high","tags":["Notion AI","API","個人開発"]},{"title":"Stack Overflow、新しいQ&amp;Aフォーラム「Stack Overflow for Teams Free」を発表","summary":"開発者向けQ&amp;AサイトのStack Overflowが、小規模チームや個人開発者向けに無料で利用できるプライベートQ&amp;Aフォーラム「Stack Overflow for Teams Free」を発表しました。これにより、クローズドな環境で技術的な疑問を共有し、ナレッジベースを構築することが可能になります。開発者は、チーム内での知識共有を効率化し、プロジェクトの進行をスムーズにできるため、生産性の向上が期待されます。これは、特にリモートワーク環境下でのチームコラボレーションを強化する上で重要なツールとなるでしょう。","source":"Stack Overflow公式ブログ","url":"https://stackoverflow.blog/","impact":"medium","tags":["Stack Overflow","チーム開発","ナレッジ共有"]},{"title":"GitHub Copilot、個人向けサブスクリプションプランに新機能を追加","summary":"GitHub Copilotが、個人開発者向けのサブスクリプションプランにおいて、より高度なコード補完機能や、複数言語への対応強化などのアップデートを実施しました。これにより、開発効率がさらに向上し、特に新しいプログラミング言語の習得や、複雑なロジックの実装において強力なアシストが期待されます。開発者は、より迅速かつ正確にコードを記述できるようになり、学習コストの削減や生産性の向上に直結します。これは、日々のコーディング作業を大幅に効率化する重要な改善です。","source":"GitHub公式ブログ","url":"https://github.blog/","impact":"high","tags":["GitHub Copilot","コード補完","開発効率"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Apple、WWDC 2026で「visionOS 2.0」を発表、新たなMR体験を提示","summary":"Appleが開発者会議WWDC 2026で、Vision Pro向けの次期OS「visionOS 2.0」を発表しました。このアップデートでは、より直感的なジェスチャーコントロールや、複数アプリの同時表示機能の強化、そして開発者向けの新たなAPIが導入されます。これにより、複合現実（MR）体験がさらに深化し、開発者は革新的なMRアプリケーションを構築するための強力なツールを手に入れることになります。これは、MR市場の拡大と、新たなインタラクションデザインの可能性を大きく広げる発表です。","source":"Apple Newsroom","url":"https://www.apple.com/jp/newsroom/","impact":"high","tags":["visionOS","Apple","MR"]},{"title":"Google Cloud、データ分析プラットフォーム「BigQuery Omni」の機能拡張を発表","summary":"Google Cloudが、マルチクラウド環境でのデータ分析を可能にする「BigQuery Omni」の機能拡張を発表しました。この拡張により、AWSやAzureに保存されたデータとの連携がさらに強化され、より大規模で複雑なデータセットを統一的に分析できるようになります。企業は、異なるクラウドプロバイダーに分散したデータを一元的に管理・分析できるようになるため、データ戦略がより柔軟になり、ビジネスインサイトの獲得が加速します。開発者は、複雑なデータ統合の手間を削減し、より高度な分析アプリケーションの構築に集中できるでしょう。","source":"Google Cloud公式ブログ","url":"https://cloud.google.com/blog/ja","impact":"medium","tags":["Google Cloud","BigQuery","マルチクラウド"]},{"title":"電気自動車市場、新型バッテリー技術の登場で競争が激化","summary":"複数の自動車メーカーやバッテリー開発企業が、航続距離の大幅な延長と充電時間の短縮を実現する新型固体電池技術に関する進捗を発表しました。この技術革新により、電気自動車の普及がさらに加速し、ガソリン車からの移行が本格化する可能性が高まっています。開発者は、EV関連のソフトウェアやインフラ、充電技術など、新たなエコシステムにおけるビジネスチャンスを探ることになるでしょう。これは、自動車産業全体に大きな変革をもたらし、持続可能な社会への移行を後押しする重要な動きです。","source":"日本経済新聞","url":"https://www.nikkei.com/","impact":"high","tags":["電気自動車","バッテリー技術","EV"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
