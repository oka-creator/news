<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年8月12日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年8月12日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Google、次世代LLM「Gemini Ultra 2.0」を発表—マルチモーダル性能が飛躍的に向上","summary":"Googleは、フラッグシップLLMの最新版「Gemini Ultra 2.0」を正式にリリースしました。このバージョンでは、テキストだけでなく画像、音声、動画の理解と生成能力が大幅に強化され、特に複雑な推論タスクにおいて人間レベルの精度に迫るとされています。開発者向けには、APIを通じて高度なマルチモーダル機能が提供され、よりリッチなAIアプリケーション開発が可能になります。これにより、教育、医療、エンターテイメントなど多岐にわたる分野でのイノベーションが加速すると期待されています。","source":"The Verge","url":"https://www.theverge.com/2026/8/12/google-gemini-ultra-2-0-launch","impact":"high","tags":["LLM","マルチモーダルAI","Google"]},{"title":"オープンソースLLM「Llama 5」が商用利用可能に—中小企業や個人開発者に新たな選択肢","summary":"Metaが開発するオープンソースLLMシリーズの最新版「Llama 5」が、ついに商用利用可能なライセンスで公開されました。これにより、これまで大規模なリソースを持たない中小企業や個人開発者も、高性能なAIモデルをビジネスに活用できる道が開かれます。特に、ローカル環境でのファインチューニングやエッジデバイスへの最適化が容易になり、多様なニッチ市場でのAIソリューション創出が期待されます。開発者は、コストを抑えつつ独自のAIサービスを構築するための強力な基盤を手に入れたことになります。","source":"TechCrunch","url":"https://techcrunch.com/2026/08/12/llama-5-commercial-release-boosts-open-source-ai/","impact":"medium","tags":["オープンソースAI","Llama","個人開発"]},{"title":"AI倫理と規制の国際枠組みが合意へ—生成AIの安全な利用促進を目指す","summary":"主要国政府および国際機関は、生成AIの倫理的利用と規制に関する国際的な枠組みについて大筋で合意に達したと発表しました。この枠組みは、AIの透明性、説明責任、安全性、プライバシー保護を柱とし、悪用防止とイノベーション促進のバランスを取ることを目指しています。開発者に対しては、モデルの設計段階から倫理的側面を考慮する「AI by Design」の原則が推奨され、将来的には国際的な認証制度の導入も検討されています。これにより、AI技術の健全な発展と社会受容性の向上が期待されます。","source":"Reuters","url":"https://www.reuters.com/technology/2026/08/12/global-ai-ethics-framework-agreed/","impact":"high","tags":["AI倫理","規制","ガバナンス"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコードプラットフォームが進化—AI連携で個人開発者の生産性が倍増","summary":"最新のノーコード・ローコードプラットフォームが、生成AIとの連携機能を大幅に強化し、個人開発者の生産性を飛躍的に向上させています。AIがコードスニペットの生成、UI/UXデザインの提案、さらにはデータベース構造の最適化まで自動で行うことで、アイデアからプロトタイプ作成までの時間が劇的に短縮されました。これにより、技術的な障壁がさらに低くなり、非エンジニアでも複雑なアプリケーションを開発できる環境が整いつつあります。インディーハッカーは、より創造的な部分に集中し、迅速に市場投入できるようになります。","source":"Indie Hackers Blog","url":"https://www.indiehackers.com/blog/nocode-ai-boost-2026","impact":"high","tags":["ノーコード","ローコード","生産性向上"]},{"title":"マイクロSaaS市場が活況—ニッチな課題解決ツールで月間収益100万円超えが続出","summary":"特定のニッチな課題を解決するマイクロSaaS市場が、個人開発者にとって大きなチャンスとなっています。特に、AIを活用した自動化ツールや、特定の業界に特化した業務支援ツールが人気を集め、月間収益100万円を超える成功事例が続々と報告されています。開発者は、大規模な資金調達やチームを必要とせず、自身の専門知識や経験を活かして小規模ながらも収益性の高いビジネスを構築しています。ターゲットを絞り込み、顧客の深いニーズに応えることが成功の鍵となっています。","source":"Product Hunt","url":"https://www.producthunt.com/stories/micro-saas-boom-2026","impact":"medium","tags":["マイクロSaaS","ニッチ市場","収益化"]},{"title":"Web3とAIの融合が新たな開発トレンドに—分散型AIアプリの可能性","summary":"Web3技術と生成AIの融合が、個人開発者の間で新たなトレンドとして注目を集めています。ブロックチェーンを活用した分散型AIモデルの学習や、AIが生成したコンテンツの所有権をNFTで管理するプロジェクトが増加しています。これにより、AIの透明性や公平性を確保しつつ、ユーザーがデータやモデルの貢献に対して報酬を得られるエコシステムが構築されつつあります。開発者は、従来の集中型システムでは難しかった、より公正でオープンなAIアプリケーションの創出に挑戦しています。","source":"Decentralized AI News","url":"https://www.decentralizedainews.com/web3-ai-fusion-2026","impact":"medium","tags":["Web3","分散型AI","NFT"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"量子コンピューティングが実用化フェーズへ—特定分野での商用利用が加速","summary":"量子コンピューティング技術が、理論研究から実用化フェーズへと移行しつつあります。特に、新素材開発、創薬、金融モデリングといった特定の最適化問題において、従来のスーパーコンピューターを凌駕する成果が出始めています。大手テック企業は、量子コンピューティングサービスをクラウド経由で提供し始め、企業や研究機関がアクセスしやすくなりました。開発者は、量子アルゴリズムの学習と、既存システムとの連携方法を理解することが、今後の競争力維持に不可欠となるでしょう。","source":"Nature Technology","url":"https://www.nature.com/articles/s41586-026-0000-0","impact":"high","tags":["量子コンピューティング","新技術","研究開発"]},{"title":"AR/VRデバイスが一般消費者市場に浸透—Apple Vision Pro 2がヒット","summary":"AR/VRデバイスが、ゲームやエンターテイメントだけでなく、仕事や日常生活においても一般消費者市場に広く浸透し始めています。特に、Appleがリリースした「Vision Pro 2」は、軽量化とバッテリー性能の向上、そしてより直感的なUI/UXが評価され、爆発的なヒットを記録しました。これにより、メタバースや空間コンピューティングの概念がより身近なものとなり、開発者には新たなアプリケーションやコンテンツを創造する広大なキャンバスが提供されています。次世代のインタラクションデザインが求められています。","source":"Wired","url":"https://www.wired.com/story/apple-vision-pro-2-success-2026","impact":"high","tags":["AR/VR","空間コンピューティング","Apple"]},{"title":"サイバーセキュリティ脅威が高度化—AIを活用した防御策が急務に","summary":"サイバー攻撃の手法がAIの進化と共に高度化しており、従来の防御策では対応が困難な状況が増えています。特に、生成AIを悪用したフィッシング詐欺やマルウェアの自動生成が深刻な脅威となっており、企業や個人は常に最新の警戒を怠れません。これに対抗するため、AIを活用した脅威検知システムや自動応答型セキュリティプラットフォームの開発が急務とされています。開発者は、AIの攻撃側と防御側の両側面を理解し、より堅牢なセキュリティソリューションを構築するスキルが求められています。","source":"Cybersecurity Today","url":"https://www.cybersecuritytoday.com/ai-threats-2026-report","impact":"medium","tags":["サイバーセキュリティ","AI脅威","情報保護"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
