<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年8月3日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

"AI安全性","AIガバナンス","OpenAI","Anthropic"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"RedditとIndie Hackersが早期ユーザー獲得にProduct Huntを上回る効果","summary":"2026年のユーザー獲得戦略において、RedditやIndie Hackersで「今週何がうまくいかなかったか」といった率直なアップデートを投稿することが、Product Huntでの宣伝よりもはるかに多くの実際の早期ユーザー（3〜8倍のサインアップ）を獲得できるという報告が共有されました。これは、洗練されたプレゼンテーションよりも、脆弱性を共有することでコミュニティと信頼を構築する方が効果的であるという、インディーハッカーにとって実践的な教訓を示しています。個人開発者は、プロダクトの完璧さよりも、透明性とコミュニティとの対話を重視したマーケティング戦略を検討すべきです。","source":"Indie Hackers","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFWTPhC8eJYddqLq7wuUiD3nt5cF7zv7rBIao8zonQ9V8p2gTsrOHUwN7hXBkn6gIitmLcUX2ata0IlKU9U1aPJUsT_1d1oeT17x5o4XL9S9fTAmeHEm0PZ0Hou0HjiK4OPl9ti7S9SeQ9ybFpxyHnw7YApS-46zM_vm96VF_bPTAonu2ERmwb9pbFcqSYdR9Xwv_Nq38YFSOYEnCv25CdyMeY=","impact":"medium","tags":["ユーザー獲得","コミュニティ","マーケティング","インディーハッカー"]},{"title":"インディーゲーム『Endacopia』がSteamで大成功","summary":"インディーゲームクリエイターのAndyland（Andrés Guerrero）氏が2026年7月27日にPC（Steam）でリリースしたポイント＆クリック式アドベンチャーゲーム『Endacopia』が、発売後すぐに大きな反響を呼びました。発売から24時間以内に同時接続者数2500人以上を記録し、その後も1000人台を維持する盛況ぶりを見せています。Andyland氏はYouTubeチャンネル登録者数114万人を誇るインディーアニメーター兼ゲーム開発者でもあり、その独特な世界観が多くのプレイヤーを魅了しています。この成功は、個人開発者が独自のクリエイティブなビジョンと既存のファンベースを組み合わせることで、大きな成果を出せる可能性を示しています。","source":"AUTOMATON","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHBn-NYhevQuzjrix6wlGG925dEp3TvrY8pOYwgZ0Db9l8iIZRLzEurY6lYTU_gPDdtxLAZ5YIMYI5FG2rCp6SOEdK3R-b0LJTwlTJ32f4xqlZWNbZVmgNgVbvvp-Nubw5RYhBy16dnjmk3eKBsQ1uTI9MPTw6HjA==","impact":"medium","tags":["インディーゲーム","Steam","成功事例","ゲーム開発"]},{"title":"存在しないアプリをTikTokでバズらせ、4ヶ月で月450万円達成した個人開発者","summary":"ある23歳の青年が、まだ開発されていないアプリのコンセプトをTikTokに投稿してバズらせ、そこからアプリを開発してわずか4ヶ月で月間450万円の収益を達成した事例が紹介されています。この成功は、いきなり開発に着手するのではなく、ショート動画マーケティングを活用してコンセプトを消費者に当て込み、需要を確認してから開発するという、個人開発者にとって非常に効率的でリスクの低いアプローチを示唆しています。開発者は、市場の需要を事前に検証し、最小限のリソースでプロダクトを検証するリーンスタートアップ的な手法を積極的に取り入れるべきです。","source":"みんなのニュースレター","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGY2bDoTlTgxvEduMiaT-OAKvThRSsDCKIDMVwUhMj2zzmia6ZasqtMZjQ-h4qLsfsMOuF15yvJtfp2kJMwlmOe2xxXTdpZP84Vg1d2smdgPayn-Ba-9FqK2aiA","impact":"high","tags":["アプリ開発","TikTokマーケティング","リーンスタートアップ","収益化"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"空飛ぶクルマ、「利用したくない」が過半数超えで社会受容性に課題","summary":"MS&amp;ADインターリスク総研が2026年8月1日に発表した最新の調査結果によると、「空飛ぶクルマ」を「利用したくない」と回答した人が過半数の50.7％に達しました。年次調査では利用希望の割合が徐々に下がっており、実用化・商用化に向けた開発が活発化しているにもかかわらず、社会受容性の課題が浮き彫りになっています。開発事業者にとっては、2027年〜2028年の商用運航を目指す中で、この想定需要の落ち込みは大きな痛手となる可能性があります。技術開発だけでなく、安全性や利便性、コストに関する一般市民への啓発と信頼構築が急務です。","source":"自動運転ラボ","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEUYlg9uRW4cB1FDTQia5X5UlSWteiwvPjZHnrDyj_NyrTs9KUe-JJuSpNUIOr48ZitgjQ5_7EaAVI9gzvRjdomZB-V2EnpFK4aBGdzfuKltRLISELb_lKO4B-UEQ==","impact":"medium","tags":["空飛ぶクルマ","社会受容性","モビリティ","市場調査"]},{"title":"ビッグテック決算でAI投資の「収益性」が重視される時代へ","summary":"主要ビッグテック企業の決算発表が集中した週となり、MicrosoftやAmazonはクラウド事業におけるAIサービスによる収益拡大が評価され、株価が急騰しました。一方でAppleは売上高成長率ガイダンスが市場予想を下回り株価が下落しました。市場はAI投資の「金額」ではなく、「それが利益に結びついているか」を重視する傾向を強めており、AI業界は「どれだけ投資したか」から「どれだけ利益を生んだか」という評価軸へ移行しつつあります。これは、AI関連技術を開発する企業にとって、技術革新だけでなく、そのビジネスモデルと収益化戦略がこれまで以上に重要になることを意味します。","source":"Investing.com","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFzAMu5z7bWgF-sBMhXa1pbYJ5chZBQ4oBbS7T66LSRXwTvkNBKVQQcEe6cCIFlnrGRoYuFXDW0XzaSW4L3YRk70tTQkvLhJRYMZJVbgwbSJBOXlIvOvF2RWOqu7XU7QUvDitviAL_2YasrZFRj_TZcx0xaAIkd1wgdiw==","impact":"high","tags":["AI投資","ビッグテック","収益性","市場トレンド"]},{"title":"PlayStationのディスク廃止を巡るボイコット運動「#PSBlackout」が拡大","summary":"2028年1月以降発売のPlayStation向け新作ゲームのディスク版生産終了を巡り、海外でボイコット運動「#PSBlackout」が呼びかけられています。この運動は、2026年8月23日から8月30日までの1週間、ソニーのプラットフォームへのログイン、ゲームプレイ、商品購入を控えるようユーザーに促すものです。ハッカー集団「アノニマス」もこの運動への支持を表明しており、「所有する時代の終わりが近づいている」と警鐘を鳴らしています。これは、デジタルコンテンツの所有権に関する消費者と業界の間の大きな議論を巻き起こしており、ゲーム開発者やパブリッシャーは、デジタル専売への移行がユーザーの反発を招くリスクを考慮する必要があります。","source":"Game*Spark","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGRSWwYsDT8AzylQzYzER1vwcyQEArG5lHZ1aJhq-NPdv6fxI0l-_WsK6mxP1gj4Am6QjoEdgoRMebsBx0MY9u8N_xEkNMspzBiG3dqzMUx48p1gt9OFnQKHYDY9q6nAUcLHHSAnnimhbPrPfSUKU0bBzA==","impact":"medium","tags":["PlayStation","デジタルコンテンツ","ゲーム業界","消費者運動"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
