<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年10月8日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"カリフォルニア州、弁護士の生成AI利用に関する初の包括的法案を可決","summary":"カリフォルニア州は2026年9月30日、弁護士が生成AIを使用する際の基準を定める上院法案574号（SB 574）を可決しました。この法律は2027年1月1日に施行され、弁護士は生成AIの出力の正確性、特に判例や法令引用の正確性を検証し、誤りや「幻覚」を修正するための「合理的な措置」を講じることを義務付けます。この動きは、AIが生成する情報の信頼性を確保し、法曹界におけるAIの責任ある利用を促進するための重要な一歩となります。弁護士はAIツール利用時に生成内容のファクトチェックを徹底し、特に引用情報の正確性には細心の注意を払う必要があります。AIによる「幻覚」を防ぐための検証プロセスをワークフローに組み込むことが不可欠です。","source":"Ropes &amp; Gray","url":"https://www.ropesgray.com/en/insights/alerts/2026/10/california-enacts-sb-574-nations-first-law-governing-attorneys-use-of-generative-artificial-intelligence","impact":"high","tags":["AI規制","法曹界","生成AI","ファクトチェック"]},{"title":"エンタープライズAI市場が「実験」から「価値創出」へ移行 – PwCとCohereが提携","summary":"2026年10月5日、PwCとAI企業Cohereは、安全なエンタープライズAIの導入を加速するためのグローバルアライアンスを発表しました。この提携は、Cohereのセキュリティを重視したエージェントAIプラットフォームとPwCの業界専門知識を組み合わせ、企業がAI投資から測定可能なビジネス価値を引き出すことを目的としています。多くの企業がAIの概念実証は行っているものの、大規模な導入と具体的なリターンに苦戦している現状に対し、このアライアンスはAIの導入リスクと規制要件への対応を支援します。企業はAI導入において、単なる技術導入に留まらず、セキュリティ、コンプライアンス、データ主権などのガバナンスを重視した戦略が求められます。PwCとCohereのような専門パートナーとの連携は、これらの課題を克服し、AIをビジネスプロセスに安全かつ効果的に統合するための鍵となります。","source":"PwC","url":"https://www.pwc.com/ca/en/media/release/pwc-cohere-global-alliance-secure-trusted-enterprise-ai-adoption.html","impact":"high","tags":["エンタープライズAI","ビジネス価値","AIガバナンス","PwC","Cohere"]},{"title":"2026年の主要な小型言語モデル（SLM）動向：オンデバイスAIと長文脈処理の進化","summary":"2026年10月1日時点での小型言語モデル（SLM）の進化が注目されており、特にQwen3.5-4B、Gemma 3n E4B、Phi-4-mini-instructなどが挙げられています。これらのモデルは、モバイルデバイスやノートPC上での効率的な実行、長文脈処理、マルチモーダル対応（テキスト、画像、音声）に特化しており、従来の大型モデルに比べて低コストかつ高速な推論が可能です。個人開発者や企業は、特定のタスクやオンデバイスでの利用に特化したSLMを活用することで、コストを抑えつつ高性能なAIアプリケーションを開発できます。特に、Qwen3.5-4Bはマルチモーダル対応と262Kトークンの長文脈処理、Gemma 3n E4Bはモバイル・ノートPCでの効率的なマルチモーダル体験、Phi-4-mini-instructはMicrosoft環境での長文脈テキストワークフローに適しています。","source":"Guideflow","url":"https://www.guideflow.com/blog/best-small-language-models-2026","impact":"medium","tags":["SLM","オンデバイスAI","長文脈処理","マルチモーダルAI"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"クリエイターエコノミー、リーチから「親和性」の時代へ移行","summary":"2026年10月5日、クリエイターエコノミーは「リーチの時代」から「親和性の時代」へと移行していると報じられました。ボットによるインプレッションやAI生成コンテンツの増加により、単なる視聴回数やクリック数は意味をなさなくなり、クリエイターとファンとの間に築かれるロイヤルティや、具体的な行動を促す「成果」が最も重要視されています。この変化は、ブランドがクリエイターと提携する際の戦略や、クリエイター自身の収益化モデルに大きな影響を与えています。個人開発者やインディーハッカーがクリエイターエコノミーで成功するためには、単に多くのフォロワーを獲得するだけでなく、ニッチなコミュニティで深いエンゲージメントを築き、ファンを行動に導くコンテンツやプロダクトを提供することが重要です。成果ベースの収益化モデルや、長期的なパートナーシップに焦点を当てるべきです。","source":"Evan Shapiro Substack","url":"https://evanshapiro.substack.com/p/disrupting-the-creator-economy","impact":"high","tags":["クリエイターエコノミー","エンゲージメント","収益化","コミュニティ"]},{"title":"ASUSがNVIDIA RTX Spark搭載のProArt PCを発表、ローカルAI開発を強化","summary":"2026年10月8日、ASUSはNVIDIA RTX Sparkを搭載した新型ProArt P16およびP14ノートPCとProArt GR1X mini PCのグローバル発売を発表しました。これらのシステムは、大容量の統合メモリ、強力なNVIDIA Blackwell RTX GPU、超効率的なNVIDIA Grace CPUを備え、クリエイターやAI開発者向けに設計されています。ローカルでのAIモデル実行とクリエイティブアプリケーションの統合エコシステムを提供し、ComfyUIやMuseTreeといった生成AIツールをユーザー自身のPCで実行できる柔軟性を提供します。個人開発者は、これらのAI対応PCを活用することで、より大規模なAIモデルや高解像度の生成、複雑なワークフローをローカルで実行できるようになります。これにより、クラウドサービスに依存することなく、データプライバシーを保ちながら高度なAI開発やクリエイティブ作業が可能になります。","source":"Business Wire","url":"https://www.businesswire.com/news/home/20261007886072/en/ASUS-ProArt-RTX-Spark-Windows-PCs-Available-for-Immediate-Pre-Order-Today-Delivering-Integrated-Ecosystem-of-AI-Agents-and-Creative-Apps","impact":"high","tags":["ローカルAI","NVIDIA RTX Spark","ASUS ProArt","AI開発環境"]},{"title":"画像認識AI、非エンジニアでもPythonで試作可能な時代に","summary":"2026年10月7日付けの記事によると、画像認識AIはもはや研究者や専門エンジニアだけのものではなく、PythonとOpenCV、TensorFlowなどの無料ライブラリを使えば、個人でも不良品検査や人数カウントなどの仕組みを試作できる時代になったと解説されています。クラウド上のGPU環境を時間単位で利用できるため、試作段階の初期投資が大幅に削減され、中小企業や個人開発者でも手軽に画像認識AIを導入できる環境が整っています。非エンジニアの個人開発者でも、Claude Codeのようなツールを活用し、Pythonライブラリを使って画像認識AIのプロトタイプを構築することが可能です。これにより、外注に頼らず、自らのアイデアを迅速に具現化し、ビジネスへの応用可能性を探ることができます。","source":"Gen-AI.jp","url":"https://gen-ai.jp/column/python-image-recognition/","impact":"medium","tags":["画像認識AI","Python","ノーコードAI","プロトタイプ開発"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"IBMとAtom ComputingがDARPAの量子ベンチマークイニシアチブ最終段階に進出","summary":"2026年10月7日、IBMとAtom Computingが米国防総省国防高等研究計画局（DARPA）が主導する量子ベンチマークイニシアチブ（QBI）の最終段階であるステージCに選定されたと発表しました。このプログラムは、2033年までに実用的なフォールトトレラント量子コンピューターを構築できるかを評価するもので、ステージCでは独立した政府検証チームが各社の量子コンピューターの概念が設計通りに構築・運用できるかを検証します。IBMは2029年までに最初のフォールトトレラントシステムを提供することを目指しており、Atom Computingは中性原子量子技術を用いた大規模量子コンピューターの開発を進めています。量子コンピューティング分野における主要企業の進展は、将来的な計算能力の飛躍的向上を示唆しています。企業は、量子コンピューティングの進化が自社のデータ処理、セキュリティ、AI戦略にどのような影響を与えるかを注視し、長期的な技術ロードマップに組み込む準備を始めるべきです。","source":"IBM","url":"https://newsroom.ibm.com/2026-10-07-IBM-Advances-to-Stage-C-of-DARPA-Quantum-Benchmarking-Initiative","impact":"high","tags":["量子コンピューティング","DARPA","IBM","Atom Computing","フォールトトレラント"]},{"title":"Googleの2026年10月アップデートでPixelのバグ修正とPixel 6のサポート終了が示唆","summary":"Googleは2026年10月のアップデートで、Pixelの重大な脆弱性を修正し、VoIPやキーボードのバグを修正しました。特にPixel 6およびPixel 6 Proのユーザーにとってこのアップデートは重要で、Googleが設定した5年間のサポート期間が2026年10月で終了するため、これが定期的なサポートの最終アップデートとなる可能性が高いと報じられています。Pixel 6/6 Proユーザーは、このアップデートが最後の定期サポートとなる可能性を考慮し、デバイスの買い替えやセキュリティリスクへの対策を検討する必要があります。企業は、従業員が使用するデバイスのサポート期間を把握し、計画的なデバイス更新ポリシーを策定することが重要です。","source":"TechRepublic","url":"https://www.techrepublic.com/article/google-october-update-fixes-pixel-bugs-as-pixel-6-nears-end-of-support/","impact":"medium","tags":["Google Pixel","Androidアップデート","サポート終了","セキュリティ"]},{"title":"ジョージア工科大学とエモリー大学、医学とロボティクスを融合したデュアルディグリープログラムを開始","summary":"2026年10月7日、ジョージア工科大学とエモリー大学医学部が、医学とロボティクスを組み合わせた新しいデュアルディグリープログラムを発表しました。この5年間のプログラムでは、学生はエモリー大学の医学博士号とジョージア工科大学のロボティクス修士号を同時に取得できます。これにより、将来の医師は医療分野の課題を特定し、ロボティクスやAIを活用して解決策を設計するための臨床知識と工学的な背景の両方を身につけることができます。医療分野におけるAIとロボティクスの統合は急速に進んでおり、この種の学際的なプログラムは、ヘルスケア分野のイノベーションを推進する次世代の人材育成に不可欠です。医療技術開発企業や病院は、このような複合的なスキルを持つ人材の採用を積極的に検討すべきです。","source":"Georgia Tech","url":"https://www.me.gatech.edu/news/georgia-tech-emory-partner-medicine-and-robotics-dual-degree-program","impact":"medium","tags":["医療ロボティクス","AI医療","学際教育","ジョージア工科大学"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
