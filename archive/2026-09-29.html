<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年9月29日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

oogle.com/grounding-api-redirect/AUZIYQFYCn6Mcd8p_uEh5iv-CJ-pd9PXIy41qJ-VvHh0BOjxwS-t-mzlwNZHlLKV0fE0Bsc5cH-TIo5p7TZhnn9KGNh7EkdP8_aAAo0n3BdOqnLIBOSv4yb0bq5CV6dlIW08Ztbko_wi_vhKPTjziHP6vQ7SFBmZXQw=","impact":"medium","tags":["オンプレミスAI","ローカルLLM","データプライバシー"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"「Indie Hackersコミュニティの議論：『AIが実行を安くした。それは悪い決定も安くしたか？』」","summary":"2026年9月20日の週のIndie Hackersトップポストでは、「AI made execution cheap. Did it also make bad decisions cheaper?」という問いが議論されました。これは、AIツールの普及により開発コストが劇的に下がる一方で、その手軽さが誤ったビジネス判断や製品設計を加速させる可能性について、個人開発者が直面する新たな課題と示唆を投げかけています。この議論は、AIを活用する個人開発者にとって、効率性だけでなく戦略的な意思決定の重要性を再認識させるものです。","source":"Indie Hackers","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQElodqujWiTfJNCUWCIzbJ4QADEQE9aLkvxRvQ55aY2C5HLnvtHsFt_WBohi_lMtWBDvvdBOb3tmEvHxeoeaQ3cdd2xnMY3ALUmakwW3Xk4fUY24puqKmAt7caGz0GWcbQcmvkB2a70QQaD7s0LUQ==","impact":"medium","tags":["Indie Hackers","AIの倫理","意思決定"]},{"title":"「LaunchNestがAIプロダクトファインダーで『サイレントビルディング』に終止符」","summary":"2026年9月25日、LaunchNestは「Stop Building in Silence — Get Discovered」を掲げ、SaaS、AIツール、スタートアップ、インディー製品の発見を促進するプラットフォームを発表しました。特に注目すべきは、ユーザーが抱える問題を自身の言葉で説明することで、関連する製品を発見できる「AI Product Finder」機能です。これにより、製品名を知らなくてもニーズに合った製品を見つけられるため、個人開発者が自身の製品を潜在顧客に届ける上で非常に実用的なツールとなります。これは、開発者が製品を市場に投入し、認知度を高めるための新たな道を開くものです。","source":"Indie Hackers","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEx3DWs_SPvARa4D7wCKQ4Z50qGBvSF04Jo-wO9VgFAOs7QssKuKSItshCJVUoJZjEzbjwbu47v2VtGbDlwV4rXw2T2pWK9VtVLe0ybz5L89y79WzBcqQW-Bop9yJwEXSFzf0mEmG8Zfrp1osKtX-saFDrIBfJP16HSdkR4OXIV7Kp3ggamY5hs8dBDuN0Mh2VA4b1NlOoTsvs=","impact":"high","tags":["プロダクト発見","AIツール","マーケティング"]},{"title":"「Indie Hackersコミュニティの議論：『AIの回答が間違ったURLを引用した場合、待つべきか、引用元を修正すべきか？』」","summary":"2026年9月28日の週のIndie Hackersトップポストでは、「When an AI answer cites the wrong URL after you edited the right page, do you wait, or fix the cited source first?」という具体的な問題提起がありました。これは、AIが生成する情報がウェブ上のコンテンツに与える影響と、それに対するコンテンツ制作者や個人開発者の実用的な対応策を考える上で重要な視点を提供しています。AIが情報源として普及する中で、情報の正確性をいかに維持・修正していくかという課題が浮き彫りになっており、開発者は自身のコンテンツがAIにどのように参照されるかを考慮する必要があります。","source":"Indie Hackers","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFx5_YkCU3d6X5Lby8vFrJh34PFuW4hhjukvOSdeNCL4YkPgXQALp2gb8anMkrFEI2eJ2fZpO9d-yZZPa0yY2Sb4a6IDYB-ANfqRTnz1deyNWYixSqLYEM3Amr9_w_qjU-e1F70Zl_h_Do6gDHB092R","impact":"medium","tags":["AIと情報源","コンテンツ管理","SEO"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"「Samsungが次世代折りたたみディスプレイ技術『IronFold』を発表」","summary":"Samsung Displayは2026年9月27日、業界向けプライベートイベントで新たな「IronFold」スクリーン技術を披露しました。この新しいOLEDパネルは、現行世代の折りたたみディスプレイに比べて耐久性が50%向上し、折り目がほとんど見えない点が特徴とされています。これにより、折りたたみスマートフォンの最大の課題であった画面の耐久性が大幅に改善され、平均的な消費者が折りたたみデバイスを標準的なスマートフォンと同じくらい主流にする可能性を秘めています。開発者にとっては、より堅牢で普及が進む折りたたみデバイス向けのアプリケーション開発が重要になるでしょう。","source":"verakworld","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEIAEOgHqs6Kr4jrcsUbo_CCDHSVK8Y9HWYqZwrOhCGzQY10EJ68V1-ZPAicpghZwOFxtP_4y9KM7cCBYU_7l2U5qiYiwbYEy9vQG-YwpdPvWkci3My2MV1cT74Wyo3mvC6IB9yCUGWoA4uatD1aZoSRICk7KNudO4I7Iz3ZNR4U001OIleuIoJ3w==","impact":"medium","tags":["折りたたみディスプレイ","Samsung","OLED"]},{"title":"「OrcaRouterが全リクエストログに耐量子暗号を標準搭載」","summary":"FlashLabs株式会社は2026年9月26日、同社が日本市場向けに提供するAI推論ゲートウェイ「OrcaRouter」において、全リクエストログの本文を耐量子暗号で保護する仕組みを標準搭載したと発表しました。この機能はEnterpriseプラン限定ではなく、追加料金やオプトインも不要で全てのユーザーが対象となります。AIのリクエストログには機密情報が含まれる可能性があり、「Harvest now. Decrypt later.」という量子コンピュータ時代の脅威に対する実用的な備えとして、データプライバシーとセキュリティの未来に重要な一歩となります。開発者は、将来的な量子コンピュータの脅威を考慮したセキュリティ対策として、このようなサービスを利用する選択肢が増えることになります。","source":"PR TIMES","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQG6xmBVAChOidR4fbbVK_hYoDfX3IsUzTUL7oyOsE8MhuYOxfPBTnylvcTmzosVaLncC8D5L4eWCd7DN8LoSc7RXI-NYTS_aXWln1x-Ep5uQ0YG1VlIWymBklsgI5CoLRFZ4BEjMFgHMMr6Lqdfsv4COin_QKk=","impact":"medium","tags":["耐量子暗号","セキュリティ","AIゲートウェイ"]},{"title":"「次世代ゲーム機がAIアップスケーリング技術を搭載することがリークで確認」","summary":"2026年9月27日の報道によると、次世代のゲームコンソールに専用のAIアップスケーリングハードウェアが搭載されることが、サプライチェーンからの検証済みレポートで確認されました。この技術は、ゲームを低解像度でレンダリングして電力を節約し、AIを使用してシームレスに4Kにアップスケールすることを可能にします。これにより、コンソールメーカーは、ゲーム機の価格やサイズを大幅に上げることなく、ハイエンドのグラフィックスを提供できるようになり、平均的な消費者にとって大きなメリットとなります。ゲーム開発者にとっては、低解像度でのレンダリングを前提とした最適化や、AIアップスケーリングを最大限に活用するための開発手法が求められるようになるでしょう。","source":"verakworld","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEIAEOgHqs6Kr4jrcsUbo_CCDHSVK8Y9HWYqZwrOhCGzQY10","impact":"high","tags":["ゲーム機","AIアップスケーリング","グラフィックス"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
