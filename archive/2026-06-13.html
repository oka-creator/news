<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年6月14日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

ags":["LLM","Google Gemma","テキスト生成","AIツール"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"「AI時代に月100万円以上稼ぐ海外個人開発者を毎週1人ピックアップして秘密を深堀り！」","summary":"AIを活用して月100万円以上を稼ぐ海外の個人開発者の成功事例が紹介されています。例えば、TikTok自動化ツールで100日で1500万円の収益を上げた25歳の開発者や、AIフラッシュカードアプリで月1500万円を稼いだ事例が挙げられています。これらの事例から、ニッチな市場を見つけ、高速で開発し、効果的なマーケティングを行うことが、AI時代における個人開発の成功の鍵であることが示唆されています。個人開発者にとって、具体的な成功戦略を学ぶ上で貴重な情報源となるでしょう。","source":"みんなのニュースレター","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEEyVCIhaT18ZDe729a1JbpIG9mGB-_VvPAu7VRJFSq0Tcs8t3TWgf73XS9juN-0GwoU7VDucs-SOzlrrsQ1dwX6IIvQUteZ9DFCRer4MJlcH1HcZXhCU-MknfK","impact":"medium","tags":["個人開発","AI活用","収益化","インディーハッカー"]},{"title":"「個人開発は本当にオワコン？2026年でも月10万円以上稼ぐことは可能でしょうか？」","summary":"「個人開発はオワコン」という意見に対し、2026年現在でも月10万円以上稼ぐことは十分に可能であると結論付けられています。ただし、以前のように「作れば売れる」時代ではなくなり、競争激化により難易度は上がっています。成功のためには、技術力だけでなく、「誰のどんな課題を解決するか」「継続的な改善」「集客・マーケティング」「ニッチ市場の理解」が非常に重要とされています。特に小規模SaaS、AI活用ツール、業務効率化ツール、デジタル商品などが個人開発と相性が良い分野として挙げられています。","source":"Qiita","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHs0Rt5t8zHa0RoNhY6jXoTX5_CCGlp80-jkAEwGdHWEzTecrtHfoYaPDQ5GPtP0lLJ-rCORii6qphF2GzyC08ncL4W0xoKgUBz5flk1k65mCGsGmrubRKpm6ManJ0pbp3Zhb1pAbtBjmDCtwQ8aPzhJCIXxqH1KyU=","impact":"medium","tags":["個人開発","収益化","市場戦略","SaaS"]},{"title":"「Indie hacking in 2026 is completely different than it was 3 years ago — AI, Automation, and the Rise of the Solo Empire」","summary":"2026年のインディーハッキングは、3年前とは大きく異なるアプローチが求められていると指摘されています。AIツールの進化によりコーディングがボトルネックではなくなり、競争優位性は「流通」「ポジショニング」「ワークフロー設計」「データ優位性」に移りました。AI機能単体ではなく、AIを活用して実際のワークフローから手作業を排除する「AIワークフロー」が重要であり、ニッチなAIツールが成功しやすい傾向にあります。ソロ開発者でも非常に高速に製品をリリースできるようになり、AIエージェントが従来のSaaSを置き換えつつある状況は、現代のインディーハッカーが成功するための新たな戦略を必要としています。","source":"Rethink Lab, Reddit","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGRlm2ObbUiJJMoR4KF6x78nHyqoiWKvaIqow-6lVemCDuVG2kzQdf6szDKU06z4GL3ZhYp8BYnTlpHyop_GEUoty-73pyKrlqmHy-8yZjMkRdCipO5g3_Yc0NXx7rpGAm2L8pOT5fVeZ6J8uCbaIdtvP47","impact":"high","tags":["インディーハッカー","AIワークフロー","自動化","競争戦略"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"「Canonコラート工場が閉鎖、最後の出荷を終え全生産ライン終了」","summary":"タイ東北部ナコンラチャシマ県にあるCanon Hi-Tech (Thailand) Ltd.のコラート工場が、2026年6月12日に最後の出荷式を行い、工場内の全生産ラインを終了しました。同工場は1990年に設立され、インクジェットプリンターなどを製造し世界各国へ輸出してきましたが、10年以上にわたる稼働に幕を閉じました。これは製造業における生産拠点の再編や、グローバルサプライチェーンの変化を示す事例として、特定の製品分野における市場環境の変化や企業の生産戦略を理解する上で参考になります。","source":"タイランドハイパーリンクス","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGd022zSrXnDnOzmkKkwyVtWSisBPX99oPnsNc6ERYMN_H5_ZnJ2wnAICBU1z58Sq65hy8_ppvZgVaHV93YMlJp2cg5F8UdU6yQa9x53UFdTXGQZy2XMiRXsFK92LeI-__U-HEDJw==","impact":"low","tags":["製造業","サプライチェーン","キヤノン","工場閉鎖"]},{"title":"「スペースXがナスダックに上場し初値は150ドルと公開価格の135ドルを上回った」","summary":"SpaceXがナスダックに上場し、公開価格135ドルを上回る150ドルで初値を付けました。一時176.52ドルまで上昇し、終値は160.95ドルとなりました。これは、推定企業価値1.75兆ドルという史上最大規模のIPOに向けたグローバルな資本移動の一部と見られています。宇宙開発企業のIPOは、テクノロジー分野における新たな投資機会と市場の関心を示すものであり、宇宙ビジネスの商業化の進展や関連技術への投資動向を把握する上で重要なニュースです。","source":"日本証券新聞, YouTube (「朝刊」2026年6月14日（特集）)","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQF1aD-QliP3wzzoMkiTYV1hXk4gOmvlhAD9sCtX-RQxfbIF7ViX-tp0ITdDM-enek71ZPbNjhx0WwBJXY5j933Rv2GZIsSxESqljy-5gDaK01qalgZzxKIZg5-OwSMpzLDXCKit0BOshYwWTY8hXMsmWqDooDY44HqXqCbpb0avNzzXKa915VLExbIZg0CEBbhYW72tWFv1opz0Nnc3mnI4denMoj1l-kNTLJCzccY6m1y8oqKvsy1EUF-tgBeesF8bEjz8WJ2STOEg2koi_7KfqqezgCE2vSEwUTD-b8w7ie2F81Zudby9dT4EKA6qNDFsWD5tO452OfYGYpqeYMrBGGZ0eX1FUbiOmf6impldcabjiPZnS2Q==","impact":"high","tags":["SpaceX","IPO","宇宙ビジネス","株式市場"]},{"title":"「H3ロケット6号機の打ち上げ成功、初の中央エンジンのみ『低コスト型』が実証」","summary":"JAXAは2026年6月12日に種子島宇宙センターからH3ロケット6号機の打ち上げを実施し、衛星の軌道投入と2段目の制御落下に完全成功しました。今回の機体は、補助ブースターを使用せずコストを大幅に抑えた日本初の「低コスト型」です。前回の失敗から約4ヶ月という異例の短期間で克服した形であり、宇宙ビジネスや国産サプライチェーンの信頼性向上に弾みがつくと期待されています。この成功は、日本の宇宙開発技術の進展と、宇宙輸送コスト削減に向けた重要な一歩を示しています。","source":"note (ギークおじ （街・趣味・ビジネス）)","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHofshbgbNcnQNdonNAsGE-8bs-i8JMkm60eiOaj18suLwBXAlbjbjDxuHvJYAXKfO3s0AQtN1O1eypAL9PBeDHbstRPGvYXS9USmudkpgOVnUQqDsyMTTuO9tYGuAsz19YSxqtdy4=","impact":"medium","tags":["H3ロケット","JAXA","宇宙開発","低コスト化"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
