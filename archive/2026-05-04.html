<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年5月5日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

稼ぐ海外個人開発者の事例が紹介","summary":"AI時代において、個人開発で月100万円以上の収益を上げている海外のインディーハッカーの事例が多数紹介されています。例えば、Amazonのエンジニア職を辞め、世界を旅しながら開発した旅行アプリで1年足らずで100万ダウンロード、月1000万円の収益を達成した事例が挙げられています。また、AIエージェントで会社を設立・運用できるプロダクトを開発し、ローンチから3ヶ月で年10億円の収益を上げた事例もあります。これらの事例は、AIを活用したプロダクト開発とグロース戦略の可能性を示唆しており、個人開発者にとって大きなモチベーションと具体的なビジネスモデルのヒントとなるでしょう。","source":"インディーハッカー事例","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFfkMrGS1lUga7VO9ciBjVjLvGL5Jn-UtUmaP6gOzpsW0884WkRgumFButPj1g5cZldlHc4smvmMfS-0TXD76LEPm9kKwaFgJw2icmCXvC0xJEJwbHUeVaB0L3o","impact":"high","tags":["個人開発","AIビジネス","収益化"]},{"title":"Kalturaが開発者向けオープンソースAIエージェントスキルを公開","summary":"Kalturaが、AIコーディングエージェント向けに設計されたAIエージェントスキルのオープンソース版を公開しました。これらのスキルは、Claude Code、OpenAI Codex、Google Gravity、GitHub Copilot、CursorなどのAIコーディングエージェントと連携し、Kalturaプラットフォーム上でのアプリケーション構築を支援します。各スキルは、AI搭載アバター会話から動画アップロード・トランスコーディングまで、Kalturaの特定機能をカバーしています。これにより、個人開発者がAIエージェントを活用して効率的に開発を進める上で実用的なツールとなり、開発プロセスの自動化と効率化に貢献するでしょう。","source":"Kaltura","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHxoskewp8XzOivvGfD1GZFMYEJSamc5rjfpxYIWb6QxpetV5bqwrgOOZzNsx3VOW3l-QCOHK-aI6qDiUksawLJmMJ-Z0Ey734l2bk0pOnlNdKEj1gHD1QQGqw51abcHRNAiTfQTYjb5IgLM_8xJ8geC7RxwHhWxP2tFw==","impact":"medium","tags":["AIエージェント","オープンソース","開発ツール"]},{"title":"個人がAI時代に取るべき3アクション：AIエージェントのスキル習得と「教える側」への準備","summary":"2026年5月3日に発表されたAIニュースでは、個人がAI時代を生き抜くための具体的なアクションとして、「AIエージェントのスキルを今すぐ習得開始する」ことと、「AI利用率54.7%の『教える側』に回る準備をする」ことが挙げられています。スタンフォードAI Indexによると、AIエージェントのPC操作成功率は2年で5倍以上急上昇しており、Claude Code、n8n、Makeといった自動化ツールを使いこなすことで、個人の仕事の自動化や効率化が期待できます。また、国内の生成AI利用率が54.7%に達する一方で、正しく活用できている人はまだ少数であるため、AI入門講座やコンサルティングなど「AIを教えるビジネス」の需要が今後拡大すると予測されています。これは開発者にとって、新たなキャリアパスやビジネスチャンスを示唆する重要な情報です。","source":"AIニュース","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFMRNbuVEpnOGqr6EBpVsQoIzkW6rt-Y1vbnr2nRdVqTI1hjl0E8xDYFNYXZUmRsVQNnFR5Hf27JQzNPIN63SUOwc1Z6gSMDgG4r9iD4rFI9K5osyOBfiqfGrkjzV48duqwTgqgoMpmMQ==","impact":"high","tags":["AIスキル","キャリアパス","自動化"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Amazonが物流サービスASCSを発表、UPS・FedEx株が急落し物流業界に激震","summary":"Amazonが、自社の物流ネットワークをあらゆる業種の企業に開放する「Amazon Supply Chain Services（ASCS）」を発表しました。この発表を受けて、FedEx株は9%超、UPS株も同様に急落し、物流業界の競争地図が塗り替わる可能性が市場で本格的に織り込まれ始めています。ASCSは、工場から消費者の手元まで、物流チェーンのあらゆる工程を一括して引き受けるエンドツーエンドのプラットフォームです。AmazonがAWSでクラウド市場を制した戦略を物流業界にも適用する動きとして注目されており、開発者が物流インフラを活用した新たなサービスを構築する上で、より多様な選択肢と競争の激化をもたらすでしょう。","source":"Amazon","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQELsrczCyWBgWXau5sik_6MFG6_GtxEd_uc7MilrWNEe6DuM_I7_jexzhaCDnDWW-_SUs3FP3accieqedqGJo8hDJVOL91tm_U4SCtP9Bp0EeEvXyj-RdYZG1DcqKmi5ZYhk3YB9UhmE24Im2FYpPVSFMI5fhIBsL5xhLaXFudH","impact":"high","tags":["物流","Amazon","サプライチェーン"]},{"title":"AIの氾濫がGoogleにコンテンツ戦略の見直しを迫る、SEOは「非コモディティコンテンツ」が鍵に","summary":"生成AIの急速な台頭により、ウェブ上のAIクローラーのトラフィックが大幅に増加し、大量生産された同質なコンテンツがウェブに氾濫しています。これに対しGoogleは、インデックス作成能力を無制限に拡大するのではなく、掲載基準を厳格化する方針を打ち出しました。今後のAI検索環境では、絶対的な独自性、深い専門知識、そして真の人間らしさを特徴とする「非コモディティコンテンツ」が成功の鍵となります。表面的な量や自動化された均質なコンテンツに頼るウェブサイトは、Googleのインデックスから姿を消すリスクが高まるため、開発者はSEO戦略において、単なるキーワード最適化だけでなく、質の高い独自コンテンツの創出に注力する必要があるでしょう。","source":"Google","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFBq8Cl7KBh_S6EsQDp8oLJG2WcPmJo6YvzdljMckmO8ZeVutzPoc8Y2yBWIsLmyuFY4bUkpV-PicVxdES01fBYxwlxrE34HmB9J8ovapV4OfGPeADKUscqA6ukwUnvMUaJaXwqE9OFSdZAsNvXh6cJeCT4OpQhmrW86Qg=","impact":"high","tags":["SEO","コンテンツ戦略","生成AI"]},{"title":"2026年のITは「物理」が熱い！次世代インフラとハードウェアの最前線","summary":"2026年のIT業界は、ソフトウェアの進化を支える「物理的な実体」の変革に大きな注目が集まっています。半導体分野ではTSMCが1.6nmプロセス「A16」の試験生産に乗り出し、裏面電力供給技術によってAIチップの電力効率を劇的に改善しようとしています。国内ではRISC-Vアーキテクチャを採用した国産サーバープロセッサが実稼働を開始し、特定のプラットフォームに依存しない強靭なインフラ構築への道筋が示されました。NTTの「IOWN APN 2.0」が全国展開を開始し、400Gbpsという驚異的な帯域と低遅延がデータセンターの地方分散を可能にするなど、通信インフラからデータセンター内部の液冷システム、全固体電池によるUPS、800Gbpsイーサネットといったハードウェアの進化が、IT社会の新たなステージを切り開いています。これらの物理インフラの進化は、開発者がより高性能で効率的なアプリケーションを設計・展開するための基盤を強化し、新たな技術的可能性を広げるでしょう。","source":"TSMC/NTT","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEZ-TwyYni3iHruZxh9jnq1qlYmz2FMVPuLRAcHJeWMewHc86_QcosqvofGENjBR2JX7rb1RpNrySqEVRUjxiTNNytdax9VLpy_gSzEgNylplZ5h2UTLbgSj-s9s9cRxiXDVDxL4L8=","impact":"high","tags":["ハードウェア","インフラ","半導体"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {

    var tags = '';

      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
