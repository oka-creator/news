<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }

    align-items: center;
    justify-content: center;
    gap: 10px;
  }

    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;

  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }

  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

7OKq4BnznJOxMsBRul70g2Q4Ey1qCSz_sB5Rif-uGKJnE4mUueOyRWCuV1ifu_qcXjUBDxhGbb8ZB35kjRGY9MvHDtkAqlmAENojwAHjuE0iKDTqbImYXb4rcw==","impact":"medium","tags":["NTT","tsuzumi","LLM","ビジネス文書"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"2026年のインディーハッカーは「ディストリビューション」が成功の鍵","summary":"2026年におけるインディーハッカーの成功には、「ディストリビューション（流通・顧客獲得）」が最も重要であると指摘されています。生成AIの進化によりプロダクト開発の技術的障壁は低下したものの、市場での注目を集めることが困難になっており、製品を作るだけでなく、ターゲットとなる顧客を特定し、彼らの抱える課題を解決するプロダクトを開発することが不可欠とされています。AIエージェントを活用したリード獲得の自動化など、顧客獲得の自動化が競争優位性をもたらす時代です。これは、個人開発者が技術力だけでなくマーケティング戦略にも注力する必要があることを示唆しています。","source":"The Indie Hacker&#039;s Distribution Paradox (2026 Edition): Why Your Product Is Perfect and Nobody Cares | by Travel4Fun4U | May, 2026 | Medium","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQElDxyZgDzFHXdF-OljPooShWRw1FOnUAxLVZZxzw60QFq5GcZ0Kq-Qa0rnN3Gi3bBjkvMdpqoVO6RYV43GJhi8BDiwCETSEmbQDxAC3zTHj_KPJQuDQaLlcy8qXJTAiO3rswIzAnS3PilJqrgK_n3lsZhuFq0CDU99c51onFQLLOPtnLqiycqNY3EG8XoL4CqjDfFTJ4cSCNLgwWoNFw59ZE9xRnEICSoSB5r2XKmrnDJzm7tDE_PRTqRsqp8IoxBDijnZ","impact":"high","tags":["インディーハッカー","ディストリビューション","顧客獲得","AIエージェント"]},{"title":"ローカルLLMの個人利用が現実的に、ハードウェアとモデル選びが重要に","summary":"2026年春の時点で、Google DeepMindがリリースしたGemma 4などのオープンウェイトモデルの登場により、個人のPCで動作するローカルLLMが翻訳や要約タスクにおいて実用的なレベルに達しています。MoE（Mixture of Experts）構造を採用したモデルは、総パラメータ数に対して少ないVRAMで動作させることが可能になり、ローカルLLMの選択肢が広がっています。個人がローカルLLMを導入する際には、自身のGPUのVRAM容量を考慮したモデル選びと、それに適したハードウェア選定が重要となります。これは、個人開発者がより手軽に高度なAI機能を自身のプロジェクトに組み込めるようになることを意味します。","source":"ローカルLLMは本当に手元で動くのか？ ハードウェアとモデルの現実的な選び方【2026年春】 - IT","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQH1PNoxSH4wE9tAH8NDGxKBWRHl1cfHYxwnea4h0xoaYfBJYbqQrUNsz6HYdX-Z4xYleaP_9STMu3VzhDXrAmnUxDKThky2q6KQTZ71emY0SO3PINhVq0c3jVre2OrnWqcLP0ojAi5x7jRacFDU5480R1Gas0VxnUgL_iU=","impact":"medium","tags":["ローカルLLM","Gemma","個人利用","ハードウェア"]},{"title":"インディーゲームの祭典「BitSummit 2026」が開催、AIインディーゲームに注目","summary":"日本のインディーゲーム最大の祭典である「BitSummit 2026」が、2026年5月22日か   }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
