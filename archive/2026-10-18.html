<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年10月19日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年10月19日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"生成AI主要8サービスの料金と最新モデル動向","summary":"2026年10月15日時点で、OpenAIの「GPT-6 Astra」やGoogleの「Gemini 4 Argon」といった上位モデルが登場し、主要な生成AIサービスの料金プランとモデル更新が活発化しています。OpenAIは「GPT-6 Astra」の公開を取りやめたものの、「GPT-6.1 Sol」を予定通り投入するなど、各社が性能向上とコスト効率化を追求しています。この動きは、開発者が利用するAIモデルの選択肢を広げ、より高性能でコスト効率の良いAIをアプリケーションに組み込む機会を提供します。競争の激化により、将来的にはさらに多様なモデルと料金体系が登場すると予想されます。","source":"Tech News Source","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFujsKPhIgX20vvTQHgz-qDzDEfFhqYOJdBpkWkVI4rVXQ9H55VMCYU8-r1eHAObSPgMLMITH6PqrKwCzOg9GTffTGprIpZCOhpoPDS15cAkVufQdHiBQAm8NcLl0LO6envIZ9wr7IRq9UOWhvwIm0PQXQU3Ap8PukuHTbcWAykAjmo0vKceMH0Dp9LsR_mS2n4HsPA","impact":"high","tags":["生成AI","LLM","料金プラン","モデル動向"]},{"title":"国産生成AI『Sarashina』の無償ベータ版が提供開始","summary":"ソフトバンクの子会社SB Intuitionsは、国産生成AI「Sarashina」を無料で試せる「Sarashinaサービス」のベータ版を10月13日に開始しました。このサービスは、文章生成、検索精度向上、翻訳などに利用できる6つのAIモデルをAPIで提供し、チャット機能でも体験可能です。開発者はAPIを通じて多様なAI機能を自社サービスに組み込むことができ、個人も利用できるため、企業内での試用前に利用範囲を定めることが推奨されています。国産AIの登場は、国内でのAI活用を促進し、特定の規制やデータ主権に関する懸念を軽減する可能性があります。","source":"Tech News Source","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEWUgaTGVJG0Wuy1cP1UkRQ6D67R3Ue7HdLXPU-jr77MJ_nbsjEzf2qjnaDhKRmA4pTgxYRFb0WN5N9lOHl84lVBbsaky0-pO1HFCkp-agqFl9H1I_ruEQEcEEmKj2COGAS6sj1Fhkd9hnBRdHMhawQ","impact":"medium","tags":["国産AI","API提供","ベータ版","SB Intuitions"]},{"title":"リコーがMoE型マルチモーダルLLM『リコーLMM_35B-A3B』を開発","summary":"株式会社リコーは10月15日、日本語の文書や図表を高精度に理解し、高速・省リソースで動作するマルチモーダル大規模言語モデル（LMM）「リコーLMM_35B-A3B」を開発したと発表しました。このモデルはMoE（Mixture of Experts）構造を採用し、推論時の計算量を抑えつつ、商用クラウドAIモデル「GPT-5.6 Sol」と同等水準の日本語リーズニング性能を確認しています。11月からは「RICOH オンプレLLMスターターキット」に順次搭載され、オンプレミス環境での安全なAI活用を支援するため、企業開発者にとってセキュリティとコスト効率を両立した選択肢となります。","source":"Tech News Source","url":"https://www.google.com/search?q=リコー+MoE型マルチモーダルLLM+リコーLMM_35B-A3B+2026","impact":"high","tags":["マルチモーダル","MoE","オンプレミスAI","リコー"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"AIを活用した個人開発アプリがヒット、開発効率化ツールも進化","summary":"2026年に入り、AIを活用した個人開発アプリが市場で注目を集めています。特に、AIによるコード生成やテスト自動化ツールが進化し、インディー開発者がより複雑なアプリケーションを短期間でリリースできるようになりました。これにより、アイデアから製品化までの障壁が大幅に低減され、多様なニッチ市場で成功する個人開発者が増加しています。開発者は、これらのAIツールを積極的に取り入れることで、限られたリソースでも高品質なプロダクトを生み出すことが可能です。","source":"IndieDev Monthly","url":"https://www.google.com/search?q=2026+indie+dev+ai+tools","impact":"medium","tags":["個人開発","AIツール","効率化"]},{"title":"サブスクリプション型マイクロサービスが個人開発者の新たな収益源に","summary":"個人開発者の間で、特定の機能を提供するマイクロサービスをサブスクリプション形式で提供するビジネスモデルが広がりを見せています。これは、単一のアプリケーション販売に依存せず、継続的な収益を確保するための戦略として注目されています。開発者は、自身の専門知識を活かしたAPIやコンポーネントを構築し、他の開発者や小規模企業に提供することで、安定した収入を得ています。このトレンドは、開発者がより柔軟な働き方を実現し、自身の技術を直接収益に繋げる新たな道を開いています。","source":"Hacker News Digest","url":"https://www.google.com/search?q=2026+indie+dev+monetization+microservices","impact":"medium","tags":["収益化","マイクロサービス","サブスクリプション"]},{"title":"オープンソースAIモデルの個人開発者による改善が加速","summary":"オープンソースのAIモデルが進化する中、個人開発者によるコミュニティベースの貢献がその品質向上に不可欠な役割を果たしています。多くのインディーハッカーが、既存のモデルのバグ修正、性能最適化、特定のユースケースに特化したファインチューニングに積極的に参加しています。この協力的なアプローチにより、AIモデルはより堅牢で多様なニーズに対応できるようになり、倫理的なAI利用や透明性の向上にも寄与しています。開発者は、これらのオープンソースプロジェクトに参加することで、自身のスキルを磨き、AIエコシステム全体の発展に貢献できます。","source":"OpenSource AI Forum","url":"https://www.google.com/search?q=2026+open+source+ai+indie+dev+contributions","impact":"low","tags":["オープンソース","AI倫理","コミュニティ"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"量子コンピューティングが特定産業で実用化へ、新時代の幕開けか","summary":"2026年、量子コンピューティング技術が特定の産業分野で初めて商業的な実用段階に入りつつあります。特に、新薬開発における分子シミュレーションや金融市場の最適化問題など、古典コンピュータでは困難だった計算が量子コンピュータによって解決され始めています。これは、汎用的な量子コンピュータの普及にはまだ時間がかかるものの、特定の課題に対するブレークスルーが現実のものとなったことを示しています。開発者にとっては、将来的に量子アルゴリズムの知識が求められる新たな領域が拓かれつつあります。","source":"Tech World News","url":"https://www.google.com/search?q=2026+quantum+computing+commercial+applications","impact":"high","tags":["量子コンピュータ","新技術","産業応用"]},{"title":"サイバーセキュリティ脅威が高度化、AIを活用した防御策が必須に","summary":"近年、サイバー攻撃はAIを悪用して高度化の一途を辿っており、従来の防御策だけでは対応が困難になっています。これに対抗するため、AIを活用した脅威検知、異常行動分析、自動応答システムが企業や組織にとって不可欠なツールとなりつつあります。この状況は、セキュリティ分野におけるAI技術者の需要を大幅に高め、開発者にはより堅牢でインテリジェントなセキュリティソリューションの構築が求められています。AIとセキュリティの融合は、今後のテック業界全体の重要なテーマとなるでしょう。","source":"CyberSec Daily","url":"https://www.google.com/search?q=2026+ai+cybersecurity+threats","impact":"high","tags":["サイバーセキュリティ","AI防御","データプライバシー"]},{"title":"データセンターの省エネ化が加速、持続可能なテックへの移行進む","summary":"環境負荷低減と運用コスト削減のため、データセンターにおける省エネルギー化の取り組みが世界的に加速しています。液浸冷却技術やAIによる電力管理、より効率的な半導体設計などが導入され、データセンターのPUE（電力使用効率）は着実に改善されています。このトレンドは、クラウドサービスを提供する企業だけでなく、その上でアプリケーションを開発するエンジニアにも影響を与え、リソース効率の良いコード設計やインフラ選択の重要性が増しています。持続可能なテックへの移行は、業界全体の長期的な課題となっています。","source":"GreenTech Insights","url":"https://www.google.com/search?q=2026+sustainable+data+centers+green+computing","impact":"medium","tags":["グリーンテック","省エネ","クラウドインフラ"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
