<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年7月25日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年7月25日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"RunwayがAIモデル自動選択機能「Runway Media Router」を発表","summary":"生成AI企業のRunwayは、画像・動画・音声生成に最適なAIモデルを自動選択する「Runway Media Router」を発表しました。この新機能は、品質、処理速度、料金の優先順位に応じてAIモデルを切り替えるため、コンテンツ制作の効率化と開発者の負担軽減に貢献します。例えば、アイデア確認時には速度を、最終成果物では品質を重視するといった使い分けが容易になります。これにより、AIを活用したメディア制作のワークフローが大幅に改善されるでしょう。","source":"Runway","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEjxFeZC2TOHmz8t4DUOidhaSMCC8ZYPz0da7p-_3gtGYq_9p0_EYkuCPhO4cy_hJKPi-rEL1YdHMZrNMpnJucyePqFd8RS8JBTEdCJYGCBdMGMM1LDTMb8rH_kTQEgiFW5MRmqWqUpD1_ies58Xbv0Hs=","impact":"high","tags":["生成AI","メディア生成","開発者ツール","効率化"]},{"title":"Anthropicが次世代AIモデル「Claude Opus 5」発表か、OpenAI「GPT-5.6」との競争激化","summary":"米アンソロピックは、次世代の最上位AIモデル「Claude Opus 5」を間もなく発表すると観測されています。このモデルは性能向上に加え、企業がAIエージェントを継続運用する際のコスト効率も重視される見込みです。一方、OpenAIは既に「GPT-5.6 Sol、Terra、Luna」ファミリーを提供しており、性能とコスト効率の両立を図っています。これにより、AIモデル市場における主要プレイヤー間の競争が一段と激化し、企業はより多様な選択肢を得られるでしょう。","source":"Yahoo!ニュース / Qiita","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEcetgJo9yg4725npG8WYCGn8pDzC0b-7ygH31fjMLeTy_qEHiLx_zLtbfQkGLdBO886_A4hHqj1G2DPvYnr_yzjAZG0bGQEIz1vDtDqvhrl88rYZDW_zS1dLBmnnFbMhycoUX5","impact":"high","tags":["LLM","AI競争","Anthropic","OpenAI","企業AI"]},{"title":"PwCレポート：AIエージェントが「個人の生産性」と「組織の形」を変革","summary":"PwCのレポート「生成AIの将来技術動向 2026年」は、生成AIが単なる業務支援ツールから「実行主体」へと進化していると指摘しています。AIエージェントの自律性が個人の生産性を飛躍的に向上させ、従来の組織構造や雇用、業務のあり方を根本的に変えるとしています。複数のエージェントが24時間タスクを遂行する段階に入り、「One Person, One Billion Company」といった新たな企業形態が現実味を帯びてきました。これは、個人や組織がAIをどのように活用し、適応していくかという大きな課題を提示しています。","source":"PwC","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHPJBWf6dWBJAAM08X0rjOYrLFfvUFrVflUaifQc6d14ll1yvclfh9Xqe7UMY287XEGnY-JnwosSDNzfElvkJtdVlLNcbRYPXwYqsPxIhzgxZ-B9FlNy-ylReBBY15wfj_Rf3e4CmIKOZlOWJlsbkPlfN0xMHxwFhavKiITlrTOu3cyidhTNvqxIbIAppYh0cLbG6vynU78mA8rY8=","impact":"high","tags":["AIエージェント","生産性向上","組織変革","未来予測"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"AI時代のインディーハッカー：バイブコーディングが主流に","summary":"2026年、インディーハッカーの間で「バイブコーディング（Vibe Coding）」という開発スタイルが主流となっています。これは、AIに自然言語で指示を出し、コードの詳細を自分で書かずにプロダクトを開発する手法です。元Tesla AI責任者のAndrej Karpathy氏が提唱して以来、この手法が個人開発者の間で急速に広まりました。これにより、技術的な参入障壁が大幅に低下し、より多くの人々がアイデアを形にできるようになっています。","source":"Andrej Karpathy氏提唱","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGrW-I_SYXs6GK-ZhAalg9a7nF0zXw4AhbDeBn6eywEBi6cLJlgRoF_XJ5piFDTGQySUCgYS8s8CXRnuiwALLlZERpWIv5k7f-vb9Bko4KwIokb2KE8f-DXG73QJlHETKmZ2kEQqw==","impact":"high","tags":["インディーハッカー","バイブコーディング","AI開発","ノーコード"]},{"title":"2026年版インディーハッカー成功戦略：AIとコミュニティが鍵","summary":"2026年のインディーハッカーの成功には、技術力だけでなく、AIの活用、ノーコード・ローコード開発による高速なプロダクトリリース、そしてユーザーコミュニティとの協調が不可欠です。市場ニーズの深掘りには、Google Trends、Reddit/X（旧Twitter）、AIアシスタントなどのツールを組み合わせ、データに基づいた洞察を得ることが重要とされています。この戦略は、個人開発者が競争の激しい市場で持続的に成長するための指針となります。","source":"note (junichi_note)","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGrLPyhvsQjfSchu0qwoOp-FzbqTCnB1MrBqQ9ObhiNwf95kGshCgdzt1vUpyRSZ4Go2s3_NxrdG_NbkcPDWWBzwjgUit0rYuhBOT46zNzP8t1Zln8_cPr8T0EBObGgdgczyZoS","impact":"medium","tags":["インディーハッカー","成功戦略","AI活用","コミュニティ"]},{"title":"AI時代の個人開発者は「次のYouTuber」になるか？成功事例から見る現状","summary":"2026年7月23日の記事によると、AIを駆使してアプリやWebサービスを一人、または極少数のチームで開発・運営する「AI時代の個人開発者」が台頭しています。19歳の青年が寝室で作ったカロリー計算アプリが年商75億円規模に成長し買収された事例や、創業6ヶ月で約120億円で買収された事例など、莫大な収益を上げるケースが増加しています。ただし、YouTuber的エコシステムとの構造的な類似点と決定的な違いも指摘されており、今後の動向が注目されます。これは、個人がテクノロジーで大きな成功を収める新たな可能性を示唆しています。","source":"note (kajiya_kento)","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFpURKfz4D-zeMRtw0GR3ShXhgLjJL1DavWtWtXI9vs1yOkcb6cITM0VaUQI6tMQ2bbhZcYTfwg99yD0AKUUCiAq5wu7wH0pYBGul78ZKVOXRLQzuzQV1nw6-CaRRJROZ4qnrMZkcvT","impact":"high","tags":["個人開発","AIアプリ","スタートアップ","成功事例"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"IBMがPower Systemsの新製品とAIエージェント統合を発表","summary":"IBMは2026年7月24日、IBM Powerシステムを継続的に監視し、問題を自律的に解決するAIエージェント「IBM Power Autonomous Operations」を発表しました。また、「IBM Bob™ Premium Package for i」はIBM i向けアプリケーション開発を加速するエージェント型ソフトウェアを提供します。これらの機能により、企業はモダン・アプリケーションの構築を加速し、事業のイノベーションを推進できるよう支援されます。2027年までに企業が平均1,661のAIエージェントを導入すると予想されており、自律型ITの重要性が増しています。","source":"IBM Newsroom","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQH3xqlfGggQEZtxQzvZ5aYQeQkilYa6cRDs3Zm6HZ7uiZon32T9JyiMjPcjPHX1N_XuIQgQVsZ3046XXGHpOUVNvxdvMkLAA7UZpyKufB0YFLo57J2MjVyqFaSPVbLnbXbsn9HCDanqPOYjijnxVfbV7aHq7ulbmjdEh99QR9qcmlHOwaNrF1z9eLXG6yi4Zx_mYHofElcaFlYBA-vbjASfHEMps_TtCWXIBEBnWojk3TXwTnauqJcgV9D8UO9N2hfDyg7FHptRstcDPOVav305Zmga","impact":"high","tags":["IBM","AIエージェント","自律型IT","エンタープライズ"]},{"title":"海外スタートアップの資金調達動向：ロボティクス、半導体、AIセキュリティに注目","summary":"2026年7月23日、米国のスタートアップ資金調達シーンで複数の大型ラウンドが報じられました。Uber創業者トラビス・カラニック氏が率いるロボティクス企業Atomsが17億ドルを調達したほか、推論特化型半導体企業Etched、AIメール詐欺対策のAegisAI、デザインツールのPaperも資金を調達しています。これらの動きは、AI関連のハードウェア、セキュリティ、そして生産性向上ツールといった多様なレイヤーで投資が活発化していることを示しています。これは、テクノロジー分野における次の成長領域を明確に示唆しています。","source":"Second Wave","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGFK0vLO9J7eF_2B8dggvisSKP1l_3GKlcZvXOF81ixTrcQPx92JkiEBMzI-TupJiPHiJtXgeQnbmtkSiDaW8YN3v45owlQGZi_LyZhj34WV_2vxFDYWWPPBHzHtGo1ecEJEtLw5dCB0IFISg==","impact":"high","tags":["スタートアップ","資金調達","ロボティクス","AIセキュリティ","半導体"]},{"title":"Black Forest Labsが「FLUX 3」を発表、動画生成AIがロボット行動予測へ拡張","summary":"Black Forest Labsは2026年7月23日、マルチモーダル基盤モデル「FLUX 3」をアーリーアクセスで公開しました。このモデルは画像・動画・音声を統一アーキテクチャで同時に学習し、音声付き最長20秒の動画を作成できます。さらに注目すべきは、動画生成モデルがロボットの行動予測にも応用可能であるという同社の主張です。Audiの生産ラインでロボットの生産タスク検証にも利用されており、生成AIとロボティクスの融合による新たな可能性を示しています。これは、AIが物理世界に与える影響の拡大を意味します。","source":"tanaru.ai","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFywXpCSkJPVc3nhTVM-HHJiqW9nICuqDdtXDiGrfRUBtwk_wok69_N4_UFeB-3RTytjUZv2WgA8wq_9vSgPUx6DkFNjZIfk8FcFxEyrV3nU0ZukM2aqGN3hyf8VUlE3vxrqwBg","impact":"high","tags":["マルチモーダルAI","動画生成","ロボティクス","FLUX 3"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
