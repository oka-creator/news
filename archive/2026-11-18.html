<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年11月18日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

texaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGNOJ4h_bI-oAeNE_h0JvImG8aVImJrl4Qtyf7s96Qr4j_yztd62fv7kyTgCATMgG12vkuSS-ul-EQ8jc0667_epqkrqyd8vxOm9stxJbzmM0jJ4NQE168TJv5xG8DdLhxmd_XftVIi6g==","impact":"medium","tags":["SaaS","個人開発","起業","CRM"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"大手テック企業でレイオフが継続、AIによる市場変化が背景に","summary":"2026年11月に入っても、Amazon、Angi、Block、Canva、Squarespaceといった大手テック企業でレイオフが続いています。特にSquarespaceのレイオフは、ウェブサイト開発市場がAIによって大きく変革される可能性が指摘されており、テクノロジー業界全体の構造変化を示唆しています。これは、AI技術の進化が既存のビジネスモデルや職務に与える影響が顕在化していることを示しており、開発者にとっては、自身のスキルセットを常に更新し、AIと共存・活用する能力がより一層求められる時代が来ていることを意味します。","source":"Fast Company","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFUReoquJOYAOuveQwDzD4ohbWg7WuUE59VIzXxeo-SAnlZRg7yBXZzqWZ3mHjUD71lADQJPE6_Sv-IzeIv1Q--D0bNUuL27nq69uYH8qtmg7trVJl8pMR42dA_YRB6bUw_eD7T5u8Pxef3JbGvmvaOmQxxwWwI8-c_yoIc2A2MofQ-IGz9vw1kqdXcbTnKAjhSn90g4h-aaw==","impact":"high","tags":["レイオフ","テック業界","AIの影響","キャリア"]},{"title":"Google Cloud、日本のサイバーセキュリティ強化とAI導入加速に向けた新施策を発表","summary":"Google Cloudは2026年11月17日、日本のサイバーセキュリティ強化とAI導入加速のための新たな取り組みを発表しました。これには、行政機関や重要インフラ事業者に対し、サイバーセキュリティ能力を強化した最新のフロンティアAIモデル「Gemini 4 Carbon for Cyber」や、脆弱性検知・コード修復を支援する「CodeMender」への早期アクセス提供が含まれます。また、重要な政府機関などを対象とした無償の脆弱性診断プログラム「Scan for Good」も提供開始され、日本のデジタル社会の安全確保に貢献します。開発者にとっては、これらのツールがセキュリティ対策の効率化やAIを活用した開発支援に役立つでしょう。","source":"Google Cloud","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFieADzaQhvQRH2Pg4SqfZKSzIIjv4cnjRs_O_N0Lf69a_RhXaHKqAhOEgTUgREV5PQeJs8ixjoDSEGF3xeTsPi3tl7CTbVP89AqJNS_hZcJfsU8wLtoMZHvSPGbwowvp6IM1ifwmOtCNHGt9ohWpZnoirQjmiU8sCNROADi3IGiHY8hBm8bQT5y_Qtxru1SHiFc5NhRidL1sO7aZibDkbOKRT0pXqGO0sJBaWe","impact":"medium","tags":["サイバーセキュリティ","Google Cloud","AI導入","日本市場"]},{"title":"NTT、ロボットが失敗を予測・回避する「フィジカルAI」技術を開発","summary":"NTTは2026年11月11日、ロボットが行動する前に荷崩れや落下などの失敗を予測・評価し、成功につながる行動を選択できる「フィジカルAI」技術を開発したと発表しました。この技術は、物体の物理量を明示的に扱い、運動方程式に基づいて状態変化を予測するワールドモデルと、独自開発の「物理制御アダプタ」を映像生成モデルに統合することで実現されて       '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
