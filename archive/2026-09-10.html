<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年9月11日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年9月11日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"OpenAI、次世代フラッグシップモデル「GPT-6 Astra」を段階的にロールアウト開始","summary":"OpenAIが2026年9月9日に次世代の最上位AIモデル「GPT-6 Astra」の段階的なロールアウトを開始しました。このモデルはChatGPT Work、Codex、APIで順次利用可能となり、Microsoft Copilotへの統合も発表され、OpenAIとMicrosoftの連携が強化されています。GPT-6 AstraはOpenAIが「最も知的かつアライメントされたモデル」と表現し、コンテキストウィンドウは4Mトークンに拡大され、数十万行規模のコードベースや長編ドキュメント群を一括投入できる規模となりました。これにより、開発者はより複雑で大規模なAIアプリケーションを構築できるようになり、特に企業向けソリューション開発の可能性が大きく広がります。","source":"OpenAI公式発表","url":"https://openai.com/index/gpt-6-astra-next-generation-work/","impact":"high","tags":["GPT-6 Astra","OpenAI","LLM","AI開発"]},{"title":"AI企業Inception、拡散モデルで高速文章生成する「Mercury 2.5」を発表","summary":"AI企業Inceptionが2026年9月8日、拡散モデルを用いて文章を高速生成するAIモデル「Mercury 2.5」を発表しました。このモデルは、複数のトークンを並行して生成・修正する仕組みにより、毎秒1107トークンという驚異的な速度で出力可能です。性能はGPT-5.6 LunaのLow設定などに匹敵し、100万出力トークン当たり約120円という低料金で提供されます。開発者にとっては、AI電話エージェントやコーディングAIなど、リアルタイム性が求められるアプリケーションでの応答時間短縮とコスト削減に大きく貢献するでしょう。","source":"GIGAZINE","url":"https://www.gigazine.net/news/20260909-inception-mercury-2-5/","impact":"medium","tags":["拡散モデル","高速生成","AIエージェント","コスト効率"]},{"title":"シャープ、LLMモデルルーティング技術で「AIの使い分け」を最適化","summary":"シャープは、クラウドとエッジを組み合わせた独自のAI活用技術「CE-LLM」をベースに、生成AIの応答品質、速度、運用コストのバランスを最適化する「LLMモデルルーティング」技術を発表しました。この技術は、用途や状況に応じて最適なLLMを使い分けることで、高性能モデルの運用コスト増大や応答速度の遅延といった課題を解決します。特に日本語環境での検証・評価が進められており、開発者は多様なLLMを効率的に組み合わせ、ユーザー体験とコストパフォーマンスを両立させたAI製品・ソリューションを構築できるようになります。","source":"シャープ公式ブログ","url":"https://blog.sharp.co.jp/2026/09/04/ai-llm-model-routing/","impact":"medium","tags":["LLMルーティング","CE-LLM","AI最適化","エッジAI"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"AIポッドキャスト運営者がOpenAI API活用で月間収益14,500ドル達成","summary":"インド出身の元ParamountプロダクトリーダーであるAdithyan Ilangovan氏が、研究工学のバックグラウンドを活かし、ChatGPTをはじめとするOpenAI APIを活用してポッドキャストの投稿後作業をほぼ自動化する「AI Podcasting」サービスを運営し、月間MRR（月間経常収益）14,500ドルを達成したと報じられました。これは、AIツールを効果的に組み合わせることで、個人開発でも大きな収益を上げられることを示す具体的な成功事例です。開発者にとっては、AIを活用した自動化がニッチな市場でいかにビジネスチャンスを生み出すか、そして効率的な運用が収益化に直結することを示唆しています。","source":"note (neko_news)","url":"https://note.com/neko_news/n/n4d8b6e6e2b9c","impact":"high","tags":["AI活用","個人開発","収益化","ポッドキャスト"]},{"title":"インディーハッカーMarc Lou氏、「身体広告オークション」で総額10万ドル超を調達","summary":"X（旧Twitter）で約39万人のフォロワーを持つインディーハッカーのMarc Lou氏が、自身のフィットネスレース「HYROX」出走に合わせて「身体広告オークション」を実施し、総額10万3,000ドル超の資金を調達したと報じられました。OrcaRouterを開発するContinuum AIもこのオークションに参加し、「左ふくらはぎ」枠を4,000ドルで獲得しました。このユニークな資金調達方法は、個人開発者が自身のブランドやコミュニティを活用して、創造的な方法で収益を得る新たなビジネスモデルを示しており、開発者にとってマーケティングと資金調達の新しい可能性を提示しています。","source":"PR TIMES","url":"https://prtimes.jp/main/html/rd/p/000000007.000109043.html","impact":"medium","tags":["資金調達","インディーハッカー","コミュニティ","ブランド活用"]},{"title":"文化祭向けPOSレジ「FesRegi」が全国36校に拡大、現場発のシステムが成功","summary":"高校時代の文化祭での不便をきっかけに開発された個人開発のPOSレジ「FesRegi」が、全国36校・57模擬店で利用され、累計注文処理数2万2314件を突破しました。この成功は、「作った本人しか使えない」という個人開発の課題を乗り越え、現場のニーズに深く根ざしたシステムがいかに広範囲に採用されるかを示す好事例です。利用範囲を広げる上では、シンプルな使いやすさと、開発者自身の課題解決から始まったという共感が重要な要素となりました。開発者にとっては、自身の課題解決から始まったプロダクトが、持続的な成長と社会貢献に繋がる可能性を示しています。","source":"Keyman&#039;s Net","url":"https://www.keymansnet.jp/article/2609080700","impact":"low","tags":["ニッチ市場","POSレジ","課題解決","コミュニティ"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"サウジアラビアでテックイベント「LEAP 2026」開催、AI・先端技術分野に150億ドル超の投資発表","summary":"サウジアラビアのリヤド近郊で8月31日から9月3日にかけて、テックイベント「LEAP 2026」が開催され、20万人超が来場しました。このイベントでは、AI、クラウドコンピューティング、サイバーセキュリティ、スマートシティなどをテーマに議論が交わされ、AIおよび先端技術分野で総額150億ドル超の投資、事業立ち上げ、提携が発表されました。特に、アマゾン・ウェブ・サービス（AWS）がサウジアラビア初のクラウドサービス提供拠点の開設を発表し、同国がAI時代を主導することを目指す姿勢が示されています。これにより、中東地域でのテック市場の拡大と開発機会の増加が期待されます。","source":"JETRO","url":"https://www.jetro.go.jp/biznews/2026/09/a64f331940984955.html","impact":"high","tags":["サウジアラビア","テック投資","AI","クラウドコンピューティング"]},{"title":"国内半導体関連メーカーの2025年度売上高が過去最高を記録、生成AI需要が牽引","summary":"東京商工リサーチ（TSR）の調査によると、国内半導体関連メーカー154社の2025年度売上高は合計で7兆9115億円となり、前年度比17.1％増を記録し、過去5年間で最高となりました。生成AIの普及やデータセンター向け需要の拡大が、この好調な業績を牽引しています。売上高トップはキオクシアで、データセンター向け高機能SSDなどの出荷が好調でした。しかし、原材料費やエネルギーコストの高騰により、企業の約4割が減益となるなど、利益面では二極化が見られ、開発者にとっては半導体供給の安定性やコスト変動が今後のプロジェクトに影響を与える可能性があります。","source":"EE Times Japan","url":"https://eetimes.itmedia.co.jp/hc/articles/2609/10/news093.html","impact":"medium","tags":["半導体","生成AI","データセンター","国内市場"]},{"title":"カリフォルニア州、16歳未満へのSNS中毒性機能提供を禁じる法案に署名","summary":"カリフォルニア州のギャビン・ニューサム知事が2026年9月10日、16歳未満への中毒性機能提供を禁じるオンライン安全法案に署名しました。この法案は、個別表示フィードや自動再生といった、子どもの利用を長引かせる機能を制限することを目的としています。今後、SNS各社は年齢確認や画面の変更に対応する必要があり、米国の州規制が主要サービスの設計に踏み込む重要な事例となります。開発者にとっては、SNSプラットフォームや関連サービスを設計する際に、年齢制限やユーザーの健全性を考慮した機能開発がより一層求められるようになります。","source":"The Headline","url":"https://www.theheadline.jp/articles/2026-09-11-001/","impact":"high","tags":["SNS規制","オンライン安全","カリフォルニア州","プロダクトデザイン"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
