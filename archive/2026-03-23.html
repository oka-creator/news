<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月24日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

</div>

WA3ZHi6rk_VUNb1g5mjWMHFFnN41f7RZywSGlybtU=","impact":"high","tags":["Stable Diffusion","画像生成AI","オープンソース","Stability AI"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコードツールを活用した個人開発アプリが急増、収益化事例も多数","summary":"ノーコード・ローコード開発は、シンプルなツール作成の近道から、創業者や成長企業にとって正当な製品戦略へと進化しています。BubbleやWebflow、Glide、Softrといったツールにより、非技術系創業者でも洗練されたアプリを構築し、従来のスタートアップよりも迅速にローンチや改善ができるようになりました。開発コストを大幅に削減し、数週間でMVPを構築できるため、個人開発者が収益化に成功する事例も増えています。これは、プログラミングスキルに依存しない新たな開発パラダイムを確立し、多くの開発者にビジネスチャンスを提供しています。","source":"業界分析","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGsmOnxstxrz_VhDckPMeSGOmVNu9mMMxmGRzGagvXHLZclnCCzk039qtqviRJ7JuA1dpttgzJnN38sNI1YcH6d5_PSne5gODwOHS2YyTsYhOeEd85NyEczEr7i36jL6xIf1eYEg_QU7zxWnjcneAk=","impact":"high","tags":["ノーコード","ローコード","個人開発","収益化"]},{"title":"AIを活用した個人開発ツールがトレンドに、開発効率とアイデア具現化を加速","summary":"AIツールは、コーディングを高速化するだけでなく、製品の構築、検証、成長の方法そのものを変革しています。GitHub CopilotやCodeiumのようなAIコーディングツールは開発時間を3〜5倍に短縮し、MVPの生成、API、UIコンポーネント、データベーススキーマ、統合などをAIが自動生成できるようになりました。これにより、個人開発者はコーディングそのものよりも、流通、ポジショニング、ワークフロー設計、データ優位性に焦点を当てることが可能になっています。AIは個人開発の障壁を下げ、アイデアの具現化を加速させる強力な味方となっています。","source":"テックトレンド","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEk0xdItmv-l1kQgPXWg2JOje6oC92DnDLEfcF0JR4rzt4nuqI4ZZrN0PImBXNAwVqUOwGf-mzH_swr_3VM0XyQ01IcW4DS9-GauD3c3Nw9DCMQEN0Fsnf23OnrccZFpm2qj3w2Mg==","impact":"high","tags":["AI開発","開発効率","GitHub Copilot","インディーハッカー"]},{"title":"ニッチなニーズを捉えるサブスクリプション型AIエージェントサービスが台頭","summary":"従来のSaaS製品のダッシュボードではなく、特定のタスクを自動実行するAIエージェントが個人開発者の間で注目されています。マーケティングキャンペーンを実行するエージェント、市場を要約するリサーチエージェント、リード生成エージェント、顧客サポートエージェントなど、ニッチなニーズに対応した自動化サービスがサブスクリプションモデルで提供され、成功事例を生み出しています。ユーザーは、テキスト生成ではなく、実際のワークフローにおける手動ステップを排除するAIの力を求めており、個人開発者はこのトレンドに乗ることで安定した収益源を確保できるでしょう。","source":"市場分析","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEZo6SPfkih6ElABuy0G34aYWA0ymm6GbXYg5_n_WOYww1KxJ3Zyvf912HLTK04HM6y8sFZGQsPanGBsc3lHyPKnGpt1RHUaQ8RfTGGsFgGWUhaW6Z5r01C3-t-Q-rvOnxw_MldfZGdwZ0vz9joQON_IPUTeSjCSmGB880RcsPGOhrFT9S4hXyUDz8UsqBmtpvpDwgGhAEfpgdv2mP3Q8dH","impact":"medium","tags":["AIエージェント","サブスクリプション","ニッチSaaS","自動化"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Apple、WWDC 2026の日程を発表、次期iOSとmacOSのAI機能強化に注目集まる","summary":"Appleは、年次開発者会議「WWDC 2026」が2026年6月8日から12日まで開催されることを発表しました。今回のWWDCでは、次期iOS 27やmacOS 27などのOSアップデートに加え、「AIの進化」に焦点が当てられることが示唆されており、Siriの機能向上やApple Intelligenceの強化など、AI関連の重要な発表が期待されています。これは、AppleがAI競争において本格的に攻勢をかける姿勢を示しており、開発者にとってはAppleエコシステムにおける新たなAI機能の活用機会が大きく広がることを意味します。","source":"Apple公式","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHMyK07AcruZvil0GP4SdguOv7NyvyinBE-PFfE6z3grKyxQ_p6Jtzkpxv0Q0Tikg3jESmjPrrtn29qKh48cSSCibnK5Suo3Y2F23ASvmSqwQfCtJ11V8cuoqXIkZhX79CqQgLf6DivUuPFCIWjIYC6BG_Zl0rQutIQhbzDsWKOq2Opquob3wCn0UAkUrXGWcrBzRxiOhtRDvZWy60z-DXkA7Rrxxj]=","impact":"high","tags":["Apple","WWDC","iOS","AI機能"]},{"title":"半導体産業、AI需要に牽引され記録的な成長予測、製造装置メーカーも活況","summary":"AIチップの需要が世界的に急増していることを背景に、半導体産業は2026年に1兆ドルを突破し、記録的な成長を遂げると予測されています。特に、AIアクセラレータやデータセンター向けGPUへの大規模な投資が主要な牽引役となっており、NVIDIAやAMDといったAIチップ設計企業だけでなく、TSMCやSamsungなどの製造企業、ASMLなどの製造装置メーカーも活況を呈しています。この成長は、AI技術の進化を支える基盤となり、関連するハードウェア開発者やインフラ提供者にとって大きなビジネスチャンスをもたらすでしょう。","source":"業界レポート","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQG8VTc2h0jsrKZrmyNc5vKZtI9c6nO7RnZ0JN0eGboHipo95KYS_iz_AUQhpnIu8G8OvT0YcvvrUdHnOKNnZupBLzsZsgf4Ym36_vUP49wZ_CsBsz8jq02xlkdSQNUCkF5VPbFoa9-qEGUlyJjHyixIIvPubsffPxaHFRRa4NA95x-hm-soac1gi8eZtO6paERjJWlxnuIFKSf93w==","impact":"high","tags":["半導体","AIチップ","産業成長","NVIDIA"]},{"title":"サイバーセキュリティ脅威が高度化、AIを活用した防御策と人材育成が急務に","summary":"AIの進化に伴い、サイバー攻撃の手口が高度化しており、企業や組織はかつてないほど強固なセキュリティ対策を求められています。AIを悪用したサイバー攻撃は、侵入から影響までの時間を劇的に短縮し、防御側の対応能力を上回る「機械速度」での攻撃が可能になっています。これに対抗するため、AIを活用した脅威検知システムや自動防御ソリューションへの投資が加速しており、同時にセキュリティ専門人材の育成も喫緊の課題です。開発者にとっては、AIを活用したセキュリティソリューション開発の需要が高まることを意味します。","source":"セキュリティレポート","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFnkWvo1Lep5hBmP5feHrzGxb7hqMwY_X4FRLPxKZ8CqcwnMRoAcV55xUokITDURz4H5etr1NzSyVdJr6JvpeTccRP13aBpfeA34xmWM4zWrS-C0vysuqkif4KWS-WNQsMX-36wXaZNu1j_E8kogrLKHIoGcmAJDbXfAS8w7WBo2aUTmA0_DqBs8b7SfHQ5ohX7TaWzu_A7mviVlZKqJn4ZSXNsm1y4XLNrb7RnFC-j_0DrDi-hgnrUZfnfB6v3iO4QB08EtHrH","impact":"high","tags":["サイバーセキュリティ","AI防御","脅威検知","人材育成"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
