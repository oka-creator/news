<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月27日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年3月27日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Wikipedia、文章生成AIによる記事本文作成を原則禁止する新ガイドラインを採用","summary":"英語版Wikipediaは、ChatGPTのような文章生成AIに記事本文を生成させたり書き換えさせたりすることを原則禁じる新ガイドラインを導入しました。この動きは、AIが生成する文章がWikipediaの信頼性や品質基準に反するリスクがあるためであり、記事の正確性を維持するための重要な措置です。認められるのは、自身で書いた文章の基本的な校正補助と、所定の手順に沿った翻訳支援のみです。個人開発者やコンテンツクリエイターにとっては、AIを安易に利用したコンテンツ作成が信頼性を損なう可能性があることを示唆しており、AI利用の倫理と品質管理の重要性が高まります。","source":"GIGAZINE","url":"https://gigazine.net/news/20260327-wikipedia-llm-guideline/","impact":"medium","tags":["AI倫理","コンテンツ作成","Wikipedia"]},{"title":"生成AI活用サービス「AIパンチャー」のオンプレミス版が提供開始","summary":"オープン株式会社は、プログラミング不要でデータアップロードだけでルーティンワークを自動化できる生成AI活用サービス「AIパンチャー」のオンプレミス版の提供を開始しました。このオンプレミス版は、医療機関や自治体などの閉域ネットワークでも利用可能であり、セキュリティ上の懸念からインターネット環境でのAI活用が難しかった業界に大きなメリットをもたらします。これにより、これまでAI導入が困難だった分野でも業務効率化が実現します。開発者にとっては、閉域環境でのAIソリューション開発や導入支援の需要が高まる可能性があります。","source":"PR TIMES","url":"https://prtimes.jp/main/html/rd/p/000000084.000129953.html","impact":"medium","tags":["オンプレミスAI","業務効率化","セキュリティ"]},{"title":"金融機関における生成AI活用が実証段階から実装段階へ移行","summary":"ChatGPT登場から3年が経過し、金融機関における生成AI（人工知能）技術の活用が実証段階から実装段階へと移行しつつあります。具体的な導入事例が増加する一方で、従来のシステム案件とは異なる新たな課題も浮上しており、FINOLABの柴田誠氏が7つの活用領域と導入アプローチの要諦を解説しています。これは、金融業界がAIを本格的に業務に組み込み始めていることを示し、開発者にとっては、金融分野特有の規制やセキュリティ要件に対応したAIソリューション開発の専門知識がより一層求められることを意味します。","source":"DIGITAL X（デジタルクロス）","url":"https://digitalx.jp/ai/ai-11-20260326/","impact":"high","tags":["金融AI","AI実装","DX"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"AI活用で月収数千万円を稼ぐ海外個人開発者の事例が続々登場","summary":"「AIで副業は本当に稼げるのか？」という疑問に対し、実際に生成AIを活用して月収数千万円を稼ぐ海外の個人開発者・インディーハッカーの事例が多数紹介されています。例えば、Pieter Levels氏はPhoto AIなどで月収3,500万円超を達成しており、「とにかく早く出す」哲学と、最新フレームワークではなく熟知した技術スタックを使うことで開発スピードを最大化している点が成功の鍵とされています。これは、個人開発者にとってAIが新たなゴールドラッシュの機会を提供していることを示し、迅速なプロトタイピングと市場投入の重要性を強調しています。","source":"note","url":"https://note.com/ozaken_ai/n/n2b2d7e8e7a6f","impact":"high","tags":["個人開発","AI副業","インディーハッカー"]},{"title":"19歳の個人開発者による超高機動ソウルライク「Silver Requiem」が発表","summary":"SilverNightmareStudioは、19歳の個人開発者が手掛ける超高機動カウンター×ビルド構築型3DソウルライクアクションRPG「Silver Requiem」を発表しました。本作は、カウンターと回避でつかむ「一瞬の主導権」から次の一手を繰り出すことが特徴で、2026年秋以降にSteamでの発売が予定されており、6月以降にはデモ版の配信も予定されています。このニュースは、若き才能が大規模なゲーム開発に挑戦し、独自のアイデアで注目を集めていることを示しており、個人開発者にとって年齢や規模に関わらず情熱とアイデアがあれば成功の可能性があることを鼓舞します。","source":"Gamer","url":"https://www.gamer.ne.jp/news/202603260029/","impact":"medium","tags":["ゲーム開発","インディーゲーム","ソウルライク"]},{"title":"コスト重視の個人開発者向けAIコーディングツールが進化","summary":"AIコーディングツールの進化により、コストを重視する開発者やインディーハッカーにとって、より強力なAI支援が身近になっています。例えば、OpenCodeやAiderは、DeepSeekなどのローカルモデルにも対応し、月額2～5ドル程度で利用できるAPI価格で、以前は高価だったAI支援が現実のものとなっています。これは、個人開発者が低コストで高度なAI支援を受けられるようになり、開発効率を大幅に向上させることが可能になったことを意味します。重要なのは、どのツールを選ぶかよりも、ツールを日常的に活用することであると指摘されており、AIを開発プロセスに積極的に組み込むことの重要性が増しています。","source":"NxCode","url":"https://nxcode.jp/blog/best-ai-coding-tools-2026","impact":"high","tags":["AIコーディング","開発効率","コスト削減"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"ソフトバンク、F1日本グランプリで「5G SA × ミリ波」を活用した先進的通信を実証","summary":"ソフトバンク株式会社は、2026年3月27日から開催されるF1日本グランプリにおいて、真の5Gである「5G SA（Standalone）」と「ミリ波」を駆使し、ネットワークスライシング技術を用いて5つの先進的な通信環境を同時に提供する実証を発表しました。これにより、来場者の通信品質向上に加え、XRコンテンツ視聴やキャッシュレス決済の安定化など、イベント運営の高度化が図られます。この実証は、5G SAとミリ波が提供する高速・低遅延・多接続の可能性を具体的に示しており、開発者にとっては、これらの先進的な通信インフラを活用した新しいアプリケーションやサービスの開発機会が拡大することを示唆しています。","source":"ロボスタ","url":"https://robotstart.info/2026/03/25/softbank-f1-5gsa.html","impact":"medium","tags":["5G SA","ミリ波","ネットワークスライシング"]},{"title":"手のひらサイズの次世代Mobile AI PC「Vividnode Mobile AI」が発表","summary":"株式会社瑞起は、次世代AI処理に特化したモバイルPC「Vividnode Mobile AI」を発表しました。本製品は、高性能AI処理能力と持ち運びやすさを両立し、クラウドに依存しないローカルAI実行環境を備えることで、セキュリティと高速処理を実現します。これにより、ユーザーは自分専用のAI環境をいつでもどこでも活用できる新しいコンピューティング体験を得られます。開発者にとっては、エッジAIやローカルAIモデルの最適化、そしてモバイル環境でのAIアプリケーション開発の新たなプラットフォームが登場したことを意味します。","source":"PR TIMES","url":"https://prtimes.jp/main/html/rd/p/000000007.000129953.html","impact":"high","tags":["モバイルAI","エッジAI","ローカルAI"]},{"title":"ジェトロ、インドのテックキャリアイベントに出展し日本の魅力をアピール","summary":"ジェトロは3月13日、インドのインドラプラスタ情報技術大学（IIITD）で開催されたテックキャリアイベント「スタートアップ26フェア（STARTUP&#039;26 FAIR）」にブースを出展しました。就業先としての日本の魅力や日本で働くための準備について説明し、日本の大手カジュアル衣料メーカーから内定を得た学生の事例などを紹介しました。日本語能力がエンジニアにとって大きな差別化要因となることや、日本が長期的な視点でエンジニアを育成する環境、安全な生活環境が魅力であることを強調しました。この取り組みは、日本のIT人材不足を解消し、多様なバックグラウンドを持つ開発者を日本に呼び込むための重要な一歩であり、海外の開発者にとっては日本でのキャリアパスを検討する良い機会となります。","source":"ジェトロ","url":"https://www.jetro.go.jp/biznews/2026/03/f3b97b0a37332c86.html","impact":"low","tags":["海外人材","日本キャリア","IT人材"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
