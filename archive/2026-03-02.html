<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月2日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年3月2日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"OpenAIが総額1100億ドルの資金調達とAmazonとの戦略的提携を発表","summary":"OpenAIは企業価値7300億ドルと評価され、Amazon、NVIDIA、ソフトバンクグループから総額1100億ドルを調達しました。特にAmazonとの提携を拡大し、AWSインフラを通じて約2ギガワットの電力を確保、次世代AIモデル開発を加速させます。この提携により、企業がAWS上でOpenAIの最新モデルをセキュアかつ大規模に利用するハードルが大幅に下がります。結果として、「AIインフラ導入支援コンサルタント」の需要が高まると予想され、開発者は新たなビジネスチャンスを掴むことができます。","source":"ITmedia NEWS","url":"https://www.itmedia.co.jp/news/articles/2602/28/news035.html","impact":"high","tags":["生成AI","資金調達","AWS","OpenAI","企業提携"]},{"title":"Googleが推論能力を飛躍的に高めた『Gemini 3.1 Pro』をリリース","summary":"Googleは最新AIモデル「Gemini 3.1 Pro」をパブリックプレビューで公開しました。このモデルは処理速度向上に加え、高度な論理的推論と長いコンテキスト理解で劇的な進化を遂げています。特に強化された「カスタムツール呼び出し機能」により、AIが外部アプリケーションやデータベースと連携し、複雑なタスクを自律的に遂行可能になりました。これにより、特定の業界に特化した「専用AIエージェント」の開発が容易になり、中小企業向けの業務効率化ツール提供や受託開発で高い収益化が期待されます。","source":"Google Cloud Blog","url":"https://docs.cloud.google.com/vertex-ai/generative-ai/docs/models/gemini/3-1-pro","impact":"high","tags":["Gemini","Google AI","LLM","AIエージェント","推論能力"]},{"title":"NTTドコモビジネス、生成AIサービス『Stella AI for Biz』で業界最高水準の議事録機能を提供開始","summary":"NTTドコモビジネスは、SUPERNOVAと連携し、生成AIサービス「Stella AI for Biz」で議事録生成機能の正式版を提供開始しました。この機能は業界最高水準の文字起こし精度を誇り、月間最大230時間の議事録生成を追加料金なしで利用できます。音声による話者分離、モバイルアプリ/ブラウザでのリアルタイム録音、用語登録機能などが特長です。これにより、企業の業務効率化を強力に支援し、開発者は既存システムとの連携やカスタマイズの機会を見出すことができます。","source":"NTTドコモビジネス株式会社 プレスリリース","url":"https://www.docomo.biz/news/press/2024/20240228_01.html","impact":"medium","tags":["議事録AI","業務効率化","NTTドコモ","生成AIサービス"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"Claude Codeを活用した副業管理アプリの個人開発事例が公開","summary":"JavaエンジニアがReact NativeとClaude Codeを用いて副業管理アプリを個人開発した事例が紹介されました。この開発者はAIによるコード生成やエラー解決のサポートを積極的に活用し、約6週間で15画面、約6,000行のTypeScriptコードを実装しています。この事例は、個人開発においてAIツールが「コードを書く補助」から「プロダクトを作るパートナー」へと進化していることを示しています。特にフロントエンド開発の障壁が下がり、個人開発者がより迅速にアイデアを形にできる実用的な情報を提供します。","source":"note (Claude Codeで副業管理アプリを個人開発した話)","url":"https://note.com/y_taka_dev/n/n2626e2e4e116","impact":"high","tags":["個人開発","AIプログラミング","Claude Code","React Native","副業アプリ"]},{"title":"AI行動支援OS『Addness』のユーザー数が5,000人を突破","summary":"アドネス株式会社が提供するAI行動支援OS「Addness」の登録ユーザー数が5,000人を突破しました。2024年12月の正式リリース以降、フリーランス、個人事業主、学生など幅広い層で導入が進んでいます。このツールは、AIとの対話を通じて目標設定・計画設計・実行管理までを一体的に支援し、「計画立案の億劫さ」を解消する実用的なサービスとして注目されています。個人開発者にとっては、自身の生産性向上ツールとして活用できるほか、AIを活用したSaaS開発の成功事例として参考になります。","source":"PR TIMES (アドネス株式会社)","url":"https://prtimes.jp/main/html/rd/p/000000003.000135898.html","impact":"medium","tags":["AIツール","生産性向上","SaaS","個人事業主","目標管理"]},{"title":"2026年は個人開発が最も活発になる年になる、AI開発ツールの進化が背景に","summary":"2026年に入り、AI開発アシスタント（Cursor、GitHub Copilot、Claude、ChatGPTなど）の使い勝手が劇的に向上し、個人開発が活発化しているとの見解が示されています。AIがコード作成だけでなく、要件定義から実装、エラー解決までをサポートすることで、開発時間が大幅に短縮され、新しい技術の学習コストも低下しています。これにより、多くのエンジニアが個人開発に参入しやすくなっており、インディーハッカーにとって新たなチャンスと挑戦の時代が到来しています。","source":"note (2026年は個人開発が最も活発になる年になる)","url":"https://note.com/k_s_k_dev/n/n4d8c82350849","impact":"high","tags":["個人開発","AI開発アシスタント","開発効率化","インディーハッカー","未来予測"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"NTTドコモ、AWS上で5Gコアネットワークの商用運用を開始し、AIエージェントで構築期間を80%短縮","summary":"NTTドコモは、通信事業者としてアジア太平洋地域で初めて、AWSのクラウドサービスと同社の仮想化基盤を組み合わせたハイブリッド環境上で5Gコアネットワークの商用サービスを開始しました。この商用展開では、AIエージェントを活用して5GCの設計・構築を自動化し、構築期間を約80%短縮、障害対応時間を約50%短縮することに成功しています。これは通信インフラのクラウド化とAIによる運用効率化の大きな一歩であり、開発者はAIを活用したインフラ自動化の可能性を再認識する機会となります。","source":"PR TIMES (アマゾンジャパン合同会社)","url":"https://prtimes.jp/main/html/rd/p/000000001.000137350.html","impact":"high","tags":["5G","AWS","クラウドインフラ","AIエージェント","通信技術"]},{"title":"さくらインターネット、実験科学者向けノートアプリ『eureco』のオープンβ版を提供開始","summary":"さくらインターネットは、実験科学者のためのノートアプリケーション「eureco（エウレコ）」のオープンβ版を2026年3月2日より提供開始しました。このアプリは、実験過程で発生する条件、手順、結果、考察に加え、写真やデータなど多岐にわたる情報を一元的に収集・統合し、記録の構造化やデータの一元管理を可能にします。これにより、研究活動における再現性向上とデータ管理の効率化を支援し、研究DXをサポートします。開発者にとっては、特定の専門分野に特化したSaaS開発の事例として参考になります。","source":"さくらインターネット ニュース","url":"https://www.sakura.ad.jp/corporate/news/press/2024/0228-eureco/","impact":"medium","tags":["研究DX","SaaS","データ管理","科学技術","さくらインターネット"]},{"title":"GMOプライム・ストラテジー、教育機関向けにAI自動採点ソリューションを提供開始","summary":"GMOプライム・ストラテジーは、生成AIを活用して試験やレポートの採点業務を自動化するAI自動採点ソリューションを、2026年3月2日より正式に提供開始しました。このソリューションは、IT知識がない方でも「置くだけ、押すだけ」のシンプルな操作で、数百人規模の記述式採点を均一な品質で自動化できる点が特長です。教員の採点業務負担を大幅に削減し、個別指導や授業準備など教育の本質的な質の向上に繋がる時間の創出を支援します。開発者にとっては、教育分野におけるAI活用の新たなビジネスモデルとして注目されます。","source":"GMOプライム・ストラテジー プレスリリース","url":"https://www.gmo-ps.com/news/press/20240228_ai-grading-solution/","impact":"medium","tags":["教育DX","AI採点","生成AI","業務効率化","EdTech"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
