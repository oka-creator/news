<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年8月26日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年8月26日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"国立情報学研究所（NII）が新たな大規模言語モデル「LLM-jp-4 33B」を公開","summary":"国立情報学研究所（NII）の大規模言語モデル研究開発センター（LLMC）が、約332億パラメータを持つDense型大規模言語モデル「LLM-jp-4 33B」を公開しました。このモデルには、事前学習と中間学習を行ったベースモデルと、事後学習まで行った「llm-jp-4-33b-thinking」の2種類があります。日本語の自然な文脈理解や論理展開に強みを持つため、日本のAI研究やビジネスにおけるLLM活用を大きく推進するでしょう。開発者は、より高性能な国産LLMを基盤としたアプリケーション開発が可能になります。","source":"LLM-jp","url":"https://llm-jp.nii.ac.jp/news/20260818/","impact":"high","tags":["LLM","国産AI","NII"]},{"title":"自治体AI zevoで国産生成AIモデル「PLaMo 3.0 Prime」の提供を開始","summary":"シフトプラス株式会社は、自治体AI zevoにおいて、Preferred Networks（PFN）が開発した国産生成AI基盤モデル「PLaMo 3.0 Prime」の提供を2026年8月25日より開始しました。このモデルは高い日本語性能と長文処理に対応しており、行政業務での文書作成・要約・翻訳・調査支援など幅広い活用が期待されます。自治体職員の業務効率化に大きく貢献し、日本の公共サービスにおけるAI導入を加速させるでしょう。開発者は、行政特化のAIソリューションを構築する際の強力な選択肢を得られます。","source":"PR TIMES (シフトプラス)","url":"https://prtimes.jp/main/html/rd/p/000000109.000057077.html","impact":"medium","tags":["国産AI","自治体AI","PFN"]},{"title":"政府、生成AI事業者に学習データ開示要求の基本原則を決定","summary":"政府は2026年8月25日、生成AI事業者が守るべき知的財産権保護のルールを定めた基本原則を正式に決定しました。この原則は、学習データや使用モデルの概要開示、権利者からの開示要求への回答、生成AI利用者からの開示要求への回答の3つを柱としています。生成AI技術の進歩促進と知的財産権の適切な保護の両立を目指すもので、罰則規定は設けられていません。開発者は、学習データの透明性確保と知的財産権への配慮が求められるようになり、今後のAI開発プロセスに影響を与える可能性があります。","source":"FNNプライムオンライン","url":"https://www.fnn.jp/articles/-/749297","impact":"high","tags":["規制","知的財産権","生成AI"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"インディーハッカーのラシッド氏、月額62ドルのツールで月商3万2000ドルのデータベース帝国を築く","summary":"インディーハッカーのラシッド氏が、わずか月額62ドル（約1万円）の運用コストで月間経常収益（MRR）3万2000ドル（約510万円）を生み出す3つのデータベースウェブサイトを構築しました。その旗艦製品「AngelMatch」は、12万5000人のエンジェル投資家とベンチャーキャピタリストを検索できるデータベースです。アーリーステージの創業者が資金を見つけるという具体的な課題を解決し、単独でMRR 2万9000ドルを稼ぎ出しています。これは、低コストで高収益を上げる個人開発の成功事例として、多くのインディーハッカーにインスピレーションを与えるでしょう。","source":"Vertex AI Search (Google Cloud)","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHvvSLitp2oj4yv_vFBT4vHWwA9EuVz9UPUXwS_ZUYpssHnZSkdVfgohLR80-7Gvw5qNhqzuASqNHDBEDJCiGhDwT1aXjfJYbGUtPCcp5VWVOORSXx183LEVvRZf4qhMKJJeC6iAwxgCqA=","impact":"medium","tags":["インディーハッカー","個人開発","収益化"]},{"title":"株式会社Sapeet、ノーコードAI基盤からコードベースの生成AI基盤へ2週間で移行","summary":"株式会社Sapeetは、ノーコードAIプラットフォームDifyで立ち上げた生成AIツールを、プロダクトの成長に合わせてAmazon Bedrock AgentCoreとStrands Agents SDKによるコードベースのアーキテクチャへ移行しました。Difyで築いた約1年間の開発資産と設計思想を活かすことで、わずか2週間という短期間で基盤移行を完了させ、環境分析調査時間を大幅に削減したとのことです。この事例は、ノーコードからコードベースへのスムーズな移行パスを示し、開発者がプロダクトの成長段階に応じて柔軟に技術スタックを選択できる可能性を提示します。","source":"AWS Japan ブログ","url":"https://aws.amazon.com/jp/blogs/news/sapeet-migration-from-nocode-to-codebased-generative-ai-platform/","impact":"medium","tags":["ノーコード","コードベース","AI基盤"]},{"title":"2026年8月版ノーコード・ローコードツールランキングが発表","summary":"2026年8月時点でのノーコード・ローコードツールの最新ランキングが発表され、「JUST.DB」が1位、「SmartDB」が2位、「esm appli」が3位にランクインしました。これらのツールは、プログラミング知識なしで業務システムの構築、ワークフローのデジタル化、Web・スマホアプリ開発などを可能にし、企業のDXを強力にサポートしています。開発者やビジネスユーザーは、これらのランキングを参考に、自社のニーズに合ったツールを選定し、迅速なシステム開発や業務改善を進めることができるでしょう。","source":"ITトレンド","url":"https://it-trend.jp/nocode_lowcode/ranking","impact":"low","tags":["ノーコード","ローコード","DX"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Apple、M6とM5 Pro搭載の新しいMac miniを発表","summary":"Appleは2026年8月25日、新しいM6とさらにパワフルなM5 Proチップを搭載したMac miniを発表しました。M6搭載モデルは最大4倍高速なAIパフォーマンス、2倍高速なグラフィックスとストレージを実現し、日々の生産性向上からエージェント型AIワークフローまで驚異的な速度で処理します。M6搭載Mac miniは149,800円（税込）から、M5 Pro搭載Mac miniは299,800円（税込）から予約注文が開始されます。開発者は、これらの高性能チップを搭載したMac miniを、AI開発やグラフィックを多用するアプリケーションのテスト環境として活用できるでしょう。","source":"Apple Newsroom","url":"https://www.apple.com/jp/newsroom/2026/08/apple-unveils-new-mac-mini-with-m6-and-m5-pro/","impact":"high","tags":["Apple","Mac mini","M6チップ"]},{"title":"NVIDIA、「Jetson Orin Nano 2」を発表 - エッジ生成AIのリアルタイム処理を強化","summary":"NVIDIAは、組み込み機器向けAIモジュール「Jetson Orin」の新たなラインアップとして「Jetson Orin Nano 2」を発表しました。現行の「Jetson Orin Nano」のメモリ容量8GBモデルと比較して推論性能が2倍に向上し、同じ推論性能であれば消費電力を40％削減できるとのことです。これにより、エッジ環境での生成AIのリアルタイム処理がさらに実用的になります。開発者は、より高性能かつ省電力なエッジAIデバイスを設計・実装できるようになり、IoTやロボティクス分野でのAI活用が加速するでしょう。","source":"MONOist","url":"https://monoist.itmedia.co.jp/mn/articles/2608/26/news049.html","impact":"high","tags":["NVIDIA","Jetson Orin","エッジAI"]},{"title":"OptQC株式会社、光量子コンピュータ実用化に向け70億円の資金調達を実施","summary":"光量子コンピュータの実用化を目指すOptQC株式会社は、NTTをリード投資家とするシリーズA2ラウンドで総額70億円の資金調達を完了しました。これにより、同社の累計調達額は91.5億円となり、獲得済みの補助金を含めると累計200億円を突破しました。調達した資金は、次世代光量子プロセッサの開発と人材採用の加速に充てられる予定です。この大規模な資金調達は、日本の量子コンピュータ研究開発を大きく前進させ、将来のコンピューティングパラダイムを変革する可能性を秘めています。開発者は、将来的に量子コンピュータを活用した新たなアルゴリズムやアプリケーション開発の機会が増えることが期待されます。","source":"PR TIMES (OptQC株式会社)","url":"https://prtimes.jp/main/html/rd/p/000000010.000100778.html","impact":"high","tags":["量子コンピュータ","資金調達","研究開発"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
