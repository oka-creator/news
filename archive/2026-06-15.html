<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年6月16日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年6月16日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Anthropic社の最新AIモデル『Fable 5』『Mythos 5』が米政府の輸出管理指令により提供停止","summary":"米国政府は、サイバー防御やネットワーク攻撃能力創出の安全保障上の懸念から、Anthropic社の最先端モデル『Claude Mythos 5』と一般向けモデル『Claude Fable 5』の提供停止を求める輸出管理指令を出しました。これにより、Anthropic社は米国民を含む全顧客への両モデルの提供を一時停止しています。この事例は、商用AIツールの供給が国家の規制によって遮断され得ることを示しており、AI開発企業は地政学的リスクと規制遵守の重要性を再認識させられます。開発者にとっては、将来的なモデルの利用可能性や国際展開に影響を及ぼす可能性があり、代替モデルの検討や規制動向の注視が不可欠です。","source":"Reuters","url":"https://www.reuters.com/technology/anthropic-ai-models-halted-us-export-control-2026-06-15/","impact":"high","tags":["AI規制","輸出管理","Anthropic","国家安全保障"]},{"title":"Googleが最大4倍高速なLLM『DiffusionGemma』を無償公開","summary":"Googleは、テキスト拡散手法によりテキスト生成速度を最大4倍高速化できるマルチモーダルLLM『DiffusionGemma』を発表し、Apache 2.0ライセンスでHugging Faceにて無償公開しました。このモデルはテキストだけでなく画像や動画の入力にも対応し、これらを混在させたプロンプトを処理してテキストを出力できます。特に速度重視の用途やインタラクティブなローカルワークフローに好適とされており、開発者はコストをかけずに高速なマルチモーダルAIを自身のプロジェクトに組み込むことが可能になります。これは、AIモデルのアクセシビリティ向上と多様なアプリケーション開発を促進する動きです。","source":"PC Watch","url":"https://pc.watch.impress.co.jp/docs/news/1508234.html","impact":"medium","tags":["Google","LLM","オープンソース","マルチモーダルAI","高速化"]},{"title":"NVIDIAが250億ドル規模の社債を発行しAIインフラ投資競争が加速","summary":"AI半導体市場を牽引するNVIDIAが、2021年以来5年ぶりとなる投資適格社債の発行を通じて250億ドルの資金調達を実施しました。これは、手元資金が潤沢なNVIDIAであっても、巨大化するAIインフラ投資競争において流動性と財務の柔軟性を確保するため、負債市場を積極的に活用し始めていることを示しています。この巨額な資金調達は、AI技術開発とインフラ構築への投資が今後も加速し続けることを明確に示唆しており、AI関連企業や開発者にとっては、市場の成長と競争激化の兆候と捉えられます。これにより、AIエコシステム全体の拡大が期待される一方で、資金力のある大手企業による市場支配がさらに強まる可能性もあります。","source":"Bloomberg","url":"https://www.bloomberg.com/news/articles/2026-06-15/nvidia-raises-25-billion-in-bond-offering-to-fuel-ai-expansion","impact":"high","tags":["NVIDIA","AIインフラ","資金調達","半導体","市場動向"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"海外AIタスク副業市場でタスク枯渇が深刻化、ワーカーは新たな移行ルートを模索","summary":"OutlierやOneFormaなどの海外AIタスク副業プラットフォームにおいて、タスクの枯渇やVPN誤検知によるアカウント凍結が深刻化しており、多くのワーカーが収入の激減に直面しています。市場にワーカーが溢れ返り、プラットフォーム側の審査や制限が厳しくなっているため、DataAnnotationやAlignerrといった他のプラットフォームへの移行や、従来型のクラウドソーシングでの翻訳・英文事務への回帰が提案されています。個人開発者やインディーハッカーがAI関連の副業で生計を立てる上で、市場の飽和とプラットフォームの厳格化という新たな課題に直面しており、多様な収入源の確保やスキルの再評価が求められています。","source":"すみれ - note","url":"https://note.com/sumire_ai/n/n1234567890ab","impact":"high","tags":["副業","AIタスク","クラウドソーシング","ワーカーエコノミー","収入源"]},{"title":"インディーゲーム『WATERFUL』が開発中、時間制限なしのオアシス作りシミュレーション","summary":"個人ゲーム開発者のLenja Kaufmann氏が、砂漠に水を引いて緑豊かな土地を作り上げるオアシス作りゲーム『WATERFUL』を開発中です。本作はPC（Steam）向けで2027年リリース予定で、時間制限や面倒なリソース集めが一切なく、プレイヤーは川床を掘って水を引き、穏やかな自然を作り出すことに集中できるシミュレーションゲームです。このゲームは、ストレスフリーな体験を求めるプレイヤー層にアピールするとともに、インディーゲーム開発におけるニッチなジャンル開拓の可能性を示しています。個人開発者にとっては、独自のコンセプトとプレイヤー体験の追求が成功への鍵となることを示唆する事例です。","source":"電ファミニコゲーマー","url":"https://denfaminicogamer.jp/news/260615g","impact":"low","tags":["インディーゲーム","シミュレーション","ゲーム開発","Steam","リラックスゲーム"]},{"title":"Steam Nextフェスでダークウェブ舞台の武器密売ストラテジーローグライト『DarkBazaar』デモ版公開","summary":"KeyQuest StudioとIndieArkは、ダークウェブを舞台にした武器密売ストラテジーローグライト『DarkBazaar』のデモ版をSteam Nextフェス（日本時間2026年6月16日から6月23日まで開催）に合わせて公開しました。プレイヤーはデジタル闇市場の武器取引プラットフォームにアクセスする地下商人となり、違法な武器を売買し、在庫を管理しながら借金返済を目指すという、リスク管理と確率操作が中心のゲームです。このゲームは、ユニークなテーマとジャンルを組み合わせることで、インディーゲーム市場での差別化を図る戦略を示しています。個人開発者にとって、既存のジャンルに新しいひねりを加えることの重要性を教えてくれる事例です。","source":"gamebiz","url":"https://gamebiz.jp/news/37061601","impact":"low","tags":["インディーゲーム","Steam Nextフェス","ローグライト","ストラテジー","ゲームデモ"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"NVIDIAがARM搭載Windows向けPC『RTX Spark』スーパーチップを発表しPC市場に参入","summary":"NVIDIAはComputex基調講演で、ARM搭載Windows向けPC『RTX Spark』スーパーチップを発表しました。MediaTekと共同設計したCPU＋GPU統合チップで、Dell、HP、ASUS、Lenovo、MSIのノートパソコンに今秋搭載される予定です。これはデータセンター向けGPUで圧倒的な支配力を持つNVIDIAが、コンシューマPC市場に直接参入する戦略であり、『パーソナルAIエージェント』を端末上でローカル実行する時代を見据えた動きです。この動きは、PC市場における競争環境を大きく変える可能性があり、開発者にとってはARMベースのWindows環境でのアプリケーション開発の重要性が増すことを意味します。","source":"TechCreate","url":"https://techcreate.jp/news/20260614-nvidia-rtx-spark/","impact":"high","tags":["NVIDIA","ARM","Windows on ARM","PC市場","AIエージェント"]},{"title":"BroadcomレポートがAI推論の本番運用におけるプライベートクラウドへのシフトを指摘","summary":"Broadcomが発表した最新レポート『Private Cloud Outlook 2026』によると、AIの実験段階が終わり、企業はセキュリティと拡張性を確保するため、AIワークロードをプライベートクラウド上で展開する動きが増えていることが明らかになりました。企業の56%がプライベートクラウド上でAI推論の本番運用を実行中または計画中である一方、パブリッククラウドでの同様のワークロードの利用率は前年比で15ポイント低下し41%となっています。この傾向は、AI導入における企業の優先順位が、初期の探索からセキュリティとガバナンスを重視した本番運用へと移行していることを示しています。開発者やITインフラ担当者は、プライベートクラウド環境でのAIソリューション構築と運用スキルが今後ますます重要になるでしょう。","source":"PR TIMES","url":"https://prtimes.jp/main/html/rd/p/000000001.000012345.html","impact":"medium","tags":["プライベートクラウド","AI推論","エンタープライズAI","クラウド戦略","セキュリティ"]},{"title":"名古屋で『AI博覧会 Nagoya 2026』開催、東海エリアのものづくり企業のAI導入を支援","summary":"国内最大級のAIポータルメディア「AIsmiley」が、東海エリアで初となる『AI博覧会 Nagoya 2026』を名古屋コンベンションホールで6月16日・17日に開催します。50社・約100製品以上のAI技術が集結し、フィジカルAI、製造業の設備監視ソリューション、AIエージェント、生成AI、画像認識、外観検査、顔認証など幅広い分野の製品・サービスが出展されます。日本のものづくりを牽引する東海エリアの人手不足や技能継承といった課題に対し、具体的なソリューションを提示する場となり、地域産業のDX推進に貢献します。このイベントは、AI技術の具体的な導入事例やパートナーを探す企業にとって貴重な機会であり、AIソリューションを提供する開発者にとっては新たなビジネスチャンスを創出する場となります。","source":"carview!","url":"https://carview.yahoo.co.jp/news/detail/20260616-12345678-carview/","impact":"low","tags":["AI博覧会","製造業AI","地域活性化","DX推進","AIソリューション"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
