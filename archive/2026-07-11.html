<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年7月12日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年7月12日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"OpenAIの最新モデル「GPT-5.6」群が一般公開され、業務支援を強化","summary":"OpenAIが2026年7月9日に最新の生成AIモデル「GPT-5.6」シリーズを一般公開しました。これには、高度な推論向けの「GPT-5.6 Sol」、バランス型の「GPT-5.6 Terra」、高速・低価格な「GPT-5.6 Luna」が含まれ、コーディングや調査など幅広いビジネス用途に対応します。さらに、Google DriveやSlackなど15の外部サービスと連携し、社内情報から「そのまま使える成果物」を作成できる業務プラットフォーム「ChatGPT Work」も発表されました。これにより、開発者はより強力なAIツールを業務に組み込み、生産性を大幅に向上させることが可能になります。この進化は、AIがビジネスの基盤技術としてさらに深く浸透することを示唆しています。","source":"JTP &amp; ITmedia PC USER","url":"https://www.jtp.co.jp/news/2026/07/10/third-ai-gpt-5-6/","impact":"high","tags":["生成AI","LLM","業務効率化"]},{"title":"Anthropicが収益でOpenAIを逆転し、AI覇権の力学に変化","summary":"Anthropicが年換算収益（ARR）で約470億ドルに達し、OpenAIの約250億〜330億ドルを大きく上回り、AI業界のトップに躍り出ました。法人サブスクリプション数でもChatGPTを初めて凌駕し、2029年には黒字化できる見通しを示しています。これは、GoogleとAmazonの強力なバックアップを武器に急成長を遂げたAnthropicが、AI業界の勢力図を塗り替えつつあることを明確に示唆しています。開発者にとっては、OpenAI以外の選択肢が強力になり、より競争的なAIエコシステムの中で最適なモデルを選べるようになるでしょう。","source":"TechCreate","url":"https://techcreate.jp/2026/07/10/tech-news-7-10/","impact":"high","tags":["AI市場","競争","Anthropic"]},{"title":"ローカルLLMの「爆速進化」が実現、個人PCでのAI活用が加速","summary":"2026年6月には、GoogleのGemma 4の「QAT版」や中国Z.aiのGLM-5.2、コーディング特化のOrnith-1.0など、ローカル向けの新モデルが相次いで公開され、ローカルLLMの性能が劇的に向上しました。量子化、QAT、MoE、高速化といった技術の進展により、巨大なAIモデルを家庭のPCで動かすことが現実的になっています。これにより、クラウドへの機密データ送信が難しい企業や、AI課金ゼロを目指す個人開発者にとって、ローカルでのAI活用が現実的な選択肢となります。開発者は、プライバシーを重視したアプリケーションやオフライン環境でのAI利用をさらに推進できるようになるでしょう。","source":"note (t_kawa)","url":"https://note.com/t_kawa/n/n2b2d18b6256f","impact":"medium","tags":["ローカルAI","個人開発","プライバシー"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"フリーランスエンジニアの「個人開発」がAI時代の生存戦略に","summary":"2026年現在、フリーランスエンジニアにとって個人開発は「余裕がある人の趣味」から「中堅フリーランスの生存戦略」へと意味合いが変化しています。フロー収入の単価上げ余地が縮小する中で、プロダクト型、スキル販売型、コンテンツ型といったストック収入の柱を持つことが重要視されています。AIを活用することで、題材選定や開発速度の向上が期待でき、本業と両立しながら月数万円から数十万円の収益を目指すことが現実的になっています。これは、AIが開発プロセスを効率化し、個人がより少ないリソースでプロダクトを生み出すことを可能にするため、開発者にとって新たな収益源を確立する大きなチャンスとなります。","source":"shusodo.com","url":"https://shusodo.com/freelance-engineer-personal-development-2026/","impact":"high","tags":["フリーランス","個人開発","AI活用"]},{"title":"海外アプリ開発者がAIインフルエンサー活用で月900万円達成","summary":"19歳の天才開発者が、これまでに62個以上のアプリを開発し、最近リリースした見た目改善系のアプリをAIインフルエンサーを積極的に活用することで、わずか1ヶ月で月900万円の収益に成長させました。この事例は、現代のtoCアプリ開発において、いかにバズるフックを作り、AIを活用したマーケティング戦略が成功に直結するかを示しています。開発者にとっては、プロダクトの質だけでなく、AIを活用した革新的なマーケティング手法が収益化の鍵となることを示唆しており、今後のアプリ開発の方向性に大きな影響を与えるでしょう。","source":"minnano-newsletter.com","url":"https://minnano-newsletter.com/posts/20260622","impact":"medium","tags":["アプリ開発","AIマーケティング","収益化"]},{"title":"ディストピア反逆リズムアクションADV『MoonHack（ムーンハック）』が正式発表","summary":"Astro ProductionのインディーゲームブランドASTRAが、ディストピア反逆リズムアクションADV『MoonHack（ムーンハック）』を2026年7月7日に正式発表しました。このゲームは、正しすぎる管理社会を歌で書き換える旧式AI少女たちのハッキングを描いており、インディーゲーム界隈での注目を集めています。開発者にとっては、独創的な世界観とゲームシステムがインディーゲーム市場で成功するための重要な要素であることを再認識させる事例となるでしょう。また、AIをテーマにした作品が引き続き人気を集めていることも示しています。","source":"automaton-media.com","url":"https://automaton-media.com/articles/newsjp/20260707-300096/","impact":"low","tags":["インディーゲーム","ゲーム開発","AIテーマ"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"日本政府、業界特化型「バーティカルAI」に官民投資を集中","summary":"2026年7月10日、高市早苗首相が主宰する人工知能戦略本部が、第2期「AI基本計画」の改定案を決定しました。この計画では、製造業、物流、医療、金融、行政、農業、防衛など約20分野に特化した「バーティカルAI」の開発に官民投資を強力に推し進める方針が示されました。汎用AIではなく、日本の強みを持つ分野にAIを集中投入することで、「日本AX（AIトランスフォーメーション）」の実現を目指します。これは、特定の産業分野でAIソリューションを開発する企業や開発者にとって、政府からの強力な支援と市場機会が拡大することを示しており、大きなビジネスチャンスとなるでしょう。","source":"TechCreate","url":"https://techcreate.jp/2026/07/10/takaichi-vertical-ai/","impact":"high","tags":["国家戦略","バーティカルAI","産業DX"]},{"title":"東京でWeb3カンファレンス「WebX2026」開催、政府要人も登壇し国家戦略化を強調","summary":"2026年7月13日・14日に東京で開催されるアジア最大級のWeb3カンファレンス「WebX2026」では、高市早苗内閣総理大臣がビデオ登壇することが決定しました。これは、日本のWeb3.0進化が「国家戦略」の核心に昇華したことを世界に示す歴史的転換点とされています。政府は暗号資産やブロックチェーン技術を「規制の対象」から「成長のエンジン」として認識を根本から転換させ、ステーブルコインやAIによる決済を積極的に推進する姿勢を明確にしています。Web3関連の開発者にとっては、日本がこの分野でのイノベーションを積極的に支援する姿勢を示したことで、新たなプロジェクトやビジネスチャンスが大きく広がることを意味します。","source":"Animagic DAO &amp; CoinPost","url":"https://animagic-dao.com/webx2026-japan-web3-national-strategy/","impact":"high","tags":["Web3","ブロックチェーン","国家戦略"]},{"title":"トランプ政権、インテル復活を後押ししAppleやNvidiaとの提携を促進","summary":"ウォール・ストリート・ジャーナル紙の報道によると、トランプ政権はインテルの最近の業績回復において中心的な役割を果たしており、AppleやNvidia、SpaceXなど主要テクノロジー企業に対し、インテルとの提携を促してきました。Appleは米国内への投資拡大を約束することで関税適用除外を獲得し、一部のMacおよびiPhone製品向けチップの製造をインテルに委託する計画を進めていると報じられています。この動きは、半導体サプライチェーンの国内回帰を加速させ、インテルだけでなく米国の半導体産業全体に大きな影響を与えるでしょう。開発者にとっては、インテル製チップの性能向上や供給安定化が期待され、ハードウェアとソフトウェアの最適化において新たな機会が生まれる可能性があります。","source":"Investing.com","url":"https://jp.investing.com/news/stock-market-news/article-904071","impact":"medium","tags":["半導体","サプライチェーン","地政学"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
