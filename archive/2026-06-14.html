<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年6月15日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年6月15日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"AppleがWWDC 2026でSiri 2.0を発表、Gemini・Claudeと統合へ","summary":"Appleは年次開発者イベントWWDC 2026で、Siriのメジャーアップデート「Siri 2.0」を発表しました。新Siriは複数ステップの連鎖命令や画面認識に対応し、Google GeminiやAnthropicのClaudeなど外部AIモデルとの連携を公式にサポートします。これにより、ユーザーは好みのAIモデルを選択できるようになり、iOS 27と共に提供される予定です。これはAppleがAI戦略を大きく転換し、他社AIとの協調路線に踏み切ったことを示しており、ユーザーはより高度でパーソナライズされたAI体験を享受できるようになるでしょう。","source":"テックニュース","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHwXpEpFAMTXWjjvEJbM7WZcXLWo05artgF-jR95CEpVbKvaCZWC-PWTMkx1hJQvCPQZpjsUTf5N2ar5iskSBdIGO1F1lbgQe53pTUs8hS5mNX5molK_WhYSa6GWSm2eg5pdUCuR13Wq9nmaBgFYmjX2ACbIvY32g==","impact":"high","tags":["Apple","Siri","LLM","AI統合"]},{"title":"AnthropicがLLM「Fable 5/Mythos 5」の提供を停止、米政府の輸出管理指令が背景に","summary":"Anthropicは、大規模言語モデルの最新リリースである「Claude Fable 5」および限定提供版「Claude Mythos 5」へのアクセスを停止しました。これは米国政府が国家安全保障上の権限を理由に発令した輸出管理指令を受けた緊急措置とのことです。Anthropicは、政府がFable 5のセキュリティ制限を回避する「ジェイルブレイク」手法を問題視したと説明していますが、同社は限定的かつ既知の脆弱性であり、他社のモデルでも同等の機能が利用可能であると反論しています。この動きは、AIモデルの安全性と国際的な規制動向が、今後のLLM開発・提供に大きな影響を与える可能性を示唆しています。","source":"テックニュース","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGOF3XiQ880jDkplqzlBllYBCWqvvpS7kAPdHywlqxKIClWhlv57F2yWwZxMlYeWL558zL6rrwliRwRK5p8UN2H9CS8QMzcWe0vqV6o0-12YkuiEbb6OfLLarPkcL6LLP1OAaQw","impact":"high","tags":["Anthropic","LLM","AI規制","国家安全保障"]},{"title":"Google、最大4倍高速なLLM「DiffusionGemma」を無償公開","summary":"Googleは、テキスト生成速度を最大4倍高速化できるというマルチモーダルLLM「DiffusionGemma」を発表し、Apache 2.0ライセンスでHugging Faceにて無償公開しました。このモデルは、総パラメータ数260億、アクティブパラメータ数40億のエキスパート混合モデル（MoE）で、テキストだけでなく画像や動画の入力にも対応します。一般的なLLMがトークン単位で逐次処理するのに対し、DiffusionGemmaはテキストのブロックを並列生成することで、GPUやTPUの待ち時間を減らし、処理の効率化と高速化を図ります。開発者にとって、より高速なテキスト生成はアプリケーションの応答性向上に直結する実用的な進化となるでしょう。","source":"テックニュース","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGtanf3a9KrLH9shfCujnNzitijHW9HjDDDZADA6seCe8Xvi1FlaKwXkwIGAieQNEVxFsG038VwdOT2bDTkn5_lYiLJtTfkvQCLFf-xJYmb2dgaR9YEsDCoq1dCcXCGputT8Dtmt_0wQ8D9uqlkanQ-","impact":"medium","tags":["Google","LLM","オープンソース","高速化"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"個人ゲーム開発者OKOWA_T、TPSサバイバルホラー『わたシのおいしいたべかた』体験版をSteamでリリース","summary":"個人ゲーム開発者のOKOWA_T氏が、開発中のTPSサバイバルホラーゲーム『わたシのおいしいたべかた』の体験版をSteamで配信開始しました。Unreal Engine 5による美麗なビジュアルが特徴で、龍神の支配下に置かれた架空の戦後世界を舞台に、生贄に選ばれた少女の過酷な運命と戦いを描きます。体験版では製品版序盤の廃村エリアを丸ごとプレイでき、探索、戦闘、リソース管理といった本作のコアなゲームプレイを体験できます。個人開発者が高いクオリティのゲームを制作し、Steamで公開する具体的な事例として注目されます。","source":"テックニュース","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHbkwqXYF0yfu7IKD2OWFONFgzzy5F82n1lrIH6dLTPpt3VRwZkECC2Jsxhvpv6oefYIZQN4qdUoevS6XWdBbwCSGWDhShvE-alHf_cpAlKsL3GBt_QuP6Qfg==","impact":"medium","tags":["個人開発","ゲーム開発","Steam","Unreal Engine 5"]},{"title":"AI活用で4.5時間でマネフォ風アプリ完成、しかし個人開発の“SaaSの壁”を痛感","summary":"プログラミング知識ゼロの非エンジニアが、AIツールを活用した「バイブコーディング」により、わずか4.5時間で支出管理アプリのプロトタイプを完成させました。この事例はAIによる個人開発の可能性を強く示唆する一方で、既存のSaaSが提供する「見えない価値」や、個人開発では乗り越えがたい“SaaSの壁”が存在することも浮き彫りにしました。AIが開発の敷居を下げる一方で、製品としての完成度や持続可能性には、依然として多くの課題があることが示唆されており、インディーハッカーにとって現実的な教訓となります。","source":"テックニュース","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHg279oduCm9eji6mRM8oeoA3fQNHDxYsfh2xYVnw7NtNp1suf2egANZE9C5qXXdN6HcwdysliaQhyGqAagSd68Q0-3QsejlWLzoe_fjOjqjrTTZBxEnTyOUy20YS7FUcOGFTKcup3jyoj9Vu1L3BfmEXSMi0saRMh37gw=","impact":"medium","tags":["AI開発","ノーコード","SaaS","個人開発の課題"]},{"title":"AI時代に月100万円以上稼ぐ海外個人開発者の秘密を深掘り","summary":"AI時代において、月100万円以上の収益を上げている海外の個人開発者の事例が紹介されています。特に、22歳の大学生がTikTokでバズるニッチを見つけ、2週間でアプリを開発し、80日で2000万円を稼いだ事例や、女子大学生が6ヶ月で月2300万円、8ヶ月で月3800万円を達成した事例などが取り上げられています。これらの事例は、トレンドの嗅覚と迅速な行動力、そしてインフルエンサーマーケティングの活用が、AI時代の個人開発で成功するための重要な要素であることを示しています。","source":"テックニュース","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFucfvwODjtI_Y7NnpeB45t472nIllqPmBnZkNAq_SZGmW5spwu8BGyeQvFfFw1HIkme9jclxVAoTubOqiZ2DSHS1Mc3BccBFV7LhZts4p73BD65EEL65E3Yctv","impact":"medium","tags":["個人開発","収益化","AIビジネス","インフルエンサーマーケティング"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"GIGABYTEがCOMPUTEX 2026でAI・ゲーミング・デザイン製品を展示、創業40周年を祝う","summary":"GIGABYTEはCOMPUTEX 2026において、AI、ゲーミング、プロダクトデザイン、ユーザーエクスペリエンスの各分野における先進的な製品を展示し、創業40周年を祝いました。特に注目されたのは、宇宙をインスピレーションとした設計のX870E AORUS INFINITY NEXTマザーボードです。AI TOPソリューション、AI PC、そして受賞歴のあるAORUS GeForce RTX™ 5090 AI BOXなど、AIとゲーミング技術が融合した製品群が紹介され、個人の生産性向上から高度なAIワークフローまで、拡張性のあるローカルAI機能が強調されました。これはAIがPCハードウェアの進化を牽引していることを明確に示しています。","source":"テックニュース","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGeLHic9C3f7TZ93vU9XTMlKYvIIQikZIG3UG7yRNTZxOZHxrv4NFc6fzg_UaTKxk0OQTUGg1SX7et_lID2ifYwoaqPc4u1vUetoAAfnQYShftUX3lkIfK78mI6RsABhkymcplQOJY_qlPGpXjWnxgYhS3AjunFkJfqCgAZChcQ7KgSNKXc5P8KlKoK2-7gTg==","impact":"medium","tags":["GIGABYTE","COMPUTEX","AI PC","ゲーミング"]},{"title":"丸紅グループ、生成AI基盤「まるちゃ」の外部提供を開始","summary":"丸紅I-DIGIOホールディングスは、丸紅グループ内で月間アクティブユーザー10,000名以上が活用する生成AIプラットフォーム「まるちゃ」の外部企業向け提供を開始しました。このサービスは、複数の最新LLM（GPT、Claude、Gemini、Perplexityなど）に対応し、メールや報告書のドラフト作成、要約、翻訳、アイデア整理といった日常業務に加え、PDF・Excel・Wordなどのファイル解析、高精度RAG、議事録作成支援、PowerPoint資料生成など、実務に直結する機能をワンストップで提供します。大企業での実績を積んだAI基盤がSaaSとして提供されることで、他企業も短期間・低コストで生成AIを本格導入できるようになるでしょう。","source":"テックニュース","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGXJqeYqZeQwpJkEcRfdMTEYoE_LdITv-kQM_kyVRV5xVxdty73hBPC5Nen3rOXAniQCsL4bzFvE7R1yHcWjBKapSBfH96TgnKDgGVthdC-choz59SQuVEDPUc5OHJGOpuA0CBuLBNokNrucuqXHU8Gaw==","impact":"medium","tags":["丸紅","生成AI","SaaS","企業向けAI"]},{"title":"Microsoft製品の脆弱性対策について（2026年6月）","summary":"2026年6月10日（日本時間）にMicrosoft製品に関するセキュリティ更新プログラム（月例）が公表されました。これらの脆弱性を悪用された場合、アプリケーションプログラムの異常終了や、攻撃者によるPCの制御など、様々な被害が発生する恐れがあるため、IPAは早急なセキュリティ更新プログラムの適用を呼びかけています。サイバーセキュリティは常にIT業界の重要なテーマであり、定期的な脆弱性対策は企業や個人の情報資産を守る上で不可欠な実用情報です。","source":"テックニュース","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHp9ghEyyqgTpDxZ-p0ZKWHqX-HIiO3HhdqHfXvdE6Vc8-1DBja50JJd3Rta1iDNRH-a30gnLMXbd97gaQ9KO3BJztdENFqehiUr7StagVLIaaPT7oRvvtEPptDFLR4VPQ2ptkk9nWxgTQivzvdChi8pTMGp7a0c7BaCg==","impact":"high","tags":["Microsoft","セキュリティ","脆弱性","IPA"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
