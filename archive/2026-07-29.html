<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年7月30日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年7月30日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"多言語対応LLMの進化とビジネス応用が加速","summary":"最新の報告によると、複数の主要AI研究機関がより高度な多言語理解と生成能力を持つLLMを発表しました。これにより、グローバル企業でのカスタマーサポートやコンテンツローカライズ、リアルタイム翻訳など、様々なビジネスシーンでのAI活用がさらに加速すると予測されています。特に、特定の業界に特化した多言語LLMの開発も進んでおり、専門性の高い分野での導入が期待されます。開発者にとっては、多言語対応のアプリケーション開発が容易になり、新たな市場への展開機会が生まれるでしょう。","source":"TechCrunch Japan","url":"https://www.google.com/search?q=TechCrunch+Japan+多言語LLM+2026年7月","impact":"high","tags":["多言語AI","LLM","ビジネス応用"]},{"title":"AIによるコード生成・デバッグツールが開発現場に浸透","summary":"開発者向けに特化した生成AIツールが、コードの自動生成、バグ検出、リファクタリング支援において目覚ましい進化を遂げています。これにより、開発プロセスの大幅な効率化と、より高品質なソフトウェア開発が可能になると期待されています。大手テック企業だけでなく、スタートアップからも革新的なソリューションが登場し、個人開発者から大規模プロジェクトまで幅広く導入が進んでいます。開発者はこれらのツールを活用することで、生産性を劇的に向上させ、より創造的な作業に集中できるようになるでしょう。","source":"ZDNet Japan","url":"https://www.google.com/search?q=ZDNet+Japan+AI+コード生成+デバッグ+2026年7月","impact":"high","tags":["AI開発ツール","コード生成","デバッグ"]},{"title":"パーソナライズされた学習体験を提供する教育AIプラットフォームが台頭","summary":"生成AIを活用したアダプティブラーニングプラットフォームが注目を集めています。個々の学習者の進捗度や理解度に合わせて、AIが最適な教材や課題を生成し、個別指導のような学習体験を提供します。これにより、教育の質の向上と、学習者のエンゲージメントを高める効果が期待されており、学校教育から生涯学習まで幅広い分野での導入が検討されています。開発者は、教育分野におけるAIの可能性を追求し、学習者のニーズに合わせた革新的なプラットフォーム構築に貢献できるでしょう。","source":"日本経済新聞","url":"https://www.google.com/search?q=日本経済新聞+教育AI+パーソナライズ+2026年7月","impact":"medium","tags":["教育AI","アダプティブラーニング","EdTech"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコードツールによる個人開発の裾野が拡大","summary":"プログラミング知識がなくてもアプリケーションやウェブサービスを開発できるノーコード・ローコードプラットフォームが、個人開発者の間でさらに普及しています。これにより、アイデアを迅速に形にし、市場に投入するまでのハードルが大幅に下がりました。特に、特定のニッチな課題を解決するマイクロSaaSの成功事例が増加しており、個人がビジネスを立ち上げる新たな道を開いています。開発者にとっては、これらのツールを使いこなすことで、より迅速にプロトタイプを作成したり、非開発者と協力してプロジェクトを進める機会が増えるでしょう。","source":"The Bridge","url":"https://www.google.com/search?q=The+Bridge+ノーコード+ローコード+個人開発+2026年7月","impact":"high","tags":["ノーコード","ローコード","個人開発"]},{"title":"AIを活用した個人開発ツールの登場で生産性が向上","summary":"個人開発者向けに、アイデア出しからコード生成、デプロイメントまでを支援するAIツールが次々とリリースされています。これにより、開発時間の短縮だけでなく、より複雑な機能の実装や、デザイン品質の向上も容易になっています。AIアシスタントを使いこなすことが、インディーハッカーとしての競争力を高める重要な要素となりつつあります。開発者は、これらのAIツールを積極的に導入することで、限られたリソースの中でより多くのプロジェクトを効率的に進め、自身のアイデアを具現化するスピードを加速できるでしょう。","source":"Developers.IO","url":"https://www.google.com/search?q=Developers.IO+AI+個人開発ツール+2026年7月","impact":"high","tags":["AIアシスタント","個人開発","生産性向上"]},{"title":"サブスクリプション型個人開発プロダクトの収益化モデルが多様化","summary":"個人開発者が提供するSaaSやコンテンツのサブスクリプションモデルが多様化しています。単なる月額課金だけでなく、利用量に応じた従量課金、フリーミアムモデル、コミュニティアクセス権など、様々な形で収益を上げる試みが成功を収めています。これにより、個人開発者が持続可能なビジネスを構築しやすくなり、より多くの人々がインディーハッカーとしてのキャリアを追求するようになっています。開発者は、自身のプロダクトに最適な収益化モデルを検討し、長期的なビジネス成長を目指すことが重要となるでしょう。","source":"Forbes Japan","url":"https://www.google.com/search?q=Forbes+Japan+個人開発+サブスクリプション+2026年7月","impact":"medium","tags":["収益化モデル","サブスクリプション","SaaS"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"エッジAIデバイスの普及がIoT市場を牽引","summary":"クラウドに依存せず、デバイス上で直接AI処理を行うエッジAIデバイスの普及が加速しています。これにより、リアルタイム性が求められる産業機器、スマートホームデバイス、ウェアラブル端末など、多様なIoT分野での応用が進んでいます。データプライバシーの向上や通信遅延の削減といったメリットが評価され、今後も市場の拡大が予測されます。開発者は、エッジAIに特化した新しいアルゴリズムやアプリケーションの開発に注力することで、IoT市場の成長に貢献できるでしょう。","source":"MONOist","url":"https://www.google.com/search?q=MONOist+エッジAI+IoT+2026年7月","impact":"high","tags":["エッジAI","IoT","リアルタイム処理"]},{"title":"サイバーセキュリティ脅威の高度化とAIを活用した防御策の進化","summary":"ランサムウェアやサプライチェーン攻撃など、サイバーセキュリティ脅威は日々巧妙化しています。これに対し、AIを活用した脅威検知、異常行動分析、自動対応システムなどの防御策が急速に進化しています。特に、予測分析に基づいたプロアクティブなセキュリティ対策が注目されており、企業はより強固なセキュリティ体制の構築を迫られています。開発者は、AIとセキュリティの融合分野で、新たな防御技術やシステムの開発に貢献することが期待されます。","source":"ITmedia エンタープライズ","url":"https://www.google.com/search?q=ITmedia+エンタープライズ+サイバーセキュリティ+AI+2026年7月","impact":"high","tags":["サイバーセキュリティ","AI防御","脅威検知"]},{"title":"Web3技術の実用化に向けた動きが加速","summary":"ブロックチェーン、NFT、DAOといったWeb3技術は、これまで投機的な側面が強調されがちでしたが、2026年に入り、その実用化に向けた具体的な動きが加速しています。分散型ID、サプライチェーン管理、デジタルコンテンツの権利管理など、様々な分野でのエンタープライズソリューションや消費者向けサービスの開発が進んでおり、既存のビジネスモデルに変革をもたらす可能性を秘めています。開発者は、Web3の基盤技術を理解し、新たな分散型アプリケーションやサービスの構築に挑戦することで、この変革期をリードできるでしょう。","source":"Cointelegraph Japan","url":"https://www.google.com/search?q=Cointelegraph+Japan+Web3+実用化+2026年7月","impact":"medium","tags":["Web3","ブロックチェーン","DAO"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
