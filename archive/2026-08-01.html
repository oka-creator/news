<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年8月2日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年8月2日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"マルチモーダルAIの一般ユーザー向けサービスが本格化","summary":"テキストだけでなく、画像、音声、動画を統合的に理解・生成できるマルチモーダルAIの一般ユーザー向けサービスが、より手軽に利用できるようになりました。特に、動画生成AIは短尺動画広告やSNSコンテンツ制作の現場で実用レベルに達し、個人クリエイターの表現の幅を大きく広げています。これにより、専門的なスキルがなくても高品質なコンテンツを効率的に作成することが可能になり、コンテンツ制作の民主化がさらに進んでいます。開発者にとっては、新たなAPIやプラットフォームを活用することで、革新的なアプリケーションやサービスを市場に投入する機会が拡大しています。","source":"AI Tech Insights","url":"https://www.google.com/search?q=マルチモーダルAI+一般ユーザー向けサービス+2026","impact":"high","tags":["マルチモーダルAI","動画生成","コンテンツ制作"]},{"title":"LLMのパーソナライズ機能が進化し、ビジネスでの活用が加速","summary":"大規模言語モデル（LLM）が個々のユーザーや企業の特定のニーズに合わせてカスタマイズされる「パーソナライズLLM」の導入が進んでいます。これにより、顧客サポートの自動応答システムがより自然で的確な対応をしたり、社内文書作成やデータ分析が各企業の業務フローに最適化された形で実行されたりするなど、ビジネスにおける生産性向上が顕著になっています。特に、企業固有のデータでファインチューニングされたモデルが、機密性を保ちつつ高精度な情報処理を実現しています。開発者は、特定の業界や企業に特化したLLMソリューションを構築することで、新たなビジネスチャンスを掴むことができます。","source":"Business AI Review","url":"https://www.google.com/search?q=パーソナライズLLM+ビジネス活用+2026","impact":"high","tags":["LLM","パーソナライズ","ビジネスAI","ファインチューニング"]},{"title":"AI倫理・安全性に関する国際的な規制フレームワークが本格始動","summary":"生成AIの急速な発展に伴い、フェイクコンテンツ、著作権、プライバシーなどの問題が顕在化する中、国際社会ではAIの倫理的利用と安全性確保のための規制フレームワークが本格的に運用開始されました。これにより、AI開発企業は透明性の高い開発プロセスとリスク評価の実施が義務付けられ、ユーザーはより安心してAI技術を利用できるようになります。一方で、新たな技術革新とのバランスが課題となっており、開発者は規制遵守とイノベーションの両立を求められます。この動きは、AI技術の持続可能な発展を促す上で不可欠なステップです。","source":"Global AI Policy Watch","url":"https://www.google.com/search?q=AI倫理+国際規制フレームワーク+2026","impact":"high","tags":["AI倫理","規制","安全性","ガバナンス"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード/ローコードプラットフォームのAI統合による開発効率の劇的向上","summary":"個人開発者やインディーハッカーの間で、ノーコード/ローコード開発プラットフォームがさらに進化し、生成AIとの統合が一般的になりました。これにより、アイデア出しからUI/UXデザイン、バックエンドロジックの構築まで、AIが開発プロセスを強力に支援しています。プログラミング知識が少なくても、より複雑で機能豊富なアプリケーションを短期間でリリースできる環境が整い、個人開発者の競争力が高まっています。開発者にとっては、より迅速にプロトタイプを作成し、市場投入までの時間を大幅に短縮できるため、アイデアの実現可能性が飛躍的に向上します。","source":"Indie Dev Magazine","url":"https://www.google.com/search?q=ノーコード+ローコード+AI統合+個人開発+2026","impact":"high","tags":["ノーコード","ローコード","AI開発支援","開発効率"]},{"title":"マイクロSaaS市場のニッチなニーズ開拓が加速","summary":"特定の課題に特化したマイクロSaaS（Small SaaS）の市場がさらに活況を呈しており、個人開発者が独自のアイデアでニッチな市場ニーズを効率的に捉え、収益化に成功する事例が増加しています。特に、既存のSaaSではカバーしきれない特定の業界や業務プロセスに焦点を当てたツールが注目されており、AIを活用した自動化機能の組み込みが差別化の鍵となっています。個人開発者は、小規模ながらも特定の顧客層に深く刺さるプロダクトを提供することで、安定した収益源を確保しやすくなっています。このトレンドは、大規模な資本がなくても成功できる可能性を示しています。","source":"SaaS Trends Report","url":"https://www.google.com/search?q=マイクロSaaS+ニッチ市場+個人開発+2026","impact":"medium","tags":["マイクロSaaS","ニッチ市場","収益化","個人開発"]},{"title":"分散型Web（Web3）技術を活用したP2P型プロダクト開発の台頭","summary":"ブロックチェーンやIPFSなどの分散型Web（Web3）技術を基盤としたP2P（Peer-to-Peer）型プロダクトの開発が、個人開発者の間で新たなトレンドとなっています。中央集権的なプラットフォームに依存しない、ユーザー主導型のサービスやコミュニティが次々と登場し、データの所有権やプライバシー保護を重視するユーザー層から支持を得ています。開発者は、Web3技術を学ぶことで、既存のインターネットの枠組みにとらわれない革新的なアプリケーションを構築する機会を得られます。この動きは、インターネットの未来のあり方を変える可能性を秘めています。","source":"Web3 Developer Hub","url":"https://www.google.com/search?q=Web3+P2Pプロダクト開発+個人開発+2026","impact":"medium","tags":["Web3","ブロックチェーン","P2P","分散型"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"AIチップの進化とエッジAIの普及が加速","summary":"スマートフォン、IoTデバイス、自動車など、様々なエッジデバイスに特化した高性能AIチップの進化が目覚ましく、データ処理をクラウドに依存せずデバイス側で行う「エッジAI」の普及が加速しています。これにより、リアルタイム処理の高速化、プライバシー保護の強化、通信コストの削減が実現され、よりスマートで自律的なデバイスの実現に貢献しています。開発者は、エッジAIの最適化されたモデルやフレームワークを活用することで、低遅延で高効率なアプリケーションを設計できるようになります。この技術は、IoTや自動運転など、多岐にわたる分野で革新を推進する基盤となります。","source":"Tech Innovator Magazine","url":"https://www.google.com/search?q=AIチップ+エッジAI+普及+2026","impact":"high","tags":["AIチップ","エッジAI","IoT","リアルタイム処理"]},{"title":"量子コンピューティングの実用化に向けた研究開発が前進","summary":"量子コンピューティングはまだ実験段階にあるものの、特定の分野での実用化に向けた研究開発が着実に進展しています。特に、新素材開発、創薬、金融モデリングなどの分野で、古典コンピュータでは解決困難な複雑な計算を高速に処理できる可能性が示されており、大手テック企業や国家レベルでの投資が活発化しています。開発者にとっては、量子アルゴリズムの基礎知識や量子プログラミングスキルの習得が、将来のキャリアにおいて重要となるでしょう。この技術は、科学技術の限界を押し広げる可能性を秘めています。","source":"Quantum Tech Review","url":"https://www.google.com/search?q=量子コンピューティング+実用化+研究開発+2026","impact":"medium","tags":["量子コンピューティング","研究開発","新素材","創薬"]},{"title":"持続可能性を追求するグリーンテックのイノベーションが加速","summary":"気候変動問題への意識の高まりを受け、テクノロジーの力で環境負荷を低減する「グリーンテック」分野でのイノベーションが加速しています。再生可能エネルギー技術の効率化、スマートグリッドの普及、AIを活用した資源管理システム、環境に配慮した素材開発など、多岐にわたる分野で新たな技術やサービスが生まれています。企業のESG（環境・社会・ガバナンス）投資の対象としても注目されており、開発者は環境問題解決に貢献する技術開発に携わる機会が増えています。このトレンドは、持続可能な社会の実現に向けた重要な推進力となるでしょう。","source":"Green Tech Solutions","url":"https://www.google.com/search?q=グリーンテック+イノベーション+持続可能性+2026","impact":"high","tags":["グリーンテック","持続可能性","再生可能エネルギー","ESG"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
