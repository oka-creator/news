<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年9月30日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年9月30日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"OpenAIが「DevDay 2026」で常時稼働AIエージェント「dots」と新モデル「GPT-6.1 Sol」などを発表","summary":"米OpenAIは年次開発者会議「DevDay 2026」で、24時間稼働するAIエージェント「dots」と新モデル「GPT-6.1 Sol」を発表しました。「dots」は4000以上のアプリと連携し、ChatGPTやSlackなどから指示可能で、ユーザーの目標達成を継続的に支援します。「GPT-6.1 Sol」は上位モデル「GPT-6 Astra」に迫る性能を約5分の1のコストで提供し、エージェント型コーディングや専門業務の性能が強化されました。これにより、企業はコストを抑えつつAIエージェントの活用を拡大でき、開発者はより高度で効率的なAIソリューションを構築できるようになるでしょう。この発表は、AIの日常業務への浸透と開発コストの最適化を加速させる重要な一歩です。","source":"OpenAI","url":"https://note.com/loading_ai/n/n258c707d8856","impact":"high","tags":["AIエージェント","LLM","OpenAI","GPT-6.1 Sol"]},{"title":"TypeSafe AIがハルシネーション排除と最大200倍高速化を実現する新AIモデル「Jev」を発表","summary":"米国AIスタートアップのTypeSafe AIは、自動化に特化した新AIモデル「Jev」の早期アクセス提供を開始しました。このモデルは、従来のLLMと比較して最大200倍の高速化を実現し、ハルシネーションを原理的に排除できる点が最大の特徴です。出力可能な構造が固定されているため、プログラム側でのパースやバリデーションが不要となり、予期せぬ動作のリスクを大幅に低減します。ロボットアーム制御などへの応用事例も報告されており、開発者は信頼性の高い自動化システムをより効率的に構築できるようになるでしょう。これは、AIの信頼性と実用性を大きく向上させる画期的な進展です。","source":"TypeSafe AI","url":"https://atmarkit.itmedia.co.jp/ait/articles/2609/24/news082.html","impact":"high","tags":["AIモデル","ハルシネーション対策","高速化","自動化"]},{"title":"Anthropic社の最新モデル「Claude Opus 5.5」が提供開始、自治体AI「zevo」にも導入","summary":"Anthropic社の大規模言語モデル「Claude Opus 5.5」が、AI APIゲートウェイ「FastMetal」を通じて提供開始されました。この最新モデルは、前世代のOpus 5と比較してコーディング能力や知識労働タスクの性能が大きく向上し、さらに利用コストが約4割低減されています。シフトプラスとNTTドコモビジネスが共同開発した自治体向け生成AIシステム「自治体AI zevo」にも「Claude Opus 5.5（拡張思考モード）」がLGWAN環境で導入されました。これにより、自治体職員は複雑な調査・分析・文書作成を効率化でき、開発者はより高性能かつ低コストなLLMを多様なシステムに組み込むことが可能になります。","source":"Anthropic","url":"https://prtimes.jp/main/html/rd/p/000000021.000100414.html","impact":"medium","tags":["Claude Opus","LLM","自治体AI","コスト削減"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"個人開発アプリ「カロリ貯金」と「Keepy」が正式リリース","summary":"PR TIMESのプレスリリースによると、産業医が個人開発したダイエットアプリ「カロリ貯金」がiOS・Androidで正式リリースされました。このアプリは「食べたもの」ではなく「できたこと」を記録するユニークな行動変容アプローチが特徴です。また、別の個人開発者からは、サブスクリプションサービスや銀行口座などの契約先情報をまとめて残せるアプリ「Keepy」がiPadにも対応したと発表されました。これらの事例は、個人開発が特定のニーズに応える実用的なツールを生み出し、社会的な課題解決に貢献できる可能性を示しており、インディーハッカーにとって大きなモチベーションとなるでしょう。","source":"PR TIMES","url":"https://prtimes.jp/main/html/searchrlp/company_id/132960","impact":"low","tags":["個人開発","アプリリリース","行動変容","情報管理"]},{"title":"NVIDIA「DLSS 5」のニューラルレンダリングを個人開発者が再実装「OpenDLSS-NR」公開、ブラウザ動作も可能に","summary":"開発者のMAAN氏が、NVIDIAのDLSS 5で利用されるニューラルレンダリングのネットワークを再実装した「OpenDLSS-NR」を公開しました。この実装は、Windows上のGeForce RTX 4070 SUPERで動作するVulkan版に加え、WebGPUを使ってブラウザー上で実行する版も提供されています。これにより、特定のNVIDIA製GPUがなくてもAIによる超解像や画像再構成といった最先端のグラフィック処理技術を試すことが可能になります。この取り組みは、技術の民主化を促進し、より多くの個人開発者や研究者が最先端技術にアクセスし、新たな応用を模索する機会を提供します。","source":"MAAN氏 (xenospectrum.com)","url":"https://xenospectrum.com/articles/2026/09/24/nvidia-dlss5-reimplementation-opendlss-nr-browser-webgpu/","impact":"medium","tags":["DLSS","ニューラルレンダリング","WebGPU","オープンソース"]},{"title":"「AI一人開発で『小さな完成』を目指す」2026年のインディーハッカー新戦術が提唱される","summary":"AIコーディングツールの普及により、個人開発者が数日で機能実装を可能にする「超人的な生産性」を得ていると指摘する記事が公開されました。現在のAI市場では、投資家が「大きな勝者」ではなく「小さな完成」を積み重ねる戦略が重要であると提唱されています。これは、自分の抱える問題を解決するツールを開発し、それを継続的に利用する「Building for an audience of one」というアプローチが持続可能な開発サイクルを生み出すという考え方です。インディーハッカーは、AIの力を活用してニッチな課題を解決する実用的なプロダクトを迅速に市場に投入することが推奨され、開発の方向性を示す重要な指針となります。","source":"albee_inc (note.com)","url":"https://note.com/albee_inc/n/n2b2496a84d43","impact":"high","tags":["AI開発","インディーハッカー","プロダクト戦略","生産性向上"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"NTTドコモビジネスが「テクノロジーロードマップ2026」を公開、AI-Centric ICTプラットフォームを推進","summary":"NTTドコモビジネスは、2026年から2035年までの技術進化の方向性と未来社会像を示す「テクノロジーロードマップ2026」を公開しました。短期（2026年〜2027年）の取り組みとして、身の回りの業務や困りごとをAIと通信で支援し始めることを掲げ、「AI-Centric ICTプラットフォーム®」の推進に注力します。このロードマップは、技術導入を目的とせず、人の暮らしや仕事をより良くするという考え方に基づいています。企業はAIを活用して生産性を抜本的に改善し、競争力を強化するための具体的な指針を得ることができ、開発者はこのプラットフォーム上で新たなサービスを構築する機会が広がります。","source":"NTTドコモビジネス","url":"https://www.docomobusiness.com/press/2026/0928_01.html","impact":"medium","tags":["NTTドコモビジネス","テクノロジーロードマップ","AI-Centric","ICTプラットフォーム"]},{"title":"デル・テクノロジーズが企業のAI・生成AI活用とセキュリティリスクに関する調査結果を発表","summary":"デル・テクノロジーズが実施した調査によると、日本企業の95.7%が生成AIを利用している一方で、84.7%がAI普及に伴うセキュリティリスクの高まりを認識しています。過去1年間で78.5%の企業がAI関連のセキュリティ問題を経験しており、93.4%がAI活用が進むほどエンドポイント対策の重要性が高まると回答しました。特にOS未満（BIOS/ファームウェア）領域の対策を重要視する企業が69.3%に上っています。この結果は、企業におけるAI導入にはセキュリティ対策の強化が喫緊の課題であることを浮き彫りにしており、開発者はAIシステム設計時にセキュリティを最優先事項として考慮する必要があることを示唆しています。","source":"デル・テクノロジーズ","url":"https://prtimes.jp/main/html/rd/p/000000009.000090264.html","impact":"high","tags":["AIセキュリティ","生成AI","サイバーリスク","エンドポイント対策"]},{"title":"CERNが巨大加速器の制御基盤OSを「CentOS 7」から「Debian 13」に全面移行","summary":"欧州原子核研究機構（CERN）は、世界最大級の科学研究施設である巨大加速器の制御基盤OSを、長年使用してきたCentOS 7からDebian 13へ全面移行することを発表しました。CentOS 7のサポート終了が迫る中、CERNはコミュニティ主導のOSであるDebianを選択することで、長期的な安定性と柔軟な運用を目指します。この大規模なOS移行は、エンタープライズ分野におけるLinuxディストリビューションの選択肢の変化と、オープンソースコミュニティへの信頼性の高まりを示す重要な事例です。他の大規模ITインフラを運用する組織や開発者にとっても、OS選定における重要な参考情報となるでしょう。","source":"CERN (atmarkit.itmedia.co.jp)","url":"https://atmarkit.itmedia.co.jp/ait/articles/2609/12/news043.html","impact":"medium","tags":["CERN","OS移行","Debian","Linux"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
