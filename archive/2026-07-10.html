<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年7月11日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

ステムを開発」","summary":"大成建設とファナックは、AIを活用した混載品パレットの自動ピッキングシステムを共同開発しました。このシステムは、AIによる画像処理と三次元認識、製品識別情報の自動照合を組み合わせることで、従来必要だった製品情報の事前データ登録作業を不要にし、高い柔軟性と即時性を実現します。これにより、倉庫や工場における出荷作業の無人化と出荷ミス防止、保管効率の大幅な向上が期待されます。開発者にとっては、AIとロボティクスを組み合わせた産業自動化ソリューションの新たな応用例として、画像認識やロボット制御技術の進化に注目が集まります。","source":"大成建設株式会社","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGnpKM8NpXnRrVFaAe7rBGJctWBaw41WrZOU25gKY9MMB39WEqyHSsZRSXe53d1Mt6zmMD4VbCs6OLHrOVq5lCj2swC9Bx9YqPWvEfXizt96akVVQxOC5754mBuyd0uTEqlQLs0nvKGep6Ukxmgx2UX1dGdV3Wr","impact":"medium","tags":["AI","ロボティクス","自動化","物流"]},{"title":"「楽天モバイルが商用Open RAN省電力化で世界初のTM Forum自律型ネットワーク『レベル4』を取得」","summary":"楽天モバイルの自律型RAN省電力化ソリューションが、国際的な通信業界団体TM Forumが定める自律型ネットワークの評価基準において「レベル4」の認定を商用Open RANネットワークとして世界で初めて取得しました。これは、AIがネットワーク自身を運用最適化する時代への一歩であり、ネットワークが想定外の状況にも自律的に対応できることを意味します。この成果は、通信業界におけるAIと自動化の進展を示す重要なマイルストーンです。開発者にとっては、AIを活用したネットワーク管理や最適化技術の重要性が増し、自律型システムの設計や実装に関する新たな知見が求められるようになります。","source":"楽天モバイル","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHgkKI9OzBPND7j9dNOoE-thgiNa29FaXsmmGCTVZFUDFgy91k-gps8k_jR1eNwYUR3PetS24OQCMddS7XEeBc-KpVRijvpCH0KmUaMICDmwgQx7KuQPth2a464sCw4z8QWh3_IanJQq_urnUuG0QfVA922FZvenj_ToFj37dyEva4OhIjv","impact":"medium","tags":["Open RAN","自律型ネットワーク","AI","省電力化"]},{"title":"「データセンターの持続可能性に関する最新調査レポートがIDTechExからリリース」","summary":"IDTechExは、「データセンターの持続可能性 2026-2036年」と題した調査レポートを発行しました。このレポートは、グリーンデータセンターの技術、主要プレイヤー、市場動向を解説し、スコープ2（再生可能エネルギー発電とエネルギー効率化）およびスコープ3（カーボンクレジット、グリーンコンクリート、脱炭素型IT機器製造）排出量削減に関するソリューションを400社以上取り上げています。2036年までの市場予測も含まれており、データセンターの脱炭素化技術や投資動向が詳細に分析されています。開発者にとっては、持続可能なデータセンター技術への理解が深まり、省エネ型インフラやグリーンITソリューション開発の需要が高まることを示唆しています。","source":"IDTechEx","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGes4aSEm8hkqqbcTdF4E-MQWWfPwry55QEq5zqJ3pFBylwNZSvsBxQ5pxhg0LCo54wGP9d4Oo1zNzwWhPNkHsn6Zus0rqKs30CLlCFK1n1yi_qFzBVwCA21cFuQKgjJ3TOtr0OST7H-Wpx_KGHwApD5vR1nPBj","impact":"low","tags":["データセンター","持続可能性","グリーンIT","脱炭素"]}]}];

      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
