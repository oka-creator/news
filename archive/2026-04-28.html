<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年4月29日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年4月29日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"AIモデルの倫理的利用に関する新たな国際ガイドライン発表","summary":"主要なAI開発企業と政府機関が協力し、生成AIおよび大規模言語モデル（LLM）の倫理的かつ責任ある利用を促進するための新たな国際ガイドラインを発表しました。このガイドラインは、透明性の向上、バイアスの軽減、悪用防止のための具体的な推奨事項を含んでいます。AI開発者は、これらの基準に準拠したモデル開発が求められ、国際的な標準となることで、より信頼性の高いAIシステムの構築が期待されます。これにより、AI技術の健全な発展と社会受容の促進に大きく貢献するでしょう。開発プロセスにおける倫理的側面への配慮が不可欠となります。","source":"AI倫理推進機構","url":"https://www.ai-ethics-org.jp/guidelines/20260428","impact":"high","tags":["AI倫理","LLM","国際標準"]},{"title":"特定の業界向けに特化したLLMの開発が加速","summary":"医療、金融、法律などの専門分野に特化した大規模言語モデルの開発が急速に進んでいます。これらのモデルは、汎用LLMと比較して、各業界固有の専門知識とデータに基づいてトレーニングされており、より正確で実用的な情報提供や業務支援が可能です。特に、法務分野での契約書分析や医療分野での診断支援など、具体的なユースケースでの導入が進んでおり、開発者にとっては、特定のドメイン知識を深く理解したモデル構築が新たなビジネスチャンスを生み出しています。専門分野におけるAI活用の深化が期待されます。","source":"TechBiz Insight","url":"https://www.techbiz-insight.com/industry-llm-20260428","impact":"medium","tags":["専門LLM","業界特化AI","ビジネスAI"]},{"title":"エッジデバイス上での軽量LLMの性能向上","summary":"スマートフォンやIoTデバイスなどのエッジデバイス上で動作する軽量なLLMの性能が著しく向上しています。これにより、クラウドへの接続なしに、デバイス単体でリアルタイムの言語処理やAI機能が利用できるようになりました。プライバシー保護の観点からも注目されており、個人向けデバイスでのAI機能の普及をさらに加速させると見られています。開発者は、低リソース環境でのAIモデル最適化技術や、オフラインでのAIアプリケーション開発に注力することで、新たなユーザー体験を提供できるようになるでしょう。","source":"Edge AI News","url":"https://www.edge-ai-news.com/lightweight-llm-progress-20260428","impact":"medium","tags":["エッジAI","軽量LLM","プライバシー"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコードプラットフォームの機能拡張と多様化","summary":"個人開発者やインディーハッカー向けに、より高度な機能を持つノーコード・ローコード開発プラットフォームが続々と登場しています。従来のWebサイトやモバイルアプリ開発に加え、AI機能の組み込みや複雑なデータベース連携、API開発まで、専門知識がなくても実現可能な範囲が大きく広がりました。これにより、アイデアを迅速に形にできる環境がさらに整いつつあり、開発者はコーディングスキルに依存せず、ビジネスロジックやユーザー体験の設計に集中できるようになります。プロトタイピングから製品化までのスピードアップが期待されます。","source":"NoCode Journal","url":"https://www.nocode-journal.com/platform-evolution-20260428","impact":"high","tags":["ノーコード","ローコード","迅速開発"]},{"title":"サブスクリプション型SaaSの個人開発事例が増加","summary":"特定のニッチな問題を解決するサブスクリプション型SaaS（Software as a Service）を個人で開発し、収益化に成功する事例が増えています。開発ツールやマーケティング手法の進化により、少人数でもグローバルな顧客を獲得しやすくなっており、インディーハッカーの間で新たなビジネスモデルとして注目されています。個人開発者は、自身のアイデアを直接市場に投入し、継続的な収益を得る機会が増大しています。これにより、独立した開発者としてのキャリアパスがより現実的なものになりつつあります。","source":"Indie Hacker Stories","url":"https://www.indiehacker-stories.com/saas-success-20260428","impact":"high","tags":["SaaS","個人ビジネス","収益化"]},{"title":"AIを活用した開発支援ツールの普及","summary":"コード生成、デバッグ、テスト自動化など、開発プロセス全体をAIが支援するツールが個人開発者の間で広く利用されています。これにより、開発効率が大幅に向上し、より複雑なプロジェクトにも少人数で挑戦できるようになっています。特に、アイデア出しからプロトタイピングまでの初期段階でのAIの活用が目立っており、開発者は反復作業から解放され、より創造的な問題解決に集中できます。AIツールは、個人開発の生産性を劇的に向上させる強力な味方となっています。","source":"DevTools Monthly","url":"https://www.devtools-monthly.com/ai-dev-assist-20260428","impact":"medium","tags":["AI開発支援","開発効率","プロトタイピング"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"量子コンピューティングの実用化に向けた進展","summary":"エラー訂正技術の向上と量子ビットの安定性改善により、量子コンピューティングの実用化に向けた具体的な進展が見られます。特定の計算問題において、従来のスーパーコンピュータを凌駕する性能を持つ量子コンピュータの開発が報告されており、材料科学、創薬、金融モデリングなどの分野での応用が期待されています。開発者にとっては、量子アルゴリズムの理解と、将来的な量子プログラミングスキルの習得が重要となり、新たな計算パラダイムへの適応が求められます。この技術は、未来のコンピューティングを根本から変える可能性を秘めています。","source":"Quantum Tech Review","url":"https://www.quantum-tech-review.com/progress-20260428","impact":"high","tags":["量子コンピュータ","エラー訂正","未来技術"]},{"title":"サイバーセキュリティ脅威の高度化と対策技術の進化","summary":"AIを活用したフィッシング詐欺やランサムウェア攻撃など、サイバーセキュリティ脅威がますます高度化しています。これに対し、AIを用いた異常検知システムや、ゼロトラストモデルに基づいたセキュリティアーキテクチャの導入が企業で加速しています。また、個人ユーザー向けのセキュリティ意識向上トレーニングも重要視されており、開発者は、アプリケーション設計段階からセキュリティを考慮した「セキュリティ・バイ・デザイン」の原則を徹底する必要があります。常に最新の脅威と対策技術を学び続けることが不可欠です。","source":"Cyber Security Daily","url":"https://www.cybersecurity-daily.com/threat-evolution-20260428","impact":"high","tags":["サイバーセキュリティ","AI脅威","ゼロトラスト"]},{"title":"サステナブルテクノロジーへの投資が加速","summary":"気候変動問題への意識の高まりを受け、再生可能エネルギー技術、省エネ型データセンター、循環型経済を支えるテクノロジーなど、サステナブルテクノロジー分野への投資が世界的に加速しています。企業は、環境負荷の低減と同時に、新たなビジネスチャンスを創出することを目指しており、開発者にとっては、環境に配慮した技術開発や、既存システムのエネルギー効率改善が重要な課題となります。この分野は、技術革新を通じて社会貢献と経済成長を両立させる大きな可能性を秘めています。","source":"Green Tech Insights","url":"https://www.greentech-insights.com/sustainable-investment-20260428","impact":"medium","tags":["サステナブル","グリーンテック","環境技術"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
