<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年5月15日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

6VHPpo-0jsfqczfYFZSr4r11IHk7kn8PXLFeFlRlU3LtEHFGZzWl21xZJZw-_B_FMCqMbWsfEjeg==","impact":"high","tags":["LLM市場","垂直統合","業界特化AI"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"AIを活用したSaaS製品の高速開発：ソロ開発者の新たな武器","summary":"2026年において、AIツールはソロ開発者がSaaS製品を以前よりもはるかに速く構築・リリースするための強力な武器となっています。AIは、コード生成、UIデザイン、テスト、デバッグ、マーケティングコンテンツ作成といった多くのタスクを自動化し、これまでチーム全体が必要だった作業を一人でこなせるようにします。これにより、個人開発者はアイデアを迅速に形にし、市場投入までの時間を大幅に短縮できます。AIの活用は、個人開発の生産性と競争力を劇的に向上させるでしょう。","source":"Vertex AI Search (Google Cloud)","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEmpH27kbJl8oSCKAE86U22wlHWXPhbZM8T3BIaUajFZHJ6nGLPifS9RyS03d5WfWi8mAxvYJI1mql5xWQqjYe3M0ukZjhjgps4vxwGs3pOcSSV3x7deoOAXlUXZt20Qn5UITAQAqC45awcBFEunfZh3d4ABzZQPZSXMRBKokcOlgktC6Cfeo4z","impact":"high","tags":["ソロ開発","SaaS","AIツール"]},{"title":"個人開発プロダクトで月50万円超の収益達成事例とAIフラッシュカードアプリの成功","summary":"2026年5月には、ある個人開発者がプロダクトからの収益合計が月50万円を突破し、特にiOSアプリの収益が好調であることが報告されました。ショート動画マーケティングにおいては、ネイティブアプリが非常に効果的であると強調されています。また、AIフラッシュカードアプリ「Jungle」が月1500万円の収益を上げている事例も紹介されており、生成AI時代の学習アプリの可能性を示しています。これらの事例は、個人開発者がAIと効果的なマーケティング戦略を組み合わせることで、大きな収益を上げられることを示唆しています。","source":"Vertex AI Search (Google Cloud)","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEZi0k3OeZjtClFJA3CCzEtSnz6hQxGuig3cw1e6bwKoBtApPi1bcgxpHXP7F5_QrDa4_EWQEgo2Z-aOfUmJJnkIOtnzDYazB5x5N6JtRoEXJgUn5ERqAlXXjYr","impact":"high","tags":["個人開発","収益化","AIアプリ"]},{"title":"インディーハッカーの「流通のパラドックス」：製品開発と顧客獲得のバランス","summary":"2026年現在、インディーハッカーは「流通のパラドックス」に直面しています。これは、製品開発に多くの時間を費やす一方で、顧客獲得のための自動化に十分な時間を割いていないという問題です。競合他社がAIエージェントを活用して24時間体制でリードを獲得している中、このギャップは製品の成功を妨げる要因となる可能性があります。開発者にとっては、優れた製品を作るだけでなく、顧客獲得戦略にもAIを活用し、効率的なマーケティングと販売チャネルを構築することの重要性が増しています。","source":"Vertex AI Search (Google Cloud)","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGmJl6FH1ymFGSFKBTubxr0zWiew561txUHXft_cUZ9hve9kGAaYR1UBPYOUCRjieLXXkbNxjmqhg3WylEEgSIPhtdwNMifVwRuxJs_wOZ-fphfkJgDK-MtSG5hqKeLBWnkklC7QIKxQyUQ8hocxpemwmHUe0F5_UkHR0BIZGWnkcmYxVmAFKOCJphaWlOUP3PoHYoIgCf0wkDasR89rX3BnfsVNUam6DMP4-z9obzl6f8qxTCyg2F2Yc25ybfvcSDiCH-D","impact":"medium","tags":["インディーハッカー","顧客獲得","マーケティング自動化"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Googleが「Googlebook」を発表し、AIファーストPC時代が本格化","summary":"Googleは、Chromebook時代を事実上終焉させ、中核に「Gemini Intelligence」を据えた全く新しいノートPCカテゴリー「Googlebook」を発表しました。これは、AppleのMacBook NeoやMicrosoftのCopilot+ PCとの間で「AIファーストPC」をめぐる三つ巴の競争を激化させるものです。Googlebookは、AndroidとChromeOSを統合した新プラットフォームで動作し、「Magic Pointer」や「Create your Widget」といったAIを活用した革新的な機能を提供します。この動きは、今後のPC開発がAI機能を深く統合する方向へ進むことを示しており、開発者にとっては新たなプラットフォームとAI機能への対応が求められるでしょう。","source":"Vertex AI Search (Google Cloud)","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGPQ85guO0DXaN2PsaIKRePil6E0-ol36hH7NDJMvQD5LieWDsaX_RN23ICZfZAKppU6EUS_kC9mkzlMe0GeC8VW_L8fGxzaiC48pg2bqqdKzlPXnqLqQ8x_SxPkenffrQtMqKfKDPcXAz8","impact":"high","tags":["Googlebook","AIファーストPC","Gemini"]},{"title":"日本の科学者が量子「W状態」の即時検出に成功、量子技術に革命の可能性","summary":"日本の科学者たちが、とらえどころのない量子「W状態」を瞬時に検出する新しい方法を開発しました。この画期的な進歩は、量子通信、量子テレポーテーション、そして強力な新しい量子コンピューティングシステムの高速化に大きく貢献する可能性があります。W状態は量子情報処理において重要な役割を果たすため、その即時検出は量子技術の実用化を大きく前進させるでしょう。この技術は、将来のセキュアな通信や超高速計算の基盤を築く上で極めて重要です。","source":"Vertex AI Search (Google Cloud)","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGBhPQaAretc1WuF1lC8JYjRE2nPdYIuIUPXSssPlS2eqgpU-cJliYBDlEWyA6HBdbyjUtwajKRrtrPKMLtwcgXISevokV-M-vdxf42SIMEbY0bBl_yjzC3J5XGysOlszKnl6XxqXW3w1Zq5FAq5-v-ugnJ1_huYK1h","impact":"high","tags":["量子技術","W状態","量子コンピューティング"]},{"title":"AI資本市場が沸騰：Anthropicの評価額が9000億ドル超に、CiscoのAI受注も急増","summary":"AI資本市場は著しい過熱を見せています。Anthropicは9000億ドルを超える評価額で300億ドル規模の新規資金調達を交渉中と報じられ、SoftBank GroupはOpenAI関連で約460億ドル（約6.9兆円）の含み益を計上しました。さらに、ネットワーク機器大手Ciscoは、AIインフラ関連の通期受注見通しを当初の50億ドルから90億ドルへ大幅に引き上げ、Cerebras Systemsは時価総額564億ドルで2026年最大の米テックIPOを完了しました。これらの動きは、AIインフラ分野への大規模な投資と成長が続いていることを示しており、AI関連技術開発への資金流入が加速していることを意味します。","source":"Vertex AI Search (Google Cloud)","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEmUV9_JQGzHRxvUnLdzwiMbPNA2z_dt_Ga30KcZIswxEqMWs4nXRusMRuFtqaPoiIP7ubWOk4st0-kwK8Sg_SrXLxHm7aJb_lTDumalpyaOVEL5QRMfzxU-psDy4FdLfF553FP5YoUhQ==","impact":"high","tags":["AI投資","資本市場","AIインフラ"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
