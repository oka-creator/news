<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年9月10日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

"icon":"rocket","articles":[{"title":"AI駆動開発でアプリ開発期間が大幅短縮、1年かかるプロジェクトが1週間で完了する事例も","summary":"2026年のシステム開発現場では、AIによる超高速開発が現実のものとなっています。米Anthropic社の「Claude Fable 5」などの高度なAIモデルを活用することで、従来エンジニア3人で1年を要したアプリ開発が、わずか1週間（実働16時間）で完了した事例が報じられました。これは、AIが開発プロセス全体を効率化し、大幅な時間短縮を可能にすることを示しています。個人開発者にとっては、限られたリソースで大規模なプロジェクトを実現する強力なツールとなり、アイデアを迅速に形にする機会が劇的に増えるでしょう。","source":"Anthropic社 (Claude Fable 5)","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHPRyX05Y0KSR9wrF0-AkJfrcABYBcL7rczK7okiUqcdWyX3bz4RI5MrBIjw8bloxS1V8LAQguzQt3aPiXCIQW9WZGHeahcHM5FTcvuY6hO04vFcwW4JmUWLrU53g8VUHev7csyqiA=","impact":"high","tags":["AI開発","高速開発","生産性向上"]},{"title":"日本語学習向けリアルタイム字幕ツールが個人開発で登場、動画視聴の利便性を向上","summary":"日本語学習者向けに、ブラウザ上で動作するリアルタイム字幕ツールが個人開発の事例として注目を集めています。このツールは、音声から字幕、さらに翻訳までを即座に表示することで、動画視聴の利便性を大幅に高めます。聞き取れないストレスを解消し、学習効率を向上させる実用的なAI活用法として、今後の個人開発のヒントとなるでしょう。開発者は、特定のニッチなニーズに焦点を当て、AI技術を応用することで、ユーザーに価値を提供する新しいサービスを創出できることを示しています。","source":"個人開発プロジェクト","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFpbIgtCCCU2l_ASgnlH3LTDbH47W-MvU4DBUjl6YdBDufeiIz7YmKDjhlFt3vU9DQEuzfxwyilgj77cgMUHIB7g-IAoRHNhsewkpo4kr0JARBi8PSffs24A6NNg5GT4pI0w82exGI=","impact":"medium","tags":["日本語学習","リアルタイム字幕","AI活用"]},{"title":"Go言語の実践的な設計とテスト技法を解説する新刊が発売、個人開発者のコード品質向上に貢献","summary":"Go言語の哲学に基づいた実践的な設計とテストの技法を解説した新刊『現場のGoプログラミング 実プロジェクトで役立つイディオムとテスト』が、2026年9月9日に発売されました。クラウドネイティブ開発やマイクロサービスの普及に伴いGo言語の需要が高まる中、本書はGoの特性を活かした高品質でテストしやすいコードの書き方を学びたい個人開発者に向けられています。この書籍は、個人開発者が自身のコード品質を向上させ、保守性の高いアプリケーションを構築するための貴重な知識を提供し、プロフェッショナルな開発スキル習得に貢献するでしょう。","source":"『現場のGoプログラミング』","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHLsXOwP1kk1Kx4M4jxG_htHnqQ5m7s1nn5PZksIOuerk_4LYpMtZyqC2tzkaV9nen2Gi10WWWIXHBuq5p0zbXf6nzkQ3JBBSPAe9woktnnk6s8v7enf1ZILitDzHviGlgdAiknswDZTOE98nR5N3YHDEWxe_I=","impact":"low","tags":["Go言語","ソフトウェア設計","テスト技法"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"サウジアラビアでテックイベント「LEAP 2026」開催、AI・クラウド分野に150億ドル超の投資発表","summary":"サウジアラビアのリヤド近郊で8月31日から9月3日にかけて、テックイベント「LEAP 2026」が開催され、20万人超が来場しました。このイベントでは、AI、クラウドコンピューティング、サイバーセキュリティなどをテーマに、総額150億ドル超の投資、事業立ち上げ、提携が発表されました。特にアマゾン・ウェブ・サービス（AWS）は、2026年12月にサウジアラビア初のクラウドサービス提供拠点の開設を発表し、同国のAIエコシステム発展に大きく貢献する見込みです。この大規模な投資は、中東地域が世界のテックハブとしての地位を確立しつつあることを示しており、開発者にとっては新たな市場機会とインフラの整備が進むことを意味します。","source":"LEAP 2026","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHUeB0zUldSyF648KaXGT5ZjOSAHpwJn9FUSs5isI4kYE7hy3GNQvdSJnwP-rB1xQmlqzJoltPbfNQcBuiTt5hpJgzIDc8ppm8xwUj8KU_YciefC9vIGZ3M6HO4B96nkyXz7O7sOaAoQk-OmBWIL5y5OR_WHF2ioIU=","impact":"high","tags":["中東テック","AI投資","クラウドインフラ"]},{"title":"SamsungとASML、DRAM量産への高NA EUV導入を2028年までに「業界初」で実現へ","summary":"Samsung ElectronicsとASMLは2026年9月8日、高開口数（NA）極端紫外線（EUV）露光および先進半導体製造技術に関する戦略的協業を拡大すると発表しました。両社は、2028年までにDRAM量産への高NA EUV露光装置導入を「業界初」で実現する計画です。この技術革新は、DRAMの微細化ロードマップを延長し、半導体業界のさらなる技術革新を加速させることが期待されます。開発者にとっては、より高性能で低消費電力のデバイスが将来的に利用可能になることを示唆しており、ハードウェアの進化がソフトウェアの可能性を広げるでしょう。","source":"Samsung Electronics &amp; ASML","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEP6o-Mi9W6z0t3h55Pai7zLBJEdREBOF9JWE0rOmCwQQvswRzEHEM2frMpAnx3JYej5hWjWzAdHDs6ZG8EHgYJV809oy2yZOjIfSiz2q87x-XSBVn7anYw7Lyb_h754s9epQWwAs0RADyTRkC9hZPziv4wwXWPqAqJ","impact":"high","tags":["半導体","DRAM","EUV露光"]},{"title":"シーイーシー、「フィジカルAI実証ラボ」を開設し製造業向けフィジカルAIの社会実装を推進","summary":"株式会社シーイーシーは2026年9月9日、製造業向けに現実世界を理解して物理的タスクを遂行する「フィジカルAI」の社会実装に向けた事業検討を開始し、研究拠点に「フィジカルAI実証ラボ」を開設したと発表しました。同ラボでは、機械制御を含むメーカー横断のロボット環境でフィジカルAIの実装に向けた導入要件および実装論点の検証を進めます。これにより、中小の製造現場でも使用できるフィジカルAIの普及を目指し、製造業のDXを加速させる重要な一歩となります。開発者は、物理世界と連携するAIシステムの設計や実装に関する新たな機会を探ることができるでしょう。","source":"株式会社シーイーシー","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQE1CD-h_X4gvOWhP9ra0ezSZMwSYJb2tTQ-IzWddcvTuyHSCBx6mZ1JRzP6fAvQmcsIUpqj-GhYi3wrJjMkkH2Zx2HQ-1wZwZ11O2rok6IUB1b5j29UmxZXiK1oDVGjxSUZGGHW9WgCEbRohY66TdyoeA==","impact":"medium","tags":["フィジカルAI","製造業DX","ロボットAI"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
