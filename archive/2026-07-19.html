<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年7月20日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年7月20日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"○○社が次世代LLM「GeniusX」を発表、リアルタイム対話と多モーダル生成を強化","summary":"某大手テック企業が、これまでのモデルを凌駕する次世代のLLM「GeniusX」を正式発表しました。このモデルは、特にリアルタイムでの自然な対話能力と、テキスト、画像、音声、動画をシームレスに生成・理解する多モーダル機能が大幅に強化されています。企業は、カスタマーサポートの自動化、コンテンツ制作、教育分野での応用を特に強調しており、年内にはAPI提供を開始する予定です。開発者向けには、既存のアプリケーションへの統合を容易にするための詳細なドキュメントとSDKが提供される見込みで、新たなAIアプリケーション開発の可能性を大きく広げるでしょう。","source":"Tech News","url":"https://example.com/geniusx-announcement","impact":"high","tags":["LLM","生成AI","多モーダル","API"]},{"title":"オープンソースAIコミュニティが「FreeFlow v3」をリリース、商用利用可能な高性能モデルが登場","summary":"オープンソースAIコミュニティの主要グループが、最新の生成AIモデル「FreeFlow v3」を公開しました。このバージョンは、特に画像生成とテキスト要約の精度が向上しており、商用利用が可能なライセンスモデルを採用している点が大きな注目点です。これにより、中小企業や個人開発者は、高品質なAI機能をコストを抑えて導入できる貴重な機会を得られます。コミュニティは、モデルの軽量化にも成功しており、エッジデバイスでの実行も視野に入れた最適化が施されており、幅広い開発者にとってアクセスしやすいモデルとなるでしょう。","source":"Open Source AI Community","url":"https://example.com/freeflow-v3-release","impact":"medium","tags":["オープンソース","生成AI","画像生成","商用利用"]},{"title":"AI倫理ガイドラインの国際標準化に向けた新たな動き、透明性と公平性に焦点","summary":"各国政府機関と主要なAI研究機関が連携し、生成AIおよびLLMの倫理的な利用に関する国際的な標準ガイドライン策定に向けた新たなイニシアチブを発表しました。特に、AIの意思決定プロセスの透明性確保、データバイアスの排除、そして公平なアルゴリズム設計に焦点が当てられています。これにより、AI技術の普及に伴う社会的な懸念を軽減し、より信頼性の高いAIシステム開発を促進することを目指します。企業や開発者には、これらのガイドラインに沿ったAI開発が推奨されるようになり、倫理的なAI開発がより一層求められるでしょう。","source":"International AI Ethics Council","url":"https://example.com/ai-ethics-standardization","impact":"high","tags":["AI倫理","ガバナンス","透明性","公平性"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコードプラットフォームの進化：個人が数時間でWebアプリを構築可能に","summary":"最新のノーコード・ローコードプラットフォームが、個人開発者向けに画期的な機能強化を発表しました。特に、AIを活用したUI/UXデザインアシスタント機能が導入され、プログラミング知識がなくても、アイデアを数時間で機能的なWebアプリケーションとして形にすることが可能になりました。これにより、インディーハッカーは、より迅速にプロトタイプを作成し、市場のフィードバックを得て、製品を反復改善できるようになります。開発の敷居が大幅に下がり、多くの個人が自身のアイデアを具現化する機会を得るでしょう。","source":"No-code Platform Update","url":"https://example.com/nocode-platform-update","impact":"high","tags":["ノーコード","ローコード","Webアプリ","AIアシスタント"]},{"title":"サブスクリプション型SaaSを個人で立ち上げるための「マイクロSaaSブートキャンプ」が人気","summary":"個人でサブスクリプション型SaaS（Software as a Service）を立ち上げたいインディーハッカー向けに特化した「マイクロSaaSブートキャンプ」が、その実践的なカリキュラムで注目を集めています。このプログラムでは、ニッチ市場の特定から、MVP（Minimum Viable Product）開発、マーケティング戦略、そして収益化までの全プロセスを網羅的に学ぶことができます。卒業生からは、既に複数のマイクロSaaSが成功事例として報告されており、個人での事業構築を考えている開発者にとって貴重なリソースとなっています。このブートキャンプは、個人開発者がビジネスを成功させるための具体的な道筋を提供します。","source":"MicroSaaS Bootcamp","url":"https://example.com/microsaas-bootcamp","impact":"medium","tags":["マイクロSaaS","起業","MVP","個人事業"]},{"title":"個人開発者向けAIツールキット「IndieDev AI Suite」が公開、開発効率を飛躍的に向上","summary":"個人開発者のためのAIツールキット「IndieDev AI Suite」がリリースされました。このスイートには、コード生成、バグ検出、ドキュメント作成、テスト自動化など、開発プロセスのあらゆる段階をサポートするAI機能が統合されています。特に、既存のIDE（統合開発環境）との連携がスムーズで、開発者は煩雑な作業から解放され、より創造的なコーディングに集中できるようになります。このツールキットは、個人開発者の生産性を大幅に向上させることが期待され、開発の質とスピードの両面で大きなメリットをもたらすでしょう。","source":"IndieDev AI Suite","url":"https://example.com/indiedev-ai-suite","impact":"high","tags":["AIツール","開発効率","IDE連携","生産性向上"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"量子コンピューティングの実用化に向けた新たなブレークスルー、エラー訂正技術が大幅進化","summary":"量子コンピューティング分野において、長年の課題であったエラー訂正技術に大きな進展がありました。研究者たちは、より安定した量子ビットを生成し、エラー発生率を大幅に低減する新しい手法を開発しました。これにより、実用的な量子コンピュータの実現がさらに一歩近づいたと評価されています。特に、特定の産業（金融、医薬品開発など）における複雑な問題解決への応用が期待されており、今後の技術動向に注目が集まります。このブレークスルーは、量子コンピューティングの商用化に向けた重要なマイルストーンとなるでしょう。","source":"Quantum Computing Research","url":"https://example.com/quantum-computing-breakthrough","impact":"high","tags":["量子コンピューティング","エラー訂正","ブレークスルー","実用化"]},{"title":"Web3と分散型ID（DID）の普及が加速、個人データ管理の未来を変革か","summary":"Web3技術と分散型ID（DID）の採用が世界的に加速しています。特に、個人のデジタルアイデンティティをユーザー自身が管理し、プライバシーを保護しながら安全に情報共有できるDIDの利点が広く認識され始めています。これにより、オンラインでの本人確認、データ共有、サービス連携のあり方が根本的に変わり、ユーザーは自身のデータをより細かくコントロールできるようになります。企業も、より信頼性の高いユーザー認証システムとしてDIDの導入を検討しており、開発者にとっては新たな認証・データ管理システムの構築機会が生まれるでしょう。","source":"Web3 &amp; DID Alliance","url":"https://example.com/web3-did-adoption","impact":"medium","tags":["Web3","DID","分散型ID","プライバシー"]},{"title":"サステナブルテックへの投資が急増、環境負荷の低いデータセンターやAI最適化技術に注目","summary":"環境意識の高まりを受け、サステナブルテック分野への投資が世界的に急増しています。特に、エネルギー効率の高いデータセンターの建設、再生可能エネルギーを活用したITインフラ、そしてAIを活用してシステム全体のエネルギー消費を最適化する技術が注目されています。企業は、環境への配慮と同時に、コスト削減やブランドイメージ向上にも繋がるため、サステナブルなテクノロジーへの移行を加速させています。開発者にとっては、環境に配慮したシステム設計やAI最適化技術への需要が高まることを意味し、新たな技術開発の方向性を示すものです。","source":"Sustainable Tech Insights","url":"https://example.com/sustainable-tech-investment","impact":"medium","tags":["サステナブルテック","環境","データセンター","AI最適化"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
