<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年8月10日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">

    </div>
    <div class="date-display">2026年8月10日</div>

  <nav class="date-nav">

  <div class="tabs" id="tabs"></div>

  <footer>

    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"OpenAI、次期モデル「Astra」の開発を一部停止、サイバー能力が最高リスクに","summary":"OpenAIは2026年8月7日、次世代AIモデル「Astra」のサイバー能力が社内の安全基準で最高レベルの「Critical」に達したため、その一部開発と社内利用を停止しました。これは、AIの能力向上に伴うセキュリティ上の脅威を理由に、開発企業自らがプロセスを一時停止する初のケースです。Astraは社内テストで10年以上未解決だった数学問題を解くなど高い推論能力を示しており、その強力な能力ゆえに厳格な管理の対象となりました。この動きは、AI開発における安全性と倫理の重要性を改めて浮き彫りにし、開発者にとってはAIの潜在的リスク管理の必要性を示唆しています。","source":"ビジネス+IT","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEVbgRadR-6cePATOqi_x9al8W6Vw_9abJ0_RsTRlHBYwOweMwusVqfMN-wWp9o3o9zdrw3J9oOKWtrHtyFCwuSdFAM0fyH2Pa-GZVktAyY435l1mPWYMoiPzXyIykFMTZznK6QM_1THBJwHIAb9FEPVHlCXV58iiNZg4PT","impact":"high","tags":["AI安全性","LLM開発","OpenAI"]},{"title":"Anthropic、Claude Codeの「auto mode」をデフォルト化 - AIが権限判断を自律実行","summary":"Anthropicは、開発者向けAIモデル「Claude Code」において、「auto mode」を8月14日からデフォルト化すると発表しました。これにより、AIエージェントが権限判断を自律的に実行できるようになります。この機能は、AIエージェントの自律性をさらに向上させ、企業におけるAI活用をよりスムーズにすることを目的としています。開発者にとっては、AIがより複雑なタスクを自律的に処理できるようになることで、生産性の向上や新たな開発アプローチの可能性が広がると期待されます。","source":"note","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGXwSSpxZht2vacmn0tspcTSvUG3ufGOgcUUXX_9UXXU-19hOV_ZvJPOA2D0wPHT65ri8cawl72774eXyB-o_fj0bgNAysg30_H2ONlvsShyTk4Xxm-u7L3OMiXdCXJnRadL7ub","impact":"medium","tags":["AIエージェント","自律AI","Claude Code"]},{"title":"Meta、大規模コードベース向けAIコーディングエージェント「Muse Code」をベータ公開","summary":"Meta AIは、大規模なコードベースを対象としたターミナル型AIコーディングエージェント「Muse Code」のベータ版を公開しました。Muse Codeは、変更計画の作成、コード生成、動作確認までを一連のソフトウェア開発作業として処理することが可能です。このツールは、開発者の生産性向上に大きく貢献すると期待されており、特に大規模プロジェクトにおけるコード管理と開発効率の改善に役立つでしょう。開発者は、より複雑なコーディングタスクをAIに任せることで、創造的な作業に集中できるようになります。","source":"Amiko Consulting","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQG2pe3W0LwSbdev5lIooN1FlRZFrCMvf3-0UCTlrFF4INKS3JuOYNNlHM1KkZeLj7kwrR8t9egoA3tShXWFMqGTg96epDPMvDVtlGJ-ha55iO4PdP9PHajTVTwQI3hUVdDJOTzj4v9wwT7kHROus8CfrWBrkv1B_wG5MiwYjJxKXtdelmBMQGVhyFPXM5yBIwxK-yRtWEcEoCa0oyvggvM7a0Xz1UQECiRqMp5oH-MclGG20ExJvnh-LiRd1UHx1_kUQyRoGFYIDWC2sQsXWKLG2ez9bx5O6cjwYZk9M3aq-itFCu7r7YIjjLEtur-PpaCkExXr9NIPZ_tC2dk06KSSPzfb4qxOmGcg5eisIaNKhH0VhNW79MsvGgQ284","impact":"medium","tags":["AIコーディング","開発者ツール","Meta AI"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"コードが書けない25歳女性がAIだけでアプリを2ヶ月で月5000万円達成","summary":"コーディング経験ゼロの25歳女性、サラ・パール氏がAIツールのみを活用して作った「自己啓発系アプリ」が、わずか2ヶ月で月間5000万円以上の収益を突破したという驚くべきニュースが注目を集めています。これは、AIツールを効果的に活用することで、プログラミングスキルがなくても高収益なアプリを個人で開発できる可能性を強く示しています。この事例は、個人開発者や起業を目指す人々にとって、AIが新たなビジネスチャンスと参入障壁の低下をもたらすことを明確に示唆しており、大きなインスピレーションとなるでしょう。","source":"みんなのニュースレター","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQF6c4cGy7t7T6qV5DRLbZlMBwaWksF8mdtOibcyY6YztPWcWDyHJbyZwNRuDe3MGJoCW0Z3GnJJBBC7ALZWTpJujExPJuM3BTdv3VAjkQF-4Q1OQvOjfPflaROW","impact":"high","tags":["AI活用","ノーコード開発","個人事業"]},{"title":"日本語アプリで月50万円、合計で月70万円を達成した個人開発者の事例","summary":"ある個人開発者が、日本語アプリ単体で月50万円、合計で月70万円の収益を達成したと報告しました。特に先月はマーケティングに力を入れた結果が出たとのことです。この事例は、単に良いアプリを作るだけでなく、適切なマーケティング戦略が個人開発の成功に不可欠であることを示唆しています。開発者にとっては、プロダクトの質だけでなく、ターゲットユーザーへのリーチ方法やプロモーションの重要性を再認識させるものであり、収益化を目指す上で貴重な教訓となります。","source":"みんなのニュースレター","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQF6c4cGy7t7T6qV5DRLbZlMBwaWksF8mdtOibcyY6YztPWcWDyHJbyZwNRuDe3MGJoCW0Z3GnJJBBC7ALZWTpJujExPJuM3BTdv3VAjkQF-4Q1OQvOjfPflaROW","impact":"medium","tags":["アプリ収益化","マーケティング","個人開発"]},{"title":"AIを活用した個人開発パイプラインの構築事例","summary":"松浦勝人氏が、動画生成AIモデル「Seedance 2.5」を活用し、参照素材を多く渡すことで個人開発で制作工程を自動でつなげるパイプラインを構築したと報告しています。このシステムでは、シーン一覧やカット数、合計尺、出力形式などの制作情報が表示され、効率的なコンテンツ制作が可能になります。この事例は、AIが個人開発における制作プロセスの自動化と効率化に大きく貢献することを示しており、開発者にとっては、より少ない労力で高品質なコンテンツを生み出す新たな手法を提供します。特に動画コンテンツ制作において、AIの活用は時間とコストの削減に直結するでしょう。","source":"note","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFOxOZmr0aYXqEe3_kt-bo0ASsZ3aNYQfeDl8e3W3QuEr5mWmdCQ2ZH04DYASXsDcdmsL_X4K6m6D3iuXlLxoZTb2aVNJfRsaAPaDlgQFhK5pXR7RToFA==","impact":"medium","tags":["AI動画生成","開発パイプライン","コンテンツ制作"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"MITが自動運転自転車を開発 - シェアサイクル向けに自律走行で迎えに","summary":"マサチューセッツ工科大学（MIT）のCity Scienceグループが、自動運転自転車「Autonomous Bicycle」を開発しました。このプロジェクトはシェアサイクルの利便性を高めることを目的としており、利用者がスマートフォンアプリで自転車を呼び出すと、自転車自身が自律走行で迎えに来ます。この革新的な技術は、都市交通が抱える課題の解決にもつながる可能性を秘めています。開発者にとっては、自動運転技術の新たな応用分野として注目され、モビリティサービスの未来を形作る一端となるでしょう。","source":"自動運転ラボ","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHSkji1IFXA41P_HsvUkow9EDU3NHlw5qo6dAzN6Ql4xHqq4qdtkQmcq9RrV29LMITTwVqRCyYKG6zteDlEHHsRFa3AIj7DfLL5MU8ToM6Yfw7ul5Y40tmBUA3bkA==","impact":"medium","tags":["自動運転","シェアサイクル","都市交通"]},{"title":"IT業界の将来性、DX・生成AI・サイバーセキュリティが牽引","summary":"IT業界は、AIの進歩によって仕事が奪われるという懸念があるものの、市場規模は拡大を続けており、日本国内だけでなく世界的に見ても高い将来性と成長性を持つ業界の一つと予測されています。特に、企業のDX推進による基幹システムの刷新、生成AIの本格的なビジネス活用、そしてサイバーセキュリティ対策の強化が、IT市場の成長を牽引する主要因とされています。この動向は、IT分野の開発者にとって、DX、生成AI、サイバーセキュリティといった専門知識の需要が高まることを意味し、キャリア形成においてこれらの分野への注力が重要となるでしょう。","source":"すべらない転職","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQF8eL7PiYxWrcMFb5AJVxS7RiuflIl3jokTMdukfwlBJC5AI0mRwAtYA5vC4lmCcY6dGAlQ2BGo3hbnOIcz3XKAbvEalPvRGjMwkGsuMWxaivOcZOWJovGV9gifIw==","impact":"high","tags":["IT市場","DX","サイバーセキュリティ"]},{"title":"H3ロケット9号機による「みちびき7号機」の打ち上げが8月11日に再設定","summary":"宇宙航空研究開発機構（JAXA）は、H3ロケット9号機による準天頂衛星システム「みちびき7号機」の打ち上げを2026年8月10日に予定していましたが、打上げ当日の気象条件が整わないため、8月11日（火）の4時00分～5時30分に再設定しました。これは日本の宇宙開発における重要なミッションの一つであり、今後の進捗が注目されます。この打ち上げは、日本の測位システムの精度向上に貢献し、関連する技術開発やアプリケーション開発にも影響を与える可能性があります。開発者にとっては、高精度測位データを活用した新たなサービスやシステムの創出機会となるでしょう。","source":"JAXA","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFPIpwUypXb-lIyPfSB_wy4NKUSUUb6PHzt3eT28oCg_Z2l5Px6N1FRcOfrwEIvBZI7oR_kD4KRPdfd4bqlo8ImgGCW19t8U0NFr9eJxUx7v_P5f42nyt8NX39DkYm6uEWbIDcS1kER8pG1ReOcGA==","impact":"medium","tags":["宇宙開発","JAXA","みちびき"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
