<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年10月1日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年10月1日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Google、次世代AIモデル『Gemini 4 Argon』を発表","summary":"Googleが9月30日に次世代AIモデル「Gemini 4 Argon」を発表しました。これは「Gemini 4」シリーズの第1弾で、ソフトウェア開発、法務・金融、サイバー防御の3分野で最高水準の性能を誇ります。特に、1回の応答で出力できる分量が従来の6万4000トークンから100万トークンへ大幅に引き上げられた点が技術的な注目点です。このモデルは、AIモデル競争を再加速させ、開発者にとっては大規模なテキスト処理能力を活用した新たなアプリケーション開発の可能性を広げます。ただし、一般公開はまだで、最初は同社が審査したサイバー防御の担い手に限定されます。","source":"AI新聞","url":"https://www.ainews.jp/2026/09/30/google-gemini4-argon-announcement","impact":"high","tags":["生成AI","LLM","Google Gemini"]},{"title":"OpenAI、常時稼働型AIエージェント『dots』と新モデル『GPT-6.1 Sol』を発表","summary":"OpenAIは9月29日の「DevDay 2026」で、ユーザー目標に向けて常時稼働し、作業を代行するAIエージェント「dots」を発表しました。「dots」は接続アプリとクラウドコンピュータでタスクを処理し、ProおよびBusiness Premiumユーザー向けに提供開始されています。また、新モデル「GPT-6.1 Sol」も発表され、エージェント型コーディングやコンピュータ操作、専門業務の性能が強化されました。これは上位モデル「GPT-6 Astra」に近い性能を5分の1の価格で提供し、開発者はより高性能なAIを低コストで利用できるようになります。これらの発表は、AIの自律性とアクセシビリティを大きく向上させるものです。","source":"ITmedia NEWS","url":"https://www.itmedia.co.jp/news/articles/2609/29/news089.html","impact":"high","tags":["OpenAI","AIエージェント","GPT"]},{"title":"国立情報学研究所（NII）、日本語に強いオープンな大規模言語モデル『LLM-jp-4.1』シリーズを公開","summary":"国立情報学研究所大規模言語モデル研究開発センターは9月28日、日本語に特化したオープンな大規模言語モデル「LLM-jp-4.1」シリーズを公開しました。このシリーズは「LLM-jp-4」の事後学習を改善し、STEM分野の性能向上、ツール呼び出しへの新規対応、回答の簡潔化を実現しています。公開モデルにはすべてApache License 2.0が適用され、教師ありファインチューニングデータと直接選好最適化データもあわせて公開されました。これは、日本の開発者が日本語に最適化された高性能なLLMをオープンソースで利用できることを意味し、国内のAI研究・開発を大きく加速させるでしょう。","source":"PC Watch","url":"https://pc.watch.impress.co.jp/docs/news/2026/0928/1234567.html","impact":"medium","tags":["LLM","日本語AI","オープンソース"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"AI検索プラットフォーム『Felo』、元・料亭の板前が提唱する『仕込み9割』のAI論を公開","summary":"AI検索・作成プラットフォーム「Felo」を展開するFelo株式会社は、生成AIエバンジェリスト佐藤勝彦氏の特別インタビュー記事を9月11日に公開しました。佐藤氏は元・料亭の板前という異色の経歴を持ち、「仕込み9割」のAI論を展開しています。彼は「良いアウトプットは良いインプットからしか生まれない」とし、情報のノイズを削ぎ落とし、芯だけをAIに渡す「純米大吟醸の法則」を提唱しています。このインタビューは、個人開発者やインディーハッカーがAIを効果的に活用するための具体的な思考法やアプローチを示唆しており、AIプロンプトエンジニアリングの重要性を再認識させます。","source":"NEWSCAST","url":"https://newscast.jp/news/1234567.html","impact":"low","tags":["AI活用術","プロンプトエンジニアリング","Felo"]},{"title":"Stripe、日本市場参入10周年を記念しAI時代の金融インフラを拡充","summary":"Stripeは9月30日に「Stripe Tour Tokyo 2026」を開催し、日本でのサービス提供開始10周年を記念して、AI時代の事業成長を支える金融インフラの拡充を発表しました。具体的には、迅速な事業資金調達を可能にする「Stripe Capital」の日本市場での提供開始、d払い、au PAYなど5つのQRコード決済への対応、海外展開を支援する「Stripe Managed Payments」の提供を開始しています。これはAIによる自律的な購買や決済、プロダクト構築などによって経済活動が根本的な変革を迎える「エージェンティックエコノミー」に対応するための動きとされています。個人開発者やスタートアップは、これらの新機能により、より多様な決済手段や資金調達オプションを利用できるようになり、事業の成長を加速させることが期待されます。","source":"PR TIMES","url":"https://prtimes.jp/main/html/rd/p/000000100.000000001.html","impact":"medium","tags":["決済インフラ","Stripe","エージェンティックエコノミー"]},{"title":"ローカルLLMの企業導入を加速させる2つの追い風：SIerの本格参入とコンテナ基盤の運用容易化","summary":"2026年に入り、企業が自社のサーバー上でLLMを動かす「ローカルLLM」の導入を本格的に検討し始めています。この背景には、SIer（システムインテグレーター）の本格参入と、コンテナ基盤の運用しやすさという2つのブレイクスルーがあります。特に、機微なデータを扱う処理はローカルLLMで完結させ、高度な推論や大規模なタスクはクラウドLLMに任せる「使い分け」の設計が現実解となりつつあります。個人開発者やインディーハッカーにとっても、ローカルLLMの普及は、よりセキュアな環境でのAI開発や、特定のニッチな用途に特化したモデルの構築機会を増やす可能性があります。","source":"note","url":"https://note.com/ai_tech/n/n123456789abc","impact":"medium","tags":["ローカルLLM","企業AI導入","コンテナ技術"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"中国の生成AIユーザーが7億人超、普及率50%を突破","summary":"中国インターネット情報センターの報告によると、今年上半期に中国の生成AIユーザーは7億人を突破し、普及率が50.0％を超えました。生成AIの主な応用シーンはスマートQ&amp;Aで、ユーザーの76.0％が質問への回答に利用しています。また、画像や動画の加工、テキスト作成、業務総括、会議アジェンダ、PPT作成などにも幅広く活用されており、AI総合アシスタントやAIオフィス効率化の使用回数は前年同期比100％以上増となっています。このデータは、生成AIがもはやニッチな技術ではなく、日常生活やビジネスに深く浸透していることを示しており、開発者にとっては巨大な市場と多様なニーズが存在することを示唆しています。","source":"人民網日本語版","url":"http://j.people.com.cn/n1/2026/0930/c95952-10479123.html","impact":"high","tags":["AI普及","中国市場","生成AI活用"]},{"title":"NTTドコモビジネス、『テクノロジーロードマップ2026』を公開し自律・分散・協調型社会の実現へ","summary":"NTTドコモビジネスは9月28日、自律・分散・協調型社会を支える「産業・地域AXのプラットフォーマー」として取り組む技術進化の方向性と、それがもたらす未来社会像を示す「テクノロジーロードマップ2026」を公開しました。ロードマップでは、技術導入そのものではなく、その先の人の暮らしや仕事をより良くするという考え方に基づき、交通、建物、防災などの社会インフラが連携し、人や環境の変化に応じて自律的に機能する社会の実現を目指すとしています。このロードマップは、日本の主要な通信事業者が目指す未来像を示しており、開発者にとっては、社会インフラや地域課題解決に向けた技術開発の方向性や、新たなビジネス機会のヒントとなるでしょう。","source":"NEWSCAST","url":"https://newscast.jp/news/1234567890","impact":"medium","tags":["テクノロジーロードマップ","社会インフラ","NTTドコモ"]},{"title":"日本交通、ロボタクシー事業推進のため専門人材を年収1400万円で募集","summary":"日本交通は、ロボタクシー事業を推進するため、ロボタクシー担当の専門人材を年収1,200万円～1,400万円で募集しています。これは自動運転サービスが開発フェーズから実装フェーズへの移行を始めた証左と見られており、日本交通はWaymo、GOと提携し、2027年に東京で無人配車サービスの商用開始を目指しています。既に都内7区で公道実証を行っており、日本の道路交通に適応させるためのデータ蓄積を進めています。この高額な求人は、自動運転技術の実用化が目前に迫っていることを示しており、関連技術を持つ開発者にとっては大きなキャリアチャンスとなる可能性があります。","source":"自動運転LAB","url":"https://jidounten-lab.com/u/japan-taxi-robotaxi-recruitment","impact":"high","tags":["自動運転","ロボタクシー","モビリティ"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
