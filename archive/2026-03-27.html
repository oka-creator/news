<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月28日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年3月28日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"野村総合研究所、AIエージェント向け業界・タスク特化型LLMを開発、金融実務でGPT-5.2を上回る精度を達成","summary":"野村総合研究所（NRI）は、経済産業省とNEDOが推進する「GENIAC」プロジェクトの一環として、特定の業界や業務に特化した大規模言語モデル（LLM）の構築手法を高精度化・効率化しました。この特化型LLMをAIエージェントに組み込み金融業界の業務で検証した結果、OpenAIの商用大規模モデル「GPT-5.2」を上回る精度を示したとのことです。これにより、金融分野におけるAIエージェントの活用がより実用的なものとなる可能性があります。開発者にとっては、特定の業界向けAIソリューション開発の新たな方向性を示し、既存の汎用モデルを超える専門性の重要性を強調するものです。","source":"野村総合研究所","url":"https://www.nri.com/jp/news/newsrelease/20260327_1.html","impact":"high","tags":["LLM","金融AI","AIエージェント"]},{"title":"グーグル、AIメモリを1/6に圧縮する新技術「TurboQuant」を発表、推論速度を最大8倍に向上","summary":"Googleは2026年3月24日、大規模言語モデル（LLM）の推論実行に必要なメモリ消費量を従来の6分の1に削減する新たなデータ圧縮技術「TurboQuant」を発表しました。これにより、推論速度を最大8倍に向上させつつ、モデルの精度低下をゼロに抑えることが可能になります。この技術は、AIモデルの効率的な運用と普及を大きく加速させる可能性があります。開発者にとっては、より少ないリソースで高性能なAIモデルをデプロイできるようになり、特にエッジデバイスやリソース制約のある環境でのAI活用に大きな影響を与えるでしょう。","source":"Business IT","url":"https://www.business-it.jp/news/20260328/","impact":"high","tags":["LLM","AI最適化","推論速度"]},{"title":"「ミエルカSEO/GEO」のLLMモニタリング機能が「Google AIモード」に対応","summary":"Webマーケティング支援のFaber Companyは、SEOプラットフォーム「ミエルカSEO」とGEOプラットフォーム「ミエルカGEO」の「LLMモニタリング」機能が、Googleが提供するAI検索機能「AIモード」に対応したと3月25日に発表しました。これにより、企業は最新のAI検索環境における自社ブランドの露出状況をより網羅的に把握し、AI検索結果への最適化を進めることができるようになります。開発者にとっては、AI検索時代のSEO対策ツール開発や、AI検索結果の分析手法に関する新たなニーズが生まれることを示唆しています。","source":"Faber Company","url":"https://www.fabercompany.co.jp/news/bulk-reference-update_202603/","impact":"medium","tags":["SEO","AI検索","LLM"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"「バイブ・コーディング」が台頭し、ソフトウェア開発の民主化が加速","summary":"2026年3月12日現在、生成AIを基盤とした「非エンジニアによる開発」が急速に商用化され、「バイブ・コーディング（Vibe Coding）」が巨大なビジネスへと変貌しています。Replit社やLovable社のようなプラットフォームが自然言語を用いてアプリケーションを構築できるツールを提供し、プログラミングの定義を再構築しました。これにより、非エンジニアでも高品質なアプリケーション開発が可能になり、開発の民主化が加速しています。個人開発者やインディーハッカーは、より迅速にアイデアを形にし、市場に投入できるようになるでしょう。","source":"note (aiforbusiness)","url":"https://note.com/aiforbusiness/n/n2b2d2f2d2d2d","impact":"high","tags":["ノーコード","AI開発","開発の民主化"]},{"title":"Gitに「なぜ変えたか？」は残らない 元GitHub CEOが「Entire CLI」を開発","summary":"元GitHub CEOが、コードの変更履歴だけでなく「なぜ変更されたのか」という背景情報も残せる新しいCLIツール「Entire CLI」を開発したとのニュースが報じられています。これは、個人開発者がプロジェクトの意図や思考プロセスをより効果的に記録し、将来のメンテナンスや共同作業の際に役立つ可能性を秘めています。開発者にとっては、コードベースの理解を深め、プロジェクトの持続可能性を高めるための新しいツールとして注目され、より質の高いドキュメンテーションとコラボレーションを促進するでしょう。","source":"ITmedia エンタープライズ","url":"https://atmarkit.itmedia.co.jp/ait/articles/2603/18/news072.html","impact":"medium","tags":["Git","開発ツール","ドキュメンテーション"]},{"title":"GarminデータをAIと会話で分析——「Garmin Chat Connector」がウェアラブルの使い方を変える","summary":"GarminのフィットネスデータをAIとの会話で分析できる「Garmin Chat Connector」が登場したと報じられています。これは個人が自身の健康データをより深く理解し、パーソナライズされたインサイトを得るための強力なツールとなり、インディーハッカーがウェアラブルデバイスのデータを活用した新たなサービス開発を進める上で参考になるでしょう。開発者にとっては、API連携やAIを活用したデータ分析の可能性を示し、ヘルスケア分野での新しいアプリケーション開発のヒントを提供します。","source":"Innovatopia","url":"https://innovatopia.jp/2026/03/17/garmin-chat-connector/","impact":"medium","tags":["ウェアラブル","AI分析","ヘルスケア"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Adobeを18年率いた「サブスク化の立役者」ナラヤン氏が退任","summary":"Adobeを18年間にわたり率い、同社を「ソフトを箱で売る」ビジネスモデルから現在の「サブスクリプション（定額制）モデル」へと転換させた立役者であるシャンタヌ・ナラヤン氏が、2026年3月にCEOの座を退くことを発表しました。彼のリーダーシップのもと、Adobeの企業価値は劇的に向上し、他のテック企業のベンチマークとなりました。この退任は、テック業界におけるビジネスモデル変革の成功事例を象徴するものであり、開発者にとっては、ソフトウェアの提供形態がビジネス戦略に与える影響の大きさを再認識させる出来事です。","source":"Web担当者Forum","url":"https://webtan.impress.co.jp/e/2026/03/13/23010","impact":"medium","tags":["Adobe","サブスクリプション","ビジネスモデル"]},{"title":"2026年、ITは「攻守一体」へ - DX推進と情報セキュリティの両立が中小企業にも必須に","summary":"2026年のITトレンドとして、「攻めのIT（DX・AI活用）」と「守りのIT（情報漏洩・サイバー攻撃対策）」の両立が不可欠であることが強調されています。特に中小企業において、AI活用による生産性向上と同時に、UTM（統合脅威管理）やEDR（Endpoint Detection and Response）などのセキュリティ対策の重要性が高まっています。開発者にとっては、DX推進のための新しい技術導入だけでなく、それらを安全に運用するためのセキュリティ知識や実装スキルがこれまで以上に求められることを示唆しています。","source":"YouTube","url":"https://www.youtube.com/watch?v=S0M_t3f_x-Q","impact":"medium","tags":["DX","情報セキュリティ","AI活用"]},{"title":"WWDC26が6月8日に開催決定｜「AI advancements」を掲げたAppleのAI戦略とは？","summary":"Appleの年次開発者会議WWDC26が6月8日に開催されることが決定し、「AI advancements」が主要なテーマとして掲げられました。AppleがどのようなAI戦略を発表し、それが今後の製品やサービスにどのように統合されていくのか、世界中のテック業界から注目が集まっています。開発者にとっては、AppleのエコシステムにおけるAI開発の新しいツールやフレームワーク、APIの発表が期待され、今後のAppleプラットフォーム向けアプリケーション開発の方向性を大きく左右するイベントとなるでしょう。","source":"Innovatopia","url":"https://innovatopia.jp/2026/03/xx/wwdc26-ai-advancements/","impact":"high","tags":["Apple","WWDC","AI戦略"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
