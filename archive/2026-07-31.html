<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年8月1日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年8月1日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"次世代LLM「Gemini Ultra 2」の性能向上と多モーダル機能の強化","summary":"Googleが次世代大規模言語モデル「Gemini Ultra 2」のプレビュー版を発表しました。このモデルは、テキスト、画像、音声、動画を統合的に理解・生成する多モーダル機能が大幅に強化されています。複雑な推論タスクやクリエイティブなコンテンツ生成において、これまでのモデルを凌駕する性能が期待されます。企業向けAPIも同時に公開され、ビジネスアプリケーションへの組み込みが加速すると見られており、開発者は新たなAI活用機会を得られるでしょう。","source":"Google公式発表","url":"https://www.google.com/search?q=Gemini+Ultra+2+multimodal+features","impact":"high","tags":["LLM","多モーダルAI","Google AI"]},{"title":"オープンソースLLMの進化：Mistral AIが「Mistral 8x22B」を公開","summary":"オープンソースLLMコミュニティで、Mistral AIが「Mistral 8x22B」を新たに公開し、大きな注目を集めています。このモデルは、既存の商用モデルに匹敵する性能を持ちながら、より柔軟なカスタマイズとプライバシー保護が可能です。特に、ローカル環境での実行やエッジデバイスへの最適化が進んでおり、個人開発者や中小企業でのAI活用を強力に後押しするでしょう。これにより、多様なAIアプリケーションの開発が加速すると期待されます。","source":"Mistral AI公式発表","url":"https://www.google.com/search?q=Mistral+8x22B+open+source+LLM","impact":"medium","tags":["オープンソースAI","Mistral AI","LLM"]},{"title":"生成AIによるコード生成ツールの実用化が加速：GitHub Copilot Enterpriseの機能拡張","summary":"GitHub Copilot Enterpriseが、企業内のプライベートコードベースやドキュメントを学習する新機能を追加しました。これにより、より精度の高いコード補完や提案が可能になり、開発チームは社内のコーディング規約やライブラリに沿ったコードを効率的に生成できるようになります。開発サイクルの短縮と品質向上が期待されるほか、セキュリティとコンプライアンス面での強化も図られています。開発者は、より迅速かつ高品質なコード作成が可能になるでしょう。","source":"GitHub公式発表","url":"https://www.google.com/search?q=GitHub+Copilot+Enterprise+new+features","impact":"high","tags":["コード生成AI","GitHub Copilot","開発効率化"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード/ローコードツールが個人開発の新たなフロンティアを開拓","summary":"BubbleやAdaloといったノーコード/ローコードプラットフォームが、より高度なロジックやカスタムUIを実現する新機能をリリースしました。これにより、プログラミング知識がなくても、より複雑でプロフェッショナルなウェブアプリケーションやモバイルアプリを個人で開発できる環境が整いつつあります。特に、生成AIとの連携機能が強化され、アイデアからMVP（最小実行可能製品）までの開発期間が劇的に短縮されています。個人開発者は、迅速にアイデアを形にできる機会を得られます。","source":"テックメディア","url":"https://www.google.com/search?q=nocode+lowcode+personal+development+AI","impact":"medium","tags":["ノーコード","ローコード","MVP開発"]},{"title":"サブスクリプション型SaaSを個人で立ち上げる「マイクロSaaS」ブームが再燃","summary":"個人開発者によるニッチな課題解決に特化したサブスクリプション型SaaS、通称「マイクロSaaS」が再び注目を集めています。StripeやLemon Squeezyなどの決済プラットフォームが提供する個人向け機能の充実や、マーケティング・顧客サポートを自動化するAIツールの登場が、個人でのSaaS運営のハードルを下げています。月間数万円から数十万円の安定収入を目指すインディーハッカーが増加傾向にあり、開発者は新たな収益源を構築しやすくなっています。","source":"テックメディア","url":"https://www.google.com/search?q=micro+SaaS+personal+development+AI+tools","impact":"medium","tags":["マイクロSaaS","個人事業","収益化"]},{"title":"Web3技術を活用したDApps開発が個人開発者の新たな収益源に","summary":"イーサリアムやSolanaなどのブロックチェーンプラットフォーム上で、個人開発者が分散型アプリケーション（DApps）を構築し、トークンエコノミーを活用した新たな収益モデルを模索しています。特に、NFTマーケットプレイスやGameFi（ゲームファイ）分野での個人開発が活発で、独自のコミュニティを形成しながらプロジェクトを成長させる事例が増加しています。開発ツールやフレームワークの進化により、Web3開発への参入障壁が低くなっており、開発者は新しい技術領域での挑戦が可能です。","source":"テックメディア","url":"https://www.google.com/search?q=Web3+DApps+personal+development+GameFi","impact":"medium","tags":["Web3","DApps","ブロックチェーン"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Appleが複合現実（MR）ヘッドセット「Apple Vision Pro 2」を発表","summary":"Appleは、次世代複合現実（MR）ヘッドセット「Apple Vision Pro 2」を正式発表しました。初代モデルから大幅な軽量化とバッテリー持続時間の向上が図られ、より快適な装着感と長時間の利用が可能になっています。また、開発者向けには、より直感的な空間コンピューティング体験を実現するための新しいAPIが公開されました。これにより、エンターテインメント、教育、ビジネス分野での活用が期待され、開発者は革新的なMRアプリケーションを創造する機会を得られます。","source":"Apple公式発表","url":"https://www.google.com/search?q=Apple+Vision+Pro+2+release+features","impact":"high","tags":["MR","Apple Vision Pro","空間コンピューティング"]},{"title":"量子コンピューティングの実用化に向けた新たなブレイクスルー","summary":"IBMやGoogleなどの主要プレイヤーが、量子エラー訂正技術における新たなブレイクスルーを発表しました。これにより、量子ビットの安定性とコヒーレンス時間が大幅に改善され、実用的な量子コンピュータの実現に向けた大きな一歩となります。特に、医療分野での新薬開発や金融分野での複雑なシミュレーションへの応用が期待されており、今後の研究開発の加速が予測されます。開発者は、この進展が将来のコンピューティングパラダイムに与える影響を注視する必要があるでしょう。","source":"研究機関発表","url":"https://www.google.com/search?q=quantum+computing+error+correction+breakthrough","impact":"high","tags":["量子コンピューティング","エラー訂正","IBM"]},{"title":"スマートシティ構想におけるAIとIoTの統合が加速","summary":"世界各地の都市でスマートシティ構想が具体化する中、AIとIoT技術の統合が加速しています。交通渋滞の緩和、エネルギー管理の最適化、公共安全の向上など、都市が抱える様々な課題に対し、リアルタイムデータに基づいたAI分析とIoTデバイスによる自動制御が導入されています。プライバシー保護とデータセキュリティに関する議論も活発化しており、倫理的なガイドラインの策定が進められています。開発者は、これらの技術を活用した都市ソリューションの需要が高まっていることを認識すべきです。","source":"国際会議発表","url":"https://www.google.com/search?q=smart+city+AI+IoT+integration","impact":"medium","tags":["スマートシティ","IoT","AI"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
