<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年6月5日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年6月5日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Microsoftが「MAIモデルファミリー」とエージェント基盤「IQ」シリーズを発表","summary":"Microsoftは開発者会議「Build 2026」で、自社開発の大規模言語モデル（LLM）群「MAIモデルファミリー」7種と、エージェント型AIの新基盤アーキテクチャ「IQ」シリーズを発表しました。旗艦モデル「MAI-Thinking-1」は推論特化型で、MoEアーキテクチャを採用し、AnthropicのSonnet 4.6を上回る性能を持つとされます。これらのモデルはCopilot製品群への統合が見込まれており、開発者はより高性能なAIツールを利用できるようになります。また、個人向けワークエージェント「Microsoft Scout」や企業向け「Agent 365」も発表され、AIの活用範囲が大きく広がるでしょう。","source":"Microsoft公式ブログ","url":"https://blogs.microsoft.com","impact":"high","tags":["Microsoft","LLM","AIエージェント"]},{"title":"NECが生成AIを活用した輸出入品の「AI税番判定サポート」無償トライアルを開始","summary":"NECは、生成AI（LLM）を用いて輸出入品の税番（HSコード）特定を支援する「AI税番判定サポート」の無償トライアル提供を5月14日より開始しました。このサービスは、貨物の品名や用途を入力するとAIが税番候補とその根拠を提示し、不足情報があれば確認ポイントを促すことで、通関業務の属人化解消と効率化を支援します。開発者にとっては、特定の業務領域におけるAI活用の具体的な事例として参考になり、業務効率化AIのニーズの高まりを示唆しています。","source":"PR TIMES","url":"https://prtimes.jp","impact":"medium","tags":["NEC","生成AI","業務効率化"]},{"title":"Sansan、国家プロジェクト「GENIAC」に2年連続で採択され、文書特化型視覚言語モデルを開発","summary":"Sansan株式会社は、経済産業省およびNEDOが推進する国内基盤モデル開発支援プロジェクト「GENIAC」に2年連続で採択されました。同社は「文書に特化した指示追従能力の高い視覚言語モデルの開発」を提案し、請求書や契約書といった日本語ビジネス文書における複雑な指示へ高精度に対応するモデルの開発に取り組みます。この取り組みは、企業のAI活用を最大化する「働き方を変えるAXサービス」の提供を加速するものであり、開発者にとっては、ビジネス文書処理におけるAIの進化と、国家プロジェクトによる国内AI技術の発展に注目するきっかけとなるでしょう。","source":"PR TIMES","url":"https://prtimes.jp","impact":"medium","tags":["Sansan","視覚言語モデル","GENIAC"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"AI時代に月100万円以上稼ぐ海外個人開発者の成功事例が多数紹介","summary":"「みんなのニュースレター」にて、AI時代に月100万円以上稼ぐ海外個人開発者の具体的な成功事例が毎週ピックアップされています。最近の事例では、22歳の大学生が2週間でアプリを開発し80日で2,000万円を稼いだ話や、女子大学生が2本のAIアプリで6ヶ月で月2,300万円、8ヶ月で月3,800万円の収益を上げたエピソードが紹介されました。これらの事例は、トレンドの嗅覚と迅速な行動が成功の鍵であることを示唆しており、個人開発者にとってAIを活用したプロダクト開発の大きな可能性とモチベーションを与えます。","source":"みんなのニュースレター","url":"https://minnano-newsletter.com","impact":"high","tags":["個人開発","AIアプリ","成功事例"]},{"title":"経済産業省「IP360補助金」第2回公募が開始、インディーゲーム開発者の海外展開を支援","summary":"経済産業省は、日本のインディーゲーム開発者向けに海外展開やローカライズなどを支援する「IP360補助金」の第2回公募を開始しました。締切は2026年6月19日17時までとなっており、日本のインディーゲームが国際市場で競争力を高めるための貴重な機会を提供します。この補助金は、資金面での課題を抱えがちな個人開発者や小規模スタジオにとって、海外市場への足がかりを築く大きなチャンスとなり、開発者は積極的に活用を検討すべきでしょう。","source":"IndieGamesJp.dev","url":"https://indiegamesjp.dev","impact":"high","tags":["インディーゲーム","補助金","海外展開"]},{"title":"Unityユーザーコミュニティが「Unity 物理完全に理解した勉強会」を6月19日に開催","summary":"Unityユーザーコミュニティは、2026年6月19日に「Unity 物理完全に理解した勉強会」をオフライン（渋谷）とオンラインのハイブリッド形式で無料開催します。本イベントでは、Unity 6.3のLow-level 2D Physicsをピックアップし、物理エンジンに関する深い知識と実践的なノウハウが共有される予定です。Unityを使用する個人開発者にとって、物理エンジンの理解を深め、ゲーム開発の品質向上に直結する有益な情報が得られる貴重な機会となるでしょう。","source":"IndieGamesJp.dev","url":"https://indiegamesjp.dev","impact":"medium","tags":["Unity","勉強会","ゲーム開発"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Alphabetが約800億ドルの大型増資を実施、AIインフラ投資を加速","summary":"Googleの親会社であるAlphabetは、AIの計算インフラ（GPUやデータセンター）への投資を加速させるため、約800億ドル規模の大型増資を実施しました。特に注目すべきは、ウォーレン・バフェット氏率いるバークシャー・ハサウェイがこの増資のうち100億ドルを引き受けた点です。これは、AI競争の主戦場がモデルの賢さから「いかに計算資源を確保できるか」という資本力勝負へと移行していることを象徴しており、開発者にとっては、今後より強力なAIインフラが提供される可能性を示唆しています。","source":"Investing.com","url":"https://investing.com","impact":"high","tags":["Alphabet","AIインフラ","投資"]},{"title":"COMPUTEX 2026でNVIDIA RTX Spark搭載のMSI製AIミニPC「EdgeMesa N AI+」が発表","summary":"台北で開催中のCOMPUTEX 2026にて、MSIはNVIDIA RTX Sparkを搭載したAIミニPC「EdgeMesa N AI+」を発表しました。このミニPCは、AI開発者、データサイエンティスト、クリエイター向けに設計されており、LLMや生成AI、リアルタイム推論といった高負荷ワークロードをローカル環境で処理できます。これにより、遅延の低減、データプライバシーの強化、クラウドインフラへの依存最小化が実現し、開発者はより柔軟かつセキュアな環境でAI開発を進めることが可能になります。","source":"MSI Japan","url":"https://jp.msi.com","impact":"medium","tags":["AIミニPC","NVIDIA RTX","COMPUTEX"]},{"title":"DatabricksがIPO計画を延期、過密なテック市場が理由","summary":"データソフトウェア企業DatabricksのCEOは、過密なテック市場を理由に、2026年中の新規株式公開（IPO）を実施しない方針を明らかにしました。同社は将来的な上場を目指すものの、SpaceX、Anthropic PBC、OpenAIといった企業の相次ぐIPO計画が、今回の判断に影響を与えたと説明しています。この延期は、テック業界全体の資金調達環境や市場の成熟度を反映しており、開発者にとっては、スタートアップ企業の資金調達戦略や市場動向を理解する上で重要な情報となります。","source":"Investing.com","url":"https://investing.com","impact":"low","tags":["Databricks","IPO","テック市場"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
