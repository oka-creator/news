<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年6月6日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"富士通が製造業向けに生成AIソリューションを発表、設計・見積もり業務を80%効率化","summary":"富士通が製造業の設計・見積もり業務を80%効率化する生成AI搭載ソリューションを開発しました。このシステムは3D CADデータと過去の設計書・見積書を生成AI（LLM）で分析し、新しい部品の製造コストや技術的実現可能性を数分で算出します。これにより、熟練技術者の経験や数日間の計算に頼っていた初期設計・見積もり業務が劇的に短縮されます。製造業のサプライチェーン全体のスピードアップに貢献し、開発者はAIを活用した業務効率化の可能性を探る良い事例となります。","source":"ギークおじ （街・趣味・ビジネス） - note","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEzGEvLG-qY0pooqd_ka4I3IncZd2MCbukeDUs1HVAuQ8uGM_UTPhKfwlxgaIBcH7xU4LZzQiTXYmm4OR7iAMiUSLmq69MCX53wwnabCwT85u4Ye3fyZ7sza2ZhEtES36gBVDDOO9s=","impact":"high","tags":["生成AI","製造業","業務効率化"]},{"title":"グラファー、個人情報を社外に出さずに書類処理を支援する「ローカルLLM活用技術」を確立","summary":"株式会社グラファーは、個人情報や機密情報をインターネット経由で外部サーバーに送信することなく、ユーザーのPCや社内サーバー内でAIが書類処理を行う「ローカルLLM活用技術」を確立しました。この技術により、これまで個人情報保護の観点からAI導入が困難だった行政、金融、医療などの分野でもAIによる業務効率化が可能になります。クラウドLLMの従量課金を前提としない運用も実現するため、コスト面でもメリットがあります。開発者にとっては、プライバシー重視のAIソリューション開発の新たな方向性を示すものです。","source":"グラファー","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQE6_hfDRR7-LiCXr00n5IDdW-y6hRCtUCMhxozVUUCGNPj1XTgxJAQI9xpjZsGxe6oqcaw93dv-_8C6ZNbTW8r75lc6K8P80Cp9S_RIWKcgZuzXYnmkaIs=","impact":"high","tags":["ローカルLLM","プライバシー保護","機密情報"]},{"title":"米司法省とFTC、OpenAI・Microsoft・NVIDIAへの反トラスト法調査で合意","summary":"米連邦政府の二大独占禁止法執行機関である司法省（DOJ）と連邦取引委員会（FTC）が、生成AI業界を主導するOpenAI、Microsoft、NVIDIAの3社に対する本格的な独占禁止法調査を進めることで合意したと報じられました。司法省はNVIDIAの半導体供給と市場支配力を、FTCはOpenAIおよびMicrosoftの資本提携とLLM市場における優位性を調査します。これは今後の商用AIツールの供給体制や価格、ビッグテック間の提携関係に大きな影響を与える可能性があります。開発者にとっては、AIエコシステムの将来的な競争環境や利用可能なツール、パートナーシップに影響を及ぼす重要な動きです。","source":"ギークおじ （街・趣味・ビジネス） - note","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEzGEvLG-qY0pooqd_ka4I3IncZd2MCbukeDUs1HVAuQ8uGM_UTPhFfwlxgaIBcH7xU4LZzQiTXYmm4OR7iAMiUSLmq69MCX53wwnabCwT85u4Ye3fyZ7sza2ZhEtES36gBVDDOO9s=","impact":"high","tags":["独占禁止法","AI規制","OpenAI"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"「AI時代に月100万円以上稼ぐ海外個人開発者」の成功事例が話題に","summary":"海外の個人開発者コミュニティでは、AIを活用して短期間で大きな収益を上げている事例が注目されています。例えば、ある22歳の大学生は2週間でアプリを開発し、80日で2,000万円を稼ぎ、別の女子大学生はAIアプリを6ヶ月で月2,300万円、8ヶ月で月3,800万円まで成長させました。これらの事例は、TikTokなどのトレンドを素早く捉え、AIによる開発スピードを活かしたインフルエンサーマーケティングが成功の鍵となっています。個人開発者にとっては、AIを活用した高速開発とマーケティング戦略の重要性を示す、非常に刺激的な情報です。","source":"みんなのニュースレター","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFS7dlkQfPl2yckB-C_zOoAfan3QpYCuqq7tQ-vx2yfGxChNhpLLhP0JLA3lo2j7x4xLhIdEEH-JCSO--Y4R5pFyN-Pwqe7XbjbCSW9GrnTo2LWZNRYG1HwziRZ","impact":"high","tags":["個人開発","AI活用","収益化"]},{"title":"Indie Hackersコミュニティで「Build in Public」の教訓やセールスの重要性が議論","summary":"Indie Hackersのトップ投稿では、個人開発者が直面する課題と学びが活発に共有されています。「Build in Public（開発過程を公開する）」のオーディエンスと実際の市場との違いを学んだ話や、「セールスがうまくいかなかったのではなく、フォローアップを忘れていたからディールを失った」という実用的な教訓が共有されています。また、ローンチから40日後に200以上のデイリーアクティブユーザーを獲得しながらも収益がゼロという経験談も、多くの個人開発者に示唆を与えています。これは、開発だけでなくマーケティングやセールス、そして市場との対話の重要性を再認識させるものです。","source":"Indie Hackers","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHxpCr9yH4QE70bjRG3wWy_P7U0lgHYiJ5e6ZBjQjWILO_OnqQ-DVleqK6FwUs2bw36j_23qV1EVt9VmSxxlqJIaB_7LDhdCN5wDqqee3qv7TTlQOIGIHW9UgwIFhuqATrALkIAzQ70MnH5r4s=","impact":"medium","tags":["Indie Hackers","Build in Public","セールス"]},{"title":"キャラクターとAIを活用した行動変容プラットフォーム「キャラミクス」を開発する「リモア」が1億円調達","summary":"株式会社リモアは、キャラクター、AI、行動データを統合した行動変容プラットフォーム「キャラミクス」を開発しており、1億円の資金調達を発表しました。このプラットフォームは、睡眠領域を起点にユーザーの行動変容を支援し、キャラクターとの関係性を通じて習慣を資産へと変える体験の実現を目指しています。SDK/API提供により、美容、金融、EC、ウェルネスなど幅広い外部サービスへの展開も視野に入れており、2026年後半の正式リリースを予定しています。個人開発者にとっては、キャラクターとAIを組み合わせた新しいサービスモデルの可能性を示唆する事例です。","source":"起業の「わからない」を「できる」に","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGy_7qeSHXh34UGHiM02ad0HqjxrRFzVRQI2UVgDstnCScx0NyowIDCnz4fcnLc0hU2DRXzv-LWGkyS3o6RMcMw1uclxyahotOxVQJUImlAYTAp_C4S3smV1UXPBwMwjJtmDi4J","impact":"medium","tags":["行動変容","キャラクターAI","資金調達"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"BYDが4nm車載自動運転チップ「璇璣（センキ）A3」を発表、都市部自動運転向けに「事故全額補償」制度も導入","summary":"電気自動車大手BYDは、自社開発の4ナノメートル（nm）プロセスを採用した車載自動運転チップ「璇璣（センキ）A3」を発表しました。このチップを核とする都市部自動運転向けに、「事故全額補償」制度も打ち出しています。これはBYDがEV市場の競争力をさらに高め、自動運転技術の安全性と普及にコミットする姿勢を示しています。開発者にとっては、高性能な車載AIチップの開発競争が激化していること、そして自動運転の普及には技術だけでなく信頼と補償制度が不可欠であることを示唆しています。","source":"東京報道新聞","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQG7nxYDf_MN4SYOaHB8jgKu-WngNpB44N9Lhx9lXZeptiO6dO-7BSk7-lHGk_-FVjEjVUR5m_XybnWSuNppWruydzgVXJrOgvhfSLKmhcWzRfNoaAf_m8yqovfdHhUqC0pbNQsQbSUE08MxoukjPA==","impact":"high","tags":["自動運転","車載チップ","BYD"]},{"title":"Google AI検索に「参照拒否」機能が英国で提供開始、コンテンツ提供者の権利保護へ","summary":"米グーグルは、生成AIによる検索結果でニュースなどのサイトコンテンツを参照する際、サイト側が利用を拒否できる新たな仕組みを英国で提供開始しました。これは英国の競争・市場庁が命令として課したもので、世界展開も視野に入れているとされています。この動きは、AIによるコンテンツ利用における著作権や報酬、情報源の透明性に関する議論を加速させ、コンテンツクリエイターとAI企業の関係に大きな影響を与える可能性があります。開発者にとっては、AIがコンテンツを扱う際の倫理的・法的な側面を考慮する必要性が高まることを示しています。","source":"東京報道新聞","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQG7nxYDf_MN4SYOaHB8jgKu-WngNpB44N9Lhx9lXZeptiO6dO-7BSk7-lHGk_-FVjEjVUR5m_XybnWSuNppWruydzgVXJrOgvhfSLKmhcWzRfNoaAf_m8yqovfdHhUqC0pbNQsQbSUE08MxoukjPA==","impact":"high","tags":["AI検索","著作権","コンテンツ保護"]},{"title":"NECとCrypto Garage、国産のデジタル資産カストディシステム開発に向けて協業","summary":"日本電気株式会社（NEC）と株式会社Crypto Garageは、国産のデジタル資産カストディシステム開発に向けて協業しました。本システムは、金融機関や機関投資家、企業向けに、金融商品取引法の改正を見据え、高い信頼性と高度なセキュリティを両立することを目指しています。両社は2026年内にシステム開発に着手し、2027年中に予定されている法改正施行後の速やかな稼働開始を目指しており、国内のデジタル資産市場のインフラ強化に貢献します。開発者にとっては、国内のWeb3・ブロックチェーン技術のインフラ整備が進むことで、新たなサービス開発の機会が生まれることを示唆しています。","source":"起業の「わからない」を「できる」に","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQEb4eghRcRwrBC49PNjki_s3Ls_YZPBxotJCcrIQ2fxwETpxbW16KA5ZcRSqbc6PmV0cLqYTi9b0cDtN02ajXk_LUOrEGN15VdZD3cjS10M0Du1nvQehM4E2KWdegJV_72BhJlx8mDhSBQArk4=","impact":"medium","tags":["デジタル資産","カストディ","ブロックチェーン"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
