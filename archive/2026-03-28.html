<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月29日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>

ルTop10が発表","summary":"AIを活用した最新のコーディング環境に関する記事が公開され、2026年におすすめの開発ツールTop10が紹介されました。特に、Postmanの無料プラン大幅制限の発表は開発者界隈に大きな影響を与え、既存のツール環境を見直す動きが加速しています。複雑化するAPI連携や環境構築のオーバーヘッドを削減するため、AIを活用した効率的な開発ワークフローの再構築が求められています。個人開発者やインディーハッカーは、これらの最新ツールを導入することで、開発効率を大幅に向上させることができるでしょう。","source":"テックメディア","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQHaErgpRoAulss860vQ7q_frHy6r4yfK6VSfZte0IUmXOrNU5Z5B8O3DodFaKaLkuzKTOurG0GBO7aKZO0fTGNsLsurHNyHDK_zrZjEd1l8kg7otgUjyBMgf9Hzz5bqmPOGRNaN-3BmHFkYoUQXl-TNC1DhqoB9-qhlt5vskXBiLPd5e0JPeTk7HdKRbzYy_Q==","impact":"medium","tags":["開発ツール","AIコーディング","生産性向上"]},{"title":"東京都が再起業特化型アクセラレーション『TOKYO Re:STARTER 2026』参加者を募集","summary":"東京都は、再起業家を支援するアクセラレーションプログラム『TOKYO Re:STARTER 2026』の参加者募集を開始しました。このプログラムは、過去の失敗経験を「次なる成功への確信」へと転換させることを目的とし、アイデア段階からの資金調達完了や、ピボットによる初期トラクション獲得といった具体的な成果を多数創出しています。エンジニアやデザイナーによる実務代行、起業経験を持つ専属メンターによる1on1サポート、審査制コミュニティの提供など、事業の垂直立ち上げを徹底的に伴走支援します。個人開発者やインディーハッカーにとって、再起業のチャンスと強力なサポートを得られる貴重な機会となるでしょう。","source":"東京都","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFt6ma_rJKFkNe7O1ju-5gutSIDcq4-ZwIV1BHB4EOolSWn6WosYTf1GiClfA3TEybUIFPmOwfnpPwNxIw6LXifWubq7lc9bfiNCCvWvlyTWravjSSiP6WYLpu2PXnjhL3BH4JRpt7RtiGkSLN0Zg0_hj6ivQ==","impact":"medium","tags":["再起業","アクセラレーション","スタートアップ支援"]},{"title":"AIコーディングで生産性向上、開発者の役割は「判断と責任」へ変化","summary":"AIコーディングツールの進化により、開発者は「書く苦労」から解放されつつありますが、同時に「判断と責任」という新たな役割が課されるようになっています。AIが生成したコードの理解力、テスト、レビューといった開発プロセス全体への知識が必要不可欠となり、開発者一人ひとりがプロジェクトリーダー的な視点を持つことが求められます。AIエージェントを活用することで、単体テストの自動生成やデバッグ作業の効率化が可能になり、人間では困難な作業もAIが文句を言わずに実行してくれるため、大幅な生産性向上が見込まれます。個人開発者もこの変化に適応し、AIを最大限に活用するスキルを磨くことが重要です。","source":"テックメディア","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGHEY1xSyxPRcxNdu2I336NoZnSX6JqfOpAvULmQZh1x4e_EoSpjLiGBkgmXuDkY811oZUhVhOx9Ml7jxgkzWHzpc5eXUAb1Lde5w-pxkXTELa61Kvr7yDY-1-wYOfk3c07l8ScZE54KkiWw-dMx7cdJrWGmjU01sKWNQ==","impact":"high","tags":["AIコーディング","開発者役割","生産性向上"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"ソフトバンクグループ、米国でのAIデータセンター建設に80兆円を投資","summary":"ソフトバンクグループは、米国でのAI（人工知能）向けデータセンター建設におよそ80兆円を投じると発表しました。孫正義会長兼社長は、オハイオ州で建設するガス火力発電所の起工式で、同じ敷地内にAI向けデータセンターを整備する構想を明らかにしています。運用に必要な大量の電力は建設する発電所から供給され、年内の着工を目指します。この巨額投資は、AIインフラ競争の激化と、AIが次なる産業革命のエンジンであるというNVIDIA CEOのジェンスン・フアン氏の発言を裏付ける動きとして注目され、今後のAI産業の発展に大きな影響を与えるでしょう。","source":"ソフトバンクグループ","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQGw4GMk4zCQyMe_qn2l9nSHnZQUXBY53RFwIZcvRewEXHiAPkJX7vlmH68y_DXyKv3ZGlRQtl0Dw9vSDdWg3FKuNCRUzEBSNhKUByOYr691bNMPvqdPMSaDDgmQzp4KQ-_d30wTvQ==","impact":"high","tags":["AIデータセンター","ソフトバンク","巨額投資"]},{"title":"Cellid、ARグラスの軽量化・高性能化技術で東京都の成長加速プログラムに採択","summary":"次世代デバイスとして注目されるARグラスの開発を手がけるCellid株式会社が、東京都の成長加速プログラムに採択されました。Cellidは、ARグラスの軽量化・高性能化を実現する独自のウェイブガイド（ARグラス用レンズ）技術および空間認識エンジンを強みとしており、国際的な評価も得ています。この採択は、ARグラスの実用化に向けた技術開発と社会実装への取り組みが評価されたものであり、今後のAR/VR分野の発展を加速させる一歩となります。開発者にとっては、ARグラス向けアプリケーション開発の機会が増える可能性を示唆しています。","source":"Cellid株式会社","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFRWO8PcPQhh1IVHZS0T3nG6SC8DzL0Yb1yGXVgWz18RNRLDqv-pxEY1dxCbDusJGH4YiU8lbpZq4tVpPbAy7plA7xinaG8DSx_MQXcuSpiXRxu3DGD1GuzusmGOL0kcCug3Ov1vdRisdtE-YrD3kRjCWbnYg==","impact":"medium","tags":["ARグラス","次世代デバイス","東京都プログラム"]},{"title":"ランサムウェア被害の傾向と対策：多層的な防御とバックアップの重要性","summary":"ランサムウェア攻撃の手口が巧妙化しており、「身代金を払えば終わり」という時代は終わりを告げています。最近の攻撃は、二重恐喝による情報漏洩リスクや、RaaS（Ransomware as a Service）による犯罪の分業化が特徴です。特に中小企業は標的になりやすく、基本的な対策の徹底が不可欠です。具体的な対策としては、パッチ適用の徹底、不要なサービスの停止、アクセス制御の見直しに加え、ネットワーク分割による被害拡大の防止、そしてオフライン環境でのバックアップと定期的な復元確認が挙げられます。開発者もセキュリティ意識を高め、安全なシステム設計を心がけることが重要です。","source":"セキュリティ情報サイト","url":"https://vertexaisearch.cloud.google.com/grounding-api-redirect/AUZIYQFtKjIr4objv0RAwbEQ-zU9bSDqC2tGiaCljOQp7rMKdEbIEZWwS2P0WD1E1l1a2bLtOpPfjaHrRs-EXz_lKyUh5MdJiOGZ-TjSWQFvFt-j35PXrsnnJlf6mKlk1q-HC3Uh0Dcd4OTSaoOFBoBzbXlETPBgW26cjVfK_ek-jn0=","impact":"high","tags":["ランサムウェア","サイバーセキュリティ","データ保護"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
