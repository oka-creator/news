<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月5日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年3月5日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"ギブリーが生成AI・AIエージェント活用プラットフォーム「MANA Studio」を更新、最新LLMに対応","summary":"ギブリーは、生成AI・AIエージェント活用プラットフォーム「MANA Studio」をアップデートし、Googleの「Gemini 3 Flash」「Gemini 3.1 Pro」やAnthropicの「Claude Opus 4.6」「Claude Sonnet 4.6」といった最新LLMに対応させました。これにより、ユーザーは複数のLLMから最適なモデルを選択でき、モデルを切り替えても会話履歴が途切れない点が特長です。このアップデートは、企業における生成AIの法人活用支援を強化し、業務シーンに合わせた柔軟なAI活用を促進します。開発者にとっては、最新かつ多様なLLMを統合したプラットフォームを通じて、より高度なAIエージェントやアプリケーションを効率的に構築できるようになるでしょう。","source":"ギブリー","url":"https://givery.co.jp/news/20260303_1/","impact":"medium","tags":["生成AI","LLM","プラットフォーム"]},{"title":"Googleが低コストLLM「Gemini 3.1 Flash-Lite」を発表、AIエージェント用途を想定","summary":"Googleは、Gemini 3シリーズで最速かつ最もコスト効率の良いモデル「Gemini 3.1 Flash-Lite」を発表しました。このモデルは、翻訳、モデレーション、UI生成、シミュレーション、AIエージェントといった幅広い用途を想定しており、前モデルと比較して初回トークン速度が2.5倍、出力速度が45%向上しています。低コストかつ高速なこのLLMの登場は、AIアプリケーション開発者にとって、大規模なAIサービスの基盤構築をより手軽にすることを可能にします。特に、コストと速度が重視されるAIエージェントやリアルタイム処理が必要なアプリケーションの開発に大きな影響を与えるでしょう。","source":"note","url":"https://note.com/yu_ai/n/na817454f4a3c","impact":"high","tags":["Google Gemini","LLM","AIエージェント"]},{"title":"メルカリ、生成AIを用いた絞り込み検索機能を導入し「検索疲れ」を解消","summary":"フリマアプリ「メルカリ」は、2026年3月4日から生成AIを用いた新しい絞り込み検索機能の提供を開始しました。この機能により、ユーザーは自然な言葉（自然言語）でリクエストを入力するだけで、生成AI（LLM）が意図を理解し、最適な商品を絞り込むサポートを受けられるようになります。例えば、「予算1万円以内で探して」や「使用感の少ない、きれいな状態のものだけにして」といった曖昧な表現でも目的の商品に辿り着けるようになり、累計出品数40億品を超える膨大な商品の中から希望の商品を見つけやすくなります。これは、ユーザー体験を大幅に向上させるだけでなく、生成AIの具体的なビジネス活用事例として、開発者にとっても参考になるでしょう。","source":"PR TIMES","url":"https://prtimes.jp/main/html/rd/p/000000001.000000000.html","impact":"medium","tags":["生成AI","UX改善","検索機能"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"AIによる開発時間の劇的な短縮がインディーハッカーに追い風","summary":"AIコーディングツール、特に「Claude Code」のようなツールの普及により、開発時間が3〜5倍に劇的に短縮され、インディーハッカーやソロ開発者が数日で複雑な製品を構築・リリースできる時代が到来しています。「XPilot」というAI搭載の個人ブランドコパイロットの例では、AIがコンテンツ作成、スケジューリング、アルゴリズム分析を自律的に行い、開発者が短期間で複数のプロジェクトをこなせる「超人的な生産性」を実現しています。これは、個人開発者がアイデアを迅速に形にし、市場に投入する能力を飛躍的に高めるものであり、インディーハッカーにとって非常に大きな追い風となるでしょう。","source":"alex.party","url":"https://alex.party/the-perfect-time-to-build","impact":"high","tags":["AIコーディング","生産性向上","インディーハッカー"]},{"title":"「観客一人」から始める開発哲学：AI時代のインディーハッカーの新戦術","summary":"AI時代において、インディーハッカーには「自分の痛みを解決するツールを作り、それを使い続ける」という「観客一人」の開発哲学が新たな戦術として注目されています。これは、従来のスタートアップのようにプロダクト・マーケット・フィットを追求するのではなく、自分自身のニーズを満たすツール開発に焦点を当てることで、外部からのフィードバックを待たずに「完成」を判断できるというものです。このアプローチは、持続可能な開発サイクルを生み出し、開発者が自身の情熱に基づいたプロジェクトを継続的に進めることを可能にします。AIツールによる開発効率の向上と相まって、この哲学は個人開発の新たな道を切り開くでしょう。","source":"note","url":"https://note.com/koro_net/n/n4a6f7b30c1d1","impact":"medium","tags":["開発哲学","自己解決","持続可能性"]},{"title":"インディーハッカー向けSaaSスタック2026：無料で構築・ローンチするための完全ツールキット","summary":"2026年のインディーハッカー向けSaaS開発では、AIコーディングツール（Cursor、Claude Codeなど）、無料で利用できるプラットフォーム（Supabase、Vercel、Resendなど）、そしてボイラープレートスターターを活用することで、アイデアからSaaSのデプロイまでを週末で実現可能とするツールスタックが紹介されています。これにより、開発者はツールの選定や過剰な設計に時間を費やすことなく、迅速なMVP（Minimum Viable Product）のローンチとユーザーからのフィードバックに基づくイテレーションに集中できます。この無料かつ効率的なツールキットは、資金力のない個人開発者でも高品質なSaaSを市場に投入できる機会を大きく広げます。","source":"TLDL","url":"https://tldl.substack.com/p/indie-hacker-saas-stack-2026","impact":"high","tags":["SaaS開発","無料ツール","MVP"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"COMPUTEX 2026が複数会場で同時開催、「AI Together」をテーマにAI技術の未来を描く","summary":"2026年6月2日から5日まで開催されるCOMPUTEX 2026は、初めて台北南港展第1・第2展示ホールと台北国際会議センター（TICC）の2会場で同時開催されます。「AI Together」をテーマに掲げ、「AIコンピューティング」「ロボティクス＆スマートモビリティ」「次世代テクノロジー」の3大コア分野に焦点を当て、AIサプライチェーン、先端通信技術、スマートソリューションなどの最新トレンドが紹介されます。ASUS、Acer、MSIなどの主要ブランドがソフトウェアとハードウェアを融合したAIソリューションを披露する予定であり、これはAI技術の広範な進化と産業への統合を示す重要なイベントとなるでしょう。","source":"共同通信PRワイヤー","url":"https://kyodonewsprwire.jp/release/202603047535","impact":"medium","tags":["COMPUTEX","AI技術","テクノロジーイベント"]},{"title":"MWC 2026でTongyuが空・地・宇宙の統合フルシナリオ・ソリューションを展示","summary":"アンテナおよびRFソリューションの世界的リーダーであるTongyu Communicationは、MWC Barcelona 2026にて、「Intelligent Connectivity, Greening the Future（インテリジェントな接続性、未来のグリーン化）」をテーマに、地上、空中、および宇宙領域を網羅する多次元的な通信技術革新を発表しました。同社は、5G-A/6G向けの超大容量統合ソリューションや、持続可能なネットワーク進化のためのグリーン・インテリジェント・ソリューションなどを展示し、グローバルネットワークの進化における「究極のパフォーマンス」「グリーンな持続可能性」「インテリジェントな接続性」に取り組む姿勢を示しました。これは、次世代通信技術の方向性を示すものであり、開発者にとっては新たなインフラやサービス開発のヒントとなる可能性があります。","source":"PR Newswire","url":"https://www.prnewswire.com/jp/news-releases/tongyu-showcases-integrated-air-ground-space-full-scenario-solutions-at-mwc-2026-shaping-a-smart-and-green-future-300000000.html","impact":"medium","tags":["MWC","5G/6G","通信技術"]},{"title":"AppleがAI処理能力を大幅強化した新型MacBook Pro（M5 Pro / M5 Max）を発表","summary":"Appleは2026年3月3日、M5 Pro / M5 Maxチップを搭載した新型MacBook Proを発表しました。このモデルは、AI処理能力の大幅強化、高性能GPU、オンデバイスAI処理の最適化など、AI時代を前提とした性能強化が行われています。生成AIや動画編集などの重いクリエイティブ作業を想定した設計となっており、AppleのAI戦略を象徴する製品と言えます。開発者にとっては、ローカルでのAIモデル実行や複雑なクリエイティブアプリケーションのパフォーマンスが向上し、より高度な開発環境が提供されることを意味します。","source":"note","url":"https://note.com/time_free_worker/n/n9a8d56b0d912","impact":"high","tags":["Apple","MacBook Pro","AIチップ"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
