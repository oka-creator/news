<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年7月2日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年7月2日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"富士通、GPU効率を最大475倍に高めるポストTransformer新アーキテクチャ『PHOTON』を発表","summary":"富士通が大規模言語モデル（LLM）のGPU効率を最大475倍に向上させる新しいアーキテクチャ「PHOTON」を発表しました。この技術は、2026年7月2日から米国サンディエゴで開催される国際会議「ACL 2026」で発表される予定です。PHOTONは、同じ問題に対して複数の質問や候補を作成し、その結果を統合することで、従来のTransformerと同水準の性能を維持しつつ、GPUリソース、消費電力、運用コストの大幅な削減に貢献すると期待されています。これは生成AI技術のさらなる普及と実用化を加速させる画期的な進展であり、開発者にとってはより効率的でコスト効果の高いAIモデル開発が可能になるでしょう。","source":"Ledge.ai","url":"https://ledge.ai/fujitsu-photon-acl2026/","impact":"high","tags":["生成AI","LLM","GPU効率","新アーキテクチャ","富士通"]},{"title":"Anthropic、『Claude Fable 5』および『Claude Mythos 5』のグローバル提供を再開","summary":"Anthropicは、米国政府による輸出規制が解除されたことを受け、高性能モデル「Claude Fable 5」とセキュリティ特化モデル「Claude Mythos 5」のグローバル提供を2026年7月1日より全面的に再開しました。一時的な提供停止は安全保障上の懸念によるものでしたが、政府との厳格な安全保障義務への合意を経て再開に至りました。Fable 5は一般向けに厳格な安全分類器を実装している一方、Mythos 5はそれを排除し、本来の推論能力を最大限に引き出す設計となっています。この再開は、AIモデルの安全性と国家安全保障を巡る国際的な動向を示すものであり、開発者はAnthropicの最新モデルを再び利用できるようになります。","source":"note (Daily AI Report), ビジネス+IT","url":"https://note.com/daily_ai_report/n/n2b2d0e7a1b0a","impact":"medium","tags":["Anthropic","Claude","LLM","AI規制","グローバル展開"]},{"title":"2026年7月2日 AIニュース：エージェント基盤、生成メディア、AI規制が実務段階へ","summary":"今日のAIニュースは、単なるモデル性能競争から、エージェントを安全に稼働させる基盤技術、生成メディアのビジネス利用、そしてAI生成コンテンツの透明性確保といった実務的な側面に焦点が移っていることを示しています。Google Cloudのremote MCPサーバー、AnthropicのClaude Sonnet 5、NVIDIA BioNeMo Agent Toolkit、IBM Researchの取り組みなどが例として挙げられています。これは、企業が生成AIを「試験導入」から「全社展開」へと移行する中で直面する、セキュリティ、運用コスト、倫理的課題への対応が喫緊の課題となっていることを反映しています。開発者は、単なるモデル開発だけでなく、これらの実務的な課題解決に向けた技術やツールへの理解と対応が求められるでしょう。","source":"eguweb","url":"https://eguweb.jp/ai-news-20260702/","impact":"high","tags":["AIエージェント","生成メディア","AI規制","実務応用","企業AI"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"“エレベーター待ち地獄”解消ハッキングシム『Elegorithm』発表","summary":"個人ゲーム開発者のカリヤ・ズッキーニ氏が、エレベーターの運行システムをハッキングして最適化を目指すシミュレーションゲーム『Elegorithm(エレゴリズム)』を6月27日に発表しました。本作では、プレイヤーがノードを組み替えることでエレベーターの効率を改善し、乗客のラッシュを捌くことを目指します。朝・昼・夜で変化する乗客の流れに対応するため、「急行ドライブ機構」や「大型キャビン拡張」などのパッチを選択して、AIメモリを増設しながらシステムを最適化していくという、実践的な問題解決が求められる内容です。これは、インディーゲーム開発におけるユニークなアイデアとシステム設計の成功例として注目されます。","source":"AUTOMATON","url":"https://automaton-media.com/articles/newsjp/20260629-295325/","impact":"low","tags":["インディーゲーム","シミュレーション","ゲーム開発","エレベーター","ハッキング"]},{"title":"ほとんど宣伝しなかったのに大ヒットしたインディーゲーム『Garbage Growth』の成功要因","summary":"インディーゲーム『Garbage Growth』の開発者apepatrick氏が、ほとんど宣伝に時間をかけなかったにもかかわらず、想定をはるかに超えるロケットスタートを切ったと報告しました。Steamのウィッシュリスト登録件数が売上に直結しないケースが多い中、同作はウィッシュリストを大きく上回る初動売上を記録しました。開発者は「フィードバックをゲームに反映するのが大事」と成功の秘訣を語っており、小規模タイトルにおける口コミの影響力の強さを示す事例となりました。これは、個人開発者がマーケティングよりもゲームの面白さに注力することが、結果的に成功に繋がる可能性を示唆しています。","source":"AUTOMATON","url":"https://automaton-media.com/articles/newsjp/20260627-295058/","impact":"medium","tags":["インディーゲーム","成功事例","マーケティング","ゲーム開発","Steam"]},{"title":"Unityエディタで動作する音声波形編集ツール「AudioTailor」が公開","summary":"Unity Technologiesの高橋啓治郎氏が、Unityエディタ上で音声波形を直接編集できるツール「AudioTailor」をGitHubにて公開しました。このツールはUI Toolkitで実装されており、Unity開発者がゲーム内で使用する音声アセットの編集作業を効率化できる実用的なツールです。インディーゲーム開発者にとって、外部ツールに頼らずUnity内で完結できる作業が増えることは、開発ワークフローの簡素化と生産性向上に直結します。これにより、開発者はよりスムーズに音声アセットを管理し、ゲーム開発に集中できるようになります。","source":"IndieGamesJp.dev","url":"https://indiegamesjp.dev/archives/16905","impact":"medium","tags":["Unity","ツール","音声編集","個人開発","GitHub"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"フィンテック企業Plaid、80億ドル評価額を受け米国IPOを検討中","summary":"フィンテック企業のPlaid Inc.が、今年初めの資金調達ラウンドで80億ドルの評価額を獲得した後、新規株式公開（IPO）を検討していると報じられました。同社は、フィンテックアプリケーションが顧客口座に接続できるネットワークを運営しており、消費者が複数の金融機関にまたがるデータを連携できるサービスで知られています。最近ではOpenAIとの提携も発表し、ChatGPTを利用する消費者にパーソナライズされた財務アドバイスを提供するサービスを開始しています。IPOが実現すれば、フィンテック業界におけるPlaidのさらなる成長戦略に注目が集まり、開発者は同社のAPIやサービスを活用した新たな金融アプリ開発の機会が増える可能性があります。","source":"Investing.com","url":"https://jp.investing.com/news/stock-market-news/article-960256","impact":"medium","tags":["フィンテック","IPO","Plaid","OpenAI提携","金融サービス"]},{"title":"Meta、余剰AI計算能力の外部販売を検討し、AIインフラ投資の回収へ","summary":"Metaは、AI向けの計算能力や自社モデルへのアクセスを外部販売するクラウド事業を検討していると報じられています。同社はデータセンターに巨額の投資を進めているものの、AIサービス単体での収益はまだ大きく示されていません。この取り組みが実現すれば、AWS、Google Cloud、Microsoft Azureといった既存のクラウドプロバイダーに対抗し、AIインフラ投資の新たな回収手段となる可能性があります。これは、AI開発競争が激化する中で、各社が投資回収と収益化を模索する動きの一環であり、開発者にとっては新たなAI計算リソースの選択肢が増えることを意味します。","source":"The HEADLINE","url":"https://theheadline.jp/articles/2397","impact":"high","tags":["Meta","AIインフラ","クラウドサービス","AI計算能力","収益化"]},{"title":"IBM、世界初の1nm未満チップ技術「ナノスタック」を発表","summary":"IBMが、世界で初めて1nm未満のチップ技術「ナノスタック」を発表しました。これは3D構造でAIの処理速度を大幅に向上させる革命的な技術であり、現在の最先端とされる2〜3nmのチップをさらに微細化し、同じスペースにより多くの回路を詰め込むことで、AIの高速化に貢献します。この技術は、AI分野だけでなく、あらゆるコンピューティング分野において性能向上と省電力化を促進し、今後のテクノロジーの進化に大きな影響を与えます。開発者にとっては、将来的に利用できるハードウェアの性能が飛躍的に向上し、より複雑で高性能なアプリケーションの実現が可能になるでしょう。","source":"YouTube (2026年7月1日国内世界最新TECHニュース)","url":"https://www.youtube.com/watch?v=Fj-x6S3_K4Q","impact":"high","tags":["IBM","半導体","1nm未満","ナノスタック","AI高速化"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
