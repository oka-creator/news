<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年3月11日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年3月11日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"デジタル庁、政府向け生成AI基盤「源内」で国産LLM7モデルを選定し、約18万人規模で大規模実証へ","summary":"デジタル庁は2026年3月6日、政府向け生成AI利用環境「源内」で試用する国産大規模言語モデル（LLM）として、NTTの「tsuzumi 2」など計7モデルを選定しました。全府省庁39機関・約18万人の職員を対象に大規模な実証実験が行われ、行政業務におけるAIの活用を本格化させる狙いです。これは、政府機関におけるAI導入の具体的な進展を示すものであり、国産LLMの信頼性と実用性が試される重要なステップとなります。開発者にとっては、政府調達における国産技術の動向や、大規模な実証環境でのLLMの性能評価に関心が高まるでしょう。2026年5月ごろに実証を開始し、8月ごろから国産LLMの試用が始まる予定です。","source":"Ledge.ai","url":"https://ledge.ai/digital-agency-domestic-llm-gennai/","impact":"high","tags":["国産LLM","デジタル庁","政府AI基盤","大規模実証"]},{"title":"OpenAIが最新モデル「GPT-5.4」を公開、プロフェッショナル業務対応力と回答精度が大幅向上、ハルシネーション33%減","summary":"OpenAIは2026年3月6日、最新AIモデル「GPT-5.4」を発表しました。このモデルは、プロフェッショナルな業務への対応力と回答の正確性が大幅に強化されており、ハルシネーション（誤情報生成）の発生率も旧モデル比で33%低減されています。GDPvalベンチマークで業界専門家と同等以上の精度を83.0%のタスクで達成したことは、実用性の向上を強く示唆しています。開発者にとっては、より信頼性の高いAIモデルをアプリケーションに組み込むことが可能になり、特に企業向けソリューション開発において大きな影響を与えるでしょう。AIの信頼性向上は、幅広い分野でのAI活用を加速させる重要な進展です。","source":"PR TIMES (OpenAI)","url":"https://prtimes.jp/main/html/rd/p/000000007.000134446.html","impact":"high","tags":["OpenAI","GPT-5.4","LLM精度","ハルシネーション低減"]},{"title":"MicrosoftがMicrosoft 365 CopilotにAnthropicのClaude技術を導入、AIエージェント強化とモデル多様化を推進","summary":"Microsoftは、AIエージェントの強化に向けてMicrosoft 365 Copilot環境にAnthropicのAIサービス「Claude Cowork」を統合することを発表しました。これにより、Microsoft 365 CopilotユーザーはAnthropicのClaude Sonnetモデルも利用できるようになります。これは、これまで主にOpenAIのGPTモデルを利用してきたCopilotのAIモデル多様化戦略の一環と見られており、企業の業務をAIが自律的に処理するAIエージェント分野での競争が激化しています。開発者にとっては、Microsoftエコシステム内で利用可能なAIモデルの選択肢が増え、特定のタスクに最適なモデルを選べるようになるため、より柔軟なAIソリューション構築が可能になるでしょう。","source":"AIまとめブログ","url":"https://aimatome.blog/ai-news-20260310/","impact":"medium","tags":["Microsoft Copilot","Anthropic Claude","AIエージェント","モデル多様化"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"個人開発者Nikoru氏、AIと協力して占いを行うナラティブライフシミュレーションゲーム「Moon Reader」を2026年内にリリースと発表","summary":"個人開発者のNikoru氏は2026年3月7日、開発中の新作タイトル「Moon Reader」を2026年内にリリースすると発表しました。本作は、月面コロニーに住む占い師として、違法すれすれのAI「MACHI」と協力し、クライアントの生体認証データや財務履歴などの情報を収集して占いを行うナラティブライフシミュレーションゲームです。プレイヤーの選択によって物語が変化するとのことです。このニュースは、個人開発者がAIをゲームの核となる要素として活用し、ユニークなゲーム体験を創出している好例を示しており、インディーハッカーにとってAIを活用した新しいコンテンツ開発のヒントとなるでしょう。","source":"4Gamer.net","url":"https://www.4gamer.net/games/999/G999905/20260309003/","impact":"medium","tags":["個人開発","AIゲーム","ナラティブ","インディーゲーム"]},{"title":"生成AIのプロが教える、ChatGPTの「最も効率的な使い方」とは？デスクリサーチ特化型AIエージェント提供のDeskrex冨田氏が解説","summary":"デスクリサーチに特化した生成AIエージェントを提供する株式会社Deskrexの代表取締役である冨田到氏が、ChatGPTの最も効率的な使い方について解説しています。AIエージェントを活用する際に、いちいち自分の情報をプロンプトに組み込むのではなく、AIが自律的に情報を収集・処理する仕組みの重要性が指摘されています。これは、個人開発者やインディーハッカーがAIを自身のプロジェクトや業務効率化に活用する上で非常に実践的な情報となります。AIを単なるチャットボットとしてではなく、自律的なエージェントとして活用する視点は、開発効率を大幅に向上させる可能性を秘めています。","source":"Newsweek Japan","url":"https://www.newsweekjapan.jp/stories/technology/2026/03/ai-chatgpt_1.php","impact":"medium","tags":["ChatGPT活用","AIエージェント","業務効率化","プロンプトエンジニアリング"]},{"title":"ベリサーブが“人×AI”でAI駆動開発時代のソフトウェア品質を保証するテスト設計エージェント「TESTRA」のPoC版を提供開始","summary":"株式会社ベリサーブは2026年3月10日、自然言語で書かれた仕様書からテストモデルやテストケースを自動生成するSaaS型プロダクト「TESTRA」のPoC版を提供開始しました。このプロダクトは「HITL（Human In The Loop：AIと人間の協調）」の考え方に基づき、AIが生成した内容を人間がレビュー・修正することで、テストケース自動生成の経緯を可視化し、監査対応や顧客への説明責任を果たすことを可能にします。ソフトウェア開発におけるテスト工数を約60％削減できるとされており、品質保証を重視する個人開発者にとって実用的なツールとなり得ます。AIを活用したテスト自動化は、開発プロセス全体の効率化と品質向上に貢献するでしょう。","source":"ベリサーブ","url":"https://www.veriserve.co.jp/news/2026/0310_testra_poc.html","impact":"medium","tags":["AIテスト自動化","ソフトウェア品質","PoC","開発効率化"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"KDDI、お客さまセンターの応対実績を基に独自開発した自律型AIエージェントによるお問い合わせ対応を開始","summary":"KDDIは2026年3月10日から、お客さまセンターのお問い合わせ対応実績を基に独自開発した自律型AIエージェントによるお問い合わせ対応を開始しました。生成AIとデジタルヒューマンを組み合わせたオンラインサポート「auサポート AIアドバイザー」やチャットサポートで活用されます。本AIエージェントは、お客さまが迷いやすいポイントや課題を抽出し、応対手順を自律的に判断して解決方法を案内することで、会話に近い表現で疑問解決をサポートします。これは、大規模企業におけるAIを活用した顧客対応の進化を示すものであり、開発者にとっては、実運用におけるAIエージェントの設計や効果測定の事例として参考になるでしょう。","source":"KDDI","url":"https://news.kddi.com/kddi/corporate/newsrelease/2026/03/10/7982.html","impact":"high","tags":["KDDI","AIエージェント","顧客サポート","自律型AI"]},{"title":"パナソニック エナジー、AI時代を支えるデータセンター向け蓄電システム事業を強化、2028年度に売上8,000億円規模目指す","summary":"パナソニック エナジー株式会社は、AI向け高性能サーバーの世界的な導入拡大に伴うデータセンターの電力確保課題に対応するため、データセンターの安定稼働に貢献する蓄電システム事業を強化しています。今後の需要拡大を見据え、国内外の生産供給体制の強化を進め、次世代に向けた提案力と開発力でシステムを進化させ、2028年度には同事業で売上8,000億円規模を目指す計画です。この動きは、AI技術の発展がインフラ面にもたらす巨大な影響を示しており、データセンターの電力効率や安定性に関わる技術開発が今後さらに重要になることを示唆しています。開発者にとっては、AIインフラを支えるハードウェアやエネルギー管理技術への関心が高まるでしょう。","source":"Panasonic Japan","url":"https://news.panasonic.com/jp/stories/2026/03/10/11832","impact":"high","tags":["データセンター","蓄電システム","AIインフラ","パナソニック"]},{"title":"au、新しい「iPad Air」を3月11日に発売","summary":"KDDIは、超高速なパフォーマンス、より大容量のメモリ、強化された接続性、iPadOS 26の次世代の機能により、さらなる価値を提供する新しいiPad Airを取り扱います。M4を搭載したiPad Airは、auのiPad取扱店、ホームページ、オンラインショップにて、2026年3月11日午前8時に発売されます。この新製品の発売は、モバイルデバイス市場における最新技術の動向を示すものであり、特にM4チップの搭載は、より高性能なアプリケーション開発やAI処理のオンデバイス実行の可能性を広げます。開発者にとっては、新しいハードウェアの性能を最大限に活用したアプリやサービスの開発機会が増えることを意味します。","source":"KDDI","url":"https://news.kddi.com/kddi/corporate/newsrelease/2026/03/03/7978.html","impact":"low","tags":["iPad Air","M4チップ","au","モバイルデバイス"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
