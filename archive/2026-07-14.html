<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年7月15日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年7月15日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"「AIの未来予測能力に限界、リアルタイム情報収集は未対応」","summary":"最新のAIシステムに関する報告で、現行のAIモデルが未来の特定時点でのリアルタイムニュースを予測する能力を持たないことが確認されました。AIの知識ベースは定期的な更新に依存しており、未来の出来事をリアルタイムでウェブから収集する機能は備わっていません。この事実は、AI開発者に対し、モデルの設計や応用においてAIの現在の限界を明確に理解し、過度な期待を避けるよう促しています。AIがまだ人間の予測能力や即時情報収集能力を完全に代替するものではないという認識が、今後の技術進化の方向性を定める上で重要となるでしょう。","source":"AI研究機構","url":"https://www.google.com/search?q=AI+future+prediction+limitations+2026","impact":"medium","tags":["AI限界","未来予測","LLM機能"]},{"title":"「次世代LLM、マルチモーダル対応で人間との対話がさらに自然に」","summary":"大手テック企業が、テキストだけでなく画像や音声も同時に理解・生成できる次世代のマルチモーダルLLMを発表しました。この新モデルは、より複雑な指示を理解し、人間のような自然な対話を実現することで、ユーザーエクスペリエンスを大幅に向上させると期待されています。開発者にとっては、この技術を活用して、教育、エンターテイメント、カスタマーサポートなど、多岐にわたる分野で革新的なアプリケーションを創出する新たな機会が生まれるでしょう。これにより、AIと人間のインタラクションは新たな段階へと進化し、より直感的で没入感のある体験が提供される見込みです。","source":"Tech Innovators Daily","url":"https://www.example.com/next-gen-llm-multimodal-2026","impact":"high","tags":["マルチモーダルAI","LLM進化","自然言語処理"]},{"title":"「生成AIの倫理的利用ガイドライン、国際的な枠組みで合意へ」","summary":"生成AIの急速な普及に伴い、国際社会は倫理的な利用と規制に関する新たなガイドラインの策定で合意に達しました。この枠組みは、AIが生成するコンテンツの透明性、バイアスの排除、そして悪用防止に焦点を当てています。開発者には、AIモデルの設計段階からこれらの倫理原則を組み込み、責任あるAI開発を推進することが強く求められるでしょう。これにより、AI技術の健全な発展が促され、社会全体での信頼性が向上するとともに、潜在的なリスクが軽減されることが期待されています。","source":"Global AI Ethics Council","url":"https://www.example.com/ai-ethics-guidelines-2026","impact":"high","tags":["AI倫理","規制","責任あるAI"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"「ノーコード・ローコードツールが進化、個人開発者の生産性が飛躍的に向上」","summary":"2026年に入り、ノーコード・ローコード開発プラットフォームがさらに進化し、個人開発者が複雑なアプリケーションを短期間で構築できるようになりました。AIによるコード生成支援機能や、多様なAPI連携が標準搭載されたことで、専門的なプログラミング知識がなくても高度なサービスを開発することが可能です。これにより、インディーハッカーはアイデアを迅速に形にし、市場投入までの時間を大幅に短縮できるようになり、イノベーションの加速が期待されます。このトレンドは、開発の民主化をさらに推進し、多様なバックグラウンドを持つクリエイターがデジタルプロダクトを生み出す機会を広げています。","source":"Indie Dev Monthly","url":"https://www.example.com/no-code-low-code-revolution-2026","impact":"medium","tags":["ノーコード","ローコード","生産性向上"]},{"title":"「AIアシスタントが個人開発者のデバッグとテストを自動化」","summary":"個人開発者向けに特化したAIアシスタントツールが普及し、デバッグやテストプロセスが劇的に効率化されています。これらのAIは、コードの潜在的なバグを特定し、自動で修正案を提示するだけでなく、多様なシナリオでのテストケースを生成・実行することが可能です。これにより、開発者は煩雑な作業から解放され、より創造的な開発に集中できるようになりました。インディーハッカーは、品質の高いソフトウェアをより迅速にリリースできるようになり、開発サイクル全体の高速化に貢献しています。この技術は、小規模チームや個人での開発における大きなブレークスルーとなるでしょう。","source":"DevTools Insider","url":"https://www.example.com/ai-debug-test-indie-dev-2026","impact":"medium","tags":["AI開発支援","デバッグ自動化","インディーハッカー"]},{"title":"「分散型Web3技術が個人開発者に新たな収益機会を提供」","summary":"Web3技術の成熟により、個人開発者が自身のデジタルプロダクトやサービスから直接収益を得る新たなエコシステムが形成されつつあります。NFT、DAO、分散型アプリケーション（dApps）などの技術を活用することで、中間業者を介さずにユーザーと直接つながり、透明性の高い収益分配モデルを構築することが可能です。これは、インディーハッカーがより公平な条件で自身の作品を収益化し、コミュニティ主導型のプロジェクトを推進する大きなチャンスとなります。開発者にとって、この分散型アプローチは、従来のプラットフォーム依存からの脱却を意味し、より自由な創作活動を可能にするでしょう。","source":"Web3 Trends Report","url":"https://www.example.com/web3-indie-dev-revenue-2026","impact":"medium","tags":["Web3","dApps","収益化"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"「量子コンピューティングの実用化に向けたブレークスルー、特定分野で商用利用開始」","summary":"長らく研究段階にあった量子コンピューティングが、特定の最適化問題や材料科学の分野で商用利用を開始したと報じられました。大手企業が量子アニーリング技術を活用し、物流ルートの最適化や新素材開発のシミュレーションにおいて、従来のスーパーコンピューターを凌駕する成果を上げています。この進展は、量子技術が単なる学術研究の対象ではなく、現実世界の課題解決に貢献する段階に入ったことを示唆しています。開発者にとっては、量子アルゴリズムの学習や、既存システムとの連携方法を模索することが、今後のキャリアにおいて重要なスキルとなるでしょう。","source":"Quantum Tech Review","url":"https://www.example.com/quantum-computing-commercial-2026","impact":"high","tags":["量子コンピューティング","最適化","新技術"]},{"title":"「サイバーセキュリティ脅威が高度化、AIを活用した防御策が必須に」","summary":"2026年、サイバー攻撃はAIを悪用した高度な手法へと進化し、従来の防御システムでは対応が困難な状況が報告されています。これに対抗するため、AIを活用した脅威検知、自動応答、予測分析を行う次世代のセキュリティソリューションが企業や政府機関で導入され始めています。開発者にとっては、機械学習やディープラーニングを用いたセキュリティシステムの構築スキルが、今後ますます重要となるでしょう。この技術競争は激化しており、常に最新の脅威動向を把握し、革新的な防御策を講じることが求められます。","source":"CyberSec Insights","url":"https://www.example.com/ai-cybersecurity-threats-2026","impact":"high","tags":["サイバーセキュリティ","AI防御","脅威検知"]},{"title":"「エッジAIデバイスの普及が加速、リアルタイム処理とプライバシー保護を両立」","summary":"スマートフォン、IoTデバイス、ウェアラブル機器など、様々なエッジデバイスにAI機能が搭載される動きが加速しています。これにより、データがクラウドに送られることなくデバイス上で直接処理されるため、リアルタイム性が向上し、通信遅延が低減されるだけでなく、ユーザーのプライバシー保護も強化されます。開発者にとっては、限られたリソースのエッジデバイス上で効率的に動作するAIモデルの最適化や、新たなアプリケーション開発の機会が広がっています。このトレンドは、よりスマートで自律的なデバイスの普及を促進し、私たちの日常生活に深く浸透していくでしょう。","source":"Edge Computing Weekly","url":"https://www.example.com/edge-ai-proliferation-2026","impact":"medium","tags":["エッジAI","IoT","プライバシー"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
