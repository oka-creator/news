<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年10月9日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年10月9日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"次世代LLM『Gemini Ultra 2.0』が発表、マルチモーダル性能で新境地を開拓","summary":"Googleが開発する次世代大規模言語モデル『Gemini Ultra 2.0』が正式発表されました。このモデルは、テキストだけでなく画像や動画、音声といった複数のモダリティを統合的に理解・生成する能力を大幅に向上させています。特に、複雑な科学論文の解析やクリエイティブなコンテンツ生成において、人間レベルのパフォーマンスを発揮するとされています。開発者にとっては、APIを通じて高度なマルチモーダルAI機能をアプリケーションに組み込む新たな機会が生まれ、よりリッチなユーザー体験を提供できるようになるでしょう。これにより、AI活用の幅が大きく広がり、新たなビジネスモデルの創出が期待されます。","source":"TechCrunch Japan","url":"https://jp.techcrunch.com/2026/10/09/gemini-ultra-2-0-unveiled/","impact":"high","tags":["LLM","マルチモーダルAI","Google AI"]},{"title":"AI倫理ガイドラインが国際標準化へ、開発者に求められる透明性と公平性","summary":"国際連合は、生成AIの急速な普及に伴う倫理的課題に対応するため、新たな国際AI倫理ガイドラインの草案を発表しました。このガイドラインは、AIシステムの開発から運用に至るまでの全ライフサイクルにおいて、透明性、公平性、説明責任を確保することを目的としています。特に、差別的なバイアスの排除や個人情報保護の強化が強く求められており、違反企業には厳しい罰則が課される可能性があります。開発者は、自身のAIモデルがこれらの基準を満たしているか厳しくチェックし、倫理的な設計を初期段階から組み込む必要があり、コンプライアンスコストの増加も予想されます。","source":"日本経済新聞","url":"https://www.nikkei.com/article/AI-ethics-standardization-20261009/","impact":"high","tags":["AI倫理","規制","ガバナンス"]},{"title":"中小企業向けAI導入支援プラットフォーム『AI-Boost』がローンチ、ノーコードで業務効率化","summary":"中小企業が生成AIを容易に導入できるよう設計された新プラットフォーム『AI-Boost』が正式にサービスを開始しました。このプラットフォームは、ノーコード・ローコードでチャットボット作成、データ分析、コンテンツ生成などのAI機能を既存の業務システムと連携させることが可能です。専門知識がない企業でも数クリックでAIを導入でき、人手不足解消や生産性向上に貢献すると期待されています。開発者にとっては、このプラットフォーム上で動作するカスタムAIツールやプラグインを開発・販売する新たなマーケットプレイスが提供され、収益機会が拡大する見込みです。","source":"ITmedia NEWS","url":"https://www.itmedia.co.jp/news/articles/2610/09/news050.html","impact":"medium","tags":["ノーコードAI","業務効率化","SaaS"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"月額100万円達成！個人開発者が語る『ニッチ市場向けSaaS』成功の秘訣","summary":"ある個人開発者が、特定のニッチ市場に特化したSaaSツールを開発し、リリースからわずか1年で月額収益100万円を達成した事例が注目を集めています。彼は、大規模な競合が参入しにくい特定の業界の深い課題を解決する機能に絞り込み、ユーザーコミュニティとの密な連携を通じて製品を改善し続けました。この成功は、個人開発者が大規模な資金力を持たずとも、ターゲットを絞り込み、顧客の声に耳を傾けることで大きな成果を出せることを示しています。他のインディーハッカーにとっては、市場選定と顧客エンゲージメントの重要性を再認識させる事例となるでしょう。","source":"Indie Hackers Japan","url":"https://indiehackers.jp/stories/niche-saas-success-20261009","impact":"high","tags":["SaaS","ニッチ市場","成功事例"]},{"title":"『Serverless Functions 2.0』がリリース、個人開発者のインフラコストを大幅削減","summary":"クラウドプロバイダー各社が、個人開発者向けに最適化された『Serverless Functions 2.0』を発表しました。この新バージョンでは、コールドスタート時間の劇的な短縮と、無料枠の大幅な拡大が実現されており、小規模なアプリケーションやプロトタイプの開発においてインフラコストをほぼゼロに抑えることが可能になります。これにより、個人開発者はインフラ管理の煩わしさから解放され、より多くの時間を製品開発そのものに集中できるようになります。特に、MVP（Minimum Viable Product）の迅速な展開や、実験的なプロジェクトの実行がこれまで以上に容易になるでしょう。","source":"ZDNet Japan","url":"https://japan.zdnet.com/article/serverless-functions-2-0-indie-devs-20261009/","impact":"medium","tags":["サーバーレス","コスト削減","MVP"]},{"title":"個人開発者向けマイクロファンド『Seedling Grants』が設立、初期段階のプロジェクトを支援","summary":"個人開発者がアイデアを形にするための初期資金を提供する新しいマイクロファンド『Seedling Grants』が設立されました。このファンドは、既存のベンチャーキャピタルとは異なり、収益性よりもアイデアの独創性や社会貢献性を重視し、最大100万円までの非希薄化資金を提供します。これにより、資金調達のハードルが高かった個人開発者や、実験的なプロジェクトが日の目を見る機会が増えることが期待されます。開発者は、複雑な手続きなしに少額の資金を得て、プロトタイプ開発や初期マーケティングに専念できるようになるでしょう。","source":"PR TIMES","url":"https://prtimes.jp/main/html/rd/p/000000001.000000000.html","impact":"low","tags":["資金調達","コミュニティ","スタートアップ"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Appleが『Vision Pro 2』を発表、軽量化とバッテリー寿命向上で一般層への普及加速か","summary":"Appleは、複合現実ヘッドセット『Vision Pro』の次世代モデル『Vision Pro 2』を正式に発表しました。初代モデルで課題とされていた本体の重量が大幅に軽量化され、外部バッテリーの持続時間も向上したことで、より長時間の快適な利用が可能になりました。また、開発者向けには、空間コンピューティングアプリケーションの開発をさらに容易にする新しいSDKが提供され、エコシステムの拡大が期待されます。この改良により、高価なデバイスではあるものの、一般消費者への普及が一段と加速し、新たなXR市場の形成に拍車がかかる可能性があります。","source":"The Verge Japan","url":"https://www.theverge.com/japan/2026/10/09/vision-pro-2-unveiled/","impact":"high","tags":["XR","Apple","空間コンピューティング"]},{"title":"量子コンピュータ耐性を持つ新暗号技術『Post-Quantum Cryptography』が標準化へ","summary":"米国立標準技術研究所（NIST）は、将来的な量子コンピュータによる解読に耐えうる新しい暗号技術『Post-Quantum Cryptography（PQC）』の最終標準候補を発表しました。現在の公開鍵暗号方式は量子コンピュータによって容易に破られる危険性があるため、このPQCへの移行はサイバーセキュリティの未来にとって極めて重要です。企業や開発者は、今後数年で既存のシステムをPQCに対応させる必要があり、これには多大な時間とリソースが求められるでしょう。特に、金融機関や政府機関など機密情報を扱う組織では、早急な対応が不可欠となります。","source":"TechTarget Japan","url":"https://techtarget.itmedia.co.jp/tt/news/2610/09/news01.html","impact":"high","tags":["サイバーセキュリティ","量子コンピュータ","暗号技術"]},{"title":"データセンターの消費電力問題に新技術、液体冷却システムで効率が大幅向上","summary":"世界的なデータ需要の増加に伴い、データセンターの消費電力と発熱が深刻な環境問題となっていますが、この課題を解決する新たな液体冷却システムが注目を集めています。このシステムは、従来の空冷方式と比較して冷却効率を最大50%向上させ、データセンター全体の消費電力を大幅に削減できるとされています。これにより、ITインフラの運用コスト削減だけでなく、企業のESG（環境・社会・ガバナンス）目標達成にも貢献します。開発者にとっては、より高密度なサーバー配置が可能になり、高性能なアプリケーションの展開が容易になるメリットがあります。","source":"CNET Japan","url":"https://japan.cnet.com/article/datacenter-liquid-cooling-20261009/","impact":"medium","tags":["グリーンテック","データセンター","省エネ"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
