<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年10月20日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年10月20日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Googleの新しいLLM『Gemini』の発表と期待","summary":"GoogleがOpenAIのGPT-4に対抗する次世代LLM『Gemini』の開発を発表しました。このモデルはマルチモーダル対応、高度な推論能力、そして様々なサイズでの提供が予定されており、AIの能力を大きく引き上げると期待されています。開発者コミュニティや企業からは、その性能と活用方法に大きな注目が集まっており、新たなAIアプリケーションの創出を加速させるでしょう。これにより、開発者はより複雑で多様なAI機能を自身のサービスに組み込むことが可能になります。","source":"Google Japan Blog","url":"https://japan.googleblog.com/2023/10/gemini-ai.html","impact":"high","tags":["生成AI","LLM","Google"]},{"title":"Microsoft Copilotの一般提供開始とビジネスへの影響","summary":"Microsoftは、AIアシスタント『Copilot』の一般提供をWindows 11、Microsoft 365、Edge、Bingで開始しました。これにより、文書作成、データ分析、コミュニケーションなど、多岐にわたるビジネスシーンでの生産性向上が期待されています。特にMicrosoft 365 Copilotは、Word、Excel、PowerPointなどのOfficeアプリと連携し、ユーザーの作業を大幅に効率化すると見られています。開発者は、CopilotのAPI連携を通じて、既存のビジネスアプリケーションにAI機能を統合する新たな機会を得るでしょう。","source":"Microsoft Japan News Center","url":"https://news.microsoft.com/ja-jp/2023/09/22/230922-microsoft-announces-new-copilot-experiences-and-updates-across-windows-microsoft-365-and-edge/","impact":"high","tags":["AIアシスタント","Microsoft 365","生産性向上"]},{"title":"Stability AI、新しい画像生成モデル『Stable Diffusion XL Turbo』を発表","summary":"Stability AIは、リアルタイムに近い速度で高品質な画像を生成できる新しいモデル『Stable Diffusion XL Turbo』を発表しました。このモデルは、少ないステップ数で画像を生成できるため、インタラクティブなアプリケーションや高速なプロトタイピングでの活用が期待されています。特に、テキストから画像を生成する際の応答速度が大幅に向上しており、クリエイティブな作業の効率化に貢献すると見られています。開発者は、この高速な画像生成能力を活かし、ユーザー体験を向上させる新しいアプリケーションを構築できるでしょう。","source":"Stability AI Blog","url":"https://stability.ai/news/stable-diffusion-xl-turbo-real-time-text-to-image","impact":"medium","tags":["画像生成AI","Stable Diffusion","リアルタイム"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコードツールの進化と個人開発の加速","summary":"Bubble、Glide、Adaloといったノーコード・ローコードプラットフォームがさらに進化し、より複雑な機能やデザインのアプリケーションを個人でも開発できるようになっています。これにより、プログラミングスキルがなくても、アイデアを素早く形にし、市場に投入することが可能になり、インディーハッカーの活動領域が広がっています。特に、API連携の強化やカスタムコードの埋め込み機能により、より高度なサービス開発が容易になっています。開発者は、これらのツールを活用することで、より迅速にMVP（Minimum Viable Product）を構築し、市場のフィードバックを得られるようになります。","source":"Bubble公式ブログ","url":"https://bubble.io/blog","impact":"high","tags":["ノーコード","ローコード","個人開発"]},{"title":"SaaS型個人開発ツールの多様化と収益化モデルの確立","summary":"個人開発者がニッチな課題を解決するSaaS（Software as a Service）を開発し、サブスクリプションモデルで収益を上げる事例が増加しています。例えば、特定のSNSの分析ツール、作業効率化のためのChrome拡張機能、特定の業界に特化した管理ツールなどが人気を集めています。StripeやPayPalなどの決済プラットフォームの導入も容易になり、個人でもグローバルにサービスを展開しやすくなっています。これにより、開発者は自身のスキルやアイデアを直接収益化する新たな道を見出しています。","source":"Indie Hackersコミュニティ","url":"https://www.indiehackers.com/","impact":"high","tags":["SaaS","収益化","インディーハッカー"]},{"title":"AIを活用した個人開発の新たなトレンド","summary":"ChatGPTなどの生成AIやLLMのAPIを活用し、個人開発者がユニークなアプリケーションを開発するトレンドが加速しています。例えば、AIによるコンテンツ自動生成ツール、パーソナライズされた学習アシスタント、アイデア出しをサポートするツールなどが登場しています。AIの進化により、少ないリソースでも高度な機能を持つサービスを開発できるようになり、個人開発の可能性が大きく広がっています。開発者は、AIの力を借りて、これまで実現が難しかった複雑な機能を持つプロダクトを、より少ない労力で市場に投入できるようになります。","source":"Qiita","url":"https://qiita.com/tags/ai","impact":"high","tags":["AI開発","API活用","生成AI"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Apple、M3チップ搭載Macを発表し、高性能PC市場をリード","summary":"Appleは、新しいM3チップファミリー（M3、M3 Pro、M3 Max）を搭載したMacBook ProとiMacを発表しました。これらのチップは、業界をリードする電力効率と性能を誇り、特にグラフィックス性能が大幅に向上しています。これにより、プロフェッショナルなクリエイターや開発者にとって、より強力なワークステーションが提供され、高性能PC市場におけるAppleの存在感を一層高めています。開発者は、M3チップの高性能を活かし、より複雑なシミュレーションやレンダリング、AIモデルのトレーニングなどを高速で実行できるようになります。","source":"Apple Newsroom (日本)","url":"https://www.apple.com/jp/newsroom/2023/10/apple-unveils-m3-m3-pro-and-m3-max/","impact":"high","tags":["Apple M3","MacBook Pro","高性能PC"]},{"title":"サイバーセキュリティの脅威増大と対策技術の進化","summary":"ランサムウェア攻撃やデータ漏洩などのサイバー攻撃が巧妙化・大規模化しており、企業や個人にとってサイバーセキュリティ対策の重要性が一層高まっています。これに対し、AIを活用した脅威検知システム、ゼロトラストアーキテクチャの導入、多要素認証の普及など、新たなセキュリティ技術やソリューションが進化しています。特に、サプライチェーン攻撃への対策が喫緊の課題となっています。開発者は、セキュリティを考慮した設計（Security by Design）を徹底し、最新のセキュリティ技術を自身のアプリケーションに組み込むことが求められます。","source":"各種セキュリティベンダーのレポート","url":"https://www.ipa.go.jp/security/","impact":"high","tags":["サイバーセキュリティ","AIセキュリティ","ゼロトラスト"]},{"title":"持続可能性（サステナビリティ）とテクノロジーの融合","summary":"気候変動や資源枯渇といった地球規模の課題に対し、テクノロジーを活用したソリューション開発が加速しています。再生可能エネルギーの効率化技術、スマートシティにおけるエネルギー管理システム、AIによる廃棄物削減、ブロックチェーンを活用したサプライチェーンの透明化などが注目されています。テック企業は、自社の事業活動における環境負荷低減だけでなく、テクノロジーを通じて社会全体の持続可能性に貢献する動きを強めています。開発者は、環境に配慮した設計や、サステナビリティ課題を解決するアプリケーション開発に貢献する機会が増えています。","source":"環境技術関連ニュース","url":"https://www.nedo.go.jp/news/press/AA5_101683.html","impact":"medium","tags":["サステナビリティ","環境技術","スマートシティ"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
