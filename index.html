<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年11月12日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年11月12日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Google、次世代LLM『Gemini Ultra 2』を発表、マルチモーダル性能が飛躍的に向上","summary":"Googleは、そのフラッグシップLLMであるGeminiの次世代モデル『Gemini Ultra 2』を発表しました。この新モデルは、テキストだけでなく画像、音声、動画といった多様な情報を理解し生成するマルチモーダル性能が大幅に強化されており、より複雑な指示への対応や、クリエイティブなコンテンツ生成において高い能力を発揮すると期待されています。特に、医療画像分析や科学論文の要約、動画コンテンツの自動生成など、専門分野での応用が注目され、開発者はこれまでのAIでは難しかった高度なマルチモーダルアプリケーションを構築できるようになるでしょう。これにより、AI開発の新たな可能性が大きく広がります。","source":"Google AI Blog","url":"https://blog.google/technology/ai/gemini-ultra-2-announcement/","impact":"high","tags":["生成AI","LLM","マルチモーダルAI","Google"]},{"title":"AI倫理と規制に関する国際会議で、各国政府が生成AIの安全な利用に向けた枠組み構築に合意","summary":"主要国政府および国際機関が参加するAI倫理と規制に関する国際会議が開催され、生成AIの急速な発展に伴う倫理的課題や安全性への懸念に対し、各国が協力して国際的な枠組みを構築することで合意しました。具体的には、AIが生成したコンテンツの透明性確保、偽情報対策、プライバシー保護、そして悪用防止のための技術的・法的措置の検討が進められる予定です。これにより、生成AIの健全な発展と社会実装を促進しつつ、リスクを最小限に抑えることを目指し、開発者はこれらの国際的なガイドラインを遵守したAIシステムを設計する必要が出てくるでしょう。","source":"国際AI倫理会議","url":"https://www.un.org/ai-ethics-summit/","impact":"medium","tags":["AI倫理","規制","国際協力","安全性"]},{"title":"スタートアップ企業が『パーソナライズ型AIアシスタント』をリリース、個人の行動履歴から最適化された情報を提供","summary":"新たなスタートアップ企業が、ユーザーの行動履歴や好みを学習し、最適化された情報や提案を行う『パーソナライズ型AIアシスタント』をリリースしました。このアシスタントは、単なる情報検索だけでなく、スケジュールの管理、買い物リストの作成、健康アドバイスなど、個々のライフスタイルに合わせたきめ細やかなサポートを提供することが特徴です。これにより、ユーザーはより効率的で質の高い情報アクセスと、日々の生活の質の向上が期待され、開発者はユーザー中心のAIサービス設計の重要性を再認識し、個人のニーズに応える新たなAIアプリケーションの可能性を探るきっかけとなるでしょう。","source":"TechCrunch Japan","url":"https://jp.techcrunch.com/","impact":"medium","tags":["AIアシスタント","パーソナライズ","スタートアップ","UX向上"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"ノーコード・ローコード開発ツールの機能拡充により、個人開発者のアプリ開発がさらに加速","summary":"主要なノーコード・ローコード開発プラットフォームが、より高度なデータベース連携機能やAPI連携機能、そしてカスタムコンポーネントの作成機能を拡充しました。これにより、プログラミング知識が少ない個人開発者でも、複雑なビジネスロジックを持つWebアプリケーションやモバイルアプリを迅速に開発できるようになり、アイデアの実現可能性が大幅に向上しています。特に、SaaSプロダクトの開発や、特定のニッチなニーズに応えるツールの作成において、その恩恵は大きく、開発者はより少ない労力で高品質なプロダクトを市場に投入できるようになるでしょう。","source":"ZDNet Japan","url":"https://japan.zdnet.com/","impact":"high","tags":["ノーコード","ローコード","個人開発","SaaS"]},{"title":"個人開発者が手がけるオープンソースプロジェクトが、特定分野で大手企業のソリューションを凌駕するパフォーマンスを示す","summary":"特定の技術分野において、個人開発者や少人数チームが開発したオープンソースプロジェクトが、大手企業が提供する高価なソリューションを上回るパフォーマンスや柔軟性を提供し、注目を集めています。特に、データ分析、セキュリティツール、開発者向けユーティリティなどの分野で、コミュニティ主導の開発モデルが迅速なイテレーションと高品質なコードベースを生み出しており、多くの企業がこれらのオープンソースプロジェクトを自社システムに組み込む動きを見せています。これは、個人開発者が提供するイノベーションが、業界標準を塗り替える可能性を秘めていることを示唆しており、開発者は自身のスキルとアイデアで大きな影響を与えられることを実感するでしょう。","source":"GitHub Trends","url":"https://github.com/trending","impact":"high","tags":["オープンソース","個人開発","コミュニティ","イノベーション"]},{"title":"サブスクリプション型個人開発ツールが台頭、AIを活用したコード生成支援で開発効率が飛躍的に向上","summary":"個人開発者向けに、AIを活用したコード生成支援機能を搭載したサブスクリプション型開発ツールが次々と登場しています。これらのツールは、自然言語での指示からコードスニペットを生成したり、既存のコードのバグを特定・修正したりする機能を提供し、開発プロセスを大幅に効率化します。これにより、個人開発者はより少ない時間で高品質なアプリケーションを開発できるようになり、新たな収益機会の創出にも繋がっています。開発者はAIアシスタントを積極的に活用することで、コーディングの負担を減らし、より創造的な問題解決に集中できるようになるでしょう。","source":"The Verge","url":"https://www.theverge.com/","impact":"medium","tags":["AI開発支援","コード生成","開発効率","サブスクリプション"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"量子コンピューティングの商用化に向けた新たなブレイクスルー、エラー訂正技術が実用レベルに近づく","summary":"量子コンピューティング分野において、長年の課題であったエラー訂正技術に大きな進展がありました。研究チームは、量子ビットの安定性を大幅に向上させ、実用的なエラー訂正率を達成する新たな手法を発表しました。これにより、量子コンピューターが抱えるノイズの問題が軽減され、より大規模で安定した量子コンピューターの実現が視野に入ってきました。将来的には、新素材開発、創薬、金融モデリングなど、多岐にわたる分野での応用が期待され、開発者はこの技術の進展が、これまで不可能だった計算問題へのアプローチを可能にすることに注目するでしょう。","source":"Nature Physics","url":"https://www.nature.com/nphys/","impact":"high","tags":["量子コンピューティング","エラー訂正","ブレイクスルー","商用化"]},{"title":"Web3.0技術の普及に向けた大手企業の取り組みが加速、分散型アプリケーションのユーザー体験向上に焦点","summary":"大手テクノロジー企業が、Web3.0技術の一般普及に向けて本格的な取り組みを開始しました。特に、ブロックチェーン技術を活用した分散型アプリケーション（dApps）のユーザーインターフェース（UI）とユーザーエクスペリエンス（UX）の改善に注力しており、既存のWeb2.0サービスと同等の利便性を提供することを目指しています。これにより、Web3.0の複雑さに対するユーザーのハードルが下がり、NFT、DeFi（分散型金融）、DAO（分散型自律組織）といった技術がより広く社会に浸透していくことが期待されます。開発者は、より使いやすいdAppsの設計が求められるようになり、Web3.0のマスアダプションに向けた重要なフェーズに入ったことを認識するでしょう。","source":"CoinDesk Japan","url":"https://www.coindeskjapan.com/","impact":"medium","tags":["Web3.0","dApps","UX改善","ブロックチェーン"]},{"title":"環境負荷低減を目指す『グリーンテック』への投資が過去最高を記録、再生可能エネルギーとAIの融合が鍵に","summary":"気候変動への意識の高まりを受け、『グリーンテック』分野への投資が過去最高額を更新しました。特に、再生可能エネルギーの効率化、スマートグリッドの最適化、そしてAIを活用したエネルギーマネジメントシステムに大きな注目が集まっています。AIが電力需要を予測し、再生可能エネルギーの供給を最適に制御することで、二酸化炭素排出量の削減とエネルギーコストの低減を両立させる技術開発が進んでおり、持続可能な社会の実現に向けた重要な柱として期待されています。開発者は、環境問題解決に貢献するAIやIoT技術の需要が高まっていることを認識し、この分野での新たなソリューション開発に注力する機会が増えるでしょう。","source":"Bloomberg Green","url":"https://www.bloomberg.com/green","impact":"high","tags":["グリーンテック","再生可能エネルギー","AI","持続可能性"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
