<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年10月22日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年10月22日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"主要LLMが新モデルを発表、高性能モデルは利用を限定する傾向に","summary":"2026年9月末から10月初旬にかけて、Googleの「Gemini 4 Argon」やOpenAIの「GPT-6.1 Sol」など主要LLMの新しい主力モデルが相次いで発表されました。これらの新モデルは、以前のモデルよりも高い水準の性能をより低い価格帯で提供する動きが見られます。一方で、特にサイバーセキュリティ能力の高いモデルは、まず一部の専門家に限定して提供が開始されるなど、利用者を絞る傾向が強まっています。これは、LLMの活用が「どれが賢いか」から「どれを、誰に、どう使わせるか」へと戦略的にシフトしていることを示唆しています。開発者にとっては、高性能モデルへのアクセスが制限される可能性があり、利用ポリシーや提供形態の変化に注意が必要です。","source":"AI・DXお役立ちサイト 他","url":"https://www.google.com/search?q=2026年10月+主要LLM+新モデル+発表","impact":"high","tags":["LLM","生成AI","モデル発表","利用制限"]},{"title":"PFNとTenstorrentが光電融合と3次元メモリで次世代AI半導体を共同開発","summary":"Preferred Networks（PFN）と米Tenstorrentは2026年10月20日、NEDOの事業に採択され、光電融合技術を活用した生成AI向けプロセッサーの共同研究開発を開始すると発表しました。PFNは3次元メモリ実装技術を採用したAIチップレットを、Tenstorrentは機密計算に対応するCPUチップレットを開発します。これらを統合することで、生成AIの学習と推論を高性能かつ高い電力効率で処理できる計算基盤の構築を目指します。この研究は2031年度まで進められ、AI処理におけるメモリ帯域幅のボトルネック解消に貢献することが期待されています。開発者にとっては、将来的にAIモデルの学習・推論性能が飛躍的に向上する可能性を秘めた技術動向です。","source":"XenoSpectrum","url":"https://www.google.com/search?q=PFN+Tenstorrent+次世代AI半導体+共同開発+XenoSpectrum","impact":"medium","tags":["AI半導体","光電融合","3次元メモリ","PFN"]},{"title":"パナソニックHDがモバイル業務支援向け『世界モデル』を開発、AIエージェントの操作成功率を向上","summary":"パナソニックホールディングスとパナソニックR&amp;Dカンパニーオブアメリカは、カリフォルニア大学ロサンゼルス校（UCLA）の研究者らと共同で、スマートフォンなどのモバイル端末上の業務をAIが先を予測しながら支援する「世界モデル」を開発しました。このモデルは、操作後の画面をピクセル単位で再現する代わりに、操作によって生じる重要な状態変化を自然言語で予測することで、AIエージェントのモバイル端末操作の成功率を向上させます。約140万件の学習データセット「MobileWorld」とベンチマーク「MobileWorldBench」も構築されており、製造・物流・保守などの現場でのAIエージェント活用に大きな期待が寄せられています。開発者は、この技術によりモバイル環境でのAIエージェント開発がより効率的かつ高精度になる可能性があります。","source":"パナソニックHD","url":"https://www.google.com/search?q=パナソニックHD+モバイル業務支援向け+世界モデル+開発","impact":"medium","tags":["AIエージェント","世界モデル","モバイルAI","パナソニック"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"習慣化アプリ『HabitKit』がApp Store検索のみで月10万ドルを達成、インディーハッカーの成功事例が続々","summary":"海外のインディーハッカー界隈では、個人開発のプロダクトが大きな成功を収める事例が報告されています。特に、ドイツ人開発者セバスチャン氏の習慣化アプリ「HabitKit」は、App Store検索からの流入のみで月10万ドル（約1500万円）以上の収益を達成しました。また、別の24歳の開発者は、複数のアプリから合計で年間約6億円（ARR 400万ドル）もの収益を上げています。これらの事例は、大規模な組織や資金がなくても、個人のアイデアと技術で市場価値の高いサービスを生み出せる可能性を示しています。これは、個人開発者にとって大きなモチベーションとなり、ニッチな市場でも成功できることを証明しています。","source":"みんなのニュースレター","url":"https://www.google.com/search?q=習慣化アプリ+HabitKit+月10万ドル+インディーハッカー","impact":"high","tags":["インディーハッカー","アプリ開発","成功事例","収益化"]},{"title":"AI副業におけるセキュリティ対策の重要性とPHPの重大な脆弱性","summary":"AIを活用した副業が増加する中で、個人開発者や副業者が知っておくべきセキュリティ対策の重要性が指摘されています。特に、2026年10月21日には、Webサイトなどで広く使われるプログラミング言語PHPに2件の重大な脆弱性（CVE-2026-109618、CVE-2026-109619、CVSS 4.0スコア9.2）が発見され、修正アップデートが公開されました。これらの脆弱性は、特定の条件下で攻撃者がサーバー上で不正なコードを実行できるリモートコード実行（RCE）の危険性を含んでいます。AIで作成したWebサービスやブログを運営する個人も、速やかな対応が求められます。開発者は、自身のサービスを守るためにも、常に最新のセキュリティ情報を確認し、迅速なアップデートを適用することが不可欠です。","source":"note","url":"https://www.google.com/search?q=AI副業+セキュリティ対策+PHP+脆弱性+2026年10月","impact":"high","tags":["セキュリティ","PHP脆弱性","AI副業","個人開発"]},{"title":"個人アプリ開発者向けの『強制締切』が2026年8月末〜10月に集中","summary":"個人でアプリを開発・運用するインディーハッカーにとって、2026年8月末から10月にかけて、Google Play、App Store、AI APIの各プラットフォームで、対応が必須となる「強制締切」が異常に密集しています。これには、Google Playでのフォアグラウンドサービスの承認用途からのジオフェンス除外や匿名チャットアプリへの未成年ブロック要件、そしてOpenAI Assistants APIの削除などが含まれます。これらの変更は、アプリの提出や機能維持に直接影響するため、個人開発者は公式情報を確認し、迅速な対応が求められます。対応を怠るとアプリの公開停止や機能停止につながるため、開発計画に大きな影響を与える可能性があります。","source":"Zenn","url":"https://www.google.com/search?q=2026年8月末〜10月+個人アプリ開発者+強制締切+Zenn","impact":"high","tags":["アプリ開発","プラットフォームポリシー","API変更","Google Play"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"AI半導体における『メモリの壁』とIEEEの次世代チップ設計者育成プログラム","summary":"AI半導体の性能向上を阻む物理的限界として「メモリの壁」が深刻化しており、これに対応する最新トレンドとして、特定領域特化型プロセッサへの移行が注目されています。このような状況を受け、IEEEは次世代チップ設計者育成プログラムを始動しました。このプログラムは、激変する業界構造の中で、AIチップの物理的限界を突破するための新しい設計思想や技術を習得するエンジニアを育成することを目的としています。開発者にとっては、将来のAIチップ設計の方向性を示唆するものであり、新たな技術習得の機会となるでしょう。","source":"2026年AI半導体危機！「メモリの壁」を壊すIEEEの次世代チップ設計革命","url":"https://www.google.com/search?q=2026年10月12日+AI半導体危機+メモリの壁+IEEE+次世代チップ設計革命","impact":"medium","tags":["AI半導体","メモリの壁","IEEE","チップ設計"]},{"title":"ジーイエットが生成AIデータセンターで液浸冷却の業務協力契約を締結","summary":"ジーイエットは2026年10月21日、生成AI基盤データセンター構想の具体化に向け、液浸冷却技術を活用した関連事業で国内事業者と基本契約を締結したと発表しました。液浸冷却は、サーバーなどを絶縁性の冷却液に浸すことでCPUやGPUの熱を直接吸収する方式で、冷却電力の削減やGPUの高密度実装、省スペース化が期待されます。PUE（電力使用効率）の参考実績では1.03～1.04という高い電力効率が示されており、電力消費の大きい生成AIデータセンターの運用コスト削減と性能向上に貢献する見込みです。これは、AIインフラの持続可能性と効率性を高める重要な一歩となります。","source":"ジーイエット","url":"https://www.google.com/search?q=ジーイエット+生成AIデータセンター+液浸冷却+業務協力契約","impact":"medium","tags":["データセンター","液浸冷却","生成AI","電力効率"]},{"title":"中古GPUを活用した企業向けAIインフラサービス『Raplase RCA』が提供開始","summary":"エクストリームーD、TES-AMM JAPAN、Cornelis Networksの3社は2026年10月20日、中古のGPUサーバー（循環型GPUサーバー）を活用した企業向けAIインフラサービス「Raplase RCA」の提供を開始しました。生成AI需要の急増に伴うGPUサーバーの価格高騰と調達リードタイムの長期化という課題に対し、このサービスは最短即日かつ1GPUから定額利用できる柔軟な構成を提供します。機密データを扱う製造業などが求める「プライベートAI」環境を低コストで実現し、最新GPUのオーバースペックに多額の費用を払う必要がないという実用的なメリットを提示しています。開発者にとっては、AI開発環境の選択肢が広がり、コスト効率の良いプライベート環境での開発が可能になります。","source":"MONOist","url":"https://www.google.com/search?q=Raplase+RCA+中古GPU+AIインフラサービス+MONOist","impact":"high","tags":["AIインフラ","GPU","プライベートAI","コスト削減"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
