<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年9月23日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年9月23日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Google、次世代LLM『Gemini Ultra 2』のAPI提供を開始、リアルタイム推論を強化","summary":"Googleは、同社の最上位大規模言語モデルである「Gemini Ultra 2」のAPI提供を開発者向けに開始しました。この新モデルは、前バージョンと比較して、より複雑な推論能力とマルチモーダル処理性能が向上しており、特にリアルタイムでの情報処理において大幅な高速化を実現しているとされています。これにより、顧客サポートの自動化や動的なコンテンツ生成など、よりインタラクティブなAIアプリケーションの開発が加速することが期待されます。開発者は、この強力なモデルを活用して、新たなAIサービスや機能を迅速に市場に投入できるようになるでしょう。","source":"Google Gemini","url":"https://www.gemini.google.com/","impact":"high","tags":["LLM","Google","API"]},{"title":"Meta、オープンソースLLM『Llama 4』の最新アップデートを発表、商用利用がさらに拡大","summary":"Metaは、オープンソースの大規模言語モデル「Llama 4」の最新アップデートを公開しました。今回のアップデートでは、モデルのパラメータ数がさらに増加し、多言語対応とコード生成能力が大幅に強化されています。特に、中小企業やスタートアップがAIモデルを自社でカスタマイズしやすくなるよう、より詳細なドキュメントとトレーニングリソースが提供されており、商用利用の敷居が一段と下がったと評価されています。これにより、より多くの開発者がLlama 4を基盤とした革新的なAIソリューションを構築できるようになるでしょう。","source":"Meta AI Blog","url":"https://ai.meta.com/blog/","impact":"high","tags":["オープンソースAI","Meta","LLM"]},{"title":"Stability AI、画像生成AI『Stable Diffusion XL 1.5』をリリース、高品質な画像生成をさらに効率化","summary":"Stability AIは、画像生成AI「Stable Diffusion XL」の最新バージョン1.5をリリースしました。このバージョンでは、生成される画像の品質がさらに向上し、特に複雑な構図や詳細なテクスチャの表現において顕著な改善が見られます。また、少ないプロンプトでも意図通りの画像を生成できる効率性の向上や、生成速度の高速化も図られており、クリエイターのワークフローを強力にサポートすると期待されています。これにより、より高品質なビジュアルコンテンツを効率的に生み出すことが可能になるでしょう。","source":"Stability AI Blog","url":"https://stability.ai/blog/","impact":"medium","tags":["画像生成AI","Stable Diffusion","クリエイターツール"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"「ノーコードAIアプリ開発」が個人開発者の新トレンドに、月額収益100万円超えの事例も続出","summary":"近年、個人開発者の間でノーコード・ローコードツールを活用したAIアプリケーション開発が急速に広まっています。特に、既存のAIモデルAPIとノーコードプラットフォームを組み合わせることで、プログラミングスキルが少なくても高度な機能を持つアプリを短期間でリリースできるようになりました。中には月額100万円を超える収益を上げるインディーハッカーも現れており、アイデア先行型でのプロダクト開発が加速しています。これにより、ニッチな市場をターゲットにしたサービスが次々と生まれ、個人開発者のビジネスチャンスが拡大しています。","source":"Indie Hackers","url":"https://indiehackers.com/","impact":"high","tags":["ノーコード","AIアプリ","個人開発"]},{"title":"サブスクリプション型SaaSを個人で開発・運用する『マイクロSaaS』が多様化、特定業界特化型が人気","summary":"個人で開発・運用する小規模なSaaS（Software as a Service）である「マイクロSaaS」の市場が多様化しています。特に、特定の業界や職種に特化したニッチなツールが人気を集めており、例えば、歯科医院向けの予約管理システムや、フリーランスデザイナー向けの請求書自動生成ツールなどが成功事例として挙げられます。これらのマイクロSaaSは、大規模な開発チームを持たない個人でも、顧客の具体的な課題を解決することで安定した収益を上げられるビジネスモデルとして注目されています。個人開発者は、特定の課題に深くコミットすることで、競争の激しいSaaS市場で成功を収める機会を得ています。","source":"Micro-SaaS","url":"https://www.micro-saas.com/","impact":"medium","tags":["マイクロSaaS","ニッチ市場","ビジネスモデル"]},{"title":"GitHub Copilotの進化が個人開発者の生産性を劇的に向上、アイデアから実装までのリードタイムを短縮","summary":"プログラマー向けAIアシスタント「GitHub Copilot」の機能がさらに進化し、個人開発者の生産性向上に大きく貢献しています。最新のアップデートでは、より複雑なコード補完やデバッグ支援に加え、テストコードの自動生成機能が強化されました。これにより、個人開発者がアイデアを思いついてから実際に動くプロダクトとして実装するまでのリードタイムが劇的に短縮され、より多くのプロジェクトに挑戦できる環境が整いつつあります。開発者は、この進化により、効率的な開発が可能となるでしょう。","source":"GitHub Copilot","url":"https://github.com/features/copilot","impact":"high","tags":["GitHub Copilot","開発効率","AIアシスタント"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"Apple、次世代AR/VRヘッドセット『Vision Pro 2』を発表、より軽量化されバッテリー性能が向上","summary":"Appleは、次世代の複合現実（AR/VR）ヘッドセット「Vision Pro 2」を発表しました。初代モデルと比較して、デバイスの軽量化が図られ、長時間の装着でも快適性が向上しています。また、バッテリー持続時間も大幅に延長され、より実用的な利用シーンが増えることが期待されます。空間コンピューティングの可能性をさらに広げるべく、開発者向けの新しいSDKも同時に公開されており、対応アプリのエコシステム拡大が見込まれます。これにより、AR/VR分野での新たなアプリケーション開発が加速するでしょう。","source":"Apple Newsroom","url":"https://www.apple.com/newsroom/","impact":"high","tags":["Apple","AR/VR","Vision Pro"]},{"title":"量子コンピューティングの実用化に向けた新たなブレークスルー、エラー訂正技術が大幅に進展","summary":"量子コンピューティング分野において、長年の課題であったエラー訂正技術に新たなブレークスルーがあったと報じられました。従来の量子ビットは非常にデリケートでエラーが発生しやすかったため、実用的な量子コンピュータの実現が困難でしたが、今回発表された新技術により、より安定した量子計算が可能になると期待されています。これにより、医薬品開発や新素材発見など、様々な分野での量子コンピュータの応用が加速する可能性があります。研究者や開発者は、より信頼性の高い量子アルゴリズムを設計できるようになるでしょう。","source":"Quantum Novator","url":"https://www.quantumnovator.com/","impact":"high","tags":["量子コンピューティング","エラー訂正","科学技術"]},{"title":"サイバーセキュリティの脅威が高度化、AIを活用した防御システムが企業の必須ツールに","summary":"サイバー攻撃の手法がAIの進化と共に高度化しており、従来のセキュリティ対策では対応が困難になりつつあります。これに対抗するため、AIを活用した次世代のサイバーセキュリティ防御システムが企業の必須ツールとして注目されています。これらのシステムは、異常なネットワークトラフィックや未知のマルウェアをリアルタイムで検知し、自動的に対応することで、企業の情報資産を保護します。AIによる脅威インテリジェンスの共有も進んでおり、業界全体での防御力強化が図られています。開発者は、AIを活用したセキュリティソリューションの需要増大に直面するでしょう。","source":"Dark Reading","url":"https://www.darkreading.com/","impact":"medium","tags":["サイバーセキュリティ","AI防御","企業IT"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
