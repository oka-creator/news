<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年11月26日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年11月26日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"朝日工業社、生成AI活用で安全手順書などの作成時間を約9割削減","summary":"建設業の朝日工業社が生成AIを導入し、安全作業手順書と作業イメージ図の作成時間を大幅に短縮した事例です。従来2.5日かかっていた下書き作成が約2時間に短縮され、約9割の削減を達成しました。大阪支社での先行導入後、全国展開を目指しており、熟練管理者の知識を学習させた対話型AI「部長AI（仮称）」の開発も進められています。これにより、若手社員の技術継承を支援し、業務効率化と人材育成の両面で大きな影響が期待されます。開発者にとっては、特定の業務に特化したAIモデルの導入が、既存業務の劇的な改善に繋がる可能性を示す事例となるでしょう。","source":"ニッキンONLINE","url":"https://www.nikkinonline.com/article/76481","impact":"high","tags":["生成AI","業務効率化","建設業"]},{"title":"AnthropicのClaudeがPCアプリ化機能をベータ提供開始、管理者向け注意点も","summary":"Anthropicが、Claudeで生成した成果物「アーティファクト」をMacやWindowsのデスクトップアプリとしてインストールできる機能「Install as app」のベータ版提供を開始しました。この機能により、開発者だけでなく業務担当者も容易にアプリを作成・保守できるようになり、AI活用の敷居が下がります。インストールされたアプリは専用ウィンドウで動作し、ユーザーの許可を得て通知送信やファイル操作が可能であるため、企業管理者はセキュリティと権限管理に注意が必要です。開発者にとっては、Claudeの生成物をより手軽にエンドユーザーに提供できる新たなチャネルが生まれたことを意味します。","source":"ITmedia エンタープライズ","url":"https://www.itmedia.co.jp/enterprise/articles/2611/25/news072.html","impact":"medium","tags":["Claude","デスクトップアプリ","AI活用"]},{"title":"Google、Gemini 4 NeonとGenie 4を発表、AIの応用範囲が拡大","summary":"Googleが、ビジネスと開発の常識を覆す「Gemini 4 Neon」と、3D世界を生成する「Genie 4」を発表しました。Gemini 4 Neonは、推論レベルを4段階で調整でき、100万トークンという巨大なコンテキストウィンドウを持つため、複雑なコード修正や大規模なスプレッドシート分析に対応可能です。一方、Genie 4は、対話エージェントに言葉で指示するだけでリアルタイムに3D世界の天候変更やキャラクター追加ができる画期的なモデルです。これらの発表は、AIの応用範囲を大きく広げ、開発者には新たなツールと可能性を提供するものであり、特に3Dコンテンツ生成や大規模データ処理における革新が期待されます。","source":"YouTubeチャンネル「【2026年11月】AI最新ニュース5選｜Gemini 4 Neon・Genie 4・Canva」","url":"https://www.youtube.com/watch?v=xxxxxxxxxxx","impact":"high","tags":["Google Gemini","Genie AI","3D生成AI"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"「Brainrot」アプリが月6,000万円を達成、元ソフトウェアエンジニアがMeta広告で急成長","summary":"スクリーンタイム管理アプリ「Brainrot」が、Meta広告への注力により月間収益を400万円から約6,000万円へと大幅に伸ばしました。元ソフトウェアエンジニアのYoni Smolyar氏が、Instagramの毎日投稿からMeta広告へと戦略を転換し、共同開発者と組むことでこの急成長を実現した事例です。この成功は、個人開発者が適切なマーケティング戦略とパートナーシップを見つけることで、大きな収益を上げられる可能性を示しています。開発者にとっては、プロダクトの質だけでなく、広告戦略が収益に直結する重要な要素であることを示唆します。","source":"みんなのニュースレター「海外アプリ成功事例分析ニュースレター」","url":"https://newsletter.yuzufan.com/p/2026-11-16","impact":"high","tags":["アプリ開発","Meta広告","収益化"]},{"title":"コード経験ゼロの18歳が「腹筋スキャン」アプリで月800万円を稼ぐ","summary":"18歳の開発者が、コード経験なしで「AbMaxx」という腹筋スキャンアプリを開発し、月間約800万円の収益を上げています。大学を1学期で辞め、ジムでのひらめきからアプリを開発し、大物インフルエンサーとの連携やMeta・TikTok広告を活用することで急速に成長しました。この事例は、プログラミングスキルがなくても、アイデアとマーケティング戦略、そして実行力があれば、個人でも大きな成功を収められることを証明しています。開発者にとっては、ニッチな市場を見つけ、インフルエンサーマーケティングを効果的に活用することの重要性を示す好例となるでしょう。","source":"みんなのニュースレター「海外アプリ成功事例分析ニュースレター」","url":"https://newsletter.yuzufan.com/p/2026-11-09","impact":"high","tags":["ノーコード","インフルエンサーマーケティング","アプリ収益"]},{"title":"AI写真アプリ「Boothie」が4ヶ月で月780万円の収益、TikTok活用で急成長","summary":"トルコの開発者がリリースしたデジカメ風AI写真アプリ「Boothie」が、TikTokアカウントを12個近く運用し、スライドショー型投稿を行うことで、リリースからわずか4ヶ月で月間経常収益（MRR）約5.2万ドル（約780万円）を達成しました。この急成長は、AIを活用したニッチなアプリと、TikTokというプラットフォームの特性を最大限に活かしたマーケティングが奏功した結果です。開発者にとっては、AI技術とSNSマーケティングを組み合わせることで、短期間で大きな成果を出す可能性を示す刺激的な事例となるでしょう。","source":"みんなのニュースレター「海外アプリ成功事例分析ニュースレター」","url":"https://newsletter.yuzufan.com/p/2026-11-02","impact":"high","tags":["AIアプリ","TikTokマーケティング","MRR"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"AWSジャパン、半導体業界向け戦略「Vision 2030」を発表 - AIとクラウドで設計生産性向上へ","summary":"AWSジャパンが、半導体業界向けにAIとクラウドを活用した戦略「Vision 2030」を発表しました。この戦略は、半導体設計・開発の生産性向上を目的とし、「半導体設計者向けリファレンスアーキテクチャ日本版」の公開、AIエージェント活用ハンズオンワークショップの提供、および「EDA on AWS検証支援」の3施策を柱としています。半導体設計者の人材不足と設計の複雑化が課題となる中、AWS自身が開発するCPU「AWS Graviton5」の性能向上もこの取り組みに貢献しています。開発者にとっては、クラウドベースの半導体設計環境が進化し、より効率的な開発が可能になることを示唆します。","source":"EnterpriseZine","url":"https://enterprisezine.jp/article/detail/19451","impact":"medium","tags":["AWS","半導体","クラウドコンピューティング"]},{"title":"NEC、防衛分野におけるスタートアップ連携を開始 - 無人航空機を活用した「3次元メッシュネットワーク」構築へ","summary":"NECが、防衛分野におけるスタートアップ連携プログラム「NEC X - JAPAN Edition - for Defense Tech」を立ち上げ、その第一弾として「3次元メッシュネットワークの研究」で技術公募を開始しました。この研究は、無人航空機（UAV）を通信中継ノードとして活用し、障害の多い陸上環境でも部隊の無線機とUAV間で位置情報や映像を共有するネットワークの実証を目指します。この技術は、災害時の通信確保やインフラ点検など、民生分野へのデュアルユースも期待されており、防衛技術の革新と社会貢献の両面で重要性を持つでしょう。開発者にとっては、防衛分野という新たな市場での技術開発機会が生まれることを意味します。","source":"NEC プレスリリース / BUSINESS NETWORK","url":"https://jpn.nec.com/press/202611/20261125_01.html","impact":"medium","tags":["NEC","防衛技術","UAV"]},{"title":"HuaweiとCMA、国家決済ソリューションを共同発表 - 世界の決済分野の変革を加速","summary":"シンガポール・フィンテック・フェスティバル2026において、HuaweiとCMA Small Systems ABが国家決済ソリューションを共同で発表しました。両社の強みを結集し、CMAの決済ソフトウェア技術とHuaweiのICTインフラ技術を融合させることで、中央銀行や金融機関向けにエンドツーエンドのソリューションを提供します。この提携により、国家決済システムの近代化が加速され、リアルタイム処理、効率化、相互運用性の向上が目指されます。開発者にとっては、大規模な金融インフラ開発における新たな標準や技術トレンドが生まれる可能性があり、決済システムの進化に注目する必要があるでしょう。","source":"PR Newswire","url":"https://prtimes.jp/main/html/rd/p/000000001.000133792.html","impact":"medium","tags":["Huawei","決済システム","フィンテック"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
