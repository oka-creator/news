<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日のテックニュース | 2026年11月22日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f5f8;
    --surface: #ffffff;
    --text: #1a1a2e;
    --text-sub: #555568;
    --text-light: #8888a0;
    --border: #e4e4ec;
    --accent: #ff6b35;
    --accent-hover: #e85d2c;
    --tag-bg: #f0f0f5;
    --shadow: 0 1px 8px rgba(0,0,0,0.05);
    --shadow-hover: 0 4px 20px rgba(0,0,0,0.09);
    --radius: 14px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.8;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
    padding: 32px 20px 60px;
  }

  /* ---- Header ---- */
  header {
    text-align: center;
    margin-bottom: 8px;
  }
  .header-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  h1 {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: -0.02em;
  }
  .date-display {
    color: var(--text-light);
    font-size: 13px;
    font-weight: 500;
    margin-top: 2px;
  }

  /* ---- Date nav ---- */
  .date-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 18px 0 24px;
  }
  .date-nav input[type="date"] {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    outline: none;
  }
  .date-nav input[type="date"]:focus { border-color: var(--accent); }
  .date-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 7px 14px;
    font-family: inherit;
    font-size: 12px;
    color: var(--text-sub);
    cursor: pointer;
    transition: all 0.2s;
  }
  .date-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- Tabs ---- */
  .tabs {
    display: flex;
    gap: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 22px;
    box-shadow: var(--shadow);
  }
  .tab {
    flex: 1;
    padding: 10px 6px;
    border: none;
    background: none;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-light);
    cursor: pointer;
    border-radius: 9px;
    transition: all 0.2s ease;
    text-align: center;
    line-height: 1.4;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-sub); background: var(--tag-bg); }
  .tab.active {
    background: var(--accent);
    color: #fff;
    box-shadow: 0 2px 8px rgba(255,107,53,0.25);
  }
  .tab-icon { display: block; font-size: 18px; margin-bottom: 3px; }

  /* ---- Article card ---- */
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .article {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin-bottom: 12px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.3s, transform 0.15s;
    animation: fadeIn 0.35s ease both;
  }
  .article:hover { box-shadow: var(--shadow-hover); transform: translateY(-1px); }
  .article:nth-child(2) { animation-delay: 0.07s; }
  .article:nth-child(3) { animation-delay: 0.14s; }

  .article-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .impact-badge {
    padding: 2px 9px;
    border-radius: 5px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
  }
  .impact-high   { background: #fff0ed; color: #d94432; }
  .impact-medium { background: #fff8ed; color: #c96d10; }
  .impact-low    { background: #edf4ff; color: #3578c5; }

  .article-source { font-size: 12px; color: var(--text-light); }

  .article-title {
    font-size: 16px;
    font-weight: 800;
    line-height: 1.55;
    margin-bottom: 8px;
  }

  .article-summary {
    font-size: 13.5px;
    color: var(--text-sub);
    line-height: 1.9;
    margin-bottom: 14px;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }

  .article-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag {
    background: var(--tag-bg);
    color: var(--text-sub);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 5px;
  }

  .source-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
  }
  .source-link:hover { color: var(--accent-hover); }

  /* ---- Footer ---- */
  footer {
    text-align: center;
    margin-top: 36px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
  }
  .footer-tags { font-size: 13px; color: var(--accent); font-weight: 700; }
  .footer-info { font-size: 11.5px; color: var(--text-light); margin-top: 4px; }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state p { font-size: 14px; margin-top: 10px; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 20px 14px 40px; }
    .article { padding: 18px; }
    h1 { font-size: 20px; }
    .tab { font-size: 11px; padding: 9px 4px; }
    .tab-icon { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <div class="header-row">
      <span style="font-size:26px">📰</span>
      <h1>今日のテックニュース</h1>
    </div>
    <div class="date-display">2026年11月22日</div>
  </header>

  <nav class="date-nav">
    <button class="date-btn" onclick="navigateDate(-1)">&larr; 前日</button>
    <input type="date" id="datePicker" onchange="loadDate(this.value)" />
    <button class="date-btn" onclick="navigateDate(1)">翌日 &rarr;</button>
  </nav>

  <div class="tabs" id="tabs"></div>
  <div id="content"></div>

  <footer>
    <div class="footer-tags">#個人開発 #生成AI #めんどい駆動開発</div>
    <div class="footer-info">Powered by Gemini API &times; GitHub Actions &#x2502; 毎朝 7:00 自動更新</div>
  </footer>
</div>

<script>
const categories = [{"name":"生成AI・LLM","icon":"robot","articles":[{"title":"Googleがコスト効率に優れた新AIモデル「Gemini 4 Neon」を発表","summary":"Googleは2026年11月19日、AIモデル群「Gemini 4」の中核モデルとして「Gemini 4 Neon」を発表しました。このモデルは100万トークンという広範なコンテキストウィンドウを持ち、入力100万トークンあたり3ドル、出力15ドルと、従来のCarbonモデルと比較して単価が約32%削減されています。高度なコーディング能力やPDF・スプレッドシートを横断した資料分析に強みを持つため、ビジネスや開発の現場での活用が期待されます。開発者にとっては、コストを抑えつつ大規模なデータ処理や複雑なタスクをAIに任せられるため、アプリケーション開発の幅が広がるでしょう。","source":"ビジネス+IT","url":"https://www.google.com/search?q=Google+Gemini+4+Neon+発表+ビジネス%2BIT","impact":"high","tags":["AIモデル","Gemini","コスト効率"]},{"title":"自治体AI zevoが「GPT-6.1 Terra」および「Gemini 4」シリーズの提供を開始","summary":"シフトプラス株式会社は2026年11月19日、自治体向け生成AIシステム「自治体AI zevo」において、OpenAIの「GPT-6.1 Terra」とGoogleの「Gemini 4 Carbon」「Gemini 4 Argon」「Gemini 4 Hydrogen」の提供を開始しました。これらのモデルは追加費用なしで利用でき、GPT-6.1 Terraは文書作成力や画像・図表の読み取り能力が向上し、誤りの出にくさが特徴です。Gemini 4シリーズは、用途に応じて深い推論、高速応答、低コスト運用など最適なモデルを選択できるため、自治体業務の効率化と高度化に貢献します。開発者にとっては、これらの高性能モデルが自治体システムに導入されることで、より高度なAIソリューションの需要が高まる可能性があります。","source":"PR TIMES","url":"https://www.google.com/search?q=自治体AI+zevo+GPT-6.1+Terra+Gemini+4+PR+TIMES","impact":"medium","tags":["自治体AI","GPT-6.1","Gemini 4"]},{"title":"Hugging FaceがLLMネイティブのマークアップ言語「LLMON」を展開","summary":"Hugging Faceは2026年11月12日、LLMネイティブのマークアップ言語「LLMON」に関する公式ドキュメントと技術詳細を発表しました。これはAIモデルの推論基盤、クラウド実装、運用ガバナンスに関わる重要な技術で、特にGranite 4.1での展開が進められています。LLMONの導入により、企業のWebシステム開発や業務自動化において、既存APIとの統合性、レイテンシと推論コストの最適化、アクセス権限の統制がより効率的に設計できるようになります。開発者は、この新しいマークアップ言語を活用することで、LLMを組み込んだアプリケーションの設計と運用をより効率的かつ安全に行えるようになるでしょう。","source":"eguweb(エグウェブ)","url":"https://www.google.com/search?q=Hugging+Face+LLMON+eguweb","impact":"high","tags":["Hugging Face","LLMON","マークアップ言語"]}]},{"name":"個人開発・インディーハッカー","icon":"rocket","articles":[{"title":"インディーゲーム開発者向けカンファレンス「Indie Developer Conference 2026」開催決定","summary":"Indie Developers Conference実行委員会は、インディーゲーム開発者を対象としたカンファレンス「Indie Developer Conference 2026」（IDC2026）を2026年11月28日に東京・銀座の「esports 銀座 studio」で開催すると発表しました。本カンファレンスでは、個人から数人単位の小規模なインディーゲームデベロッパー向けに、ゲーム開発技術やマーケティングノウハウ、リリース後の対応などをテーマにした講演が予定されています。実践的な知識の習得機会となるため、インディーゲーム開発者にとっては貴重な情報交換とスキルアップの場となるでしょう。","source":"Gamer","url":"https://www.google.com/search?q=Indie+Developer+Conference+2026+Gamer","impact":"medium","tags":["インディーゲーム","カンファレンス","開発者支援"]},{"title":"個人情報流出を防ぐリズムゲーム「個人情報流出中」が配信開始","summary":"TERACTORは2026年11月18日、iOS/Android向け耐久リズムゲーム「個人情報流出中」の配信を開始しました。この基本無料ゲームでは、プレイヤーは机の上に置かれた「住所」「氏名」「パスワード」などの個人情報を、リズムに合わせて伸びてくるハッカーたちの手からタップで守ります。個人情報流出という現代的なテーマを、ユニークなリズムゲームとして表現しており、インディー開発ならではの創造性と社会性を示しています。インディー開発者にとっては、社会問題をゲームという形で表現する創造的なアプローチの参考になるでしょう。","source":"Gamer","url":"https://www.google.com/search?q=個人情報流出中+リズムゲーム+TERACTOR+Gamer","impact":"low","tags":["インディーゲーム","リズムゲーム","社会派ゲーム"]},{"title":"2026年版インディーハッカー成功戦略：AIツールと日本市場の税務動向","summary":"2026年の日本のインディーハッカーにとって、AIツールの活用と税務への理解が成功の鍵を握るとされています。特に、Claude Code、Cursor、LovableといったAIツールにより、MVP（実用最小限の製品）の完成までの期間が数日に短縮されています。また、SupabaseのようなBaaSやLemon SqueezyのようなMoR型プロバイダーが開発と運営を効率化するツールとして充実しています。税務面では、2026年9月30日にインボイス制度の2割特例が終了するため、消費税の取り扱いを考慮した事業計画が重要となります。インディー開発者は、これらのAIツールやBaaSを活用して開発を加速し、税務知識を身につけることで、事業の持続可能性を高めることができるでしょう。","source":"note","url":"https://www.google.com/search?q=インディーハッカー+成功戦略+AIツール+税務+note","impact":"high","tags":["インディーハッカー","AIツール","税務"]}]},{"name":"テック全般","icon":"laptop","articles":[{"title":"米SEC、Nvidiaの会計処理を調査か、ハイテク株が急落","summary":"米証券取引委員会（SEC）が、半導体大手Nvidiaの会計処理を調査していると2026年11月20日に報じられました。Nvidiaのジェンスン・フアンCEO退任直後のこの報道は、AIへの巨額投資に対する市場の不安と重なり、米ハイテク株が急落する要因となりました。同日のナスダック総合指数は前日比5.3％安を記録し、週間では10％下落しました。NvidiaはAIチップ市場を牽引する存在であり、この調査は業界全体に影響を及ぼす可能性があります。開発者にとっては、AI関連企業の株価変動が、将来的な投資やエコシステムの安定性に影響を与える可能性があるため、動向を注視する必要があるでしょう。","source":"The HEADLINE","url":"https://www.google.com/search?q=米SEC+Nvidia+会計処理+調査+The+HEADLINE","impact":"medium","tags":["Nvidia","SEC","ハイテク株"]},{"title":"AmazonがAI新興企業Decartを約75億ドルで買収交渉中か","summary":"Amazonが、イスラエルのAI新興企業Decartを約75億ドル規模で買収する交渉を進めていると、2026年11月20日に報じられました。Decartは、異なるAI半導体を効率的に使い分けるためのソフトウェアを開発しており、Amazonが独自半導体TrainiumでNvidiaに対抗する戦略を強化する上で重要な役割を果たすと見られています。この買収が実現すれば、AmazonのAIインフラと競争力に大きな影響を与えることになります。開発者にとっては、AmazonのAIサービスがさらに強化され、より多様なAI半導体を活用したソリューションが提供される可能性があるため、クラウドAIサービスの選択肢や性能に影響が出るかもしれません。","source":"The HEADLINE","url":"https://www.google.com/search?q=Amazon+AI新興企業+Decart+買収+The+HEADLINE","impact":"high","tags":["Amazon","AI買収","クラウドAI"]},{"title":"KDDI、大雪の影響により携帯電話サービスに障害が発生","summary":"KDDIは2026年11月20日午後11時頃から発生した大雪の影響により、福島県耶麻郡北塩原村、耶麻郡猪苗代町、長野県長野市、岐阜県高山市、郡上市の一部エリアでau、UQ mobile、povoなどの通信サービスが利用できない、または利用しづらい状況が続いていると2026年11月22日午前9時00分に発表しました。基地局の停電や伝送路の故障が原因とされています。影響エリアでは、他社回線を一時的に利用できる「JAPANローミング（フルローミング方式）」が順次提供されており、Android端末ではデータローミング設定をオンにすることで利用可能です。開発者にとっては、通信障害がアプリケーションの利用に影響を与える可能性があり、オフライン機能や災害時の代替通信手段の重要性を再認識させる出来事です。","source":"KDDI株式会社","url":"https://www.google.com/search?q=KDDI+大雪+携帯電話サービス+障害+2026年11月22日","impact":"low","tags":["通信障害","KDDI","インフラ"]}]}];
const ARCHIVE_BASE = './archive/';
let activeTab = 0;

const ICONS = { robot: '\u{1F916}', rocket: '\u{1F680}', laptop: '\u{1F4BB}' };

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = categories.map((c, i) =>
    '<button class="tab' + (i === activeTab ? ' active' : '') + '" onclick="switchTab(' + i + ')">' +
    '<span class="tab-icon">' + (ICONS[c.icon] || '') + '</span>' + c.name + '</button>'
  ).join('');
}

function renderArticles(ci) {
  const cat = categories[ci];
  if (!cat || !cat.articles || cat.articles.length === 0) {
    document.getElementById('content').innerHTML = '<div class="empty-state"><p>\u{1F4ED} この日の記事はありません</p></div>';
    return;
  }

  const linkIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>';

  var html = '<div class="tab-content active">';
  for (var i = 0; i < cat.articles.length; i++) {
    var a = cat.articles[i];
    var ic = 'impact-' + (a.impact || 'medium');
    var il = (a.impact || 'medium').toUpperCase();
    if (il === 'MEDIUM') il = 'MID';
    var tags = '';
    if (a.tags) {
      for (var t = 0; t < a.tags.length; t++) {
        tags += '<span class="tag">' + a.tags[t] + '</span>';
      }
    }
    var link = '';
    if (a.url && a.url !== '#') {
      link = '<a href="' + a.url + '" target="_blank" rel="noopener" class="source-link">' + linkIcon + ' \u30BD\u30FC\u30B9\u3092\u8AAD\u3080</a>';
    }
    html += '<div class="article">' +
      '<div class="article-top"><span class="impact-badge ' + ic + '">' + il + '</span><span class="article-source">' + a.source + '</span></div>' +
      '<h3 class="article-title">' + a.title + '</h3>' +
      '<p class="article-summary">' + a.summary + '</p>' +
      '<div class="article-footer"><div class="article-tags">' + tags + '</div>' + link + '</div>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('content').innerHTML = html;
}

function switchTab(i) { activeTab = i; renderTabs(); renderArticles(i); }

function getTodayStr() {
  var d = new Date();
  var jst = new Date(d.getTime() + (9 * 3600000) + (d.getTimezoneOffset() * 60000));
  return jst.toISOString().slice(0, 10);
}

function initDatePicker() { document.getElementById('datePicker').value = getTodayStr(); }

function navigateDate(delta) {
  var p = document.getElementById('datePicker');
  var d = new Date(p.value);
  d.setDate(d.getDate() + delta);
  p.value = d.toISOString().slice(0, 10);
  loadDate(p.value);
}

function loadDate(ds) {
  if (ds === getTodayStr()) { window.location.href = './'; return; }
  window.location.href = ARCHIVE_BASE + ds + '.html';
}

renderTabs();
renderArticles(0);
initDatePicker();
</script>
</body>
</html>
